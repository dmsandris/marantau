# Pasang / perbarui Supabase self-host ramping di VM Biznet (Fase 1.3). Manual dari tab Actions.
# Supabase cloud TIDAK disentuh. Rahasia server dibuat sekali di VM (.env), tidak pernah lewat repo.
# Secret: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
name: VPS deploy
on:
  workflow_dispatch:
    inputs:
      https:
        description: 'Nyalakan Caddy (HTTPS). Matikan bila DNS belum mengarah ke VM.'
        type: boolean
        default: true
concurrency: { group: vps, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Siapkan SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USR: ${{ secrets.VPS_USER }}
        run: |
          for v in KEY KNOWN HOST USR; do [ -n "${!v}" ] || { echo "::error::Secret VPS_* belum lengkap ($v)."; exit 1; }; done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps\n  StrictHostKeyChecking yes\n  ServerAliveInterval 20\n  ControlMaster auto\n  ControlPath ~/.ssh/cm-%%C\n  ControlPersist 15m\n' "$HOST" "$USR" > ~/.ssh/config
          ssh vps 'command -v docker >/dev/null || { echo "Docker belum ada - jalankan workflow VPS setup dulu."; exit 1; }'

      - name: Kirim berkas compose
        run: |
          # -i: catat berkas yang berubah, supaya layanan yang konfigurasinya berubah ikut dimuat ulang.
          rsync -aziL --delete \
            --exclude '.env' --exclude 'volumes/db/data/' --exclude 'ops/node_modules/' \
            deploy/selfhost/ vps:/opt/marantau/selfhost/ | tee /tmp/rsync.log
          reload=""
          grep -q ' Caddyfile$' /tmp/rsync.log && reload="$reload caddy"
          grep -q ' volumes/api/envoy/' /tmp/rsync.log && reload="$reload api-gw"
          echo "RELOAD=$reload" >> "$GITHUB_ENV"
          echo "Layanan yang akan dimuat ulang:${reload:- (tidak ada)}"
          ssh vps 'chmod +x /opt/marantau/selfhost/*.sh; command -v qrencode >/dev/null || sudo apt-get install -y -qq qrencode >/dev/null'

      - name: Pasang backup VM (1.7)
        env:
          RC: ${{ secrets.RCLONE_CONF }}
          AGE_R: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          ssh vps 'install -d -m 755 /opt/marantau/backup /opt/marantau/backup/req && install -d -m 700 ~/.config/marantau'
          r=$(printf '%s' "$AGE_R" | grep -oE 'age1[0-9a-z]{58}' | head -1 || true)
          if [ -n "$r" ]; then printf '%s\n' "$r" | ssh vps 'umask 077; cat > ~/.config/marantau/age-recipient.txt'; echo "Kunci publik age: terpasang";
          else echo "::warning::Secret BACKUP_AGE_RECIPIENT kosong/tidak valid - backup VM belum bisa jalan."; fi
          if [ -n "$RC" ]; then
            if ssh vps 'test -s ~/.config/marantau/rclone.conf'; then echo "rclone.conf: sudah ada (tidak ditimpa)";
            else printf '%s\n' "$RC" | ssh vps 'umask 077; cat > ~/.config/marantau/rclone.conf'; echo "rclone.conf: dipasang"; fi
          else echo "::warning::Secret RCLONE_CONF kosong - backup VM belum bisa upload."; fi
          ssh vps 'set -e
            v=$(rclone version 2>/dev/null | head -1 | grep -oE "[0-9]+\.[0-9]+" | head -1 | cut -d. -f2)
            if [ "${v:-0}" -lt 70 ]; then
              sudo apt-get install -y -qq unzip >/dev/null
              curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
            fi
            echo "$(rclone version | head -1)"
            rclone --config ~/.config/marantau/rclone.conf lsd gdrive:marantau-backup >/dev/null 2>&1 \
              && echo "Google Drive: terhubung" || echo "::warning::rclone belum bisa membuka gdrive:marantau-backup"
            sudo install -m 644 /opt/marantau/selfhost/backup/systemd/* /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now marantau-backup.timer marantau-restore-test.timer marantau-backup-req.path marantau-restore-req.path >/dev/null 2>&1
            systemctl list-timers "marantau-*" --no-pager | head -4'

      - name: Buat .env (sekali saja) & atur profil HTTPS
        env: { HTTPS_ON: '${{ inputs.https }}' }
        run: |
          ssh vps "cd /opt/marantau/selfhost && sh gen-env.sh && \
            if [ '$HTTPS_ON' = 'true' ]; then sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=https/' .env; \
            else sed -i 's/^COMPOSE_PROFILES=.*/COMPOSE_PROFILES=/' .env; fi"

      - name: Tarik image & nyalakan layanan
        run: |
          ssh vps 'cd /opt/marantau/selfhost && docker compose pull -q --ignore-buildable && docker compose build -q && docker compose up -d --remove-orphans'
          # Berkas konfigurasi di-mount sebagai file: tanpa restart, container tetap membaca versi lama.
          if [ -n "$RELOAD" ]; then ssh vps "cd /opt/marantau/selfhost && docker compose restart $RELOAD"; fi

      - name: Tunggu semua sehat
        run: |
          ssh vps 'cd /opt/marantau/selfhost
            for i in $(seq 1 60); do
              bad=$(docker compose ps --format "{{.Name}} {{.Health}}" | awk "\$2!=\"healthy\" && \$2!=\"\"{print}")
              [ -z "$bad" ] && break; sleep 5
            done
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
            [ -z "$bad" ] || { echo "::error::Belum sehat: $bad"; docker compose logs --tail 40; exit 1; }'

      - name: Setelan role & uji asap di VM
        run: ssh vps 'sh /opt/marantau/selfhost/post-deploy.sh'

      - name: Uji dari internet (HTTPS)
        if: ${{ inputs.https }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.marantau.web.id/auth/v1/health || true)
            { [ "$code" = 401 ] || [ "$code" = 200 ]; } && break; sleep 5
          done
          echo "https://api.marantau.web.id/auth/v1/health -> $code (401 tanpa apikey = normal)"
          ops=$(curl -s https://ops.marantau.web.id/healthz || true)
          echo "https://ops.marantau.web.id/healthz -> $ops"
          echo "$ops" | grep -q '"ok":true' || { echo "::error::Panel Ops tidak menjawab (Caddy masih konfigurasi lama?)."; exit 1; }
          { [ "$code" = 401 ] || [ "$code" = 200 ]; } || { echo "::error::HTTPS belum jalan. Cek DNS & log caddy."; ssh vps 'cd /opt/marantau/selfhost && docker compose logs --tail 30 caddy'; exit 1; }

      - name: Backup pertama (bila belum pernah)
        run: |
          ssh vps 'if [ ! -s /opt/marantau/backup/status.json ] && [ -s ~/.config/marantau/age-recipient.txt ]; then
            sudo systemctl start --no-block marantau-backup.service; echo "Backup pertama dimulai - lihat Panel Ops > Backup."; else echo "Lewati."; fi'

      - name: Pemakaian RAM
        run: ssh vps 'free -h; echo; docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"'
