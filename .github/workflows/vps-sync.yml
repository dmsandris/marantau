# Fase 2.1 - salin data Supabase cloud ke VM Biznet tiap malam (gladi resik). Cloud TIDAK diubah.
# Data VM = salinan, ditimpa penuh tiap run. Sesudah sync, VM dalam mode pemeliharaan (hanya GM)
# kecuali dijalankan manual dengan maint = false (untuk uji multi-akun / bot raid).
# Repo PUBLIK: dump hanya lewat SSH ke VM, tidak pernah jadi artifact/cache/commit.
# Secret: SUPABASE_DB_URL, VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
name: VPS sync
on:
  schedule:
    - cron: '37 19 * * *' # 19:37 UTC = 02:37 WIB (sebelum backup cloud 03:17 & backup VM 03:47)
  workflow_dispatch:
    inputs:
      maint:
        description: 'Nyalakan mode pemeliharaan di VM sesudah sync (hanya GM bisa main)'
        type: boolean
        default: true
permissions: { contents: read }
concurrency: { group: vps, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MAINT: ${{ (github.event_name == 'schedule' || inputs.maint) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Cek secret
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}' }
        run: |
          [ -n "$DB" ] || { echo "::error::Secret SUPABASE_DB_URL kosong."; exit 1; }
          echo "TANGGAL=$(TZ=Asia/Jakarta date +%F)" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/sync" >> "$GITHUB_ENV"
      - id: ssh
        uses: ./.github/actions/vps-ssh
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known: ${{ secrets.VPS_KNOWN_HOSTS }}
          host: ${{ secrets.VPS_HOST }}
          user: ${{ secrets.VPS_USER }}
      - name: VM siap?
        if: steps.ssh.outputs.ok != '1'
        run: |
          echo "::error::VM tidak bisa dihubungi - sync dibatalkan."; exit 1
      - name: Pasang pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Dump Supabase cloud
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}' }
        run: bash tools/backup/backup-db.sh
      - name: Restore ke VM + migrasi + cocokkan baris
        env: { ISI: '${{ env.WORK }}/isi' }
        run: bash tools/vps/sync-cloud-to-vps.sh
      - name: Uji asap API VM
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.marantau.web.id/auth/v1/health || true)
          echo "auth/v1/health -> $code (401 tanpa apikey = normal)"
          { [ "$code" = 401 ] || [ "$code" = 200 ]; } || { echo "::error::API VM tidak menjawab."; exit 1; }
      - name: Bersihkan
        if: always()
        run: rm -rf "$WORK"
