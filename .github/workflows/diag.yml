# Diagnosa ringan (manual): menampilkan konfigurasi perjalanan & durasi voyage terbaru (tanpa data pribadi).
name: Diagnosa
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Konfigurasi & durasi perjalanan
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}' }
        run: |
          psql "$DB" -At -F ' = ' -c "select key, value from game.config where key ~* '(travel|speed|daylength|minutes)' order by key" | while IFS= read -r l; do echo "::notice::cfg $l"; done
          psql "$DB" -At -c "select 'aktif berlayar: ' || count(*) || ' | durasi detik min/median/max: ' || coalesce(round(min(extract(epoch from arrive_at-depart_at)))::text,'-') || ' / ' || coalesce(round(percentile_cont(0.5) within group (order by extract(epoch from arrive_at-depart_at)))::text,'-') || ' / ' || coalesce(round(max(extract(epoch from arrive_at-depart_at)))::text,'-') from game.player_location where destination_city_id is not null" | while IFS= read -r l; do echo "::notice::$l"; done
          psql "$DB" -At -c "select 'SpeedMultiplier pemain (sample): min ' || round(min((game.ship_json(player_id)->>'SpeedMultiplier')::numeric),2) || ' max ' || round(max((game.ship_json(player_id)->>'SpeedMultiplier')::numeric),2) || ' | Speed min ' || min((game.ship_json(player_id)->>'Speed')::numeric) || ' max ' || max((game.ship_json(player_id)->>'Speed')::numeric) from game.ships" | while IFS= read -r l; do echo "::notice::$l"; done
          psql "$DB" -At -c "select 'detik terdekat/terjauh kapal standar: ' || min(t) || ' / ' || max(t) from (select game.voy_travel_seconds(game.voy_map_distance(a.city_id, b.city_id), jsonb_build_object('Speed', 50, 'SpeedMultiplier', 1)) t from game.cities a join game.cities b on a.city_id < b.city_id) x" 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done
          psql "$DB" -At -c "select 'semua pemain sunda->ikn detik min/max: ' || min(t) || ' / ' || max(t) from (select game.voy_travel_seconds(game.voy_map_distance('sunda_empire', 'ikn'), game.ship_json(player_id)) t from game.ships) x" 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done
