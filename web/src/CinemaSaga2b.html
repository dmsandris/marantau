<script>
/* =====================================================================
 * Seni sinematik Saga 2 · Quest 8 "Lima Tangan" (MTCine)
 *   lt_dock (Kapal yang Terluka) · lt_launch (Lima Tangan) · lt_furnace (Tungku Dua Puluh Tahun)
 *   lt_benua (Benua) · lt_city (Kota Bercahaya) · lt_voice (Suara yang Dikenal)
 *   lt_down (Seribu Mata Terpejam) · lt_topi (Topi di Kemudi)
 * Prosedural, ramah layar potret & prefers-reduced-motion.
 * Tide v68: gambar ditingkatkan memakai kit MTCine.H (tekstur dipanggang sekali per ukuran layar,
 * kabut fBm, berkas cahaya, pantulan, tokoh berpakaian, kamera pelan). Waktu, judul, dan urutan TIDAK berubah.
 * ===================================================================== */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTUtil) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  var SUB = 'Lima Tangan';
  function fadeIn(ctx, W, H, t, d) { if (t < d) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, d, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function ttl(ctx, W, H, a, main, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);
    ctx.save(); ctx.font = fs.toFixed(1) + 'px ' + C.TITLE_FONT; var w = ctx.measureText(main).width * 1.1; ctx.restore();
    var k = Math.min(1, W * 0.9 / Math.max(1, w));
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.translate(-W / 2, -y); C.title(ctx, W, H, a, main, SUB, y); ctx.restore();
  }
  function ttlY(W, H) { return H * (W < H ? 0.14 : 0.12) + Math.min(W * 0.12, H * 0.15) * 0.45; }
  function glow(ctx, x, y, r, col, a) {
    if (a <= 0.004 || r <= 0.5) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + Math.min(1, a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function stars(r, n) { var a = []; for (var i = 0; i < n; i++) a.push({ x: r(), y: Math.pow(r(), 1.6) * 0.6, s: r() < 0.9 ? 1 : 1.7, tw: 0.5 + r() * 2, ph: r() * 6 }); return a; }
  function drawStars(ctx, W, H, st, t, a) { if (a <= 0.01) return; st.forEach(function (s) { var al = a * (0.35 + 0.65 * Math.abs(Math.sin(t * s.tw + s.ph))); ctx.fillStyle = 'rgba(255,250,235,' + al.toFixed(3) + ')'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }); }
  function pearl(ctx, x, y, s, t, o) {
    if (!window.MTShip) return;
    var opts = MTShip.pearlOpts ? MTShip.pearlOpts(Object.assign({ dir: 1, t: t, furl: 0, lanterns: 1, roll: Math.sin(t * 0.9) * 0.02 }, o || {})) : { dir: 1, t: t, masts: 3, hull: '#0e0d10', sail: '#1a1a1e' };
    MTShip.draw(ctx, x, y, s, opts);
    if (MTShip.foam && !(o && o.dry)) MTShip.foam(ctx, x, y, s, 1, t, 0.2, 0.6);
  }
  function pearlRefl(ctx, x, y, s, t, o, a) {
    if (!window.MTShip || !MTShip.pearlOpts) return;
    ctx.save(); ctx.globalAlpha = a; MTShip.draw(ctx, x, y + 3, s, MTShip.pearlOpts(Object.assign({ dir: 1, t: t, furl: 0, lanterns: 0, reflect: true }, o || {}))); ctx.restore();
  }
  function crow(ctx, x, y, s, flap, eye, dir) {
    dir = dir || 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1); ctx.fillStyle = '#060507';
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.42, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.18, s * 0.34, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 1.22, -s * 0.22); ctx.lineTo(s * 1.75, -s * 0.08); ctx.lineTo(s * 1.22, -s * 0.02); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.1); ctx.lineTo(-s * 0.9, -s * (0.4 + flap * 1.4)); ctx.lineTo(s * 0.5, -s * 0.12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.8, -s * 0.05); ctx.lineTo(-s * 1.5, s * 0.08); ctx.lineTo(-s * 0.8, s * 0.2); ctx.closePath(); ctx.fill();
    if (eye > 0) { ctx.fillStyle = 'rgba(255,40,30,' + Math.min(1, eye) + ')'; ctx.fillRect(s * 1.0, -s * 0.28, Math.max(1, s * 0.16), Math.max(1, s * 0.16)); }
    ctx.restore();
  }

  /* ---------- kit lokal v68 (semua tekstur dipanggang sekali per ukuran) ---------- */
  var SPR = {};
  function sprite(key, fn) { return SPR[key] || (SPR[key] = fn()); }
  function puffs(key, n, o) { return sprite(key, function () { var a = []; for (var i = 0; i < n; i++) a.push(C.puffSprite((o.seed || 300) + i * 13, o.w || 360, o.h || 130, o)); return a; }); }
  function makeCl(seed, n, y0, y1, w0, w1, v) { var r = U.rng(seed), a = []; for (var i = 0; i < n; i++) a.push({ x: r() * 1.6, y: y0 + r() * (y1 - y0), w: w0 + r() * (w1 - w0), v: (v || 0.006) * (0.5 + r()), a: 0.5 + r() * 0.5, k: i }); return a; }
  function drawCl(ctx, list, set, W, H, t, a, yH) {
    if (a <= 0.01) return;
    for (var i = 0; i < list.length; i++) {
      var c = list[i], sp = set[c.k % set.length], w = W * c.w, h = w * sp.height / sp.width, x = ((c.x + t * c.v) % 1.6 + 1.6) % 1.6 - 0.3;
      ctx.globalAlpha = Math.min(1, a * c.a); ctx.drawImage(sp, x * W - w / 2, c.y * (yH || H) - h / 2, w, h);
    }
    ctx.globalAlpha = 1;
  }
  /** Overlay riak laut berperspektif (alpha), resolusi setengah, dipanggang sekali. */
  function seaOv(W, h, seed, k) {
    k = k || 1;
    var w2 = Math.max(2, Math.ceil(W / 2)), h2 = Math.max(2, Math.ceil(h / 2)), cv = C.mkCv(w2, h2), g = cv.getContext('2d'), im = g.createImageData(w2, h2), d = im.data, m = C.fbmMap(seed), i = 0;
    for (var y = 0; y < h2; y++) {
      var v = y / h2, ny = 26 / (v + 0.05);
      for (var x = 0; x < w2; x++, i += 4) {
        var n = C.fbmAt(m, x * 0.09 * (0.35 + v * 1.4) + ny * 0.3, ny), val = (n - 0.5) * 2.2;
        if (val > 0.12) { d[i] = 220; d[i + 1] = 232; d[i + 2] = 245; d[i + 3] = Math.min(255, (val - 0.12) * 120 * k * (0.35 + v * 0.65)); }
        else if (val < -0.1) { d[i] = 0; d[i + 1] = 2; d[i + 2] = 8; d[i + 3] = Math.min(255, (-val - 0.1) * 150 * k * (0.4 + v * 0.6)); }
      }
    }
    g.putImageData(im, 0, 0); return cv;
  }
  function seaDraw(ctx, W, H, hy, c0, c1, ov, t, ovA) {
    var g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
    if (ov) { ctx.globalAlpha = ovA == null ? 1 : ovA; var ox = REDUCE ? 0 : Math.sin(t * 0.35) * 6; ctx.drawImage(ov, ox - 8, hy, W + 16, H - hy); ctx.globalAlpha = 1; }
    ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
    for (var i = 0; i < 7; i++) { var y = hy + (H - hy) * Math.pow((i + 1) / 8, 1.7); ctx.beginPath(); for (var x = 0; x <= W; x += 24) ctx.lineTo(x, y + Math.sin(x * 0.018 + t * 1.1 + i) * (1 + i * 0.3)); ctx.stroke(); }
  }
  /** Punggung pegunungan/pantai bertekstur batu, dipanggang. pts = fungsi(x)->y. */
  function ridgeBake(W, H, q, y0, y1, fy, col0, col1, seed, rim) {
    var hh = Math.ceil(y1 - y0 + 2);
    return C.bake(W, hh, q, function (g) {
      g.translate(0, -y0);
      function sil() { g.beginPath(); g.moveTo(-2, y1 + 2); for (var x = 0; x <= W + 6; x += 3) g.lineTo(x, fy(x)); g.lineTo(W + 2, y1 + 2); g.closePath(); }
      var gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, col0); gr.addColorStop(1, col1); g.fillStyle = gr; sil(); g.fill();
      g.save(); sil(); g.clip();
      g.drawImage(C.rockTex(Math.ceil(W * q), Math.ceil(hh * q), seed, { f: 1.3 / q, sx: 0.7, sy: 1.4, slope: -0.3, strata: 0.2, hi: 0.32, lo: 0.6 }), 0, y0, W, hh);
      g.restore();
      if (rim) { g.strokeStyle = rim; g.lineWidth = 1; g.beginPath(); for (var x2 = 0; x2 <= W; x2 += 3) { if (x2) g.lineTo(x2, fy(x2)); else g.moveTo(x2, fy(x2)); } g.stroke(); }
    });
  }
  function noiseRidge(seed, n) { var r = U.rng(seed), a = []; for (var i = 0; i <= n; i++) a.push(r()); return function (u) { var f = U.clamp(u, 0, 1) * n, i0 = Math.floor(f), tt = f - i0, i1 = Math.min(n, i0 + 1); tt = tt * tt * (3 - 2 * tt); return a[i0] + (a[i1] - a[i0]) * tt; }; }
  function lanternBox(ctx, x, y, s, a, t, ph) {
    ctx.fillStyle = '#1a120c'; ctx.fillRect(x - s * 0.55, y - s * 1.0, s * 1.1, s * 0.22); ctx.fillRect(x - s * 0.5, y + s * 0.85, s * 1.0, s * 0.2);
    ctx.fillStyle = 'rgba(255,' + Math.round(196 + 30 * a) + ',120,' + (0.25 + 0.75 * a).toFixed(3) + ')'; ctx.fillRect(x - s * 0.4, y - s * 0.78, s * 0.8, s * 1.63);
    ctx.fillStyle = '#1a120c'; ctx.fillRect(x - s * 0.06, y - s * 0.78, s * 0.12, s * 1.63);
    ctx.strokeStyle = '#1a120c'; ctx.lineWidth = Math.max(1, s * 0.1); ctx.beginPath(); ctx.moveTo(x, y - s * 1.0); ctx.lineTo(x, y - s * 1.5); ctx.stroke();
    if (a > 0.01) C.glow(ctx, x, y, s * 9, '255,176,90', 0.42 * a * (0.88 + 0.12 * Math.sin(t * 7 + (ph || 0))));
  }
  /** Kilau pantulan di air: garis-garis pendek acak berkelip (bukan tangga). */
  function glint(ctx, x, y0, w, len, col, a, t, n) {
    if (a <= 0.01) return; n = n || 30; ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (var j = 0; j < n; j++) {
      var h1 = Math.sin(j * 12.9898) * 43758.5453, h2 = Math.sin(j * 78.233) * 12543.21, r1 = h1 - Math.floor(h1), r2 = h2 - Math.floor(h2), f = Math.pow((j + 0.5) / n, 1.3);
      var fl = 0.5 + 0.5 * Math.sin(t * (2 + r1 * 3) + j * 1.7); if (fl < 0.15) continue;
      var ww = w * (0.25 + f * 0.9) * (0.4 + r2 * 0.8), xx = x + (r1 - 0.5) * w * (0.4 + f * 1.4) + Math.sin(t * 1.3 + j) * w * 0.08;
      ctx.fillStyle = 'rgba(' + col + ',' + (a * fl * (1 - f * 0.7)).toFixed(3) + ')'; ctx.fillRect(xx - ww / 2, y0 + 1 + f * len, ww, Math.max(1, 0.6 + f * 1.4));
    }
    ctx.restore();
  }
  /** Vignette + butir film dipanggang sekali per ukuran (3 varian butir bergiliran) — jauh lebih murah dari gradien + pola per frame. */
  function vgFast(ctx, W, H, st, k, ga) {
    var q = 1; try { q = ctx.getTransform().a || 1; } catch (e) { }
    var n = ga > 0 && q <= 1.3 ? 3 : 1, key = W + 'x' + H + 'x' + q + 'x' + k + 'x' + ga;
    if (st.vkey !== key) {
      st.vkey = key; st.vv = []; st.vn = 0;
      for (var i = 0; i < n; i++) st.vv.push(C.bake(W, H, q, function (g) {
        C.vignette(g, W, H, k);
        if (n > 1) { var pat = g.createPattern(C.grainTile(), 'repeat'), ox = (i * 53 + 17) % 128, oy = (i * 89 + 41) % 128; g.globalAlpha = ga; g.translate(-ox, -oy); g.fillStyle = pat; g.fillRect(ox, oy, W, H); }
      }));
    }
    ctx.drawImage(st.vv[(st.vn++ >> 1) % st.vv.length], 0, 0, W, H);
  }
  /** Nada warna: 'overlay' (separuh biaya soft-light, hasil serupa pada kadar rendah). */
  function gradeF(ctx, W, H, col, a) { C.grade(ctx, W, H, col, a, 'overlay'); }
  function finish(ctx, W, H, gs, vig, gA) { vgFast(ctx, W, H, gs, vig, gA == null ? 0.7 : gA); }
  function cam(ctx, W, cy, t, depth, o) { var c = C.camLayer(t, depth, o); ctx.save(); C.camAt(ctx, W / 2, cy, c.k, c.dx, c.dy); }

  /* ======================= KAPAL YANG TERLUKA ======================= */
  function sceneDock() {
    var r = U.rng(8101), drips = [], mem = C.memo(), gs = {}, mo = C.makeMotes(46, 811);
    for (var i = 0; i < 28; i++) drips.push({ x: r(), d: r() * 2, v: 0.6 + r() * 0.5 });
    function lay(ctx, W, H) {
      var q = C.bakeQ(ctx, W, H), port = W < H, gy = H * (port ? 0.72 : 0.76), L = { gy: gy, port: port };
      L.ax = W / 2; L.aw = W * (port ? 0.8 : 0.62); L.ah = H * (port ? 0.42 : 0.5); L.ay = gy - H * 0.02;
      // dinding gua batu (bingkai) + bukaan laut malam di belakang
      L.bg = C.bake(W, H, q, function (g) {
        var sg = g.createLinearGradient(0, L.ay - L.ah, 0, L.ay); sg.addColorStop(0, '#0a1222'); sg.addColorStop(0.7, '#1b2840'); sg.addColorStop(1, '#2a3550');
        g.fillStyle = sg; g.fillRect(0, 0, W, H);
        var rs = U.rng(81); for (var k = 0; k < 60; k++) { g.fillStyle = 'rgba(220,230,255,' + (0.15 + rs() * 0.4).toFixed(2) + ')'; g.fillRect(L.ax + (rs() - 0.5) * L.aw, L.ay - L.ah + rs() * L.ah * 0.5, 1, 1); }
        var hz = L.ay - L.ah * 0.18; g.fillStyle = '#0d1626'; g.fillRect(0, hz, W, H);
        g.fillStyle = 'rgba(140,160,200,.12)'; for (var w = 0; w < 6; w++) g.fillRect(L.ax - L.aw * 0.4, hz + 2 + w * w * 1.5, L.aw * 0.8, 1);
        function rock() { g.beginPath(); g.rect(0, 0, W, H); g.moveTo(L.ax - L.aw / 2, L.ay); g.ellipse(L.ax, L.ay, L.aw / 2, L.ah, 0, Math.PI, Math.PI * 2); g.closePath(); }
        var rg = g.createRadialGradient(W / 2, gy - H * 0.3, 10, W / 2, gy - H * 0.3, Math.max(W, H) * 0.75); rg.addColorStop(0, '#3a2c20'); rg.addColorStop(0.6, '#1c150f'); rg.addColorStop(1, '#070504');
        g.fillStyle = rg; rock(); g.fill('evenodd');
        g.save(); rock(); g.clip('evenodd');
        g.drawImage(C.rockTex(Math.ceil(W * q), Math.ceil(H * q), 141, { f: 1.2 / q, sx: 0.9, sy: 1.2, slope: 0.2, strata: 0.22, hi: 0.18, lo: 0.75, tint: [255, 196, 140] }), 0, 0, W, H);
        g.restore();
        g.strokeStyle = 'rgba(255,190,120,.25)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(L.ax, L.ay, L.aw / 2, L.ah, 0, Math.PI, 0); g.stroke();
        // stalaktit di tepi mulut
        var rs2 = U.rng(83); g.fillStyle = '#0e0a07';
        for (var s2 = 0; s2 < 18; s2++) { var an = Math.PI + (s2 + 0.5) / 18 * Math.PI, sx = L.ax + Math.cos(an) * L.aw / 2, sy = L.ay + Math.sin(an) * L.ah, sl = H * (0.02 + rs2() * 0.06), sw = W * 0.008; g.beginPath(); g.moveTo(sx - sw, sy - 2); g.lineTo(sx, sy + sl); g.lineTo(sx + sw, sy - 2); g.closePath(); g.fill(); }
        // tiang lentera (kayu)
        var wt = C.woodTex(Math.ceil(W * 0.03 * q), Math.ceil(H * 0.5 * q), { base: [96, 64, 40], dark: [30, 20, 12], plank: 9 * q, vertical: true, seed: 615 });
        [0.2, 0.8].forEach(function (lx) { var px = W * lx, py = gy - H * 0.36; g.drawImage(wt, px - W * 0.008, py, W * 0.016, gy - py); g.fillStyle = '#20160e'; g.fillRect(px - W * 0.008, py, W * 0.04 * (lx < 0.5 ? 1 : -1) + (lx < 0.5 ? 0 : W * 0.016), H * 0.012); });
      });
      // lantai papan basah
      L.floor = C.bake(W, Math.ceil(H - gy + 2), q, function (g) {
        var hh = H - gy + 2, wt = C.woodTex(Math.ceil(W * q), Math.ceil(hh * q), { base: [92, 64, 42], dark: [24, 16, 10], plank: Math.max(8, hh * 0.18) * q, wet: 0.8, seed: 622 });
        g.drawImage(wt, 0, 0, W, hh);
        var sh = g.createLinearGradient(0, 0, 0, hh); sh.addColorStop(0, 'rgba(0,0,0,.25)'); sh.addColorStop(1, 'rgba(0,0,0,.72)'); g.fillStyle = sh; g.fillRect(0, 0, W, hh);
        g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, W, 2);
      });
      // balok ganjal
      L.blocks = C.woodTex(Math.ceil(W * 0.06 * q), Math.ceil(H * 0.05 * q), { base: [110, 74, 44], dark: [36, 24, 14], plank: 6 * q, seed: 640 });
      return L;
    }
    function draw(ctx, W, H, t) {
      var L = mem(W, H, function () { return lay(ctx, W, H); }), gy = L.gy, lam = sm(0.5, 2, t), fl = function (i) { return lam * (0.85 + 0.15 * Math.sin(t * 6 + i)); };
      cam(ctx, W, gy, t, 0.35, { dur: 9, push: 0.08 });
      ctx.drawImage(L.bg, 0, 0, W, H);
      [0.2, 0.8].forEach(function (lx, i) { C.glow(ctx, W * lx + (i ? -1 : 1) * W * 0.02, gy - H * 0.32, H * 0.42, '255,160,80', 0.32 * fl(i)); });
      ctx.restore();
      cam(ctx, W, gy, t, 0.6, { dur: 9, push: 0.08 });
      // kabut di mulut gua
      var fset = puffs('dockfog', 2, { seed: 820, w: 300, h: 90, sx: 0.6, sy: 1, th: 0.26, soft: 0.34, a: 0.45, dark: [60, 70, 96], lite: [130, 140, 170] });
      for (var f = 0; f < 3; f++) { var fx = ((f * 0.37 + t * 0.012) % 1.2) - 0.1; ctx.globalAlpha = 0.55; ctx.drawImage(fset[f % 2], L.ax - L.aw * 0.55 + fx * L.aw, L.ay - L.ah * 0.32, L.aw * 0.6, L.ah * 0.3); }
      ctx.globalAlpha = 1;
      // balok & kapal miring
      var s = L.port ? W * 0.0018 : Math.min(W * 0.0012, H * 0.0019), px = W * 0.52, py = gy - H * 0.05;
      for (var b = 0; b < 4; b++) ctx.drawImage(L.blocks, W * (0.3 + b * 0.12), gy - H * 0.045, W * 0.05, H * 0.045);
      ctx.save(); ctx.translate(px, py); ctx.rotate(-0.12); pearl(ctx, 0, 0, s, 0, { furl: 1, dry: true, lanterns: 0 }); ctx.restore();
      // tetes air berkilau lentera
      ctx.fillStyle = 'rgba(200,215,235,.6)';
      drips.forEach(function (d) { var y = ((t * d.v + d.d) % 2) / 2; ctx.fillRect(px + (d.x - 0.5) * W * 0.4, py + y * (gy - py + H * 0.05), 1.3, 4); });
      ctx.restore();
      cam(ctx, W, gy, t, 1, { dur: 9, push: 0.08 });
      ctx.drawImage(L.floor, 0, gy - 1, W, H - gy + 3);
      // pantulan lentera di papan basah
      [0.2, 0.8].forEach(function (lx, i) { glint(ctx, W * lx, gy, W * 0.05, (H - gy) * 0.8, '255,170,90', 0.28 * fl(i), t * 0.4, 7); });
      [0.2, 0.8].forEach(function (lx, i) { lanternBox(ctx, W * lx + (i ? -1 : 1) * W * 0.03, gy - H * 0.3, Math.max(3, H * 0.014), fl(i), t, i); });
      // tukang dok berpakaian, satu memegang lentera
      var fh = H * (L.port ? 0.1 : 0.12);
      C.figure(ctx, W * 0.17, gy + 1, fh, { dress: 'coat', hat: 'cap', pose: 'hold', prop: 'lantern', dir: 1, t: t, col: '#0a0706', rim: '255,170,90', rimSide: 1, rimA: 0.55 * lam });
      C.figure(ctx, W * 0.86, gy + 1, fh * 0.95, { dress: 'shirt', hat: 'wide', pose: 'arms', dir: -1, t: t, col: '#0a0706', rim: '255,170,90', rimSide: -1, rimA: 0.5 * lam });
      ctx.restore();
      C.motes(ctx, mo, W * 0.1, gy - H * 0.45, W * 0.8, H * 0.42, t, '255,200,140', 0.28 * lam);
      gradeF(ctx, W, H, '255,150,70', 0.12);
      finish(ctx, W, H, gs, 0.6);
      ttl(ctx, W, H, sm(1.5, 2.6, t) * (1 - sm(6, 7, t)), 'KAPAL YANG TERLUKA', ttlY(W, H));
      fadeIn(ctx, W, H, t, 1.2);
    }
    return { draw: draw, intro: 9 };
  }

  /* ======================= LIMA TANGAN (peluncuran) ======================= */
  function sceneLaunch() {
