<script>
/* =====================================================================
 * Saga 2 · QUEST 6 "BUNGA YANG TAK PERNAH LAYU" (klien)
 * Pak Tua Karto memanggil (Joungjava) -> Javasche Bank: coco epan meminjam emas (ditahan 10 hari,
 * kembali 2x) -> Peti Bantuan ke Kamp Pemulung IKN -> Mata Syahbandar (kapal penimbun) ->
 * petunjuk yang ditanam (monokel, nina bobo, foto, pipa jatuh) -> seikat melati, peta meluas ->
 * Gading Island: Kedai Stumpy (felyx), makam Miss Nansy, Buku Pancing Legenda, Ikan Kerapu Fajar
 * (fajar) -> Sandi Pelikan (mural dua nakhoda) -> hari kesepuluh: pelunasan, Adu Gasing, reveal ->
 * surat untuk Marlya -> Dua Lampu -> Stumpy buka lagi -> gagak mesin hitam (kait Quest 7).
 * Server: 0024_cocoepan.sql (api_cocoepan). Mini-game: Saga2Games (gasing), BarsatiGames (syahbandar).
 * Seni: sinematik MTCine cb_map, cb_mural, cb_lamps (didaftarkan di bawah); scene kota 'gading_island'
 * di SceneEngine.html.

 * Gading Island ditulis dengan hormat: komunitas yang hidup, klenteng sakral (tidak bisa diklik).
 * ===================================================================== */
var CB = (function () {
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }

  /* ---------- tokoh ---------- */
  function apOf(seed, role, fem, over) { var a = MTFace.npc(seed, role, fem); for (var k in (over || {})) a[k] = over[k]; return a; }
  var NN = null;
  function N() {
    if (NN) return NN;
    var coco = null, mar = null;
    try { if (typeof cocoEpan_ === 'function') coco = cocoEpan_(); } catch (e) { coco = null; }
    if (!coco) coco = { name: 'coco epan', ap: apOf('joungjava|bankir', 'bankir', 0, { head: 'bowler', eye: 'monocle', item: 'pipe', age: 0.86 }) };
    try { mar = window.KP && KP.N ? KP.N().marlya : null; } catch (e) { mar = null; }
    var bare = {}; for (var k in coco.ap) bare[k] = coco.ap[k]; bare.eye = 'none'; bare.item = 'none';
    NN = {
      coco: { name: coco.name || 'coco epan', title: 'Bankir Javasche Bank', ap: coco.ap },
      cocoBare: { name: coco.name || 'coco epan', title: 'Pewaris Sang Pembuka Jalur', ap: bare },
      karto: { name: 'Pak Tua Karto', title: 'Peminum Kopi Pahit', ap: { fem: 0, skin: 3, hair: 4, hairStyle: 5, facial: 2, head: 'arch', eyes: 0, seed: 1717, role: 'lapau', age: 0.95 } },
      felyx: { name: 'felyx', title: 'Penjaga Kedai Stumpy', ap: apOf('felyx-stumpy-gading', 'lapau', 0, { age: 0.32, head: 'none', item: 'none' }) },
      anak: { name: 'Anak Kamp Pemulung', title: 'Di bawah sayap Garuda', ap: apOf('anak-kamp-ikn', 'lapau', 1, { age: 0.08, head: 'none' }) },
      syah: { name: 'Syahbandar Joungjava', title: 'Menara Syahbandar', ap: apOf('joungjava|syahbandar', 'syahbandar', 0) },
      marlya: mar || { name: 'Marlya', title: 'Ratu Moramora', ap: apOf('marlya-moramora', 'pustakawan', 1) }
    };
    return NN;
  }
  function face(n) { return n.svg || MTFace.svg(n.ap, { bgColors: ['#7a4a2a', '#2a160c'], fat: n.fat, clown: n.clown, medals: n.medals }); }
  // NPC kota Gading Island - nama wajar, tidak dibuat-buat
  var GADING_NPC = {
    syahbandar: ['Pak Lim Kok Ho', 'Ketua Balai Kongsi', 0], saudagar: ['Ibu Mei Lan', 'Saudagar Pasar Lampion', 1],
    pustakawan: ['Sinshe Tan', 'Peracik Toko Obat', 0], bankir: ['Koh Hendrik', 'Bankir Bank Giok', 0],
    lapau: ['Cik Lili', 'Pemilik Rumah Mahjong', 1], tukang: ['Pak Liong', 'Tukang Perahu Dermaga Lampion', 0],
    gudang: ['Kobonn', 'Penjaga Gudang Pelabuhan', 0]
  };
  var gnCache = {};
  function gadingNpc(role) {
    var d = GADING_NPC[role]; if (!d) return null;
    return gnCache[role] || (gnCache[role] = { name: d[0], title: d[1], ap: apOf('gading_island|' + role, role, d[2]) });
  }

  /* ---------- pembantu ---------- */
  function st() { return (state && state.cocoepan) || null; }
  function step() { var s = st(); return s ? (s.step || 0) : -1; }
  function done() { var s = st(); return !!(s && (s.done || s.step >= 11)); }
  function cid() { return state && state.city ? state.city.CityId : ''; }
  function docked() { return !(state && state.voyage && state.voyage.inTransit); }
  function uname() { return (state && (state.username || (state.player && state.player.characterName))) || 'x'; }
  function inCombat() { return typeof combatSceneOpen !== 'undefined' && combatSceneOpen; }
  var gameOpen = false;
  function busyUi() { return gameOpen || inCombat() || !!document.querySelector('.qt-cine, .bx-crd, .bx-credits, .mtg.on'); }
  function seenKey(k) { return 'cb:' + uname() + ':' + k; }
  function seen(k) { try { return localStorage.getItem(seenKey(k)) === '1'; } catch (e) { return false; } }
  function markSeen(k) { try { localStorage.setItem(seenKey(k), '1'); } catch (e) { } }
  function bankBal() { var s = st(); return state && state.bank && state.bank.bankBalance != null ? state.bank.bankBalance : (s ? s.bankBalance || 0 : 0); }
  function fmt(n) { return typeof formatGold === 'function' ? formatGold(n) : String(n); }
  function dur(ms) {
    var m = Math.max(1, Math.round((ms || 0) / 60000)), h = Math.floor(m / 60);
    return h >= 1 ? h + ' jam' + (m % 60 ? ' ' + (m % 60) + ' menit' : '') : m + ' menit';
  }
  function melati(cls) {
    return '<span class="cb-ico ' + (cls || '') + '"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#fffaf0" stroke="#8f6522" stroke-width="1">' +
      [0, 72, 144, 216, 288].map(function (a) { return '<ellipse cx="12" cy="6.6" rx="3" ry="5" transform="rotate(' + a + ' 12 12)"/>'; }).join('') +
      '</g><circle cx="12" cy="12" r="2.2" fill="#e8c35a" stroke="#8f6522" stroke-width=".8"/></svg></span>';
  }
  function speech(n, text, extra, title) {
    return '<div class="qg-card"><div class="qg-face">' + face(n) + '</div><div class="qg-body"><div class="qg-name">' + esc_(n.name) + ' <span>&middot; ' + esc_(title || n.title || '') + '</span></div>' +
      '<div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function narr(kicker, text, extra, icon, cls) {
    return '<div class="cb-narr ' + (cls || '') + '"><div class="cn-k">' + (icon === 'melati' ? melati() : ic(icon || 'scroll')) + esc_(kicker || '') + '</div>' + text + (extra || '') + '</div>';
  }
  function actions(btns) { return '<div class="qg-actions">' + btns + '</div>'; }
  function dots(i, n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="' + (k === i ? 'on' : '') + '"></i>'; return '<div class="qt-dots">' + h + '</div>'; }
  function next(t) { return '<div class="qg-next">' + ic('scroll') + ' ' + (t || 'Catatan baru di jurnalmu.') + '</div>'; }
  function insert(html, opts) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    if (c.querySelector('.cb-wrap')) return null;
    var anchor = opts && opts.top ? c.querySelector('.ph') : (c.querySelector('.kp-wrap') || c.querySelector('.bx-wrap') || c.querySelector('.qt-wrap') || c.querySelector('.ww-wrap') || c.querySelector('.qg-wrap') || c.querySelector('.npc') || c.querySelector('.ph'));
    var wrap = document.createElement('div'); wrap.className = 'cb-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function applyUnlocks(r) {
    if (!r || !state) return;
    if (r.unlocks) state.unlocks = r.unlocks;
    if (r.cities && r.cities.length) {
      try { if (typeof setCachedCities_ === 'function') setCachedCities_(r.citiesVersion, r.cities); } catch (e) { }
      try { state.cities = typeof visibleCities_ === 'function' ? visibleCities_(r.cities, state) : r.cities; } catch (e) { }
      if (r.citiesVersion) state.citiesVersion = r.citiesVersion;
    }
    if (typeof invalidatePanelCache_ === 'function') invalidatePanelCache_();
  }
  function call(action, arg, ok, btn, fail) {
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      r = r || {};
      if (r.cocoepan !== undefined && state) { state.cocoepan = r.cocoepan; prevStep = r.cocoepan ? (r.cocoepan.step || 0) : null; }
      if (r.bank && typeof patchBank_ === 'function') { try { patchBank_(r.bank); } catch (e) { } }
      if (r.newGold != null && typeof patchGold_ === 'function') { patchGold_(r.newGold); if (typeof renderSidebar === 'function') try { renderSidebar(); } catch (e) { } }
      applyUnlocks(r);
      try { ok(r); } catch (e) { console.warn('[CB]', action, e); }
    }).withFailureHandler(function (e) {
      if (btn) btn.disabled = false;
      showToast((e && e.message) || String(e), 'error');
      if (fail) fail(e);
    }).api_cocoepan(action, arg || '');
  }
  function pages(w, n, list, lastBtns, bind, title) {
    var i = 0;
    function show() {
      var last = i === list.length - 1, pg = list[i], who = (pg && pg.n) || n, txt = (pg && pg.t) || pg;
      var nav = actions(last ? lastBtns : '<button class="btn btn-gold" data-cb="next">Lanjut</button>') + dots(i, list.length);
      w.innerHTML = pg && pg.narr ? narr(pg.narr, txt, nav, pg.icon, pg.cls) : speech(who, txt, nav, pg && pg.title ? pg.title : (who === n ? title : null));
      au_('page');
      if (!last) on(w, '[data-cb=next]', function () { i++; show(); }); else if (bind) bind(w);
    }
    show();
  }
  function showModal(html, panel) {
    currentPanel = null; setModal_(html);
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-wide'); box.classList.add('size-mid'); box.scrollTop = 0; }
    document.getElementById('modalOverlay').classList.add('open');
    if (panel) currentPanel = panel;
  }
  function modalWrap(icon, title, sub) { showModal(panelHeader_(icon, title, sub)); return insert('<div></div>', { top: true }); }

  /* ---------- sinematik layar penuh (bisa dilewati). onSlide(i) dipanggil tiap slide ---------- */
  function cine(kind, slides, cb, onSlide) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    var ov = document.createElement('div'); ov.className = 'qt-cine cb-cine';
    ov.innerHTML = '<canvas></canvas><button class="cb-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button><div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind) || stop; } catch (e) { console.warn('[CB] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), btn = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.cb-skip');
    function show() {
      txt.classList.remove('in'); void txt.offsetWidth;
      txt.innerHTML = slides[i]; txt.classList.add('in');
      btn.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai';
      if (onSlide) try { onSlide(i); } catch (e) { }
    }
    function finish() {
      if (finished) return; finished = true;
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);
      if (cb) setTimeout(cb, 60);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } }
    document.addEventListener('keydown', onKey);
    btn.onclick = function () { au_('page'); if (++i < slides.length) show(); else finish(); };
    skip.onclick = function () { au_('page'); finish(); };
    setTimeout(function () { skip.classList.add('on'); }, 1500);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    setTimeout(function () { if (!finished) show(); }, 900);
  }

  /* ---------- mini-game: gasing (MTGames2), syahbandar (MTGames) + cadangan ---------- */
  function game(kind, opts, cb) {
    function fin(res) { gameOpen = false; try { cb(res || { kind: kind, cancelled: true }); } catch (e) { console.warn('[CB] game cb', e); } }
    var lib = kind === 'syahbandar' ? window.MTGames : window.MTGames2;
    if (lib && typeof lib.open === 'function') {
      gameOpen = true;

    }
    showModal(panelHeader_('compass', esc_((opts && opts.title) || 'Mini-game'), esc_((opts && opts.subtitle) || '')) +
      '<div class="cb-wrap"><div class="cb-narr cb-fallback"><p>' + ((opts && opts.intro) || '') + '</p><p class="muted small">Mini-game belum termuat di perangkat ini. Kau tetap bisa melanjutkan cerita.</p>' +
      actions('<button class="btn btn-gold" data-cb="fb-go">Lanjutkan cerita</button><button class="btn btn-ghost-ink" data-cb="fb-no">Nanti dulu</button>') + '</div></div>');
    var c = document.getElementById('modalContent');
    on(c, '[data-cb=fb-go]', function () { closeModal(); fin({ kind: kind, win: true }); });
    on(c, '[data-cb=fb-no]', function () { closeModal(); fin({ kind: kind, cancelled: true }); });
  }

  /* ---------- catatan samar (jurnal) ---------- */
  function dawnNow() {
    var f = typeof dayFrac_ === 'function' ? dayFrac_() : 0.3;
    return f >= 0.93 || f < 0.12;
  }
  function dawnInMs() {

  /* ---------- Sandi Pelikan: tebak aksara pelikan panel demi panel ---------- */
  // Aksara pelikan: tiap huruf = kombinasi unik 5 goresan dasar (prosedural, tanpa font)
  var STROKES = ['M5 7 Q12 2 19 7', 'M12 5 V19', 'M6 18 L18 8', 'M17 16.5 a1.6 1.6 0 1 0 0.01 0', 'M5 13 H14 Q18 13 18 17'];
  function glyph(ch) {
    var i = ch.charCodeAt(0) - 64; if (i < 1 || i > 26) return '';
    var d = '';
    for (var b = 0; b < 5; b++) if ((i >> b) & 1) d += '<path d="' + STROKES[b] + '"/>';
    if (i === 1 || i === 2 || i === 4 || i === 8 || i === 16) d += '<path d="M8 21 h8"/>';
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5a2a14" stroke-width="2" stroke-linecap="round">' + d + '</svg>';
  }
  var PANELS = [
    { t: 'DUA TANGAN SATU KAPAL', read: '<b>Dua pendiri Moramora</b> berdiri bersama di satu kapal: <b>Sang Pembuka Jalur</b> memegang peta dan timbangan &mdash; ia membangun jalur dagang. <b>Sang Penjaga Suara</b> memegang menara dan burung pembawa surat &mdash; ia membangun jalur suara. Moramora tumbuh dari dua tangan itu.' },
    { t: 'JALUR DAGANG MENARA SUARA', read: 'Moramora makmur. Jalur dagang dan <b>menara-menara suara</b> menghubungkan seluruh laut timur. Burung-burung pembawa surat terbang dari pulau ke pulau.' },
    { t: 'KUMIS HITAM DATANG', read: 'Datang armada berlayar hitam. Bajak laut terkuat di masanya: <b>Marshell MPA, "Kumis Hitam"</b>. Ia tak bisa mengalahkan kedua pendiri sekaligus.' },
    { t: 'MAHKOTA DITUKAR RANTAI', read: 'Maka Kumis Hitam <b>memecah mereka</b>. Ia menawarkan mahkota kepada keturunan Pembuka Jalur &mdash; dengan satu syarat: keluarga Penjaga Suara diserahkan.' },
    { t: 'SATU WAJAH BERPALING', scratch: 2, read: 'Panel terakhir <b>sengaja dikerok</b>. Yang tersisa hanya sebuah mahkota, sebuah rantai, dan satu sosok yang memalingkan wajah. Siapa memilih apa, tak tertulis lagi.' }
  ];
  function cipherGame() {
    var known = { A: 1, N: 1, U: 1 }, pi = 0, sel = null;
    var w = modalWrap('eye', 'Sandi Pelikan', 'Mural di gudang belakang Stumpy');
    if (!w) return;
    function scratchIdx(p) { // huruf terakhir pada kata terakhir dikerok (tak bisa dibaca)
      var out = {}; if (!p.scratch) return out;
      var idx = p.t.length - 1; for (var c = 0; c < p.scratch; c++) { while (idx >= 0 && p.t[idx] === ' ') idx--; out[idx] = 1; idx--; }
      return out;
    }
    function solved(p) { var sc = scratchIdx(p); for (var i = 0; i < p.t.length; i++) { var c = p.t[i]; if (c !== ' ' && !sc[i] && !known[c]) return false; } return true; }
    function render() {
      var p = PANELS[pi], sc = scratchIdx(p), words = p.t.split(' '), pos = 0;
      var line = words.map(function (wd) {
        var cells = wd.split('').map(function (c) {
          var idx = pos++, isSc = !!sc[idx], kn = !!known[c] && !isSc;
          return '<button class="cb-cell' + (isSc ? ' scratch' : kn ? ' known' : '') + (sel === c && !kn ? ' sel' : '') + '" data-c="' + c + '" ' + (isSc || kn ? 'tabindex="-1" aria-disabled="true"' : '') + ' aria-label="Aksara ' + (kn ? c : 'belum terbaca') + '">' +
            glyph(c) + '<span class="l">' + (kn ? c : (isSc ? '' : '?')) + '</span></button>';
        }).join('');
        pos++; return '<span class="cb-word">' + cells + '</span>';
      }).join('');
      var need = []; for (var ni = 0; ni < p.t.length; ni++) { var nc = p.t[ni]; if (nc !== ' ' && !sc[ni] && !known[nc] && need.indexOf(nc) < 0) need.push(nc); }
      var pool = need.slice(), deco = 'BEGHKLOPRSTW'.split('').filter(function (c) { return pool.indexOf(c) < 0 && !known[c]; });
      for (var d = 0; d < 3 && deco.length; d++) pool.push(deco.splice(Math.floor(Math.random() * deco.length), 1)[0]);
      pool.sort();
      w.innerHTML = '<div class="cb-cipher"><canvas class="cb-fresco" id="cbFresco"></canvas>' +
        '<div class="cb-legend">Panel ' + (pi + 1) + ' dari ' + PANELS.length + ' &middot; ketuk aksara yang belum terbaca, lalu pilih hurufnya. Huruf yang benar terisi di semua tempat.</div>' +
        '<div class="cb-line" id="cbLine">' + line + '</div>' +
        (need.length ? '<div class="cb-keys">' + pool.map(function (c) { return '<button class="btn btn-sm" data-k="' + c + '"' + (sel ? '' : ' disabled') + '>' + c + '</button>'; }).join('') + '</div>' : '') + '</div>';
      try { window.CB_MURAL = { focus: pi, reveal: false, still: true }; MTCine.play(document.getElementById('cbFresco'), 'cb_mural'); } catch (e) { }
      w.querySelectorAll('.cb-cell:not(.known):not(.scratch)').forEach(function (b) { b.onclick = function () { sel = b.getAttribute('data-c'); au_('page'); render(); }; });
      w.querySelectorAll('[data-k]').forEach(function (b) {
        b.onclick = function () {
          if (!sel) return;
          var k2 = b.getAttribute('data-k');
          if (k2 === sel) {
            known[sel] = 1; sel = null; au_('coin');
            if (solved(PANELS[pi])) { readPanel(); return; }
            render();

      ctx.fillStyle = '#1e1a20'; for (var c = 0; c < 6; c++) ctx.fillRect(bx - bw * 0.45 + c * bw * 0.18, hy - bh * 0.85, bw * 0.04, bh * 0.85);
      ctx.fillStyle = 'rgba(255,190,110,.35)'; ctx.fillRect(bx - bw * 0.1, hy - bh * 0.7, bw * 0.2, bh * 0.5);
      // sosok bertopi bulat di beranda
      var fx = bx + bw * 0.22, fy = hy - bh * 0.08, fh = bh * 0.55;
      ctx.fillStyle = '#060508';
      ctx.beginPath(); ctx.moveTo(fx - fh * 0.16, fy); ctx.lineTo(fx - fh * 0.12, fy - fh * 0.62); ctx.lineTo(fx + fh * 0.12, fy - fh * 0.62); ctx.lineTo(fx + fh * 0.16, fy); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(fx, fy - fh * 0.74, fh * 0.11, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.ellipse(fx, fy - fh * 0.84, fh * 0.17, fh * 0.035, 0, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.arc(fx, fy - fh * 0.86, fh * 0.1, Math.PI, 0); ctx.fill();
      var mono = 1 - sm(7, 8.2, t), my = fy - fh * 0.74 + sm(7, 8.2, t) * fh * 0.35;
      if (mono > 0.02 || t < 8.5) { ctx.strokeStyle = 'rgba(232,195,90,' + Math.max(0.15, mono).toFixed(3) + ')'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(fx - fh * 0.04, my, fh * 0.035, 0, 6.3); ctx.stroke(); }
      // titik cahaya jauh di cakrawala timur (dilihat dari bank)
      glow(ctx, W * 0.92, hy - 3, 10, '255,210,130', 0.7 * lit);
      // gagak mesin hitam di atap bank, lalu terbang
      var ca = sm(8.2, 8.9, t), fly = sm(10, 14.5, t);
      if (ca > 0) {
        var cs = bh * 0.16, gx = bx + fly * W * 0.75, gy = hy - bh - bh * 0.42 - cs * 0.2 - fly * hy * 0.45, flap = REDUCE ? 0 : Math.sin(t * 11) * (fly > 0 ? 1 : 0.12);
        ctx.globalAlpha = ca; ctx.fillStyle = '#050405'; ctx.strokeStyle = 'rgba(150,160,180,.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(gx, gy, cs * 0.5, cs * 0.24, -0.1, 0, 6.3); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(gx + cs * 0.5, gy - cs * 0.12, cs * 0.16, 0, 6.3); ctx.fill();
        ctx.beginPath(); ctx.moveTo(gx + cs * 0.64, gy - cs * 0.14); ctx.lineTo(gx + cs * 0.9, gy - cs * 0.06); ctx.lineTo(gx + cs * 0.64, gy - cs * 0.04); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(gx - cs * 0.45, gy); ctx.lineTo(gx - cs * 0.85, gy + cs * 0.12); ctx.lineTo(gx - cs * 0.42, gy + cs * 0.12); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(gx - cs * 0.1, gy - cs * 0.1); ctx.lineTo(gx - cs * 0.35, gy - cs * (0.4 + flap * 0.5)); ctx.lineTo(gx + cs * 0.25, gy - cs * 0.08); ctx.closePath(); ctx.fill(); ctx.stroke();
        if (fly <= 0) { ctx.strokeStyle = '#050405'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(gx - cs * 0.05, gy + cs * 0.2); ctx.lineTo(gx - cs * 0.08, gy + cs * 0.42); ctx.moveTo(gx + cs * 0.12, gy + cs * 0.2); ctx.lineTo(gx + cs * 0.14, gy + cs * 0.42); ctx.stroke(); }
        glow(ctx, gx + cs * 0.56, gy - cs * 0.15, cs * 0.25, '255,50,40', 0.8); ctx.fillStyle = 'rgba(255,60,40,1)'; ctx.fillRect(gx + cs * 0.54, gy - cs * 0.17, 2, 2);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      C.vignette(ctx, W, H, 0.6);
      ttl(ctx, W, H, sm(12.5, 13.6, t), 'DUA LAMPU', 'Bunga yang Tak Pernah Layu', H * (port ? 0.16 : 0.14) + Math.min(W * 0.12, H * 0.15) * 0.45);
      fadeIn(ctx, W, H, t, 1.2);
    }
    return { draw: draw, intro: 14 };
  }

  MTCine.register('cb_map', sceneMap);
  MTCine.register('cb_mural', sceneMural);
  MTCine.register('cb_lamps', sceneLamps);
})();
