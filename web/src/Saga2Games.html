<!--

  API: MTGames2.open(kind, opts, cb) -> { close() }   kind = gasing | angin | genderang
       gasing    -> cb({ kind, win, cancelled, rounds:[bool..] })            (best of 3)
       angin     -> cb({ kind, win:true, perfect, cancelled, retries })       (tak bisa kalah)
       genderang -> cb({ kind, win, cancelled, score })                       (score = akurasi 0-100)
  opts: { title, subtitle, opponent:{name,title,npcRole,ap}, intro, variant:'normal'|'duka',
          zones:3|4, drums:3|4, silentDrum, easy, rematch, kicker, winLine, loseLine, retryLine }
  Memakai ulang kelas global .mtg* dari BarsatiGames.html; CSS baru berawalan .mt2-.
  Semua grafis prosedural (canvas), suara WebAudio sendiri. Tanpa aset luar.
-->

      function drawBgDuka(c, g, t) {

        }
      }
      function drawDrum(c, g, i, t) {
        var x = g.xs[i], y = g.dy, rd = g.rd, sil = i === SIL && G.phase !== 'final' && G.phase !== 'over', f = G.flash[i];
        var hy = rd * 0.42, bodyH = rd * 1.25;

        }

      S.loop(function (dt, t, draw) {
