<script>
/* =====================================================================
 * Tide v37 · Pacu Dagang (lomba dagang akhir pekan)
 * Server: supabase/migrations/0033_pacu_dagang.sql (api_pacu, key 'pacu' di getGameState).
 * ===================================================================== */
var PD = (function () {
  var GOL = { 1: 'Jukung', 2: 'Pinisi', 3: 'Galiung' }, board = null, timer = 0;
  function st() { return (state && state.pacu) || null; }
  function fmt(n) { return typeof formatGold === 'function' ? formatGold(Math.round(n || 0)) : String(Math.round(n || 0)); }
  function uname() { return (state && (state.username || (state.player && state.player.characterName))) || 'x'; }
  function seen(k) { try { return localStorage.getItem('pd:' + uname() + ':' + k) === '1'; } catch (e) { return false; } }
  function markSeen(k) { try { localStorage.setItem('pd:' + uname() + ':' + k, '1'); } catch (e) { } }
  function msLeft(key) { var s = st(); if (!s || !s.event || !s.event.ms) return 0; return s.event.ms[key] - (Date.now() - (s._at || Date.now())); }
  function dur(ms) {
    ms = Math.max(0, ms); var d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
    return d ? d + ' hari ' + h + ' jam' : h ? h + ' jam ' + m + ' menit' : m + ' menit';
  }
  function shortDur(ms) { ms = Math.max(0, ms); var h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000); return h >= 24 ? Math.floor(h / 24) + 'h' : h ? h + 'j ' + m + 'm' : m + 'm'; }
  function coco(bg) { return window.HR ? HR.face(7, bg || ['#3a3226', '#14100a']) : ''; }
  function face(ap, name) {
    try { if (ap) return MTFace.svg(ap, { bgColors: ['#3a3226', '#14100a'] }); } catch (e) { }
    return '<svg viewBox="0 0 26 26"><text x="13" y="17.5" text-anchor="middle" font-size="12" fill="#f0cf78" font-family="serif">' + esc_(String(name || '?').replace(/^Kapten\s+/i, '').charAt(0).toUpperCase()) + '</text></svg>';
  }
  function dateWib(sat) { try { var d = new Date(sat + 'T00:00:00'); return d.getDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'][d.getMonth()]; } catch (e) { return sat; } }

  /* ---------- gerbang & HUD ---------- */
  function applyGates() {
    var s = st();
    document.querySelectorAll('.pd-gate').forEach(function (el) {
      el.hidden = !s || (el.classList.contains('pd-live') && !(s.event && (s.event.status === 'open' || s.event.status === 'judging')));
    });
    if (!s || !s.event) return;
    var ev = s.event, hv = document.getElementById('hudPacu'), hl = document.getElementById('hudPacuL'), rp = document.getElementById('resPacu');
    if (hv && hl) {
      if (ev.status === 'open') {
        hl.textContent = ev.boardClosed ? 'Pacu · ditutup' : 'Pacu · ' + GOL[s.me.gol];
        hv.textContent = ev.boardClosed ? fmtShort(s.me.score) + ' · ' + shortDur(msLeft('end')) : (s.me.rank ? '#' + s.me.rank + ' · ' : '') + shortDur(msLeft('end'));
      } else if (ev.status === 'judging') { hl.textContent = 'Pacu · juri'; hv.textContent = shortDur(msLeft('announce')); }

    }
    var mb = document.querySelector('#menuList .btn[data-panel=pacu]'); if (mb) mb.classList.toggle('hr-has', ev.status === 'open' && !s.me.joined);
  }
  function fmtShort(n) { return window.HR ? HR.fmtShort(n) : fmt(n); }
  function adopt(p) { if (!state) return; if (p) p._at = Date.now(); state.pacu = p || null; applyGates(); }

  /* ---------- panel ---------- */
  function bannerHtml(s) {
    var ev = s.event, k, b, p = '';
    var th = ev.themeName ? '<div class="pd-theme">' + ic('star') + 'Komoditas Unggulan: <b>' + esc_(ev.themeName) + '</b> &middot; skor &times;' + String(ev.themeMul).replace('.', ',') + '</div>' : '';
    if (ev.status === 'planned') { k = 'Pacu Dagang ' + dateWib(ev.sat); b = 'Buku besar masih tertutup'; p = 'coco epan membocorkan Komoditas Unggulan <b>Jumat 20:00 WIB</b> (dalam ' + dur(msLeft('reveal')) + '). Pacu dibuka Sabtu 00:00.'; }
    else if (ev.status === 'revealed') { k = 'Bocoran Jumat malam'; b = 'Pacu dibuka dalam ' + dur(msLeft('start')); p = 'Barang yang kau beli sekarang boleh dijual saat Pacu dibuka. Modalnya tercatat saat membeli.'; }
    else if (ev.status === 'open' && !ev.boardClosed) { k = 'Pacu berlangsung'; b = 'Papan Ditutup dalam ' + dur(msLeft('close')); p = 'Setiap penjualan untung ke pasar kota menambah skormu. Berakhir Minggu 23:59 WIB.'; }
    else if (ev.status === 'open') { k = 'Buku besar ditutup'; b = 'Berakhir dalam ' + dur(msLeft('end')); p = 'Skor kapten lain disembunyikan sampai Upacara Senin 08:00. Berdaganglah sebaik mungkin.'; }
    else { k = 'Juri sedang menghitung'; b = 'Pengumuman dalam ' + dur(msLeft('announce')); p = 'Senin 08:00 WIB, coco epan membuka buku besar dan menulis nama juara dengan tinta emas.'; }
    return '<div class="pd-banner"><div class="fc">' + coco() + '</div><div><div class="k">' + k + (s.gold ? '' : '<span class="uji">PEKAN UJI</span>') + '</div><b class="hd">' + b + '</b><p>' + p + '</p>' + th + '</div></div>';
  }
  function meHtml(s) {
    var m = s.me, t = m.targets || [0, 0, 0], max = Math.max(t[2] * 1.15, m.score, 1), live = s.event.status === 'open' || s.event.status === 'judging';
    var marks = ['Perunggu', 'Perak', 'Emas'].map(function (n, i) { return '<span class="mk' + (m.score >= t[i] ? ' hit' : '') + '" style="left:' + (t[i] / max * 100).toFixed(1) + '%">' + n + '<br>' + fmtShort(t[i]) + '</span>'; }).join('');
    var rank = m.rank ? '#' + m.rank + ' dari ' + m.peserta + ' kapten' : (s.event.boardClosed ? 'Peringkat dirahasiakan' : 'Belum ikut');
    return '<div class="pd-me"><div class="top"><span class="sc">' + fmt(m.score) + '<small>skor</small></span><span class="rk">' + ic('ship') + ' Golongan ' + esc_(m.golName) + ' &middot; ' + rank + '</span></div>' +
      '<div class="pd-tiers"><i style="width:' + Math.min(100, Math.max(0, m.score) / max * 100).toFixed(1) + '%"></i>' + marks + '</div>' +
      '<div class="facts"><span class="hr-pill">' + ic('coins') + 'Untung ' + fmt(m.profit) + '</span><span class="hr-pill">' + ic('scales') + (m.sellsWin || 0) + ' jual untung</span>' +
      '<span class="hr-pill">' + ic('map') + (m.cities || []).length + ' pulau</span>' + (m.banned ? '<span class="hr-pill" style="color:#9a3a22">Dicoret juri</span>' : '') + '</div>' +
      (live ? '' : '<span class="muted small">Target Pribadimu untuk Pacu berikutnya (dari rata-rata 3 Pacu terakhirmu).</span>') + '</div>';
  }
  function boardsHtml(s) {
    if (!board || !(s.event.status === 'open' || s.event.status === 'judging')) return '';
    var html = '';
    for (var g = 1; g <= 3; g++) {
      var b = board.gol[g] || {}, mine = s.me.gol === g, rows = '';
      if (board.closed) rows = '<div class="pd-closed"><span class="seal">' + ic('lock') + '</span>' + (b.peserta || 0) + ' kapten berpacu<br>Buku besar ditutup' + (b.me ? '<br>Skormu: <b style="color:#ffe7a3">' + fmt(b.me.score) + '</b>' : '') + '</div>';
      else {
        (b.rows || []).forEach(function (r) { rows += '<div class="pd-row' + (r.me ? ' me' : '') + '"><span class="n">' + r.rank + '</span><span class="fc">' + face(r.ap, r.name) + '</span><span class="nm">' + esc_(r.name) + '</span><span class="v">' + fmtShort(r.score) + '</span></div>'; });
        if (b.me && !(b.rows || []).some(function (r) { return r.me; })) rows += '<div class="pd-row gap">&middot;&middot;&middot;</div><div class="pd-row me"><span class="n">' + b.me.rank + '</span><span class="fc">' + face(b.me.ap, b.me.name) + '</span><span class="nm">' + esc_(b.me.name) + '</span><span class="v">' + fmtShort(b.me.score) + '</span></div>';

      }

    }
    var cats = '';
    if (board.cats) {
      var C = [['mata', 'Mata Saudagar', function (v) { return Math.round(v * 100) + '% margin'; }], ['jelajah', 'Penjelajah Pasar', function (v) { return v + ' pulau'; }], ['lompat', 'Lompatan Terjauh', function (v) { return '&times;' + String(v).replace('.', ',') + ' rekor'; }]];
      cats = '<div class="pd-cats">' + C.map(function (c) {
        var l = board.cats[c[0]] || [];
        return '<div class="pd-cat"><b>' + c[1] + '</b>' + (l.length ? '<ol>' + l.map(function (x) { return '<li>' + esc_(x.name) + ' <span class="muted">' + c[2](x.v) + '</span></li>'; }).join('') + '</ol>' : '<span class="muted">Belum ada.</span>') + '</div>';

  }
  function lastHtml(s) {

    return '<div class="pd-last"><b>Pacu ' + dateWib(L.sat) + ' &middot; ' + esc_(r.themeName || '') + '</b><span>' + j + '</span>' +

  function rulesHtml(s) {
    return '<details class="pd-rules"><summary>Aturan Pacu Dagang</summary><ul>' +
      '<li>Skor = untung dari penjualan ke <b>pasar kota</b> Sabtu 00:00 &ndash; Minggu 23:59 WIB. Jual-beli di Bursa tidak dihitung.</li>' +

      '<li>Barang Komoditas Unggulan dihitung &times;' + String(s.event.themeMul || 1.5).replace('.', ',') + '.</li>' +
      '<li>Kapten bersaing di golongannya: Jukung, Pinisi, Galiung. Golongan dikunci pada penjualan pertamamu di Pacu.</li>' +
      '<li>Juara 1&ndash;3 per golongan (wajib lolos target Perunggu; bila kurang dari 3 yang lolos, hanya juara 1). Juara 1 mendapat <b>Layar Emas</b> sepekan; tiga kali juara 1 = Layar Emas permanen.</li>' +
      '<li>Kategori: Mata Saudagar (margin terbaik), Penjelajah Pasar (pulau terbanyak), Lompatan Terjauh (paling melampaui rekor sendiri).</li>' +
      '<li>Target Pribadi Perunggu/Perak/Emas = 60%/100%/150% rata-rata 3 Pacu terakhirmu (tidak di bawah target dasar golongan): +20/+40/+80 keping.</li>' +
      '<li>Minggu 18:00 Papan Ditutup: skor kapten lain disembunyikan. Senin 00:00&ndash;08:00 juri memeriksa kecurangan.</li>' +
      (s.gold ? '' : '<li><b>Pekan Uji:</b> hadiah berupa keping saja.</li>') + '</ul></details>';
  }
  function render() {
    if (currentPanel !== 'pacu') return;
    var s = st();
    if (!s) { setModal_(panelHeader_('trophy', 'Pacu Dagang', '') + '<div class="empty-state">' + ic('lock') + 'Pacu Dagang belum dibuka.</div>'); return; }
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-mid'); box.classList.add('size-wide'); }
    var sc = box ? box.scrollTop : 0;
    setModal_(panelHeader_('trophy', 'Pacu Dagang', 'Juri: coco epan &middot; Javasche Bank') +
      '<div class="pd-wrap">' + bannerHtml(s) + meHtml(s) + boardsHtml(s) + lastHtml(s) + rulesHtml(s) + '</div>');
    if (box) box.scrollTop = sc;
    var c = document.getElementById('modalContent');
    c.querySelectorAll('[data-pd]').forEach(function (b) {
      b.onclick = function () { var a = b.getAttribute('data-pd'); if (a === 'upacara') upacara(true); else if (a === 'prasasti') prasasti(); };
    });
  }
  function load() {
    google.script.run.withSuccessHandler(function (r) { if (r) { adopt(r.pacu); board = r.board; } render(); })
      .withFailureHandler(function (e) { showToast((e && e.message) || String(e), 'error'); }).api_pacu('papan');
  }
  function prasasti() {
    google.script.run.withSuccessHandler(function (r) {
      var list = (r && r.prasasti) || [];
      var html = panelHeader_('trophy', 'Prasasti Saudagar', 'Dinding batu Javasche Bank') + '<div class="pd-wrap">' +
        (list.length ? list.map(function (p) {
          return '<div class="pd-last"><b>' + dateWib(p.sat) + ' &middot; ' + esc_(p.themeName || '') + ' &middot; ' + (p.peserta || 0) + ' kapten</b><span>' +
            [1, 2, 3].map(function (g) { var w = p.juara && p.juara[g]; return GOL[g] + ': <b>' + (w ? esc_(w.name) : '&mdash;') + '</b>'; }).join(' &middot; ') + '</span>' +
            '<span class="muted small">' + ['mata', 'jelajah', 'lompat'].map(function (k, i) { var x = p[k]; return x ? ['Mata Saudagar', 'Penjelajah', 'Lompatan'][i] + ': ' + esc_(x.name) : ''; }).filter(Boolean).join(' &middot; ') + '</span></div>';
        }).join('') : '<div class="dt-empty">Prasasti masih kosong. Nama pertama akan dipahat Senin depan.</div>') +
        '<div class="qg-actions"><button class="btn btn-ghost-ink" id="pdBack">Kembali</button></div></div>';
      setModal_(html);
      var b = document.getElementById('pdBack'); if (b) b.onclick = function () { render(); };
    }).withFailureHandler(function (e) { showToast((e && e.message) || String(e), 'error'); }).api_pacu('prasasti');
  }

  /* ---------- Bocoran Jumat (papan kapur) ---------- */
  function bocoran() {
    var s = st(); if (!s || !s.event || !s.event.themeName) return;
    markSeen('bocoran:' + s.event.id);
    var ov = document.createElement('div'); ov.className = 'pd-cine';
    ov.innerHTML = '<button class="skip">Tutup</button><div class="pd-chalk"><div class="t1">coco epan &middot; Javasche Bank &middot; Jumat malam</div><div class="t2">' + esc_(s.event.themeName).toUpperCase() + '</div>' +
      '<div class="t3">&ldquo;Akhir pekan ini aku mencari <b>' + esc_(s.event.themeName.toLowerCase()) + '</b>. Untungnya kuhitung &times;' + String(s.event.themeMul).replace('.', ',') + '. Buku besar dibuka Sabtu 00:00. Siapkan palkamu, Kapten.&rdquo;</div></div>';
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('on'); });
    au_('page');
    function close() { ov.classList.remove('on'); setTimeout(function () { ov.remove(); }, 450); }
    ov.querySelector('.skip').onclick = close; ov.onclick = function (e) { if (e.target === ov) close(); };
  }

  /* ---------- Upacara Senin: Buku Besar Dibuka ---------- */
  function upacara(force) {
    var s = st(); if (!s || !s.last || !s.last.results) return;
    var L = s.last, r = L.results, myName = (state.player && state.player.characterName) || '';
    if (!force && seen('upacara:' + L.id)) return;
    markSeen('upacara:' + L.id);
    var winsMine = [];
    function inks(list, sub) {
      return (list || []).map(function (w) {
        var mine = w.name === myName; if (mine) winsMine.push(sub ? sub : 'Juara ' + w.rank);
        return '<div class="pd-ink' + (mine ? ' mine' : '') + '"><span class="fc">' + face(w.ap, w.name) + '</span><span class="nm">' + esc_(w.name) + '<small>' + (sub || ('Juara ' + w.rank)) + '</small></span><span class="v">' + (w.score != null ? fmt(w.score) : '') + '</span></div>';
      }).join('');
    }
    var left = '<div class="pd-page"><h3>Buku Besar Pacu Dagang</h3><div class="sub">' + dateWib(L.sat) + ' &middot; Komoditas Unggulan: ' + esc_(r.themeName || '') + ' &middot; ' + (r.peserta || 0) + ' kapten</div>' +
      '<div class="pd-quote">&ldquo;Selamat pagi, para pemburu untung. Akhir pekan ini laut kita sibuk sekali.&rdquo; &mdash; coco epan</div>';
    for (var g = 1; g <= 3; g++) {
      var li = r.gol && r.gol[g] && r.gol[g].list;
      left += '<div class="sub" style="margin-top:6px">' + GOL[g] + '</div>' + (li && li.length ? inks(li) : '<div class="pd-ink on"><span></span><span class="muted small">Belum ada yang lolos target.</span><span></span></div>');
    }
    left += '</div>';
    var cats = [['mata', 'Mata Saudagar'], ['jelajah', 'Penjelajah Pasar'], ['lompat', 'Lompatan Terjauh']].map(function (c) { var x = r[c[0]]; return x ? inks([{ name: x.name }], c[1]) : ''; }).join('');
    var right = '<div class="pd-page"><h3>Kategori</h3>' + (cats || '<div class="muted small">Belum ada pemenang kategori.</div>') +
      '<div class="pd-quote" style="margin-top:10px">&ldquo;Pekan depan, buku ini kosong lagi. Uang lama tahu: tak ada yang abadi kecuali pembukuan.&rdquo;</div></div>';
    var ov = document.createElement('div'); ov.className = 'pd-cine';
    ov.innerHTML = '<button class="skip">Tutup</button><div class="pd-book">' + left + right + '<div class="pd-mine-banner"></div></div>';
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('on'); });
    au_('page');
    var inkEls = ov.querySelectorAll('.pd-ink');
    inkEls.forEach(function (el, i) { setTimeout(function () { el.classList.add('on'); au_('click'); }, 700 + i * 450); });
    var mb = ov.querySelector('.pd-mine-banner');
    setTimeout(function () {
      if (winsMine.length) { mb.innerHTML = 'Tercatat. Untuk selamanya. &middot; ' + esc_(winsMine.join(' · ')); au_('achieve'); }
      else if (L.me) mb.innerHTML = 'Skormu: ' + fmt(L.me.score) + '. Buku besar menunggu namamu pekan depan.';
      else mb.innerHTML = 'Pacu berikutnya: Sabtu 00:00 WIB. Bocoran Jumat 20:00.';
      mb.classList.add('on');
    }, 900 + inkEls.length * 450);
    function close() { ov.classList.remove('on'); setTimeout(function () { ov.remove(); }, 450); }
    ov.querySelector('.skip').onclick = close; ov.onclick = function (e) { if (e.target === ov) close(); };
  }

  /* ---------- adegan otomatis ---------- */
  function busy() { return (typeof combatSceneOpen !== 'undefined' && combatSceneOpen) || !!document.querySelector('.qt-cine, .pd-cine, .hr-peti, .mtg.on, .tsg.on, .dt-key') || (document.getElementById('modalOverlay') && document.getElementById('modalOverlay').classList.contains('open')); }
  function scenes() {
    var s = st(); if (!s || busy()) return;
    if (s.last && s.last.results && !seen('upacara:' + s.last.id) && (s.event.status !== 'open' || !s.me.joined)) {
      var ann = s.last.results; if (ann) { upacara(false); return; }
    }
    if ((s.event.status === 'revealed' || s.event.status === 'open') && s.event.themeName && !seen('bocoran:' + s.event.id) && !s.me.joined) bocoran();
  }

  /* ---------- kaitan ---------- */
  var origOpen = window.openPanel;
  if (typeof origOpen === 'function') {
    window.openPanel = function (panel) {
      if (panel === 'pacu') {
        if (!st()) { showToast('Pacu Dagang belum dibuka.', 'info'); return; }
        var r = origOpen.apply(this, arguments);
        render(); load();
        clearInterval(timer); timer = setInterval(function () { if (currentPanel === 'pacu') load(); else clearInterval(timer); }, 30000);
        return r;
      }
      return origOpen.apply(this, arguments);
    };
  }
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey || !state || !st()) return;
    if (typeof combatSceneOpen !== 'undefined' && combatSceneOpen) return;
    if (typeof duelOpen_ === 'function' && duelOpen_()) return;
    if ((e.key || '').toLowerCase() === 'g') { e.preventDefault(); if (currentPanel === 'pacu') closeModal(); else openPanel('pacu'); }
  });
  wrap_('handleInbox_', null, function (it) {
    if (!it) return;
    if (it.type === 'pacu_tier') { showToast('Pacu Dagang: target ' + ['', 'Perunggu', 'Perak', 'Emas'][it.tier] + ' tercapai! (' + fmt(it.score) + ')', 'success'); au_('achieve'); }
    else if (it.type === 'pacu_salip') { showToast('Pacu Dagang: ' + it.from + ' menyalipmu. Kau kini #' + it.rank + '.', 'info'); au_('page'); }
    else if (it.type === 'pacu_hasil') { setTimeout(function () { if (typeof loadState === 'function') loadState(); }, 400); }
    else if (it.type === 'pacu_layar_emas') { showToast('Tiga kali juara 1! Layar Emas permanen kini milikmu di Kedai Rantau.', 'success'); au_('achieve'); }
    else return;
    if (it.type === 'pacu_tier' || it.type === 'pacu_salip') { google.script.run.withSuccessHandler(function (r) { if (r) { adopt(r.pacu); board = r.board; render(); } }).withFailureHandler(function () { }).api_pacu('papan'); }
  });
  // Lapau & Javasche Bank: pintu ke papan
  wrap_('setModal_', function () {
    if (!st() || (currentPanel !== 'tavern' && !(currentPanel === 'bank' && state.city && state.city.CityId === 'joungjava'))) return;
    var c = document.getElementById('modalContent'); if (!c || c.querySelector('.pd-callout')) return;
    var s = st(), ev = s.event, ph = c.querySelector('.ph');
    var txt = ev.status === 'open' ? (ev.boardClosed ? 'Buku besar ditutup. Skormu ' + fmt(s.me.score) + '.' : 'Berlangsung' + (s.me.rank ? ' &middot; kau #' + s.me.rank + ' di ' + GOL[s.me.gol] : '') + '.')
      : ev.status === 'revealed' ? 'Bocoran: ' + esc_(ev.themeName || '') + '. Dibuka Sabtu 00:00.' : ev.status === 'judging' ? 'Juri menghitung. Pengumuman Senin 08:00.' : 'Pacu berikutnya Sabtu. Bocoran Jumat 20:00.';
    var d = document.createElement('div'); d.className = 'qg-callout pd-callout';
    d.innerHTML = '<div class="qg-callout-ico">' + ic('trophy') + '</div><div><b>' + (currentPanel === 'bank' ? 'Prasasti Saudagar' : 'Pacu Dagang') + '</b><br><span class="muted small">' + txt + '</span></div><button class="btn btn-gold">Buka</button>';
    d.querySelector('.btn').onclick = function () { if (currentPanel === 'bank') { openPanel('pacu'); setTimeout(prasasti, 300); } else openPanel('pacu'); };
    if (ph && ph.parentNode) ph.parentNode.insertBefore(d, ph.nextSibling);
  });
  function gossip() {
    var s = st(), el = document.getElementById('rumorList');
    if (!el || el.querySelector('.pd-rumor') || !s || !s.event || !s.event.themeName || !(s.event.status === 'revealed' || s.event.status === 'open')) return;
    var t = esc_(s.event.themeName.toLowerCase());
    var pool = ['Kabarnya coco epan menyimpan sekarung <b>' + t + '</b> di bawah mejanya. Entah apa artinya.', 'Pedagang <b>' + t + '</b> tiba-tiba ramai di dermaga. Ada yang tahu kenapa?', 'Kata orang Javasche Bank, akhir pekan ini <b>' + t + '</b> bernilai lebih di buku besar.'];
    var d = document.createElement('div'); d.className = 'card rumor pd-rumor'; d.innerHTML = ic('chat') + '<span>' + pool[Math.floor(Math.random() * pool.length)] + '</span>';
    el.insertBefore(d, el.firstChild);
  }
  wrap_('setModal_', function () { if (currentPanel === 'tavern') try { gossip(); } catch (e) { } });
  wrap_('applyFreshState_', function () {
    var s = st(); if (s) s._at = Date.now();
    applyGates();
    if (s && s.stats) { try { ['ikut', 'perunggu', 'emas', 'juara1', 'mata', 'jelajah', 'lompat'].forEach(function (k) { metaMax_('pd' + k, s.stats[k] || 0); }); } catch (e) { } }
    if (currentPanel === 'pacu') render();
    var tries = 0;
    setTimeout(function later() { if (!st()) return; if (busy()) { if (tries++ < 40) setTimeout(later, 1500); return; } try { scenes(); } catch (e) { console.warn('[PD]', e); } }, 3500);
  });
  setInterval(function () { if (st()) applyGates(); }, 30000);

  /* ---------- Tanda Jasa ---------- */
  if (typeof ACH !== 'undefined' && ACH.push) ACH.push(
    { id: 'pd_ikut', t: 1, ic: 'trophy', n: 'Pemacu Pertama', d: 'Ikut Pacu Dagang pertama kali.', g: function (m) { return [m.c.pdikut || 0, 1]; } },
    { id: 'pd_perunggu', t: 1, ic: 'medal', n: 'Tinta Perunggu', d: 'Capai target Perunggu di Pacu Dagang.', g: function (m) { return [m.c.pdperunggu || 0, 1]; } },
    { id: 'pd_emas', t: 2, ic: 'medal', n: 'Tinta Emas', d: 'Capai target Emas di Pacu Dagang.', g: function (m) { return [m.c.pdemas || 0, 1]; } },
    { id: 'pd_juara', t: 2, ic: 'trophy', n: 'Juara Pacu', d: 'Juara 1 Pacu Dagang di golonganmu.', g: function (m) { return [m.c.pdjuara1 || 0, 1]; } },
    { id: 'pd_tiga', t: 3, ic: 'trophy', n: 'Tiga Musim', d: 'Juara 1 Pacu Dagang tiga kali.', g: function (m) { return [m.c.pdjuara1 || 0, 3]; } },
    { id: 'pd_dinasti', t: 3, ic: 'star', n: 'Dinasti Dagang', d: 'Rahasia: juara 1 Pacu Dagang sepuluh kali.', g: function (m) { return [m.c.pdjuara1 || 0, 10]; } },
    { id: 'pd_mata', t: 2, ic: 'eye', n: 'Mata Saudagar', d: 'Margin terbaik di Pacu Dagang.', g: function (m) { return [m.c.pdmata || 0, 1]; } },
    { id: 'pd_jelajah', t: 2, ic: 'map', n: 'Penjelajah Pasar', d: 'Untung di pulau terbanyak dalam satu Pacu.', g: function (m) { return [m.c.pdjelajah || 0, 1]; } },
    { id: 'pd_lompat', t: 2, ic: 'route', n: 'Lompatan Terjauh', d: 'Paling jauh melampaui rekor sendiri di Pacu Dagang.', g: function (m) { return [m.c.pdlompat || 0, 1]; } }
  );

  return { st: st, render: render, upacara: upacara, bocoran: bocoran, prasasti: prasasti, applyGates: applyGates };
})();
</script>
