  }

  function kapal(ctx, G, P, xs, kebal, now) {
    var pr = proj(G, 0), x = xs, y = pr.y, s = G.lw * 0.62, ayun = REDUCE ? 0 : Math.sin(now / 300) * 2;

  function pengejar(ctx, G, P, rasio, now) {

        ctx.quadraticCurveTo(x + 40 * sc, y - 18 * sc, x + 80 * sc, y - 30 * sc - fl); ctx.quadraticCurveTo(x + 40 * sc, y - 60 * sc - fl, x, y - 20 * sc); ctx.fill();

    } else {

  /* ---------- sesi ---------- */

    }

    function ketuk(dir) {
      if (fase !== 'main' || !sim || sim.selesai) return;

    }
    document.addEventListener('visibilitychange', vis);
    function hitungMundur(done) {
      var n = 3; big.textContent = n; say.textContent = ''; var iv = setInterval(function () {
        if (dead) { clearInterval(iv); return; } n--; if (n <= 0) { clearInterval(iv); big.textContent = ''; done(); } else big.textContent = n; }, 1000);
    }

      ctx.clearRect(0, 0, G.W, G.H);

      var T = simT();

        sim.maju(T);
        if (sim.baruTabrak != null) { sim.baruTabrak = null; dentum(0.5); vib(60); G.guncang = now; }

      ctx.save();

      latar(ctx, G, P, now);
      var c = P.course; for (var i = c.length - 1; i >= 0; i--) rintangan(ctx, G, P, c[i], T, now);
      var lane = sim ? sim.lajurPada() : 1, tx = lajurX(G, lane, 1);
      xs = xs == null ? tx : xs + (tx - xs) * Math.min(1, 0.28);
      kapal(ctx, G, P, xs, sim && T < sim.kebal, now);
      pengejar(ctx, G, P, rasio, now);
      {   // vinyet gelap, merah saat jarak aman tipis
        var vg = ctx.createRadialGradient(G.cx, G.H * 0.55, Math.min(G.W, G.H) * 0.3, G.cx, G.H * 0.55, Math.max(G.W, G.H) * 0.8);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, rasio < 0.35 ? 'rgba(90,0,0,.55)' : 'rgba(0,0,0,.55)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, G.W, G.H);

    function selesai() {
      if (fase !== 'main') return; fase = 'kirim';

      }, function (e) {

        tombol([{ l: 'Coba lagi', u: true, fn: mulai }, { l: 'Nanti dulu', fn: function () { tutup({ win: false }); } }]);

        lblD.textContent = P.kulit === 'pelangi' ? 'Keutuhan titian' : (P.kejar ? 'Jarak aman' : 'Lambung');
        if (o.onInfo && r.info) try { o.onInfo(r.info); } catch (e) { }

        hitungMundur(function () { say.textContent = ''; t0 = performance.now(); fase = 'main'; });
      }, function (e) {
        if (dead) return; say.className = 'say bad'; say.textContent = (e && e.message) || 'Gagal menghubungi server.';
        tombol([{ l: 'Coba lagi', u: true, fn: mulai }, { l: 'Nanti dulu', fn: function () { tutup({ cancelled: true }); } }]);

  }
  function open(kind, opts, cb) { main(Object.assign({ preset: kind }, opts || {}), cb); }
  return { main: main, open: open, isOpen: function () { return !!cur; } };
})();
