      cv.width = W * dpr; cv.height = Hh * dpr;
      var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      MTPS.paper(c, 0, 0, W, Hh, 'rgba(60,40,20,.06)');
      var n = NODES.length, cols = W < 560 ? 4 : n, rows = Math.ceil(n / cols), mx = 14, gap = (W - mx * 2) / cols;
      var cw = Math.min(gap * 0.86, 150), ch = cw * 0.66, rowH = (Hh - 10) / rows, fs = Math.max(9, Math.min(11, gap / 9));
      boxes = [];
      for (var r = 0; r < rows; r++) {
        var ty = r * rowH + Math.min(rowH * 0.16, 30);
        c.strokeStyle = '#a8231c'; c.lineWidth = 3; c.lineCap = 'round';
        if (r === 0) { c.beginPath(); c.moveTo(mx, ty); c.lineTo(mx + gap * 0.5 + 10, ty + 8); c.stroke(); c.beginPath(); c.moveTo(mx + gap * 0.5 + 22, ty + 14); c.quadraticCurveTo(mx + gap, ty, W - mx, ty); c.stroke(); }

      }

        var col = i % cols, row = Math.floor(i / cols), ty = row * rowH + Math.min(rowH * 0.16, 30);
        var x = mx + gap * (col + 0.5) - cw / 2, y = ty + 16 + (col % 2) * ch * 0.3;
        MTPS.sketch(c, nd.sk, x, y, cw, ch, { name: i > 0 && i < 7 ? m.ship : null, vis: m.vis, pin: true, sepia: i === 0, cold: nd.mark === 'cold' ? 1 : 0 });
        if (i > 0 && i < 7) { c.strokeStyle = 'rgba(30,24,18,.8)'; c.lineWidth = 2.4; c.beginPath(); c.moveTo(x + 4, y + 6); c.lineTo(x + cw - 4, y + ch - 6); c.moveTo(x + cw - 4, y + 6); c.lineTo(x + 4, y + ch - 6); c.stroke(); }
        if (nd.mark === 'red') { c.strokeStyle = '#a8231c'; c.lineWidth = 3; c.strokeRect(x - 3, y - 3, cw + 6, ch + 6); }
        if (sel === i) { c.strokeStyle = '#c9a450'; c.lineWidth = 3; c.strokeRect(x - 5, y - 5, cw + 10, ch + 10); }
        c.font = '700 ' + fs + 'px "Cinzel", Georgia, serif'; c.fillStyle = '#2b2218'; c.textAlign = 'center';
        var words = String(nd.n).split(' '), lines = [], cur = '';
        words.forEach(function (wd) { var t2 = cur ? cur + ' ' + wd : wd; if (c.measureText(t2).width > gap - 4 && cur) { lines.push(cur); cur = wd; } else cur = t2; });
        lines.push(cur);
        lines.forEach(function (ln, k) { c.fillText(ln, x + cw / 2, y + ch + 13 + k * (fs + 2)); });
        boxes.push([x, y, cw, ch + 18]);
      });
    }
    function pick(ev) {
      var r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
      boxes.forEach(function (b, i) { if (x >= b[0] && x <= b[0] + b[2] && y >= b[1] && y <= b[1] + b[3]) sel = i; });
      if (sel >= 0) { var nd = NODES[sel]; info.innerHTML = '<b>' + esc(nd.n) + '</b><br><span class="asli">Dunia asli: ' + esc(nd.a) + '</span><br><span class="baru">Dunia sekarang: ' + esc(nd.b) + '</span>'; au('page'); }

  /* ---------- Tanda Jasa ---------- */

  /* ---------- Alat uji GM (hanya muncul bila server mengirim bendera gm) ---------- */

    }

      '</select><input type="number" min="0" data-in="n" value="0"><button type="button" data-ps="langkah">Set</button><button type="button" data-ps="reset">Reset</button></div>' +

      if (reload && typeof loadState === 'function') try { loadState(); } catch (e) { location.reload(); }
    });
  }
  document.addEventListener('click', function (ev) { if (ev.target && ev.target.id === 'mtGmBtn') setTimeout(gmTool, 0); }, true);

  return { st: st, call: call, adopt: adopt, journal: journal, papan: papan, benang: benang, _festival: festival, _geladak: geladak, _tangga: tangga, _hari: hariPertama, _catatan: catatan, _bukti: buktiScene, _ocid: ocidScene };
})();
