<style>
  /* ================= Tide v41 · Pasir (PS) ================= */
  #mtGmPanel .ps-gm .ps-tones { display: flex; flex-wrap: wrap; gap: 6px; }
  #mtGmPanel .ps-gm .ps-tones button { padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(79,51,30,.35); background: #fff8e8; color: #33230f; cursor: pointer; font: inherit; font-size: 12px; }
  #mtGmPanel .ps-gm .ps-tones button.on { background: #4f331e; color: #ffe7a3; border-color: #4f331e; }
  #mtGmPanel .ps-gm .ps-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; font-size: 12px; }
  #mtGmPanel .ps-gm .ps-row input, #mtGmPanel .ps-gm .ps-row select { width: auto; min-width: 64px; }
  #mtGmPanel .ps-gm .ps-row button { padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(79,51,30,.35); background: #fff8e8; cursor: pointer; font: inherit; font-size: 12px; }
  #mtGmPanel .ps-gm .ps-st { font-size: 12px; color: #6b5a3a; margin-top: 6px; }
</style>
<script>
/* =====================================================================
 * Tide v41 · Pasir (modul PS) — Batch 0: fondasi
 * Server: supabase/migrations/0039_pasir_dasar.sql
 *   key 'pasir' di getGameState (HANYA ada bila terbuka untuk pemain ini), endpoint api_pasir.
 * Naskah cerita tidak ditulis di sini: dikirim server per langkah (batch berikutnya).
 * ===================================================================== */
var PS = (function () {
  function st() { return (window.state && state.pasir) || null; }
  function call(args, ok, fail) {
    var r = google.script.run
      .withSuccessHandler(function (x) { if (x && x.pasir !== undefined) adopt(x.pasir); if (ok) ok(x); })
      .withFailureHandler(function (e) { if (fail) fail(e); else if (typeof showToast === 'function') showToast(e.message, 'error'); });
    r.api_pasir.apply(r, args);
  }
  function adopt(p) {
    if (!window.state) return;
    if (p) state.pasir = p; else delete state.pasir;
    apply();
  }
  function apply() {
    var p = st();
    try { PE.set(p ? p.tone : 'kini'); } catch (e) { }
    gmTool();
  }

  /* ---------- Alat uji GM (hanya muncul bila server mengirim bendera gm) ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function gmTool() {
    var p = st(), box = document.querySelector('#mtGmPanel .mtp-box');
    var sec = box && box.querySelector('.ps-gm');
    if (!p || !p.gm || !box) { if (sec) sec.remove(); return; }
    if (!sec) {
      sec = document.createElement('div'); sec.className = 'ps-gm';
      var hint = box.querySelector('.mtp-hint'); box.insertBefore(sec, hint || null);
      sec.addEventListener('click', function (ev) {
        var b = ev.target.closest('button[data-ps]'); if (!b) return;
        var k = b.getAttribute('data-ps');
        if (k === 'era') return gm(['era', b.getAttribute('data-v')]);
        if (k === 'celah') return PE.celah(2400);
        if (k === 'retak') return gm(['retak', sec.querySelector('[data-in=retak]').value]);
        if (k === 'kaca') return gm(['kaca', sec.querySelector('[data-in=kaca]').value]);
        if (k === 'langkah') return gm(['langkah', sec.querySelector('[data-in=q]').value, sec.querySelector('[data-in=n]').value]);
        if (k === 'reset' && confirm('Hapus semua data uji Pasir untuk akunmu?')) return gm(['reset']);
      });
    }
    var tones = (p.eras || []).map(function (e) {
      return '<button type="button" data-ps="era" data-v="' + esc(e.era) + '" class="' + (e.era === p.era ? 'on' : '') + '">' + esc(e.tone) + '</button>';
    }).join('');
    var q = p.q || {};
    sec.innerHTML = '<h4>Uji Pasir</h4>' +
      '<div class="ps-tones">' + tones + '<button type="button" data-ps="celah">celah</button></div>' +
      '<div class="ps-row">Retak <input type="number" min="0" max="100" data-in="retak" value="' + (p.retak || 0) + '"><button type="button" data-ps="retak">Set</button>' +
      ' Kaca <input type="number" min="0" max="' + (p.kacaMax || 7) + '" data-in="kaca" value="' + (p.kaca || 0) + '"><button type="button" data-ps="kaca">Set</button></div>' +
      '<div class="ps-row">Langkah <select data-in="q">' + ['10', '11', '12', '13', '14'].map(function (k) { return '<option value="ps' + k + '">' + k + ' (' + (q[k] || 0) + ')</option>'; }).join('') +
      '</select><input type="number" min="0" data-in="n" value="0"><button type="button" data-ps="langkah">Set</button><button type="button" data-ps="reset">Reset</button></div>' +
      '<div class="ps-st">Nada: <b>' + esc(p.tone) + '</b> &middot; retak ' + (p.retak || 0) + ' &middot; kaca ' + (p.kaca || 0) + '/' + (p.kacaMax || 7) + '</div>';
  }
  function gm(args) {
    call(['gm'].concat(args), function () { if (typeof showToast === 'function') showToast('Uji Pasir: tersimpan', 'success'); });
  }

  wrap_('applyFreshState_', function () { apply(); });
  // Panel GM dibuka setelah state ada: isi ulang bagian uji
  document.addEventListener('click', function (ev) { if (ev.target && ev.target.id === 'mtGmBtn') setTimeout(gmTool, 0); }, true);

  return { st: st, call: call, adopt: adopt };
})();
</script>
