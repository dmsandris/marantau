<script>
/* =====================================================================
 * Saga 4 Bagian II "Takhta Tanpa Mahkota" — sinematik (MTCine).
 *   mk2_teluk    Langkah 47: rantai raksasa Teluk Dalam, lentera Ki Dorus
 *   mk2_blokade  Langkah 55: blokade jebol di tengah laut, Rantai Lama muncul dari kabut
 *   mk2_medan    Langkah 60: Medan Tempur Teluk Dalam, Sovereign Mahkota + 3 Navy vs armada aliansi
 *   mk2_armada   Langkah 54: armada aliansi berangkat dari TooGood saat fajar
 *   mk2_gerbang  Langkah 56: rantai turun, Sovereign Mahkota menyelinap masuk
 *   mk2_mahkota  Langkah 57: Kumis Hitam mengenakan Mahkota Karam, arus berbalik
 *   mk2_karam    Epilog 1: Sovereign Mahkota karam, mahkota retak
 *   mk2_fajar    Epilog 2-6: Teluk Dalam berangin, bunga untuk Andry (opts.data.rantai = dewan|ikn)
 *   mk2_credits  Credit bergulir Saga Keempat (opts.data.name)
 * Semua hanya gambar; teks cerita ada di keterangan (Mahkota.html). Kapal: MTShip, langit & laut: MTSky.
 * ===================================================================== */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTSky || !window.MTShip) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var FULL = { speed: 20, cargo: 20, condition: 20, cannons: 20 }, WL4 = ['speed', 'cargo', 'condition', 'cannons'];
  function vis(look, wl) { return MTShip.fromVisual({ look: look, tier: 5, up: FULL, wl: wl || null }); }
  var V = {
    navy: function () { return vis({ hull: '#1c2438', trim: '#9fb4d8', sail: '#34476e', flag: '#14203a', emblemColor: '#c9d6f0' }); },
    sov: function () { return vis({ hull: '#141018', trim: '#e0b84a', sail: '#1e1a26', flag: '#0c0a10', emblemColor: '#e0b84a', emblem: 'crest' }, WL4); },
    skitraw: function () { return vis({ hull: '#6a2a1c', trim: '#e8c060', sail: '#f2e2c4', flag: '#b02a20', emblemColor: '#f2e2c4' }); },
    bebas: function () { return vis({ hull: '#3a2a1e', trim: '#c9a450', sail: '#e8dcc0', flag: '#1a1a1a', emblemColor: '#e8dcc0' }); },
    tempa: function () { return vis({ hull: '#5a4028', trim: '#d8963a', sail: '#cdb896', flag: '#7a3a1a', emblemColor: '#f0d090' }); },
    me: function () { try { return MTShip.fromVisual(typeof myShipVisual_ === 'function' ? myShipVisual_() : null); } catch (e) { return MTShip.fromVisual({ tier: 4, up: FULL }); } },
    pearl: function () { return MTShip.pearlOpts(); }
  };
  function scaleFor(o, W, H, f) { var e = MTShip.extent(o), k = o.sizeK || 1; return Math.min(W * f / ((e.aft + e.fore) * k), H * f * 1.15 / (e.up * k)); }
  function ship(ctx, o, x, y, s, dir, t, lit, ex) {
    var p = {}, k; for (k in o) p[k] = o[k]; if (ex) for (k in ex) p[k] = ex[k];
    p.dir = dir; p.t = t; p.lit = lit; p.moving = 1;
    try { MTShip.draw(ctx, x, y, s, p); } catch (e) { }
  }
  function foam(ctx, x, y, s, dir, t, sp) { try { MTShip.foam(ctx, x, y, s, dir, t, sp, 1); } catch (e) { } }
  function stars(ctx, W, hy, n, seed, a) {
    var r = U.rng(seed); ctx.save();
    for (var i = 0; i < n; i++) { var y = Math.pow(r(), 1.5) * hy * 0.9; ctx.fillStyle = 'rgba(235,240,255,' + ((0.15 + r() * 0.6) * a * (1 - y / hy)).toFixed(3) + ')'; ctx.fillRect(r() * W, y, r() < 0.9 ? 1 : 1.7, r() < 0.9 ? 1 : 1.7); }
    ctx.restore();
  }
  function blackIn(ctx, W, H, t, d) { if (t < d) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, d, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function fadeOut(ctx, W, H, t, a, b) { var k = sm(a, b, t); if (k > 0) { ctx.fillStyle = 'rgba(0,0,0,' + k.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function caption(ctx, W, H, txt, a) {
    if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'left'; var fs = Math.round(Math.min(W, H) * 0.028);
    ctx.font = '700 ' + fs + 'px ' + (C.SUB_FONT || 'Georgia, serif'); ctx.fillStyle = 'rgba(255,240,215,.9)';
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 6; try { ctx.letterSpacing = (fs * 0.18).toFixed(1) + 'px'; } catch (e) { }
    ctx.fillText(txt, W * 0.045, H * 0.08); ctx.restore();
  }
  /** Rantai bergantung (path, tanpa panggang): dari (x0,y0) ke (x1,y1) dengan lengkung sag. */
  function chain(ctx, x0, y0, x1, y1, sag, lw, col, glowA) {
    var n = Math.max(8, Math.round(Math.hypot(x1 - x0, y1 - y0) / (lw * 1.25)));
    ctx.save(); ctx.lineCap = 'round';
    if (glowA > 0) { ctx.shadowColor = 'rgba(110,170,255,' + glowA.toFixed(3) + ')'; ctx.shadowBlur = lw * 1.6; }
    for (var i = 0; i < n; i++) {
      var f = i / (n - 1), x = U.lerp(x0, x1, f), y = U.lerp(y0, y1, f) + Math.sin(f * Math.PI) * sag;
      ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, lw * 0.28);
      ctx.beginPath();
      if (i % 2) ctx.ellipse(x, y, lw * 0.55, lw * 0.3, Math.atan2(y1 - y0, x1 - x0), 0, 6.2832);
      else ctx.ellipse(x, y, lw * 0.25, lw * 0.4, Math.atan2(y1 - y0, x1 - x0), 0, 6.2832);
      ctx.stroke();
    }
    ctx.restore();
  }
  function bellTower(ctx, x, base, h, lit, lamp) {
    var w = h * 0.22;
    ctx.fillStyle = lit('#2a2420'); ctx.fillRect(x - w / 2, base - h, w, h);
    ctx.fillStyle = lit('#3a3028'); ctx.fillRect(x - w * 0.7, base - h - w * 0.2, w * 1.4, w * 0.2);
    ctx.beginPath(); ctx.moveTo(x - w * 0.75, base - h - w * 0.2); ctx.lineTo(x, base - h - w * 1.1); ctx.lineTo(x + w * 0.75, base - h - w * 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lit('#c9a450'); ctx.beginPath(); ctx.arc(x, base - h + w * 0.55, w * 0.24, Math.PI, 0); ctx.lineTo(x + w * 0.3, base - h + w * 0.8); ctx.lineTo(x - w * 0.3, base - h + w * 0.8); ctx.closePath(); ctx.fill();
    if (lamp > 0) C.glow(ctx, x, base - h + w * 0.6, h * 0.5, '255,190,110', 0.5 * lamp);
  }
  function dock(ctx, x0, x1, y, lit) {
    ctx.fillStyle = lit('#3a2a1c'); ctx.fillRect(x0, y - 4, x1 - x0, 7);
    for (var px = x0 + 8; px < x1; px += 26) { ctx.fillRect(px, y, 4, 30); }
  }
  function petals(P, x, y, m) {
    for (var i = 0; i < 3; i++) P.add({ x: x + (Math.random() - 0.5) * m * 0.02, y: y, vx: (Math.random() - 0.3) * m * 0.004, vy: -m * 0.002 * Math.random(), g: m * 0.00012,
      drag: 0.99, r: Math.max(1.2, m * 0.004), life: 3 + Math.random() * 2, col: Math.random() < 0.5 ? 'rgba(255,236,240,A)' : 'rgba(255,200,120,A)', a: 0.95 });
  }

  /* ======================= mk2_teluk ======================= */
  MTCine.register('mk2_teluk', function () {
    var lit = C.makeLit(), clouds = MTSky.makeClouds(U.rng(4701), 5), glit = MTSky.makeGlitter(U.rng(4703)), me = V.me();
    function draw(ctx, W, H, t, dt) {
      var pal = MTSky.palette(0.66 + sm(0, 9, t) * 0.08, null, 'gloom'), hy = H * 0.56, m = Math.min(W, H);
      lit.set(pal.tint);
      MTSky.paintSky(ctx, W, hy, pal, t, null); stars(ctx, W, hy, 70, 4705, sm(2, 8, t));
      MTSky.paintClouds(ctx, W, hy, pal, clouds, dt, 0.6);
      // tanjung kiri-kanan mulut teluk
      ctx.fillStyle = lit('#1e2228');
      ctx.beginPath(); ctx.moveTo(0, hy + 2); ctx.lineTo(0, hy - H * 0.16); ctx.quadraticCurveTo(W * 0.12, hy - H * 0.2, W * 0.26, hy - H * 0.04); ctx.lineTo(W * 0.3, hy + 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(W, hy + 2); ctx.lineTo(W, hy - H * 0.14); ctx.quadraticCurveTo(W * 0.86, hy - H * 0.19, W * 0.72, hy - H * 0.05); ctx.lineTo(W * 0.68, hy + 2); ctx.fill();
      MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: glit, rough: 0.5, drift: 8 });
      // rantai raksasa menutup teluk, berdenyut biru
      var pulse = 0.35 + 0.35 * Math.sin(t * 2.2) * sm(2.5, 4, t);
      chain(ctx, W * 0.25, hy - H * 0.05, W * 0.73, hy - H * 0.05, H * 0.07, m * 0.018, '#7a7064', pulse);
      C.glow(ctx, W * 0.49, hy + H * 0.01, m * 0.25, '90,150,255', 0.18 * pulse);
      // menara lonceng & dermaga Rantai Lama
      bellTower(ctx, W * 0.14, hy - H * 0.02, H * 0.22, lit, 1);
      dock(ctx, W * 0.02, W * 0.3, hy + H * 0.06, lit);
      // Ki Dorus dengan lentera
      var kd = sm(4, 6, t);
      if (kd > 0) { ctx.save(); ctx.globalAlpha = kd; C.figure(ctx, W * 0.24, hy + H * 0.06, H * 0.1, { dress: 'robe', hat: 'peci', pose: 'hold', prop: 'lantern', dir: 1, col: '#0c0a08', t: t, rim: '255,190,110', rimSide: 1, rimA: 0.6 }); ctx.restore(); }
      // kapal pemain masuk dari kanan
      var s = scaleFor(me, W, H, 0.3), e = C.ease(sm(0.6, 8, t)), x = U.lerp(W * 1.05, W * 0.55, e), y = hy + H * 0.2;
      ship(ctx, me, x, y, s, -1, t, lit, { furl: sm(5, 8, t) * 0.6, lanterns: 0.8, roll: Math.sin(t) * 0.01 });
      foam(ctx, x, y, s, -1, t, 0.6 * (1 - sm(6, 9, t)));
      caption(ctx, W, H, 'PELABUHAN RANTAI LAMA', sm(1, 2.5, t) * (1 - sm(8.5, 9.5, t)));
      C.vignette(ctx, W, H, 0.6); blackIn(ctx, W, H, t, 1.2);
    }
    return { draw: draw, intro: 6.5 };
  });

  /* ======================= mk2_blokade (langkah 55: sesudah blokade jebol di tengah laut) ======================= */
  MTCine.register('mk2_blokade', function () {
    var lit = C.makeLit(), clouds = MTSky.makeClouds(U.rng(5501), 5), glit = MTSky.makeGlitter(U.rng(5503)), me = V.me(), nv = V.navy(), P = new C.Particles(), fog = null;
    function draw(ctx, W, H, t, dt) {
      var pal = MTSky.palette(0.7 + sm(0, 8, t) * 0.06, null, 'gloom'), hy = H * 0.55, m = Math.min(W, H);
      lit.set(pal.tint);
      MTSky.paintSky(ctx, W, hy, pal, t, null); stars(ctx, W, hy, 50, 5505, sm(1, 6, t) * 0.7);
      MTSky.paintClouds(ctx, W, hy, pal, clouds, dt, 0.8);
      // Rantai Lama muncul dari kabut di kiri
      var show = sm(2.5, 6, t);
      ctx.save(); ctx.globalAlpha = show;
      ctx.fillStyle = lit('#1e2228'); ctx.beginPath(); ctx.moveTo(0, hy + 2); ctx.lineTo(0, hy - H * 0.15); ctx.quadraticCurveTo(W * 0.14, hy - H * 0.19, W * 0.3, hy - H * 0.02); ctx.lineTo(W * 0.33, hy + 2); ctx.fill();
      bellTower(ctx, W * 0.13, hy - H * 0.03, H * 0.22, lit, show);
      dock(ctx, W * 0.02, W * 0.3, hy + H * 0.05, lit);
      ctx.restore();
      MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: glit, rough: 0.9, drift: 14 });
      // dua kapal Navy terseret arus, miring dan berasap
      [[0.78, 0.07, 0.15, -0.22], [0.9, 0.12, 0.13, 0.18]].forEach(function (q, k) {
        var s = scaleFor(nv, W, H, q[2]), x = W * q[0] + t * W * 0.006, y = hy + H * q[1];
        ctx.save(); ctx.translate(x, y + sm(0, 9, t) * s * 10); ctx.rotate(q[3] * (0.6 + 0.4 * sm(0, 6, t)));
        ship(ctx, nv, 0, 0, s, -1, t + k, lit, { damage: 0.85, lanterns: 0.1, furl: 0.7 }); ctx.restore();
        if (Math.random() < 0.5) P.add({ x: x + (Math.random() - 0.5) * s * 60, y: y - s * 40, vx: m * 0.0006, vy: -m * 0.0012, drag: 0.99, r: m * 0.008, grow: m * 0.0004, life: 2.4, col: 'rgba(40,40,46,A)', a: 0.45 });
      });
      // kapal pemain melaju ke kiri, menuju dermaga
      var s = scaleFor(me, W, H, 0.3), e = C.ease(sm(0.3, 8, t)), x = U.lerp(W * 0.86, W * 0.42, e), y = hy + H * 0.21;
      ship(ctx, me, x, y, s, -1, t, lit, { lanterns: 0.7, roll: Math.sin(t * 1.2) * 0.012, damage: 0.25 });
      foam(ctx, x, y, s, -1, t, 0.8);
      if (!fog) fog = C.puffSprite(5507, 380, 110, { sx: 0.6, sy: 1, th: 0.22, soft: 0.36, a: 0.55, dark: [40, 44, 60], lite: [110, 120, 150], lx: 0, ly: -4 });
      ctx.globalAlpha = 0.6 * (1 - show * 0.6); ctx.drawImage(fog, -W * 0.1 - t * W * 0.01, hy - H * 0.12, W * 0.7, H * 0.22); ctx.globalAlpha = 1;
      P.run(ctx, dt);
      caption(ctx, W, H, 'BLOKADE TERTEMBUS', sm(0.5, 2, t) * (1 - sm(7.5, 8.5, t)));
      C.vignette(ctx, W, H, 0.55); blackIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 6.5 };
  });

  /* ======================= mk2_medan (langkah 60: tiba di Medan Tempur Teluk Dalam) ======================= */
  MTCine.register('mk2_medan', function () {
    var lit = C.makeLit(), sov = V.sov(), nv = V.navy(), P = new C.Particles();
    var kami = [{ o: V.pearl(), y: 0.16, k: 0.22 }, { o: V.me(), y: 0.27, k: 0.24 }, { o: V.skitraw(), y: 0.06, k: 0.15 }, { o: V.tempa(), y: 0.1, k: 0.13 }];
    function draw(ctx, W, H, t, dt) {
      var pal = MTSky.palette(0.88, 'storm'), hy = H * 0.5, m = Math.min(W, H), cx = W * 0.68, cy = hy + H * 0.15;
      lit.set(pal.tint);
      MTSky.paintSky(ctx, W, hy, pal, t, null);
      MTSky.paintSea(ctx, W, H, hy, pal, t, { rough: 1.4, drift: 30 });
      // pusaran di atas altar yang menyala
      C.glow(ctx, cx, cy + H * 0.06, m * 0.32, '255,200,90', 0.32 + 0.08 * Math.sin(t * 2));
      ctx.save(); ctx.strokeStyle = 'rgba(230,190,90,.3)'; ctx.lineWidth = Math.max(1, m * 0.0028);
      for (var r = 0; r < 6; r++) { ctx.beginPath(); for (var a = 0; a < 6.3; a += 0.14) { var rr = m * (0.05 + r * 0.045) * (1 + a * 0.04); var px = cx + Math.cos(a + t * (1.2 - r * 0.1)) * rr * 1.8, py = cy + Math.sin(a + t * (1.2 - r * 0.1)) * rr * 0.3; if (a) ctx.lineTo(px, py); else ctx.moveTo(px, py); } ctx.stroke(); }
      ctx.restore();
      var s = scaleFor(sov, W, H, 0.4);
      ship(ctx, sov, cx, cy, s, -1, t, lit, { lanterns: 1, roll: Math.sin(t * 1.6) * 0.015 });
      // tiga kapal Navy keluar dari kabut di belakang kapal induk
      [[0.86, 0.02], [0.52, 0.0], [0.95, 0.09]].forEach(function (q, k) {
        var ap = sm(2.2 + k * 0.6, 4.5 + k * 0.6, t), sn = scaleFor(nv, W, H, 0.15);
        ctx.save(); ctx.globalAlpha = ap; ship(ctx, nv, W * q[0], hy + H * q[1], sn, -1, t + k, lit, { lanterns: 0.6 }); ctx.restore();
      });
      // armada aliansi di kiri
      kami.forEach(function (f, i) {
        var sk = scaleFor(f.o, W, H, f.k), e = C.ease(sm(0.6 + i * 0.4, 5.5 + i * 0.4, t)), x = U.lerp(-W * 0.2, W * (0.16 + i * 0.07), e), y = hy + H * f.y;
        ship(ctx, f.o, x, y, sk, 1, t + i, lit, { lanterns: 0.5, roll: Math.sin(t + i) * 0.014 });
        foam(ctx, x, y, sk, 1, t, 0.7 * e);
      });
      if (Math.random() < 0.4) P.add({ x: cx + (Math.random() - 0.5) * m * 0.2, y: cy, vx: 0, vy: -m * 0.0016, drag: 0.98, r: Math.max(0.8, m * 0.002), life: 1.4, col: 'rgba(255,215,130,A)', add: true });
      P.run(ctx, dt);
      if (t > 5.2 && t < 5.36) { ctx.fillStyle = 'rgba(240,240,255,.5)'; ctx.fillRect(0, 0, W, H); }
      caption(ctx, W, H, 'MEDAN TEMPUR TELUK DALAM', sm(0.5, 2, t) * (1 - sm(7.5, 8.5, t)));
      C.vignette(ctx, W, H, 0.65); blackIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 7 };
  });

  /* ======================= mk2_armada ======================= */
  MTCine.register('mk2_armada', function () {
    var lit = C.makeLit(), clouds = MTSky.makeClouds(U.rng(5401), 6), glit = MTSky.makeGlitter(U.rng(5403)), P = new C.Particles();
    var F = [{ o: V.pearl(), d: 0, y: 0.25, k: 0.34 }, { o: V.me(), d: 0.6, y: 0.31, k: 0.26 }, { o: V.skitraw(), d: 1.3, y: 0.12, k: 0.2 },
      { o: V.bebas(), d: 1.9, y: 0.17, k: 0.2 }, { o: V.tempa(), d: 2.6, y: 0.08, k: 0.17 }, { o: V.bebas(), d: 3.2, y: 0.04, k: 0.14 }];
    function draw(ctx, W, H, t, dt) {
      var pal = MTSky.palette(0.985 + sm(0, 9, t) * 0.06, null), hy = H * 0.5, m = Math.min(W, H);
      lit.set(pal.tint);
      MTSky.paintSky(ctx, W, hy, pal, t, null);
      C.glow(ctx, W * 0.78, hy, m * 0.5, '255,200,140', 0.35 * sm(0, 6, t));
      MTSky.paintClouds(ctx, W, hy, pal, clouds, dt, 1.2);
      // TooGood merdeka di kiri: benteng tanpa asap
      ctx.fillStyle = lit('#2c2622'); ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(0, hy - H * 0.1); ctx.quadraticCurveTo(W * 0.12, hy - H * 0.14, W * 0.24, hy); ctx.fill();
      ctx.fillStyle = lit('#3a302a'); ctx.fillRect(W * 0.02, hy - H * 0.17, W * 0.09, H * 0.09);
      for (var bt = 0; bt < 5; bt++) ctx.fillRect(W * 0.02 + bt * W * 0.02, hy - H * 0.19, W * 0.012, H * 0.02);
      ctx.fillStyle = lit('#1a1614'); ctx.fillRect(W * 0.13, hy - H * 0.2, W * 0.014, H * 0.12);
      C.waveFlag ? 0 : 0;
      MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: glit, rough: 1, drift: 30 });
      F.slice().sort(function (a, b) { return a.y - b.y; }).forEach(function (f, i) {
        var s = scaleFor(f.o, W, H, f.k), e = sm(f.d, f.d + 6.5, t), x = U.lerp(-W * 0.25, W * (0.2 + (5 - f.d / 0.65) * 0.11), C.ease(e)), y = hy + H * f.y;
        ship(ctx, f.o, x, y, s, 1, t + i, lit, { lanterns: 0.4, roll: Math.sin(t * 1.1 + i) * 0.014 });
        foam(ctx, x, y, s, 1, t, 0.8 * e);
      });
      // genderang: kelopak & bara terbang di haluan Black Pearl
      if (t > 3 && t < 8 && Math.random() < 0.4) petals(P, W * 0.55, hy + H * 0.12, m);
      P.run(ctx, dt);
      caption(ctx, W, H, 'ARMADA ALIANSI BERANGKAT', sm(1, 2.5, t) * (1 - sm(8.5, 9.5, t)));
      C.vignette(ctx, W, H, 0.45); blackIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 7.5 };
  });

  /* ======================= mk2_gerbang ======================= */
  MTCine.register('mk2_gerbang', function () {
    var lit = C.makeLit(), glit = MTSky.makeGlitter(U.rng(5601)), sov = V.sov(), P = new C.Particles(), fog = null;
    function draw(ctx, W, H, t, dt) {
      var pal = MTSky.palette(0.86, null, 'gloom'), hy = H * 0.55, m = Math.min(W, H);
      lit.set(pal.tint);
      MTSky.paintSky(ctx, W, hy, pal, t, null); stars(ctx, W, hy, 90, 5603, 1);
      MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: glit, rough: 0.4, drift: 6 });
      // rantai turun ke air (sag membesar, ujung tenggelam)
      var down = C.ease(sm(1, 4.5, t)), lw = m * 0.02;
      if (down < 1) chain(ctx, W * 0.12, hy - H * 0.1 + down * H * 0.3, W * 0.88, hy - H * 0.1 + down * H * 0.3, H * 0.06 + down * H * 0.2, lw, '#9a9488', 0.95 * (1 - down));
      if (t > 3.6 && t < 4.6 && Math.random() < 0.8) for (var k = 0; k < 6; k++) P.add({ x: W * (0.2 + Math.random() * 0.6), y: hy + H * 0.02, vx: (Math.random() - 0.5) * m * 0.004, vy: -m * (0.004 + Math.random() * 0.006), g: m * 0.0003, drag: 0.98, r: Math.max(1, m * 0.003), life: 1 + Math.random(), col: 'rgba(200,225,255,A)', a: 0.8 });

  var CRED_SEC = 58;
  MTCine.register('mk2_credits', function (opts) {
    var D = (opts && opts.data) || {}, name = String(D.name || 'Kapten'), lit = C.makeLit(), glit = MTSky.makeGlitter(U.rng(6401)), clouds = MTSky.makeClouds(U.rng(6403), 6);
    var fleet = [V.pearl(), V.me(), V.skitraw(), V.tempa()];
    // p = paragraf (dibungkus otomatis) · end = nama kapten (berhenti di tengah layar) · note = catatan penutup di bawahnya
    var LINES = [['logo', 'MARANTAU'], ['h', 'Saga Keempat — Monopoli & Mahkota'], ['s', 'Lengkap'], ['gap'], ['gap'],
      ['s', 'PENCIPTA'], ['b', 'DMSANDRIS'], ['gap'],
      ['p', 'Dari lubuk hati terdalam, saya, DMSandris, mengucapkan terima kasih kepada seluruh jajaran pengembang Anthropic yang telah menciptakan Claude, mesin yang menghidupkan setiap pelabuhan, gelombang, dan kisah dalam game ini.'],
      ['gap'],
      ['p', 'Terima kasih kepada Tradewinds, sumber inspirasi yang membuat layar Marantau terkembang.'],
      ['gap'],
      ['p', 'Untuk teman-teman yang mendukung sejak hari-hari pertama:'],
      ['b', 'GALA AP  •  ARIEF CAHARUDIN  •  REZA FACHMI'], ['b', 'DWI PRASETYO  •  TOBIAS YAP'],
      ['p', 'serta semua sahabat yang tidak dapat disebutkan satu per satu.'],
      ['gap'],
      ['p', 'Untuk para kapten yang berlayar bersamaku ke masa lalu dan seluruh penjuru Mare Nusantara:'],
      ['end', name]];
    var NOTE = '(Simpan dulu kompasmu baik-baik, Kapten. Perjalanan ini hampir berakhir, sampai jumpa di saga terakhir.)';
    var FONT = { logo: function (m) { return Math.round(m * 0.1) + 'px ' + (C.TITLE_FONT || 'Georgia'); },
      h: function (m) { return '700 ' + Math.round(m * 0.04) + 'px ' + (C.SUB_FONT || 'Georgia'); },
      s: function (m) { return '700 ' + Math.max(12, Math.round(m * 0.027)) + 'px ' + (C.SUB_FONT || 'Georgia'); },
      b: function (m) { return '700 ' + Math.max(13, Math.round(m * 0.033)) + 'px Georgia, serif'; },
      p: function (m) { return Math.max(13, Math.round(m * 0.029)) + 'px Georgia, serif'; },
      end: function (m) { return '700 ' + Math.round(m * 0.05) + 'px ' + (C.SUB_FONT || 'Georgia'); },
      note: function (m) { return 'italic ' + Math.max(12, Math.round(m * 0.027)) + 'px Georgia, serif'; } };
    var COL = { logo: '#e8bf55', h: '#fff1d0', s: 'rgba(232,191,85,.95)', b: '#f4ead6', p: '#f4ead6', end: '#ffe6a8', note: '#e8dcc0' };
    var HK = { logo: 2.4, h: 1.5, s: 1.3, b: 1.15, p: 1.0, end: 1.6, gap: 0.9 };
    var lay = null, layKey = '';
    function wrap(ctx, text, maxW) {
      var w = text.split(' '), rows = [], cur = '';
      for (var i = 0; i < w.length; i++) { var t = cur ? cur + ' ' + w[i] : w[i]; if (cur && ctx.measureText(t).width > maxW) { rows.push(cur); cur = w[i]; } else cur = t; }
      if (cur) rows.push(cur); return rows;
    }
    function layout(ctx, W, H, m) {
      var lh = Math.max(22, m * 0.052), rows = [], acc = 0, maxW = Math.min(W * 0.86, m * 1.25);
      ctx.save();
      LINES.forEach(function (L) {
        if (L[0] === 'p') {
          ctx.font = FONT.p(m);
          wrap(ctx, L[1], maxW).forEach(function (r) { rows.push({ k: 'p', t: r, y: acc + lh * 0.55 }); acc += lh * 1.1; });
          return;
        }
        // nama-nama di layar sempit: satu nama per baris
        if (L[0] === 'b' && L[1].indexOf('•') >= 0) {
          ctx.font = FONT.b(m);
          if (ctx.measureText(L[1]).width + L[1].length * m * 0.004 > maxW * 0.92) {
            L[1].split('•').forEach(function (n) { rows.push({ k: 'b', t: n.trim(), y: acc + HK.b * lh / 2 }); acc += HK.b * lh; });
            return;
          }
        }
        var k = HK[L[0]] || 1;
        rows.push({ k: L[0], t: L[1], y: acc + k * lh / 2 }); acc += k * lh;
      });
      ctx.font = FONT.note(m);
      var note = wrap(ctx, NOTE, maxW);
      ctx.restore();
      return { rows: rows, total: acc, lh: lh, note: note };
    }
    function draw(ctx, W, H, t, dt) {

      ctx.fillStyle = 'rgba(0,0,0,.42)'; ctx.fillRect(0, 0, W, H);
      var key = W + 'x' + H; if (key !== layKey) { layKey = key; lay = layout(ctx, W, H, m); }
      var lh = lay.lh, endRow = lay.rows[lay.rows.length - 1], scrollEnd = CRED_SEC - 14;
      // gulir sampai nama kapten tepat di tengah layar, lalu berhenti
      var off = U.lerp(H + lh, H * 0.46 - endRow.y, Math.min(1, t / scrollEnd));

      lay.rows.forEach(function (r) {

        var a = r.k === 'end' ? 1 : U.clamp(Math.min((H - y) / (H * 0.15), (y + lh) / (H * 0.22)), 0, 1);
        if (a <= 0.01) return;
        ctx.globalAlpha = a; ctx.font = FONT[r.k](m); ctx.fillStyle = COL[r.k];
        try { ctx.letterSpacing = (r.k === 's' || r.k === 'b') ? (m * 0.004).toFixed(1) + 'px' : '0px'; } catch (e) { }
        ctx.fillText(r.t, W / 2, y);
      });
      // catatan penutup muncul setelah nama kapten berhenti
      var na = sm(scrollEnd + 1, scrollEnd + 3.5, t);
      if (na > 0) {
        ctx.globalAlpha = na; ctx.font = FONT.note(m); ctx.fillStyle = COL.note;
        try { ctx.letterSpacing = '0px'; } catch (e) { }

      }
      ctx.restore();
      blackIn(ctx, W, H, t, 1.5);
    }
    return { draw: draw, intro: CRED_SEC };
  });
