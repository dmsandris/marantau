<script>
/* =====================================================================
 * Seni sinematik Saga 2 · Quest 7 "Malam Tiga Tanda Silang" (MTCine)
 *   ts_sky (Langit Hitam) · ts_vault (Brankas Terbuka) · ts_map (Peta Pengasingan, window.TS_MAP)
 *   ts_candles (Seribu Lilin) · ts_clock (Jam yang Berdetak Semenit) · ts_furnace (Tungku Seribu Gagak)
 *   ts_needle (Jarum yang Berbalik) · ts_fall (Kalau Salah Satu Jatuh) · ts_lanterns (Seribu Lentera)
 *   ts_cut (Jarum Ketiga Patah)
 * Prosedural, ramah layar potret & prefers-reduced-motion. Kematian tanpa kekerasan grafis.
 * ===================================================================== */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTUtil) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  var SUB = 'Malam Tiga Tanda Silang';
  function fadeIn(ctx, W, H, t, d) { if (t < d) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, d, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function ttl(ctx, W, H, a, main, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);
    ctx.save(); ctx.font = fs.toFixed(1) + 'px ' + C.TITLE_FONT; var w = ctx.measureText(main).width * 1.1; ctx.restore();
    var k = Math.min(1, W * 0.9 / Math.max(1, w));
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.translate(-W / 2, -y); C.title(ctx, W, H, a, main, SUB, y); ctx.restore();
  }
  function ttlY(W, H) { return H * (W < H ? 0.14 : 0.12) + Math.min(W * 0.12, H * 0.15) * 0.45; }
  function glow(ctx, x, y, r, col, a) {
    if (a <= 0.004 || r <= 0.5) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + Math.min(1, a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function stars(r, n) { var a = []; for (var i = 0; i < n; i++) a.push({ x: r(), y: Math.pow(r(), 1.6) * 0.6, s: r() < 0.9 ? 1 : 1.7, tw: 0.5 + r() * 2, ph: r() * 6 }); return a; }
  function drawStars(ctx, W, H, st, t, a) { st.forEach(function (s) { var al = a * (0.35 + 0.65 * Math.abs(Math.sin(t * s.tw + s.ph))); ctx.fillStyle = 'rgba(255,250,235,' + al.toFixed(3) + ')'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }); }
  function sea(ctx, W, H, hy, c0, c1, t, lines) {
    var g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    for (var i = 0; i < (lines || 14); i++) { var y = hy + (H - hy) * Math.pow((i + 1) / (lines || 14), 1.6); ctx.beginPath(); for (var x = 0; x <= W; x += 18) ctx.lineTo(x, y + Math.sin(x * 0.02 + t * 1.2 + i) * (1 + i * 0.2)); ctx.stroke(); }
  }
  // gagak mesin hitam (siluet), mata merah
  function crow(ctx, x, y, s, flap, eye, dir) {
    dir = dir || 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.fillStyle = '#060507';
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.42, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.18, s * 0.34, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 1.22, -s * 0.22); ctx.lineTo(s * 1.75, -s * 0.08); ctx.lineTo(s * 1.22, -s * 0.02); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.lineTo(-s * 1.7, s * 0.28); ctx.lineTo(-s * 0.8, s * 0.26); ctx.closePath(); ctx.fill();
    var f = flap;
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.1); ctx.lineTo(-s * 0.9, -s * (0.4 + f * 1.4)); ctx.lineTo(s * 0.5, -s * 0.12); ctx.closePath(); ctx.fill();
    if (eye > 0) { ctx.fillStyle = 'rgba(255,40,30,' + Math.min(1, eye) + ')'; ctx.fillRect(s * 1.0, -s * 0.28, Math.max(1, s * 0.16), Math.max(1, s * 0.16)); }
    ctx.restore();
  }
  function shipDefault(ctx, x, y, s, t, extra) {
    if (!window.MTShip) return;
    var o = { dir: 1, t: t, masts: 2, hull: '#5a3a22', trim: '#c9a441', sail: '#efe4c8', flag: '#a8302a', furl: 0, roll: Math.sin(t * 0.9) * 0.02, lanterns: 0 };
    try { if (window.state && state.shipVisual && MTShip.fromVisual) o = Object.assign(MTShip.fromVisual(state.shipVisual, { t: t }) || o, { dir: 1, t: t, roll: Math.sin(t * 0.9) * 0.02 }); } catch (e) { }
    for (var k in (extra || {})) o[k] = extra[k];
    MTShip.draw(ctx, x, y, s, o);
    if (MTShip.foam) MTShip.foam(ctx, x, y, s, 1, t, 0.2, 0.6);
  }

  /* ---------- Tide v68: helper lokal gambar (tekstur dipanggang sekali per ukuran) ---------- */
  var GSPR = {};
  /** Sprite pendar (radial) per warna, dipakai ulang lewat drawImage (jauh lebih murah dari gradient per frame). */
  function gspr(col) {
    if (GSPR[col]) return GSPR[col];
    var cv = C.mkCv(64, 64), g = cv.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(' + col + ',1)'); gr.addColorStop(0.3, 'rgba(' + col + ',0.36)'); gr.addColorStop(0.65, 'rgba(' + col + ',0.08)'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return (GSPR[col] = cv);
  }
  /** Gambar pendar dari sprite (pemanggil mengatur 'lighter' bila perlu). */
  function gl(ctx, col, x, y, r, a, sy) {
    if (a <= 0.004 || r <= 0.5) return;
    ctx.globalAlpha = Math.min(1, a); ctx.drawImage(gspr(col), x - r, y - r * (sy || 1), r * 2, r * 2 * (sy || 1)); ctx.globalAlpha = 1;
  }
  /** Laut malam bertekstur (alur ombak fBm berperspektif). Kanvas W x (Hh-hy). */
  function seaTex(W, Hh, hy, top, bot, o) {
    o = o || {}; var h = Math.max(2, Math.ceil(Hh - hy)), cv = C.mkCv(W, h), g = cv.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, W, h);
    var q = 3, mw = Math.max(2, Math.ceil(W / q)), mh = Math.max(2, Math.ceil(h / q)), tc = C.mkCv(mw, mh), tg = tc.getContext('2d'), im = tg.createImageData(mw, mh), d = im.data;
    var m = C.fbmMap(o.seed || 301), hl = o.hi || [140, 165, 215], i = 0, ha = o.ha == null ? 0.32 : o.ha, la = o.la == null ? 0.5 : o.la;
    for (var y = 0; y < mh; y++) {
      var dd = (y + 0.5) / mh, pz = 0.06 + dd * 0.94, vz = 30 / pz;
      for (var x = 0; x < mw; x++, i += 4) {
        var uz = (x - mw / 2) / (pz * mw) * 220, n = C.fbmAt(m, uz * 0.35, vz * 2.2) - 0.5, n2 = C.fbmAt(m, uz * 1.3 + 77, vz * 7) - 0.5, v = n * 1.2 + n2 * 0.6, k = 0.35 + 0.65 * dd;
        if (v > 0.08) { d[i] = hl[0]; d[i + 1] = hl[1]; d[i + 2] = hl[2]; d[i + 3] = Math.min(255, (v - 0.08) * ha * k * 255 * 2.4); }
        else if (v < -0.05) { d[i] = 0; d[i + 1] = 2; d[i + 2] = 8; d[i + 3] = Math.min(255, (-v - 0.05) * la * k * 255 * 2); }
      }
    }
    tg.putImageData(im, 0, 0); g.imageSmoothingEnabled = true; g.drawImage(tc, 0, 0, W, h);
    var hz = g.createLinearGradient(0, 0, 0, h * 0.12); hz.addColorStop(0, o.haze || 'rgba(60,72,100,0.5)'); hz.addColorStop(1, 'rgba(60,72,100,0)'); g.fillStyle = hz; g.fillRect(0, 0, W, h * 0.12);
    return cv;
  }
  /** Langit malam dipanggang: gradien + kabut bintang halus + awan gumpal tipis. */
  function skyTex(W, hy, cols, o) {
    o = o || {}; var h = Math.max(2, Math.ceil(hy)), cv = C.mkCv(W, h), g = cv.getContext('2d'), rs = U.rng(o.seed || 515);
    var gr = g.createLinearGradient(0, 0, 0, h); cols.forEach(function (c, k) { gr.addColorStop(k / (cols.length - 1), c); }); g.fillStyle = gr; g.fillRect(0, 0, W, h);
    var n = Math.round(W * h / 2600 * (o.stars == null ? 1 : o.stars));
    for (var k = 0; k < n; k++) { var sy = rs(); g.fillStyle = 'rgba(235,238,255,' + ((0.08 + rs() * 0.3) * (1 - sy * 0.7)).toFixed(3) + ')'; g.fillRect(rs() * W, sy * h * 0.95, 1, 1); }
    (o.clouds || []).forEach(function (c) { g.globalAlpha = c.a; g.drawImage(c.spr, c.x * W, c.y * h, c.w * W, c.w * W * c.spr.height / c.spr.width); });
    g.globalAlpha = 1; return cv;
  }
  /** Api obor kecil berkedip (tanpa pendar). */
  function flame(ctx, x, y, s, t, ph) {
    var f = 0.85 + 0.15 * Math.sin(t * 13 + ph) + 0.08 * Math.sin(t * 29 + ph * 2), w = s * 0.5, hgt = s * 1.5 * f, lean = Math.sin(t * 3 + ph) * s * 0.15;
    ctx.fillStyle = 'rgba(255,150,50,0.9)'; ctx.beginPath(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x - w * 0.9, y - hgt * 0.5, x + lean, y - hgt); ctx.quadraticCurveTo(x + w * 0.9, y - hgt * 0.5, x + w, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,236,170,0.95)'; ctx.beginPath(); ctx.moveTo(x - w * 0.45, y); ctx.quadraticCurveTo(x - w * 0.4, y - hgt * 0.35, x + lean * 0.6, y - hgt * 0.62); ctx.quadraticCurveTo(x + w * 0.4, y - hgt * 0.35, x + w * 0.45, y); ctx.closePath(); ctx.fill();
  }

  /* =========================== LANGIT HITAM =========================== */
  function sceneSky() {
    var r = U.rng(7101), birds = [];
    for (var i = 0; i < 360; i++) birds.push({ u: r(), v: r(), sp: 0.035 + r() * 0.025, s: 0.5 + r() * 0.8, ph: r() * 6 });
    function draw(ctx, W, H, t) {
      var port = W < H, hy = H * (port ? 0.6 : 0.62), dk = sm(0.5, 5, t);
      var sk = ctx.createLinearGradient(0, 0, 0, hy);
      sk.addColorStop(0, U.css(U.mix([70, 40, 70], [10, 8, 16], dk))); sk.addColorStop(0.6, U.css(U.mix([210, 110, 60], [60, 30, 40], dk))); sk.addColorStop(1, U.css(U.mix([250, 180, 100], [90, 50, 40], dk)));
      ctx.fillStyle = sk; ctx.fillRect(0, 0, W, hy);
      glow(ctx, W * 0.22, hy - H * 0.04, H * 0.2, '255,170,90', 0.5 * (1 - dk * 0.7));
      sea(ctx, W, H, hy, U.css(U.mix([120, 70, 60], [30, 22, 28], dk)), '#0a080c', t);
      // sungai gagak di langit, mengalir ke barat (kiri)
      var dens = REDUCE ? 0.4 : sm(1, 3.5, t), band = hy * 0.42, sc = Math.max(2.4, Math.min(W, H) * 0.008);
      for (var j = 0; j < birds.length * dens; j++) {
        var b = birds[j], x = ((b.u - t * b.sp) % 1 + 1) % 1 * (W * 1.2) - W * 0.1;
        var y = band * 0.35 + b.v * band + Math.sin(x * 0.006 + b.ph) * band * 0.25;
        crow(ctx, x, y, sc * b.s, REDUCE ? 0.2 : (Math.sin(t * 10 + b.ph) * 0.5 + 0.5), 0.9, -1);
      }
      // kapal pemain & seekor gagak di tutup palka
      var ss = port ? W * 0.0016 : Math.min(W * 0.0011, H * 0.0017), sx = W * 0.5, sy = hy + (H - hy) * 0.42 + Math.sin(t * 1.3) * 2;
      shipDefault(ctx, sx, sy, ss, t);
      var land = sm(6.5, 8.5, t);
      if (land > 0) {
        var cx = U.lerp(W * 0.9, sx - 10 * ss, land), cy = U.lerp(hy * 0.3, sy - 14 * ss, land) + (land >= 1 && !REDUCE ? Math.abs(Math.sin(t * 7)) * -3 * ss : 0);
        crow(ctx, cx, cy, Math.max(4, 10 * ss), land < 1 ? Math.sin(t * 12) * 0.5 + 0.5 : 0.1, 1, -1);
        glow(ctx, cx - 10 * ss, cy - 3 * ss, 12 * ss, '255,50,40', land >= 1 ? 0.35 + 0.3 * Math.sin(t * 3) : 0);
      }
      C.vignette(ctx, W, H, 0.6);
      ttl(ctx, W, H, sm(2.5, 3.6, t) * (1 - sm(6, 7, t)), 'LANGIT HITAM', ttlY(W, H));
      fadeIn(ctx, W, H, t, 1.2);
    }
    return { draw: draw, intro: 9 };
  }

  /* =========================== BRANKAS TERBUKA =========================== */
  function sceneVault() {
    var r = U.rng(7202), st = stars(r, 120), shards = [], coins = [], flock = [];
    for (var i = 0; i < 40; i++) shards.push({ a: r() * 6.28, v: 0.5 + r() * 1.4, s: 2 + r() * 5, rot: r() * 6 });
    for (var c = 0; c < 140; c++) coins.push({ x: r(), d: r() * 4, v: 0.25 + r() * 0.2, s: 1.6 + r() * 1.6, ph: r() * 6 });
    for (var f = 0; f < 120; f++) flock.push({ o: r(), s: 0.5 + r() * 0.7, ph: r() * 6, dy: r() });
    var mm = C.memo(), gs = {};
    function layout(W, H) {
      var port = W < H, gy = H * (port ? 0.7 : 0.74), bw = Math.min(W * (port ? 0.92 : 0.74), H * (port ? 0.95 : 1.08)), bx = W / 2 - bw / 2, bh = gy * (port ? 0.3 : 0.4), by = gy - bh;
      var stH = bh * 0.1, colTop = by + bh * 0.16, colBot = gy - stH, cw = bw * 0.062, dr = bw * 0.12, dx = W / 2, dy = by - bh * 0.3;
      var cols = [0.06, 0.2, 0.34, 0.66, 0.8, 0.94].map(function (u) { return bx + bw * u; });
      var rr = Math.min(bw * 0.1, (colBot - colTop) * 0.4), vx = W / 2, vy = colBot - rr * 1.08;
      var ty = colTop + (colBot - colTop) * 0.36, torches = [[cols[2] + cw * 0.75, ty], [cols[3] - cw * 0.75, ty], [bx - bw * 0.02, gy - stH * 3.2], [bx + bw * 1.02, gy - stH * 3.2]];
      var L = { port: port, gy: gy, bw: bw, bx: bx, bh: bh, by: by, stH: stH, colTop: colTop, colBot: colBot, cw: cw, dr: dr, dx: dx, dy: dy, rr: rr, vx: vx, vy: vy, torches: torches };
      var cl = [C.puffSprite(733, 300, 100, { sx: 0.9, sy: 0.6, th: 0.34, soft: 0.2, a: 0.7, dark: [12, 16, 32], lite: [70, 84, 120], lx: 4, ly: -6 }), C.puffSprite(751, 300, 100, { sx: 1, sy: 0.6, th: 0.36, soft: 0.2, a: 0.6, dark: [12, 16, 32], lite: [64, 76, 112], lx: 4, ly: -6 })];
      var sky = skyTex(W, gy, ['#04060e', '#0e1426', '#1c2236'], { seed: 7212, clouds: [{ spr: cl[0], x: -0.05, y: 0.06, w: 0.45, a: 0.7 }, { spr: cl[1], x: 0.58, y: 0.14, w: 0.5, a: 0.6 }, { spr: cl[0], x: 0.3, y: 0.32, w: 0.3, a: 0.35 }] });
      var marble = C.wallTex(256, 256, { marble: true, hi: 0.22, lo: 0.45, seed: 861 }), brick = C.wallTex(256, 256, { brick: 9, hi: 0.1, lo: 0.55, streak: 0.4, seed: 877 });
      L.bg = C.bake(W, H, 1, function (g) {
        g.drawImage(sky, 0, 0);
        // drum kubah
        g.fillStyle = '#1b1a20'; g.fillRect(dx - dr * 1.08, dy - dr * 0.04, dr * 2.16, by - dy);
        g.fillStyle = 'rgba(255,190,110,0.18)'; for (var w0 = 0; w0 < 5; w0++) g.fillRect(dx - dr * 0.9 + w0 * dr * 0.4, dy + dr * 0.12, dr * 0.12, (by - dy) * 0.4);
        g.fillStyle = '#2a2722'; g.fillRect(dx - dr * 1.18, dy - dr * 0.1, dr * 2.36, dr * 0.12);
        // dinding belakang bata
        g.fillStyle = '#26221e'; g.fillRect(bx, by, bw, gy - by);
        g.drawImage(brick, bx, by, bw, gy - by);
        // pintu brankas bundar
        var gg = g.createRadialGradient(vx, vy, 0, vx, vy, rr); gg.addColorStop(0, '#5a3d14'); gg.addColorStop(0.6, '#221508'); gg.addColorStop(1, '#0a0705');
        g.fillStyle = gg; g.beginPath(); g.arc(vx, vy, rr, 0, 6.283); g.fill();
        // tumpukan emas di dalam
        g.save(); g.beginPath(); g.arc(vx, vy, rr * 0.98, 0, 6.283); g.clip();
        for (var p = 0; p < 4; p++) { var px = vx - rr * 0.7 + p * rr * 0.45, ph = rr * (0.32 + (p % 2) * 0.16); var pg = g.createLinearGradient(0, vy + rr - ph, 0, vy + rr); pg.addColorStop(0, '#f0c862'); pg.addColorStop(1, '#6a4410'); g.fillStyle = pg; g.beginPath(); g.ellipse(px, vy + rr, rr * 0.38, ph, 0, Math.PI, 0); g.fill(); }
        g.fillStyle = 'rgba(255,240,180,0.6)'; var rg = U.rng(5); for (var cc = 0; cc < 40; cc++) g.fillRect(vx - rr * 0.9 + rg() * rr * 1.8, vy + rr * (0.55 + rg() * 0.4), 1.5, 1);
        g.restore();
        var ring = g.createLinearGradient(vx - rr, vy - rr, vx + rr, vy + rr); ring.addColorStop(0, '#6a7078'); ring.addColorStop(0.5, '#2c3036'); ring.addColorStop(1, '#16181c');
        g.strokeStyle = ring; g.lineWidth = rr * 0.16; g.beginPath(); g.arc(vx, vy, rr * 1.06, 0, 6.283); g.stroke();
        g.fillStyle = '#8a9098'; for (var b = 0; b < 16; b++) { var ba = b / 16 * 6.283; g.beginPath(); g.arc(vx + Math.cos(ba) * rr * 1.06, vy + Math.sin(ba) * rr * 1.06, Math.max(1, rr * 0.025), 0, 6.283); g.fill(); }
        // daun pintu baja terbuka (miring, menghadap kita)
        var ox = vx + rr * 1.42, oy = vy, orx = rr * 0.42, ory = rr * 1.02, dg = g.createLinearGradient(ox - orx, 0, ox + orx, 0);
        dg.addColorStop(0, '#202328'); dg.addColorStop(0.4, '#5a6068'); dg.addColorStop(0.7, '#3a3e45'); dg.addColorStop(1, '#1a1c20');
        g.fillStyle = '#121418'; g.beginPath(); g.ellipse(ox + orx * 0.18, oy, orx, ory, 0, 0, 6.283); g.fill();
        g.fillStyle = dg; g.beginPath(); g.ellipse(ox, oy, orx, ory, 0, 0, 6.283); g.fill();
        g.strokeStyle = 'rgba(20,22,26,0.8)'; g.lineWidth = Math.max(1, rr * 0.03); g.beginPath(); g.ellipse(ox, oy, orx * 0.72, ory * 0.72, 0, 0, 6.283); g.stroke();
        for (var sp = 0; sp < 6; sp++) { var sa = sp / 6 * 6.283; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(sa) * orx * 0.45, oy + Math.sin(sa) * ory * 0.45); g.stroke(); }
        g.fillStyle = '#b8bec6'; g.beginPath(); g.ellipse(ox, oy, orx * 0.12, ory * 0.12, 0, 0, 6.283); g.fill();
        // kolom batu bertekstur
        function colPath(gq) { cols.forEach(function (x) { gq.rect(x - cw / 2, colTop, cw, colBot - colTop); }); }
        cols.forEach(function (x) {
          var cg = g.createLinearGradient(x - cw / 2, 0, x + cw / 2, 0); cg.addColorStop(0, '#18150f'); cg.addColorStop(0.35, '#6a5e4e'); cg.addColorStop(0.55, '#4e4538'); cg.addColorStop(1, '#14110d');
          g.fillStyle = cg; g.fillRect(x - cw / 2, colTop, cw, colBot - colTop);
          g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = Math.max(1, cw * 0.06); for (var fl = 1; fl < 5; fl++) { g.beginPath(); g.moveTo(x - cw / 2 + cw * fl / 5, colTop + 3); g.lineTo(x - cw / 2 + cw * fl / 5, colBot - 3); g.stroke(); }
        });
        C.texFill(g, colPath, marble, bx, colTop, bw, colBot - colTop, 1);
        cols.forEach(function (x) {
          g.fillStyle = '#4a4236'; g.fillRect(x - cw * 0.72, colTop, cw * 1.44, bh * 0.025); g.fillStyle = '#332d25'; g.fillRect(x - cw * 0.6, colTop + bh * 0.025, cw * 1.2, bh * 0.02);
          g.fillStyle = '#3c352b'; g.fillRect(x - cw * 0.66, colBot - bh * 0.03, cw * 1.32, bh * 0.03);
        });
        // entablatur & segitiga atap
