<script>
/* =====================================================================
 * Seni sinematik Saga 2 · Quest 7 "Malam Tiga Tanda Silang" (MTCine)
 *   ts_sky (Langit Hitam) · ts_vault (Brankas Terbuka) · ts_map (Peta Pengasingan, window.TS_MAP)
 *   ts_candles (Seribu Lilin) · ts_clock (Jam yang Berdetak Semenit) · ts_furnace (Tungku Seribu Gagak)
 *   ts_needle (Jarum yang Berbalik) · ts_fall (Kalau Salah Satu Jatuh) · ts_lanterns (Seribu Lentera)
 *   ts_cut (Jarum Ketiga Patah)
 * Prosedural, ramah layar potret & prefers-reduced-motion. Kematian tanpa kekerasan grafis.
 * ===================================================================== */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTUtil) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  var SUB = 'Malam Tiga Tanda Silang';
  function fadeIn(ctx, W, H, t, d) { if (t < d) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, d, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function ttl(ctx, W, H, a, main, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);
    ctx.save(); ctx.font = fs.toFixed(1) + 'px ' + C.TITLE_FONT; var w = ctx.measureText(main).width * 1.1; ctx.restore();
    var k = Math.min(1, W * 0.9 / Math.max(1, w));
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.translate(-W / 2, -y); C.title(ctx, W, H, a, main, SUB, y); ctx.restore();
  }
  function ttlY(W, H) { return H * (W < H ? 0.14 : 0.12) + Math.min(W * 0.12, H * 0.15) * 0.45; }
  function glow(ctx, x, y, r, col, a) {
    if (a <= 0.004 || r <= 0.5) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + Math.min(1, a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function stars(r, n) { var a = []; for (var i = 0; i < n; i++) a.push({ x: r(), y: Math.pow(r(), 1.6) * 0.6, s: r() < 0.9 ? 1 : 1.7, tw: 0.5 + r() * 2, ph: r() * 6 }); return a; }
  function drawStars(ctx, W, H, st, t, a) { st.forEach(function (s) { var al = a * (0.35 + 0.65 * Math.abs(Math.sin(t * s.tw + s.ph))); ctx.fillStyle = 'rgba(255,250,235,' + al.toFixed(3) + ')'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }); }
  function sea(ctx, W, H, hy, c0, c1, t, lines) {
    var g = ctx.createLinearGradient(0, hy, 0, H); g.addColorStop(0, c0); g.addColorStop(1, c1);
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    for (var i = 0; i < (lines || 14); i++) { var y = hy + (H - hy) * Math.pow((i + 1) / (lines || 14), 1.6); ctx.beginPath(); for (var x = 0; x <= W; x += 18) ctx.lineTo(x, y + Math.sin(x * 0.02 + t * 1.2 + i) * (1 + i * 0.2)); ctx.stroke(); }
  }
  // gagak mesin hitam (siluet), mata merah
  function crow(ctx, x, y, s, flap, eye, dir) {
    dir = dir || 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
    ctx.fillStyle = '#060507';
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.42, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.18, s * 0.34, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(s * 1.22, -s * 0.22); ctx.lineTo(s * 1.75, -s * 0.08); ctx.lineTo(s * 1.22, -s * 0.02); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.lineTo(-s * 1.7, s * 0.28); ctx.lineTo(-s * 0.8, s * 0.26); ctx.closePath(); ctx.fill();
    var f = flap;
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.1); ctx.lineTo(-s * 0.9, -s * (0.4 + f * 1.4)); ctx.lineTo(s * 0.5, -s * 0.12); ctx.closePath(); ctx.fill();
    if (eye > 0) { ctx.fillStyle = 'rgba(255,40,30,' + Math.min(1, eye) + ')'; ctx.fillRect(s * 1.0, -s * 0.28, Math.max(1, s * 0.16), Math.max(1, s * 0.16)); }
    ctx.restore();
  }
  function shipDefault(ctx, x, y, s, t, extra) {
    if (!window.MTShip) return;
    var o = { dir: 1, t: t, masts: 2, hull: '#5a3a22', trim: '#c9a441', sail: '#efe4c8', flag: '#a8302a', furl: 0, roll: Math.sin(t * 0.9) * 0.02, lanterns: 0 };
    try { if (window.state && state.shipVisual && MTShip.fromVisual) o = Object.assign(MTShip.fromVisual(state.shipVisual, { t: t }) || o, { dir: 1, t: t, roll: Math.sin(t * 0.9) * 0.02 }); } catch (e) { }
    for (var k in (extra || {})) o[k] = extra[k];
    MTShip.draw(ctx, x, y, s, o);
    if (MTShip.foam) MTShip.foam(ctx, x, y, s, 1, t, 0.2, 0.6);
  }

  /* =========================== LANGIT HITAM =========================== */
  function sceneSky() {
    var r = U.rng(7101), birds = [];
    for (var i = 0; i < 360; i++) birds.push({ u: r(), v: r(), sp: 0.035 + r() * 0.025, s: 0.5 + r() * 0.8, ph: r() * 6 });
    function draw(ctx, W, H, t) {
      var port = W < H, hy = H * (port ? 0.6 : 0.62), dk = sm(0.5, 5, t);
      var sk = ctx.createLinearGradient(0, 0, 0, hy);
      sk.addColorStop(0, U.css(U.mix([70, 40, 70], [10, 8, 16], dk))); sk.addColorStop(0.6, U.css(U.mix([210, 110, 60], [60, 30, 40], dk))); sk.addColorStop(1, U.css(U.mix([250, 180, 100], [90, 50, 40], dk)));
      ctx.fillStyle = sk; ctx.fillRect(0, 0, W, hy);
      glow(ctx, W * 0.22, hy - H * 0.04, H * 0.2, '255,170,90', 0.5 * (1 - dk * 0.7));
      sea(ctx, W, H, hy, U.css(U.mix([120, 70, 60], [30, 22, 28], dk)), '#0a080c', t);
      // sungai gagak di langit, mengalir ke barat (kiri)
      var dens = REDUCE ? 0.4 : sm(1, 3.5, t), band = hy * 0.42, sc = Math.max(2.4, Math.min(W, H) * 0.008);
      for (var j = 0; j < birds.length * dens; j++) {
        var b = birds[j], x = ((b.u - t * b.sp) % 1 + 1) % 1 * (W * 1.2) - W * 0.1;
        var y = band * 0.35 + b.v * band + Math.sin(x * 0.006 + b.ph) * band * 0.25;
        crow(ctx, x, y, sc * b.s, REDUCE ? 0.2 : (Math.sin(t * 10 + b.ph) * 0.5 + 0.5), 0.9, -1);
      }
      // kapal pemain & seekor gagak di tutup palka
      var ss = port ? W * 0.0016 : Math.min(W * 0.0011, H * 0.0017), sx = W * 0.5, sy = hy + (H - hy) * 0.42 + Math.sin(t * 1.3) * 2;
      shipDefault(ctx, sx, sy, ss, t);
      var land = sm(6.5, 8.5, t);
      if (land > 0) {
        var cx = U.lerp(W * 0.9, sx - 10 * ss, land), cy = U.lerp(hy * 0.3, sy - 14 * ss, land) + (land >= 1 && !REDUCE ? Math.abs(Math.sin(t * 7)) * -3 * ss : 0);
        crow(ctx, cx, cy, Math.max(4, 10 * ss), land < 1 ? Math.sin(t * 12) * 0.5 + 0.5 : 0.1, 1, -1);
        glow(ctx, cx - 10 * ss, cy - 3 * ss, 12 * ss, '255,50,40', land >= 1 ? 0.35 + 0.3 * Math.sin(t * 3) : 0);
      }
      C.vignette(ctx, W, H, 0.6);
      ttl(ctx, W, H, sm(2.5, 3.6, t) * (1 - sm(6, 7, t)), 'LANGIT HITAM', ttlY(W, H));
      fadeIn(ctx, W, H, t, 1.2);
    }
    return { draw: draw, intro: 9 };
  }

  /* =========================== BRANKAS TERBUKA =========================== */
  function sceneVault() {
    var r = U.rng(7202), st = stars(r, 120), shards = [], coins = [], flock = [];
    for (var i = 0; i < 40; i++) shards.push({ a: r() * 6.28, v: 0.5 + r() * 1.4, s: 2 + r() * 5, rot: r() * 6 });
    for (var c = 0; c < 140; c++) coins.push({ x: r(), d: r() * 4, v: 0.25 + r() * 0.2, s: 1.6 + r() * 1.6, ph: r() * 6 });
    for (var f = 0; f < 120; f++) flock.push({ o: r(), s: 0.5 + r() * 0.7, ph: r() * 6, dy: r() });
    function draw(ctx, W, H, t) {
      var port = W < H, gy = H * (port ? 0.7 : 0.74);
      var sk = ctx.createLinearGradient(0, 0, 0, gy); sk.addColorStop(0, '#060912'); sk.addColorStop(1, '#1a2238');
      ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H); drawStars(ctx, W, H, st, t, 0.8);
      // bank kolonial
      var bw = Math.min(W * 0.7, H * 0.9), bx = W / 2 - bw / 2, bh = gy * 0.32, by = gy - bh;
      ctx.fillStyle = '#14141c'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#1c1c26'; for (var k = 0; k < 7; k++) ctx.fillRect(bx + bw * (0.06 + k * 0.145), by + bh * 0.12, bw * 0.04, bh * 0.88);
      ctx.fillStyle = '#101018'; ctx.beginPath(); ctx.moveTo(bx - bw * 0.04, by); ctx.lineTo(W / 2, by - bh * 0.35); ctx.lineTo(bx + bw * 1.04, by); ctx.closePath(); ctx.fill();
      var dx = W / 2, dy = by - bh * 0.32, dr = bw * 0.13, br = sm(1.4, 1.8, t);
      if (br < 1) { ctx.fillStyle = 'rgba(150,190,230,.35)'; ctx.beginPath(); ctx.arc(dx, dy, dr, Math.PI, 0); ctx.fill(); ctx.strokeStyle = 'rgba(200,220,240,.6)'; ctx.stroke(); }
      else { ctx.strokeStyle = 'rgba(200,220,240,.35)'; ctx.beginPath(); ctx.arc(dx, dy, dr, Math.PI, Math.PI * 1.3); ctx.stroke(); ctx.beginPath(); ctx.arc(dx, dy, dr, Math.PI * 1.75, 0); ctx.stroke(); }
      if (t > 1.4 && t < 4.5) shards.forEach(function (s) { var tt = t - 1.4, x = dx + Math.cos(s.a) * s.v * tt * dr * 1.6, y = dy - dr * 0.4 + Math.sin(s.a) * s.v * tt * dr - (s.v * 30 - 40 * tt) * tt * 0.6; ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot + tt * 4); ctx.fillStyle = 'rgba(190,220,245,' + (0.8 * (1 - tt / 3.1)).toFixed(3) + ')'; ctx.fillRect(-s.s / 2, -s.s / 2, s.s, s.s * 0.4); ctx.restore(); });
      // gagak masuk lewat kubah (t 1.6-4), lalu keluar membawa sesuatu (t 8+)
      var sc = Math.max(2.2, Math.min(W, H) * 0.007);
      flock.forEach(function (b, i) {
        var tin = (t - 1.6 - b.o * 2.2) / 1.4, tout = (t - 8 - b.o * 2) / 3;
        if (tin > 0 && tin < 1) { var x = U.lerp(W * (1.05 + b.dy * 0.2), dx, tin), y = U.lerp(H * (0.05 + b.dy * 0.2), dy, tin); crow(ctx, x, y, sc * b.s, Math.sin(t * 11 + b.ph) * 0.5 + 0.5, 0.9, -1); }
        if (tout > 0 && tout < 1.2) { var x2 = U.lerp(dx, W * 1.1, tout), y2 = U.lerp(dy, H * (0.04 + b.dy * 0.15), tout); crow(ctx, x2, y2, sc * b.s, Math.sin(t * 11 + b.ph) * 0.5 + 0.5, 0.9, 1); if (i === 0) glow(ctx, x2 + sc * 2, y2 + sc, sc * 3, '255,230,150', 0.8); }
      });
      // hujan emas di pasar pantai
      var rain = sm(4, 4.6, t) * (1 - sm(9.5, 11, t));
      if (rain > 0.01) coins.forEach(function (c) { var y = ((t - 4 - c.d) * c.v * H) ; if (y < 0 || y > gy + 4) return; var x = W * (0.08 + c.x * 0.84); ctx.fillStyle = 'rgba(240,200,90,' + rain.toFixed(3) + ')'; ctx.beginPath(); ctx.ellipse(x, y, c.s, c.s * Math.abs(Math.sin(t * 6 + c.ph)) + 0.4, 0, 0, 6.3); ctx.fill(); });
      ctx.fillStyle = '#0c0a0c'; ctx.fillRect(0, gy, W, H - gy);
      // warga berebut di bawah hujan emas
      for (var p = 0; p < 14; p++) { var px = W * (0.05 + p * 0.068), ph = H * 0.05 * (0.8 + (p % 3) * 0.15), arm = rain > 0.1 ? Math.sin(t * 5 + p) * 0.4 + 0.6 : 0; ctx.fillStyle = '#050406'; ctx.fillRect(px - ph * 0.12, gy - ph, ph * 0.24, ph); ctx.beginPath(); ctx.arc(px, gy - ph - ph * 0.12, ph * 0.13, 0, 6.3); ctx.fill(); ctx.strokeStyle = '#050406'; ctx.lineWidth = Math.max(1.5, ph * 0.07); ctx.beginPath(); ctx.moveTo(px, gy - ph * 0.8); ctx.lineTo(px + ph * 0.25, gy - ph * (0.8 + arm * 0.5)); ctx.stroke(); }
      C.vignette(ctx, W, H, 0.55);
      ttl(ctx, W, H, sm(0.5, 1.4, t) * (1 - sm(3, 4, t)), 'BRANKAS TERBUKA', ttlY(W, H));
      fadeIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 12 };
  }

  /* =========================== PETA PENGASINGAN =========================== */
  var ISLES = [[25, 55], [60, 30], [75, 75], [45, 15], [15, 80], [50, 62], [79, 21], [88, 50], [135, 40]];
  var NEW = { otoland: [110, 28, 'OTOLAND'], empeer: [118, 62, "EM PE'ER DE PE'ER"], freeyork: [150, 75, 'FREEYORK'] };
  var ORDER = ['otoland', 'empeer', 'freeyork'];
  function blob(r, n) { var p = []; for (var i = 0; i < n; i++) p.push(0.75 + r() * 0.5); return p; }
  function drawBlob(ctx, x, y, rad, pts, fill, stroke) {
    ctx.beginPath();
    for (var i = 0; i <= pts.length; i++) { var a = i / pts.length * 6.283, k = pts[i % pts.length]; var px = x + Math.cos(a) * rad * k, py = y + Math.sin(a) * rad * k * 0.8; if (!i) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  }
  function sceneMap() {
    var r = U.rng(7303), shapes = ISLES.map(function () { return blob(r, 12); }), ns = {}, fog = [];
    ORDER.forEach(function (k) { ns[k] = blob(r, 12); });
    for (var i = 0; i < 18; i++) fog.push({ x: 0.58 + r() * 0.42, y: r(), rr: 0.05 + r() * 0.08, ph: r() * 6 });
    function draw(ctx, W, H, t) {
      var which = window.TS_MAP || 'otoland', idx = ORDER.indexOf(which), port = W < H;
      ctx.fillStyle = '#1e130b'; ctx.fillRect(0, 0, W, H);
      var ph = H * (port ? 0.42 : 0.62), pw = W * 0.92, px = W * 0.04, py = H * (port ? 0.3 : 0.2);
      var pg = ctx.createLinearGradient(0, py, 0, py + ph); pg.addColorStop(0, '#efe0b9'); pg.addColorStop(1, '#d6bf8c');
      ctx.fillStyle = pg; ctx.fillRect(px, py, pw, ph);
      var M = Math.min(pw, ph) * 0.06;
      function mx(v) { return px + M + v / 170 * (pw - M * 2); }
      function my(v) { return py + M + v / 100 * (ph - M * 2); }
      var ir = Math.min(pw / 170 * 6.5, ph * 0.055);
      ctx.save(); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
      ISLES.forEach(function (c, k) { drawBlob(ctx, mx(c[0]), my(c[1]), ir, shapes[k], '#b9b07a', 'rgba(74,54,32,.8)'); });
      // tiga lingkaran tinta pudar
      ORDER.forEach(function (k, j) {
        var n = NEW[k], x = mx(n[0]), y = my(n[1]);
        ctx.strokeStyle = 'rgba(120,40,30,.55)'; ctx.lineWidth = 1.6; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.ellipse(x, y, ir * 2.2, ir * 1.8, 0, 0, 6.3); ctx.stroke(); ctx.setLineDash([]);
        if (j < idx) drawBlob(ctx, x, y, ir, ns[k], '#c9b57a', 'rgba(74,54,32,.8)');
      });
      // kabut "Belum Dipetakan"
      var clear = sm(1.2, 4.2, t), tx = mx(NEW[which][0]), tyy = my(NEW[which][1]);
      fog.forEach(function (f) {
        var fx = px + pw * f.x, fy = py + ph * f.y, d = Math.hypot(fx - tx, fy - tyy), k = d < pw * 0.14 ? 1 - clear : 1;
        var g = ctx.createRadialGradient(fx, fy, 0, fx, fy, pw * f.rr); g.addColorStop(0, 'rgba(250,244,228,' + (0.85 * k).toFixed(3) + ')'); g.addColorStop(1, 'rgba(250,244,228,0)');
        ctx.fillStyle = g; ctx.fillRect(fx - pw * f.rr, fy - pw * f.rr, pw * f.rr * 2, pw * f.rr * 2);
      });
      var ga = sm(3, 5, t);
      if (ga > 0) {
        ctx.globalAlpha = ga;
        glow(ctx, tx, tyy, ir * 5, '255,120,70', 0.3 + 0.12 * Math.sin(t * 3));
        drawBlob(ctx, tx, tyy, ir * 1.05, ns[which], '#c9a06a', 'rgba(120,30,20,.9)');
        ctx.fillStyle = '#5a1410'; ctx.font = '700 ' + Math.max(10, ir * 1.1).toFixed(0) + 'px Cinzel, Georgia, serif'; ctx.textAlign = 'center';
        ctx.fillText(NEW[which][2], tx, tyy + ir * 2.7);
        ctx.globalAlpha = 1;
      }
      // tulisan tangan Nansy di pojok
      ctx.fillStyle = 'rgba(90,50,30,.75)'; ctx.font = 'italic ' + Math.max(10, ir * 0.95).toFixed(0) + 'px Georgia, serif'; ctx.textAlign = 'left';
      ctx.fillText('Jalan pulang kita…', px + M, py + ph - M * 0.6);
      ctx.restore();
      ctx.strokeStyle = 'rgba(60,36,12,.6)'; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
      C.vignette(ctx, W, H, 0.6);
      ttl(ctx, W, H, sm(5, 6.2, t), 'PETA PENGASINGAN', ttlY(W, H));
      fadeIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 7 };
  }

  /* =========================== GEDUNG KUBAH (dipakai dua adegan) =========================== */
  function dome(ctx, W, H, gy, lit) {
    var cx = W / 2, bw = Math.min(W * 0.55, H * 0.7), bh = bw * 0.2, by = gy - bh;
    ctx.fillStyle = '#121014'; ctx.fillRect(cx - bw / 2, by, bw, bh);
    ctx.fillStyle = 'rgba(255,190,110,' + (0.35 * lit).toFixed(3) + ')';
    for (var k = 0; k < 9; k++) ctx.fillRect(cx - bw / 2 + bw * (0.06 + k * 0.105), by + bh * 0.25, bw * 0.05, bh * 0.6);
    // dua setengah kubah hijau yang terbelah (seperti punggung kura-kura)
    ctx.fillStyle = '#1c3a2c';
    ctx.beginPath(); ctx.moveTo(cx - bw * 0.03, by); ctx.ellipse(cx - bw * 0.03, by, bw * 0.42, bh * 1.25, 0, Math.PI, Math.PI * 1.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + bw * 0.03, by); ctx.ellipse(cx + bw * 0.03, by, bw * 0.42, bh * 1.25, 0, Math.PI * 1.5, Math.PI * 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,160,.18)'; ctx.lineWidth = 1;
    for (var rb = 1; rb < 5; rb++) { ctx.beginPath(); ctx.ellipse(cx - bw * 0.03, by, bw * 0.42 * rb / 5, bh * 1.25, 0, Math.PI, Math.PI * 1.5); ctx.stroke(); ctx.beginPath(); ctx.ellipse(cx + bw * 0.03, by, bw * 0.42 * rb / 5, bh * 1.25, 0, Math.PI * 1.5, Math.PI * 2); ctx.stroke(); }
    return { cx: cx, by: by, bw: bw, bh: bh, clock: { x: cx, y: by + bh * 0.1, r: bw * 0.05 } };
  }
  function stairPts(W, H, top, bot, n) {
    var a = [];
    for (var i = 0; i < n; i++) { var f = i / (n - 1), y = U.lerp(bot, top, Math.pow(f, 0.8)), hw = U.lerp(W * 0.22, W * 0.05, f); a.push({ f: f, y: y, xl: W / 2 - hw, xr: W / 2 + hw }); }
    return a;
  }
  function clockDraw(ctx, c, minute) {
    ctx.fillStyle = '#c9a441'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 1.15, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#efe6d2'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 6.3); ctx.fill();
    var ah = (11 + minute / 60) / 12 * 6.283 - Math.PI / 2, am = minute / 60 * 6.283 - Math.PI / 2;
    ctx.strokeStyle = '#2a1a10'; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.5, c.r * 0.12);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(ah) * c.r * 0.5, c.y + Math.sin(ah) * c.r * 0.5); ctx.stroke();
    ctx.lineWidth = Math.max(1, c.r * 0.07); ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + Math.cos(am) * c.r * 0.8, c.y + Math.sin(am) * c.r * 0.8); ctx.stroke(); ctx.lineCap = 'butt';
  }
  function sceneCandles() {
    var r = U.rng(7404), st = stars(r, 140);
    function draw(ctx, W, H, t) {
      var port = W < H, gy = H * (port ? 0.42 : 0.5);
      var sk = ctx.createLinearGradient(0, 0, 0, H); sk.addColorStop(0, '#04050a'); sk.addColorStop(1, '#141826');
      ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H); drawStars(ctx, W, H, st, t, 0.8);
      var D = dome(ctx, W, H, gy, sm(4, 6, t));
