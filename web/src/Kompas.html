<style>
  /* ================= Saga 2 · Quest 5 "Kompas yang Berputar" ================= */
  .kp-wrap { margin: 10px 0 14px; display: grid; gap: 10px; }
  .kp-csvg { width: 100%; height: 100%; display: block; }
  .kp-csvg .kp-needle { transform-box: view-box; transform-origin: 20px 20px; }
  .kp-spin .kp-needle { animation: kpSpin 2.2s cubic-bezier(.45,.05,.55,.95) infinite; }
  .kp-fixed .kp-needle { transform: rotate(128deg); }
  .kp-fixed.kp-tremble .kp-needle { animation: kpTremble 3.4s ease-in-out infinite; }
  @keyframes kpSpin { 0% { transform: rotate(0deg); } 35% { transform: rotate(250deg); } 55% { transform: rotate(205deg); } 100% { transform: rotate(720deg); } }
  @keyframes kpTremble { 0%, 100% { transform: rotate(126deg); } 50% { transform: rotate(131deg); } }
  .kp-ico { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; }
  .kp-journal { position: relative; background: linear-gradient(180deg, rgba(18,44,58,.07), rgba(255,250,240,.78)); border-color: rgba(30,90,110,.45); }
  .kp-journal .qg-jh .kp-ico { width: 18px; height: 18px; }
  .kp-journal .legend-tag { background: #12323e; color: #d9f3ff; border: 1px solid #2f6a7e; border-radius: 99px; padding: 2px 8px; }
  .kp-star { margin: 6px 0; padding: 7px 10px; border-radius: 10px; background: #13283a; color: #dcefff; font-size: .86em; display: flex; gap: 8px; align-items: center; }
  .kp-star .ico { width: 16px; height: 16px; color: #ffe39a; flex: none; }
  /* kartu kedatangan (badai magnet) */
  .kp-arrive { position: relative; overflow: hidden; border-radius: 16px; padding: 16px; color: #e3f2f8;
    background: radial-gradient(ellipse at 50% 120%, #1f5a70 0%, #0f2c3c 50%, #050e16 100%); border: 1px solid rgba(120,200,230,.4); box-shadow: 0 12px 30px -14px rgba(0,30,50,.8); }
  .kp-arrive::before { content: ''; position: absolute; inset: -40%; background: conic-gradient(from 0deg, transparent 0 18%, rgba(140,220,255,.10) 24%, transparent 30% 58%, rgba(180,150,255,.08) 64%, transparent 70%); animation: kpSwirl 16s linear infinite; pointer-events: none; }
  .kp-arrive > * { position: relative; z-index: 1; }
  .kp-arrive .kpa-row { display: flex; gap: 14px; align-items: center; }
  .kp-arrive .kpa-c { width: 64px; height: 64px; flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  .kp-arrive h3 { margin: 0 0 4px; font-family: var(--font-display); color: #f2fbff; font-size: 1.12em; }
  .kp-arrive p { margin: .35em 0; line-height: 1.55; color: #cfe6ef; }
  .kp-arrive b { color: #ffe7a3; }
  .kp-arrive .qg-card { color: initial; margin-top: 10px; }
  @keyframes kpSwirl { to { transform: rotate(360deg); } }
  /* narasi */
  .kp-narr { padding: 14px 16px; border-radius: 14px; background: linear-gradient(180deg, #f7fbfc, #e2eef0); border: 1px solid rgba(40,100,120,.35); color: #22404a; line-height: 1.6; animation: qgIn .45s var(--ease-spring); }
  .kp-narr .kn-k { font-family: var(--font-title); letter-spacing: .14em; text-transform: uppercase; font-size: .7em; color: #2f6a7e; display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .kp-narr .kn-k .ico { width: 14px; height: 14px; }
  .kp-narr p { margin: .45em 0; }
  .kp-narr.bronze { background: linear-gradient(180deg, #fff8ea, #f1dcb2); border-color: rgba(150,100,40,.45); color: #4a3218; }
  .kp-narr.bronze .kn-k { color: #8f6522; }
  .kp-narr.deep { background: radial-gradient(ellipse at 50% 0%, #1a3346, #08131c); border-color: rgba(120,200,230,.4); color: #d8ecf4; }
  .kp-narr.deep .kn-k { color: #8fd6f0; } .kp-narr.deep b { color: #ffe7a3; }
  /* pilihan jujur/bohong */
  .kp-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .kp-choice button { all: unset; cursor: pointer; display: grid; gap: 6px; padding: 14px; border-radius: 14px; text-align: left; transition: transform .15s, box-shadow .15s; }
  .kp-choice button:hover, .kp-choice button:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 22px -10px rgba(0,0,0,.6); outline: 2px solid rgba(255,210,122,.6); }
  .kp-choice button[disabled] { opacity: .5; pointer-events: none; }
  .kp-choice .truth { background: linear-gradient(160deg, #fff6dc, #f0d79a); color: #3a2410; border: 1px solid #c9a033; }
  .kp-choice .lie { background: linear-gradient(160deg, #222833, #0b0e14); color: #e3e8f0; border: 1px solid #4a5568; }
  .kp-choice b { font-family: var(--font-display); font-size: 1.12em; display: flex; gap: 8px; align-items: center; }
  .kp-choice b .ico { width: 18px; height: 18px; }
  .kp-choice span { font-size: .86em; line-height: 1.45; opacity: .92; }
  .kp-quote { margin: 4px 0; padding: 18px 20px; border-radius: 14px; background: radial-gradient(circle at 50% 0%, #10283a, #04090e); color: #e6f3f8; border: 1px solid rgba(232,191,85,.45); font-family: Georgia, serif; font-style: italic; line-height: 1.7; font-size: 1.06em; text-align: center; }
  .kp-quote cite { display: block; margin-top: 10px; font-style: normal; font-family: var(--font-title); letter-spacing: .12em; font-size: .72em; color: #f0cf78; text-transform: uppercase; }
  .kp-reward-c { width: 34px; height: 34px; flex: none; }
  .chip.kp-chip { background: rgba(14,48,62,.66); border-color: rgba(140,220,255,.5); color: #e6f8ff; }
  .chip.kp-chip .kp-ico { width: 14px; height: 14px; margin-right: 4px; vertical-align: -2px; }
  .chip.kp-chip.storm { background: rgba(40,40,60,.75); }
  .kp-sailnote { margin: 6px 0 10px; }
  /* overlay sinematik: tombol lewati */
  .kp-cine .kp-skip { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); z-index: 2; background: rgba(8,14,20,.55); color: #e8f0f4;
    border: 1px solid rgba(160,210,230,.45); border-radius: 999px; padding: 6px 14px; font: 600 12px "Cinzel", Georgia, serif; letter-spacing: 1px; cursor: pointer; opacity: 0; transition: opacity .6s; }
  .kp-cine .kp-skip.on { opacity: .85; }
  .kp-cine .kp-skip:hover, .kp-cine .kp-skip:focus-visible { opacity: 1; outline: none; border-color: #e8c878; }
  .kp-fallback { text-align: center; }
  @media (max-width: 640px) { .kp-choice { grid-template-columns: 1fr; } .kp-arrive .kpa-c { width: 52px; height: 52px; } }
  @media (prefers-reduced-motion: reduce) {
    .kp-spin .kp-needle, .kp-fixed.kp-tremble .kp-needle, .kp-arrive::before { animation: none; }
    .kp-spin .kp-needle { transform: rotate(200deg); }
  }
</style>
<script>
/* =====================================================================
 * Saga 2 · QUEST 5 "KOMPAS YANG BERPUTAR" (klien)
 * Badai "Laut Terbalik" -> terdampar di TooGood (juru mudi, gosip, Adu Gasing dwi) ->
 * 3 pelayaran tersesat (rahasia) -> Jaring Angin -> Marie Regal (pelikan, Marlya di Istana Hening) ->
 * IKN (Tedsky mengecat Garuda, jaminan 50.000, jujur/bohong) -> Istana Hening: Tari Genderang ->
 * "Utara Kembali" -> puff -> Kompas Tedsky, 150.000 gold, Penjinak Kutub.
 * Server: 0023_kompas.sql (api_kompas)   Mini-game: Saga2Games.html (MTGames2)
 * Seni: sinematik MTCine kp_storm, kp_pelican, kp_north, kp_puff (didaftarkan di bawah)
 * Modul ini MEMBUNGKUS fungsi inti (applyFreshState_, setModal_, openPanel, doSetSail, showToast,
 * npc_, rumors_, walkerLine_, renderScene, renderSetSailWith_, renderItemsWith_) - inti tidak diubah.
 * ===================================================================== */
var KP = (function () {
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }

  /* ---------- tokoh ---------- */
  function apOf(seed, role, fem, over) { var a = MTFace.npc(seed, role, fem); for (var k in (over || {})) a[k] = over[k]; return a; }
  var NN = null;
  function N() {
    if (NN) return NN;
    var BN = {}, QN = {}, WN = {};
    try { BN = window.BX && BX.N ? BX.N() : {}; } catch (e) { BN = {}; }
    try { QN = window.QT ? QT.N : {}; } catch (e) { QN = {}; }
    try { WN = window.WW && WW.N ? WW.N() : {}; } catch (e) { WN = {}; }
    var dwi = QN.dwi || BN.dwi || { name: "dwi de'clown", ap: apOf('dwi', 'lapau', 0), clown: true };
    var ted = QN.tedsky || BN.tedsky || { name: 'Jendral Tedsky', ap: apOf('tedsky', 'syahbandar', 0), medals: true };
    var mar = WN.ratu || BN.marlya || { name: 'Marlya', ap: apOf('marlya-moramora', 'pustakawan', 1) };
    NN = {
      dwi: { name: "dwi de'clown", title: "Penjaga Black's Alley", ap: dwi.ap, clown: true },
      tedsky: { name: 'Jendral Tedsky', title: 'Terpidana, tukang cat Garuda', ap: ted.ap, medals: true, paint: true },
      tedskyShip: { name: 'Jendral Tedsky', title: 'Perancang mekanisme kutub', ap: ted.ap, medals: true },
      marlya: { name: 'Marlya', title: 'Ratu Moramora', ap: mar.ap, svg: mar.svg },
      juru: { name: 'Juru Mudi', title: 'Awak kapalmu', ap: apOf('juru-mudi-kapal', 'tukang', 0, { head: 'iket', age: 0.5 }) },
      petugas: { name: 'Petugas IKN', title: 'Pemerintah IKN', ap: apOf('petugas-ikn-jaminan', 'syahbandar', 0, { age: 0.45 }) },
      gala: window.QG && QG.gala ? QG.gala : (BN.gala || { name: 'Uda Gala', ap: apOf('gala', 'tukang', 0) })
    };
    return NN;
  }
  // percikan cat perunggu di potret Tedsky
  var PAINT = '<g opacity=".9"><circle cx="30" cy="70" r="3.4" fill="#b8843a"/><circle cx="35" cy="76" r="1.8" fill="#c99448"/><circle cx="66" cy="60" r="2.4" fill="#a8742e"/>' +
    '<path d="M58 86 q4 -3 9 0 q-2 4 -9 0z" fill="#b8843a"/><circle cx="44" cy="31" r="1.6" fill="#c99448"/><circle cx="71" cy="83" r="2.8" fill="#9a6a28"/></g>';
  function face(n) {
    if (n.svg) return n.svg;
    var s = MTFace.svg(n.ap, { bgColors: ['#3c5a66', '#0e1c24'], fat: n.fat, clown: n.clown, medals: n.medals });
    if (n.paint) s = s.replace(/<\/svg>\s*$/, PAINT + '</svg>');
    return s;
  }

  /* ---------- pembantu ---------- */
  function st() { return (state && state.kompas) || null; }
  function step() { var s = st(); return s ? (s.step || 0) : -1; }
  function active() { var k = step(); return k >= 1 && k <= 7; }
  function done() { var s = st(); return !!(s && (s.done || s.step >= 8)); }
  function cid() { return state && state.city ? state.city.CityId : ''; }
  function docked() { return !(state && state.voyage && state.voyage.inTransit); }
  function pname() { return (state && state.player && state.player.characterName) || 'Kapten'; }
  function uname() { return (state && (state.username || (state.player && state.player.characterName))) || 'x'; }
  function inCombat() { return typeof combatSceneOpen !== 'undefined' && combatSceneOpen; }
  var gameOpen = false;
  function busyUi() { return gameOpen || inCombat() || !!document.querySelector('.qt-cine, .bx-crd, .bx-credits, .mtg.on'); }
  function seenKey(k) { return 'kp:' + uname() + ':' + k; }
  function seen(k) { try { return localStorage.getItem(seenKey(k)) === '1'; } catch (e) { return false; } }
  function markSeen(k) { try { localStorage.setItem(seenKey(k), '1'); } catch (e) { } }
  function gold() { return state && state.player ? (state.player.gold || 0) : 0; }
  function fmt(n) { return typeof formatGold === 'function' ? formatGold(n) : String(n); }

  var svgSeq = 0;
  function compassSvg(cls) {
    var gid = 'kpBr' + (++svgSeq);
    return '<svg viewBox="0 0 40 40" class="kp-csvg ' + (cls || 'kp-spin') + '" aria-hidden="true"><defs><radialGradient id="' + gid + '" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff1c4"/><stop offset=".5" stop-color="#d3a342"/><stop offset="1" stop-color="#6e4a14"/></radialGradient></defs>' +
      '<circle cx="20" cy="20" r="18.5" fill="url(#' + gid + ')"/><circle cx="20" cy="20" r="14.6" fill="#f6ecd2" stroke="#7a5313" stroke-width=".8"/>' +
      '<g stroke="#8a6a3a" stroke-width=".7"><path d="M20 6.5v2.4M20 31.1v2.4M6.5 20h2.4M31.1 20h2.4"/><path d="M10.4 10.4l1.2 1.2M28.4 28.4l1.2 1.2M29.6 10.4l-1.2 1.2M11.6 28.4l-1.2 1.2" stroke-width=".5"/></g>' +
      '<text x="20" y="13.2" text-anchor="middle" font-family="Georgia,serif" font-size="5" font-weight="700" fill="#7a2a1a">N</text>' +
      '<g class="kp-needle"><path d="M20 8.6 L22.4 20 L20 21.4 L17.6 20Z" fill="#b3261e"/><path d="M20 31.4 L22.4 20 L20 18.6 L17.6 20Z" fill="#2a2a2e"/></g>' +
      '<circle cx="20" cy="20" r="1.5" fill="#7a5313"/><path d="M9 14 A13 13 0 0 1 18 7.4" fill="none" stroke="#fff" stroke-width="1.2" opacity=".55" stroke-linecap="round"/></svg>';
  }
  function cico(cls) { return '<span class="kp-ico">' + compassSvg(cls || 'kp-spin') + '</span>'; }
  function speech(n, text, extra, title) {
    return '<div class="qg-card"><div class="qg-face">' + face(n) + '</div><div class="qg-body"><div class="qg-name">' + esc_(n.name) + ' <span>&middot; ' + esc_(title || n.title || '') + '</span></div>' +
      '<div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function narr(kicker, text, extra, icon, cls) {
    return '<div class="kp-narr ' + (cls || '') + '"><div class="kn-k">' + ic(icon || 'compass') + esc_(kicker || '') + '</div>' + text + (extra || '') + '</div>';
  }
  function actions(btns) { return '<div class="qg-actions">' + btns + '</div>'; }
  function dots(i, n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="' + (k === i ? 'on' : '') + '"></i>'; return '<div class="qt-dots">' + h + '</div>'; }
  function quiet(c) { (c || document.getElementById('modalContent') || document).querySelectorAll('.ww-wrap, .qt-wrap, .bx-wrap').forEach(function (e) { e.remove(); }); }
  function insert(html, opts) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    if (c.querySelector('.kp-wrap')) return null;
    if (opts && opts.quiet) quiet(c);
    var anchor = opts && opts.top ? c.querySelector('.ph') : (c.querySelector('.bx-wrap') || c.querySelector('.qt-wrap') || c.querySelector('.ww-wrap') || c.querySelector('.qg-wrap') || c.querySelector('.npc') || c.querySelector('.ph'));
    var wrap = document.createElement('div'); wrap.className = 'kp-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function call(action, arg, ok, btn, fail) {
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      r = r || {};
      if (r.kompas !== undefined && state) { state.kompas = r.kompas; prevStep = r.kompas ? (r.kompas.step || 0) : null; }
      if (r.newGold != null && typeof patchGold_ === 'function') { patchGold_(r.newGold); if (typeof renderSidebar === 'function') try { renderSidebar(); } catch (e) { } }
      try { ok(r); } catch (e) { console.warn('[KP]', action, e); }
    }).withFailureHandler(function (e) {
      if (btn) btn.disabled = false;
      showToast((e && e.message) || String(e), 'error');
      if (fail) fail(e);
    }).api_kompas(action, arg || '');
  }
  function pages(w, n, list, lastBtns, bind, title) {
    var i = 0;
    function show() {
      var last = i === list.length - 1, pg = list[i], who = (pg && pg.n) || n, txt = (pg && pg.t) || pg;
      var nav = actions(last ? lastBtns : '<button class="btn btn-gold" data-kp="next">Lanjut &nbsp;' + ic('compass') + '</button>') + dots(i, list.length);
      w.innerHTML = pg && pg.narr ? narr(pg.narr, txt, nav, pg.icon, pg.cls) : speech(who, txt, nav, pg && pg.title ? pg.title : (who === n ? title : null));
      au_('page');
      if (!last) on(w, '[data-kp=next]', function () { i++; show(); }); else bind(w);
    }
    show();
  }
  function showModal(html, panel) {
    currentPanel = null; setModal_(html);
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-wide'); box.classList.add('size-mid'); box.scrollTop = 0; }
    document.getElementById('modalOverlay').classList.add('open');
    if (panel) currentPanel = panel;
  }

  /* ---------- sinematik layar penuh (bisa dilewati) ---------- */
  function cine(kind, slides, cb) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    var ov = document.createElement('div'); ov.className = 'qt-cine kp-cine';
    ov.innerHTML = '<canvas></canvas><button class="kp-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button><div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind) || stop; } catch (e) { console.warn('[KP] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), btn = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.kp-skip');
    function show() {
      txt.classList.remove('in'); void txt.offsetWidth;
      txt.innerHTML = slides[i]; txt.classList.add('in');
      btn.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai';
    }
    function finish() {
      if (finished) return; finished = true;
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);
      if (cb) setTimeout(cb, 60);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } }
    document.addEventListener('keydown', onKey);
    btn.onclick = function () { au_('page'); if (++i < slides.length) show(); else finish(); };
    skip.onclick = function () { au_('page'); finish(); };
    setTimeout(function () { skip.classList.add('on'); }, 1500);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    setTimeout(function () { if (!finished) show(); }, 900);
  }

  /* ---------- mini-game (MTGames2) + cadangan ---------- */
  var FALLBACK = { gasing: { kind: 'gasing', win: false, rounds: 0 }, angin: { kind: 'angin', win: true, perfect: false, retries: 0 }, genderang: { kind: 'genderang', win: true, score: 70 } };
  function game(kind, opts, cb) {
    function fin(res) { gameOpen = false; try { cb(res || { kind: kind, cancelled: true }); } catch (e) { console.warn('[KP] game cb', e); } }
    if (window.MTGames2 && typeof MTGames2.open === 'function') {
      gameOpen = true;
      try { MTGames2.open(kind, opts || {}, fin); return; }
      catch (e) { gameOpen = false; console.warn('[KP] MTGames2', e); }
    }
    // cadangan: kartu sederhana agar cerita tetap bisa berlanjut
    showModal(panelHeader_('compass', esc_((opts && opts.title) || 'Mini-game'), esc_((opts && opts.subtitle) || '')) +
      '<div class="kp-wrap"><div class="kp-narr kp-fallback"><p>' + ((opts && opts.intro) || '') + '</p><p class="muted small">Mini-game belum termuat di perangkat ini. Kau tetap bisa melanjutkan cerita.</p>' +
      actions('<button class="btn btn-gold" data-kp="fb-go">' + ic('compass') + '&nbsp; Lanjutkan cerita</button><button class="btn btn-ghost-ink" data-kp="fb-no">Nanti dulu</button>') + '</div></div>');
    var c = document.getElementById('modalContent');
    on(c, '[data-kp=fb-go]', function () { closeModal(); fin(FALLBACK[kind] || { kind: kind, win: true }); });
    on(c, '[data-kp=fb-no]', function () { closeModal(); fin({ kind: kind, cancelled: true }); });
  }

  /* ---------- catatan samar (jurnal) ---------- */
  var OBJ = {
    1: '<i>"Langit menghitam di tengah laut, dan jarum itu mulai gemetar."</i>',
    2: '<i>"Jarum itu menari, dan laut tak lagi mengenal namamu."</i>',
    3: '<i>"Kita tidak tahu ke mana angin berhembus akan membawa kita."</i>',
    4: 'Seekor burung besi menunggu di haluan. Ia ingin kau mengikutinya ke <i>istana yang tak pernah bersuara</i>.',
    5: '<i>"Yang merusak harus memperbaiki. Ia sedang memegang kuas di bawah sayap yang patah."</i>',
    6: 'Kuas itu hampir diletakkan. Ia hanya menunggu satu jawaban: <i>bagaimana kabar dunia?</i>',
    7: '<i>"Kuas sudah diletakkan. Kini ia membaca bintang untukmu."</i>'
  };
  function journal() {
    var s = st(); if (!s) return '';
    var k = s.step || 0;
    if (k < 1 || k > 7) return '';
    return '<div class="qg-journal kp-journal"><div class="qg-jh">' + cico(k >= 7 ? 'kp-fixed' : 'kp-spin') + ' <b>Kompas yang Berputar</b><span class="legend-tag">Saga Kedua</span></div>' +
      (k === 7 ? '<div class="kp-star">' + ic('star') + ' Tedsky membaca bintang di haluan. <i>"Simpan kompasmu."</i></div>' : '') +
      '<div class="qg-obj">' + ic('compass') + ' <b>Catatan terakhirmu:</b><br>' + (OBJ[k] || '') + '</div></div>';
  }

  /* ================= BABAK 1: badai & terdampar ================= */
  var SL_STORM = [
    'Langit menghitam di tengah pelayaran. Angin berbalik arah dalam satu tarikan napas, dan ombak naik <b>setinggi tiang</b>.',
    'Laut seolah <b>terbalik</b>. Badai besar menyapu kapalmu jauh, jauh dari jalur yang kau pilih.',
    'Di anjungan, jarum kompas tak lagi diam. Ia <b>berputar tanpa henti</b>, seperti tak pernah tahu di mana utara.'
  ];

        ctx.fillStyle = bm; ctx.beginPath(); ctx.moveTo(poleX - bw * 3, 0); ctx.lineTo(poleX + bw * 3, 0); ctx.lineTo(poleX + bw * 0.5, poleY); ctx.lineTo(poleX - bw * 0.5, poleY); ctx.closePath(); ctx.fill();
        glow(ctx, poleX, poleY, R * 0.7 * lit, '255,236,180', 0.8 * lit);
        // aurora
        for (var a = 0; a < aur.length; a++) {
          var q = aur[a], ax = cx + (q.u - 0.5) * R * 2.6, base = poleY - R * 0.12 - Math.cos((q.u - 0.5) * 2.4) * R * 0.25, hh = R * 0.55 * q.h * (0.6 + 0.4 * Math.sin(t * 1.3 + q.ph));
          var ag = ctx.createLinearGradient(0, base - hh, 0, base); ag.addColorStop(0, 'rgba(120,255,190,0)'); ag.addColorStop(1, 'rgba(120,255,200,' + (0.18 * lit * (0.6 + 0.4 * Math.sin(t * 2 + q.ph))).toFixed(3) + ')');
          ctx.fillStyle = ag; ctx.fillRect(ax + Math.sin(t * 0.7 + q.u * 6) * R * 0.04, base - hh, R * 0.07, hh);
        }
        ctx.restore();
      }
      // montase kompas
      if (mt > 0) {
        var n = MONT.length, cols = port ? 2 : 4, rows = Math.ceil(n / cols), pw = W * (port ? 0.42 : 0.2), ph = pw * (port ? 0.92 : 0.95), gap = W * 0.025;
        var top0 = port ? H * 0.48 : H * 0.56, left0 = (W - (cols * pw + (cols - 1) * gap)) / 2;
        for (var m = 0; m < n; m++) {
          var col = m % cols, row = Math.floor(m / cols), px = left0 + col * (pw + gap), py = top0 + row * (ph + gap * 0.8);
          var ap = sm(5 + m * 0.35, 6 + m * 0.35, t); if (ap <= 0) continue;
          ctx.save(); ctx.globalAlpha = ap; ctx.translate(0, (1 - ap) * 14);
          ctx.fillStyle = 'rgba(8,22,34,.78)'; ctx.strokeStyle = 'rgba(140,220,255,.4)'; ctx.lineWidth = 1;
          ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(px, py, pw, ph, 12); else ctx.rect(px, py, pw, ph); ctx.fill(); ctx.stroke();
          var ts = 6.6 + m * 0.6, ang;
          if (t < ts) ang = REDUCE ? 2.2 + m : (t * (7 - m) + m * 1.7);
          else ang = (REDUCE ? 0 : 1) * 0.7 * Math.exp(-3.2 * (t - ts)) * Math.cos((t - ts) * 10);
          var crr = Math.min(pw, ph) * 0.3;
          if (t >= ts) glow(ctx, px + pw / 2, py + ph * 0.42, crr * 2, '255,226,150', 0.25 * sm(ts, ts + 0.6, t));
          compass(ctx, px + pw / 2, py + ph * 0.42, crr, ang, { shadow: true });
          ctx.fillStyle = '#d8ecf4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '700 ' + Math.max(10, Math.round(pw * 0.075)) + 'px "Cinzel", Georgia, serif';
          ctx.fillText(MONT[m][0], px + pw / 2, py + ph * 0.86);
          ctx.restore();
        }
      }
      C.vignette(ctx, W, H, 0.5);
      var ta = sm(9.2, 10.4, t);
      if (ta > 0) { ctx.fillStyle = 'rgba(2,6,12,' + (0.62 * ta).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
      ttl(ctx, W, H, ta, 'UTARA KEMBALI', 'Kompas di seluruh dunia berhenti berputar', H * 0.42);
      fadeIn(ctx, W, H, t, 1);
    }
    return { draw: draw, intro: 11 };
  }

  /* ================================ PUFF ================================ */
  function figure(ctx, x, y, h, o) {
    var run = o.run || 0, ph = o.ph || 0, dir = o.dir || 1, a = o.alpha == null ? 1 : o.alpha;
    if (a <= 0.01) return;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(dir, 1);
    var lw = Math.max(2, h * 0.07), sw = Math.sin(ph) * run, lean = run * 0.18;
    ctx.lineCap = 'round'; ctx.strokeStyle = o.leg || '#2a2c34'; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(0, -h * 0.44); ctx.lineTo(sw * h * 0.22, -h * 0.2); ctx.lineTo(sw * h * 0.28 - h * 0.02, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -h * 0.44); ctx.lineTo(-sw * h * 0.22, -h * 0.2); ctx.lineTo(-sw * h * 0.28 - h * 0.02, 0); ctx.stroke();
    ctx.save(); ctx.translate(0, -h * 0.44); ctx.rotate(lean);
    ctx.fillStyle = o.coat || '#e9e5da';
    if (o.dress) { ctx.beginPath(); ctx.moveTo(-h * 0.1, -h * 0.4); ctx.lineTo(h * 0.1, -h * 0.4); ctx.lineTo(h * 0.2, h * 0.4); ctx.lineTo(-h * 0.2, h * 0.4); ctx.closePath(); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(-h * 0.11, -h * 0.4); ctx.lineTo(h * 0.11, -h * 0.4); ctx.lineTo(h * 0.13, h * 0.04); ctx.lineTo(-h * 0.13, h * 0.04); ctx.closePath(); ctx.fill(); }
    if (o.medals) { ctx.fillStyle = '#e6b84a'; for (var m = 0; m < 3; m++) { ctx.beginPath(); ctx.arc(-h * 0.05 + m * h * 0.03, -h * 0.28, h * 0.012, 0, 6.3); ctx.fill(); } }
    if (o.paint) { ctx.fillStyle = '#b8843a'; ctx.beginPath(); ctx.arc(h * 0.05, -h * 0.12, h * 0.02, 0, 6.3); ctx.arc(-h * 0.06, -h * 0.02, h * 0.014, 0, 6.3); ctx.fill(); }
    ctx.strokeStyle = o.coat || '#e9e5da'; ctx.lineWidth = lw * 0.85;
    ctx.beginPath(); ctx.moveTo(0, -h * 0.36); ctx.lineTo(-sw * h * 0.2, -h * 0.16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -h * 0.36); ctx.lineTo(sw * h * 0.2 + (o.reach || 0) * h * 0.25, -h * 0.16 - (o.reach || 0) * h * 0.12); ctx.stroke();
    ctx.fillStyle = o.skin || '#e3b48a'; ctx.beginPath(); ctx.arc(0, -h * 0.47, h * 0.075, 0, 6.3); ctx.fill();
    if (o.hat) { ctx.fillStyle = '#1e2028'; ctx.beginPath(); ctx.ellipse(0, -h * 0.53, h * 0.12, h * 0.035, 0, 0, 6.3); ctx.fill(); ctx.beginPath(); ctx.arc(0, -h * 0.54, h * 0.06, Math.PI, 0); ctx.fill(); }
    if (o.hair) { ctx.fillStyle = o.hair; ctx.beginPath(); ctx.arc(0, -h * 0.49, h * 0.085, Math.PI * 0.9, Math.PI * 2.1); ctx.fill(); ctx.fillRect(-h * 0.085, -h * 0.49, h * 0.04, h * 0.16); }
    ctx.restore(); ctx.restore();
  }
  function scenePuff() {
    var r = U.rng(4141), P = new C.Particles(), screens = [], puffed = false;
    for (var i = 0; i < 26; i++) screens.push({ x: r(), y: r(), w: 0.03 + r() * 0.05, h: 0.02 + r() * 0.04, c: r() < 0.7 ? '90,200,255' : '255,190,90', ph: r() * 6.28 });
    function draw(ctx, W, H, t, dt) {
      var port = W < H, fy = H * (port ? 0.72 : 0.74), lx = W * (port ? 0.64 : 0.62);
      // ruangan
      var bg = ctx.createLinearGradient(0, 0, 0, fy); bg.addColorStop(0, '#060b12'); bg.addColorStop(1, '#16283a');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, fy);
      var fl = ctx.createLinearGradient(0, fy, 0, H); fl.addColorStop(0, '#1b2a36'); fl.addColorStop(1, '#070c12');
      ctx.fillStyle = fl; ctx.fillRect(0, fy, W, H - fy);
      ctx.strokeStyle = 'rgba(120,190,230,.08)'; ctx.lineWidth = 1;
      for (var g = -8; g <= 8; g++) { ctx.beginPath(); ctx.moveTo(W / 2 + g * W * 0.04, fy); ctx.lineTo(W / 2 + g * W * 0.2, H); ctx.stroke(); }
      for (var g2 = 1; g2 < 6; g2++) { var yy = fy + (H - fy) * Math.pow(g2 / 6, 1.6); ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke(); }
      // panel & layar
      var dim = 1 - 0.7 * sm(4.3, 4.8, t) + 0.5 * sm(5.6, 8, t);
      screens.forEach(function (s) {
        var x = s.x * W, y = fy * (0.12 + s.y * 0.62), w = s.w * W, h = s.h * H, a = (0.35 + 0.3 * Math.sin(t * 2 + s.ph)) * dim;
        ctx.fillStyle = 'rgba(' + s.c + ',' + (a * 0.6).toFixed(3) + ')'; ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(' + s.c + ',' + (a * 0.8).toFixed(3) + ')'; ctx.strokeRect(x, y, w, h);
      });
      ctx.fillStyle = '#0d1822'; ctx.fillRect(W * 0.12, fy - H * 0.14, W * 0.32, H * 0.14);
      ctx.fillStyle = 'rgba(90,200,255,' + (0.3 * dim).toFixed(3) + ')'; ctx.fillRect(W * 0.14, fy - H * 0.13, W * 0.28, H * 0.02);
      // tuas
      var lev = sm(0.4, 1.4, t);
      ctx.strokeStyle = '#8a8f98'; ctx.lineWidth = Math.max(3, W * 0.006); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(W * 0.4, fy - H * 0.14); ctx.lineTo(W * 0.4 + Math.sin(-0.6 + lev * 1.2) * H * 0.08, fy - H * 0.14 - Math.cos(-0.6 + lev * 1.2) * H * 0.08); ctx.stroke();
      // tiang cahaya kutub
      var beam = sm(0, 1.2, t) * (1 - sm(4.4, 6, t)), bw = W * (0.035 + 0.02 * Math.sin(t * 3)) * (1 + sm(3.8, 4.3, t) * 0.8);
      if (beam > 0) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        var bm = ctx.createLinearGradient(lx - bw * 2, 0, lx + bw * 2, 0);
        bm.addColorStop(0, 'rgba(255,240,200,0)'); bm.addColorStop(0.5, 'rgba(255,244,214,' + (0.85 * beam).toFixed(3) + ')'); bm.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = bm; ctx.fillRect(lx - bw * 2, 0, bw * 4, fy + H * 0.02);
        glow(ctx, lx, fy, W * 0.22 * beam, '255,230,170', 0.6 * beam);
        ctx.restore();
      }
      // Marlya mengawasi
      var hgt = H * (port ? 0.26 : 0.3);
      figure(ctx, W * 0.08, fy + H * 0.02, hgt * 0.95, { dress: true, coat: '#3a3f6a', skin: '#c88a5c', hair: '#5a5560', alpha: 0.95 });
      // Tedsky: di panel -> berlari ke cahaya
      var run = sm(2, 2.4, t), xT = U.lerp(W * 0.3, lx, ease(U.clamp((t - 2) / 2.2, 0, 1))), gone = sm(4.1, 4.3, t);
      figure(ctx, xT, fy + H * 0.04, hgt, { run: run * (REDUCE ? 0.4 : 1), ph: t * 11, dir: 1, coat: '#ece7dc', medals: true, paint: true, hat: true, reach: t < 1.6 ? sm(0.2, 0.6, t) * (1 - sm(1.3, 1.6, t)) : 0, alpha: 1 - gone });
      // puff
      if (t > 4.2 && !puffed) {
        puffed = true;
        var u = Math.max(1.5, H * 0.004);
        for (var p = 0; p < (REDUCE ? 20 : 46); p++) { var an = Math.random() * 6.28, sp = u * (0.4 + Math.random() * 1.6); P.add({ x: lx, y: fy - hgt * 0.4 + (Math.random() - 0.5) * hgt * 0.6, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp * 0.6 - u * 0.4, drag: 0.97, r: u * (6 + Math.random() * 8), grow: u * 0.25, life: 2 + Math.random() * 1.4, col: 'rgba(230,226,215,A)', a: 0.5, glow: true }); }
        for (var p2 = 0; p2 < 30; p2++) { var an2 = Math.random() * 6.28, sp2 = u * (1 + Math.random() * 3); P.add({ x: lx, y: fy - hgt * 0.5, vx: Math.cos(an2) * sp2, vy: Math.sin(an2) * sp2, drag: 0.95, r: u * 0.8, life: 0.9 + Math.random() * 0.6, col: 'rgba(255,220,140,A)', add: true }); }
      }
      P.run(ctx, dt);
      var fl2 = sm(4.1, 4.3, t) * (1 - sm(4.3, 5.2, t));
      if (fl2 > 0) { ctx.fillStyle = 'rgba(255,248,230,' + (fl2 * (REDUCE ? 0.35 : 0.9)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
      // kompas tua di lantai
      var ca = sm(5.6, 6.8, t);
      if (ca > 0) {
        var cr = Math.min(W, H) * (port ? 0.08 : 0.065), cy = fy + (H - fy) * 0.35;
        ctx.save(); ctx.globalAlpha = ca;
        glow(ctx, lx, cy, cr * 3, '255,210,130', 0.25);
        compass(ctx, lx, cy, cr, 2.24 + Math.sin(t * 1.7) * 0.03, { sq: 0.55, shadow: true });
        var gl = sm(6.8, 7.2, t) * (1 - sm(7.2, 7.9, t));
        if (gl > 0) {
          ctx.globalCompositeOperation = 'lighter'; var gx = lx - cr * 0.5, gy = cy - cr * 0.3, gr = cr * 1.6 * gl;
          ctx.strokeStyle = 'rgba(255,250,220,' + gl.toFixed(3) + ')'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(gx - gr, gy); ctx.lineTo(gx + gr, gy); ctx.moveTo(gx, gy - gr); ctx.lineTo(gx, gy + gr); ctx.stroke();
          glow(ctx, gx, gy, gr * 0.5, '255,250,220', gl);
        }
        ctx.restore();
      }
      C.vignette(ctx, W, H, 0.6);
      fadeIn(ctx, W, H, t, 0.9);
    }
    return { draw: draw, intro: 9 };
  }

  MTCine.register('kp_storm', sceneStorm);
  MTCine.register('kp_pelican', scenePelican);
  MTCine.register('kp_north', sceneNorth);
  MTCine.register('kp_puff', scenePuff);
  if (window.KP) KP.art = { compass: compass, figure: figure };
})();
</script>
