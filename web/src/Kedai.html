<style>
  /* ================= Tide v37 · Kedai Rantau (v37e: tata letak katalog + inspektur) ================= */
  #modalContent .kd-wrap { --kd-ink: #2b1d0e; --kd-mute: #7a6448; --kd-line: rgba(90,64,30,.18); --kd-line2: rgba(90,64,30,.32); --kd-paper: #fffaf0; --kd-gold: #b8923a; --kd-gold2: #e8c35a; --kd-night: #0f1b26; }
  .kd-wrap { display: grid; gap: 14px; margin: 4px 0 12px; color: var(--kd-ink); }
  .kd-wrap button { font-family: inherit; }
  .kd-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--kd-line); }
  .kd-seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: rgba(60,40,15,.08); }
  .kd-seg button { min-height: 36px; padding: 5px 14px; border: 0; border-radius: 8px; background: transparent; color: var(--kd-mute); font-size: .92em; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .kd-seg button .ico { width: 15px; height: 15px; }
  .kd-seg button:hover { color: var(--kd-ink); }
  .kd-seg button.on { background: var(--kd-paper); color: var(--kd-ink); box-shadow: 0 1px 2px rgba(60,40,10,.18), 0 0 0 1px var(--kd-line); }
  .kd-purse { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 10px; background: var(--kd-night); color: #f3e9d2; }
  .kd-purse .ico { width: 17px; height: 17px; color: var(--kd-gold2); align-self: center; }
  .kd-purse b { font-family: var(--font-title); font-size: 1.12em; color: #ffe7a3; font-variant-numeric: tabular-nums; }
  .kd-purse span { font-size: .8em; color: #bfb39a; }
  .kd-wrap :focus-visible { outline: 2px solid var(--kd-gold); outline-offset: 2px; }
  /* tata letak toko */
  .kd-shop { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
  .kd-cat { display: grid; gap: 12px; min-width: 0; }
  .kd-wrap section > header { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .kd-wrap section > header h4 { margin: 0; font-family: var(--font-title); font-size: .98em; color: var(--kd-ink); display: inline-flex; gap: 6px; align-items: center; }
  .kd-wrap section > header h4 .ico { width: 15px; height: 15px; color: var(--kd-gold); }
  .kd-wrap section > header span { font-size: .8em; color: var(--kd-mute); }
  .kd-price { display: inline-flex; align-items: center; gap: 3px; font-family: var(--font-title); color: var(--kd-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kd-price .ico { width: 13px; height: 13px; color: var(--kd-gold); }
  .kd-price s { color: var(--kd-mute); font-size: .82em; margin-right: 3px; }
  .kd-price.short { color: #9a3a22; }
  .kd-price.big { font-size: 1.15em; } .kd-price.big .ico { width: 16px; height: 16px; }
  .kd-own { display: inline-flex; align-items: center; gap: 3px; font-size: .82em; color: #2f6b3c; white-space: nowrap; }
  .kd-own .ico { width: 13px; height: 13px; }
  /* etalase */
  .kd-etalase .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kd-etalase .row button { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--kd-line2); background: linear-gradient(180deg, #fff6df, #fbecc8); color: var(--kd-ink); cursor: pointer; text-align: left; font-size: .86em; min-width: 0; }
  .kd-etalase .row button b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kd-etalase .row button:hover, .kd-etalase .row button.cur { border-color: var(--kd-gold); box-shadow: 0 0 0 1px var(--kd-gold) inset; }
  /* filter */
  .kd-filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .kd-filter button { flex: 0 0 auto; display: inline-flex; gap: 6px; align-items: center; min-height: 34px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--kd-line2); background: transparent; color: var(--kd-ink); font-size: .86em; cursor: pointer; }
  .kd-filter button small { font-size: .78em; color: var(--kd-mute); font-variant-numeric: tabular-nums; }
  .kd-filter button:hover { background: rgba(60,40,15,.06); }
  .kd-filter button.on { background: var(--kd-ink); border-color: var(--kd-ink); color: #fbefd2; }
  .kd-filter button.on small { color: #c9b48a; }
  /* kartu */
  .kd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; }
  .kd-card { position: relative; display: grid; grid-template-rows: auto auto 1fr; gap: 6px; padding: 0 0 10px; border-radius: 12px; background: var(--kd-paper); border: 1px solid var(--kd-line2); cursor: pointer; text-align: left; color: inherit; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
  .kd-card:hover { border-color: var(--kd-gold); }
  .kd-card.sel { border-color: var(--kd-gold); box-shadow: 0 0 0 2px var(--kd-gold2); }
  .kd-card .pic { position: relative; display: block; border-top: 3px solid #b9a37c; }
  .kd-card.r-langka .pic { border-top-color: #4f7fa6; } .kd-card.r-agung .pic { border-top-color: #7d4f9e; } .kd-card.r-legenda .pic { border-top-color: #d4a83c; }
  .kd-card canvas { display: block; width: 100%; height: 92px; background: #12324a; }
  .kd-card.locked canvas { filter: saturate(.55) brightness(.8); }
  .kd-card .nm { padding: 0 10px; font-family: var(--font-title); font-size: .86em; line-height: 1.25; color: var(--kd-ink); }
  .kd-card .ft { padding: 0 10px; display: flex; justify-content: space-between; align-items: end; gap: 6px; }
  .kd-card .mt { font-size: .74em; color: var(--kd-mute); line-height: 1.3; }
  .kd-card .ft .kd-price { font-size: .86em; }
  .kd-card .ft .kd-price.short { color: var(--kd-mute); }
  .kd-card em { position: absolute; font-style: normal; }
  .kd-card .st { left: 6px; top: 6px; padding: 1px 7px; border-radius: 6px; font-size: .7em; background: rgba(15,12,8,.72); color: #f3e9d2; }
  .kd-card .st.on { background: #2f6b3c; color: #eaffee; }
  .kd-card .st.sale { background: #9a2f1e; color: #fff0e0; }
  .kd-card .lock, .kd-card .star { top: 6px; right: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(15,12,8,.72); color: #f0cf78; }
  .kd-card .lock .ico, .kd-card .star .ico { width: 13px; height: 13px; }
  .kd-card .lock + .star { right: 32px; }
  /* inspektur */
  .kd-insp { position: sticky; top: 108px; max-height: calc(100vh - 150px); overflow-y: auto; scrollbar-width: thin; display: grid; gap: 12px; padding: 12px; border-radius: 14px; background: var(--kd-paper); border: 1px solid var(--kd-line2); box-shadow: 0 8px 24px -14px rgba(60,40,10,.4); }
  .kd-stage { position: relative; border-radius: 10px; overflow: hidden; background: var(--kd-night); }
  .kd-stage canvas { display: block; width: 100%; height: 210px; }
  .kd-stage .tog { position: absolute; top: 8px; right: 8px; display: flex; padding: 2px; gap: 2px; border-radius: 8px; background: rgba(8,10,14,.55); }
  .kd-stage .tog button { width: 30px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #d8cdb6; cursor: pointer; }
  .kd-stage .tog button .ico { width: 15px; height: 15px; }
  .kd-stage .tog button.on { background: rgba(232,195,90,.9); color: #241808; }
  .kd-info { display: grid; gap: 8px; }
  .kd-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  #modalBox .kd-title h3 { display: block; margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 1.2em; line-height: 1.2; letter-spacing: .01em; text-transform: none; color: var(--kd-ink); }
  .kd-meta { margin: -4px 0 0; font-size: .82em; color: var(--kd-mute); display: flex; align-items: center; gap: 6px; }
  .kd-meta .rar { width: 8px; height: 8px; border-radius: 2px; background: #b9a37c; transform: rotate(45deg); flex: none; }
  .r-langka .kd-meta .rar { background: #4f7fa6; } .r-agung .kd-meta .rar { background: #7d4f9e; } .r-legenda .kd-meta .rar { background: #d4a83c; }
  .kd-desc { margin: 0; font-size: .92em; line-height: 1.5; color: #4a3720; }
  .kd-need { display: grid; gap: 4px; font-size: .8em; color: #9a3a22; }
  .kd-bars { height: 5px; border-radius: 99px; background: rgba(60,40,15,.12); overflow: hidden; }
  .kd-bars i { display: block; height: 100%; background: linear-gradient(90deg, var(--kd-gold), var(--kd-gold2)); }
  .kd-wide { width: 100%; min-height: 42px; justify-content: center; }
  .kd-lockline { display: flex; gap: 8px; align-items: flex-start; padding: 9px 11px; border-radius: 10px; background: rgba(60,40,15,.07); font-size: .86em; line-height: 1.4; color: #4a3720; }
  .kd-lockline .ico { width: 15px; height: 15px; flex: none; margin-top: 2px; color: var(--kd-gold); }
  .kd-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .kd-links button { display: inline-flex; gap: 5px; align-items: center; padding: 3px 0; min-height: 30px; border: 0; background: none; color: #6b4a1e; font-size: .86em; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(107,74,30,.3); text-underline-offset: 3px; }
  .kd-links button:hover { color: var(--kd-ink); text-decoration-color: currentColor; }
  .kd-links button .ico { width: 14px; height: 14px; }
  .kd-note { margin: 0; font-size: .8em; color: var(--kd-mute); }
  /* set di inspektur */
  .kd-setbox { --set: #8a6a3a; display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--kd-line); font-size: .9em; }
  .kd-setbox.s-api_gunung { --set: #c2410c; } .kd-setbox.s-naga_samudra { --set: #2a8a80; } .kd-setbox.s-kapal_hantu { --set: #2f6e57; } .kd-setbox.s-badai_petir { --set: #3f6a96; } .kd-setbox.s-mutiara_paradiso { --set: #c55f7e; } .kd-setbox.s-zaman_gemilang { --set: #a8782a; } .kd-setbox.s-benang_merah { --set: #a8231c; } .kd-setbox.s-pasir_waktu { --set: #7a8494; }
  .kd-setbox header { margin: 0 !important; }
  .kd-setbox header h4 { color: var(--set) !important; }
  .kd-setbox header h4::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--set); }
  .kd-setbox p { margin: 0; line-height: 1.45; color: #4a3720; font-size: .94em; }
  .kd-pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .kd-pips button { display: grid; justify-items: center; gap: 3px; padding: 6px 2px 5px; border-radius: 8px; border: 1px dashed var(--kd-line2); background: transparent; color: var(--kd-mute); font-size: .74em; cursor: pointer; min-width: 0; }
  .kd-pips button i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid currentColor; }
  .kd-pips button i .ico { width: 11px; height: 11px; }
  .kd-pips button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kd-pips button.own { border-style: solid; color: var(--kd-ink); }
  .kd-pips button.own i { background: var(--set); border-color: var(--set); color: #fff; }
  .kd-pips button.on { background: color-mix(in srgb, var(--set) 12%, transparent); border-color: var(--set); }
  .kd-pips button.cur { box-shadow: 0 0 0 2px var(--kd-gold2); }
  /* lemari */
  .kd-lemari { padding-top: 14px; border-top: 1px solid var(--kd-line); }
  .kd-lemari .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .kd-laci { display: grid; gap: 10px; align-content: space-between; padding: 11px 12px; border-radius: 12px; background: var(--kd-paper); border: 1px solid var(--kd-line2); }
  .kd-laci.empty { background: transparent; border-style: dashed; }
  .kd-laci .t b { display: block; font-family: var(--font-title); font-size: .9em; }
  .kd-laci.empty .t b { color: var(--kd-mute); font-family: inherit; font-weight: 400; }
  .kd-laci .t small { display: block; margin-top: 2px; font-size: .78em; color: var(--kd-mute); line-height: 1.35; }
  .kd-laci .b { display: flex; gap: 6px; align-items: center; }
  .kd-laci .b .btn { min-height: 32px; padding: 3px 12px; font-size: .84em; }
  .kd-x { margin-left: auto; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--kd-mute); cursor: pointer; }
  .kd-x:hover { background: rgba(154,58,34,.1); color: #9a3a22; }
  .kd-x .ico { width: 14px; height: 14px; }
  .kd-foot { margin: 0; font-size: .8em; color: var(--kd-mute); }
  @media (max-width: 760px) {
    .kd-shop { grid-template-columns: 1fr; gap: 14px; }
    .kd-insp { position: static; order: -1; max-height: none; overflow: visible; }
    .kd-stage canvas { height: 180px; }
    .kd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .kd-etalase .row { grid-template-columns: 1fr; }
    .kd-lemari .row { grid-template-columns: 1fr; }
    .kd-laci { grid-template-columns: 1fr auto; align-items: center; }
    .kd-filter { margin: 0 -2px; }
    .kd-seg { width: 100%; } .kd-seg button { flex: 1 1 0; justify-content: center; padding: 5px 6px; }
    .kd-seg button .lg { display: none; }
    .kd-bar { gap: 8px; }
    .kd-purse { margin-left: auto; padding: 4px 10px; }
  }
  @media (max-width: 400px) { .kd-seg button .ico { display: none; } }
  /* jasa */
  .kd-jasa { display: grid; grid-template-columns: 46px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 13px; background: rgba(255,255,255,.62); border: 1px solid rgba(120,100,60,.26); }
  .kd-jasa .fc { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: #2a2218; display: grid; place-items: center; color: #f0cf78; }
  .kd-jasa .fc svg { width: 100%; height: 100%; display: block; }
  .kd-jasa .fc .ico { width: 24px; height: 24px; }
  .kd-jasa h5 { margin: 0; font-size: .92em; color: #2e2010; }
  .kd-jasa h5 small { font-weight: 400; color: #8a6a3a; }
  .kd-jasa p { margin: 2px 0 0; font-size: .82em; color: #4a3218; line-height: 1.35; }
  .kd-jasa .acts { display: grid; gap: 5px; justify-items: end; }
  .kd-jasa .acts .btn { min-height: 34px; padding: 3px 12px; min-width: 116px; justify-content: center; }
  .kd-jasa + .kd-jasa { margin-top: 8px; }
  .kd-jasa { background: var(--kd-paper); border-color: var(--kd-line2); }
  .kd-jasa .own { font-size: .74em; color: #3f7a4a; }
  .kd-buff { padding: 8px 12px; border-radius: 12px; background: rgba(60,140,80,.14); border: 1px solid rgba(60,140,80,.4); color: #2e4a30; font-size: .86em; }
  .kd-taksir { display: grid; gap: 6px; }
  .kd-taksir .row { padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.6); border: 1px solid rgba(120,100,60,.25); font-size: .84em; }
  .kd-taksir .row b { color: #2e2010; }
  /* gotong royong */
  .gr-card { padding: 12px 14px; border-radius: 14px; background: linear-gradient(180deg, #1d2b24, #0f1813); color: #e4efe6; border: 1px solid rgba(160,200,160,.3); }
  .gr-card h4 { margin: 0; font-family: var(--font-title); letter-spacing: .06em; color: #f0cf78; display: flex; justify-content: space-between; gap: 8px; }
  .gr-card h4 span { font-family: inherit; letter-spacing: 0; color: #cfe2d2; font-size: .8em; }
  .gr-track { position: relative; height: 16px; margin: 30px 4px 26px; border-radius: 99px; background: rgba(255,255,255,.1); }
  .gr-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, #6aa86f, #f0cf78); }
  .gr-mark { position: absolute; top: -26px; transform: translateX(-50%); text-align: center; font-size: .66em; color: #cfe2d2; white-space: nowrap; }
  .gr-mark::after { content: ''; display: block; width: 2px; height: 34px; margin: 2px auto 0; background: rgba(255,255,255,.25); }
  .gr-mark.done { color: #f0cf78; }
  .gr-mark.done::after { background: #f0cf78; }
  .gr-stages { display: grid; gap: 5px; }
  .gr-stage { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 9px; background: rgba(255,255,255,.05); font-size: .82em; }
  .gr-stage .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); font-family: var(--font-title); }
  .gr-stage.done .n { background: #f0cf78; color: #1d1608; }
  .gr-stage.now { box-shadow: 0 0 0 1px rgba(240,207,120,.6) inset; }
  .gr-stage small { color: #b8cdbb; }
  .gr-form { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.6); border: 1px solid rgba(120,100,60,.28); }
  .gr-form .in { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gr-form label { display: grid; gap: 3px; font-size: .78em; color: #4a3218; }
  .gr-form input { min-height: 38px; padding: 6px 10px; border-radius: 9px; border: 1px solid rgba(120,90,40,.4); background: #fffaf0; font-size: 1em; }
  .gr-form .quick { display: flex; flex-wrap: wrap; gap: 5px; }
  .gr-form .quick button { padding: 3px 10px; min-height: 30px; border-radius: 99px; border: 1px solid rgba(120,90,40,.35); background: rgba(255,255,255,.7); font-size: .78em; cursor: pointer; }
  .gr-top { display: grid; gap: 3px; }
  .gr-top .row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 8px; background: rgba(255,255,255,.5); font-size: .82em; }
  .gr-top .row.me { background: rgba(232,195,90,.25); }
  .gr-top .row .kt { font-size: .78em; color: #8a6a3a; margin-left: 6px; }
  .gr-kat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: start; }
  .gr-k { position: relative; display: grid; gap: 4px; align-content: start; padding: 10px; border-radius: 13px; background: rgba(255,255,255,.55); border: 1px solid rgba(120,100,60,.28); font-size: .8em; color: #4a3218; }
  .gr-k h5 { margin: 0; font-family: var(--font-title); letter-spacing: .05em; color: #2e2010; font-size: 1.02em; }
  .gr-k .rg { font-family: var(--font-title); color: #8a6a3a; font-size: .9em; }
  .gr-k.on { border-color: #b8923a; box-shadow: 0 0 0 1px #b8923a inset; background: rgba(255,240,200,.75); }
  .gr-k .yes { position: absolute; top: 8px; right: 9px; color: #3f7a4a; font-size: .9em; }
  .gr-k.k3 { background: linear-gradient(160deg, #2a1d0e, #120c05); color: #e9dcc0; border-color: rgba(232,195,90,.55); }
  .gr-k.k3 h5 { color: #ffe7a3; } .gr-k.k3 .rg { color: #f0cf78; }
  .gr-k.k3.on { box-shadow: 0 0 0 1px #f0cf78 inset, 0 0 18px rgba(240,207,120,.35); }
  .gr-k canvas { width: 100%; height: 150px; border-radius: 9px; display: block; }
  .gr-k .lim { display: inline-block; padding: 1px 8px; border-radius: 99px; background: #7a1a18; color: #ffe7d0; font-size: .82em; letter-spacing: .06em; justify-self: start; }
  .gr-mine { display: grid; gap: 4px; font-size: .84em; color: #3b2a16; }
  .gr-mine .bar { height: 8px; border-radius: 99px; background: rgba(60,40,15,.14); overflow: hidden; }
  .gr-mine .bar i { display: block; height: 100%; background: linear-gradient(90deg, #6aa86f, #f0cf78); }
  @media (max-width: 720px) { .gr-kat { grid-template-columns: 1fr; } }
  /* kisah */
  .ks-list { display: grid; gap: 8px; }
  .ks-book { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(60,40,20,.12), rgba(255,255,255,.5)); border: 1px solid rgba(120,100,60,.28); }

        '<div class="acts"><button class="btn btn-ghost-ink" data-kd-buy="' + x.id + '"' + (x.price > keping() ? ' disabled' : '') + '>Beli ' + ic('keping') + ' ' + fmt(x.price) + '</button>' +
        (x.qty > 0 ? '<button class="btn btn-gold" data-kd-use="' + x.id + '">Pakai</button>' : '') + '</div></div>';
    }).join('');
    var tk = taksir ? '<div class="kd-taksir"><b>Pak Tua Karto menaksir isi palkamu:</b>' + taksir.map(function (t) {
      return '<div class="row"><b>' + esc_(t.name) + '</b> &times;' + t.qty + (t.avg ? ' &middot; modal ' + fmt(t.avg) + '/unit' : '') + '<br>' +
        (t.best || []).map(function (c, i) { return (i ? ' &middot; ' : '') + esc_(c.cityName) + ' <b>' + fmt(c.price) + '</b>'; }).join('') + '</div>';
    }).join('') + '<span class="muted small">Dari catatan harga terakhir tiap pasar. Harga bisa sudah bergerak.</span></div>' : '';
    return buff + tk + rows + '<p class="muted small">Satu jasa berdurasi (Pembaca Arus atau Pengawal) aktif dalam satu waktu. Jasa yang dibeli tersimpan sampai dipakai.</p>';
  }
  function gotongHtml() {
    var g = gotong;
    if (!g) return '<div class="dt-empty">Membaca catatan Monumen Restorasi&hellip;</div>';
    var goal = g.goal || 1, pct = Math.min(100, g.total / goal * 100), me = g.me || {}, K = g.kategori || [3000000, 15000000], MX = g.max || 0, mk = me.kat || 0;
    var short = function (n) { return HR.fmtShort(n); };
    var marks = (g.stages || []).map(function (s) { return '<div class="gr-mark' + (g.stage >= s.n ? ' done' : '') + '" style="left:' + (s.cum / goal * 100).toFixed(2) + '%">' + short(s.cum) + '</div>'; }).join('');
    var stages = (g.stages || []).map(function (s) {
      return '<div class="gr-stage' + (g.stage >= s.n ? ' done' : '') + (g.stage + 1 === s.n ? ' now' : '') + '"><span class="n">' + (g.stage >= s.n ? '&#10003;' : '') + '</span><div><b>' + esc_(s.name) + '</b><br><small>' + esc_(s.desc || '') + '</small></div><small>' + short(s.cum) + '</small></div>';
    }).join('');
    var top = (g.top || []).map(function (t, i) {
      return '<div class="row' + (me.rank === i + 1 ? ' me' : '') + '"><span>' + (i + 1) + '. ' + esc_(t.name) +
        (t.garudaNo ? '<span class="kt">Penjaga Garuda #' + t.garudaNo + '</span>' : t.kat ? '<span class="kt">Kategori ' + t.kat + '</span>' : '') + '</span><b>' + fmt(t.total) + '</b></div>';
    }).join('') || '<div class="muted small">Belum ada penyumbang. Jadilah yang pertama.</div>';
    var kats = '<div class="gr-kat">' +
      '<div class="gr-k' + (mk === 1 ? ' on' : '') + '">' + (mk >= 1 ? '<span class="yes">' + ic('check') + '</span>' : '') + '<h5>Kategori 1</h5><span class="rg">' + fmt(g.min || 1000) + ' &ndash; ' + short(K[0]) + '</span>' +
        '<span>Tanda Jasa <b>Tangan Gotong Royong</b> dan namamu di Prasasti Restorasi.</span></div>' +
      '<div class="gr-k' + (mk === 2 ? ' on' : '') + '">' + (mk >= 2 ? '<span class="yes">' + ic('check') + '</span>' : '') + '<h5>Kategori 2</h5><span class="rg">di atas ' + short(K[0]) + ' &ndash; ' + short(K[1]) + '</span>' +
        '<span>Rupa <b>Lentera IKN</b> (lentera teal-emas di buritan) + Tanda Jasa <b>Tiang Restorasi</b>.</span></div>' +
      '<div class="gr-k k3' + (mk === 3 ? ' on' : '') + '">' + (mk >= 3 ? '<span class="yes" style="color:#9fe0a8">' + ic('check') + '</span>' : '') + '<h5>Kategori 3</h5><span class="rg">di atas ' + short(K[1]) + (MX ? ' &ndash; ' + short(MX) : '') + '</span>' +
        '<canvas data-gr-cv="1"></canvas><span class="lim">TERBATAS &middot; ' + (g.garuda || 0) + ' PENJAGA</span>' +
        '<span><b style="color:#ffe7a3">Sayap Garuda</b> emas bernomor membentang di atas kapalmu, terlihat semua kapten, + Tanda Jasa <b>Penjaga Garuda</b>. Hanya dibagikan selama Restorasi berjalan. Setelah IKN pulih, tidak akan pernah dibuat lagi.</span></div>' +
      '</div>';
    var nextK = mk < 2 ? K[0] : mk < 3 ? K[1] : 0, left = MX ? Math.max(0, MX - (me.total || 0)) : Infinity;
    var mine = '<div class="gr-mine"><span>Sumbanganmu: <b>' + fmt(me.total || 0) + '</b> gold' + (me.keping ? ' (termasuk ' + fmt(me.keping) + ' keping)' : '') +
      (me.rank ? ' &middot; peringkat ' + me.rank : '') + (me.garudaNo ? ' &middot; <b>Penjaga Garuda #' + me.garudaNo + '</b>' : mk ? ' &middot; Kategori ' + mk : '') + '</span>' +
      (nextK && !g.done ? '<div class="bar"><i style="width:' + Math.min(100, (me.total || 0) / nextK * 100).toFixed(1) + '%"></i></div><span class="muted small">Kurang ' + fmt(nextK + 1 - (me.total || 0)) + ' gold ke Kategori ' + (mk < 2 ? 2 : 3) + '.</span>' : '') +
      (!g.done && MX ? '<span class="muted small">Batas per kapten ' + short(MX) + ' &middot; sisa jatahmu ' + fmt(left) + ' gold.</span>' : '') + '</div>';
    var form = g.done ? '<div class="kd-buff">' + ic('star') + ' Restorasi IKN selesai. Menara Cahaya menyala sampai ke tengah laut. <b>Kapal yang merapat di IKN pulih perlahan</b>, seperti di Paradiso.</div><div class="gr-form">' + mine + '</div>' :
      '<div class="gr-form"><b>Sumbang ke kolam Restorasi</b>' + (g.here ? '' : '<span class="muted small">' + ic('anchor') + ' Sumbangan diterima di Monumen Restorasi, <b>IKN</b>. Merapatlah ke sana.</span>') +
      '<div class="in"><label>Gold (punyamu ' + fmt(g.gold || 0) + ')<input id="grGold" type="number" min="0" step="1000" inputmode="numeric" value="0"></label>' +
      '<label>Keping (1 keping = ' + fmt(g.rate) + ' gold)<input id="grKp" type="number" min="0" step="1" inputmode="numeric" value="0"></label></div>' +
      '<div class="quick"><button data-gr="100000">100 rb</button><button data-gr="1000000">1 jt</button><button data-gr="2500000">2,5 jt</button><button data-gr="5000000">5 jt</button>' +
      (left > 0 ? '<button data-gr="' + Math.min(left, g.gold || 0) + '">Semua gold</button>' : '') + '</div>' +
      '<button class="btn btn-gold" id="grSend"' + (g.here && left > 0 ? '' : ' disabled') + '>' + ic('gift') + ' Sumbang</button>' + mine + '</div>';
    return '<div class="gr-card"><h4>Restorasi IKN<span>' + g.donors + ' penyumbang</span></h4>' +
      '<div class="gr-track"><i style="width:' + pct.toFixed(2) + '%"></i>' + marks + '</div>' +
      '<div style="display:flex;justify-content:space-between;gap:8px;font-size:.86em;margin-bottom:6px"><span><b style="color:#f0cf78">' + fmt(g.total) + '</b> / ' + fmt(goal) + ' gold</span><span>' + (g.done ? 'Selesai' : 'Kolam bersama') + '</span></div>' +
      '<p style="margin:0 0 8px;font-size:.8em;color:#cfe2d2">Semua sumbangan masuk satu kolam. Begitu total kolam melewati angka di bawah, kota IKN langsung berubah untuk semua kapten.</p>' +
      '<div class="gr-stages">' + stages + '</div></div>' + form +
      '<div class="gr-form"><b>Kategori Penyumbang</b><span class="muted small">Dihitung dari total sumbangan pribadimu (gold + keping).</span>' + kats + '</div>' +
      '<div class="gr-form"><b>Prasasti Restorasi &middot; 10 penyumbang terbesar</b><div class="gr-top">' + top + '</div></div>';
  }
  function kisahHtml() {
    if (window.KS) return KS.html();
    var B = [['Kapal Tanpa Awak', 'Uda Gala bercerita tentang kapal hantu pertama yang dicucinya di tahun badai besar.'], ['Malam Sebelum Chafik Lahir', 'Uda Gala muda berlayar pulang untuk menggendong putra kecilnya.'],
      ['Kedai Kopi di Pulau Sudyrman', 'Masa muda coco epan sebelum menjadi bankir.'], ['Surat untuk Andry', 'zafachmie menulis surat untuk Andry Ivankov. Pelikan membawa balasan yang tak bisa dibaca.'],
      ['Tujuh Pulau, Delapan Nama', 'Teka-teki angka tujuh di Pustaka: ada pulau yang tidak pernah tercatat.']];
    return '<div class="ks-list">' + B.map(function (b) { return '<div class="ks-book"><div class="cv">' + ic('book') + '</div><div><h5>' + esc_(b[0]) + '</h5><p>' + esc_(b[1]) + '</p></div><span class="soon">Segera</span></div>'; }).join('') +
      '</div><p class="muted small">Bab Kisah Lapau dibuka satu per satu. Simpan kepingmu.</p>';
  }
  function bodyHtml() { return tab === 'rupa' ? rupaHtml() : tab === 'jasa' ? jasaHtml() : tab === 'gotong' ? gotongHtml() : kisahHtml(); }
  function paintCards() {
    var t = 1.3;
    document.querySelectorAll('#kdBody [data-kd-cv]').forEach(function (cv) {
      var id = cv.getAttribute('data-kd-cv'), it = item(id), nt = it && /lampion|lentera/.test(id);
      paint(cv, kdWith(id), t, nt, false);
    });
  }
  function bind() {
    var c = document.getElementById('modalContent'); if (!c) return;
    c.querySelectorAll('[data-kd-tab]').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-kd-tab'); taksir = null; au_('page'); render(); if (tab === 'gotong') loadGotong(); }; });
    var body = document.getElementById('kdBody'); if (!body) return;
    body.querySelectorAll('[data-kd-slot]').forEach(function (b) { b.onclick = function () { slotF = b.getAttribute('data-kd-slot'); sel = null; render(); }; });
    body.querySelectorAll('[data-kd-sel]').forEach(function (b) { b.onclick = function () { sel = b.getAttribute('data-kd-sel'); au_('page'); render(); var h = document.querySelector('.kd-insp'); if (h && window.innerWidth <= 760) try { h.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) { } }; });
    body.querySelectorAll('[data-kd-night]').forEach(function (b) { b.onclick = function () { night = b.getAttribute('data-kd-night') === '1'; render(); }; });
    body.querySelectorAll('[data-kd]').forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-kd'), it = item(sel); if (!it) return;
        if (a === 'beli') call('api_kedai', ['beli', it.id], function () { au_('achieve'); try { metaMax_('kdrupa', 1); } catch (e) { } showToast('coco epan: "Pilihan yang baik." ' + it.name + ' milikmu.', 'success'); render(); }, b);
        else if (a === 'pasang') call('api_kedai', ['pasang', it.id], function () { au_('coin', { n: 2 }); showToast(it.name + ' terpasang. Kapten lain bisa melihatnya.', 'success'); render(); }, b);
        else if (a === 'lepas') call('api_kedai', ['lepas', it.slot], function () { render(); }, b);
        else if (a === 'incar') call('api_kedai', ['incar', data.incaran === it.id ? '' : it.id], function () { render(); }, b);
        else if (a === 'coba') tryOn(it.id);
        else if (a === 'cobaset') tryOn(it.id, true);
        else if (a === 'pasangset') {
          var its = setItems(it.set), i = 0;
          (function next() { if (i >= its.length) { au_('achieve'); showToast('Set ' + SET_NAME[it.set] + ' terpasang. Kesaktian Set bangkit!', 'success'); loadRupa(); return; } call('api_kedai', ['pasang', its[i++].id], next, b); })();
        }
      };
    });
    body.querySelectorAll('[data-kd-full]').forEach(function (b) { b.onclick = function () { heroFull = !heroFull; render(); }; });
    body.querySelectorAll('[data-lm]').forEach(function (b) {
      b.onclick = function () {
        var a = b.getAttribute('data-lm'), n = Number(b.getAttribute('data-n')), nm = '';
        if (a === 'simpan') { nm = window.prompt('Nama susunan rupa (maks 24 huruf):', 'Susunan ' + n); if (nm === null) return; }
        call('api_rupa', [a, n, nm], function (r) {
          if (a === 'pakai') { au_('coin', { n: 2 }); showToast('Lemari Rupa: susunan ' + n + ' dipakai.' + (r.skip ? ' ' + r.skip + ' rupa dilewati (belum dimiliki).' : ''), 'success'); }
          else if (a === 'simpan') showToast('Susunan rupa tersimpan di laci ' + n + '.', 'success');
          render();
        }, b);
      };
    });
    body.querySelectorAll('[data-kd-buy]').forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-kd-buy'); call('api_kedai', ['beli', id], function () { au_('coin', { n: 2 }); showToast((item(id) || {}).name + ' tersimpan. Pakai kapan saja.', 'success'); render(); }, b); }; });
    body.querySelectorAll('[data-kd-use]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-kd-use');
        call('api_kedai', ['pakai', id], function (r) { au_('achieve'); if (r.taksir) taksir = r.taksir; if (r.msg) showToast(r.msg, 'success'); render(); }, b);
      };
    });
    body.querySelectorAll('[data-gr]').forEach(function (b) { b.onclick = function () { var i = document.getElementById('grGold'); if (i) i.value = b.getAttribute('data-gr'); }; });
    var send = document.getElementById('grSend');
    if (send) send.onclick = function () {
      var gv = Math.max(0, Math.floor(Number((document.getElementById('grGold') || {}).value) || 0)), kv = Math.max(0, Math.floor(Number((document.getElementById('grKp') || {}).value) || 0));
      if (!gv && !kv) { showToast('Isi jumlah gold atau keping.', 'error'); return; }
      call('api_gotong', ['sumbang', gv, kv], function (r) {
        au_('achieve'); try { metaMax_('grgive', 1); metaMax_('grkat', r.kat || 1); } catch (e) { }
        var st = r.gotong && r.gotong.stages && r.gotong.stages[r.stage - 1];
        if (r.stageUp) showToast('Kolam Restorasi melewati ' + HR.fmtShort(st ? st.cum : 0) + ': ' + (st ? st.name : '') + '! Lihat perubahan di kota IKN.', 'success');
        else showToast('Monumen Restorasi mencatat namamu. Terima kasih, Kapten.', 'success');
        if (r.garudaNo) setTimeout(function () { showToast('Kamu Penjaga Garuda #' + r.garudaNo + '! Sayap Garuda menunggu di Kedai Rantau, rak Rupa, slot Lambang.', 'success'); }, 900);
        else if (r.lentera) setTimeout(function () { showToast('Kategori 2: kamu mendapat rupa Lentera IKN. Pasang di Kedai Rantau, rak Rupa.', 'success'); }, 900);
        if (state && r.gotong) { state.gotong = { ikn: { stage: r.gotong.stage, total: r.gotong.total, goal: r.gotong.goal, done: r.gotong.done, kat: r.kat } }; }
        if (r.garudaNo || r.lentera) load();
        render();
      }, send);
    };
  }
  function render() {
    if (currentPanel !== 'kedai') return;
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-mid'); box.classList.add('size-wide'); }
    var scroll = box ? box.scrollTop : 0;
    setModal_(header());
    var body = document.getElementById('kdBody');
    if (body) body.innerHTML = data ? bodyHtml() : '<div class="dt-empty">Membuka Kedai&hellip;</div>';
    if (box) box.scrollTop = scroll;
    bind();
    if (data && tab === 'rupa') { paintCards(); startHero(); } else if (tab === 'gotong') startGaruda(); else cancelAnimationFrame(raf);
    if (tab === 'kisah' && window.KS) KS.bind(body);
  }
  function load() {
    call('api_kedai', ['daftar'], function () {
      try { if (data.items.some(function (x) { return x.rak === 'rupa' && x.qty > 0 && !x.exclusive; })) metaMax_('kdrupa', 1); } catch (e) { }
      render(); if (tab === 'gotong') loadGotong();
      loadRupa();
    });
  }
  function loadRupa() { call('api_rupa', ['status'], function (r) { if (rupa) rupa._at = Date.now(); try { (rupa.sets || []).forEach(function (z) { if (z.complete) metaMax_('kdsakti', 1); }); } catch (e) { } if (tab === 'rupa') render(); }); }
  function loadGotong() {
    if (!(window.HR && HR.open('gotong'))) { gotong = null; var b = document.getElementById('kdBody'); if (b && tab === 'gotong') b.innerHTML = '<div class="dt-empty">Gotong Royong belum dibuka.</div>'; return; }
    call('api_gotong', ['status'], function () { if (tab === 'gotong') render(); });
  }
  function openTab(t) { tab = t || tab; if (typeof openPanel === 'function') openPanel('kedai'); }

  /* ---------- panel & kaitan ---------- */
  var origOpen = window.openPanel;
  if (typeof origOpen === 'function') {
    window.openPanel = function (panel) {
      if (panel === 'kedai') {
        if (!(window.HR && (HR.open('kedai') || HR.open('gotong')))) { showToast('Kedai Rantau belum dibuka.', 'info'); return; }
        if (!HR.open('kedai')) tab = 'gotong';
        var r = origOpen.apply(this, arguments);
        render();
        if (HR.open('kedai')) load(); else loadGotong();
        return r;
      }
      return origOpen.apply(this, arguments);
    };
  }
  // Monumen Restorasi (panel Tasks di IKN)
  wrap_('setModal_', function () {
    if (currentPanel !== 'tasks' || !(window.HR && HR.open('gotong')) || !state || !state.city || state.city.CityId !== 'ikn') return;
    if (state.voyage && state.voyage.inTransit) return;
    var c = document.getElementById('modalContent'); if (!c || c.querySelector('.gr-callout')) return;
    var g = state.gotong && state.gotong.ikn, ph = c.querySelector('.ph');
    var d = document.createElement('div'); d.className = 'qg-callout gr-callout';
    d.innerHTML = '<div class="qg-callout-ico">' + ic('users') + '</div><div><b>Monumen Restorasi</b><br><span class="muted small">' + (g && g.done ? 'Restorasi selesai. Kapalmu pulih perlahan selama merapat di sini.' : 'Kolam Restorasi IKN ' + fmt((g && g.total) || 0) + ' / ' + fmt((g && g.goal) || 100000000) + ' gold') + '</span></div><button class="btn btn-gold">' + (g && g.done ? 'Lihat' : 'Sumbang') + '</button>';
    d.querySelector('.btn').onclick = function () { openTab('gotong'); };
    if (ph && ph.parentNode) ph.parentNode.insertBefore(d, ph.nextSibling);
  });
  wrap_('closeModal', function () { cancelAnimationFrame(raf); raf = 0; });

  /* ---------- Tanda Jasa ---------- */
  if (typeof ACH !== 'undefined' && ACH.push) ACH.push(
    { id: 'kd_first', t: 1, ic: 'keping', n: 'Pelanggan coco', d: 'Beli rupa pertama di Kedai Rantau.', g: function (m) { return [m.c.kdrupa || 0, 1]; } },
    { id: 'gr_tangan', t: 1, ic: 'users', n: 'Tangan Gotong Royong', d: 'Menyumbang untuk Restorasi IKN (kategori 1).', g: function (m) { return [m.c.grgive || 0, 1]; } },
    { id: 'kd_sakti', t: 3, ic: 'star', n: 'Kesaktian Bangkit', d: 'Pasang satu set rupa lengkap (lima barang).', g: function (m) { return [m.c.kdsakti || 0, 1]; } },
    { id: 'gr_tiang', t: 2, ic: 'users', n: 'Tiang Restorasi', d: 'Kategori 2 penyumbang Restorasi IKN.', g: function (m) { return [m.c.grkat || 0, 2]; } },
    { id: 'gr_garuda', t: 3, ic: 'star', n: 'Penjaga Garuda', d: 'Kategori 3 penyumbang Restorasi IKN. Terbatas.', g: function (m) { return [m.c.grkat || 0, 3]; } }
  );
  wrap_('applyFreshState_', function () { var g = state && state.gotong && state.gotong.ikn; if (g && g.kat) { try { metaMax_('grgive', 1); metaMax_('grkat', g.kat); } catch (e) { } } });

  wrap_('applyFreshState_', function () { if (currentPanel === 'kedai' && data) { data.keping = (hs() && hs().keping) || data.keping; } });

  return {
    open: openTab, refresh: function () { load(); },
    onHarian: function () { if (data && hs()) data.keping = hs().keping; var bal = document.querySelector('.kd-bal'); if (bal && currentPanel === 'kedai') bal.textContent = fmt(keping()); },
    _data: function () { return data; }, _stopTrial: stopTrial
  };
})();
</script>
