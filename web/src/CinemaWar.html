    ctx.strokeStyle = L('#6b7682'); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(-150, -24); ctx.quadraticCurveTo(-151, -16, -147, -12); ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(160,242,255,' + (0.65 + 0.35 * eg).toFixed(3) + ')'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 6.2, 0, 0, 6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7.8, 0); ctx.quadraticCurveTo(0, 4.2, 7.8, 0); ctx.stroke();

    ctx.fillStyle = cyan + (0.25 + 0.5 * li).toFixed(3) + ')'; ctx.fillRect(-160, -16.5, 305, 1.3); ctx.fillRect(-48, -35.6, 170, 0.8);
    var rg = ctx.createLinearGradient(run - 34, 0, run + 34, 0); rg.addColorStop(0, 'rgba(160,245,255,0)'); rg.addColorStop(0.5, 'rgba(210,252,255,.95)'); rg.addColorStop(1, 'rgba(160,245,255,0)');

  // Perisai kubah: kisi heksagon dicache ke kanvas offscreen (murah per frame) + gelombang denyut.

  var domeCache = {};

  }

  /* ======================= 6. PENGKHIANATAN ======================= */
  function sceneBetrayal() {
    var r = U.rng(6060), P = new C.Particles(), L = C.makeLit(), glit = MTSky.makeGlitter(r), clouds = MTSky.makeClouds(r, 6), lay = null, shots = [], shake = 0;
    function layout(W, H) { lay = { W: W, H: H, hy: H * 0.52, port: W < H, s: W < H ? W * 0.0021 : Math.min(W * 0.0014, H * 0.0026) }; }
    function draw(ctx, W, H, t, dt) {
      if (!lay || lay.W !== W || lay.H !== H) layout(W, H);

      MTSky.paintSky(ctx, W, hy, p, t, null);
      MTSky.paintClouds(ctx, W, hy * 0.9, p, clouds, dt, 0.8);
      MTSky.paintSea(ctx, W, H, hy, p, t, { glitter: glit, rough: 1.3, drift: 10 });
      L.set(p.tint);
      // Kapal Induk di kanan
      var ix = W * (lay.port ? 0.7 : 0.74), iy = hy + H * 0.12, is = s * (lay.port ? 1.05 : 1.25);
      var sh = sm(5.2, 7, t);
      induk(ctx, ix, iy, is, { dir: -1, t: t, lit: L, hp: 0.5, lights: 0.8, shield: sh });
      // barisan aliansi di kiri; kapal merah (Rangkiang Merah) berbalik
      var line = [];
      for (var i = 0; i < 5; i++) line.push({ n: FLEET[i], x: W * (0.08 + i * 0.1), y: hy + H * (0.16 + (i % 2) * 0.12), k: 0.7 + (i % 2) * 0.2 });
      var turn = ease((t - 2.2) / 1.8), red = { sail: '#7a1a12', stripe: '#e8c060', flag: '#b3261e', emb: 'crest', hull: '#5a2a1a' };
      line.splice(2, 0, { n: red, x: W * 0.32, y: hy + H * 0.36, k: 1, red: true });
      line.sort(function (a, b) { return a.y - b.y; });
      line.forEach(function (it, k) {
        var dir = it.red ? (turn > 0.5 ? -1 : 1) : 1, ss = s * it.k, yy = it.y + Math.sin(t + k) * ss;
        var o = navyOpts(it.n, t, L, { dir: dir, lanterns: 0.6, furl: 0.2, muzzles: true, roll: it.red ? Math.sin(turn * Math.PI) * 0.06 : 0 });
        MTShip.draw(ctx, it.x, yy, ss, o);
        MTShip.foam(ctx, it.x, yy, ss, dir, t, 0.3, 0.6);
        // aliansi menembak Kapal Induk; Rangkiang Merah menembak ke aliansi
        if (!it.red && t > 0.6 && Math.random() < 0.03) { var w0 = C.shipPt(it.x, yy, ss, 1.05, 1, 30, -10); P.add({ x: w0[0], y: w0[1], r: ss * 10, life: 0.2, col: 'rgba(255,225,150,A)', add: true, glow: true }); shots.push({ x: w0[0], y: w0[1], tx: ix - 80 * is, ty: iy - 30 * is, t: 0, red: false }); }
        if (it.red && t > 4 && Math.random() < 0.09) { var w1 = C.shipPt(it.x, yy, ss, 1.05, -1, 30, -10); P.add({ x: w1[0], y: w1[1], r: ss * 14, life: 0.22, col: 'rgba(255,120,90,A)', add: true, glow: true }); shots.push({ x: w1[0], y: w1[1], tx: W * (0.08 + Math.random() * 0.25), ty: hy + H * (0.18 + Math.random() * 0.14), t: 0, red: true }); shake = Math.min(6, shake + 1.5); }
      });
      // peluru meriam
      for (var q = shots.length - 1; q >= 0; q--) {

        var bx = U.lerp(b.x, b.tx, b.t), by = U.lerp(b.y, b.ty, b.t) - Math.sin(b.t * Math.PI) * H * 0.06;
        ctx.fillStyle = b.red ? '#ff6a4a' : '#20262c'; ctx.beginPath(); ctx.arc(bx, by, Math.max(1.4, s * 2.2), 0, 6.3); ctx.fill();
      }
      P.run(ctx, dt);
      ctx.restore();
      if (t > 4 && t < 4.5) { ctx.fillStyle = 'rgba(255,60,40,' + (0.25 * (1 - (t - 4) / 0.5)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
      C.vignette(ctx, W, H, 0.6);

    }
    return { draw: draw, intro: 9.2 };
  }

  /* ======================= 7. MARIE REGAL MERDEKA ======================= */
  function sceneFall() {
    var r = U.rng(1212), P = new C.Particles(), L = C.makeLit(), glit = MTSky.makeGlitter(r), st = stars(r, 140), lay = null, fwT = 6.6, boomed = false, shake = 0;
    function layout(W, H) {
      var hy = H * 0.56, rr = U.rng(55), T = [], x = -W * 0.02;
      while (x < W * 1.02) { var w = W * (0.035 + rr() * 0.03), h = H * (0.12 + rr() * 0.26); T.push({ x: x, w: w, h: h, off: rr() }); x += w + W * (0.006 + rr() * 0.012); }
      lay = { W: W, H: H, hy: hy, T: T, port: W < H, s: W < H ? W * 0.0021 : Math.min(W * 0.0014, H * 0.0026) };
    }
    function draw(ctx, W, H, t, dt) {
      if (!lay || lay.W !== W || lay.H !== H) layout(W, H);
      var hy = lay.hy, s = lay.s;
      // 0-3 dtk ledakan inti | 3-6 lampu kota padam | 6-12 fajar & lampu hangat
      var dawn = sm(6.5, 15, t), p = MTSky.palette(U.lerp(0.86, 1.06, dawn) % 1, null, 'regal');
      shake = Math.max(0, shake - dt / 1000 * 10);
      ctx.save(); if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      MTSky.paintSky(ctx, W, hy, p, t, st);
      // matahari terbit
      if (dawn > 0) { var sr = Math.max(12, H * 0.05), sx = W * 0.78, sy = hy + sr - dawn * H * 0.22; var sg = ctx.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 10); sg.addColorStop(0, 'rgba(255,200,120,' + (0.5 * dawn).toFixed(3) + ')'); sg.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = sg; ctx.fillRect(sx - sr * 10, sy - sr * 10, sr * 20, sr * 20); ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hy); ctx.clip(); ctx.fillStyle = 'rgba(255,236,200,' + dawn + ')'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.3); ctx.fill(); ctx.restore(); }
      // kota: neon padam satu per satu, lalu lampu hangat menyala
      lay.T.forEach(function (tw, i) {
        MTCities.regalTower(ctx, tw.x, hy + 2, tw.w, tw.h, { c0: '#4a6782', c1: '#22364a', c2: '#0e1a26', spire: 0, floor: Math.max(3, tw.w * 0.11) });
        var neon = 1 - sm(3 + tw.off * 2.5, 3.2 + tw.off * 2.5, t), warm = sm(7.5 + tw.off * 3, 8 + tw.off * 3, t);
        ctx.globalCompositeOperation = 'lighter';
        if (neon > 0.01) { ctx.strokeStyle = 'rgba(110,235,255,' + (0.7 * neon).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.strokeRect(tw.x, hy - tw.h * 0.88, tw.w, tw.h * 0.88); }
        if (warm > 0.01) { var rr2 = U.rng(i * 7 + 3); for (var yy = hy - 4; yy > hy - tw.h * 0.86; yy -= Math.max(3, tw.w * 0.11)) for (var c = 0; c < 4; c++) if (rr2() < 0.5) { ctx.fillStyle = 'rgba(255,200,120,' + (0.6 * warm * (1 - dawn * 0.5)).toFixed(3) + ')'; ctx.fillRect(tw.x + tw.w * c / 4 + 1, yy - 2.2, tw.w / 4 - 2, 1.6); } }
        ctx.globalCompositeOperation = 'source-over';
      });
      // Istana Hening: mata padam, cincin berganti cahaya hangat
      var ix2 = W * 0.36, ih2 = H * (lay.port ? 0.4 : 0.46), iw2 = ih2 * 0.13;
      var ig2 = ctx.createLinearGradient(ix2 - iw2 / 2, 0, ix2 + iw2 / 2, 0); ig2.addColorStop(0, '#dfe8ee'); ig2.addColorStop(1, '#5d6e80');
      ctx.fillStyle = ig2; ctx.beginPath(); ctx.moveTo(ix2 - iw2 / 2, hy + 2); ctx.lineTo(ix2 - iw2 * 0.3, hy - ih2 * 0.86); ctx.lineTo(ix2, hy - ih2); ctx.lineTo(ix2 + iw2 * 0.3, hy - ih2 * 0.86); ctx.lineTo(ix2 + iw2 / 2, hy + 2); ctx.closePath(); ctx.fill();
      var eyeOff = 1 - sm(2.6, 3.4, t), warmRing = sm(8, 9.5, t);
      ctx.globalCompositeOperation = 'lighter';
      if (eyeOff > 0.02) MTCities.regalEye(ctx, ix2, hy - ih2 * 0.48, iw2 * 0.3, 'rgba(150,240,255,' + (0.9 * eyeOff).toFixed(3) + ')', 2);
      ctx.strokeStyle = warmRing > 0.02 ? 'rgba(255,200,120,' + (0.8 * warmRing).toFixed(3) + ')' : 'rgba(150,240,255,' + (0.7 * eyeOff).toFixed(3) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(ix2, hy - ih2 * 0.7, iw2 * 1.3, iw2 * 0.3, 0, 0, 6.3); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      if (warmRing > 0.1) C.waveFlag(ctx, ix2, hy - ih2 - H * 0.04, H * 0.05, H * 0.028, t, '#c9342a');
      if (warmRing > 0.1) { ctx.strokeStyle = '#d9dee2'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(ix2, hy - ih2); ctx.lineTo(ix2, hy - ih2 - H * 0.045); ctx.stroke(); }
      p.glitter = [255, 214, 160];
      MTSky.paintSea(ctx, W, H, hy, p, t, { glitter: glit, rough: 0.9, drift: 6 });
      L.set(p.tint);
      // Kapal Induk tumbang
      var ix = W * (lay.port ? 0.6 : 0.62), is = s * (lay.port ? 1.1 : 1.3), sink = sm(1.5, 9, t);
      if (sink < 0.995) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, hy + H * 0.2 + 4 * is); ctx.clip();
        ctx.translate(ix, hy + H * 0.2 + sink * sink * 70 * is); ctx.rotate(sink * 0.12);
        induk(ctx, 0, 0, is, { dir: -1, t: t, lit: L, hp: 0.05, lights: 1 - sm(0.8, 2.5, t), core: 1 - sm(0, 1.4, t) });
        ctx.restore();
        if (Math.random() < 0.6 * (1 - sink)) P.add({ x: ix + (Math.random() - 0.5) * 220 * is, y: hy + H * 0.2 - Math.random() * 40 * is, vx: (Math.random() - 0.5) * 0.4, vy: -0.8 - Math.random(), drag: 0.99, r: is * (6 + Math.random() * 8), grow: is * 0.2, life: 2.5, col: 'rgba(60,56,60,A)', a: 0.55, fadeIn: true, glow: true });
      }

      // genderang: gelombang hangat setelah gelap
      if (t > 6) { var bk = (t * 1.6) % 1; ctx.strokeStyle = 'rgba(255,200,140,' + (0.25 * (1 - bk) * sm(6, 7, t)).toFixed(3) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(W * 0.5, hy, W * (0.1 + bk * 0.6), H * (0.02 + bk * 0.1), 0, 0, 6.3); ctx.stroke(); }
      // kembang api perayaan
      fwT -= dt / 1000;
      if (t > 6.6 && fwT <= 0) { fwT = 0.4 + Math.random() * 0.8; C.burst(P, W * (0.1 + Math.random() * 0.8), hy * (0.15 + Math.random() * 0.45), Math.max(1.1, Math.min(W, H) * 0.0035), C.FW); }
      P.run(ctx, dt);
      ctx.restore();
      if (t > 3 && t < 6.5) { ctx.fillStyle = 'rgba(0,0,0,' + (0.35 * Math.sin((t - 3) / 3.5 * Math.PI)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
      C.vignette(ctx, W, H, 0.45);
      ttl(ctx, W, H, sm(10, 11.6, t), 'MARIE REGAL MERDEKA', 'Genderang tak akan pernah diam lagi', H * (lay.port ? 0.12 : 0.14));
      fadeIn(ctx, W, H, t, 0.6);

  }

  MTCine.register('pelican', scenePelican);
  MTCine.register('marieregal', sceneMarieRegal);
  MTCine.register('drones', sceneDrones);
  MTCine.register('marlya', sceneMarlya);
  MTCine.register('genderang', sceneGenderang);
  MTCine.register('betrayal', sceneBetrayal);
  MTCine.register('fall', sceneFall);

  return { induk: induk, drone: drone, pelican: pelican, shieldDome: shieldDome };
})();
