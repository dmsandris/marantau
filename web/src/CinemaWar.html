<script>
/**
 * CinemaWar.html - seni untuk Quest "Warwerwor" (Tide v18).
 * ------------------------------------------------------------------
 * MTWar.induk(ctx, x, y, s, o)   Kapal Induk HENING (benteng baja M.A.R.I.E.)
 * MTWar.drone(ctx, x, y, s, o)   drone pemburu Moramora
 * MTWar.pelican(ctx, x, y, s, o) pelikan mesin pembawa surat
 * Adegan MTCine: pelican | marieregal | drones | marlya | genderang | betrayal | fall
 * Semua gambar prosedural & orisinal. Di-include sesudah Cinema.html.
 * ------------------------------------------------------------------
 */
var MTWar = (function () {
  var C = MTCine.H, U = C.U, sm = C.sm, ease = C.ease, rgb = C.rgb;
  function hexA(h, a) { return U.css(U.hex(h), a); }

  /* ======================= KAPAL INDUK HENING ======================= */
  // (x,y) = garis air tengah kapal, s = px per unit, panjang lambung ~300 unit.
  // o: { dir (-1 menghadap kiri), t, lit, hp (0..1), shield (0..1), core (0..1: inti merah terbuka), lights (0..1), sink (0..1) }
  function induk(ctx, x, y, s, o) {
    o = o || {}; var t = o.t || 0, dir = o.dir || -1, L = o.lit || function (c, a) { return a == null ? c : hexA(c, a); };
    var hp = o.hp == null ? 1 : o.hp, li = o.lights == null ? 0.6 : o.lights;
    ctx.save(); ctx.translate(x, y); ctx.scale(s * -dir, s);   // gambar menghadap kiri pada dir=-1
    // lambung
    var hg = ctx.createLinearGradient(0, -40, 0, 8); hg.addColorStop(0, L('#5d6976')); hg.addColorStop(0.55, L('#2f3843')); hg.addColorStop(1, L('#171d24'));
    ctx.fillStyle = hg; ctx.beginPath();
    ctx.moveTo(-158, -30); ctx.lineTo(132, -34); ctx.lineTo(150, -22); ctx.lineTo(142, 6); ctx.lineTo(-132, 8); ctx.lineTo(-170, -12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = L('#8e9aa6'); ctx.beginPath(); ctx.moveTo(-158, -30); ctx.lineTo(132, -34); ctx.lineTo(134, -31); ctx.lineTo(-154, -27); ctx.closePath(); ctx.fill();
    ctx.fillStyle = L('#0e1217'); ctx.fillRect(-150, -2, 290, 6);
    ctx.strokeStyle = L('#1a2129', 0.8); ctx.lineWidth = 0.8;
    for (var pl = -140; pl < 140; pl += 18) { ctx.beginPath(); ctx.moveTo(pl, -30); ctx.lineTo(pl + 2, 4); ctx.stroke(); }
    // bangunan atas bertingkat
    function block(x0, y0, w, h, c0, c1) { var g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, L(c0)); g.addColorStop(1, L(c1)); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + w * 0.08, y0 - h); ctx.lineTo(x0 + w * 0.92, y0 - h); ctx.lineTo(x0 + w, y0); ctx.closePath(); ctx.fill(); }
    block(-40, -32, 150, 22, '#6c7884', '#3a444f');
    block(-20, -54, 108, 22, '#76838f', '#424d58');
    block(2, -76, 66, 22, '#8290a0', '#4a5663');
    // menara komando + lambang mata
    var tg = ctx.createLinearGradient(18, 0, 52, 0); tg.addColorStop(0, L('#a9b6c2')); tg.addColorStop(1, L('#56636f'));
    ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(18, -98); ctx.lineTo(24, -138); ctx.lineTo(46, -138); ctx.lineTo(52, -98); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = L('#c9d4dd'); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(35, -138); ctx.lineTo(35, -168); ctx.moveTo(28, -150); ctx.lineTo(42, -150); ctx.moveTo(30, -158); ctx.lineTo(40, -158); ctx.stroke();
    // radar berputar
    var ra = Math.sin(t * 1.6) * 9;
    ctx.fillStyle = L('#c9d4dd'); ctx.beginPath(); ctx.ellipse(35, -140, Math.abs(ra) + 1.5, 3.2, 0, 0, 6.3); ctx.fill();
    // jendela anjungan
    ctx.fillStyle = li > 0.1 ? 'rgba(130,230,255,' + (0.55 + 0.4 * li) + ')' : L('#1b2632');
    for (var w2 = 0; w2 < 6; w2++) ctx.fillRect(-14 + w2 * 16, -70, 9, 4);
    for (var w3 = 0; w3 < 8; w3++) ctx.fillRect(-32 + w3 * 17, -47, 9, 4);
    // meriam menara depan & belakang
    function turret(cx, cy, k) {
      ctx.fillStyle = L('#3f4a55'); ctx.beginPath(); ctx.ellipse(cx, cy, 13 * k, 6 * k, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = L('#58646f'); ctx.fillRect(cx - 11 * k, cy - 2 * k, 22 * k, 3 * k);
      ctx.strokeStyle = L('#222a32'); ctx.lineWidth = 2.6 * k; ctx.beginPath(); ctx.moveTo(cx - 6 * k, cy - 4 * k); ctx.lineTo(cx - 32 * k, cy - 9 * k); ctx.moveTo(cx - 6 * k, cy - 1 * k); ctx.lineTo(cx - 32 * k, cy - 5 * k); ctx.stroke();
    }
    turret(-110, -31, 1.1); turret(-70, -32, 0.9); turret(118, -35, 0.9);
    // lambang M.A.R.I.E.: mata terpejam bercahaya
    var eg = li * 0.6 + 0.4;
    ctx.save(); ctx.translate(35, -118);
    ctx.globalCompositeOperation = 'lighter';
    var gl = ctx.createRadialGradient(0, 0, 0, 0, 0, 22); gl.addColorStop(0, 'rgba(110,235,255,' + (0.45 * eg).toFixed(3) + ')'); gl.addColorStop(1, 'rgba(110,235,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(-22, -22, 44, 44);
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = 'rgba(150,240,255,' + (0.65 + 0.35 * eg).toFixed(3) + ')'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, 0, 10, 6.2, 0, 0, 6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7.8, 0); ctx.quadraticCurveTo(0, 4.2, 7.8, 0); ctx.stroke();
    for (var k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 2.8, 2 - Math.abs(k) * 0.4); ctx.lineTo(k * 3.2, 4.2); ctx.stroke(); }
    ctx.restore();
    // garis lampu biru sepanjang lambung
    ctx.globalCompositeOperation = 'lighter';
    var run = ((t * 60) % 300) - 150;
    ctx.fillStyle = 'rgba(110,235,255,' + (0.25 + 0.5 * li).toFixed(3) + ')'; ctx.fillRect(-150, -16, 290, 1.4);
    var rg = ctx.createLinearGradient(run - 30, 0, run + 30, 0); rg.addColorStop(0, 'rgba(160,245,255,0)'); rg.addColorStop(0.5, 'rgba(200,250,255,.9)'); rg.addColorStop(1, 'rgba(160,245,255,0)');
    ctx.fillStyle = rg; ctx.fillRect(run - 30, -17, 60, 3.2);
    // lampu suar merah
    if (Math.sin(t * 3) > 0) { ctx.fillStyle = 'rgba(255,70,60,.95)'; ctx.beginPath(); ctx.arc(35, -169, 2, 0, 6.3); ctx.arc(-150, -32, 1.6, 0, 6.3); ctx.fill(); }
    // inti merah terbuka (perisai runtuh)
    if (o.core > 0) {
      var cp = 0.7 + 0.3 * Math.sin(t * 8), cr = 26 * o.core;
      var cg = ctx.createRadialGradient(20, -40, 0, 20, -40, cr * 2.2); cg.addColorStop(0, 'rgba(255,120,90,' + (0.9 * cp) + ')'); cg.addColorStop(0.4, 'rgba(255,40,40,' + (0.45 * cp) + ')'); cg.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = cg; ctx.fillRect(20 - cr * 2.2, -40 - cr * 2.2, cr * 4.4, cr * 4.4);
    }
    ctx.globalCompositeOperation = 'source-over';
    // kerusakan: retakan menyala
    if (hp < 0.7) {
      ctx.strokeStyle = 'rgba(255,150,70,' + (0.6 * (0.7 - hp) / 0.7 + 0.3).toFixed(3) + ')'; ctx.lineWidth = 1.4;
      [[-90, -28, -80, -10, -86, 0], [10, -30, 18, -14, 12, -4], [70, -32, 64, -18, 74, -6], [-30, -50, -24, -36, -32, -32]].forEach(function (c, i) {
        if (hp > 0.6 - i * 0.15) return; ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.lineTo(c[2], c[3]); ctx.lineTo(c[4], c[5]); ctx.stroke();
      });
    }
    ctx.restore();
    // perisai kubah heksagon
    if (o.shield > 0.01) shieldDome(ctx, x + 10 * s * -dir, y - 40 * s, 200 * s, 120 * s, t, o.shield);
  }
  function shieldDome(ctx, cx, cy, rx, ry, t, a) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(cx, cy, Math.min(rx, ry) * 0.5, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, 'rgba(120,220,255,0)'); g.addColorStop(0.85, 'rgba(120,220,255,' + (0.16 * a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(170,240,255,' + (0.42 * a).toFixed(3) + ')');
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, Math.PI, 0); ctx.lineTo(cx + rx, cy + ry * 0.35); ctx.ellipse(cx, cy + ry * 0.35, rx, ry * 0.12, 0, 0, Math.PI); ctx.closePath();
    ctx.fillStyle = g; ctx.fill(); ctx.clip();
    var hs = Math.max(8, rx * 0.09), hh = hs * 0.866;
    ctx.strokeStyle = 'rgba(170,240,255,' + (0.28 * a).toFixed(3) + ')'; ctx.lineWidth = 1;
    for (var row = -14; row < 14; row++) for (var col = -14; col < 14; col++) {
      var hx = cx + col * hs * 1.5, hy = cy + row * hh * 2 + (col % 2 ? hh : 0);
      var pulse = 0.5 + 0.5 * Math.sin(t * 3 - Math.hypot(hx - cx, hy - cy) * 0.03);
      ctx.globalAlpha = 0.35 + 0.65 * pulse;
      ctx.beginPath(); for (var k = 0; k < 6; k++) { var an = k / 6 * Math.PI * 2; var px = hx + Math.cos(an) * hs * 0.5, py = hy + Math.sin(an) * hs * 0.5; if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py); } ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  /* ======================= DRONE PEMBURU ======================= */
  // (x,y) = pusat tubuh drone (melayang); s = px per unit; lebar ~90 unit
  function drone(ctx, x, y, s, o) {
    o = o || {}; var t = o.t || 0, L = o.lit || function (c, a) { return a == null ? c : hexA(c, a); }, eye = o.eye || [255, 70, 70];
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(o.tilt || 0);
    // lengan & rotor
    ctx.strokeStyle = L('#7d8b98'); ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(-14, -3); ctx.lineTo(-40, -10); ctx.moveTo(14, -3); ctx.lineTo(40, -10); ctx.stroke();
    [-40, 40].forEach(function (rx, i) {
      ctx.fillStyle = L('#3f4a55'); ctx.fillRect(rx - 5, -14, 10, 7);
      var spin = Math.abs(Math.sin(t * 40 + i));
      ctx.fillStyle = 'rgba(210,230,245,' + (0.22 + 0.2 * spin).toFixed(3) + ')'; ctx.beginPath(); ctx.ellipse(rx, -15, 17, 2.4, 0, 0, 6.3); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      var rg = ctx.createRadialGradient(rx, -7, 0, rx, -7, 12); rg.addColorStop(0, 'rgba(110,235,255,.55)'); rg.addColorStop(1, 'rgba(110,235,255,0)');
      ctx.fillStyle = rg; ctx.fillRect(rx - 12, -19, 24, 24); ctx.globalCompositeOperation = 'source-over';
    });
    // badan piring
    var bg = ctx.createLinearGradient(0, -16, 0, 10); bg.addColorStop(0, L('#f2f6f9')); bg.addColorStop(0.5, L('#aebbc7')); bg.addColorStop(1, L('#4d5965'));
    ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(0, 0, 26, 9, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = L('#d9e2ea'); ctx.beginPath(); ctx.ellipse(0, -6, 13, 9, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = L('#2a3440'); ctx.fillRect(-26, -1, 52, 2);
    // senapan gantung
    ctx.fillStyle = L('#3a444f'); ctx.beginPath(); ctx.arc(0, 9, 5.5, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = L('#222a32'); ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(-3, 12); ctx.lineTo(-16, 17); ctx.stroke();
    // mata lensa
    ctx.globalCompositeOperation = 'lighter';
    var ea = o.eyeA == null ? 1 : o.eyeA, ex = -10;
    var eg2 = ctx.createRadialGradient(ex, -1, 0, ex, -1, 14); eg2.addColorStop(0, 'rgba(' + eye.join(',') + ',' + (0.8 * ea).toFixed(3) + ')'); eg2.addColorStop(1, 'rgba(' + eye.join(',') + ',0)');
    ctx.fillStyle = eg2; ctx.fillRect(ex - 14, -15, 28, 28);
    ctx.fillStyle = 'rgba(' + eye.join(',') + ',' + ea.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(ex, -1, 2.6, 0, 6.3); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // nomor seri
    if (o.code) { ctx.fillStyle = L('#3a444f', 0.8); ctx.font = '700 5px Cinzel, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(o.code, 9, 3.5); }
    ctx.restore();
  }

  /* ======================= PELIKAN MESIN ======================= */
  // (x,y) = pusat badan; s = px per unit (badan ~60 unit). Menghadap kiri pada dir=1.
  // o.flap 0..1 siklus kepak, o.perch = hinggap (sayap terlipat), o.letter, o.red (kilat mata merah 0..1)
  function pelican(ctx, x, y, s, o) {
    o = o || {}; var L = o.lit || function (c, a) { return a == null ? c : hexA(c, a); }, dir = o.dir || 1, fl = o.flap || 0, t = o.t || 0;
    ctx.save(); ctx.translate(x, y); ctx.scale(s * dir, s);
    function flyWing(back) {
      var ang = Math.sin(fl * Math.PI * 2) * 0.85;          // naik-turun
      ctx.save(); ctx.translate(back ? 10 : 2, -6); ctx.rotate(-ang + (back ? -0.18 : 0));
      ctx.scale(1, back ? 0.85 : 1);
      var g = ctx.createLinearGradient(0, -10, 0, 12); g.addColorStop(0, L(back ? '#d4dbe1' : '#ffffff')); g.addColorStop(1, L(back ? '#a7b2bc' : '#d9dfe4'));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-6, 4); ctx.quadraticCurveTo(14, -30, 46, -50); ctx.lineTo(70, -60); ctx.lineTo(66, -50); ctx.quadraticCurveTo(40, -18, 18, 10); ctx.closePath(); ctx.fill();
      // bulu primer hitam berjari
      ctx.fillStyle = L('#24282e');
      for (var f = 0; f < 5; f++) { var bx = 46 + f * 4.6, by = -50 - f * 2.2; ctx.beginPath(); ctx.moveTo(bx - 6, by + 4); ctx.lineTo(bx + 10, by - 6 + f * 0.6); ctx.lineTo(bx + 2, by + 6); ctx.closePath(); ctx.fill(); }
      ctx.strokeStyle = L('#9aa6b1', 0.7); ctx.lineWidth = 0.6;
      for (var q = 1; q < 6; q++) { ctx.beginPath(); ctx.moveTo(4 + q * 8, -4 - q * 7); ctx.lineTo(10 + q * 8, 4 - q * 6); ctx.stroke(); }
      ctx.restore();
    }
    if (!o.perch) flyWing(true);
    // ekor
    ctx.fillStyle = L('#c9d1d8'); ctx.beginPath(); ctx.moveTo(26, -2); ctx.lineTo(42, -6); ctx.lineTo(42, 4); ctx.lineTo(26, 6); ctx.closePath(); ctx.fill();
    // badan
    var bg = ctx.createLinearGradient(0, -14, 0, 14); bg.addColorStop(0, L('#ffffff')); bg.addColorStop(1, L('#bcc5cd'));
    ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(6, 1, 25, 12.5, o.perch ? -0.25 : -0.05, 0, 6.3); ctx.fill();
    if (o.perch) {
      // sayap terlipat di punggung, ujung hitam melewati ekor
      var wg = ctx.createLinearGradient(0, -12, 0, 8); wg.addColorStop(0, L('#eef2f5')); wg.addColorStop(1, L('#aab5bf'));
      ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(-8, -6); ctx.quadraticCurveTo(12, -16, 38, -10); ctx.lineTo(46, -4); ctx.quadraticCurveTo(22, 6, -4, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = L('#24282e'); ctx.beginPath(); ctx.moveTo(26, -9); ctx.lineTo(50, -6); ctx.lineTo(30, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = L('#9aa6b1', 0.7); ctx.lineWidth = 0.6;
      for (var fq = 0; fq < 4; fq++) { ctx.beginPath(); ctx.moveTo(fq * 7, -9 + fq * 0.5); ctx.quadraticCurveTo(fq * 7 + 8, -4, fq * 7 + 4, 3); ctx.stroke(); }
    }
    // leher S & kepala berjambul
    ctx.strokeStyle = L('#f4f6f8'); ctx.lineWidth = 8.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14, -3); ctx.bezierCurveTo(-26, -8, -14, -20, -20, -30); ctx.stroke();
    ctx.fillStyle = L('#fbfcfd'); ctx.beginPath(); ctx.ellipse(-21, -32, 7.2, 6.2, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = L('#f1e7c6'); ctx.beginPath(); ctx.moveTo(-18, -38); ctx.quadraticCurveTo(-12, -42, -10, -36); ctx.quadraticCurveTo(-14, -37, -17, -35); ctx.fill();
    // paruh panjang + kantong
    ctx.fillStyle = L('#e9a548'); ctx.beginPath(); ctx.moveTo(-26, -34); ctx.lineTo(-66, -27); ctx.quadraticCurveTo(-68, -25, -65, -24); ctx.lineTo(-26, -29); ctx.closePath(); ctx.fill();
    ctx.fillStyle = L('#f3c47a'); ctx.beginPath(); ctx.moveTo(-26, -29); ctx.lineTo(-64, -24); ctx.quadraticCurveTo(-46, -12, -28, -20); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = L('#b8742a', 0.7); ctx.lineWidth = 0.6; ctx.beginPath(); ctx.moveTo(-28, -31); ctx.lineTo(-64, -25.5); ctx.stroke();
    if (o.letter) {
      ctx.save(); ctx.translate(-52, -26); ctx.rotate(0.14);
      ctx.fillStyle = L('#f2f5f8'); ctx.fillRect(-9, -5.5, 18, 11);
      ctx.strokeStyle = L('#9aa6b2'); ctx.lineWidth = 0.5; ctx.strokeRect(-9, -5.5, 18, 11);
      ctx.beginPath(); ctx.moveTo(-9, -5.5); ctx.lineTo(0, 1); ctx.lineTo(9, -5.5); ctx.stroke();
      var gl = 0.55 + 0.45 * Math.sin(t * 4);
      var sg = ctx.createRadialGradient(0, 1, 0, 0, 1, 4); sg.addColorStop(0, 'rgba(240,248,255,' + gl.toFixed(3) + ')'); sg.addColorStop(1, 'rgba(160,180,200,' + (gl * 0.8).toFixed(3) + ')');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, 1, 3.2, 0, 6.3); ctx.fill();
      ctx.restore();
    }
    // sambungan logam samar (petunjuk: dia mesin)
    ctx.strokeStyle = L('#8f9aa5', 0.5); ctx.lineWidth = 0.55;
    ctx.beginPath(); ctx.moveTo(-4, -9); ctx.lineTo(-1, 12); ctx.moveTo(16, -10); ctx.lineTo(18, 11); ctx.moveTo(-23, -37); ctx.lineTo(-19, -27); ctx.stroke();
    // mata
    var red = o.red || 0;
    ctx.fillStyle = L('#1b1f24'); ctx.beginPath(); ctx.arc(-23, -33, 1.6, 0, 6.3); ctx.fill();
    if (red > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      var rg = ctx.createRadialGradient(-23, -33, 0, -23, -33, 9); rg.addColorStop(0, 'rgba(255,60,50,' + red.toFixed(3) + ')'); rg.addColorStop(1, 'rgba(255,40,30,0)');
      ctx.fillStyle = rg; ctx.fillRect(-32, -42, 18, 18);
      ctx.fillStyle = 'rgba(255,100,90,' + red.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(-23, -33, 1.5, 0, 6.3); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    // kaki
    ctx.strokeStyle = L('#e9a548'); ctx.lineWidth = 2.2;
    if (o.perch) { ctx.beginPath(); ctx.moveTo(2, 11); ctx.lineTo(0, 22); ctx.lineTo(-5, 23); ctx.moveTo(11, 11); ctx.lineTo(11, 22); ctx.lineTo(6, 23); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(20, 9); ctx.lineTo(34, 12); ctx.stroke(); }
    if (!o.perch) flyWing(false);
    ctx.restore();
  }

  /* -------- pembantu adegan -------- */
  function ttl(ctx, W, H, a, main, sub, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);
    ctx.save(); ctx.font = fs.toFixed(1) + 'px ' + C.TITLE_FONT; var w = ctx.measureText(main).width * (1 + 0.06 * 1.2); ctx.restore();
    var k = Math.min(1, W * 0.9 / Math.max(1, w));
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.translate(-W / 2, -y);
    C.title(ctx, W, H, a, main, sub, y);
    ctx.restore();
  }
  function fadeIn(ctx, W, H, t, d) { if (t < d) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, d, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); } }
  function stars(r, n) { var a = []; for (var i = 0; i < n; i++) a.push({ x: r(), y: Math.pow(r(), 1.4) * 0.9, r: r() < 0.9 ? 1 : 1.6, tw: 0.5 + r() * 2, ph: r() * 6.28 }); return a; }
  function navyOpts(n, t, L, extra) {
    var o = { dir: n.dir, t: t, hull: n.hull, trim: '#c9a04a', sail: n.sail, sailStripe: n.stripe, flag: n.flag, emblem: n.emb, emblemColor: '#f3e9d2', pennant: n.flag, masts: 3, studding: 1, ports: 5, lit: L, sizeK: n.k2 || 1.05 };
    for (var k in extra) o[k] = extra[k];
    return o;
  }
  var FLEET = [
    { sail: '#f1dccb', stripe: '#b3261e', flag: '#b3261e', emb: 'crest', hull: '#6b4226' },
    { sail: '#dde8f1', stripe: '#2f7fa3', flag: '#2f7fa3', emb: 'anchor', hull: '#4a3322' },
    { sail: '#f3e6b0', stripe: '#c9a033', flag: '#c9a033', emb: 'star', hull: '#5a3a22' },
    { sail: '#dcefd4', stripe: '#3f8c3f', flag: '#3f8c3f', emb: 'compass', hull: '#6b4a2c' },
    { sail: '#ecdcf2', stripe: '#8e3d8a', flag: '#8e3d8a', emb: 'crescent', hull: '#5a3a2a' }
  ];

  /* ======================= 5. GENDERANG DITABUH ======================= */

  /* ======================= 6. PENGKHIANATAN ======================= */
