<script>
/* =====================================================================
 * S5Peta — peta laut dunia seberang (Saga 5, Fase B). Canvas mandiri, tanpa aset luar,
 * terpisah total dari MTChart: tidak ada satu pun unsur peta Mare.
 *
 *   var ctl = S5Peta.mount(canvas, {
 *     pulau: { s5_p1: { nama, terbuka }, ... },      // nama tampil datang dari server
 *     titik: { s5_t1: { nama, terbuka }, s5_t2: {..., emas}, s5_t3: {...} },
 *     rute:  [['s5_p1','s5_p2'], ...],               // rute terbuka = rasi bintang bergaris
 *     di: 's5_p1', tuju: null, fase: 2|3|4|5 (5 = tamat),
 *     ringan: null|true|false (null = otomatis), onPick: function (id) { }
 *   });
 *   ctl.update(opts) · ctl.panggil(nama) · ctl.info() · ctl.destroy()
 *
 * Lapisan: bintang 3 lapis (paralaks) · aurora · pohon dunia + akar berdenyut · titian tujuh warna ·
 * dinding kabut selatan · palung kaca · rasi rute · pulau · makhluk (maks 2 besar bergerak bersamaan).
 * Mode ringan otomatis bila fps < 45 selama 3 detik. prefers-reduced-motion: tanpa paralaks & bintang jatuh.
 * ===================================================================== */
var S5Peta = (function () {
  var W0 = 1600, H0 = 1000, TAU = Math.PI * 2;
  var RAIN = ['255,90,90', '255,160,70', '255,225,90', '120,225,120', '90,180,255', '120,110,255', '200,120,255'];

  /* ---------- tata letak tetap (koordinat dunia 1600 x 1000) ---------- */
  var POHON = { x: 800, y: 600, tajuk: 380, r: 165 };
  var GEO = {
    s5_p1: { x: 250, y: 620, r: 62, ciri: 'gerbang', seed: 11 },
    s5_p2: { x: 470, y: 300, r: 78, ciri: 'raksasa', seed: 23 },
    s5_p3: { x: 1335, y: 330, r: 58, ciri: 'tali', seed: 37 },
    s5_p4: { x: 1300, y: 625, r: 60, ciri: 'barak', seed: 41 },
    s5_p5: { x: 1075, y: 165, r: 66, ciri: 'aula', seed: 53 },
    s5_p6: { x: 470, y: 815, r: 56, ciri: 'menara', seed: 67 },
    s5_t1: { x: 905, y: 700, r: 26, titik: 'akar' },
    s5_t2: { x: 1140, y: 815, r: 30, titik: 'selatan' },
    s5_t3: { x: 1290, y: 915, r: 64, titik: 'palung' }
  };
  var DWARF = { s5_p1: 1, s5_p5: 1, s5_p6: 1 };
  var SELATAN = [[930, 805], [1050, 790], [1170, 812], [1290, 796], [1410, 815], [1530, 798], [1640, 808]];

  function rng(seed) { var s = (seed >>> 0) || 1; return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function sm(a, b, t) { var k = Math.max(0, Math.min(1, (t - a) / (b - a))); return k * k * (3 - 2 * k); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function reduce() { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }

  /* bentuk pulau: poligon berderau (tetap per seed) */
  function bentuk(g) {
    if (g._pts) return g._pts;
    var r = rng(g.seed * 977), n = 22, pts = [];
    for (var i = 0; i < n; i++) {
      var a = i / n * TAU, rr = g.r * (0.72 + r() * 0.38) * (1 + 0.18 * Math.sin(a * 3 + g.seed));
      pts.push([Math.cos(a) * rr * 1.2, Math.sin(a) * rr * 0.72]);
    }
    return (g._pts = pts);
  }
  function jalur(ctx, pts) {
    var n = pts.length; ctx.beginPath();
    for (var j = 0; j <= n; j++) {
      var p0 = pts[j % n], p1 = pts[(j + 1) % n], mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2;
      if (j === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p0[0], p0[1], mx, my);
    }
    ctx.closePath();
  }
  function akarKe(g) {   // akar emas dari kaki pohon ke pulau (bezier di dasar laut)
    var bx = POHON.x, by = POHON.y + 30, dx = g.x - bx, dy = g.y - by;
    return { a: { x: bx, y: by }, c: { x: bx + dx * 0.45 - dy * 0.22, y: by + dy * 0.45 + dx * 0.12 + 40 }, b: { x: g.x, y: g.y + g.r * 0.4 } };
  }
  function bez(q, t) { var u = 1 - t; return { x: u * u * q.a.x + 2 * u * t * q.c.x + t * t * q.b.x, y: u * u * q.a.y + 2 * u * t * q.c.y + t * t * q.b.y }; }

  function mount(cv, opts) {
    var ctx = cv.getContext('2d');
    var O = {}, st = { t: 0, last: 0, raf: 0, dead: false, panX: 0, panY: 0, s: 1, ox: 0, oy: 0, cw: 0, ch: 0, dpr: 1 };
    var RM = reduce(), ringan = false, fpsLog = [], lambat = 0;
    var bintang = [], jauh = null, auroraStatis = null, makhluk = [], antri = [], jatuh = null, jatuhNext = 6;
    var r0 = rng(424242);

    /* ---------- bintang: 3 lapis di area 1,3x dunia ---------- */
    for (var L = 0; L < 3; L++) {
      var arr = [], nL = [520, 160, 70][L];
      for (var i = 0; i < nL; i++) arr.push({ x: r0() * W0 * 1.3 - W0 * 0.15, y: r0() * H0 * 1.3 - H0 * 0.15, r: [0.6, 1.1, 1.7][L] * (0.6 + r0() * 0.8), p: r0() * TAU, w: 0.6 + r0() * 2.2, warm: r0() < 0.18 });
      bintang.push(arr);
    }

    function set(o) {
      O = Object.assign({ pulau: {}, titik: {}, rute: [], fase: 2, di: null, tuju: null, ringan: null }, O, o || {});
      if (O.ringan === true) ringan = true; else if (O.ringan === false) ringan = false;
    }
    set(opts);

    /* ---------- ukuran & pandangan ---------- */
    function ukur() {
      var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, ringan ? 1.25 : 2);
      var cw = Math.max(1, Math.round(r.width)), ch = Math.max(1, Math.round(r.height));
      if (cw === st.cw && ch === st.ch && dpr === st.dpr) return;
      st.cw = cw; st.ch = ch; st.dpr = dpr; cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
      var s = Math.min(cw / W0, ch / H0); if (cw / ch < 1.05) s = ch / H0 * 0.98;   // HP tegak: geser ke samping
      st.s = s; st.ox = (cw - W0 * s) / 2; st.oy = (ch - H0 * s) / 2; jepit();
      jauh = null; auroraStatis = null;
    }
    function jepit() {
      var lebih = Math.max(0, W0 * st.s - st.cw) / 2, lebihY = Math.max(0, H0 * st.s - st.ch) / 2;
      st.panX = Math.max(-lebih, Math.min(lebih, st.panX)); st.panY = Math.max(-lebihY, Math.min(lebihY, st.panY));
    }
    function keDunia(px, py) { return { x: (px - st.ox - st.panX) / st.s, y: (py - st.oy - st.panY) / st.s }; }
    function pusatkan(id) { var g = GEO[id]; if (!g) return; st.panX = (W0 / 2 - g.x) * st.s; st.panY = 0; jepit(); }

    /* ---------- lapis jauh (offscreen, sekali) ---------- */
    function lapisJauh() {
      var c = document.createElement('canvas'), w = Math.round(st.cw * 1.4 * st.dpr), h = Math.round(st.ch * 1.4 * st.dpr);
      c.width = w; c.height = h; var x = c.getContext('2d');
      var g = x.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#03040b'); g.addColorStop(0.45, '#060a18'); g.addColorStop(0.75, '#040814'); g.addColorStop(1, '#020309');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      // kabut bima sakti diagonal
      x.save(); x.translate(w * 0.5, h * 0.42); x.rotate(-0.32);
      var mg = x.createLinearGradient(0, -h * 0.18, 0, h * 0.18);
      mg.addColorStop(0, 'rgba(40,50,90,0)'); mg.addColorStop(0.5, 'rgba(70,80,130,.16)'); mg.addColorStop(1, 'rgba(40,50,90,0)');
      x.fillStyle = mg; x.fillRect(-w, -h * 0.18, w * 2, h * 0.36); x.restore();
      var r = rng(777);
      for (var i = 0; i < 260; i++) { var cx = r() * w, cy = h * 0.42 + (r() - 0.5) * h * 0.3 - (cx - w / 2) * 0.33, rr = (2 + r() * 10) * st.dpr;
        var gg = x.createRadialGradient(cx, cy, 0, cx, cy, rr); gg.addColorStop(0, 'rgba(150,160,220,.05)'); gg.addColorStop(1, 'rgba(150,160,220,0)'); x.fillStyle = gg; x.fillRect(cx - rr, cy - rr, rr * 2, rr * 2); }
      var sc = Math.min(w / (W0 * 1.3), h / (H0 * 1.3));
      bintang[0].forEach(function (b) { x.fillStyle = b.warm ? 'rgba(255,220,170,.75)' : 'rgba(215,225,255,.7)'; x.beginPath(); x.arc((b.x + W0 * 0.15) * sc * 1.08, (b.y + H0 * 0.15) * sc * 1.08, b.r * st.dpr * 0.8, 0, TAU); x.fill(); });
      jauh = c;
    }

    /* ---------- aurora: tirai kolom-kolom tipis (tekstur gradien sekali, lalu drawImage per kolom) ---------- */
    var tirai = null;
    function teksturTirai() {
      tirai = [];
      [['90,255,170', '170,255,210'], ['120,230,200', '200,255,230'], ['214,176,92', '255,226,150']].forEach(function (cc) {
        var c = document.createElement('canvas'); c.width = 4; c.height = 128; var x = c.getContext('2d');
        var g = x.createLinearGradient(0, 0, 0, 128);
        g.addColorStop(0, 'rgba(' + cc[0] + ',0)'); g.addColorStop(0.55, 'rgba(' + cc[0] + ',.25)'); g.addColorStop(0.9, 'rgba(' + cc[1] + ',.75)'); g.addColorStop(1, 'rgba(' + cc[1] + ',0)');
        x.fillStyle = g; x.fillRect(0, 0, 4, 128); tirai.push(c);
      });
    }
    function aurora(c, t, w, alpha) {
      if (!tirai) teksturTirai();
      c.save(); c.globalCompositeOperation = 'lighter';
      for (var k = 0; k < 3; k++) {
        var base = H0 * (0.13 + k * 0.065), step = 7;
        for (var x0 = -420; x0 < W0 + 420; x0 += step) {
          var y0 = base + Math.sin(x0 * 0.0038 + t * 0.22 + k * 1.7) * 42 + Math.sin(x0 * 0.012 - t * 0.37 + k) * 12;
          var h = 130 + 60 * Math.sin(x0 * 0.007 + t * 0.3 + k * 2) + 30 * Math.sin(x0 * 0.031 + k);
          var a = alpha * Math.pow(0.5 + 0.5 * Math.sin(x0 * 0.0031 + t * 0.18 + k * 2.2), 1.6) * (k === 2 ? 0.3 : k === 1 ? 0.6 : 1);
          if (a < 0.03) continue;
          c.globalAlpha = Math.min(1, a); c.drawImage(tirai[k], x0, y0 - h, step + 1, h);
        }
      }
      c.restore();
    }

    /* ---------- pohon dunia ---------- */
    function pohon(c, t) {
      var x = POHON.x, y = POHON.y, ty = POHON.tajuk, R = POHON.r, tenang = O.fase >= 5;
      var gl = c.createRadialGradient(x, ty, 10, x, ty, R * 1.6);
      gl.addColorStop(0, 'rgba(255,214,140,' + (tenang ? 0.16 : 0.22) + ')'); gl.addColorStop(1, 'rgba(255,214,140,0)');
      c.fillStyle = gl; c.fillRect(x - R * 1.6, ty - R * 1.6, R * 3.2, R * 3.2);
      // batang
      c.fillStyle = '#120d08'; c.beginPath(); c.moveTo(x - 34, y + 20); c.bezierCurveTo(x - 18, y - 60, x - 26, ty + 80, x - 12, ty + 20);
      c.lineTo(x + 12, ty + 20); c.bezierCurveTo(x + 26, ty + 80, x + 18, y - 60, x + 34, y + 20); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(214,176,92,.35)'; c.lineWidth = 1.4; c.stroke();
      // dahan
      c.strokeStyle = '#120d08'; c.lineCap = 'round';
      [[-1, 0.9], [1, 0.8], [-1, 0.55], [1, 0.5], [-0.4, 1.1], [0.5, 1.05]].forEach(function (d, i) {
        c.lineWidth = 9 - i; c.beginPath(); c.moveTo(x, ty + 40 - i * 6); c.quadraticCurveTo(x + d[0] * R * 0.4, ty - 10 - i * 8, x + d[0] * R * d[1], ty - 40 - i * 10); c.stroke();
      });
      // tajuk: gugus daun bercahaya
      var r = rng(9090);
      for (var i = 0; i < 46; i++) {
        var a = r() * TAU, d = Math.sqrt(r()) * R, px = x + Math.cos(a) * d * 1.15, py = ty - 30 + Math.sin(a) * d * 0.62, rr = 18 + r() * 26;
        var hue = r() < 0.75 ? '30,52,40' : '60,50,24';
        c.fillStyle = 'rgba(' + hue + ',.82)'; c.beginPath(); c.arc(px, py, rr, 0, TAU); c.fill();
        if (py < ty - 10) { c.strokeStyle = 'rgba(255,214,140,.16)'; c.lineWidth = 1.5; c.beginPath(); c.arc(px, py, rr - 1, Math.PI * 1.05, Math.PI * 1.75); c.stroke(); }
      }
      for (var j = 0; j < 30; j++) {
        var a2 = r() * TAU, d2 = Math.sqrt(r()) * R, qx = x + Math.cos(a2) * d2 * 1.1, qy = ty - 30 + Math.sin(a2) * d2 * 0.6;
        var tw = 0.4 + 0.6 * Math.abs(Math.sin(t * (0.6 + r()) + j));
        c.fillStyle = 'rgba(255,226,150,' + (0.5 * tw).toFixed(3) + ')'; c.beginPath(); c.arc(qx, qy, 1.6 + r() * 1.6, 0, TAU); c.fill();
      }
    }
    function akar(c, t) {
      var cepat = O.fase >= 5 ? 0.06 : O.fase >= 4 ? 0.32 : O.fase >= 3 ? 0.22 : 0.14, redup = O.fase >= 5 ? 0.5 : 1;
      Object.keys(GEO).forEach(function (id, n) {
        var g = GEO[id]; if (g.titik === 'palung') return;
        var q = akarKe(g);
        c.strokeStyle = 'rgba(214,176,92,' + (0.16 * redup).toFixed(3) + ')'; c.lineWidth = g.titik ? 1.4 : 2.4;
        c.beginPath(); c.moveTo(q.a.x, q.a.y); c.quadraticCurveTo(q.c.x, q.c.y, q.b.x, q.b.y); c.stroke();
        for (var k = 0; k < 2; k++) {   // denyut mengalir di akar
          var p = ((t * cepat + n * 0.137 + k * 0.5) % 1), pt = bez(q, p), a = Math.sin(p * Math.PI) * 0.85 * redup;
          var gg = c.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 12); gg.addColorStop(0, 'rgba(255,220,140,' + a.toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,220,140,0)');
          c.fillStyle = gg; c.fillRect(pt.x - 12, pt.y - 12, 24, 24);
        }
      });
    }

    /* ---------- titian tujuh warna (dari tepi ke gerbang) ---------- */
    function titian(c, t) {
      var g = GEO.s5_p1, a = { x: -120, y: 520 }, b = { x: g.x - 6, y: g.y - g.r * 0.55 }, q = { x: 70, y: 120 };
      c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
      c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 46; c.beginPath(); c.moveTo(a.x, a.y); c.quadraticCurveTo(q.x, q.y, b.x, b.y); c.stroke();
      for (var i = 0; i < 7; i++) {
        var off = (i - 3) * 5, sh = 0.6 + 0.4 * Math.sin(t * 1.4 - i * 0.6);
        c.strokeStyle = 'rgba(' + RAIN[i] + ',' + (0.42 * sh).toFixed(3) + ')'; c.lineWidth = 5.5;
        c.beginPath(); c.moveTo(a.x + off, a.y); c.quadraticCurveTo(q.x + off, q.y + off * 1.2, b.x + off * 0.4, b.y); c.stroke();
      }
      for (var k = 0; k < 2; k++) {   // kilau berjalan
        var p = (t * 0.16 + k * 0.5) % 1, u = 1 - p, kx = u * u * a.x + 2 * u * p * q.x + p * p * b.x, ky = u * u * a.y + 2 * u * p * q.y + p * p * b.y;
        var gg = c.createRadialGradient(kx, ky, 0, kx, ky, 30); gg.addColorStop(0, 'rgba(255,255,255,.5)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = gg; c.fillRect(kx - 30, ky - 30, 60, 60);
      }
      // percik cahaya di kaki titian
      var gl = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, 40); gl.addColorStop(0, 'rgba(255,240,220,' + (0.35 + 0.15 * Math.sin(t * 2)).toFixed(3) + ')'); gl.addColorStop(1, 'rgba(255,240,220,0)');
      c.fillStyle = gl; c.fillRect(b.x - 40, b.y - 40, 80, 80);
      c.restore();
    }

    /* ---------- garis selatan & palung ---------- */
    function selatan(c, t) {
      var T = O.titik.s5_t2 || {}; if (O.fase >= 5) return;
      var emas = !!T.emas, col = emas ? '214,176,92' : '200,40,50';
      c.save();
      var top = [], n = 40;
      for (var i = 0; i <= n; i++) {
        var k = i / n, j = Math.min(SELATAN.length - 2, Math.floor(k * (SELATAN.length - 1))), f = k * (SELATAN.length - 1) - j;
        var x = lerp(SELATAN[j][0], SELATAN[j + 1][0], f), y = lerp(SELATAN[j][1], SELATAN[j + 1][1], f);
        top.push([x, y, 72 + 22 * Math.sin(t * 0.5 + i * 0.35) + 8 * Math.sin(t * 0.9 + i * 0.8)]);
      }
      var gr = c.createLinearGradient(0, 715, 0, 840);
      gr.addColorStop(0, 'rgba(' + col + ',0)'); gr.addColorStop(0.72, 'rgba(' + col + ',' + (emas ? 0.09 : 0.2) + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)');
      c.fillStyle = gr; c.beginPath(); c.moveTo(top[0][0], top[0][1] + 26);
      top.forEach(function (p) { c.lineTo(p[0], p[1] + 26); });
      for (var m = top.length - 1; m >= 0; m--) c.lineTo(top[m][0], top[m][1] - top[m][2]);
      c.closePath(); c.fill();
      // obor penjaga
      for (var j = 0; j < 9; j++) {
        var k = j / 8, idx = Math.min(SELATAN.length - 2, Math.floor(k * (SELATAN.length - 1))), f = k * (SELATAN.length - 1) - idx;
        var ox = lerp(SELATAN[idx][0], SELATAN[idx + 1][0], f), oy = lerp(SELATAN[idx][1], SELATAN[idx + 1][1], f) + 6;
        var fl = 0.6 + 0.4 * Math.sin(t * 9 + j * 2.3) * Math.sin(t * 5.3 + j);
        var gg = c.createRadialGradient(ox, oy, 0, ox, oy, 14); gg.addColorStop(0, 'rgba(255,' + (emas ? '220,140' : '170,90') + ',' + (0.9 * fl).toFixed(3) + ')'); gg.addColorStop(1, 'rgba(255,140,60,0)');
        c.fillStyle = gg; c.fillRect(ox - 14, oy - 14, 28, 28);
      }
      c.restore();
    }
    function palung(c, t) {
      var g = GEO.s5_t3, T = O.titik.s5_t3 || {};
      c.save(); c.translate(g.x, g.y); c.scale(1.6, 0.62);
      var gr = c.createRadialGradient(0, 0, 4, 0, 0, g.r);
      gr.addColorStop(0, T.terbuka ? '#0d1626' : '#050608'); gr.addColorStop(0.85, '#04050a'); gr.addColorStop(1, 'rgba(4,5,10,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(0, 0, g.r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(180,200,230,' + (0.1 + 0.05 * Math.sin(t * 0.7)).toFixed(3) + ')'; c.lineWidth = 1; c.beginPath(); c.arc(0, 0, g.r * 0.82, 0, TAU); c.stroke();
      if (T.terbuka) { c.strokeStyle = 'rgba(160,200,255,.18)'; c.beginPath(); c.arc(0, 0, g.r * (0.3 + 0.5 * ((t * 0.15) % 1)), 0, TAU); c.stroke(); }
      c.restore();
    }

    /* ---------- rute rasi bintang ---------- */
    function rute(c, t) {
      var buka = {}; (O.rute || []).forEach(function (r) { buka[r[0] + '|' + r[1]] = buka[r[1] + '|' + r[0]] = 1; });
      var semua = [['s5_p1', 's5_p2'], ['s5_p1', 's5_p6'], ['s5_p2', 's5_p5'], ['s5_p2', 's5_t1'], ['s5_p5', 's5_p3'], ['s5_p3', 's5_p4'], ['s5_p4', 's5_t2'], ['s5_t2', 's5_t3'], ['s5_t1', 's5_p4'], ['s5_p6', 's5_t1']];
      (O.rute || []).forEach(function (r) { if (!semua.some(function (s) { return (s[0] === r[0] && s[1] === r[1]) || (s[0] === r[1] && s[1] === r[0]); })) semua.push(r); });
      semua.forEach(function (r, n) {
        var a = GEO[r[0]], b = GEO[r[1]]; if (!a || !b) return;
        var on = !!buka[r[0] + '|' + r[1]], dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy);
        var ux = dx / len, uy = dy / len, s0 = a.r * 0.9, s1 = len - b.r * 0.9, rr = rng(n * 131 + 7), titikB = [];
        for (var d = s0; d <= s1; d += 46) titikB.push({ x: a.x + ux * d + (rr() - 0.5) * 16, y: a.y + uy * d + (rr() - 0.5) * 16 });
