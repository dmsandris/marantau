/* ---------- sinematik: sangrai pertama (prosedural) ---------- */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTUtil) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false;

    var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + Math.min(1, a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function sceneRoast() {
    var r = U.rng(7070), puffs = [];
    for (var i = 0; i < 40; i++) puffs.push({ off: r() * 6, sp: 0.6 + r() * 0.6, dx: (r() - 0.5) * 0.4, s: 0.5 + r() });
    function draw(ctx, W, H, t) {
      var m = Math.min(W, H), cx = W * 0.5, fy = H * 0.72;
      var bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1a110a'); bg.addColorStop(1, '#2e1d10');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#3a2616'; ctx.fillRect(0, fy, W, H - fy);
      var heat = sm(0.5, 3, t);
      glow(ctx, cx, fy - m * 0.05, m * 0.5, '255,150,60', 0.35 * heat);
      // drum
      var dw = m * 0.42, dh = m * 0.22, dx = cx - dw / 2, dy = fy - m * 0.34;
      ctx.fillStyle = '#7f858c'; ctx.beginPath(); ctx.ellipse(cx, dy + dh / 2, dw / 2, dh / 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.translate(cx - dw * 0.18, dy + dh / 2); ctx.rotate(REDUCE ? 0 : t * 2.2);
      ctx.strokeStyle = '#c9a450'; ctx.lineWidth = Math.max(2, m * 0.008);
      ctx.beginPath(); ctx.arc(0, 0, dh * 0.34, 0, Math.PI * 2); ctx.stroke();
      for (var k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(k) * dh * 0.34, Math.sin(k) * dh * 0.34); ctx.stroke(); }
      ctx.restore();
      var beans = U.lerp(0, 1, sm(1.5, 7, t));
      var bc = 'rgb(' + Math.round(U.lerp(150, 90, beans)) + ',' + Math.round(U.lerp(160, 55, beans)) + ',' + Math.round(U.lerp(90, 30, beans)) + ')';
      ctx.fillStyle = bc; ctx.beginPath(); ctx.arc(cx - dw * 0.18, dy + dh / 2, dh * 0.16, 0, Math.PI * 2); ctx.fill();
      // kaki & tungku
      ctx.fillStyle = '#4a4f56'; ctx.fillRect(dx + dw * 0.1, dy + dh, dw * 0.8, m * 0.03);
      ctx.fillRect(dx + dw * 0.15, dy + dh, m * 0.02, fy - dy - dh); ctx.fillRect(dx + dw * 0.85 - m * 0.02, dy + dh, m * 0.02, fy - dy - dh);
      for (var f = 0; f < 5; f++) {
        var fx = dx + dw * (0.25 + f * 0.12), fl = (0.6 + 0.4 * Math.sin(t * 9 + f * 1.7)) * heat;
        ctx.fillStyle = 'rgba(110,170,255,' + (0.7 * fl).toFixed(3) + ')';
        ctx.beginPath(); ctx.moveTo(fx - m * 0.012, dy + dh + m * 0.05); ctx.quadraticCurveTo(fx, dy + dh + m * (0.05 - 0.05 * fl), fx + m * 0.012, dy + dh + m * 0.05); ctx.fill();
      }
      // corong & cerobong
      ctx.fillStyle = '#6a7078'; ctx.beginPath(); ctx.moveTo(dx - m * 0.02, dy - m * 0.06); ctx.lineTo(dx + m * 0.1, dy - m * 0.06); ctx.lineTo(dx + m * 0.06, dy + m * 0.03); ctx.lineTo(dx + m * 0.02, dy + m * 0.03); ctx.closePath(); ctx.fill();
      var chx = dx + dw * 0.78, chy = dy - m * 0.2;
      ctx.fillStyle = '#5c6168'; ctx.fillRect(chx, chy, m * 0.04, m * 0.2 + dh * 0.2);
      // asap
      var smoke = sm(2.5, 5, t);
      puffs.forEach(function (p) {
        var ph = ((t * p.sp + p.off) % 4) / 4;
        var x = chx + m * 0.02 + (p.dx + Math.sin(t + p.off) * 0.1) * m * ph * 0.8, y = chy - ph * H * 0.45;
        ctx.fillStyle = 'rgba(225,215,200,' + (smoke * 0.35 * (1 - ph)).toFixed(3) + ')';

      });
      if (t > 4.5 && t < 6.5) { var cr = 1 - Math.abs(t - 5.5); glow(ctx, cx - dw * 0.18, dy + dh / 2, m * 0.12, '255,240,200', 0.4 * cr); }

    }

  }

})();
