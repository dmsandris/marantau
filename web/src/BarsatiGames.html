<!--

<style>
  .mtg { position: fixed; inset: 0; z-index: 9800; display: flex; flex-direction: column; background: #07060a; color: var(--parch-100, #f4e7c8);

    opacity: 0; transition: opacity .35s ease; overscroll-behavior: contain; }

  .mtg.touch .kbd { display: none !important; }
  .mtg.off { opacity: 0; pointer-events: none; }
  .mtg *, .mtg *::before, .mtg *::after { box-sizing: border-box; }
  .mtg-top { position: relative; z-index: 30; flex: none; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;

    box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,230,170,.12); padding-top: env(safe-area-inset-top, 0); height: calc(56px + env(safe-area-inset-top, 0px)); }
  .mtg-ttl { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.05; }
  .mtg-ttl .k { font-family: var(--font-title, serif); font-weight: 700; font-size: .58em; letter-spacing: .26em; text-transform: uppercase; color: var(--brass-300, #f0cf78); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mtg-ttl .n { font-family: var(--font-display, serif); font-size: 1.42em; color: #fff1c8; text-shadow: 0 2px 6px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .mtg-pip.cur { border-color: #ffe7a3; box-shadow: 0 0 0 3px rgba(240,207,120,.18); transform: scale(1.12); }

  .mtg-ib.off { color: #d9776a; }
  .mtg-body { position: relative; flex: 1; min-height: 0; }
  .mtg-stage { position: absolute; inset: 0; overflow: hidden; }

  /* ---------- kartu layar (intro / menang / gagal) ---------- */

  .mtg-face .ini { font-family: var(--font-display, serif); font-size: 2.2em; color: #f0cf78; }
  .mtg-card .kk { font-family: var(--font-title, serif); font-weight: 700; font-size: .64em; letter-spacing: .3em; text-transform: uppercase; color: #8f6522; }

  .mtg-card .qt { font-style: italic; font-size: 1.08em; line-height: 1.38; margin: 8px auto 4px; max-width: 30em; color: #4a3418; }
  .mtg-card .who { font-family: var(--font-title, serif); font-size: .66em; letter-spacing: .18em; text-transform: uppercase; color: #8a6a3a; margin-bottom: 10px; }
  .mtg-card .rule { height: 1px; margin: 12px 8%; background: linear-gradient(90deg, transparent, rgba(143,101,34,.55), transparent); }

  .mtg-steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-size: .98em; line-height: 1.32; }
  .mtg-steps li i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-title, serif); font-weight: 700; font-size: .72em;
    color: #3a2405; background: radial-gradient(circle at 35% 30%, #fff1c4, #d9a53c 55%, #8a5a12); box-shadow: inset 0 -2px 3px rgba(0,0,0,.3); margin-top: 1px; }
  .mtg-steps li b { color: #5a3410; }
  .mtg-ctl { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0 2px; }
  .mtg-ctl span { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; font-size: .84em; background: rgba(90,60,25,.1); border: 1px solid rgba(90,60,25,.22); }
  .mtg-ctl kbd { font-family: var(--font-title, serif); font-weight: 700; font-size: .78em; padding: 1px 6px; border-radius: 4px; background: #fffaf0; border: 1px solid rgba(90,60,25,.35); box-shadow: 0 2px 0 rgba(90,60,25,.25); }

  .mtg-card .btn-ghost { --b-fg: #5a3410; --b-edge: rgba(143,101,34,.6); --b-bg1: rgba(255,250,235,.75); --b-bg2: rgba(228,206,160,.65); text-shadow: none; }
  .mtg-stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 2px; }

  .mtg-stats b { display: block; font-family: var(--font-title, serif); font-size: 1.3em; color: #4a2a10; }
  .mtg-stats span { font-family: var(--font-title, serif); font-size: .6em; letter-spacing: .16em; text-transform: uppercase; color: #8a6a3a; }
  .mtg-card.ok h2 { color: #6a4208; text-shadow: 0 0 18px rgba(255,200,80,.55); }
  .mtg-card.ok { box-shadow: 0 0 0 2px rgba(255,220,130,.65), 0 0 60px rgba(255,200,90,.35), 0 30px 70px rgba(0,0,0,.6), inset 0 0 0 5px rgba(143,101,34,.14), inset 0 0 50px rgba(140,95,35,.2); }
  .mtg-card.bad h2 { color: #7a2a18; }
  .mtg-badge { display: inline-flex; align-items: center; gap: 6px; margin: 4px auto 0; padding: 5px 12px; border-radius: 999px; font-family: var(--font-title, serif); font-weight: 700; font-size: .68em;

  /* ================= PANTUN ================= */
  .mtg-pantun .mtg-stage { background:
      radial-gradient(ellipse at 50% -10%, rgba(255,190,110,.28), transparent 55%),
      radial-gradient(ellipse at 12% 18%, rgba(255,170,80,.18), transparent 22%),
      radial-gradient(ellipse at 88% 18%, rgba(255,170,80,.18), transparent 22%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 64px),
      linear-gradient(180deg, #3a1a10, #24100a 55%, #140806); overflow-y: auto; touch-action: pan-y; }
  .pt-orn { position: absolute; left: 0; right: 0; height: 26px; pointer-events: none; opacity: .55;
    background: repeating-linear-gradient(45deg, transparent 0 9px, rgba(240,190,90,.35) 9px 11px, transparent 11px 20px), repeating-linear-gradient(-45deg, transparent 0 9px, rgba(240,190,90,.35) 9px 11px, transparent 11px 20px); }
  .pt-orn.t { top: 0; border-bottom: 1px solid rgba(240,190,90,.35); }
  .pt-lamp { position: absolute; top: 0; width: 2px; height: 46px; background: rgba(240,190,90,.35); pointer-events: none; }
  .pt-lamp::after { content: ''; position: absolute; left: -9px; bottom: -18px; width: 20px; height: 24px; border-radius: 6px 6px 10px 10px; background: radial-gradient(circle at 50% 60%, #fff0b8, #f0a030 60%, #8a4a10);
    box-shadow: 0 0 26px 10px rgba(255,170,60,.35); animation: ptFlick 3.2s ease-in-out infinite; }
  .pt-lamp.l { left: 7%; } .pt-lamp.r { right: 7%; } .pt-lamp.r::after { animation-delay: -1.3s; }
  @keyframes ptFlick { 0%, 100% { opacity: 1; } 45% { opacity: .82; } 52% { opacity: .95; } 70% { opacity: .86; } }
  .pt-wrap { position: relative; max-width: 660px; margin: 0 auto; padding: 40px 14px 28px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
  .pt-gov { display: flex; align-items: flex-end; gap: 10px; }
  .pt-gov .mtg-face { width: 58px; height: 58px; margin: 0; flex: none; border-width: 2px; }
  .pt-bub { position: relative; flex: 1; padding: 9px 14px; border-radius: 14px 14px 14px 4px; font-size: 1em; line-height: 1.3; color: #3a2410;
    background: linear-gradient(180deg, #fff8e6, #f0dfb8); border: 1px solid rgba(143,101,34,.6); box-shadow: 0 6px 16px rgba(0,0,0,.35); animation: ptIn .45s var(--ease-out, ease) both; }
  .pt-bub b { font-family: var(--font-title, serif); font-size: .68em; letter-spacing: .14em; text-transform: uppercase; color: #8f6522; display: block; margin-bottom: 2px; }
  @keyframes ptIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pt-scroll { position: relative; margin: 6px 6px 2px; padding: 20px 22px; border-radius: 6px; color: #33230f;
    background: var(--paper-grain, none), linear-gradient(90deg, rgba(120,80,30,.16), transparent 12%, transparent 88%, rgba(120,80,30,.16)), linear-gradient(180deg, #fbf1d8, #ecd9ad);
    box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 0 30px rgba(140,95,35,.2); }
  .pt-scroll::before, .pt-scroll::after { content: ''; position: absolute; left: -10px; right: -10px; height: 14px; border-radius: 7px;
    background: linear-gradient(180deg, #8a5a2a, #4a2a12 60%, #2a170a); box-shadow: 0 3px 6px rgba(0,0,0,.45); }
  .pt-scroll::before { top: -7px; } .pt-scroll::after { bottom: -7px; }
  .pt-line { font-size: 1.22em; line-height: 1.55; font-style: italic; min-height: 1.55em; }
  .pt-line.isi { padding-left: 14px; }
  .pt-line .w { display: inline-block; opacity: 0; transform: translateY(5px); animation: ptW .4s var(--ease-out, ease) forwards; margin-right: .26em; }
  @keyframes ptW { to { opacity: 1; transform: none; } }
  .pt-line .ra { color: #8a4a00; font-weight: 700; border-bottom: 2px solid rgba(224,160,40,.8); }
  .pt-line .rb { color: #1d5a6e; font-weight: 700; border-bottom: 2px solid rgba(47,127,163,.8); }
  .pt-line.ph { color: rgba(90,60,25,.38); letter-spacing: .3em; font-style: normal; }
  .pt-tag { position: absolute; right: 10px; top: 8px; font-family: var(--font-title, serif); font-weight: 700; font-size: .58em; letter-spacing: .2em; text-transform: uppercase; color: #9a7a4a; }
  .pt-div { height: 1px; margin: 6px 0; background: linear-gradient(90deg, transparent, rgba(143,101,34,.4), transparent); }
  .pt-ask { font-family: var(--font-title, serif); font-weight: 700; font-size: .72em; letter-spacing: .22em; text-transform: uppercase; color: var(--brass-300, #f0cf78); text-align: center; margin-top: 4px; }
  .pt-opts { display: grid; gap: 9px; }
  .pt-opt { position: relative; text-align: left; font-family: var(--font-body, Georgia, serif); cursor: pointer; padding: 11px 14px 11px 48px; border-radius: 12px; line-height: 1.38; font-size: 1.04em; font-style: italic;
    color: #f8ecd0; background: linear-gradient(180deg, rgba(74,47,28,.92), rgba(40,25,15,.94)); border: 1px solid rgba(240,207,120,.38);
    box-shadow: inset 0 1px 0 rgba(255,236,190,.12), 0 4px 12px rgba(0,0,0,.35); opacity: 0; animation: ptIn .45s var(--ease-out, ease) forwards;
    transition: transform .15s var(--ease-spring, ease), border-color .2s, background .2s, box-shadow .2s; }
  .pt-opt:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(255,225,150,.75); box-shadow: 0 0 0 1px rgba(255,220,140,.35), 0 8px 18px rgba(0,0,0,.4); }
  .pt-opt:focus-visible { outline: 2px solid var(--brass-300, #f0cf78); outline-offset: 2px; }
  .pt-opt .nn { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal;
    font-family: var(--font-title, serif); font-weight: 700; font-size: .8em; color: #3a2405; background: radial-gradient(circle at 35% 30%, #fff1c4, #d9a53c 55%, #8a5a12); }

  .pt-note { padding: 12px 14px; border-radius: 12px; line-height: 1.4; font-size: .98em; background: rgba(0,0,0,.35); border: 1px solid rgba(240,207,120,.3); animation: ptIn .4s var(--ease-out, ease) both; }

  .pt-note .btn { margin-top: 10px; width: 100%; min-height: 44px; }

    color: #3a2405; background: linear-gradient(180deg, #fff6dc, #e6cf97); border: 1px solid #8f6522; box-shadow: 0 3px 0 #8a6a3a, 0 6px 12px rgba(0,0,0,.35);

      S.progress(S.pips(LOOPS, [], 0));
      S.intro({
        seal: SEAL, kicker: 'Pusaran Bjorneo &middot; The Maelstrom', title: 'Arus Pusaran',
        quote: 'Mahkota sudah kembali ke laut. Ikuti cahayanya &mdash; laut hanya membuka jalan sekali.', who: 'Nenek Ulin',
        steps: ['Kapalmu terseret <b>spiral pusaran</b>: 3 lingkaran menuju pusat (&plusmn;1 menit).',
          'Tetap di <b>jalur cahaya mahkota</b> (lajur emas). Terlalu lama di luar = dihantam arus liar.',
          'Hindari <b>puing hanyut</b> dan <b>lingkaran petir biru</b> &mdash; menyambar &plusmn;1 detik setelah berkedip.',
          '<b>Tarikan pusat</b> makin kuat di lingkaran dalam. 3 nyawa. Lolos tanpa benturan = <b>sempurna</b>.'],
        controls: { desk: ['<kbd>A</kbd>/<kbd>&larr;</kbd> menjauhi pusat', '<kbd>D</kbd>/<kbd>&rarr;</kbd> ke arah pusat'], touch: ['Tahan sisi <b>kiri</b> / <b>kanan</b> layar'] },
        cta: 'Masuki pusaran'
      }, begin);

      return {
        destroy: function () { AX.stopAll(); },
        debugWin: function () { S.hideCard(); if (G.state !== 'play') begin(); G.hits = 0; G.lives = LIVES; G.s = S_TOT - 5; G.d = laneC(G.s); },
        debugJump: function (p) { S.hideCard(); if (G.state !== 'play') begin(); G.s = clamp(p, 0, 0.99) * S_TOT; G.d = laneC(G.s); G.inv = 2; },
        debugFail: function () { S.hideCard(); if (G.state !== 'play') begin(); G.inv = 0; G.lives = 1; hit('arus'); },
        _G: G, S_TOT: S_TOT, laneC: laneC, laneW: laneW
      };
    }
  };

  return {
    open: open,
    close: close,
    kinds: KINDS.slice(),
    isOpen: function () { return !!cur; },
    /** Untuk uji/QA: menangkan game yang sedang terbuka (langsung ke layar menang). */
    _debug: function (cmd, a, b) { if (!cur || !cur.game) return null; var g = cur.game; if (cmd === 'win' && g.debugWin) return g.debugWin(); if (typeof g[cmd] === 'function') return g[cmd](a, b); return g[cmd]; }
  };
})();
window.MTGames = MTGames;
