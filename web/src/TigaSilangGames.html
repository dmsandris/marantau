    var cx = 180, cy = 180, R = [150, 112, 74], col = ['#e8c35a', '#cfd6de', '#d23a2a'], nm = ['emas', 'perak', 'merah'];
    var s = '<svg viewBox="0 0 360 360" role="img" aria-label="Kompas Tedsky dibuka dari atas">';
    s += '<circle cx="180" cy="180" r="172" fill="#2a1e12" stroke="#c9a441" stroke-width="4"/>';
    for (var i = 0; i < 3; i++) {
      var r = R[i];
      s += '<circle cx="180" cy="180" r="' + r + '" fill="' + ['#3a2a18', '#33261a', '#2a2016'][i] + '" stroke="#8f6522" stroke-width="2"/>';
      for (var t = 0; t < 36; t++) { var aa = t / 36 * 6.283; s += '<line x1="' + (cx + Math.cos(aa) * (r - 6)) + '" y1="' + (cy + Math.sin(aa) * (r - 6)) + '" x2="' + (cx + Math.cos(aa) * r) + '" y2="' + (cy + Math.sin(aa) * r) + '" stroke="#6b4a22" stroke-width="2"/>'; }

    s += '<text x="338" y="186" font-size="16" fill="#e8c35a" font-family="Cinzel,Georgia" text-anchor="middle">T</text>';
    s += '<path d="M' + (cx - 160) + ' ' + (cy - 8) + ' l-10 8 l10 8z" fill="#d23a2a"/><text x="14" y="214" font-size="11" fill="#e89080" font-family="Cinzel,Georgia">celah</text>';

        '<circle cx="' + (cx + Math.cos(ang) * L) + '" cy="' + (cy + Math.sin(ang) * L) + '" r="' + (j === 2 ? 5 : 7) + '" fill="' + col[j] + '"/></g>';
      if (j === 2 && stage < 1) continue; // tahap 1: cincin merah belum dibuka
      s += grp;

    }
    s += '<circle cx="180" cy="180" r="12" fill="#c9a441" stroke="#5a3a10" stroke-width="2"/>';
    if (slot) s += '<circle cx="' + (cx - 160) + '" cy="' + cy + '" r="14" fill="none" stroke="#ffd36a" stroke-width="3"/>';

  }
  function playJarum(opts, cb) {
    var S = shell('Gading Island &middot; Kedai Stumpy', 'Kunci Dua Jarum');
    S.cb = cb;
    var GOAL = [3, 3, 9], stage = 0, a = [0, 0, 0], asked = false, phase = 'rings', still = false, tries = 0;
    var STAGES = [
      { rings: [0, 1], couple: 0.0, scramble: 3, drift: false, note: 'Tahap 1 &middot; Sejajarkan jarum <b>emas</b> dan <b>perak</b> ke arah <b>timur</b> (T).' },
      { rings: [0, 1, 2], couple: 1, scramble: 5, drift: false, note: 'Tahap 2 &middot; Cincin merah terbuka. Memutar satu cincin ikut memutar cincin di sebelahnya, berlawanan arah. Emas & perak ke <b>timur</b>, merah ke <b>celah</b>.' },
      { rings: [0, 1, 2], couple: 1, scramble: 6, drift: true, note: 'Tahap 3 &middot; Jarum merah <b>melawan</b>: ia bergeser sendiri setiap beberapa detik. Kunci emas & perak dulu, lalu kejar si merah.' }
    ];
    function mod(n) { return ((n % 12) + 12) % 12; }
    function turn(i, d) {
      var st = STAGES[stage];
      a[i] = mod(a[i] + d);
      if (st.couple) { if (i === 0) a[1] = mod(a[1] - d); else if (i === 1) { a[0] = mod(a[0] - d); } else if (i === 2) a[1] = mod(a[1] - d); }
    }
    function solved() { var st = STAGES[stage]; return a[0] === GOAL[0] && a[1] === GOAL[1] && (st.rings.indexOf(2) < 0 || a[2] === GOAL[2]); }
    function setup() {
      a = GOAL.slice(); asked = false;
      var st = STAGES[stage];
      for (var k = 0; k < st.scramble; k++) { var i = st.rings[Math.floor(Math.random() * st.rings.length)]; turn(i, Math.random() < 0.5 ? 1 : -1); }
      if (solved()) turn(st.rings[0], 2);
      if (st.rings.indexOf(2) < 0) a[2] = 0;
      render('');
    }
    function hintText() {
      var st = STAGES[stage];
      if (a[0] !== GOAL[0] || a[1] !== GOAL[1]) {
        if (!st.couple) return 'felyx: "Putar <b>' + (a[0] !== GOAL[0] ? 'cincin emas' : 'cincin perak') + '</b> sampai menunjuk T."';
        var d = mod(GOAL[0] - a[0]);
        return 'felyx: "Lihat roda giginya. Kalau emas maju satu, perak mundur satu. Coba atur <b>merah</b> dulu, lalu emas ' + (d <= 6 ? d + ' langkah ke kanan' : (12 - d) + ' langkah ke kiri') + ', lalu rapikan perak."';
      }
      return 'felyx: "Emas dan perak sudah benar. Sekarang <b>cincin merah</b> ke celah. Kalau perak ikut bergeser, kembalikan dengan cincin emas."';
    }
    function render(m, cls) {
      var st = STAGES[stage];
      var pips = STAGES.map(function (x, i) { return '<i class="' + (i < stage ? 'done' : i === stage ? 'on' : '') + '"></i>'; }).join('');
      var ctrl = '';
      st.rings.forEach(function (i) { ctrl += '<button class="btn" data-r="' + i + '" data-d="-1" aria-label="Putar cincin ' + ['emas', 'perak', 'merah'][i] + ' ke kiri">&#9664;</button><span style="color:' + ['#e8c35a', '#cfd6de', '#ff8a7a'][i] + '">Cincin ' + ['emas', 'perak', 'merah'][i] + '</span><button class="btn" data-r="' + i + '" data-d="1" aria-label="Putar cincin ' + ['emas', 'perak', 'merah'][i] + ' ke kanan">&#9654;</button>'; });
      S.body.innerHTML = '<div class="tsg-row" style="justify-content:space-between;align-items:center"><span class="tsg-clue">Tahap ' + (stage + 1) + ' dari 3</span><span class="tsg-pips">' + pips + '</span></div>' +
        '<div class="tsg-stage"><div class="tsg-lock">' + compassSvg(a, st.rings.length - 2, false, false) + '</div></div>' +
        '<div class="tsg-msg ' + (cls || '') + '">' + (m || st.note) + '</div><div class="tsg-ctrl">' + ctrl + '</div>' +
        '<div class="tsg-row"><button class="btn btn-ghost-ink" data-ask="1"' + (asked ? ' disabled' : '') + ' style="color:#f4e7c8;border-color:rgba(232,200,120,.45)">Tanya felyx</button><button class="btn btn-ghost-ink" data-reset="1" style="color:#f4e7c8;border-color:rgba(232,200,120,.45)">Setel ulang</button></div>';
      S.body.querySelectorAll('[data-r]').forEach(function (b) {
        b.onclick = function () {
          turn(+b.getAttribute('data-r'), +b.getAttribute('data-d')); au('page');
          if (solved()) { au('coin', { n: 2 }); if (stage < 2) { stage++; render('<b>Klik.</b> Roda gigi mengunci. ' + STAGES[stage].note, 'good'); setTimeout(setup, 900); return; } hammer(); return; }
          render('');
        };
      });
      var askB = S.body.querySelector('[data-ask]'); if (askB) askB.onclick = function () { asked = true; render(hintText()); };
      var rs = S.body.querySelector('[data-reset]'); if (rs) rs.onclick = function () { setup(); };
    }
    // tahap 3: si merah bergeser sendiri
    S.timers.push(setInterval(function () {
      if (phase !== 'rings' || stage !== 2) return;
      if (a[0] === GOAL[0] && a[1] === GOAL[1] && a[2] === GOAL[2]) return;
      turn(2, Math.random() < 0.5 ? 1 : -1); // lewat roda gigi (perak ikut terseret) - teka-teki tetap bisa diselesaikan
      var lock = S.body.querySelector('.tsg-lock'); if (lock) lock.innerHTML = compassSvg(a, 1, false, false);
    }, REDUCE ? 6000 : 4200));
    function hammer() {
      phase = 'hammer';
      S.body.innerHTML = '<div class="tsg-row"><span class="tsg-clue">Langkah terakhir</span></div><div class="tsg-stage"><div class="tsg-lock">' + compassSvg(a, 1, true, true) + '</div></div>' +
        '<div class="tsg-msg">Jarum merah <b>bergetar</b> di celah pelepas, menyala redup. Pegang Palu Kecil Tempa, lalu <b>ketuk tepat saat ia berhenti bergetar</b>.</div>' +
        '<div class="tsg-row"><button class="btn btn-gold" data-hit="1" style="min-width:160px;min-height:48px">Ketuk dengan palu</button></div>';
      var lock = S.body.querySelector('.tsg-lock'), msg = S.body.querySelector('.tsg-msg');
      function cycle() {
        if (S.done || phase !== 'hammer') return;
        still = false; lock.innerHTML = compassSvg(a, 1, true, true);
        var shakeMs = REDUCE ? 1400 : 900 + Math.random() * 1300;
        S.timers.push(setTimeout(function () {
          if (S.done || phase !== 'hammer') return;
          still = true; lock.innerHTML = compassSvg(a, 1, false, true);

      S.body.querySelector('[data-hit]').onclick = function () {
        if (phase !== 'hammer') return;
        if (still) {

          msg.className = 'tsg-msg good'; msg.innerHTML = '<b>Tak!</b> Palu kecil menghantam, dan jarum merah pecah menjadi serbuk. Lonceng angin klenteng berdenting di luar.';
          finishBtn(S, 'Selesai', { win: true, kind: 'jarum', tries: tries });
        } else {
          tries++; au('error'); msg.className = 'tsg-msg bad';
          msg.innerHTML = 'Palu memantul &mdash; jarum masih bergetar. ' + (tries >= 3 ? 'felyx menahan napas: "Pelan-pelan. Tunggu ia diam."' : 'Tunggu ia diam.');
        }
      };
    }
    setup();
  }

  /* ============================ SANDI GAGAK ============================ */
  // Aksara pelikan (sama dengan Quest 6): tiap huruf = kombinasi 5 goresan. Ketuk aksara, pilih huruf.
  var STROKES = ['M5 7 Q12 2 19 7', 'M12 5 V19', 'M6 18 L18 8', 'M17 16.5 a1.6 1.6 0 1 0 0.01 0', 'M5 13 H14 Q18 13 18 17'];

    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5a2a14" stroke-width="2" stroke-linecap="round">' + d + '</svg>';
  }
  function playSandi(opts, cb) {
    var S = shell(opts.kicker || 'Otoland &middot; puncak kincir tua', opts.title || 'Sandi Pelikan');
    S.cb = cb;
    var PANELS = opts.panels || ['UNTUK G', 'PESTA BULAN MATI', 'RAJAMU AKAN PULANG'], known = {}, pi = 0, sel = null;
    (opts.known || 'ANU').split('').forEach(function (c) { known[c] = 1; });
    function solved(t) { for (var i = 0; i < t.length; i++) if (t[i] !== ' ' && !known[t[i]]) return false; return true; }

      var t = PANELS[pi];

        return '<span class="wd">' + wd.split('').map(function (c) {
          var kn = !!known[c];
          return '<button class="tsg-cell' + (kn ? ' known' : '') + (sel === c && !kn ? ' sel' : '') + '" type="button" data-c="' + c + '"' + (kn ? ' tabindex="-1" aria-disabled="true"' : '') + ' aria-label="Aksara ' + (kn ? c : 'belum terbaca') + '">' + glyph(c) + '<b>' + (kn ? c : '?') + '</b></button>';
        }).join('') + '</span>';
      }).join('');

      var pool = need.slice(), deco = 'BCDEFHIKLOSTWY'.split('').filter(function (c) { return pool.indexOf(c) < 0 && !known[c]; });
      for (var d = 0; d < 3 && deco.length; d++) pool.push(deco.splice(Math.floor(Math.random() * deco.length), 1)[0]);
      pool.sort();
      S.body.innerHTML = '<div class="tsg-row" style="justify-content:space-between;align-items:center"><span class="tsg-clue">Baris ' + (pi + 1) + ' dari ' + PANELS.length + '</span></div>' +
        '<div class="tsg-stage"><div class="tsg-ciph"><div class="ln">' + line + '</div>' + (need.length ? '<div class="tsg-keys">' + pool.map(function (c) { return '<button class="btn btn-sm" data-k="' + c + '"' + (sel ? '' : ' disabled') + '>' + c + '</button>'; }).join('') + '</div>' : '') + '</div></div>' +
        '<div class="tsg-msg">Aksara yang sama dengan surat-surat pelikan Marlya. <b>Ketuk aksara yang belum terbaca</b>, lalu pilih hurufnya. Huruf yang benar terisi di semua tempat.</div>';
      S.body.querySelectorAll('.tsg-cell:not(.known)').forEach(function (b) { b.onclick = function () { sel = b.getAttribute('data-c'); au('page'); render(); }; });
      S.body.querySelectorAll('[data-k]').forEach(function (b) {
        b.onclick = function () {
          if (!sel) return;
          if (b.getAttribute('data-k') === sel) {

  var KINDS = { jejak: playJejak, pesta: playPesta, jarum: playJarum, sandi: playSandi };
  function open(kind, opts, cb) {
    var f = KINDS[kind];
    if (!f) { if (cb) setTimeout(function () { cb({ cancelled: true, error: 'unknown' }); }, 0); return; }
    try { if (window.MTAudio && MTAudio.unlock) MTAudio.unlock(); } catch (e) { }

  }

})();
