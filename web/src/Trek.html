<script>
/* =====================================================================
 * MTTrek — Sirkuit Selat Lurus (Saga 4, batch 1): alur Trektrek-an melawan lawan Sirkuit.
 *   MTTrek.open()  -> status server -> menu lawan + Papan Waktu -> garis start -> balapan -> hasil -> Ulangi
 *   Server: api_trek('status' | 'mulai', rival | 'selesai', run, log). Menang/kalah dihitung server dari log ketukan;
 *   hasil di layar tampil langsung dari hitungan lokal (rumus sama), lalu ditandai "dicatat" setelah server menjawab.
 *   Gerbang: TrekOpen / FiturPenguji (server). Selama gerbang tertutup, modul ini tidak menampilkan apa pun.
 *   Pintu masuk: bangunan Sirkuit Selat Lurus di Zentul (CitiesSaga4.html). Penguji, selama TrekOpen = 0: alamat berakhiran #trek.
 * ===================================================================== */
var MTTrek = (function () {
  var S = window.MTTrekSim, G = null, st = null, sel = null, busy = false;
  var TAG = {
    pariopelan: 'Baru belajar menahan gas. Lawan pemanasan.',
    kapalmber: 'Rapi, sabar, tak pernah curi start.',
    cangcimen: 'Lambungnya sudah Warlord. Jangan lengah sedikit pun.',
    yaptob: '"Kapalmu bagus untuk pulang. Bukan untuk lari."'
  };
  var KIAT = [
    'Dengarkan bonangnya, Kapten. Nada naik berarti gigi masuk bersih.',
    'Jangan kejar garis merah. Bintang emas itu sedikit sebelum mentok.',
    'Gigi satu paling cepat naik. Siapkan jarimu begitu meriam berdentum.',
    'Di gigi lima jangan lepas jarimu. Oli Hitam butuh setengah tarikan napas.',
    'Mesin batuk itu salahmu sendiri. Naik gigi sebelum bara di bingkai penuh.'
  ];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ls(k, d) { try { var v = localStorage.getItem('mt_trek_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem('mt_trek_' + k, JSON.stringify(v)); } catch (e) { } }
  function dtk(us, n) { return us == null ? '—' : (us / 1000000).toFixed(n == null ? 3 : n).replace('.', ','); }
  function toast(m, k) { try { if (typeof showToast === 'function') showToast(m, k || 'info'); } catch (e) { } }
  function api(args, ok, fail) {
    try {
      var r = google.script.run.withSuccessHandler(function (res) { ok(res || {}); }).withFailureHandler(function (e) { fail((e && e.message) || String(e || 'Gagal.')); });
      r.api_trek.apply(r, args);
    } catch (e) { fail(e.message || 'Gagal.'); }
  }
  function races() { return ls('races', 0); }
  function hint() { return ls('hint', true) && races() < 3; }
  function kalah(rival, d) { var o = ls('kalah', {}); if (d === 0) o[rival] = 0; else if (d) o[rival] = (o[rival] || 0) + 1; lsSet('kalah', o); return o[rival] || 0; }

  // ---------------------------------------------------------------- menu
  function menu() {
    if (!G) return;
    var lawan = st.lawan || [];
    if (!sel || lawan.indexOf(sel) < 0) sel = ls('rival', lawan[0]); if (lawan.indexOf(sel) < 0) sel = lawan[0];
    var chips = lawan.map(function (k) {
      var r = S.RIVALS[k], n = (st.menang && st.menang[k]) || 0, hd = (st.harian && st.harian[k]) || null;
      var hadiah = hd ? (hd.sudah ? '<em class="trk-hd done">hadiah hari ini sudah diambil</em>'
        : '<em class="trk-hd">hadiah hari ini: ' + hd.oli + ' Oli Hitam + ' + (typeof formatGold === 'function' ? formatGold(hd.gold) : hd.gold) + ' gold</em>') : '';
      return '<button type="button" class="trk-chip' + (k === sel ? ' on' : '') + '" data-r="' + k + '"><b>' + esc(r.name) + '</b><i>' + esc(TAG[k] || '') + '</i><small>' + esc(S.SHIPS[r.ship].name) + (n ? ' · kau menang ' + n + '×' : '') + '</small>' + hadiah + '</button>';
    }).join('');
    var papan = (st.papan || []).map(function (p, i) {
      return '<li class="' + (p.aku ? 'aku' : '') + '"><span>' + (i + 1) + '</span><span>' + esc(p.nama) + ' <small>· ' + esc(p.kapal) + '</small></span><b>' + dtk(p.us) + '</b></li>';
    }).join('');
    var c = G.card(
      '<div class="trk-k">Zentul · Sirkuit Selat Lurus</div><h1>Trektrek-an</h1><div class="trk-orn"></div>' +
      '<p class="trk-sub">Adu lurus 402 meter. Tunggu meriam berdentum, naikkan gigi saat jarum masuk daun hijau, lalu tahan jarimu di gigi lima untuk Semburan Oli Hitam.</p>' +
      '<div class="trk-lbl">Lawan di garis start</div><div class="trk-grid">' + chips + '</div>' +
      (papan ? '<div class="trk-lbl">Papan Waktu Zentul</div><ol class="trk-papan">' + papan + '</ol>' : '') +
      '<div class="trk-lbl">Pengaturan</div><div class="trk-tog">' +
      '<label><input type="checkbox" data-t="hint"' + (ls('hint', true) ? ' checked' : '') + '> Petunjuk</label>' +
      '<label><input type="checkbox" data-t="ghost"' + (ls('ghost', true) ? ' checked' : '') + '> Bayangan rekorku</label>' +
      '<label><input type="checkbox" data-t="haptic"' + (G.haptic() ? ' checked' : '') + '> Getar</label></div>' +
      '<button type="button" class="trk-btn" data-utama data-a="start">KE GARIS START</button>' +
      (st.adu ? '<button type="button" class="trk-btn ghost" data-a="adu">Adu Kapten</button>' : '') +
      '<button type="button" class="trk-btn ghost" data-a="tutup">Kembali ke pelabuhan</button>');
    G.idle(st.ship);
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-r],[data-a]') : null; if (!t) return;
      if (t.dataset.r) { sel = t.dataset.r; lsSet('rival', sel); menu(); }
      else if (t.dataset.a === 'start') pre();
      else if (t.dataset.a === 'adu') aduSegar();
      else if (t.dataset.a === 'tutup') G.close();
    };
    c.onchange = function (e) {
      var k = e.target && e.target.dataset && e.target.dataset.t; if (!k) return;
      if (k === 'haptic') G.haptic(e.target.checked); else { lsSet(k, e.target.checked); if (k === 'hint' && e.target.checked) lsSet('races', 0); }
    };
  }

  // ---------------------------------------------------------------- garis start
  function bar(v, max) { return '<em><i style="width:' + Math.round(Math.max(0.06, Math.min(1, v / max)) * 100) + '%"></i></em>'; }
  function stats(s) { return '<div class="trk-st"><span>Akselerasi</span>' + bar(s.zone, 150) + '</div><div class="trk-st"><span>Top Speed</span>' + bar(s.top - 800, 330) + '</div><div class="trk-st"><span>Tahan Panas</span>' + bar(s.heat, 1600) + '</div>'; }
  function pre() {
    var me = S.SHIPS[st.ship], rp = S.RIVALS[sel], os = S.SHIPS[rp.ship], run = null, gagal = null;
    var c = G.card(
      '<div class="trk-k">Garis start · Selat Lurus</div>' +
      '<div class="trk-vs"><div class="trk-side me"><small>KAMU</small><b>' + esc(me.name) + '</b>' + stats(me) + '</div><div class="trk-mid">VS</div>' +
      '<div class="trk-side op"><small>LAWAN</small><b>' + esc(rp.name) + '</b>' + stats(os) + '</div></div>' +
      '<p class="trk-sub" style="margin-top:10px">402 m' + (st.best ? ' · rekormu ' + dtk(st.best.us) + ' dtk' : '') + '</p>' +
      '<div class="trk-how">Tiga obor dinyalakan, lalu <b>meriam berdentum</b>: ketuk di mana saja. Ketuk lagi tiap jarum masuk <b>daun hijau ✓</b> (4×); bintang <b>emas ★</b> = <b>SEMPURNA</b>. Di gigi lima <b>tahan</b> jarimu untuk <b>Semburan</b>. Jangan biarkan jarum mentok di merah. Desktop: <b>Spasi</b>.</div>' +
      '<button type="button" class="trk-btn" data-utama data-a="siap" disabled>MENYALAKAN OBOR…</button><button type="button" class="trk-btn ghost" data-a="balik">Ganti lawan</button>');
    var b = c.querySelector('[data-a="siap"]');
    // run diminta diam-diam saat kartu ini tampil, supaya SIAP tidak menunggu jaringan
    mulai(sel, function (r) { run = r; if (b.isConnected) { b.disabled = false; b.textContent = 'SIAP'; } }, function (m) { gagal = m; if (b.isConnected) { b.textContent = 'COBA LAGI'; b.disabled = false; } toast(m, 'error'); });
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t || t.disabled) return;
      if (t.dataset.a === 'balik') menu();
      else if (gagal) pre();
      else if (run) go(run);
    };
  }
  function mulai(rival, ok, fail) { api(['mulai', rival], function (r) { if (r && r.run) ok(r); else fail('Garis start belum siap.'); }, fail); }

  // ---------------------------------------------------------------- balapan & hasil
  function go(run) {
    if (!G) return;
    var ghost = ls('ghost', true) && st.best && st.best.log && run.ship === st.ship ? st.best.log : null;
    G.race({ ship: run.ship, rival: run.rival, seed: run.seed, hint: hint(), ghostLog: ghost }, function (res) {
      if (!res || res.cancelled) return;
      lsSet('races', races() + 1);
      hasil(run, res);
    });
  }
  function hasil(run, res) {
    var rp = S.RIVALS[run.rival], q = '', i, sh = res.me.shifts, diff = (res.me.fin || 0) - (res.op.fin || 0);
    for (i = 0; i < 4; i++) q += '<span class="' + (sh[i] || '') + '">' + (i + 1) + '→' + (i + 2) + ' ' + (sh[i] ? sh[i].toUpperCase() : '—') + '</span>';
    var nk = res.win ? kalah(run.rival, 0) : kalah(run.rival, 1);
    var kiat = !res.win && nk >= 3 ? '<p class="trk-q">"' + esc(KIAT[(nk - 3) % KIAT.length]) + '"<small>— Yaptob</small></p>' : '';
    var c = G.card('<div class="trk-res">' +
      '<div class="trk-k" style="text-align:center">' + (res.win ? 'Selat Lurus jadi milikmu' : 'Selat Lurus belum ramah') + '</div>' +
      '<h2 class="' + (res.win ? 'win' : 'lose') + '">' + (res.win ? 'Menang!' : 'Kalah') + '</h2>' +
      '<div class="trk-times"><div><small>KAMU</small><b>' + dtk(res.me.fin) + ' dtk</b></div><div><small>' + esc(rp.name).toUpperCase() + '</small><b>' + dtk(res.op.fin) + ' dtk</b></div></div>' +
      '<p class="trk-diff">' + (diff < 0 ? 'unggul ' : 'tertinggal ') + dtk(Math.abs(diff)) + ' dtk</p>' +
      '<div class="trk-qs">' + q + '</div>' +
      '<div class="trk-meta"><span>Reaksi <b>' + (res.me.jump ? 'CURI START' : dtk((res.me.reaction || 0) * 1000)) + '</b></span><span>Semburan <b>' + (res.me.boost ? 'ya' : 'tidak') + '</b></span><span>Rekor <b class="trk-best">' + (st.best ? dtk(st.best.us) : '—') + '</b></span></div>' +
      kiat + '<p class="trk-srv">juru tulis sirkuit sedang mencatat…</p></div>' +
      '<div class="trk-row"><button type="button" class="trk-btn ghost" data-a="menu">Ganti lawan</button><button type="button" class="trk-btn" data-utama data-a="lagi" disabled>ULANGI</button></div>');
    var srv = c.querySelector('.trk-srv'), lagi = c.querySelector('[data-a="lagi"]'), next = null, nextErr = null, wantLagi = false;
    function siapLagi() { lagi.disabled = false; if (wantLagi && next) go(next); }
    api(['selesai', run.run, res.log], function (r) {
      if (r.trek) st = r.trek;
      try { if (typeof metaMax_ === 'function' && st && st.total) metaMax_('trekmenang', st.total); } catch (e) { }
      var h = r.hasil || {};
      if (!srv.isConnected) return;
      if (h.me !== res.me.fin || h.op !== res.op.fin) { srv.className = 'trk-srv bad'; srv.textContent = 'Catatan juru tulis berbeda: ' + dtk(h.me) + ' vs ' + dtk(h.op) + ' dtk. Yang dipakai catatan juru tulis.'; }
      else srv.innerHTML = '✓ dicatat juru tulis sirkuit' + (h.rec ? ' · <em class="trk-new">REKOR BARU</em>' : '');
      if (h.harian) {
        srv.insertAdjacentHTML('afterend', '<p class="trk-hadiah">' + ic('coin') + ' Hadiah harian: <b>' + h.harian.oli + ' Oli Hitam</b>' +
          (h.harian.gold ? ' + <b>' + (typeof formatGold === 'function' ? formatGold(h.harian.gold) : h.harian.gold) + ' gold</b>' : '') + '</p>');
        try { if (typeof loadState === 'function') loadState(); } catch (e) { }
      }
      if (h.yaptob) srv.insertAdjacentHTML('afterend', '<p class="trk-hadiah yaptob">' + ic('flag') +
        ' Yaptob melempar kain berminyak ke geladakmu: rupa <b>Garis Api Jolt</b> kini ada di Kedai Rantau.</p>');
      var bb = c.querySelector('.trk-best'); if (bb && h.best) bb.textContent = dtk(h.best);
      // run berikutnya disiapkan diam-diam supaya ULANGI langsung jalan
      mulai(run.rival, function (n) { next = n; siapLagi(); }, function (m) { nextErr = m; lagi.disabled = false; });
    }, function (m) { if (srv.isConnected) { srv.className = 'trk-srv bad'; srv.textContent = m; } mulai(run.rival, function (n) { next = n; siapLagi(); }, function (e) { nextErr = e; lagi.disabled = false; }); });
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t || t.disabled) return;
      if (t.dataset.a === 'menu') menu();
      else if (next) go(next);
      else if (nextErr) { toast(nextErr, 'error'); menu(); }
      else wantLagi = true;
    };
  }

  // ---------------------------------------------------------------- pintu masuk
  // tutup = dipanggil bila Sirkuit belum terbuka untuk kapten ini (server menjawab "Aksi tidak dikenal")
  function open(tutup, lanjut) {
    if (busy || (window.MTGames8 && MTGames8.isOpen())) return;
    if (!S || !window.MTGames8) return;
    busy = true;
    api(['status'], function (r) {
      busy = false;
      if (!r.trek) { if (typeof tutup === 'function') tutup(); return; }
      st = r.trek;
      G = MTGames8.open({ onClose: function () { G = null; aduStop(); aduTutupUndangan(); } });
      if (typeof lanjut === 'function') lanjut(); else menu();
    }, function () { busy = false; if (typeof tutup === 'function') tutup(); });
  }
  // penguji: alamat berakhiran #trek membuka Sirkuit begitu game siap
  function viaHash() {
    if (!/^#trek$/i.test(location.hash || '')) return;
    var n = 0, iv = setInterval(function () {
      var siap = false; try { var ts = document.getElementById('titleScreen'); siap = typeof state !== 'undefined' && state && state.player && (!ts || ts.classList.contains('hidden')) && !document.querySelector('.mtg.on, .tsg.on, .qt-cine'); } catch (e) { }
      if (siap) { clearInterval(iv); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } open(null); }
      else if (++n > 240) clearInterval(iv);
    }, 500);
  }
  try { viaHash(); window.addEventListener('hashchange', viaHash); } catch (e) { }


  // ================================================================ ADU KAPTEN (batch 6b)
  //   Dua kapten yang sudah tamat Mahkota & sama-sama merapat di Zentul saling menantang.
  //   Kapal di sebelah hanyalah laju rekor lawan; hasil sebenarnya dihitung juru tulis
  //   setelah kedua catatan ketukan disetor (benih sama, simulasi sama).
  var ADU = { duel: null, poll: null, undangan: null };
  function aduApi(args, ok, fail) {
    try {
      var r = google.script.run.withSuccessHandler(function (res) { ok(res || {}); })
        .withFailureHandler(function (e) { (fail || function (m) { toast(m, 'error'); })((e && e.message) || String(e || 'Gagal.')); });
      r.api_trekDuel.apply(r, args);
    } catch (e) { (fail || function (m) { toast(m, 'error'); })(e.message || 'Gagal.'); }
  }
  function aduStop() { if (ADU.poll) { clearInterval(ADU.poll); ADU.poll = null; } }
  function aduLawanProfil(d) {
    return { name: d.lawan || 'Kapten', ship: d.kapalLawan || d.kapalku, react: 300, rsd: 60, aim: -20, sd: 45, boost: 1 };
  }
  function aduLobi(data) {
    if (!G) return;
    aduStop();
    var a = data || (st && st.adu) || null;
    if (!a) { menu(); return; }
    if (a.duel && (a.duel.status === 'invited' || a.duel.status === 'active')) { aduTunggu(a.duel); return; }
    var rows = (a.kapten || []).map(function (k) {
      return '<li><span>' + esc(k.nama) + '<small>' + (k.sisa > 0 ? 'sisa ' + k.sisa + ' adu hari ini' : 'jatah hari ini habis') + '</small></span>' +
        '<button type="button" class="trk-btn mini" data-tantang="' + esc(k.id) + '"' + (k.sisa > 0 ? '' : ' disabled') + '>Tantang</button></li>';
    }).join('');
    var papan = (a.papan || []).map(function (p, i) {
      return '<li><span>' + (i + 1) + '</span><span>' + esc(p.nama) + '</span><b>' + p.menang + '×</b></li>';
    }).join('');
    var c = G.card(
      '<div class="trk-k">Zentul · Adu Kapten</div><h1>Adu Kapten</h1><div class="trk-orn"></div>' +
      '<p class="trk-sub">Lintasan yang sama, benih yang sama, tanpa taruhan. Kalian berdua berangkat dari obor yang sama; juru tulis menghitung setelah dua catatan masuk. Maksimal ' + (a.maks || 3) + '× sehari dengan kapten yang sama.</p>' +
      (a.siap ? '' : '<p class="trk-sub warn">Kapalmu harus merapat di Zentul untuk beradu.</p>') +
      '<div class="trk-lbl">Kapten di dermaga Zentul</div>' +
      (rows ? '<ul class="trk-adu">' + rows + '</ul>' : '<p class="trk-kosong">Belum ada kapten lain di dermaga. Rayan Bazzy menyeka tangannya: "Sabar. Selat ini tak pernah sepi lama."</p>') +
      (papan ? '<div class="trk-lbl">Papan Adu · tujuh hari terakhir</div><ol class="trk-papan">' + papan + '</ol>' : '') +
      '<button type="button" class="trk-btn ghost" data-a="segar">Lihat lagi dermaga</button>' +
      '<button type="button" class="trk-btn ghost" data-a="menu">Kembali ke Sirkuit</button>');
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-tantang],[data-a]') : null; if (!t || t.disabled) return;
      if (t.dataset.tantang) {
        t.disabled = true; t.textContent = '…';
        aduApi(['tantang', t.dataset.tantang], function (r) { if (r.duel) aduTunggu(r.duel); else aduSegar(); },
          function (m) { toast(m, 'error'); aduSegar(); });
      } else if (t.dataset.a === 'segar') aduSegar();
      else if (t.dataset.a === 'menu') menu();
    };
  }
  function aduSegar() { aduApi(['lobi'], function (r) { aduLobi(r.adu); }, function (m) { toast(m, 'error'); menu(); }); }
  function aduTunggu(d) {
    if (!G) return;
    aduStop(); ADU.duel = d;
    if (d.status === 'active') { aduBalap(d); return; }
    if (d.status !== 'invited') { aduSegar(); return; }
    var sisa = Math.max(0, 60 - Math.round((Date.now() - d.dibuat) / 1000));
    var c = G.card(
      '<div class="trk-k">Tantangan terkirim</div><h2 class="trk-tunggu">' + esc(d.lawan) + '</h2>' +
      '<p class="trk-sub">Obor sudah disiapkan. Menunggu jawaban… <b class="trk-cd">' + sisa + '</b> dtk</p>' +
      '<button type="button" class="trk-btn ghost" data-a="batal">Tarik tantangan</button>');
    var cd = c.querySelector('.trk-cd');
    ADU.poll = setInterval(function () {
      if (!c.isConnected) { aduStop(); return; }
      sisa = Math.max(0, sisa - 1); if (cd) cd.textContent = sisa;
      if (sisa % 2) return;
      aduApi(['lihat', d.id], function (r) {
        var n = r.duel; if (!n || !c.isConnected) return;
        if (n.status === 'active') { aduStop(); aduBalap(n); }
        else if (n.status !== 'invited') { aduStop(); toast(n.status === 'declined' ? esc(d.lawan) + ' menolak tantanganmu.' : 'Tantangan berakhir.', 'info'); aduSegar(); }
      }, function () { });
    }, 1000);
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t) return;
      aduStop(); aduApi(['batal', d.id], function () { aduSegar(); }, function () { aduSegar(); });
    };
  }
  function aduBalap(d) {
    if (!G) return;
    aduStop(); ADU.duel = d;
    var me = S.SHIPS[d.kapalku], op = S.SHIPS[d.kapalLawan || d.kapalku];
    var c = G.card(
      '<div class="trk-k">Adu Kapten · Selat Lurus</div>' +
      '<div class="trk-vs"><div class="trk-side me"><small>KAMU</small><b>' + esc(me.name) + '</b>' + stats(me) + '</div><div class="trk-mid">VS</div>' +
      '<div class="trk-side op"><small>' + esc(d.lawan).toUpperCase() + '</small><b>' + esc(op.name) + '</b>' + stats(op) + '</div></div>' +
      '<p class="trk-sub" style="margin-top:10px">Kapal di sebelahmu hanyalah <b>laju rekor ' + esc(d.lawan) + '</b>. Hasil sebenarnya dihitung juru tulis setelah kalian berdua menyetor catatan.</p>' +
      '<p class="trk-sub warn">Setor dalam 90 detik sejak obor menyala. Yang diam dianggap kalah.</p>' +
      '<button type="button" class="trk-btn" data-utama data-a="siap">SIAP</button>');
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t || t.disabled) return;
      var ghost = ls('ghost', true) && st.best && st.best.log && d.kapalku === st.ship ? st.best.log : null;
      G.race({ ship: d.kapalku, rival: aduLawanProfil(d), seed: d.seed, hint: hint(), ghostLog: ghost }, function (res) {
        if (!res || res.cancelled) { aduKirim(d, []); return; }
        lsSet('races', races() + 1);
        aduKirim(d, res.log || [], res);
      });
    };
  }
  function aduKirim(d, log, res) {
    if (!G) return;
    var c = G.card(
      '<div class="trk-k" style="text-align:center">Adu Kapten</div><h2>Catatan disetor</h2>' +
      '<p class="trk-sub">' + (res && res.me && res.me.fin ? 'Waktumu <b>' + dtk(res.me.fin) + ' dtk</b>. ' : '') + 'Menunggu catatan ' + esc(d.lawan) + '…</p>' +
      '<p class="trk-srv">juru tulis sirkuit sedang menghitung…</p>' +
      '<button type="button" class="trk-btn ghost" data-a="menu">Tinggalkan dulu</button>');
    c.onclick = function () { aduStop(); menu(); };
    var n = 0;
    function cek(r) {
      var x = r && r.duel; if (!x || !c.isConnected) return;
      if (x.status === 'done' || x.status === 'cancelled') { aduStop(); aduHasil(x); }
    }
    aduApi(['log', d.id, log], cek, function (m) { toast(m, 'error'); });
    ADU.poll = setInterval(function () {
      if (!c.isConnected || ++n > 50) { aduStop(); return; }
      aduApi(['lihat', d.id], cek, function () { });
    }, 2500);
  }
  function aduHasil(d) {
    if (!G) return;
    aduStop(); ADU.duel = null;
    var menang = d.menang === 'aku', seri = d.menang === 'seri';
    var batal = d.status === 'cancelled';
    var diff = (d.usKu != null && d.usLawan != null) ? d.usKu - d.usLawan : null;
    var kata = batal ? 'Tak seorang pun menyetor catatan. Adu dibatalkan.'
      : menang ? '"Catatanmu lebih bersih. Kuikat namamu di tiang," kata Rayan Bazzy.'
        : seri ? '"Sama persis. Selat ini jarang sekali begitu," kata Rayan Bazzy.'
          : '"Dia lebih sabar di gigi empat. Perhatikan itu," kata Rayan Bazzy.';
    var c = G.card('<div class="trk-res">' +
      '<div class="trk-k" style="text-align:center">Adu Kapten · ' + esc(d.lawan) + '</div>' +
      '<h2 class="' + (batal || seri ? '' : (menang ? 'win' : 'lose')) + '">' + (batal ? 'Batal' : seri ? 'Seri' : menang ? 'Menang!' : 'Kalah') + '</h2>' +
      (batal ? '' : '<div class="trk-times"><div><small>KAMU</small><b>' + dtk(d.usKu) + ' dtk</b></div><div><small>' + esc(d.lawan).toUpperCase() + '</small><b>' + dtk(d.usLawan) + ' dtk</b></div></div>' +
        (diff == null ? '<p class="trk-diff">' + (d.usKu == null ? 'kau tidak menyelesaikan lintasan' : esc(d.lawan) + ' tidak menyelesaikan lintasan') + '</p>'
          : '<p class="trk-diff">' + (diff < 0 ? 'unggul ' : diff > 0 ? 'tertinggal ' : 'selisih ') + dtk(Math.abs(diff)) + ' dtk</p>')) +
      '<p class="trk-q">' + esc(kata) + '<small>— Lapau Oli</small></p>' +
      '<div class="trk-row"><button type="button" class="trk-btn ghost" data-a="lobi">Dermaga</button><button type="button" class="trk-btn" data-utama data-a="balik">TANTANG BALIK</button></div></div>');
    c.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-a]') : null; if (!t) return;
      if (t.dataset.a === 'balik' && d.lawanId) {
        t.disabled = true;
        aduApi(['tantang', d.lawanId], function (r) { if (r.duel) aduTunggu(r.duel); else aduSegar(); }, function (m) { toast(m, 'error'); aduSegar(); });
      } else aduSegar();
    };
  }
  // undangan masuk (dipanggil dari penampung inbox multiplayer)
  function aduInbox(it) {
    if (!it || String(it.type || '').indexOf('trek_adu_') !== 0) return false;
    if (it.type === 'trek_adu_invite') { aduUndangan(it); return true; }
    if (it.type === 'trek_adu_tolak') { toast((it.from || 'Kapten itu') + ' menolak tantangan adumu.', 'info'); return true; }
    if (it.type === 'trek_adu_hasil') {
      if (G) aduApi(['lihat', it.duelId], function (r) { if (r.duel && r.duel.status === 'done') aduHasil(r.duel); }, function () { });
      return true;
    }
    return true;
  }
  function aduUndangan(it) {
    if (ADU.undangan) return;
    ADU.undangan = it;
    var host = document.getElementById('trkInv');
    if (!host) { document.body.insertAdjacentHTML('beforeend', '<div id="trkInv"></div>'); host = document.getElementById('trkInv'); }
    host.innerHTML = '<div class="trk-inv-box"><div class="trk-k">Adu Kapten · Sirkuit Zentul</div>' +
      '<div class="trk-inv-n">' + esc(it.from || 'Kapten') + '</div>' +
      '<p class="trk-inv-s">menantangmu balapan di Selat Lurus. Tanpa taruhan &middot; <b class="trk-inv-cd">60</b> dtk</p>' +
      '<div class="trk-inv-a"><button type="button" class="trk-btn" data-utama data-i="ya">TERIMA</button><button type="button" class="trk-btn ghost" data-i="tidak">Tolak</button></div></div>';
    host.classList.add('show');
    try { if (typeof au_ === 'function') au_('bell'); } catch (e) { }
    var sisa = 58, cd = host.querySelector('.trk-inv-cd');
    clearInterval(host._t);
    host._t = setInterval(function () { sisa--; if (cd) cd.textContent = Math.max(0, sisa); if (sisa <= 0) aduTutupUndangan(); }, 1000);
    host.onclick = function (e) {
      var t = e.target.closest ? e.target.closest('[data-i]') : null; if (!t) return;
      var ya = t.dataset.i === 'ya', id = it.duelId;
      aduTutupUndangan();
      aduApi(['jawab', id, ya], function (r) {
        if (!ya || !r.duel) return;
        if (G) aduTunggu(r.duel);
        else open(null, function () { aduTunggu(r.duel); });
      }, function (m) { toast(m, 'error'); });
    };
  }
  function aduTutupUndangan() { var h = document.getElementById('trkInv'); if (h) { h.classList.remove('show'); clearInterval(h._t); h.innerHTML = ''; } ADU.undangan = null; }

  return { open: open, isOpen: function () { return !!G; }, adu: function () { aduSegar(); }, inbox: aduInbox };
})();
</script>
