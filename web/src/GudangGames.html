<script>
/* =====================================================================

 *     manifest -> cb({ win, picks: [id...], mistakes, kind })             Cocokkan Manifest

 *         newRules [aturan yang baru diperkenalkan], finale (manifest: dinding turus), __autoplay (uji browser)
 * Aturan susun SAMA dengan game.dn_check_susun (0065) & test/duneks-solver.js:
 *   y = 0 baris bawah, x = w-1 kolom dekat pintu, putaran (x,y) -> (y,-x).

var MTGames5 = (function () {
  var REDUCE = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

      '<div class="tsg-body" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>';

    requestAnimationFrame(function () { root.classList.add('on'); });

    S.on = function (el, ev, fn, o) { el.addEventListener(ev, fn, o); S.offs.push(function () { el.removeEventListener(ev, fn, o); }); };

      S.timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
      cancelAnimationFrame(S.raf);
      S.offs.forEach(function (f) { try { f(); } catch (e) { } });

  }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function faceSvg(npc) {
    try { if (npc && npc.svg) return npc.svg; if (npc && npc.ap && window.MTFace) return MTFace.svg(npc.ap, { bgColors: ['#7a5a3a', '#2a1a0e'] }); } catch (e) { }
    return '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#5a3a1e"/></svg>';
  }
  function sayBox(S, npc) {
    var m = el('div', 'tsg-msg');
    S.body.appendChild(m);
    var name = (npc && npc.name) || 'Penjaga Gudang';
    return {
      el: m,
      say: function (t, cls) { m.className = 'tsg-msg' + (cls ? ' ' + cls : ''); m.innerHTML = '<div class="gdg-say"><div class="f">' + faceSvg(npc) + '</div><div class="t"><b>' + esc(name) + ':</b> ' + t + '</div></div>'; },
      note: function (t, cls) { m.className = 'tsg-msg' + (cls ? ' ' + cls : ''); m.innerHTML = t; }

  }
  // kanvas berskala: koordinat logis W x H, tajam di layar mana pun; H boleh berubah (resize())
  function stageCanvas(S, W, H) {
    var st = el('div', 'tsg-stage'), cv = el('canvas', 'gdg-cv'); st.appendChild(cv); S.body.appendChild(st);

    C.size = function () {

      C.ctx.setTransform(d * C.K, 0, 0, d * C.K, 0, 0);
    };
    C.resize = function (w, h) { C.W = w; C.H = h; C.size(); };
    C.pt = function (e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * C.W, y: (e.clientY - r.top) / r.height * C.H }; };
    C.size(); S.on(window, 'resize', C.size);
    return C;
  }
  function glow(ctx, x, y, r, col, a) {

  function rr(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /* ---------------- tema gudang per pulau ---------------- */
  var THEMES = {
    sunda:   { wall: ['#4a3222', '#2a1a10'], plank: 'rgba(0,0,0,.22)', rack: '#7a5232', rackD: '#4a3018', floor: '#3a2614', light: '255,214,150', lamp: '255,190,110', deco: 'batik' },
    bjorneo: { wall: ['#3a2c24', '#1a120c'], plank: 'rgba(0,0,0,.28)', rack: '#6a4a2a', rackD: '#3a2614', floor: '#2e2016', light: '255,200,150', lamp: '255,170,90', deco: 'uap' },
    skitraw: { wall: ['#4e2a1e', '#26120c'], plank: 'rgba(0,0,0,.22)', rack: '#7e5030', rackD: '#4a2a14', floor: '#3a2014', light: '255,220,160', lamp: '255,190,110', deco: 'bendera' },
    gading:  { wall: ['#4a1e1a', '#220c0a'], plank: 'rgba(0,0,0,.25)', rack: '#6e3a24', rackD: '#3e1e12', floor: '#2e1610', light: '255,210,170', lamp: '255,120,80', deco: 'lampion' },
    ikn:     { wall: ['#2e342a', '#12160f'], plank: 'rgba(0,0,0,.3)', rack: '#55503a', rackD: '#2e2c1e', floor: '#22261a', light: '220,230,200', lamp: '255,200,120', deco: 'lumut' }
  };
  function theme(k) { return THEMES[k] || THEMES.sunda; }

  /* ---------------- latar gudang (dinding, rak, pintu, lentera, debu) ---------------- */
  function drawRoom(ctx, W, H, T, t, o) {
    // o: { rackL, rackT, cs, w, h, floorY, doorX, lampX, bright }
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, T.wall[0]); g.addColorStop(1, T.wall[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = T.plank; ctx.lineWidth = 2;
    for (var x = 0; x < W; x += 46) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, o.floorY); ctx.stroke(); }
    var r = rng(77); ctx.fillStyle = 'rgba(0,0,0,.18)';
    for (var k = 0; k < 40; k++) { ctx.beginPath(); ctx.arc(r() * W, r() * o.floorY, 1 + r() * 1.6, 0, 6.3); ctx.fill(); }
    // dekor tema
    if (T.deco === 'bendera') {
      ctx.strokeStyle = 'rgba(240,220,180,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(10, 22); ctx.quadraticCurveTo(W * 0.4, 46, W - 170, 20); ctx.stroke();
      var cols = ['#c0392b', '#e8c878', '#2e7d4f', '#f4ead6'];
      for (var f = 0; f < 14; f++) { var fx = 20 + f * (W - 200) / 14, fy = 22 + Math.sin(f / 13 * Math.PI) * 20; ctx.fillStyle = cols[f % 4]; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + 16, fy); ctx.lineTo(fx + 8, fy + 16 + Math.sin(t * 2 + f) * 1.5); ctx.closePath(); ctx.fill(); }
    } else if (T.deco === 'lampion') {
      for (var l = 0; l < 5; l++) { var lx = 40 + l * (W - 220) / 4, ly = 26 + (l % 2) * 8, sw = Math.sin(t * 1.4 + l) * 2;
        ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx + sw, ly); ctx.stroke();
        glow(ctx, lx + sw, ly + 12, 34, '255,90,60', 0.25); ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.ellipse(lx + sw, ly + 12, 10, 13, 0, 0, 6.3); ctx.fill();
        ctx.fillStyle = '#e8c878'; ctx.fillRect(lx + sw - 5, ly - 2, 10, 3); ctx.fillRect(lx + sw - 5, ly + 24, 10, 3); }
    } else if (T.deco === 'uap') {
      for (var u = 0; u < 6; u++) { var ph = ((t * 0.08 + u / 6) % 1); ctx.fillStyle = 'rgba(220,210,200,' + (0.05 * (1 - ph)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(60 + u * 110 + Math.sin(t + u) * 10, 60 - ph * 50, 30 + ph * 40, 0, 6.3); ctx.fill(); }
    } else if (T.deco === 'lumut') {
      var rm = rng(91); ctx.fillStyle = 'rgba(90,120,60,.35)';
      for (var m = 0; m < 60; m++) { var mx = rm() * W, my = rm() < 0.5 ? rm() * 30 : o.floorY - rm() * 26; ctx.beginPath(); ctx.ellipse(mx, my, 6 + rm() * 14, 3 + rm() * 5, 0, 0, 6.3); ctx.fill(); }
    } else {
      // batik tipis di kain penutup dinding
      ctx.strokeStyle = 'rgba(232,200,120,.08)'; ctx.lineWidth = 1;
      for (var b = 0; b < 8; b++) { ctx.beginPath(); ctx.arc(30 + b * 70, 30, 14, 0, 6.3); ctx.stroke(); ctx.beginPath(); ctx.arc(30 + b * 70, 30, 6, 0, 6.3); ctx.stroke(); }
    }
    // pintu & sorot cahaya
    var dx = o.doorX, dw = W - dx - 14;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(dx - 6, 50, dw + 12, o.floorY - 50);
    var dg = ctx.createLinearGradient(dx, 0, W, 0); dg.addColorStop(0, 'rgba(' + T.light + ',.85)'); dg.addColorStop(1, 'rgba(' + T.light + ',.55)');
    ctx.fillStyle = dg; ctx.fillRect(dx, 56, dw, o.floorY - 56);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(dx + dw * 0.3, 56, 3, o.floorY - 56);
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 6; ctx.strokeRect(dx - 3, 53, dw + 6, o.floorY - 50);
    // sorot miring ke lantai
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    var bg = ctx.createLinearGradient(dx, 0, dx - 340, 0); bg.addColorStop(0, 'rgba(' + T.light + ',' + (0.16 * o.bright).toFixed(3) + ')'); bg.addColorStop(1, 'rgba(' + T.light + ',0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(dx, 60); ctx.lineTo(dx, o.floorY); ctx.lineTo(dx - 360, H); ctx.lineTo(dx - 220, H); ctx.closePath(); ctx.fill();
    ctx.restore();
    // lantai
    ctx.fillStyle = T.floor; ctx.fillRect(0, o.floorY, W, H - o.floorY);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
    for (var fl = o.floorY + 14; fl < H; fl += 22) { ctx.beginPath(); ctx.moveTo(0, fl); ctx.lineTo(W, fl); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, o.floorY, W, 4);
    // lentera gantung
    var lx2 = o.lampX, sw2 = REDUCE ? 0 : Math.sin(t * 1.1) * 0.08;
    ctx.save(); ctx.translate(lx2, 0); ctx.rotate(sw2);
    ctx.strokeStyle = '#1a120a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.stroke();
    glow(ctx, 0, 44, 140 * (0.8 + 0.4 * o.bright), T.lamp, 0.22 + 0.25 * o.bright);
    ctx.fillStyle = '#2a1a0e'; ctx.fillRect(-9, 30, 18, 5); ctx.fillRect(-11, 56, 22, 5);
    ctx.fillStyle = 'rgba(' + T.lamp + ',' + (0.75 + 0.2 * Math.sin(t * 7)).toFixed(3) + ')'; rr(ctx, -8, 35, 16, 21, 3); ctx.fill();
    ctx.strokeStyle = '#2a1a0e'; ctx.lineWidth = 1.2; ctx.strokeRect(-8, 35, 16, 21);
    ctx.restore();
  }
  function drawRack(ctx, T, o) {
    var L = o.rackL, Tp = o.rackT, cs = o.cs, Wd = o.w * cs, Ht = o.h * cs;
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(L - 4, Tp - 6, Wd + 8, Ht + 10);
    // papan rak per baris
    for (var y = 0; y <= o.h; y++) {
      var yy = Tp + y * cs;
      ctx.fillStyle = T.rack; ctx.fillRect(L - 10, yy - 3, Wd + 20, 7);
      ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(L - 10, yy - 3, Wd + 20, 1.5);
      ctx.fillStyle = T.rackD; ctx.fillRect(L - 10, yy + 3, Wd + 20, 2);
    }
    // tiang
    ctx.fillStyle = T.rackD;
    ctx.fillRect(L - 14, Tp - 8, 8, Ht + 14); ctx.fillRect(L + Wd + 6, Tp - 8, 8, Ht + 14);
    ctx.fillStyle = T.rack; ctx.fillRect(L - 13, Tp - 8, 4, Ht + 14); ctx.fillRect(L + Wd + 7, Tp - 8, 4, Ht + 14);
    // garis sel (samar)
    ctx.strokeStyle = 'rgba(232,200,120,.07)'; ctx.lineWidth = 1;
    for (var x = 1; x < o.w; x++) { ctx.beginPath(); ctx.moveTo(L + x * cs + 0.5, Tp); ctx.lineTo(L + x * cs + 0.5, Tp + Ht); ctx.stroke(); }
    // kolom pintu
    if (o.doorCol) {
      ctx.fillStyle = 'rgba(' + T.light + ',.06)'; ctx.fillRect(L + (o.w - 1) * cs, Tp, cs, Ht);
      ctx.strokeStyle = 'rgba(' + T.light + ',.25)'; ctx.setLineDash([5, 5]); ctx.strokeRect(L + (o.w - 1) * cs + 2, Tp + 2, cs - 4, Ht - 4); ctx.setLineDash([]);
    }
  }
  function drawDust(ctx, W, H, t, o, dust) {
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i], x = o.doorX - 30 - ((d.x + t * d.v * 12) % 1) * 380, y = 60 + ((d.y + t * d.v * 3 + Math.sin(t * d.v + i) * 0.01) % 1) * (H - 70);
      var a = 0.18 + 0.25 * Math.sin(t * 2 + i); if (a <= 0) continue;
      ctx.fillStyle = 'rgba(255,240,210,' + (a * 0.6).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, d.s, 0, 6.3); ctx.fill();
    }
  }

  /* ---------------- ikon aturan (lencana) ---------------- */
  var TAG_COL = { berat: '#4a4f5a', basah: '#2f7fb8', kain: '#8a4aa8', rapuh: '#f1ece0', besok: '#d9a441' };
  function badge(ctx, tag, x, y, r) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(0.8, 1.2, r, 0, 6.3); ctx.fill();
    ctx.fillStyle = TAG_COL[tag] || '#888'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.stroke();
    var s = r * 0.62; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (tag === 'berat') {
      ctx.strokeStyle = '#f4ead6'; ctx.lineWidth = r * 0.17;
      ctx.beginPath(); ctx.moveTo(0, -s * 0.85); ctx.lineTo(0, s * 0.8); ctx.moveTo(-s * 0.45, -s * 0.4); ctx.lineTo(s * 0.45, -s * 0.4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, s * 0.1, s * 0.72, 0.35, Math.PI - 0.35); ctx.stroke();
    } else if (tag === 'basah') {
      ctx.fillStyle = '#e8f4ff'; ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * 0.9, s * 0.1, 0, s * 0.85); ctx.quadraticCurveTo(-s * 0.9, s * 0.1, 0, -s); ctx.fill();
