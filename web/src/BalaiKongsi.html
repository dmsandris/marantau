var BK = (function () {
  var papan = null, armed = {}, tick = null, introPage = -1;
  var TIERS = [

    { at: 100000000, t: 'Seperlima untuk J.T.', p: 'Deretan angka setoran, setiap pekan, bertahun-tahun. Di ujung tiap baris tertulis kecil: "1/5 untuk dana restorasi". Di halaman terakhir bab ini ada tulisan tangan lain, tegas dan rapi: "Diterima. J.T." Ki Dorus menggarisbawahinya tiga kali.' },

  ];

  function st() { return (state && state.kongsi) || null; }
  function fmt(n) { return typeof formatGold === 'function' ? formatGold(Math.round(n || 0)) : String(Math.round(n || 0)); }
  function jt(n) { n = Number(n || 0); if (n >= 1000000) return (Math.round(n / 100000) / 10).toLocaleString('id-ID') + ' jt'; if (n >= 1000) return Math.round(n / 1000) + ' rb'; return String(n); }

  /* ---------- gambar kapal kecil ---------- */
  function shipSvg(tier) {

    else sails = '<rect x="48" y="6" width="2" height="36" fill="#3a2a1a"/><path d="M50 7 Q72 20 70 38 L50 38 Z" fill="#a8302a"/><path d="M48 10 Q32 22 34 38 L48 38 Z" fill="#c9a441"/>';
    return '<svg viewBox="0 0 96 58" aria-hidden="true">' + sails + hull + waves + '</svg>';

  /* ---------- server ---------- */

  /* ---------- panel ---------- */
  function intro() {
    var P = [
      ['<p>Balai panjang beratap tinggi. Di ujungnya meja kayu jati penuh buku. Seorang lelaki tua menulis tanpa menoleh.</p>', 'Nama, Tuan Kapten. Semua yang masuk balai ini dicatat.'],
      ['<p>Ia akhirnya mengangkat kepala. Satu lensa kacamatanya retak. Di pinggangnya tergantung buku besar yang dirantai.</p>', 'Dulu di meja ini saya mencatat nama orang-orang yang dijual. Empat puluh tahun. Tinta saya tak pernah kering. Sekarang saya mencatat nama orang yang berani menanam emasnya di laut jauh. Lebih baik begitu, bukan?'],
      ['<p>Ia menunjuk tiga kapal kecil di dermaga balai: sebuah jung, sebuah pinisi, sebuah lancang.</p>', 'Kapal kongsi berangkat tiap hari dan pulang sehari kemudian. Ada yang pulang membawa mutiara, ada yang tidak pulang sama sekali. Laut tidak pernah berjanji, Tuan Kapten. Saya juga tidak. Dan sebagian laba balai ini saya kirim ke IKN. Utang lama. Dicatat.']

        var pct = Math.max(0, Math.min(100, (now - a.departMs) / Math.max(1, a.returnMs - a.departMs) * 100));
        var back = a.returnMs - now, rc = Math.floor(a.modal * ((s.recallPct || 70) / 100));

          ' &middot; modal <b>' + fmt(a.modal) + '</b><div class="bk-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
          '<span class="muted">' + (back > 0 ? 'Pulang dalam ' + dur(back) + '.' : 'Merapat sebentar lagi&hellip;') + '</span>' + kab + btn + '</div></div>';
      }).join('') + '</div>';
    }

    // tanam
    if (s.here) {
      var w = wealth();
      html += '<div class="bk-sec"><h4>' + ic('coins') + ' Tanam modal<span class="r">Bank ' + fmt((state.bank || {}).bankBalance || 0) + ' &middot; tangan ' + fmt(state.player.gold) + '</span></h4><div class="bk-tiers">' +
        TIERS.map(function (t) {
          var b = busyT[t.id];
          var body = b ? '<div class="busy">' + ic('hourglass') + ' Kapal masih di laut.</div>' :
            '<label>Modal (min ' + fmt(s.min) + ')<input type="number" min="' + s.min + '" step="100000" inputmode="numeric" data-bk-in="' + t.id + '" placeholder="' + fmt(s.min) + '"></label>' +
            '<div class="bk-q"><button data-bk-q="' + t.id + '" data-v="' + Math.floor(w / 4) + '">25%</button><button data-bk-q="' + t.id + '" data-v="' + Math.floor(w / 2) + '">50%</button><button data-bk-q="' + t.id + '" data-v="' + w + '">Semua</button></div>' +
            '<button class="btn ' + (armed[t.id] ? 'warn' : 'btn-gold') + '" data-bk-go="' + t.id + '">' + (armed[t.id] ? 'Lebih dari separuh harta. Yakin?' : ic('anchor') + ' Tanam') + '</button>';
          return '<div class="bk-tier t-' + t.id + '"><div class="sea">' + shipSvg(t.id) + '</div><h5>' + t.name + '</h5><span class="tj">' + esc_(t.ship) + ' &middot; ' + esc_(t.tujuan) + '</span>' + body + '</div>';
        }).join('') + '</div><div class="bk-risk">&ldquo;Semua usaha pasti ada risikonya. High risk, high return.&rdquo;</div>' +
        '<span class="muted small">Kapal pulang sehari kemudian. Hasil masuk ke Bank di mana pun kamu berada. Satu kapal per jenis.</span></div>';
    } else {
      html += '<div class="bk-away">' + ic('anchor') + '<span>Kongsi baru hanya dicatat di <b>Balai Kongsi, Pelabuhan Rantai Lama</b>. Dari sini kamu bisa melihat kapalmu dan memanggilnya pulang.</span></div>';
    }

    // Buku Ki Dorus
    var bk = s.buku || {}, atSea = active.reduce(function (t, a) { return t + (a.modal || 0); }, 0), net = (bk.bayar || 0) - Math.max(0, (bk.modal || 0) - atSea);
    var pages = PAGES.map(function (p) {
      if ((bk.modal || 0) >= p.at) return '<details><summary>' + ic('book') + esc_(p.t) + '</summary><p>' + esc_(p.p) + '</p></details>';
      return '<div class="lock">' + ic('lock') + 'Halaman terkunci &middot; terbuka setelah ' + jt(p.at) + ' modal ditanam</div>';
    });
    var firstLocked = PAGES.findIndex ? PAGES.findIndex(function (p) { return (bk.modal || 0) < p.at; }) : -1;
    if (firstLocked >= 0) pages = pages.slice(0, firstLocked + 1);   // hanya halaman berikutnya yang tampak terkunci
    html += '<div class="bk-sec"><h4>' + ic('journal') + ' Buku Ki Dorus</h4><div class="bk-book"><div class="tot">' +
      '<div>Modal ditanam<b>' + fmt(bk.modal) + '</b></div><div>Kembali' + (atSea ? ' &middot; ' + fmt(atSea) + ' di laut' : '') + '<b>' + fmt(bk.bayar) + '</b></div><div>' + (net >= 0 ? 'Untung' : 'Rugi') + ' bersih<b>' + fmt(Math.abs(net)) + '</b></div></div>' +
      pages.join('') + riwayatHtml() + '</div></div>';

    // Papan Lonceng
    html += loncengHtml();
    if (s.ikn) html += '<div class="bk-ikn">' + ic('flag') + '<span>Tiap Senin pagi Ki Dorus mengirim sebagian laba balai ke Restorasi IKN' +
      (papan && papan.kiDorus ? ' (sejauh ini ' + fmt(papan.kiDorus) + ' gold)' : '') + ', atas nama para pengongsi yang kapalnya tak pulang utuh.</span></div>';
    html += '</div>';
    setModal_(html);
    bind();
  }
  function riwayatHtml() {
    var rw = papan && papan.riwayat; if (!rw || !rw.length) return '';
    return '<details><summary>' + ic('scroll') + 'Catatan 10 kongsi terakhir</summary>' + rw.map(function (r) {
      var n = (r.payout || 0) - r.modal;
      return '<div class="bk-rw"><span>' + esc_(tierName(r.tier)) + ' &middot; ' + esc_(r.tujuan) + (r.recalled ? ' &middot; dipanggil pulang' : '') + '<br><span class="muted">modal ' + fmt(r.modal) + ' &rarr; ' + fmt(r.payout) + '</span></span>' +
        '<b class="' + (n >= 0 ? 'up' : 'dn') + '">' + (n >= 0 ? '+' : '&minus;') + fmt(Math.abs(n)) + '</b></div>';
    }).join('') + '</details>';
  }
  function loncengHtml() {
    var L = papan && papan.lonceng;
    return '<div class="bk-board"><h4>' + ic('trophy') + ' Papan Lonceng &middot; pekan ini</h4>' +
      (L && L.length ? L.map(function (x, i) {
        return '<div class="row' + (x.me ? ' me' : '') + '"><span class="r">' + (i + 1) + '</span><span>' + esc_(cap(x.name)) + ' <span style="color:#a59a84">&middot; ' + esc_(tierName(x.tier)) + '</span></span><b>+' + fmt(x.untung) + '</b></div>';
      }).join('') : '<div class="empty">Lonceng belum berdentang pekan ini.</div>') + '</div>';
  }
  function bind() {
    var c = document.getElementById('modalContent'); if (!c) return;
    var seen = document.getElementById('bkSeen');
    if (seen) seen.onclick = function () { seen.disabled = true; au_('page'); call(['lihat'], function () { render(); }); };
    c.querySelectorAll('[data-bk-q]').forEach(function (b) {
      b.onclick = function () { var el = c.querySelector('[data-bk-in="' + b.getAttribute('data-bk-q') + '"]'); if (el) { el.value = Math.max(0, Number(b.getAttribute('data-v')) || 0); el.focus(); } };
    });
    c.querySelectorAll('[data-bk-go]').forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute('data-bk-go'), el = c.querySelector('[data-bk-in="' + t + '"]'), v = Math.floor(Number(el && el.value) || 0), s = st();
        if (!canAct_()) return;
        if (v < s.min) { showToast('Modal kongsi paling sedikit ' + fmt(s.min) + ' gold.', 'error'); return; }
        if (v > wealth()) { showToast('Gold di Bank dan di tangan tidak cukup.', 'error'); return; }
        if (v > wealth() / 2 && !armed[t]) { armed[t] = v; render(); var e2 = c.querySelector('[data-bk-in="' + t + '"]'); if (e2) e2.value = v; return; }
        delete armed[t]; b.disabled = true;
        call(['tanam', t, v], function () {
          au_('coin', { n: 4 });
          showToast('Dicatat. ' + tierName(t) + ' berangkat dengan modal ' + fmt(v) + ' gold.', 'success');
          if (typeof saveSnap_ === 'function') saveSnap_();
          render();
        }, function (e) { b.disabled = false; showToast(e.message, 'error'); render(); });
      };
    });
    c.querySelectorAll('[data-bk-recall]').forEach(function (b) {
      b.onclick = function () {
        var id = Number(b.getAttribute('data-bk-recall'));
        if (!armed[id]) { armed[id] = 1; render(); return; }
        delete armed[id]; b.disabled = true;
        call(['panggil', id], function () { au_('coin', { n: 2 }); showToast('Kapal kongsi dipanggil pulang. Modal kembali ke Bank.', 'info'); render(); },
          function (e) { b.disabled = false; showToast(e.message, 'error'); render(); });
      };
    });
  }
  function refresh() { call(['status'], function () { render(); }, function () { }); }
  function startTick() {
    stopTick();
    tick = setInterval(function () {
      if (currentPanel !== 'balaikongsi') { stopTick(); return; }
      var s = st(); if (!s) return;
      var now = serverNow(), due = (s.active || []).some(function (a) { return a.returnMs <= now || (!a.kabar && a.kabarMs <= now); });
      if (due) refresh();
      else if (!document.querySelector('#modalContent input:focus') && !Object.keys(armed).length) render();
    }, 30000);
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }

  /* ---------- kaitan ---------- */
  if (typeof PANEL_SIZE !== 'undefined') PANEL_SIZE.balaikongsi = 'mid';
  var origOpen = window.openPanel;
  if (typeof origOpen === 'function') {
    window.openPanel = function (panel) {
      if (panel === 'balaikongsi') {
        if (!st()) { showToast('Balai Kongsi masih tutup.', 'info'); return; }
        armed = {};
        var r = origOpen.apply(this, arguments); render(); refresh(); startTick(); return r;
      }
      return origOpen.apply(this, arguments);
    };
  }
  // Bank: ringkasan kapal kongsi di mana pun
  wrap_('setModal_', function () {
    if (currentPanel !== 'bank') return;
    var s = st(); if (!s) return;
    var n = (s.active || []).length, m = (s.laporan || []).length; if (!n && !m) return;
    var c = document.getElementById('modalContent'), v = c && c.querySelector('.vault'); if (!v || c.querySelector('.bk-bankcard')) return;
    v.insertAdjacentHTML('afterend', '<div class="bk-bankcard">' + ic('ship') + '<span>Kapal kongsi di laut: <b>' + n + '</b>' + (m ? ' &middot; laporan baru: <b>' + m + '</b>' : '') + '</span>' +
      '<button class="btn btn-sm btn-gold" id="bkFromBank">' + ic('book') + ' Buku kongsi</button></div>');
    var b = document.getElementById('bkFromBank'); if (b) b.onclick = function () { openPanel('balaikongsi'); };
  });
  wrap_('handleInbox_', null, function (it) {
    if (!it || it.type !== 'kongsi') return;
    if (it.kind === 'kabar') { showToast('Kabar dari laut untuk kapal kongsi ' + tierName(it.tier) + '. Lihat di Buku kongsi.', 'info'); au_('page'); }
    else if (it.kind === 'pulang') {
      var net = (it.payout || 0) - (it.modal || 0);
      showToast('Kapal kongsi ' + tierName(it.tier) + ' pulang: ' + fmt(it.payout) + ' gold masuk Bank (' + (net >= 0 ? '+' : '−') + fmt(Math.abs(net)) + ').', net >= 0 ? 'success' : 'info');
      au_(net > 0 ? 'coin' : 'page', { n: 4 });
    } else if (it.kind === 'ikn') { showToast('Ki Dorus mengirim ' + fmt(it.share) + ' gold atas namamu ke Restorasi IKN. "Laut mengambil, Garuda menerima. Dicatat."', 'info'); }
    if (typeof loadState === 'function') setTimeout(loadState, 400);
  });
  wrap_('applyFreshState_', function () {
    var s = st(); if (s) s._at = Date.now();
    if (currentPanel === 'balaikongsi' && !document.querySelector('#modalContent input:focus')) render();
  });
  // Rantai Lama: lapau & kedatangan
  wrap_('setModal_', function () {
    if (currentPanel !== 'tavern' || !st() || !state.city || state.city.CityId !== 'rantai_lama') return;
    var el = document.getElementById('rumorList'); if (!el || el.querySelector('.bk-rumor')) return;
    var d = document.createElement('div'); d.className = 'card rumor bk-rumor';
    d.innerHTML = ic('chat') + '<span>' + pickLine_(['Lentera di meja Ki Dorus tak pernah padam. Katanya ia menulis sampai pagi.', 'Kalau lonceng balai berdentang, ada kapal kongsi yang pulang membawa untung.', 'Ki Dorus tak pernah lupa satu nama pun. Itu yang membuat orang segan, dan sebagian takut.'], 'bkrum') + '</span>';
    el.insertBefore(d, el.firstChild);
  });

  return { st: st, on: function () { return !!st(); }, render: render, open: function () { openPanel('balaikongsi'); } };
})();
</script>
