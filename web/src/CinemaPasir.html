<script>

  function hs(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  /* ================= kertas & arang ================= */
  var paperCv = null, hatchCv = null;
  function paperTex() {
    if (paperCv) return paperCv;
    paperCv = document.createElement('canvas'); paperCv.width = paperCv.height = 256;
    var g = paperCv.getContext('2d'), d = g.createImageData(256, 256), r = U.rng(77);
    for (var i = 0; i < d.data.length; i += 4) {

    if (hatchCv) return hatchCv;

    var g = hatchCv.getContext('2d'); g.strokeStyle = 'rgba(40,32,24,.5)'; g.lineWidth = 0.8;

  // garis arang: dua lapis bergetar

  }

  /* ================= tokoh sederhana ================= */
  // o: { gown, coat, hair, kid, parasol, wave, helm, uniform, big, arm }
  function person(ctx, x, y, h, o, col) {
    o = o || {}; col = col || '#2b2620';
    var s = h / 100;
    ctx.save(); ctx.translate(x, y); ctx.scale(s * (o.flip ? -1 : 1), s);
    ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var bw = o.big ? 26 : 16;
    if (o.gown) { ctx.beginPath(); ctx.moveTo(-bw * 1.2, 0); ctx.quadraticCurveTo(-bw * 0.6, -40, -bw * 0.5, -64); ctx.lineTo(bw * 0.5, -64); ctx.quadraticCurveTo(bw * 0.6, -40, bw * 1.2, 0); ctx.closePath(); ctx.fill(); }

    }
    ctx.lineWidth = 5;
    if (o.wave) { ctx.beginPath(); ctx.moveTo(bw * 0.5, -62); ctx.lineTo(bw * 0.5 + 14, -86); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-bw * 0.5, -62); ctx.lineTo(-bw * 0.5 - 8, -36); ctx.stroke(); }
    else if (o.helm) { ctx.beginPath(); ctx.moveTo(bw * 0.5, -60); ctx.lineTo(bw * 0.5 + 14, -52); ctx.moveTo(-bw * 0.5, -60); ctx.lineTo(-bw * 0.5 + 2, -48); ctx.stroke(); }

  var SKETCH_SHIP = { hull: '#4f4942', trim: '#8a8278', sail: '#ebe4d4', flag: '#3a3530', emblemColor: '#ebe4d4', pennant: '#6a645c', kd: null };

  var JANJI_PUTIH = { hull: '#efe9dc', trim: '#b9b1a0', sail: '#f8f5ee', flag: '#f8f5ee', emblemColor: '#b9b1a0', pennant: '#f8f5ee', masts: 2, ports: 3, kd: null };
  function shipOpts(vis, extra) {
    var o = {};
    try { o = MTShip.fromVisual(vis || {}); } catch (e) { o = {}; }
    for (var k in (extra || {})) o[k] = extra[k];
    return o;
  }
  function ship(ctx, x, y, s, o) { try { MTShip.draw(ctx, x, y, s, o); } catch (e) { } }

  /* ================= SKETSA (kartu kisah) =================

  function water(ctx, y, a) { line(ctx, [[0, y], [60, y + 2], [140, y - 1], [220, y + 2], [300, y]], 1.6, a || 0.6, y * 3); for (var i = 0; i < 6; i++) line(ctx, [[20 + i * 48, y + 12 + (i % 2) * 6], [44 + i * 48, y + 12 + (i % 2) * 6]], 1, 0.35, i * 11 + y); }
  function myShip(ctx, x, y, s, o, dir) { ship(ctx, x, y, s, shipOpts(o.vis, Object.assign({}, SKETCH_SHIP, { dir: dir || -1, t: o.t || 0 }))); }

  }
  var SK = {
    gaul: function (ctx, o) {

      line(ctx, [[14, 70], [85, 44], [156, 70]], 2, 0.9, 12);
      ctx.save(); ctx.font = 'bold 18px "Pirata One", Georgia, serif'; ctx.fillStyle = 'rgba(38,31,24,.9)'; ctx.textAlign = 'center'; ctx.fillText('Gaul-Wash', 85, 66); ctx.restore();
      line(ctx, [[34, 100], [70, 100], [70, 146]], 1.4, 0.6, 13); hatch(ctx, 0.0);

    gap: function (ctx, o) {

      ctx.save(); ctx.translate(96, 150); ctx.rotate(0.38); ship(ctx, 0, 0, 0.6, Object.assign({}, SKETCH_SHIP, { hull: '#2a2622', sail: '#9a948a', dir: 1, damage: 0.8 })); ctx.restore();

      line(ctx, [[60, 112], [72, 92], [84, 108], [94, 84], [104, 110]], 1.8, 0.8, 21);

      for (var k = 0; k < 3; k++) blot(ctx, 196 - k * 12, 130 - k * 4, 8, 6, 0.15);
    },
    toogood: function (ctx, o) {
      water(ctx, 156);
      for (var c = 0; c < 4; c++) { var cx = 40 + c * 34; line(ctx, [[cx, 150], [cx, 70 + c * 6], [cx + 12, 70 + c * 6], [cx + 12, 150]], 2, 0.85, 31 + c); }
      for (var s2 = 0; s2 < 9; s2++) blot(ctx, 60 + s2 * 14, 40 - s2 * 2, 16, 7, 0.06);
      for (var r = 0; r < 7; r++) line(ctx, [[150, 30], [150 + Math.cos(r * 0.45 - 1.4) * 60, 30 + Math.sin(r * 0.45 - 1.4) * 60 + 60]], 0.9, 0.35, 41 + r);
      person(ctx, 200, 152, 52, { big: true, wave: true });
      myShip(ctx, 262, 160, 0.42, o);
    },
    marlya: function (ctx, o) {
      water(ctx, 160);
      person(ctx, 150, 150, 62, { gown: true, wave: true });
      line(ctx, [[100, 132], [112, 128], [122, 134]], 2.4, 0.9, 51); line(ctx, [[178, 134], [188, 128], [200, 132]], 2.4, 0.9, 52);
      for (var g = 0; g < 10; g++) line(ctx, [[150, 72], [150 + Math.cos(g * 0.63) * 46, 72 + Math.sin(g * 0.63) * 46]], 0.8, 0.3, 53 + g);
      myShip(ctx, 256, 166, 0.42, o);
    },
    pusaran: function (ctx, o) {
      for (var k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(150, 140, 120 - k * 22, 40 - k * 7, 0, 0.3 + k, 5.6 + k); ctx.strokeStyle = 'rgba(38,31,24,.5)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      ctx.save(); ctx.translate(150, 132); ctx.rotate(-0.42); ship(ctx, 0, 0, 0.66, Object.assign({}, SKETCH_SHIP, { hull: '#d8d2c4', sail: '#f2ece0', dir: 1, damage: 0.6 })); ctx.restore();
      ship(ctx, 66, 142, 0.5, Object.assign({}, SKETCH_SHIP, { hull: '#1e1b18', sail: '#5a554e', dir: 1 }));
      myShip(ctx, 250, 150, 0.46, o);
      ctx.save(); ctx.font = 'italic 10px Georgia, serif'; ctx.fillStyle = 'rgba(38,31,24,.8)'; ctx.fillText('Absolute Justice', 26, 40); ctx.restore();
    },
    jabat: function (ctx, o) {
      water(ctx, 166);
      line(ctx, [[96, 150], [150, 126], [204, 150], [150, 168], [96, 150]], 2.2, 0.85, 61);
      line(ctx, [[110, 120], [138, 104], [150, 106]], 5, 0.9, 62); line(ctx, [[190, 120], [162, 104], [150, 106]], 5, 0.9, 63);
      for (var g = 0; g < 12; g++) line(ctx, [[150, 104], [150 + Math.cos(g * 0.52) * 38, 104 + Math.sin(g * 0.52) * 30]], 0.8, 0.3, 64 + g);
      myShip(ctx, 256, 170, 0.4, o);

        for (var f = 0; f < 4; f++) { line(ctx, [[30 + f * 70, 150], [30 + f * 70, 110]], 1.2, 0.8, 80 + f); ctx.save(); ctx.fillStyle = '#f4f6f8'; ctx.fillRect(30 + f * 70, 110, 22, 13); ctx.strokeStyle = 'rgba(38,31,24,.7)'; ctx.strokeRect(30 + f * 70, 110, 22, 13); ctx.restore(); }
      } else {

    },
    // Tide v41 Batch 3: simpul baru di Papan Benang
    badai2: function (ctx, o) {
      SK.badai(ctx, o);

    tanya: function (ctx, o) {

      for (var b = 0; b < 6; b++) line(ctx, [[30 + b * 22, 156], [30 + b * 22, 100 - (b % 3) * 18]], 2, 0.75, 141 + b);
      line(ctx, [[180, 156], [190, 50], [204, 50], [214, 156]], 2.2, 0.85, 150);
      for (var l = 0; l < 4; l++) line(ctx, [[198, 46], [300, 30 + l * 22]], 0.8, 0.4, 151 + l);
      ctx.save(); ctx.font = 'bold 64px Georgia, serif'; ctx.fillStyle = 'rgba(120,26,18,.7)'; ctx.textAlign = 'center'; ctx.fillText('?', 112, 70); ctx.restore();
    },
    laut: function (ctx, o) {

      ship(ctx, 96, 152, 0.62, Object.assign({}, SKETCH_SHIP, { hull: '#1e1b18', sail: '#5a554e', dir: 1 }));

  // Satu kartu sketsa. o.burn 0..1 (terbakar dari kiri), o.cold 0..1 (membeku biru baja), o.sepia, o.alpha, o.pin
  function sketch(ctx, kind, x, y, w, h, o) {
    o = o || {};
    var f = SK[kind]; if (!f) return;
    ctx.save();
    ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;

    var burnX = (o.burn || 0) * (w + 30) - 15;
    ctx.beginPath();
    if (o.burn) {
      ctx.moveTo(burnX, 0);
      for (var yy = 0; yy <= h; yy += h / 12) ctx.lineTo(burnX + (hs(yy * 0.37 + 3) - 0.5) * 28, yy);
      ctx.lineTo(w, h); ctx.lineTo(w, 0); ctx.closePath();
    } else ctx.rect(0, 0, w, h);
    ctx.fillStyle = '#efe6d2'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.clip();
    paper(ctx, 0, 0, w, h, o.sepia ? 'rgba(150,100,40,.28)' : null);
    ctx.save(); ctx.scale(w / 300, h / 200); f(ctx, o); ctx.restore();
