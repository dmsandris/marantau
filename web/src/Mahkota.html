        sis.textContent = 'Nenek Ulin memejamkan mata. Tunggu ' + sisa + ' detik.'; b.disabled = true; inp.disabled = true; sisa--;

  /* =====================================================================
   * Sinematik
   * ===================================================================== */
  function cine(kind, slides, cb, data) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    close();
    var ov = document.createElement('div'); ov.className = 'qt-cine cb-cine';
    ov.innerHTML = '<canvas></canvas><button class="cb-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button>' +
      '<div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind, data ? { data: data } : undefined) || stop; } catch (e) { console.warn('[MK] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), b = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.cb-skip');
    function show() { txt.classList.remove('in'); void txt.offsetWidth; txt.innerHTML = slides[i]; txt.classList.add('in'); b.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai'; }
    function finish() {
      if (finished) return; finished = true;
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);
      if (cb) setTimeout(cb, 60);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } }
    document.addEventListener('keydown', onKey);
    b.onclick = function () { au('page'); if (++i < slides.length) show(); else finish(); };
    skip.onclick = function () { finish(); };
    setTimeout(function () { skip.classList.add('on'); }, 1500);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    setTimeout(function () { if (!finished) show(); }, 900);
  }

          { q: '<i>Kuli itu memandangi palkanya sendiri, bukan ke arahmu.</i> "Kapten mau tanya-tanya? Tanya saja ke kantor biru. Mereka suka ditanya."',
            opts: [
              { t: 'Lempar sekeping gold ke meja.', ok: false, r: '<i>Ia mendorong koin itu kembali.</i> "Saya bukan pengemis, Kapten."' },
              { t: '"Saya juga pernah memikul karung. Dulu sekali."', ok: true, r: '<i>Ia menoleh untuk pertama kalinya.</i> "...Hm. Punggung Kapten memang bungkuk sedikit."' },
              { t: '"Kalau tidak bicara, saya laporkan ke kantor biru."', ok: false, r: '<i>Rahangnya mengeras.</i> "Silakan. Saya sudah biasa dilaporkan."' }] },
          { q: '"Semua orang di gang ini punya dua cerita. Yang dijual, dan yang disimpan."',
            opts: [
              { t: 'Pesankan dia arak hangat, lalu diam.', ok: true, r: '<i>Ia memegang cangkir dengan dua tangan.</i> "Sudah lama tidak ada yang menunggu saya selesai minum."' },
              { t: '"Berapa untuk yang disimpan?"', ok: false, r: '<i>Ia tertawa pendek.</i> "Nah. Kapten juga sama dengan mereka."' },
              { t: '"Simpan saja, saya cari orang lain."', ok: false, r: '"Silakan, Kapten. Gang ini panjang."' }] },
          { q: '"Muatan tanpa cap itu... kalau saya sebut namanya, besok saya tidak dapat kerja di dermaga mana pun."',
            opts: [
              { t: '"Sebut tempatnya saja. Namanya biar saya cari sendiri."', ok: true, r: '<i>Ia mengangguk pelan.</i> "Itu baru bisa." ' },
              { t: '"Nama. Sekarang."', ok: false, r: '<i>Ia menggeleng dan menatap pintu.</i>' },
              { t: '"Saya lindungi kau dari kantor biru."', ok: false, r: '"Dengan apa, Kapten? Kapal Kapten pun kena cukai."' }] }
        ] } },
      a: [{ narr: 'Hadiah Q15', icon: 'coin', t: '<p>Hasiolan menyelipkan sekantung keping ke tanganmu. "Ini dari zafachmie. Katanya untuk ongkos, bukan untuk bayaran."</p>' },
        '"Rantai itu dibayar orang, Kapten, bukan tumbuh sendiri. Dan semua nama yang kalah bayar pernah lewat satu meja." <i>Ia menenggak sisa araknya.</i>',
        '"Ruang VIP di Paradiso. Cari Bang Rimba &mdash; tapi jangan siang-siang; mejanya baru hidup kalau lampu sudah menyala."'],
      next: 'Ruang VIP, Paradiso, saat lampu dinyalakan.' },

    /* 8 */ { at: 'tavern', c: 'paradiso', t: 'malam', main: 'rimba', icon: 'dice', title: 'Ruang VIP',
      wait: '"Ruang VIP baru buka kalau lampunya dinyalakan, Kapten."',
      p: [{ narr: 'Ruang VIP &middot; Paradiso, malam', icon: 'dice', t: '<p>Meja dadu beludru hijau, asap cerutu, dan seorang pria yang tidak pernah melihat dadunya sendiri saat dilempar.</p>' },
        '"Jaring itu tidak bisa ditembus dengan kapal dagang, Kapten. Ia cuma bisa <b>didahului</b>. Kapal yang lari lurus, bukan kapal yang berlayar jauh."',
        '"Kapal begitu cuma ada di satu tempat: <b>Zentul</b>. Dan pembalapnya, Barisan Pacu, menurut adat hanya ikut <b>juara Turnamen Obor</b>."',
        '"Juara bertahannya namanya <b>cangcimen</b>. Sekarang lambungnya dibayar uang Kumis Hitam." <i>Ia menyorongkan tiga dadu.</i> "Dadu dulu, baru peta. Besar atau kecil?"'],
      b: btn('go', 'dice', 'Duduk di meja Bang Rimba'),
      g: { kind: 'dadu', opts: { title: 'Meja Dadu Bang Rimba', sub: 'Ruang VIP &middot; Paradiso', main: 'rimba',
        intro: 'Tiga dadu di bawah batok kelapa. "Besar sebelas ke atas, kecil sepuluh ke bawah. Taruhannya bukan gold, Kapten &mdash; taruhannya kesabaran saya."',
        winLine: '"Hah! Menang dari saya di meja saya sendiri."<br><i>Ia menyuruh pelayan mengangkat tiga kaleng Oli Hitam ke kapalmu.</i> "Bekal berangkat. Di Zentul, ini lebih berharga dari gold."',
        loseLine: '"Kalah. Bagus, saya suka orang yang kalah dengan tenang." <i>Ia tetap menyorongkan peta.</i>' } },
      a: ['"Jadilah juara, Kapten. Barisan Pacu akan ikut kau menembus rantai itu." <i>Ia meletakkan segenggam sobekan kertas di meja.</i> "Petanya disobek supaya tak pernah utuh di satu tangan. Susun sendiri."'],
      next: 'Susun sobekan peta itu, di meja yang sama.' },

    /* 9 */ { at: 'tavern', c: 'paradiso', main: 'rimba', icon: 'map', title: 'Peta yang Disobek',
      p: [{ narr: 'Sobekan di atas beludru hijau', icon: 'map', t: '<p>Empat sobekan kertas berminyak. Di baliknya ada satu kalimat yang terputus-putus.</p>' }],
      b: btn('go', 'map', 'Susun peta'),
      g: { kind: 'tercecer', opts: { title: 'Surat Tercecer &middot; Rute Zentul', sub: 'Ruang VIP &middot; Paradiso', kicker: 'Susun kalimat di balik peta',

        salah: 'Kalimatnya belum nyambung. Baca ujung tiap sobekan, lalu susun ulang.',

      a: [{ narr: 'Zentul', icon: 'map', t: '<p>Keempat sobekan menyatu. Di tepi kabut "Belum Dipetakan", sebuah atol kecil kini punya nama.</p><p class="muted small">Zentul muncul di peta Set Sail.</p>' },

        '"Angkat sauh sekarang. Namanya sudah ada di petamu &mdash; <b>Zentul</b>, di balik kabut sebelah timur laut. Pilih saja dari layar berlayar."'],
      next: 'Berlayar ke Zentul.' },

    /* 10 */ { at: 'laut', tuju: 'zentul', main: 'lapau', icon: 'wind', title: 'Kabut Berbau Oli',
      p: [{ narr: 'Di tepi kabut', icon: 'wind', t: '<p>Kabut berubah pekat dan berbau oli terbakar. Arus asap menyeret haluan ke segala arah sekaligus; di suatu tempat di depan sana ada bunyi mesin.</p>' }],
      b: btn('go', 'wind', 'Baca arus asap'),

      a: [{ narr: 'Celah di kabut', icon: 'wind', t: '<p>Asap membuka satu jalur sempit yang baunya paling tajam. Kau kunci haluan ke sana dan membiarkan angin menarik kapalmu masuk.</p>' }],

    /* 11 */ { at: 'tavern', c: 'zentul', main: 'rayan', icon: 'cup', title: 'Lapau Oli',
      tibaCine: { kind: 'mk_zentul', slides: [

        'Lalu sesuatu melesat lurus di selat: satu perahu, satu garis api di air, dan bunyi "trek-trek-trek" yang menjauh dalam dua detik.'] },
      tibaScene: [{ narr: 'Zentul', icon: 'anchor', t: '<p>Kapalmu merapat di antara derek-derek kayu. Seseorang di atap garasi menatap kapalmu sebentar, lalu meludah ke samping dan masuk lagi.</p>' },
        '"Pendatang. Kalau mau balapan, daftarnya di <b>Lapau Oli</b>. Kalau cuma mau lihat-lihat, jangan berdiri di tengah selat."'],
      p: [{ narr: 'Lapau Oli &middot; Zentul', icon: 'cup', t: '<p>Gelas-gelas kopi berjejer di atas kaleng oli bekas. Di dinding, papan bagan turnamen dari kayu, penuh cap jempol berminyak.</p>' },
        '"Rayan Bazzy. Saya yang mencatat, saya juga yang menagih kopi." <i>Ia membuka buku turnamen yang halamannya lengket.</i>',
        '"Turunan Obor tahun ini: babak pertama lawan <b>Pariopelan</b>, semifinal lawan <b>KapalMber</b>, final lawan juara bertahan <b>cangcimen</b>."',

      b: btn('go', 'flag', 'Daftar Turnamen Obor'),
      a: [{ narr: 'Papan bagan', icon: 'flag', t: '<p>Rayan Bazzy menekan cap jempol berminyak di sebelah namamu.</p>' },
        '"Sudah. Besok lusa tidak ada di Zentul, Kapten &mdash; yang ada cuma \'sekarang\'. Turun saja ke Sirkuit kalau sudah siap."'],
      next: 'Sirkuit Selat Lurus, Zentul.' },

    /* 12 */ { at: 'sirkuit', c: 'zentul', main: 'rayan', icon: 'flag', title: 'Babak Pertama',
      p: [{ narr: 'Sirkuit Selat Lurus &middot; babak pertama', icon: 'flag', t: '<p>Dua lajur air, tiga obor di garis start, dan satu meriam kecil yang sudah diisi. Pariopelan mengikat ikat kepalanya sambil menguap.</p>' },
        { n: 'pario', t: '"Kapal dagang? Di selat ini?" <i>Ia melihat lambungmu, lalu ke mesinmu, lalu tertawa.</i> "Tidak apa-apa. Semua orang mulai dari kalah."' },
        '"Aturannya satu: ketuk saat meriam berbunyi, naikkan gigi empat kali, tahan di gigi lima. Sisanya urusan mesin."'],
      b: btn('go', 'flag', 'Turun ke garis start: Babak 1'),
      a: [{ narr: 'Setelah garis finis', icon: 'flag', t: '<p>Pariopelan menepuk lambungmu dua kali, cara orang Zentul bilang "lumayan". Rayan Bazzy mencoret sesuatu di papan bagan.</p>' },

        '"Naik ke garasi di ujung dermaga. Yaptob yang pegang mesin di sini. Bilang saya yang suruh."'],

    /* 13 */ { at: 'garasi', c: 'zentul', main: 'yaptob', icon: 'wrench', title: 'Garasi Yaptob',

        '"Aku sudah pensiun mengurus kapal orang asing." <i>Ia tidak keluar dari bawah lambung.</i> "Cari tukang di dermaga. Mereka murah."',
        { narr: 'Kau menyebut nama lawan finalmu', icon: 'wrench', t: '<p>Satu kata saja: <b>cangcimen</b>.</p><p>Suara kunci pas berhenti. Untuk beberapa saat tidak ada bunyi apa pun di garasi itu.</p>' },

      b: btn('go', 'wrench', 'Minta Yaptob mengencangkan kapal'),
      a: [{ narr: 'Daftar bersketsa', icon: 'scroll', t: '<p>Ia menulis di sobekan kertas amplas: lima suku cadang, masing-masing dengan sketsa kecil yang lebih jelas daripada namanya.</p>' },
        '"Jangan beli yang baru. Yang baru itu lembek. Cari di <b>Pasar Rongsok</b>, di bangkai perahu yang sudah mati tapi mesinnya mati belakangan."'],
      next: 'Pasar Rongsok, Zentul.' },

    /* 14 */ { at: 'market', c: 'zentul', main: 'rongsok', icon: 'crate', title: 'Pasar Rongsok',
      p: [{ narr: 'Pasar Rongsok &middot; Zentul', icon: 'crate', t: '<p>Bukan pasar: tumpukan. Lambung di atas lambung, mesin di atas mesin, dan satu perempuan bercaping yang hafal letak semuanya.</p>' },
        '"Daftar dari Yaptob? Bagus. Orang tua itu tidak pernah salah tulis, tapi tulisannya memang tidak bisa dibaca." <i>Ia menunjuk sketsanya.</i> "Cocokkan sendiri dengan yang ada di rak."'],
      b: btn('go', 'crate', 'Cari suku cadang Yaptob'),
      g: { kind: 'manifest', opts: { kicker: 'Pasar Rongsok &middot; Zentul', title: 'Cocokkan Sketsa &middot; Lima Suku Cadang', ledgerTitle: 'Daftar Sketsa Yaptob',
        intro: 'Bandingkan <b>jumlah</b>, <b>cap</b>, dan <b>berat</b> di tiap sketsa dengan label di rak rongsok. Pakai <b>lup</b> kalau tulisannya kecil.',
        cardTitle: 'Lima suku cadang', cardQuote: '"Yang bengkok malah lebih kuat, Kapten. Sudah teruji patah."' } },

      next: 'Garasi Yaptob, Zentul.' },

    /* 15 */ { at: 'garasi', c: 'zentul', main: 'yaptob', icon: 'hammer', title: 'Katup Jolt',

        '"Yang terakhir harus kau tempa sendiri. <b>Katup</b>. Dia yang menahan tekanan waktu kau tahan jari di gigi lima."',
        '"Panaskan sampai kuning jerami, jangan putih. Pukul di zona hijau. Celup sekali, tepat waktu. Kalau katupnya bagus, mesinmu tahan panas lebih lama."'],
      b: btn('go', 'hammer', 'Tempa katup bersama Yaptob'),
      g: { kind: 'tempa', opts: { kicker: 'Garasi Yaptob &middot; Zentul', title: 'Tempa Katup Jolt',

      a: [{ narr: 'Mesin Jolt Tahap 1', icon: 'wrench', t: '<p>Katupnya dipasang terakhir. Yaptob menutup penutup mesin dengan satu tendangan pelan, lalu menyeka tangan.</p>' },

      next: 'Sirkuit Selat Lurus: babak pertama diulang, kali ini dengan Mesin Jolt.' },

    /* 16 */ { at: 'sirkuit', c: 'zentul', main: 'pario', icon: 'flag', title: 'Babak Pertama, Lagi', win: true,

        '"Jadi orang tua itu akhirnya keluar dari bawah lambung." <i>Ia meludah ke samping.</i> "Baik. Sekarang baru balapan."'],

    /* 19 */ { at: 'ship', c: 'skitraw', main: 'gaul', icon: 'moon', title: 'Pola Rantai',

        '"Uda Gala sedang di laut, jadi aku pakai mejanya." <i>Ia menatap gambarnya sendiri.</i> "Dulu aku percaya pada kedamaian yang dipaksakan. Sekarang aku tahu itu cuma penjara yang rapi."',
        '"Kedipan rantai itu punya pola. Baca sendiri &mdash; aku tidak mau jadi satu-satunya orang yang tahu."'],

    /* 20 */ { at: 'tasks', c: 'bjorneo', main: 'ulin', icon: 'star', title: 'Batu yang Bukan untuk Rumah', teka: true, oleh: 10,
      p: [{ narr: 'Mercusuar Bjorneo', icon: 'star', t: '<p>Seratus tiga anak tangga. Di atas, seorang nenek duduk menghadap laut, memunggungi lampunya sendiri.</p>' },
        '"Rantai biru itu? Tiap malam saya lihat dia berkedip, Nak. Dan tiap beberapa tarikan, dia <b>pejam</b>."',
        '<i>Ia akhirnya menoleh, matanya menyipit.</i> "Tapi kenapa engkau sering berkunjung, tapi tidak pernah membawakan apa pun untuk aku? Sungguh keterlaluan, anak muda zaman sekarang."',
        '"Kalau mau tanya-tanya, bawakan <b>10 Sutra</b> buat oleh-oleh nenek ini. Kalau nenek senang, nenek cerita &mdash; setelah kau menjawab satu teka-teki." <span class="muted small">(Sutra dijual di Pasar Sunda Empire.)</span>'],
      pSudah: ['"Sutranya sudah nenek simpan, Nak. Halus." <i>Ia tersenyum, matanya kembali ke laut.</i> "Sebelum saya cerita, jawab dulu."'],
      b: btn('go', 'star', 'Tanya Nenek Ulin soal rantai biru'),
      bOleh: btn('go', 'crate', 'Serahkan 10 Sutra'),
      olehSenang: '<i>Ia meraba lipatan sutra itu, lalu tertawa kecil.</i> "Nah, begitu dong. Anak muda yang tahu adat."<br>"Baiklah, nenek senang. Sebelum saya cerita, jawab dulu."',
      a: [{ narr: 'Jawaban Nenek Ulin', icon: 'star', t: '<p>Ia tertawa kecil, puas.</p>' },
        '"Betul. Rantai itu tidak bernapas, Nak. Ia minum dari <b>batu baterai</b>. Setiap kali batunya diisi ulang, rantainya buta dua detik."',
        '"Dan batu sebesar itu cuma dibuat di satu tempat: <b>kota kaca yang dulu diam</b>." <i>Ia akhirnya menoleh.</i> "Kalau kau mau lewat, lewatlah saat dia pejam. Jangan saat dia melihat."',
        '"Caranya begini, Kapten: berlayarlah ke pulau yang bertanda <b>CUKAI</b> di petamu. Patroli pasti mencegatmu di jalan &mdash; jangan bayar, jangan berunding. Pilih <b>Tembus Jaring</b>, dan kalahkan mereka di air."'],

      b: btn('go', 'alert', 'Hadapi Kumis Hitam'),
