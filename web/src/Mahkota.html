<style>
  /* ================= Saga 4 "Monopoli & Mahkota" — kartu quest (modul MK) ================= */
  .mk-wrap { display: grid; gap: 10px; margin: 6px 0 12px; }
  .mk-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font: 700 11px Georgia, serif;
    letter-spacing: .1em; text-transform: uppercase; background: rgba(36,71,122,.14); color: #17335e; border: 1px solid rgba(36,71,122,.45); }
  .mk-badge svg { width: 13px; height: 13px; }
  .mk-art { display: block; width: 100%; max-width: 420px; height: auto; margin: 4px auto 0; border-radius: 12px; }
  .mk-reward { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(201,164,80,.16); border: 1px solid rgba(150,110,40,.35); color: #3f2a14; }

  /* kartu saksi / pilihan dialog / sobekan peta / dadu */

    background: rgba(255,255,255,.5); border: 1px solid rgba(120,90,50,.38); color: #3a2a18; transition: transform .12s, background .2s; }
  .mk-opts button:hover { background: rgba(255,255,255,.78); } .mk-opts button:active { transform: scale(.99); }
  .mk-opts button[disabled] { opacity: .55; cursor: default; }
  .mk-saksi { display: grid; gap: 10px; margin-top: 8px; }
  .mk-s { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.45); border: 1px solid rgba(120,90,50,.3); }
  .mk-s .f { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; border: 1px solid rgba(90,60,30,.4); }
  .mk-s .f svg { width: 100%; height: 100%; display: block; }
  .mk-s .nm { font: 700 14px Georgia, serif; color: #3a2a18; } .mk-s .nm small { font-weight: 400; color: #7a6244; }
  .mk-s .kt { font-style: italic; margin: 4px 0 6px; color: #4a3826; line-height: 1.45; }
  .mk-fakta { margin-top: 8px; padding: 9px 12px; border-radius: 10px; background: rgba(36,71,122,.1); border: 1px dashed rgba(36,71,122,.45); color: #17335e; font-size: .94em; }
  .mk-sob { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .mk-sob button { position: relative; min-height: 86px; padding: 10px 12px 22px; border-radius: 8px; text-align: left; cursor: pointer; line-height: 1.35;
    font: italic 400 14px Georgia, serif; color: #4a3826; background: #efe3c6; border: 1px solid rgba(120,90,50,.45);
    clip-path: polygon(0 3%, 97% 0, 100% 94%, 4% 100%); }
  .mk-sob button.on { background: #d9c89b; color: #2f2416; }
  .mk-sob button b { position: absolute; left: 10px; bottom: 5px; font: 700 11px Georgia, serif; letter-spacing: .1em; color: #8a6a3c; }
  .mk-sob button.on b { color: #3a2a18; }
  .mk-dadu { display: flex; gap: 12px; justify-content: center; margin: 10px 0 4px; }
  .mk-dadu i { width: 46px; height: 46px; border-radius: 10px; background: #f3ead4; border: 1px solid rgba(90,60,30,.45); display: grid; place-items: center;
    font: 700 24px Georgia, serif; color: #3a2a18; font-style: normal; box-shadow: 0 2px 0 rgba(90,60,30,.25); }
  @media (prefers-reduced-motion: no-preference) { .mk-dadu i.roll { animation: mkRoll .5s ease-in-out infinite; } }
  @keyframes mkRoll { 50% { transform: translateY(-7px) rotate(-8deg); } }
  .mk-teka { margin-top: 10px; display: grid; gap: 8px; }
  .mk-teka input { width: 100%; padding: 11px 13px; border-radius: 12px; font: 400 16px Georgia, serif; color: #3a2a18;
    background: rgba(255,255,255,.72); border: 1px solid rgba(120,90,50,.45); }
  .mk-teka input:focus { outline: none; border-color: #b98a2e; box-shadow: 0 0 0 3px rgba(185,138,46,.18); }
  .mk-teka .sisa { font: 400 13px Georgia, serif; color: #8a6a3c; }
  @media (max-width: 480px) { .mk-sob { grid-template-columns: 1fr; } }
</style>
<script>
/* =====================================================================
 * Saga 4 "Monopoli & Mahkota" — langkah 1-15 (Q15 Stempel Biru, Q16 Turnamen Obor).
 * Konsep: claude/KONSEP-Saga4-Monopoli-dan-Mahkota.md v5.1. Server: 0075-mahkota.sql (api_mahkota).
 *
 * Satu langkah aktif pada satu waktu; server menolak tombol milik langkah lain.
 * Kartu muncul di panel yang sesuai (lapau, papan tugas, dok, pasar) atau lewat bangunan Zentul
 * (Sirkuit & Garasi memanggil MTMahkota). Mini game lama dipakai ulang lewat MTGames1-8;
 * empat permainan kecil khusus saga ini (Tanya Warga, Tawar Kuli, Dadu, Surat Tercecer) ada di bawah.
 * ===================================================================== */
var MK = (function () {
  if (!window.MTFace || typeof wrap_ !== 'function' || typeof panelHeader_ !== 'function') return {};

  /* ---------- pembantu ---------- */
  function st() { return (state && state.mahkota) || null; }
  function step() { var s = st(); return s ? (s.step || 0) : -1; }      // langkah yang sudah selesai
  function aktif() { return !!st(); }
  function def() { var s = st(); return (s && s.d) || null; }
  function cid() { try { return state && state.city ? state.city.CityId : ''; } catch (e) { return ''; } }
  function cityNm(id) { try { var c = (state.cities || []).filter(function (x) { return x.CityId === id; })[0]; return c ? c.Name : null; } catch (e) { return null; } }
  function docked() { return !(state && state.voyage && state.voyage.inTransit); }
  function night() { var f = typeof dayFrac_ === 'function' ? dayFrac_() : 0.4; return f >= 0.72 || f < 0.04; }
  function esc(s) { return esc_(String(s == null ? '' : s)); }
  var E = esc;
  function fmt(n) { return typeof formatGold === 'function' ? formatGold(n) : String(n); }
  function au(k) { try { au_(k); } catch (e) { } }
  var gameOpen = false, tibaShown = 0;

  function apOf(seed, role, fem, over) { var a = MTFace.npc(seed, role, fem); for (var k in (over || {})) a[k] = over[k]; return a; }
  function face(n) { return n.svg || MTFace.svg(n.ap, { bgColors: n.bg || ['#2a3c5a', '#101822'], medals: n.medals }); }
  var NN = null;
  function N() {
    if (NN) return NN;
    NN = {
      hitam: { name: 'Kumis Hitam', title: 'Marshell MPA ke-7, Audit Pemerintah Dunia', bg: ['#1b345c', '#0a1220'], medals: 3,
        ap: apOf('kumis-hitam-marshell-7', 'syahbandar', 0, { age: 0.6, facial: 2, head: 'kapten', outfit: 'mantel', eyes: 1 }) },
      tulis: { name: 'Juru Tulis Audit', title: 'Pembaca dekret', ap: apOf('juru-tulis-audit-ikn', 'syahbandar', 0, { age: 0.4, head: 'none', outfit: 'mantel' }) },
      tedsky: { name: 'Jendral Tedsky', title: 'Di bawah sayap Garuda', bg: ['#4a3a1a', '#1a1408'], medals: 2,
        ap: apOf('jendral-tedsky', 'syahbandar', 0, { age: 0.72, facial: 1, head: 'kapten', outfit: 'mantel' }) },
      karto: { name: 'Pak Tua Karto', title: 'Peminum Kopi Pahit, Warung Pantai', bg: ['#7a5a3a', '#2a1a0e'],
        ap: { fem: 0, skin: 3, hair: 4, hairStyle: 5, facial: 2, head: 'arch', eyes: 0, seed: 1717, role: 'lapau', age: 0.95 } },
      hasiolan: { name: 'Hasiolan', title: 'Kemudi Black Pearl', bg: ['#3a4a5a', '#12181f'],
        ap: apOf('hasiolan-black-pearl', 'kapten', 0, { age: 0.5, head: 'ikat', facial: 1 }) },
      kuli: { name: 'Kuli Dermaga', title: "Black's Alley, TooGood", bg: ['#4a3a2a', '#1a120a'],
        ap: apOf('kuli-blacks-alley-toogood', 'gudang', 0, { age: 0.45, head: 'ikat', outfit: 'rompi' }) },
      rimba: { name: 'Bang Rimba', title: 'Ruang VIP, Paradiso', bg: ['#5a3a4a', '#18101a'],
        ap: apOf('bang-rimba-paradiso-vip', 'saudagar', 0, { age: 0.55, facial: 2, head: 'none', outfit: 'mantel' }) },
      rayan: { name: 'Rayan Bazzy', title: 'Penjaga Lapau Oli &middot; pencatat Turnamen Obor', bg: ['#6a4a2a', '#1e1208'],
        ap: apOf('rayan-bazzy-lapau-oli-zentul', 'lapau', 0, { age: 0.42, head: 'ikat', outfit: 'rompi', facial: 1 }) },
      yaptob: { name: 'Yaptob', title: 'Legenda Selat Lurus &middot; nakhoda YusaintJolt', bg: ['#7a4a1a', '#1a0e06'], medals: 1,
        ap: apOf('yaptob-garasi-zentul-yusaintjolt', 'tukang', 0, { age: 0.78, facial: 2, head: 'ikat', outfit: 'apron' }) },
      pario: { name: 'Pariopelan', title: 'Pembalap Selat Lurus', bg: ['#4a5a3a', '#121a0e'],
        ap: apOf('pariopelan-zentul-pembalap', 'kapten', 0, { age: 0.3, head: 'ikat' }) },
      marlya: { name: 'Ratu Marlya', title: 'Marie Regal', bg: ['#5a3a6a', '#160f1e'],
        ap: apOf('ratu-marlya-marie-regal', 'saudagar', 1, { age: 0.55, head: 'mahkota', outfit: 'kebaya' }) },
      cangcimen: { name: 'cangcimen', title: 'Juara bertahan Turnamen Obor', bg: ['#24477a', '#0c1420'],
        ap: apOf('cangcimen-juru-sita-zentul', 'kapten', 0, { age: 0.28, head: 'ikat', outfit: 'mantel' }) },
      ulin: { name: 'Nenek Ulin', title: 'Mercusuar Bjorneo', bg: ['#3a4a5a', '#101820'],
        ap: apOf('nenek-ulin-mercusuar-bjorneo', 'lapau', 1, { age: 0.96, hair: 4, head: 'none' }) },
      gaul: { name: 'Hasiolan', title: 'Galangan Gaul-Wash &middot; Skitraw', bg: ['#3a4a5a', '#12181f'],
        ap: apOf('hasiolan-black-pearl', 'kapten', 0, { age: 0.5, head: 'ikat', facial: 1 }) },
      rongsok: { name: 'Penjaga Pasar Rongsok', title: 'Zentul', bg: ['#5a4a3a', '#161008'],
        ap: apOf('penjaga-pasar-rongsok-zentul', 'gudang', 1, { age: 0.5, head: 'caping' }) }
    };
    return NN;
  }
  function who(k) {
    if (!k || k === 'lapau') { try { return npc_('lapau'); } catch (e) { return { name: 'Penjaga lapau', title: '', ap: MTFace.npc('x|lapau', 'lapau') }; } }
    return N()[k] || N().rayan;
  }

  function speech(n, text, extra, title) {
    return '<div class="qg-card"><div class="qg-face">' + face(n) + '</div><div class="qg-body"><div class="qg-name">' + esc(n.name) +
      ' <span>&middot; ' + (title || n.title || '') + '</span></div><div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function narr(kicker, text, extra, icon) {
    return '<div class="cb-narr"><div class="cn-k">' + ic(icon || 'scroll') + (kicker || '') + '</div>' + text + (extra || '') + '</div>';
  }
  function actions(b) { return '<div class="qg-actions">' + b + '</div>'; }
  function btn(id, icon, label, gold) {
    return '<button class="btn ' + (gold === false ? 'btn-ghost-ink' : 'btn-gold') + '" data-mk="' + id + '">' + (icon ? ic(icon) + '&nbsp; ' : '') + label + '</button>';
  }
  function dots(i, n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="' + (k === i ? 'on' : '') + '"></i>'; return '<div class="qt-dots">' + h + '</div>'; }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function insertTop(html) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    var old = c.querySelector('.mk-wrap'); if (old) old.remove();
    var anchor = c.querySelector('.ph');
    var wrap = document.createElement('div'); wrap.className = 'mk-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function showModal(html) {
    currentPanel = null; setModal_(html);
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-wide'); box.classList.add('size-mid'); box.scrollTop = 0; }
    document.getElementById('modalOverlay').classList.add('open');
  }
  function modalWrap(icon, title, sub) { showModal(panelHeader_(icon, title, sub)); return insertTop('<div></div>'); }
  function close() { try { closeModal(); } catch (e) { try { document.getElementById('modalOverlay').classList.remove('open'); } catch (e2) { } } }
  function badge(d) { return '<span class="mk-badge">' + ic('scroll') + 'Saga 4 &middot; langkah ' + (S.indexOf(d) + 1) + '</span>'; }

  // halaman bertahap: string (pembicara utama) | {n:kunci, t} | {narr, t, icon}
  function pages(w, mainKey, list, lastBtns, bind, d) {
    var i = 0;
    function show() {
      var last = i === list.length - 1, pg = list[i], txt = (pg && pg.t) || pg;
      var nav = actions(last ? (lastBtns || '') : btn('next', null, 'Lanjut')) + (list.length > 1 ? dots(i, list.length) : '');
      var head = i === 0 && d ? '<div style="margin-bottom:8px">' + badge(d) + '</div>' : '';
      w.innerHTML = head + (pg && pg.narr ? narr(pg.narr, txt, nav, pg.icon) : speech(who((pg && pg.n) || mainKey), txt, nav));
      au('page');
      if (!last) on(w, '[data-mk=next]', function () { i++; show(); }); else if (bind) bind(w);
    }
    show();
  }

  function call(args, ok, b) {
    if (b) b.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      r = r || {};
      if (r.mahkota !== undefined && state) state.mahkota = r.mahkota;
      if (r.newGold != null && typeof patchGold_ === 'function') { try { patchGold_(r.newGold); if (typeof renderSidebar === 'function') renderSidebar(); } catch (e) { } }
      if (typeof invalidatePanelCache_ === 'function') try { invalidatePanelCache_(); } catch (e) { }
      try { ok(r); } catch (e) { console.warn('[MK]', e); }
    }).withFailureHandler(function (e) {
      if (b) b.disabled = false;
      var m = (e && e.message) || String(e);
      showToast(m, 'error');
      if (/bergeser|Bersambung/.test(m)) refresh();
    }).api_mahkota.apply(null, args);
  }
  function refresh() {
    google.script.run.withSuccessHandler(function (r) { if (r && r.mahkota !== undefined && state) state.mahkota = r.mahkota; })
      .withFailureHandler(function () { }).api_mahkota('status');
  }

  /* ---------- mini game lama ---------- */
  function lib(kind) {
    if (kind === 'pantun' || kind === 'syahbandar') return window.MTGames;
    if (kind === 'angin') return window.MTGames2;
    if (kind === 'manifest') return window.MTGames5;
    if (kind === 'sandi') return window.MTGames3;
    if (kind === 'timbang' || kind === 'kas') return window.MTGames6;
    if (kind === 'pesta' || kind === 'jejak') return window.MTGames3;
    if (kind === 'susun') return window.MTGames5;
    if (kind === 'selam') return window.MTGames4;
    if (kind === 'tempa') return window.MTGames4;
    return null;
  }
  function game(kind, opts, cb) {
    if (LOKAL[kind]) { gameOpen = true; LOKAL[kind](opts || {}, function (res) { gameOpen = false; cb(res || { cancelled: true }); }); return; }
    var L = lib(kind);
    function fin(res) { gameOpen = false; try { cb(res || { cancelled: true }); } catch (e) { console.warn('[MK] game', e); } }
    if (L && typeof L.open === 'function') {
      gameOpen = true;
      try { L.open(kind, opts || {}, fin); return; } catch (e) { gameOpen = false; console.warn('[MK] game', e); }
    }
    fin({ win: true });   // mini game tidak termuat: cerita tetap bisa lanjut
  }

  /* =====================================================================
   * Empat permainan kecil khas Saga 4 (dinilai di klien; server hanya menerima 'ok'/'menang').
   * ===================================================================== */
  var LOKAL = {};

  /* 1. Tanya Warga — tiga saksi, satu berbohong */
  LOKAL.warga = function (o, cb) {
    var w = modalWrap(o.icon || 'users', o.title || 'Tanya Warga', o.sub || '');
    function render(salah) {
      var cards = o.saksi.map(function (s, i) {
        var n = { name: s.nama, title: s.peran, ap: apOf(s.seed || ('wg' + i), s.role || 'lapau', s.fem ? 1 : 0, s.over || {}), bg: ['#6a5238', '#1e1710'] };
        return '<div class="mk-s"><div class="f">' + face(n) + '</div><div><div class="nm">' + esc(s.nama) + ' <small>&middot; ' + esc(s.peran) + '</small></div>' +
          '<div class="kt">"' + s.kata + '"</div><button class="btn btn-ghost-ink" data-b="' + i + '">Dia yang berbohong</button></div></div>';
      }).join('');
      w.innerHTML = narr(o.kicker || 'Tiga saksi, satu berbohong', (salah ? '<p><b>Bukan dia.</b> ' + esc(salah) + '</p>' : '') + '<p>' + o.intro + '</p>' +
        '<div class="mk-fakta"><b>Yang sudah pasti:</b> ' + o.fakta + '</div><div class="mk-saksi">' + cards + '</div>',
        actions(btn('later', null, 'Nanti dulu', false)), o.icon || 'users');
      on(w, '[data-mk=later]', function () { close(); cb({ cancelled: true }); });
      w.querySelectorAll('[data-b]').forEach(function (b) {
        b.onclick = function () {
          var i = +b.getAttribute('data-b');
          if (i === o.bohong) { au('success'); close(); cb({ win: true }); return; }
          au('bad'); render(o.saksi[i].salah || 'Keterangannya cocok dengan yang kau tahu.');
        };
      });
    }
    render(null);
  };

  /* 2. Tawar Kuli — tiga putaran pilihan; dua benar sudah cukup */
  LOKAL.kuli = function (o, cb) {
    var w = modalWrap('cup', o.title || 'Tawar Kuli', o.sub || ''), i = 0, skor = 0;
    function ronde() {
      if (i >= o.ronde.length) {
        var menang = skor >= (o.lulus || 2);
        au(menang ? 'success' : 'bad');
        w.innerHTML = speech(who(o.main || 'kuli'), '<p>' + (menang ? o.winLine : o.loseLine) + '</p>',
          actions(btn('ok', null, menang ? 'Tutup' : 'Coba lagi', !menang)));
        on(w, '[data-mk=ok]', function () { if (menang) { close(); cb({ win: true }); } else { i = 0; skor = 0; ronde(); } });
        return;
      }
      var r = o.ronde[i];
      w.innerHTML = speech(who(o.main || 'kuli'), '<p>' + r.q + '</p>' +
        '<div class="mk-opts">' + r.opts.map(function (x, k) { return '<button data-o="' + k + '">' + x.t + '</button>'; }).join('') + '</div>') +
        dots(i, o.ronde.length);
      w.querySelectorAll('[data-o]').forEach(function (b) {
        b.onclick = function () {
          var x = r.opts[+b.getAttribute('data-o')];
          w.querySelectorAll('[data-o]').forEach(function (y) { y.disabled = true; });
          if (x.ok) skor++;
          au(x.ok ? 'coin' : 'page');
          w.innerHTML = speech(who(o.main || 'kuli'), '<p>' + x.r + '</p>', actions(btn('next', null, 'Lanjut'))) + dots(i, o.ronde.length);
          on(w, '[data-mk=next]', function () { i++; ronde(); });
        };
      });
    }
    ronde();
  };

  /* 3. Dadu — besar atau kecil, satu ronde */
  LOKAL.dadu = function (o, cb) {
    var w = modalWrap('dice', o.title || 'Meja Dadu', o.sub || '');
    function pilih() {
      w.innerHTML = speech(who(o.main || 'rimba'), '<p>' + o.intro + '</p>' +
        '<div class="mk-dadu"><i>?</i><i>?</i><i>?</i></div>',
        actions('<button class="btn btn-gold" data-p="besar">Besar (11&ndash;17)</button><button class="btn btn-gold" data-p="kecil">Kecil (4&ndash;10)</button>'));
      w.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { lempar(b.getAttribute('data-p')); }; });
    }
    function lempar(p) {
      var d = w.querySelectorAll('.mk-dadu i');
      d.forEach(function (x) { x.classList.add('roll'); x.textContent = '?'; });
      w.querySelectorAll('[data-p]').forEach(function (b) { b.disabled = true; });
      au('coin');
      setTimeout(function () {
        var v = [1, 2, 3].map(function () { return 1 + Math.floor(Math.random() * 6); }), tot = v[0] + v[1] + v[2];
        d.forEach(function (x, k) { x.classList.remove('roll'); x.textContent = v[k]; });
        var menang = (tot >= 11) === (p === 'besar');
        au(menang ? 'success' : 'bad');
        setTimeout(function () {
          w.innerHTML = speech(who(o.main || 'rimba'), '<p><b>' + v.join(' &middot; ') + ' = ' + tot + '.</b> ' + (menang ? o.winLine : o.loseLine) + '</p>' +
            '<div class="mk-dadu">' + v.map(function (x) { return '<i>' + x + '</i>'; }).join('') + '</div>',
            actions(btn('ok', null, 'Lanjut')));
          on(w, '[data-mk=ok]', function () { close(); cb({ win: true, menang: menang }); });
        }, 500);
      }, 900);
    }
    pilih();
  };

  /* 4. Surat Tercecer — susun sobekan sesuai urutan kalimat */
  LOKAL.tercecer = function (o, cb) {
    var w = modalWrap('map', o.title || 'Surat Tercecer', o.sub || ''), urut = [];
    var acak = o.sobek.map(function (x, i) { return { i: i, t: x }; });
    for (var k = acak.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), t = acak[k]; acak[k] = acak[j]; acak[j] = t; }
    function render(pesan) {
      w.innerHTML = narr(o.kicker || 'Sobekan peta', '<p>' + o.intro + '</p>' + (pesan ? '<p><b>' + esc(pesan) + '</b></p>' : '') +
        '<div class="mk-sob">' + acak.map(function (x, k) {
          var at = urut.indexOf(x.i);
          return '<button data-k="' + k + '" class="' + (at >= 0 ? 'on' : '') + '">' + x.t + '<b>' + (at >= 0 ? 'KE-' + (at + 1) : 'sobekan') + '</b></button>';
        }).join('') + '</div>',
        actions(btn('reset', null, 'Ulangi susunan', false) + btn('later', null, 'Nanti dulu', false)), 'map');
      on(w, '[data-mk=reset]', function () { urut = []; render(null); });
      on(w, '[data-mk=later]', function () { close(); cb({ cancelled: true }); });
      w.querySelectorAll('[data-k]').forEach(function (b) {
        b.onclick = function () {
          var x = acak[+b.getAttribute('data-k')];
          if (urut.indexOf(x.i) >= 0) return;
          urut.push(x.i); au('page');
          if (urut.length < acak.length) { render(null); return; }
          var benar = urut.every(function (v, n) { return v === n; });
          if (benar) { au('success'); close(); cb({ win: true }); return; }
          au('bad'); urut = []; render(o.salah || 'Kalimatnya belum nyambung. Baca lagi ujung tiap sobekan.');
        };
      });
    }
    render(null);
  };

  /* 5. Teka-teki Nenek Ulin — dinilai server, salah = tunggu 20 detik */
  function teka(i, w) {
    var sisa = 0, timer = null;
    function render(pesan) {
      w.innerHTML = speech(who('ulin'), '<p>' + (pesan || '"Batu.. Batu apa yang tidak bisa digunakan untuk membangun rumah?"') + '</p>' +
        '<div class="mk-teka"><input type="text" id="mkTeka" placeholder="Jawabanmu, Kapten" autocomplete="off" maxlength="40">' +
        '<div class="sisa"></div></div>', actions(btn('jawab', null, 'Jawab')));
      var inp = w.querySelector('#mkTeka'), sis = w.querySelector('.sisa'), b = w.querySelector('[data-mk=jawab]');
      function tick() {
        if (sisa <= 0) { sis.textContent = ''; b.disabled = false; inp.disabled = false; if (timer) { clearInterval(timer); timer = null; } return; }
        sis.textContent = 'Nenek Ulin memejamkan mata. Tunggu ' + sisa + ' detik.'; b.disabled = true; inp.disabled = true; sisa--;
      }
      if (sisa > 0) { tick(); timer = setInterval(tick, 1000); } else { try { inp.focus(); } catch (e) { } }
      function kirimJawab() {
        var v = inp.value || '';
        if (!v.trim()) return;
        b.disabled = true;
        call(['teka', i, v], function (r) {
          if (r.maju) { if (timer) clearInterval(timer); after(i, r); return; }
          au('bad'); sisa = Math.max(1, r.tunggu || 20); render(r.pesan || '"Bukan itu, Nak."');
        }, null);
      }
      b.onclick = kirimJawab;
      inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); kirimJawab(); } };
    }
    render(null);
  }

  /* =====================================================================
   * Sinematik
   * ===================================================================== */
  function cine(kind, slides, cb) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    close();
    var ov = document.createElement('div'); ov.className = 'qt-cine cb-cine';
    ov.innerHTML = '<canvas></canvas><button class="cb-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button>' +
      '<div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind) || stop; } catch (e) { console.warn('[MK] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), b = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.cb-skip');
    function show() { txt.classList.remove('in'); void txt.offsetWidth; txt.innerHTML = slides[i]; txt.classList.add('in'); b.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai'; }
    function finish() {
      if (finished) return; finished = true;
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);
      if (cb) setTimeout(cb, 60);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } }
    document.addEventListener('keydown', onKey);
    b.onclick = function () { au('page'); if (++i < slides.length) show(); else finish(); };
    skip.onclick = function () { finish(); };
    setTimeout(function () { skip.classList.add('on'); }, 1500);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    setTimeout(function () { if (!finished) show(); }, 900);
  }

      a: [{ narr: 'Zentul', icon: 'anchor', t: '<p>Kapalmu merapat di antara derek-derek kayu. Seseorang di atap garasi menatap kapalmu sebentar, lalu meludah ke samping dan masuk lagi.</p>' },
        '"Pendatang. Kalau mau balapan, daftarnya di <b>Lapau Oli</b>. Kalau cuma mau lihat-lihat, jangan berdiri di tengah selat."'],
      next: 'Lapau Oli, Zentul.' },

    /* 11 */ { at: 'tavern', c: 'zentul', main: 'rayan', icon: 'cup', title: 'Lapau Oli',
      p: [{ narr: 'Lapau Oli &middot; Zentul', icon: 'cup', t: '<p>Gelas-gelas kopi berjejer di atas kaleng oli bekas. Di dinding, papan bagan turnamen dari kayu, penuh cap jempol berminyak.</p>' },
        '"Rayan Bazzy. Saya yang mencatat, saya juga yang menagih kopi." <i>Ia membuka buku turnamen yang halamannya lengket.</i>',
        '"Turunan Obor tahun ini: babak pertama lawan <b>Pariopelan</b>, semifinal lawan <b>KapalMber</b>, final lawan juara bertahan <b>cangcimen</b>."',
        '"cangcimen sedang di laut. Katanya kerja. Pakai seragam biru." <i>Ia menuliskan sesuatu, lalu mencoretnya lagi.</i> "Jadi, nama Kapten saya tulis atau tidak?"'],
      b: btn('go', 'flag', 'Daftar Turnamen Obor'),
      a: [{ narr: 'Papan bagan', icon: 'flag', t: '<p>Rayan Bazzy menekan cap jempol berminyak di sebelah namamu.</p>' },
        '"Sudah. Besok lusa tidak ada di Zentul, Kapten &mdash; yang ada cuma \'sekarang\'. Turun saja ke Sirkuit kalau sudah siap."'],
      next: 'Sirkuit Selat Lurus, Zentul.' },

    /* 12 */ { at: 'sirkuit', c: 'zentul', main: 'rayan', icon: 'flag', title: 'Babak Pertama',
      p: [{ narr: 'Sirkuit Selat Lurus &middot; babak pertama', icon: 'flag', t: '<p>Dua lajur air, tiga obor di garis start, dan satu meriam kecil yang sudah diisi. Pariopelan mengikat ikat kepalanya sambil menguap.</p>' },
        { n: 'pario', t: '"Kapal dagang? Di selat ini?" <i>Ia melihat lambungmu, lalu ke mesinmu, lalu tertawa.</i> "Tidak apa-apa. Semua orang mulai dari kalah."' },
        '"Aturannya satu: ketuk saat meriam berbunyi, naikkan gigi empat kali, tahan di gigi lima. Sisanya urusan mesin."'],
      b: btn('go', 'flag', 'Turun ke garis start: Babak 1'),
      next: 'Garasi Yaptob, Zentul.' },

    /* 13 */ { at: 'garasi', c: 'zentul', main: 'yaptob', icon: 'wrench', title: 'Garasi Yaptob',
      p: [{ narr: 'Garasi Yaptob', icon: 'wrench', t: '<p>Bau oli panas dan logam. Seorang tua berbaring di bawah lambung perahu, hanya kakinya yang kelihatan. Di dinding tergantung tujuh obor kecil berdebu &mdash; tujuh kali juara.</p>' },
        '"Aku sudah pensiun mengurus kapal orang asing." <i>Ia tidak keluar dari bawah lambung.</i> "Cari tukang di dermaga. Mereka murah."',
        { narr: 'Kau menyebut nama lawan finalmu', icon: 'wrench', t: '<p>Satu kata saja: <b>cangcimen</b>.</p><p>Suara kunci pas berhenti. Untuk beberapa saat tidak ada bunyi apa pun di garasi itu.</p>' },
        '"...cangcimen." <i>Ia keluar, mengelap tangannya lama sekali.</i> "Murid yang menjual dua detiknya. Baik. Kapalmu kukencangkan."'],
      b: btn('go', 'wrench', 'Minta Yaptob mengencangkan kapal'),
      a: [{ narr: 'Daftar bersketsa', icon: 'scroll', t: '<p>Ia menulis di sobekan kertas amplas: lima suku cadang, masing-masing dengan sketsa kecil yang lebih jelas daripada namanya.</p>' },
        '"Jangan beli yang baru. Yang baru itu lembek. Cari di <b>Pasar Rongsok</b>, di bangkai perahu yang sudah mati tapi mesinnya mati belakangan."'],
      next: 'Pasar Rongsok, Zentul.' },

    /* 14 */ { at: 'market', c: 'zentul', main: 'rongsok', icon: 'crate', title: 'Pasar Rongsok',
      p: [{ narr: 'Pasar Rongsok &middot; Zentul', icon: 'crate', t: '<p>Bukan pasar: tumpukan. Lambung di atas lambung, mesin di atas mesin, dan satu perempuan bercaping yang hafal letak semuanya.</p>' },
        '"Daftar dari Yaptob? Bagus. Orang tua itu tidak pernah salah tulis, tapi tulisannya memang tidak bisa dibaca." <i>Ia menunjuk sketsanya.</i> "Cocokkan sendiri dengan yang ada di rak."'],
      b: btn('go', 'crate', 'Cari suku cadang Yaptob'),
      g: { kind: 'manifest', opts: { kicker: 'Pasar Rongsok &middot; Zentul', title: 'Cocokkan Sketsa &middot; Lima Suku Cadang', ledgerTitle: 'Daftar Sketsa Yaptob',
        intro: 'Bandingkan <b>jumlah</b>, <b>cap</b>, dan <b>berat</b> di tiap sketsa dengan label di rak rongsok. Pakai <b>lup</b> kalau tulisannya kecil.',
        cardTitle: 'Lima suku cadang', cardQuote: '"Yang bengkok malah lebih kuat, Kapten. Sudah teruji patah."' } },
      a: [{ narr: 'Lima suku cadang', icon: 'crate', t: '<p>Lima barang berminyak, tidak ada satu pun yang baru.</p>' },
        '"Bawa ke garasi sebelum dingin, Kapten. Logam itu ingat panas terakhirnya."'],
      next: 'Garasi Yaptob, Zentul.' },

    /* 15 */ { at: 'garasi', c: 'zentul', main: 'yaptob', icon: 'hammer', title: 'Katup Jolt',
      p: [{ narr: 'Tungku dinyalakan', icon: 'hammer', t: '<p>Yaptob memompa tungku sampai apinya biru. Ia meletakkan lima suku cadang berjajar seperti orang menata alat makan.</p>' },
        '"Yang terakhir harus kau tempa sendiri. <b>Katup</b>. Dia yang menahan tekanan waktu kau tahan jari di gigi lima."',
        '"Panaskan sampai kuning jerami, jangan putih. Pukul di zona hijau. Celup sekali, tepat waktu. Kalau katupnya bagus, mesinmu tahan panas lebih lama."'],
      b: btn('go', 'hammer', 'Tempa katup bersama Yaptob'),
      g: { kind: 'tempa', opts: { kicker: 'Garasi Yaptob &middot; Zentul', title: 'Tempa Katup Jolt',
        intro: '<b>Yaptob:</b> "Kuning jerami, bukan putih. Pukul di zona hijau. Lalu celup sekali, tepat waktu."' } },
      a: [{ narr: 'Mesin Jolt Tahap 1', icon: 'wrench', t: '<p>Katupnya dipasang terakhir. Yaptob menutup penutup mesin dengan satu tendangan pelan, lalu menyeka tangan.</p>' },
        '"Sekarang kapalmu bukan kapal dagang lagi. Belum kapal balap juga &mdash; tapi sudah bisa diajak bicara."',
        '"Turun ke Sirkuit. Latihan sampai jarimu hafal bonangnya, bukan matamu." <i>Ia kembali ke bawah lambung.</i> "Dan jangan merusak katupku."'],
      next: 'Sirkuit Selat Lurus: babak pertama diulang, kali ini dengan Mesin Jolt.' },

    /* 16 */ { at: 'sirkuit', c: 'zentul', main: 'pario', icon: 'flag', title: 'Babak Pertama, Lagi', win: true,
      p: [{ narr: 'Sirkuit Selat Lurus &middot; babak pertama diulang', icon: 'flag', t: '<p>Rayan Bazzy menghapus papan bagan dan menulis ulang namamu. Di lajur sebelah, Pariopelan memandangi mesin barumu lebih lama dari yang ia mau akui.</p>' },
        '"Jadi orang tua itu akhirnya keluar dari bawah lambung." <i>Ia meludah ke samping.</i> "Baik. Sekarang baru balapan."'],
      b: btn('go', 'flag', 'Babak 1 (ulang)'),
      kalahLine: 'Pariopelan menang lagi. <i>Yaptob dari atap garasi:</i> "Jarimu masih menunggu matamu, Kapten. Dengarkan bonangnya."',
      a: [{ narr: 'Babak pertama: menang', icon: 'flag', t: '<p>Obor di garis akhir diangkat untuk kapalmu. Pariopelan menepuk lambung kapalmu sekali, lalu pergi tanpa bicara.</p>' },
        { n: 'rayan', t: '"Naik ke semifinal. Lawanmu KapalMber &mdash; dia tidak pernah kalah start. Tidak pernah."' }],
      next: 'Semifinal, di Sirkuit yang sama.' },

    /* 17 */ { at: 'sirkuit', c: 'zentul', main: 'rayan', icon: 'flag', title: 'Semifinal', win: true,
      p: [{ narr: 'Sirkuit Selat Lurus &middot; semifinal', icon: 'flag', t: '<p>KapalMber tidak melihat lawannya. Ia hanya melihat meriam start, dari tadi, tanpa berkedip.</p>' },
        '"Dia menghitung asap meriamnya, Kapten, bukan bunyinya. Asap lebih dulu sampai ke mata daripada bunyi ke telinga."'],
      b: btn('go', 'flag', 'Semifinal'),
      kalahLine: 'KapalMber menang lagi.',

        '<i>Yaptob:</i> "Gigi empat kau tahan kelamaan. Mesin itu batuk kalau kau serakah."',
        '<i>Yaptob:</i> "Semburan itu bukan tombol, Kapten. Jangan dilepas jarimu setelah gigi lima."'],
      a: [{ narr: 'Semifinal: menang', icon: 'flag', t: '<p>KapalMber duduk di lambungnya sendiri sambil menatap air, lama.</p>' },
        { n: 'rayan', t: '"Final. Lawanmu juara bertahan." <i>Ia menulis satu nama, lalu mengetuknya dua kali dengan pena.</i> "cangcimen pulang pekan depan. Dengan lambung Warlord."' }],
      next: 'Lapor ke Yaptob di Garasi.' },

    /* 18 */ { at: 'garasi', c: 'zentul', main: 'yaptob', icon: 'wrench', title: 'Jantung yang Lebih Kuat',
      p: [{ narr: 'Garasi Yaptob', icon: 'wrench', t: '<p>Ia mendengarkan tanpa berhenti mengikir.</p>' },
        '"Final melawan cangcimen. Lambungnya Warlord, dibayar uang Kumis Hitam. Mesinmu belum cukup."',
        '"Aku butuh <b>jantung yang lebih kuat</b>. Dan aku harus tahu kenapa Jaring itu buta dua detik." <i>Ia meletakkan kikirnya.</i> "Tanya orang yang pernah bekerja untuk mesin itu. Yang pegang kemudi kapal hitam itu."'],
      b: btn('go', null, 'Catat pesannya', false),
      a: [{ narr: 'Catatan di sobekan amplas', icon: 'scroll', t: '<p>Satu kata: <b>Skitraw</b>. Di bawahnya, gambar rantai dengan dua mata yang kosong.</p>' }],
      next: 'Galangan Gaul-Wash, Skitraw.' },

    /* 19 */ { at: 'ship', c: 'skitraw', main: 'gaul', icon: 'moon', title: 'Pola Rantai',
      p: [{ narr: 'Galangan Gaul-Wash &middot; Skitraw', icon: 'moon', t: '<p>Bau sabun dan tar. Hasiolan menggambar di meja cucian dengan jari basah: garis panjang, garis panjang, titik, lalu kosong.</p>' },
        '"Uda Gala sedang di laut, jadi aku pakai mejanya." <i>Ia menatap gambarnya sendiri.</i> "Dulu aku percaya pada kedamaian yang dipaksakan. Sekarang aku tahu itu cuma penjara yang rapi."',
        '"Kedipan rantai itu punya pola. Baca sendiri &mdash; aku tidak mau jadi satu-satunya orang yang tahu."'],
      b: btn('go', 'moon', 'Tanyakan pola rantai pada Hasiolan'),
      g: { kind: 'sandi', opts: { kicker: 'Galangan Gaul-Wash &middot; Skitraw', title: 'Sandi Mercusuar &middot; Pola Rantai', lives: 3,

      next: 'Mercusuar Nenek Ulin, Bjorneo.' },

    /* 20 */ { at: 'tasks', c: 'bjorneo', main: 'ulin', icon: 'star', title: 'Batu yang Bukan untuk Rumah', teka: true,
      p: [{ narr: 'Mercusuar Bjorneo', icon: 'star', t: '<p>Seratus tiga anak tangga. Di atas, seorang nenek duduk menghadap laut, memunggungi lampunya sendiri.</p>' },
        '"Rantai biru itu? Tiap malam saya lihat dia berkedip, Nak. Dan tiap beberapa tarikan, dia <b>pejam</b>."',
        '"Sebelum saya cerita, jawab dulu." <i>Ia tersenyum, matanya tetap ke laut.</i>'],
      b: btn('go', 'star', 'Tanya Nenek Ulin soal rantai biru'),
      a: [{ narr: 'Jawaban Nenek Ulin', icon: 'star', t: '<p>Ia tertawa kecil, puas.</p>' },
        '"Betul. Rantai itu tidak bernapas, Nak. Ia minum dari <b>batu baterai</b>. Setiap kali batunya diisi ulang, rantainya buta dua detik."',
        '"Dan batu sebesar itu cuma dibuat di satu tempat: <b>kota kaca yang dulu diam</b>." <i>Ia akhirnya menoleh.</i> "Kalau kau mau lewat, lewatlah saat dia pejam. Jangan saat dia melihat."'],
      next: 'Berlayarlah ke pulau bertanda CUKAI. Saat dicegat, pilih Tembus Jaring.' },

    /* 21 */ { at: 'setsail', main: 'ulin', icon: 'alert', title: 'Tembus Pertama', info: true,
      p: [{ narr: 'Dua detik itu', icon: 'alert', t: '<p>Rantai biru buta dua detik setiap kali batunya diisi ulang. Cukup untuk satu lambung, kalau lambung itu lari lurus.</p>' +
        '<p class="muted small">Berlayarlah ke pulau bertanda <b>CUKAI</b>. Patroli pasti mencegat &mdash; di kartu pencegatan, pilih <b>Tembus Jaring</b>. Kalah di percobaan pertama ini tidak menyita apa pun.</p>' }] },

    /* 22 */ { at: 'market', main: 'rimba', icon: 'coins', title: 'Koin Bercap Biru',
      p: [{ narr: 'Pasar, satu jam setelah menembus jaring', icon: 'coins', t: '<p>Seorang perempuan berkerudung tar menyebut nama Bang Rimba lebih dulu, baru namamu. Ia membayar muatanmu dengan sekantung koin campuran.</p>' },
        '"Hitung dulu di depan saya, Kapten. Sebagian koin yang beredar sekarang <b>palsu bercap biru</b> &mdash; mereka pakai itu untuk melacak siapa yang berdagang tanpa cap."'],
      b: btn('go', 'coins', 'Temui agen Bang Rimba'),
      g: { kind: 'timbang', opts: { kicker: 'Pasar &middot; Zona Cukai', title: 'Meja Kas &middot; Timbang Koin',

      a: [{ narr: 'Koin bercap biru dipisahkan', icon: 'coins', t: '<p>Tujuh koin disingkirkan ke kain terpisah. Agen itu membungkusnya rapat-rapat.</p>' },
        '"Mulai sekarang pintu belakang terbuka untuk Kapten di pulau mana pun yang berhasil kau tembus." <i>Ia menuliskan sesuatu di telapak tangannya sendiri.</i> "Bang Rimba menunggu di Paradiso. Malam, seperti biasa."'],
      next: 'Ruang VIP, Paradiso, saat lampu dinyalakan.' },

    /* 23 */ { at: 'tavern', c: 'paradiso', t: 'malam', main: 'rimba', icon: 'scroll', title: 'Rencana Banjir Sutra',
      wait: '"Ruang VIP baru buka kalau lampunya dinyalakan, Kapten."',
      p: [{ narr: 'Ruang VIP &middot; Paradiso, malam', icon: 'scroll', t: '<p>Bang Rimba sudah tahu sebelum kau duduk. Di mejanya ada tiga kantung koin bercap biru dari tiga pulau berbeda.</p>' },
        '"Cukai hidup karena dibayar, Kapten. Kalau tak ada lagi yang membayar, ia mati sendiri."',
        '"Rencananya namanya <b>Banjir Sutra</b>: tiga zona dibanjiri barang tanpa cap sampai pembukuan mereka tidak masuk akal. Tapi Barisan Pacu baru ikut kalau kau <b>juara</b>."',

      b: btn('go', null, 'Dengarkan rencananya', false),
      a: [{ narr: 'Hadiah Q17 &middot; tanda jasa "Dua Detik"', icon: 'medal', t: '<p>Bang Rimba mendorong sekantung keping ke arahmu, lalu satu lencana timah kecil berbentuk dua garis.</p><p><i>"Dua detik. Itu saja jarak antara orang bebas dan orang yang mengantre."</i></p>' }],
      next: 'Laboratorium Regal, Marie Regal, saat malam.' },

        ? 'Keempat komponen terpasang. Yaptob menepuk lambungmu sekali: <i>"Sudah. Sekarang kapalmu bukan kapal dagang yang cepat &mdash; ini kapal panglima laut."</i>'
        : 'Yaptob hanya mau memasang di atas yang sudah terbaik. Tiap komponen butuh <b>' + fmt(w.komponen[0].gold) + ' gold</b>, <b>' +
          w.komponen[0].oli + ' Oli Hitam</b>, dan bahannya sendiri.') + '</p></div>';
    html += '<div class="mk-opts">' + w.komponen.map(function (k) {
      var bisa = !k.punya && k.siap && gold() >= k.gold && k.punyaOli >= k.oli && k.punyaBahan >= k.bahanN;
      var syarat = k.punya ? 'Terpasang.' : !k.siap ? 'Grup ini belum Level V Tier IV.'
        : (gold() < k.gold ? 'Gold kurang. ' : '') + (k.punyaOli < k.oli ? 'Oli Hitam ' + k.punyaOli + '/' + k.oli + '. ' : '') +
          (k.punyaBahan < k.bahanN ? k.bahanNama + ' ' + k.punyaBahan + '/' + k.bahanN + '.' : '');
      return '<button data-w="' + k.grup + '"' + (bisa ? '' : ' disabled') + '>' +
        (k.punya ? ic('check') + ' ' : '') + '<b>' + esc_(k.nama) + '</b>' +
        '<div class="muted small" style="margin-top:3px">' + fmt(k.gold) + ' gold &middot; ' + k.oli + ' Oli Hitam &middot; ' + k.bahanN + ' ' + esc_(k.bahanNama || '') + '</div>' +
        (syarat ? '<div class="muted small">' + esc_(syarat) + '</div>' : '<div class="small" style="color:#6a8a3a">Siap dipasang.</div>') + '</button>';
    }).join('') + '</div>';
    var wrap = document.createElement('div'); wrap.className = 'mk-wrap'; wrap.innerHTML = html;
    var anchor = c.querySelector('.ph');
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    wrap.querySelectorAll('[data-w]').forEach(function (b) {
      b.onclick = function () {
        b.disabled = true;
        google.script.run.withSuccessHandler(function (r) {
          if (r && r.warlord !== undefined && state) state.warlord = r.warlord;
          if (r && r.newGold != null && typeof patchGold_ === 'function') { try { patchGold_(r.newGold); if (typeof renderSidebar === 'function') renderSidebar(); } catch (e) { } }
          try { au_('achieve'); } catch (e) { }
          showToast((r && r.nama ? r.nama : 'Komponen') + ' terpasang.', 'success');
          render(); loadState();
        }).withFailureHandler(function (e) {
          b.disabled = false; showToast((e && e.message) || String(e), 'error');
        }).api_warlord('bangun', b.getAttribute('data-w'));
      };
    });
  }
  return { show: show, ada: function () { var w = st(); return !!(w && w.buka); } };
})();

window.MTMahkota = {
  garasi: function () { return !!(MK && MK.buka && MK.buka('garasi')) || !!(MKW && MKW.show && MKW.show()); },
  sirkuit: function () { return !!(MK && MK.buka && MK.buka('sirkuit')); }
};
</script>

<script>
/* ---------- sinematik Saga 4: pantulan Black Pearl & kedatangan Zentul ---------- */
(function () {
  if (!window.MTCine || !MTCine.register || !window.MTUtil) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false;
  try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  function glow(ctx, x, y, r, col, a) {
    if (a <= 0.004 || r <= 0.5) return;
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + col + ',' + Math.min(1, a).toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  function sea(ctx, W, H, t, top, bot, line) {
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = line; ctx.lineWidth = Math.max(1, H * 0.003);
    for (var i = 0; i < 9; i++) {
      var y = H * (0.6 + i * 0.045);
      ctx.beginPath();
      for (var x = 0; x <= W; x += 18) ctx.lineTo(x, y + Math.sin((x / W) * 7 + t * (0.8 + i * 0.1) + i) * H * 0.006);
      ctx.stroke();
    }
  }
  function pearl(ctx, x, y, s, tilt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0); ctx.scale(s, s);
    ctx.fillStyle = '#140f12'; ctx.beginPath(); ctx.moveTo(-70, 0); ctx.quadraticCurveTo(0, 26, 78, 0); ctx.lineTo(60, 16); ctx.quadraticCurveTo(0, 34, -58, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#231a20'; ctx.fillRect(-4, -72, 7, 72);
    ctx.fillStyle = '#2a2026'; ctx.beginPath(); ctx.moveTo(4, -66); ctx.quadraticCurveTo(52, -34, 6, -6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -58); ctx.quadraticCurveTo(-48, -30, -6, -8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9a2a2a'; ctx.beginPath(); ctx.moveTo(4, -76); ctx.lineTo(30, -69); ctx.lineTo(4, -62); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // Black Pearl melesat ke dinding cahaya biru, memantul, kembali.
  MTCine.register('mk_pantul', function () {
    function draw(ctx, W, H, t) {
      sea(ctx, W, H, t, '#0d1626', '#132a46', 'rgba(140,180,230,.16)');
      var m = Math.min(W, H), wallX = W * 0.82, y = H * 0.68;
      // dinding cahaya + rantai
      var hit = sm(3.4, 3.9, t), back = sm(4.0, 7.2, t);
      var wg = ctx.createLinearGradient(wallX - m * 0.12, 0, wallX + m * 0.05, 0);
      wg.addColorStop(0, 'rgba(90,150,230,0)'); wg.addColorStop(1, 'rgba(120,190,255,' + (0.35 + 0.5 * hit).toFixed(3) + ')');
      ctx.fillStyle = wg; ctx.fillRect(wallX - m * 0.12, 0, m * 0.17, H);
      ctx.strokeStyle = 'rgba(150,200,255,' + (0.5 + 0.4 * hit).toFixed(3) + ')'; ctx.lineWidth = Math.max(2, m * 0.012);
      for (var i = 0; i < 14; i++) {
        var cy = H * (0.1 + i * 0.062), r = m * 0.022 * (1 + 0.25 * Math.sin(t * 2 + i));
        ctx.beginPath(); ctx.ellipse(wallX, cy, r * 0.55, r, 0, 0, Math.PI * 2); ctx.stroke();
      }
      glow(ctx, wallX, H * 0.5, m * 0.5, '110,180,255', 0.18 + 0.4 * hit);
      // kapal: melesat, menghantam, memantul
      var e = t < 3.6 ? U.lerp(-0.1, 0.78, sm(0.4, 3.6, t)) : U.lerp(0.78, -0.15, sm(3.9, 7.4, t));
      var x = W * e, tilt = (t > 3.6 && t < 4.6) ? Math.sin((t - 3.6) * 9) * 0.22 * (1 - (t - 3.6)) : 0;
      if (!REDUCE) {
        ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = Math.max(1.5, m * 0.008);
        ctx.beginPath(); ctx.moveTo(x - m * 0.34 * (t < 3.6 ? 1 : -1), y + m * 0.02); ctx.lineTo(x, y + m * 0.02); ctx.stroke();
      }
      ctx.save(); if (t >= 3.9) { ctx.translate(x, y); ctx.scale(-1, 1); ctx.translate(-x, -y); }
      pearl(ctx, x, y, m * 0.0042, tilt); ctx.restore();
      if (hit > 0 && back < 1) {
        glow(ctx, wallX - m * 0.04, y - m * 0.04, m * 0.3 * hit, '200,230,255', 0.5 * hit * (1 - back));
        ctx.strokeStyle = 'rgba(210,235,255,' + (0.8 * hit * (1 - back)).toFixed(3) + ')'; ctx.lineWidth = Math.max(1, m * 0.004);
        for (var k = 0; k < 10; k++) {
          var a = (k / 10) * Math.PI * 2;
          ctx.beginPath(); ctx.moveTo(wallX - m * 0.04, y - m * 0.04);
          ctx.lineTo(wallX - m * 0.04 + Math.cos(a) * m * 0.16 * hit, y - m * 0.04 + Math.sin(a) * m * 0.16 * hit); ctx.stroke();
        }
      }
      if (t < 1) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - t).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    }
    return { draw: draw, intro: 2 };
  });
  // Kedatangan Zentul: kabut terbuka, obor, lalu satu perahu melesat meninggalkan garis api.
  MTCine.register('mk_zentul', function () {
    var r = U.rng(4242), smk = [];
    for (var i = 0; i < 26; i++) smk.push({ x: r(), y: r(), s: 0.5 + r(), sp: 0.3 + r() * 0.5 });
    function draw(ctx, W, H, t) {
      sea(ctx, W, H, t, '#2a1a12', '#5a3418', 'rgba(255,190,120,.12)');
      var m = Math.min(W, H), open = sm(0.6, 3.2, t), horizon = H * 0.62;
      // atol dari lambung rongsok
      ctx.save(); ctx.globalAlpha = open;
      ctx.fillStyle = '#2a1c12';
      ctx.beginPath(); ctx.moveTo(0, horizon); 
      for (var x = 0; x <= W; x += W / 18) ctx.lineTo(x, horizon - m * (0.04 + 0.05 * Math.abs(Math.sin(x * 0.0031 + 1.3))));
      ctx.lineTo(W, horizon + m * 0.02); ctx.lineTo(0, horizon + m * 0.02); ctx.closePath(); ctx.fill();
      for (var h = 0; h < 7; h++) {
        var hx = W * (0.08 + h * 0.13), hw = m * (0.07 + (h % 3) * 0.02);
        ctx.fillStyle = h % 2 ? '#3a2616' : '#4a3020';
        ctx.beginPath(); ctx.moveTo(hx, horizon); ctx.quadraticCurveTo(hx + hw / 2, horizon - m * 0.07, hx + hw, horizon); ctx.closePath(); ctx.fill();
      }
      // obor
      for (var o = 0; o < 9; o++) {
        var ox = W * (0.06 + o * 0.11), oy = horizon - m * 0.045 - m * 0.02 * ((o % 3) * 0.5);
        ctx.fillStyle = '#20150d'; ctx.fillRect(ox - m * 0.004, oy, m * 0.008, m * 0.05);
        var fl = 0.6 + 0.4 * Math.sin(t * 7 + o * 1.9);
        glow(ctx, ox, oy, m * 0.035 * fl, '255,170,70', 0.75);
        ctx.fillStyle = 'rgba(255,215,140,.95)';
        ctx.beginPath(); ctx.ellipse(ox, oy, m * 0.006, m * 0.013 * fl, 0, 0, Math.PI * 2); ctx.fill();
      }
      // asap cerobong
      smk.forEach(function (p) {
        var ph = ((t * p.sp + p.x * 4) % 4) / 4;
        var sx = W * p.x, sy = horizon - m * 0.05 - ph * H * 0.3;
        ctx.fillStyle = 'rgba(60,45,35,' + (0.3 * (1 - ph)).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(sx, sy, m * 0.02 * p.s * (0.6 + ph), 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
      // kabut berminyak yang membuka
      ctx.fillStyle = 'rgba(190,170,150,' + (0.85 * (1 - open)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
      // perahu pacu melesat (detik 4.2 - 5.6)
      var run = sm(4.2, 5.6, t);
      if (run > 0 && run < 1) {
        var py = H * 0.82, px = U.lerp(-W * 0.1, W * 1.1, run);
        ctx.globalCompositeOperation = 'lighter';
        var g2 = ctx.createLinearGradient(px - W * 0.5, 0, px, 0);
        g2.addColorStop(0, 'rgba(255,140,50,0)'); g2.addColorStop(1, 'rgba(255,180,80,.75)');
        ctx.strokeStyle = g2; ctx.lineWidth = Math.max(2, m * 0.016);
        ctx.beginPath(); ctx.moveTo(px - W * 0.5, py); ctx.lineTo(px, py); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#2e1c10';
        ctx.beginPath(); ctx.moveTo(px - m * 0.16, py - m * 0.01); ctx.lineTo(px + m * 0.05, py - m * 0.055); ctx.lineTo(px + m * 0.02, py + m * 0.012); ctx.lineTo(px - m * 0.16, py + m * 0.012); ctx.closePath(); ctx.fill();
        glow(ctx, px - m * 0.14, py - m * 0.04, m * 0.09, '255,150,60', 0.85);
      }
      C.vignette && C.vignette(ctx, W, H);
      if (t < 1) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - t).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    }
    return { draw: draw, intro: 2 };
  });
})();
</script>
