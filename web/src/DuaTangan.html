      chafik: pick(B.chafik, { name: 'Chafik', ap: apOf('chafik-kecil', 'lapau', 0, { age: 0, head: 'none' }) }, 'Putra kecil Uda Gala'),

      aly: pick(B.aly, { name: 'alyfindi', ap: apOf('alyfindi-peta', 'saudagar', 1) }, 'Penjara TooGood'),
      karto: pick(L.karto || T.karto, { name: 'Pak Tua Karto', ap: apOf('karto', 'lapau', 0, { age: 0.95 }) }, 'Peminum Kopi Pahit')

  }
  function face(n) {

  }

  /* ---------- pembantu ---------- */

  var flowBusy = false;

  var SEEN_MEM = {};

  function fmt(n) { return typeof formatGold === 'function' ? formatGold(n) : String(n); }
  function speech(n, text, extra, title) {

      '<div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function narr(kicker, text, extra, icon, cls) {
    return '<div class="lt-narr ' + (cls || '') + '"><div class="tn-k">' + ic(icon || 'scroll') + esc_(kicker || '') + '</div>' + text + (extra || '') + '</div>';
  }
  function actions(btns) { return '<div class="qg-actions">' + btns + '</div>'; }
  function dots(i, n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="' + (k === i ? 'on' : '') + '"></i>'; return '<div class="qt-dots">' + h + '</div>'; }
  function btn(attr, icon, label, gold) { return '<button class="btn' + (gold === false ? ' btn-ghost-ink' : ' btn-gold') + '" data-dt="' + attr + '">' + (icon ? ic(icon) + '&nbsp; ' : '') + label + '</button>'; }
  var OTHER_WRAPS = '.lt-wrap, .cb-wrap, .kp-wrap, .bx-wrap, .ww-wrap, .qt-wrap, .qg-wrap, .ts-wrap';
  function insert(html, opts) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    if (c.querySelector('.dt-wrap')) return null;
    if (opts && opts.quiet) c.querySelectorAll(OTHER_WRAPS).forEach(function (e) { e.remove(); });
    var anchor = opts && opts.top ? c.querySelector('.ph') : (c.querySelector('.lt-wrap') || c.querySelector('.ts-wrap') || c.querySelector('.qg-wrap') || c.querySelector('.npc') || c.querySelector('.ph'));
    var wrap = document.createElement('div'); wrap.className = 'dt-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function onAll(w, sel, fn) { if (w) w.querySelectorAll(sel).forEach(function (b) { b.onclick = function () { fn(b); }; }); }
  function applyUnlocks(r) {
    if (!r || !state) return;
    if (r.unlocks) state.unlocks = r.unlocks;
    if (r.cities && r.cities.length) {
      try { if (typeof setCachedCities_ === 'function') setCachedCities_(r.citiesVersion, r.cities); } catch (e) { }
      try { state.cities = typeof visibleCities_ === 'function' ? visibleCities_(r.cities, state) : r.cities; } catch (e) { }
      if (r.citiesVersion) state.citiesVersion = r.citiesVersion;
    }
    if (typeof invalidatePanelCache_ === 'function') invalidatePanelCache_();
  }
  function adopt(s) { if (s) s._at = Date.now(); if (state) state.duatangan = s; prevStep = s ? (s.step || 0) : null; }
  function call(action, arg, ok, b, fail) {
    if (b) b.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      r = r || {};
      if (r.duatangan !== undefined && state) adopt(r.duatangan);
      if (r.newGold != null && typeof patchGold_ === 'function') { patchGold_(r.newGold); try { renderSidebar(); } catch (e) { } }
      if (r.ship && typeof patchShip_ === 'function') { try { patchShip_(r.ship, r.shipVisual); } catch (e) { } }
      applyUnlocks(r);

    }).withFailureHandler(function (e) {
      if (b) b.disabled = false;
      showToast((e && e.message) || String(e), 'error');
      if (fail) fail(e);
    }).api_duaTangan(action, arg == null ? '' : String(arg));
  }
  function status(cb) {
    google.script.run.withSuccessHandler(function (r) { if (r && r.duatangan !== undefined && state) { adopt(r.duatangan); if (cb) cb(r.duatangan); } }).withFailureHandler(function () { }).api_duaTangan('status');
  }
  // api_dtRaid: argumen dikirim apa adanya (objek perintah, boolean)
  function raid(args, ok, fail, b) {
    if (b) b.disabled = true;
    var run = google.script.run.withSuccessHandler(function (r) {
      if (b) b.disabled = false;
      r = r || {};

      if (b) b.disabled = false;
      if (fail) fail(e); else showToast((e && e.message) || String(e), 'error');

    run.api_dtRaid.apply(run, args);
  }
  function pages(w, n, list, lastBtns, bind, title) {

      var last = i === list.length - 1, pg = list[i], who = (pg && pg.n) || n, txt = (pg && pg.t) || pg;
      var nav = actions(last ? lastBtns : '<button class="btn btn-gold" data-dt="next">Lanjut</button>') + dots(i, list.length);
      w.innerHTML = pg && pg.narr ? narr(pg.narr, txt, nav, pg.icon, pg.cls) : speech(who, txt, nav, pg && pg.title ? pg.title : (who === n ? title : null));
      au_('page');

  /* ---------- sinematik layar penuh (bisa dilewati; auto = slide maju sendiri, untuk di tengah serbuan) ---------- */
  function cine(kind, slides, cb, auto) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    flowBusy = true;
    var ov = document.createElement('div'); ov.className = 'qt-cine ts-cine';
    ov.innerHTML = '<canvas></canvas><button class="ts-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button><div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind) || stop; } catch (e) { console.warn('[DT] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), b = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.ts-skip'), timer = 0;
    function show() {
      txt.classList.remove('in'); void txt.offsetWidth; txt.innerHTML = slides[i]; txt.classList.add('in'); b.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai';
      if (auto) { clearTimeout(timer); timer = setTimeout(adv, auto); }
    }
    function adv() { if (finished) return; if (++i < slides.length) show(); else finish(); }
    function finish() {
      if (finished) return; finished = true; clearTimeout(timer);
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);

    document.addEventListener('keydown', onKey);

    requestAnimationFrame(function () { ov.classList.add('show'); });
    setTimeout(function () { if (!finished) show(); }, 900);
  }

  /* ---------- jurnal ---------- */
  function objective(s) {
    var k = s.step || 0;
    if (k === 0) return '<i>"Jangan ikuti saya selama tiga hari."</i> Jarum emas kompasmu masih bergerak.';
    if (k === 1 && cid() !== 'sowtour') return '<i>"Dua jarum menunjuk ke satu teluk. Black Pearl menunggu di kota menara, tapi satu lambung hitam tidak cukup."</i> Bawa <b>' + (s.needMesiu || 50) + ' Mesiu</b> dan <b>' + (s.needBeras || 100) + ' Beras</b> untuk Perbekalan Armada.';
    if (k === 1) return '<i>"Kalau kita datang berdua, ia akan tertawa. Kalau kita datang berempat, ia akan berhenti tertawa."</i> Buka <b>Papan Armada</b> di garasi Om Baayu.';
    if (k === 3) return '<i>Sayap Patah kandas di karang telapak tangan.</i> Dua tangan menunggu di batu.';
    if (k === 4) return '<i>Batu itu menyala emas dan perak.</i>';

    var lane = b.lane >= 200 ? 'Sangat lebar' : b.lane >= 150 ? 'Lebar' : b.lane >= 100 ? 'Sedang' : 'Sempit';

  /* =================================================================
   * KAITAN: kedatangan, panel, hotspot, gosip, NPC
   * ================================================================= */
  function here() {
    var s = st(); if (!s || !docked()) return null;
    var k = s.step || 0, c = cid();
    if (k === 0 && s.ready) return { icon: 'scroll', t: 'Seekor pelikan perak', d: 'Tabung surat bersegel hijau di paruhnya.', fn: prologStart, l: 'Baca' };
    if (k >= 1 && k !== 3 && k !== 4 && c === 'sowtour') return { icon: 'flag', t: 'Papan Armada', d: k >= 5 ? 'Bantu kapten lain menyerbu Teluk Dua Tangan (veteran).' : 'Kumpulkan 2&ndash;4 kapten untuk menyerbu Teluk Dua Tangan.', fn: boardOpen, l: 'Buka', panel: 'tasks' };
    if (k === 3) return { icon: 'key', t: 'Dua tangan menunggu', d: 'Sayap Patah kandas. Batu itu menunggu tanganmu.', fn: penutup, l: 'Ke batu' };
    return null;
  }
  function callout(icon, t, d, act, label) {
    return '<div class="qg-callout"><div class="qg-callout-ico">' + ic(icon) + '</div><div><b>' + t + '</b><br><span class="muted small">' + d + '</span></div>' +
      (act ? '<button class="btn btn-gold" data-dt="' + act + '">' + esc_(label || 'Lihat') + '</button>' : '<span></span>') + '</div>';
  }
  function decorTasks() {
    var s = st(); if (!s || !docked()) return;
    var h = here(), html = '';
    if (h) html += callout(h.icon, h.t, h.d, 'here', h.l);
    if ((s.step || 0) >= 1) html += journal();
    if ((s.step || 0) >= 5 && s.credits) html += actions(btn('recred', 'star', 'Tonton ulang credit Saga Kedua', false));
    if (!html) return;
    var w = insert(html, { quiet: !!h && (s.step || 0) < 5 });
    if (!w) return;
    if (h) on(w, '[data-dt=here]', function () { h.fn(); });
    on(w, '[data-dt=recred]', function () { close(); credits(); });
    bindHist(w);
  }
  wrap_('setModal_', function () { if (currentPanel === 'tasks') try { decorTasks(); } catch (e) { console.warn('[DT]', e); } });

  var origOpen = window.openPanel;
  if (typeof origOpen === 'function') {
    window.openPanel = function (panel) {
      var s = st();
      if (panel === 'armada' && cid() === 'sowtour') { if (s && (s.step || 0) >= 1) { boardOpen(); return; } showToast('Om Baayu: "Motor ini genderang kota. Belum waktunya ditabuh."', 'info'); return; }
      return origOpen.apply(this, arguments);
    };
  }
  // notifikasi kotak masuk & chat
  wrap_('handleInbox_', null, function (it) {
    if (!it) return;
    if (it.type === 'raid_open') showToast('Genderang di Sowtour: ' + it.from + ' membuka armada ke Teluk Dua Tangan.', 'info');
    if (it.type === 'raid_start') { showToast('Armada ' + it.from + ' mengangkat sauh!', 'success'); setTimeout(function () { startRaid(it.raidId); }, 300); }
  });
  // sapaan di dermaga (dipasang setelah LT, jadi jalan lebih dulu)
  var origNpcToast = window.showNpcToast_;
  if (typeof origNpcToast === 'function') window.showNpcToast_ = function (role, text) {
    var c = cid(), s = st();
    if (c === 'rantai_lama' && s && s.fate === 'dewan') { showToast(pickLine_(['Lonceng pelelangan berdentang, kali ini dengan tali. Selamat datang di pelabuhan bebas, Kapten.', 'Pandai besi FreeYork melebur tiang pasung terakhir di dermaga.'], 'dtrl'), 'info'); return; }
    if (c === 'teluk_dua_tangan') { showToast('Tak ada dermaga. Hanya cahaya emas dan perak dari batu di tengah teluk.', 'info'); return; }
    if (c === 'sowtour' && role === 'syahbandar' && s && (s.step || 0) >= 1 && (s.step || 0) < 5) text = 'Black Pearl menunggu di dermaga, Kapten. Om Baayu menyalakan motornya setiap ada kapten yang datang.';
    return origNpcToast.call(this, role, text);
  };
  if (typeof window.rumors_ === 'function') {
    var origRumors = window.rumors_;
    window.rumors_ = function () {
      var out = origRumors.apply(this, arguments), s = st();
      if (!s || !out || !out.length) return out;
      var pool = (s.step || 0) >= 5 ? ['Di benua, pelikan mengantar surat lagi. Kali ini isinya pesanan kopi.', 'Kata orang, jam di em pe\'er de pe\'er berdetak lagi. Bukan semenit. Sungguhan.', 'Papan di Marie Regal menyala: DUA TANGAN, SATU LAUT.']
        : (s.step || 0) >= 1 ? ['Kapal hitam di Sowtour menunggu kapten-kapten lain. Katanya mereka butuh banyak beras.', 'Ada yang mendengar knalpot motor dari Kota Sowtour sampai ke laut.'] : null;
      if (pool && Math.random() < 0.5) out[Math.floor(Math.random() * out.length)] = pool[Math.floor(Math.random() * pool.length)];
      return out;
    };
  }

  /* ---------- kedatangan & transisi ---------- */
  var prevStep = null, raidCheckAt = 0;
  function scenes() {
    var s = st(); if (!s || !docked() || busyUi()) return;
    var k = s.step || 0, c = cid();
    if (k >= 5) { try { metaMax_('dtsaga', 1); } catch (e) { } }
    // serbuan yang masih berjalan (mis. setelah muat ulang / putus koneksi): kembali ke arena
    if (s.raidId && Date.now() - raidCheckAt > 5000) {
      raidCheckAt = Date.now();
      raid(['view', s.raidId], function (v) { if (v.raid && v.raid.status === 'active' && !busyUi()) startRaid(v.raid.id); }, function () { });
    }
    if (k === 0 && s.ready && !seen('prolog')) { prologStart(); return; }
    if (k >= 1 && k < 5 && c === 'sowtour' && !s.arrived && !seen('arrive')) { arriveScene(); return; }
    if (k === 3 && !seen('penutup:' + s.raidWon)) { markSeen('penutup:' + s.raidWon); penutup(); return; }
    if (k === 4) { var w = modalWrap('sun', 'Fajar di teluk', 'Teluk Dua Tangan'); if (w) { w.innerHTML = narr('Teluk Dua Tangan', '<p>Batu itu masih menyala emas dan perak.</p>', actions(btn('epi', 'sun', 'Lanjutkan'))); on(w, '[data-dt=epi]', function (b) { tutupThen(b); }); } return; }
  }
  wrap_('applyFreshState_', function () {
    var s = st();
    if (s) s._at = Date.now();
    prevStep = s ? (s.step || 0) : null;
    if (!s) return;
    var tries = 0;
    setTimeout(function later() {
      if (!state || !st()) return;
      if (busyUi() || (document.getElementById('modalOverlay') && document.getElementById('modalOverlay').classList.contains('open'))) { if (tries++ < 60) setTimeout(later, 1000); return; }
      try { scenes(); } catch (e) { console.warn('[DT] scenes', e); }
    }, 2200);
  });

  /* ---------- Tanda Jasa ---------- */
  if (typeof ACH !== 'undefined' && ACH.push) ACH.push(
    { id: 'dt_penyambung', t: 3, ic: 'key', n: 'Penyambung Dua Tangan', d: 'Tamatkan Tempat Dua Tangan Berjabat.', g: function (m) { return [m.c.dtsaga || 0, 1]; } },
    { id: 'dt_saga2', t: 3, ic: 'star', n: 'Saga Kedua', d: 'Tonton credit Saga Kedua sampai selesai.', g: function (m) { return [m.c.dtcredits || 0, 1]; } },
    { id: 'dt_first', t: 3, ic: 'flag', n: 'Tangan Pertama', d: 'Jadi kontributor terbesar di Serbuan Bersama yang menang.', g: function (m) { return [m.c.dtfirst || 0, 1]; } },
    { id: 'dt_full', t: 2, ic: 'users', n: 'Armada Penuh', d: 'Menang Serbuan Bersama dengan empat kapal.', g: function (m) { return [m.c.dtfull || 0, 1]; } },
    { id: 'dt_duo', t: 3, ic: 'ship', n: 'Dua Lambung', d: 'Rahasia: menang Serbuan Bersama hanya berdua.', g: function (m) { return [m.c.dtduo || 0, 1]; } },
    { id: 'dt_helper1', t: 1, ic: 'medal', n: 'Tangan Penolong', d: 'Menang Serbuan Bersama sebagai veteran.', g: function (m) { return [m.c.dtvet || 0, 1]; } },
    { id: 'dt_helper5', t: 2, ic: 'medal', n: 'Tangan Penolong II', d: 'Menang Serbuan Bersama sebagai veteran 5 kali.', g: function (m) { return [m.c.dtvet || 0, 5]; } },
    { id: 'dt_helper20', t: 3, ic: 'medal', n: 'Tangan Penolong III', d: 'Menang Serbuan Bersama sebagai veteran 20 kali.', g: function (m) { return [m.c.dtvet || 0, 20]; } }
  );

  return {
    N: N, journal: journal, scenes: scenes, here: here, startRaid: startRaid, boardOpen: boardOpen,
    rantaiOpen: function () { var s = st(); return !!(s && s.fate === 'dewan'); },
    done: function () { var s = st(); return !!(s && s.step >= 5); },
    _prolog: prologStart, _penutup: penutup, _key: keyGame, _epilog: epilog, _credits: credits, _rewards: rewards, _arrive: arriveScene
  };
})();
</script>
