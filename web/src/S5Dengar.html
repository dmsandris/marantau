   * ================================================================= */
  function laguTidur(S, P, T, done) {
    var log = { phrases: [] }, fi = 0, att = null, phase = 'dengar', cur = null, nama = { 1: 'Frasa pertama', 2: 'Frasa kedua', 3: 'Frasa ketiga, bagian yang selama ini hilang' };
    var PADX = [0.22, 0.5, 0.78], PADY = 0.62, glow = [0, 0, 0];
    S.draw = function (ctx, W, H, now) {
      for (var i = 0; i < 3; i++) {
        var g = Math.max(0, glow[i] - now) / 450, x = PADX[i] * W, y = PADY * H, r = W * 0.12;
        ctx.save();
        var gr = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.6); gr.addColorStop(0, 'rgba(240,200,110,' + (0.08 + g * 0.55).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(240,200,110,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#4a3a2a'; ctx.strokeStyle = 'rgba(214,176,92,' + (0.45 + g * 0.5).toFixed(3) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.55, 0, 0, 6.2832); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#cdb88f'; ctx.font = '600 ' + Math.round(W * 0.032) + 'px Georgia'; ctx.textAlign = 'center';
        ctx.fillText(['rendah', 'sedang', 'tinggi'][i], x, y + r * 0.95);
        ctx.restore();
      }
      if (cur) {
        ctx.save(); ctx.fillStyle = '#e8d2a2'; ctx.font = '600 ' + Math.round(W * 0.034) + 'px Georgia'; ctx.textAlign = 'center';
        var fr = P.frasa[String(cur.n)], d = '';
        for (var k = 0; k < fr.length; k++) d += k < (att ? att.length : 0) ? '● ' : '○ ';
        ctx.fillText(phase === 'sambung' ? d.trim() : '', W / 2, H * 0.22); ctx.restore();
      }
    };
    function lightUp(i, whenPerf) { S.later(function () { glow[i] = performance.now() + 450; }, Math.max(0, whenPerf - performance.now())); }
    function play() {
      phase = 'dengar'; S.buttons([]);
      var fr = P.frasa[String(cur.n)], start = performance.now() + 350;
      fr.forEach(function (b) { var w = start + b[1] * P.beat_ms; pad(w, b[0]); lightUp(b[0], w); S.ripple(PADX[b[0]], PADY, 1, w); });
      var end = start + fr[fr.length - 1][1] * P.beat_ms + 700;
      S.later(sambung, end - performance.now());
    }
    function hud() {
      S.hud.innerHTML = 'Frasa <b>' + (fi + 1) + '/' + P.urutan.length + '</b> &middot; Percobaan: <b>' + (P.tries - cur.attempts.length) + '</b> &middot; Dengar ulang: <b>' + (P.replays - cur.replays) + '</b>';
    }
    function sambung() {
      phase = 'sambung'; att = [];
      S.say('Sekarang sambung. Ketuk batu sesuai nada dan iramanya.');
      S.buttons([{ l: 'Dengar lagi', off: cur.replays >= P.replays, fn: function () { cur.replays++; hud(); S.say('Dengarkan baik-baik&hellip;'); play(); } }]);
      hud();
    }
    function mulaiFrasa() {
      var n = P.urutan[fi]; cur = { n: n, attempts: [], replays: 0 }; log.phrases.push(cur); hud();
      S.say('<b>' + nama[n] + '.</b> Dengarkan dulu&hellip;'); S.later(play, 700);
    }
    function tap(e) {
      if (phase !== 'sambung' || !att) return;
      var r = S.cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height, best = -1;
      for (var i = 0; i < 3; i++) if (Math.abs(x - PADX[i]) < 0.14 && Math.abs(y - PADY) < 0.16) best = i;
      if (best < 0) return;
      audio(); var t = T(); att.push({ pad: best, t_ms: t }); pad(performance.now(), best, 0.7); glow[best] = performance.now() + 450; S.ripple(PADX[best], PADY, 1); vib(15);
      var fr = P.frasa[String(cur.n)];
      if (att.length < fr.length) return;
      cur.attempts.push(att);
      var ok = S5DengarNilai.frasaCocok(att, fr, P.beat_ms, P.tol_ms); att = null; phase = 'nilai';
      if (ok) {
        S.say(cur.n === 3 ? '<b>Lagunya utuh.</b> Tanah menjawab dari jauh.' : 'Nadanya bersambung. Tanah menjawab.', 'good');
        fi++; S.buttons([]);
        if (fi >= P.urutan.length) { S.later(function () { done(log); }, 1300); return; }
        S.later(mulaiFrasa, 1500); return;
      }
      if (cur.attempts.length >= P.tries) { S.say('Nadanya patah di tengah jalan.', 'bad'); S.buttons([]); S.later(function () { done(log); }, 1300); return; }
      S.say('Iramanya belum menyatu. Coba lagi dari awal frasa.', 'bad'); hud(); S.later(sambung, 900);
    }
    S.cv.addEventListener('pointerdown', tap);
    mulaiFrasa();
  }

  /* =================================================================
   * Preset akar_selatan: putar dial ke arah detak, lalu selaraskan denyut
   * ================================================================= */
  function akarSelatan(S, P, T, done) {
    var log = { dir_answers: [], t0_ms: 0, taps: [] }, d = 0, phase = 1, hum = null, beatsAt = [], flash = 0;
    var NM = ['Utara', 'Timur Laut', 'Timur', 'Tenggara', 'Selatan', 'Barat Daya', 'Barat', 'Barat Laut'];
    function L(x) { var a = Math.abs(x - P.target); a = Math.min(a, 8 - a); return Math.max(0, 4 - a); }
    S.draw = function (ctx, W, H, now) {
      var cx = W / 2, cy = H * 0.5, R = W * 0.32;
      ctx.save(); ctx.strokeStyle = 'rgba(214,176,92,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
      for (var i = 0; i < 8; i++) {
        var a = -Math.PI / 2 + i * Math.PI / 4, on = i === d && phase === 1;
        ctx.fillStyle = on ? '#f6dc98' : 'rgba(205,184,143,.6)'; ctx.font = (on ? '700 ' : '400 ') + Math.round(W * 0.03) + 'px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(NM[i], cx + Math.cos(a) * R * 1.22, cy + Math.sin(a) * R * 1.22);
      }
      if (phase === 1) {
        var a2 = -Math.PI / 2 + d * Math.PI / 4, lv = L(d), pul = 0.5 + 0.5 * Math.sin(now / 300);
        ctx.strokeStyle = 'rgba(240,200,110,' + (0.4 + lv * 0.12 * pul).toFixed(3) + ')'; ctx.lineWidth = 4 + lv * 2;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a2) * R * 0.9, cy + Math.sin(a2) * R * 0.9); ctx.stroke();
      } else {
        var f = Math.max(0, flash - now) / 350;
        var gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); gr.addColorStop(0, 'rgba(240,190,90,' + (0.15 + f * 0.6).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(240,190,90,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();
      }
      ctx.restore();
    };
    function humTick() {   // detak arah yang sedang ditunjuk dial, mengikuti tingkat getaran
      if (S.dead || phase !== 1) return;
      var lv = L(d), now = performance.now();
      thump(now + 30, lv * 0.25, 46, 0.8); if (lv) S.ripple(0.5, 0.5, Math.min(lv, 2), now + 30); vib(lv * 20);
      hum = S.later(humTick, 1100);
    }
    function putar(k) { if (phase !== 1) return; audio(); d = (d + k + 8) % 8; S.say('Arah: <b>' + NM[d] + '</b>. Dengarkan detaknya.'); }
    function kunci() {
      log.dir_answers.push({ d: d, t_ms: T() });
      if (d === P.target) { phase = 2; S.say('Dari sanalah. Detak lambat, teredam, sangat jauh.', 'good'); S.buttons([]); S.later(selaras, 1500); return; }
      if (log.dir_answers.length >= P.answers) { S.say('Detaknya hilang di antara akar.', 'bad'); S.buttons([]); S.later(function () { done(log); }, 1300); return; }
      S.say('Bukan dari arah itu. Putar lagi.', 'bad'); paint1();
    }
    function paint1() {
      S.hud.innerHTML = 'Kunci arah: <b>' + (P.answers - log.dir_answers.length) + '</b>';
      S.buttons([{ l: '◀', fn: function () { putar(-1); } }, { l: 'Kunci arah', utama: true, fn: kunci }, { l: '▶', fn: function () { putar(1); } }]);
    }
    function selaras() {
      log.taps = []; beatsAt = [];
      S.hud.innerHTML = 'Ketuk mengikuti <b>6 detak</b>. Dua detak pertama hanya contoh.';
      S.say('Dengarkan dua detak, lalu ketuk layar <b>bersama</b> setiap detak berikutnya.');
      S.buttons([]);
      var start = performance.now() + 600;
      for (var k = 0; k < P.beats + 2; k++) {
        var w = start + k * P.interval_ms; beatsAt.push(w);
        thump(w, 0.85, 44, 0.9); S.ripple(0.5, 0.5, 2, w);
        (function (w2, kk) { S.later(function () { flash = performance.now() + 350; vib(30); if (kk === 2) { log.t0_ms = T(); } }, Math.max(0, w2 - performance.now())); })(w, k);
      }
      S.later(function () { done(log); }, beatsAt[beatsAt.length - 1] - performance.now() + P.interval_ms * 0.6);
    }
    S.onPause = function () { if (phase === 2) { S.timers.forEach(clearTimeout); S.timers = []; } };
    S.onResume = function () { if (phase === 2) { S.say('Detaknya terputus. Dengarkan lagi dari awal.'); S.later(selaras, 1200); } };
    S.cv.addEventListener('pointerdown', function (e) {
      if (phase === 1) { var r = S.cv.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
        if (Math.hypot(x, y) < r.width * 0.12) return; var a = Math.atan2(y, x) + Math.PI / 2; d = ((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8; putar(0); return; }
      if (log.t0_ms && log.taps.length < 2 * P.beats) { log.taps.push({ t_ms: T() }); flash = performance.now() + 200; }
    });
    S.say('Putar arah dengan mengetuk tepi lingkaran atau tombol panah. Makin tepat arahnya, makin kuat detaknya.');
    paint1(); humTick();
  }

  var PRESET = { cari_lereng: cariLereng, lagu_tidur: laguTidur, lagu_tidur_pendek: laguTidur, akar_selatan: akarSelatan };

  /* ---------- Siklus sesi ---------- */
  function main(o, cb) {
    if (cur) return;
    o = o || {};
    var f = PRESET[o.preset]; if (!f) { cb && cb({ cancelled: true }); return; }
    var S = shell(o); cur = S; audio();
    var finished = false;
    function fin(res) { if (finished) return; finished = true; S.close(); if (cb) setTimeout(function () { cb(res); }, 420); }
    S.el.querySelector('.x').onclick = function () { fin({ cancelled: true }); };
    function mulai() {
      S.reset();
      S.say('Menyiapkan&hellip;'); S.buttons([]); S.hud.innerHTML = '';
      rpc('api_mg_start', ['listen', o.ctx || 'quest', o.preset, o.step == null ? '' : o.step]).then(function (r) {
        if (S.dead) return;
        var P = r.params, t0 = performance.now(), sid = r.session_id;
        var T = function () { return Math.max(0, Math.round(performance.now() - t0)); };
        f(S, P, T, function (log) {
          S.say('Tanah menimbang&hellip;'); S.buttons([]);
          rpc('api_mg_finish', [sid, log]).then(function (h) {
            if (S.dead) return;
            if (h.status === 'won') { fin({ win: true, efek: h.efek, result: h.result }); return; }
            if (h.status === 'expired') S.say(esc(h.pesan || 'Kesempatan berlalu. Coba lagi, tanpa kerugian.'), 'bad');
            else S.say('Tanah belum mau bicara. Coba lagi, tanpa kerugian.', 'bad');
            S.draw = null;
            S.buttons([{ l: 'Coba lagi', utama: true, fn: function () { mulai(); } }, { l: 'Nanti dulu', fn: function () { fin({ win: false }); } }]);
          }, function (e) {
            S.say(esc((e && e.message) || 'Gagal menghubungi server.'), 'bad');
            S.buttons([{ l: 'Coba lagi', utama: true, fn: function () { mulai(); } }, { l: 'Nanti dulu', fn: function () { fin({ win: false }); } }]);
          });
        });
      }, function (e) {
        S.say(esc((e && e.message) || 'Gagal menghubungi server.'), 'bad');
        S.buttons([{ l: 'Coba lagi', utama: true, fn: function () { mulai(); } }, { l: 'Nanti dulu', fn: function () { fin({ cancelled: true }); } }]);
      });
    }
    mulai();
  }
  function open(kind, opts, cb) { main(Object.assign({ preset: kind }, opts || {}), cb); }
  return { main: main, open: open, isOpen: function () { return !!cur; } };
})();
</script>
