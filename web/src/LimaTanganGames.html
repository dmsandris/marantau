<script>
/* =====================================================================
 * MTGames4 — mini-game Saga 2 · Quest 8 "Lima Tangan"

 *     tempa  -> cb({ win, grade, score, duration, kind })            Tempa Pengait (BARU)
 *     selam  -> cb({ win, heart, beads, duration, kind })            Selam Mutiara (BARU)
 *     lab    -> cb({ win:true, errors, kind })                        Mata Syahbandar versi laboratorium
 *     sandi  -> cb({ win, fail, mistakes, kind })                     Sandi Pelikan versi sulit (3 salah = gagal)

var MTGames4 = (function () {

    try { row.querySelector('button').focus(); } catch (e) { }

  // kanvas berskala: koordinat logis W x H, digambar tajam di layar mana pun

  /* ============================ TEMPA PENGAIT (BARU) ============================ */
  // Panas besi 0..1.1: merah tua (<.3) -> merah -> oranye -> KUNING JERAMI (.72-.95) -> putih (>1, terbakar).
  // Tahap 1 panaskan (tahan ububan) -> tahap 2 delapan ketukan pada zona hijau yang menyempit saat besi mendingin

  var HEAT_STOPS = [[0, [70, 14, 10]], [0.3, [150, 26, 16]], [0.5, [214, 70, 24]], [0.72, [245, 150, 40]], [0.85, [252, 210, 110]], [0.95, [255, 236, 170]], [1.05, [255, 252, 240]]];

  }
  function heatName(h) { return h > 1 ? 'putih' : h >= 0.72 ? 'kuning jerami' : h >= 0.5 ? 'oranye' : h >= 0.3 ? 'merah' : 'merah tua'; }
  var COUNT = ['Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan'];
  var TASSY_TAU = { hot: 'Kau memasak besi, bukan menempanya!', cold: 'Dingin! Besi dingin itu keras kepala, seperti Tedsky.', streak: 'Nah. Tanganmu mulai mendengar.', start: 'Pas. Warna jerami. Sekarang dengarkan aku menghitung.', quench: 'Celup! Tunggu warnanya, jangan tunggu keberanianmu.' };
  function playTempa(opts, cb) {
    var S = shell('FreeYork &middot; Dok Legenda', 'Tempa Pengait');
    S.cb = cb;
    var AUTO = !!opts.__autoplay, W = 900, H = 460;
    S.body.innerHTML = '<div class="ltg-hud"><span>Tahap <b class="tp-ph">1</b> / 3 &middot; <span class="tp-name">Panaskan</span></span><span>Ketukan <b class="tp-n">0</b> / 8</span><span>Skor <b class="tp-sc">0</b></span></div>';
    var C = stageCanvas(S, W, H), ctx = C.ctx;
    var msg = document.createElement('div'); msg.className = 'tsg-msg'; msg.innerHTML = '<b>Tassyaaa:</b> ' + tassy('"Warna jerami. Jangan putih."') + ' Tahan ububan sampai besi berwarna <b>kuning jerami</b>, lalu ketuk palu tepat di zona hijau. Terakhir, celup sekali saat warnanya oranye-kuning.'; S.body.appendChild(msg);
    var pad = document.createElement('div'); pad.className = 'ltg-pad';
    pad.innerHTML = '<button class="btn hold" type="button" data-b="1">Ububan &middot; tahan</button><button class="btn btn-gold" type="button" data-s="1">Ketuk palu</button>';
    S.body.appendChild(pad);
    var keys = document.createElement('div'); keys.className = 'ltg-keys'; keys.innerHTML = 'Tahan <kbd>Shift</kbd> atau <kbd>Q</kbd> untuk ububan &middot; <kbd>Spasi</kbd> untuk palu &amp; celup'; S.body.appendChild(keys);
    var G = { ph: 1, h: 0.18, bell: false, t: 0, n: 0, strikes: [], burns: 0, burning: false, cold: 0, streak: 0, quenchT: 0, qpts: null, score: 0, t0: Date.now(), last: 0, sparks: [], flash: 0, lift: 0, swingT: 0, autoT: 0, done: false };
    var PERIOD = 1.45;
    var bBtn = pad.querySelector('[data-b]'), sBtn = pad.querySelector('[data-s]');
    function setBell(on) { G.bell = on; bBtn.classList.toggle('on', on); }
    S.on(bBtn, 'pointerdown', function (e) { e.preventDefault(); setBell(true); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { S.on(bBtn, ev, function () { setBell(false); }); });
    S.on(sBtn, 'pointerdown', function (e) { e.preventDefault(); act(); });
    S.on(C.cv, 'pointerdown', function (e) { var p = C.pt(e); if (p.x < W * 0.28) setBell(true); else act(); });
    S.on(C.cv, 'pointerup', function () { setBell(false); });
    S.on(window, 'keydown', function (e) {
      if (e.repeat && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === 'Shift' || e.key === 'q' || e.key === 'Q') { setBell(true); e.preventDefault(); }
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'f' || e.key === 'F') { e.preventDefault(); act(); }
    }, true);
    S.on(window, 'keyup', function (e) { if (e.key === 'Shift' || e.key === 'q' || e.key === 'Q') setBell(false); }, true);
    function say(t, cls) { msg.className = 'tsg-msg ' + (cls || ''); msg.innerHTML = t; }
    function hud() {
      S.body.querySelector('.tp-ph').textContent = G.ph; S.body.querySelector('.tp-name').textContent = ['', 'Panaskan', 'Tempa', 'Celup'][G.ph] || 'Selesai';
      S.body.querySelector('.tp-n').textContent = G.n; S.body.querySelector('.tp-sc').textContent = Math.max(0, Math.round(total()));
    }
    function total() { var s = G.strikes.reduce(function (a, b) { return a + b; }, 0) + (G.qpts || 0) - G.burns * 10 - G.cold * 5; return s; }
    function zoneW() { return 0.14 + 0.26 * clamp((G.h - 0.3) / 0.55, 0, 1); }
    function markerPos() { return Math.sin(G.swingT / PERIOD * Math.PI * 2); }
    function spark(n, x, y) { for (var i = 0; i < n; i++) G.sparks.push({ x: x, y: y, vx: (Math.random() - 0.5) * 420, vy: -Math.random() * 380, l: 0.4 + Math.random() * 0.5, a: 0 }); }
    function act() {
      if (G.done) return;
      if (G.ph === 1) { if (G.h >= 0.72 && G.h <= 1) startForge(); else say(G.h > 1 ? tassy('"' + TASSY_TAU.hot + '"') : 'Besinya belum <b>kuning jerami</b> (sekarang ' + heatName(G.h) + '). Tahan ububan.'); return; }
      if (G.ph === 2) { strike(); return; }
      if (G.ph === 3 && G.qpts == null) { quench(); }
    }
    function startForge() { G.ph = 2; G.swingT = 0; au('page'); say(tassy('"' + TASSY_TAU.start + '"')); hud(); }
    function strike() {
      var p = markerPos(), w = zoneW(), pts = 0, cold = G.h < 0.3;
      au('dig'); G.flash = 1; spark(cold ? 4 : 22, 470, 268);
      if (cold) { G.cold++; G.streak = 0; say(tassy('"' + TASSY_TAU.cold + '"'), 'bad'); }
      else if (Math.abs(p) <= w * 0.4) { pts = 8; G.streak++; say(G.streak >= 3 ? tassy('"' + TASSY_TAU.streak + '"') : '<b>Tepat!</b> Besi mengalah di bawah palu.', 'good'); }
      else if (Math.abs(p) <= w) { pts = 5; G.streak = 0; say('Dekat. Palunya sedikit ' + (p > 0 ? 'terlambat' : 'terlalu cepat') + '.'); }
      else { G.streak = 0; say('Meleset. Palu memantul dari landasan.', 'bad'); }

      if (G.n >= 8) { G.ph = 3; G.lift = 0; G.h = Math.max(G.h, 1.0); G.quenchT = 0; say(tassy('"' + TASSY_TAU.quench + '"') + ' Ketuk sekali saat warnanya <b>oranye-kuning</b>.'); }
      hud();
    }
    function quench() {
      var h = G.h, pts = (h >= 0.6 && h <= 0.78) ? 20 : (h >= 0.52 && h <= 0.86) ? 10 : 0;
      G.qpts = pts; au(pts >= 20 ? 'coin' : 'splash'); spark(30, 770, 330);
      say(pts >= 20 ? '<b>Ssssh!</b> Uap putih menyembur. Warnanya pas.' : pts ? 'Uap menyembur. Hampir pas.' : (h > 0.86 ? 'Terlalu cepat: besinya akan getas.' : 'Terlalu lambat: besinya lunak.'), pts >= 20 ? 'good' : pts ? '' : 'bad');
      setTimeout(finish, 1300); hud();
    }
    function finish() {
      if (G.done) return; G.done = true;
      var clean = G.burns === 0 && G.cold === 0, sc = clamp(Math.round(total() + (clean ? 16 : 0)), 0, 100);
      var grade = sc >= 90 ? 'sempurna' : sc >= 70 ? 'baik' : sc >= 50 ? 'kasar' : 'retak';
      var tep = G.strikes.filter(function (x) { return x === 8; }).length, dek = G.strikes.filter(function (x) { return x === 5; }).length;
      var GL = { sempurna: ['Sempurna', '"…Kakekku akan cemburu."'], baik: ['Baik', '"Bagus. Rantainya akan menangis."'], kasar: ['Kasar', '"Ini akan bekerja. Tapi rantai Tedsky akan tertawa dulu sebelum patah."'], retak: ['Retak', '"Besi tidak berbohong. Tanganmu terburu-buru."'] }[grade];
      au(grade === 'retak' ? 'error' : 'victory');
      pad.remove(); keys.remove();
      S.body.insertAdjacentHTML('beforeend', '<div class="ltg-card"><div class="s">Mutu pengait</div><div class="g">' + GL[0] + '</div><div class="q">' + tassy(GL[1]) + '</div>' +
        '<div class="rows"><div><span>Ketukan tepat / dekat</span><b>' + tep + ' / ' + dek + '</b></div><div><span>Celup</span><b>' + (G.qpts || 0) + ' / 20</b></div>' +
        '<div><span>Kerapian</span><b>' + (clean ? '+16' : (G.burns ? 'terbakar ' + G.burns + '× ' : '') + (G.cold ? 'besi dingin ' + G.cold + '×' : '')) + '</b></div><div><span>Skor</span><b>' + sc + ' / 100</b></div></div></div>');
      finishBtn(S, grade === 'retak' ? 'Pengait patah di bak air' : 'Angkat pengait', { win: grade !== 'retak', grade: grade, score: sc, duration: Date.now() - G.t0, kind: 'tempa' });
    }
    function update(dt) {
      G.t += dt;
      if (AUTO && !G.done) { // pemain bot: pompa sampai jerami, ketuk saat penanda di tengah, celup di warna pas
        G.autoT += dt;
        if (G.ph === 1) setBell(G.h < 0.8); else if (G.ph === 2) { setBell(G.h < 0.72); if (Math.abs(markerPos()) < zoneW() * 0.2 && G.autoT > 0.4) { G.autoT = 0; act(); } }

      if (G.ph <= 2) {

        G.h = clamp(G.h, 0, 1.06);
        if (G.h > 1.0 && !G.burning) { G.burning = true; G.burns++; au('error'); say(tassy('"' + TASSY_TAU.hot + '"') + ' (-10)', 'bad'); hud(); }
        if (G.h < 0.97) G.burning = false;
        if (G.ph === 2) G.swingT += dt;
      } else if (G.ph === 3) {
        G.lift = Math.min(1, G.lift + dt * 1.6);
        if (G.lift >= 1 && G.qpts == null) { G.h -= 0.2 * dt; if (G.h < 0.2) { G.qpts = 0; say('Besinya sudah dingin di udara. Tidak dicelup.', 'bad'); setTimeout(finish, 900); } }
      }

      G.sparks = G.sparks.filter(function (s) { return s.a < s.l; });
    }
    function draw() {
      var t = G.t;
      var bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1c0e08'); bg.addColorStop(1, '#090403'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#e8c878'; ctx.font = '600 14px Cinzel, Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText(G.bell ? 'UBUBAN' : 'tahan', 120, 238);

    function k() { return stage.getBoundingClientRect().width / 1000; }
    function oil() { return clamp(1 - used / LIMIT, 0, 1); }
    function radius() { var sm = stage.getBoundingClientRect().width < 600 ? 1.3 : 1; return (38 + 60 * oil()) * sm; }
    function size() { var r = stage.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
    function hole(x, y, rad, a) { var g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, 'rgba(0,0,0,' + a + ')'); g.addColorStop(0.55, 'rgba(0,0,0,' + (a * 0.8) + ')'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.3); ctx.fill(); }
    function draw() {
      var r = stage.getBoundingClientRect(), K = k(), rad = radius();
      ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, r.width, r.height);
      ctx.fillStyle = 'rgba(6,3,1,.995)'; ctx.fillRect(0, 0, r.width, r.height);
      ctx.globalCompositeOperation = 'destination-out';
      var flick = oil() < 0.2 ? 0.6 + 0.4 * Math.abs(Math.sin(Date.now() / 110)) : 1;
      hole(lx * K, ly * K, rad * K, flick);
      JJ.clues.forEach(function (c) { if (found[c.id]) hole(c.x * K, c.y * K, c.r * 1.5 * K, 0.7); });
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(255,190,110,.35)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(lx * K, ly * K, (rad - 2) * K, 0, 6.3); ctx.stroke();
      JJ.clues.forEach(function (c) { if (!found[c.id]) return; ctx.strokeStyle = 'rgba(150,230,170,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c.x * K, c.y * K, (c.r + 6) * K, 0, 6.3); ctx.stroke(); });
      batEl.style.width = Math.round(oil() * 100) + '%'; batEl.style.background = oil() > 0.45 ? '#e8c878' : oil() > 0.2 ? '#e89a48' : '#e0503a';
    }
    function pt(e) { var r = svg.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 1000, y: (e.clientY - r.top) / r.height * 600 }; }
    S.on(stage, 'pointermove', function (e) { if (phase !== 'search') return; var p = pt(e); lx = p.x; ly = p.y; draw(); });
    S.on(stage, 'pointerdown', function (e) {
      if (phase !== 'search') return;
      var p = pt(e), touch = e.pointerType === 'touch', moved = Math.hypot(p.x - lx, p.y - ly);
      lx = p.x; ly = p.y;
      if (touch && moved > radius() * 0.9) { used += 0.5; draw(); return; }
      var tol = touch ? 10 : 4, best = null, bd = 1e9;
      JJ.clues.forEach(function (c) { if (found[c.id]) return; var d = Math.hypot(c.x - p.x, c.y - p.y); if (d < c.r + tol && d < bd) { bd = d; best = c; } });
      if (best) {
        found[best.id] = 1; var idx = nFound; nFound++; au('coin'); nEl.textContent = nFound;
        var li = list.querySelector('[data-i="' + idx + '"]'); li.classList.add('got'); li.querySelector('.ck').textContent = '✓';
        li.querySelector('span:last-child').innerHTML = '<b>' + esc(best.t) + '.</b> ' + best.th;
        msg.className = 'tsg-msg good'; msg.innerHTML = best.th;
        if (nFound >= N) startDeduce();
      } else {
        var dec = null; JJ.decoys.forEach(function (c) { if (!dec && Math.hypot(c.x - p.x, c.y - p.y) < c.r + tol) dec = c; });
        if (dec) { var again = seenDecoy[dec.x]; seenDecoy[dec.x] = 1; msg.className = 'tsg-msg'; msg.innerHTML = (again ? '<i>Sudah kau periksa.</i> ' : '') + dec.th; used += again ? 7 : 5; }
        else { msg.className = 'tsg-msg'; msg.innerHTML = ['Tidak ada apa-apa di situ.', 'Hanya debu karat.', 'Kosong.', 'Bukan apa-apa.'][Math.floor(Math.random() * 4)]; used += 4; }
        au('page');
      }

    });
    function startDeduce() {
      phase = 'deduce'; au('success');
      var qi = 0, allOk = true;
      function ask() {
        var D = JJ.deduce[qi];
        msg.className = 'tsg-msg'; msg.innerHTML = '<b>Lima jejak.</b> Sekarang rangkai, <b>sekali saja</b>.<br><span class="tsg-clue">Penalaran ' + (qi + 1) + ' / 2</span><br>' + D.q;
        var row = S.body.querySelector('.jj-ans'); if (row) row.remove();
        row = document.createElement('div'); row.className = 'tsg-row jj-ans'; row.style.flexDirection = 'column'; row.style.alignItems = 'stretch';
        row.innerHTML = shuffle(D.opts.map(function (o, i) { return i; })).map(function (i) { return '<button class="btn btn-ghost-ink" type="button" data-o="' + i + '" style="text-align:left;white-space:normal;color:#f4e7c8;border-color:rgba(232,200,120,.45)">' + esc(D.opts[i].t) + '</button>'; }).join('');
        msg.parentNode.insertBefore(row, msg.nextSibling);
        Array.prototype.forEach.call(row.children, function (b) {
          b.onclick = function () {
            var o = D.opts[+b.getAttribute('data-o')]; row.remove();
            if (!o.ok) allOk = false;

            msg.className = 'tsg-msg ' + (o.ok ? 'good' : 'bad');
            msg.innerHTML = (o.ok ? '<b>Ya.</b> ' : '<b>Bukan.</b> Jawabannya: <b>' + esc(D.opts.filter(function (x) { return x.ok; })[0].t) + '</b>. ') + D.why;
            qi++;
            if (qi < JJ.deduce.length) S.timers.push(setTimeout(ask, 3200));
            else S.timers.push(setTimeout(function () { finishBtn(S, 'Keluar dari bengkel', { win: true, correct: allOk, kind: 'jejak' }); }, 900));
          };
        });
      }
      S.timers.push(setTimeout(ask, 2000));
    }
    S.timers.push(setInterval(function () { if (phase === 'search') { used += 0.12; if (oil() <= 0 && !S.dimmed) { S.dimmed = true; msg.className = 'tsg-msg bad'; msg.innerHTML = '<b>Minyak lentera hampir habis.</b> Nyalanya tinggal sebesar kuku. Kau harus mendekat untuk melihat.'; } } draw(); }, 120));
    S.on(window, 'resize', size); setTimeout(size, 30);
  }

  var KINDS = { tempa: playTempa, selam: playSelam, lab: playLab, sandi: playSandi, jejak: playJejak };
  function open(kind, opts, cb) {
    var f = KINDS[kind];
    if (!f) { if (cb) setTimeout(function () { cb({ cancelled: true, error: 'unknown' }); }, 0); return; }
    try { if (window.MTAudio && MTAudio.unlock) MTAudio.unlock(); } catch (e) { }
    curAuto = !!(opts && opts.__autoplay);
    try { f(opts || {}, function (res) { if (cb) cb(res || { cancelled: true }); }); }
    catch (e) { console.warn('[MTGames4]', kind, e); if (cur) cur.close(true); if (cb) cb({ cancelled: true, error: String(e) }); }
  }
  function isOpen() { return !!cur; }
  return { open: open, isOpen: isOpen, heatCol: heatCol };
})();
