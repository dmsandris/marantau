  .jt-card .row { font-size: .84em; display: flex; gap: 8px; } .jt-card .row b { min-width: 74px; color: #3a5a7a; font-weight: 600; }
  .jt-card .ket { margin-top: 6px; font-size: .8em; color: #3a5a7a; font-weight: 600; }
  .jt-card ul { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 3px; }
  .jt-card li { position: relative; line-height: 1.35; }
  .jt-card li.print { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: .08em; }
  .jt-card li.hand { font-family: "Segoe Script", "Bradley Hand", "Comic Sans MS", cursive; font-size: 1.04em; color: #1d2a5a; }
  .jt-card li.big { font-size: 1.5em; transform: rotate(-6deg); transform-origin: left; color: #1a3a1a; margin: 2px 0 4px 10px; }
  .jt-card li.stamp { display: inline-block; justify-self: start; font: 700 .9em "Courier New", monospace; letter-spacing: .14em; padding: 1px 8px; border: 2px solid currentColor; border-radius: 3px; transform: rotate(-4deg); opacity: .85; }
  .jt-card li.red { color: #b0281e; } .jt-card li.blue { color: #1e4aa0; }
  .jt-card li.final { font-weight: 700; color: #102a5a; font-size: 1.12em; }
  .jt-card li.x::after { content: ''; position: absolute; left: -2px; right: -2px; top: 52%; height: 2px; background: #1d2a5a; transform: rotate(-2deg); transform-origin: left; }
  .jt-card li.new { animation: jtInk .9s ease-out both; }
  .jt-card li.stamp.new { animation: jtStamp .45s cubic-bezier(.3,1.6,.6,1) both; }

  @keyframes jtInk { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  @media (prefers-reduced-motion: reduce) { .jt-card li.new, .jt-card li.stamp.new, .jt-card li.newx::after { animation: none; } }

<script>
/* =====================================================================

 * ===================================================================== */
var JTQ = (function () {
  function eraKini() { return !(state && state.pasir && state.pasir.era && state.pasir.era !== 'kini'); }

  function fmt(n) { return typeof formatGold === 'function' ? formatGold(n) : String(n); }
  var gameOpen = false;

  /* ---------- tokoh ---------- */
  var FACE = {};
  function robot() { try { if (window.WW && WW.robotSvg) return WW.robotSvg([255, 196, 110], '#2a2418'); } catch (e) { } return ''; }
  function apAt(city, fem) { var k = city + '|bankir'; if (!FACE[k]) { try { FACE[k] = MTFace.npc(k, 'bankir', fem); } catch (e) { FACE[k] = null; } } return FACE[k]; }

    ap.age = 0.95; ap.head = 'peci'; ap.eye = 'glasses'; ap.outfit = 'koko'; ap.neck = 'chain'; ap.facial = 2; ap.hair = 5;
    return (FACE.dorus = ap);
  }
  function anakAp() {
    if (FACE.anak) return FACE.anak;
    var ap; try { ap = MTFace.npc('anak-kamp-pemulung-ikn', 'lapau', 0); ap.age = 0.02; ap.head = 'none'; } catch (e) { ap = null; }
    return (FACE.anak = ap);
  }
  function who(k) {
    switch (k) {
      case 'b09': return { name: 'B-09', title: 'Unit Kas, Marie Regal', svg: robot() };
      case 'kopdas': return { name: 'Manager Kopdas', title: 'Bank Mahkota', ap: apAt('empeer_depeer', 0) };
      case 'lukas': return { name: 'Pak Lukas', title: 'Bank Rantai, FreeYork', ap: apAt('freeyork', 0) };
      case 'tarni': return { name: 'Bu Tarni', title: 'Pengurus Koperasi, Otoland', ap: apAt('otoland', 1) };
      case 'rizal': return { name: 'Uda Rizal', title: 'Bank Saudagar, Sunda Empire', ap: apAt('sunda_empire') };
      case 'bayu': return { name: 'Mas Bayu', title: 'Rentenir, TooGood', ap: apAt('toogood') };
      case 'liong': return { name: 'Koh Liong', title: 'Penjaga Brankas, Bank Runtuh IKN', ap: apAt('ikn') };
      case 'dorus': return { name: 'Ki Dorus', title: 'Balai Kongsi, Pelabuhan Rantai Lama', ap: dorusAp() };
      case 'anak': return { name: 'Anak Kamp Pemulung', title: 'IKN', ap: anakAp() };
    }
    try { return npc_('bankir'); } catch (e) { return { name: 'Bankir', title: '', ap: apAt(cid()) }; }
  }
  function face(n) { if (n.svg) return n.svg; try { return MTFace.svg(n.ap, { bgColors: ['#3a5a3a', '#14200e'] }); } catch (e) { return ''; } }

  /* ---------- pembantu tampilan (pola sama dengan Duneks.html) ---------- */
  function speech(n, text, extra) {
    return '<div class="qg-card"><div class="qg-face">' + face(n) + '</div><div class="qg-body"><div class="qg-name">' + esc_(n.name) + ' <span>&middot; ' + esc_(n.title || '') + '</span></div>' +
      '<div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function narr(kicker, text, extra, icon) { return '<div class="cb-narr"><div class="cn-k">' + ic(icon || 'bank') + esc_(kicker || '') + '</div>' + text + (extra || '') + '</div>'; }
  function actions(b) { return '<div class="qg-actions">' + b + '</div>'; }
  function btn(id, icon, label, gold) { return '<button class="btn ' + (gold === false ? '' : 'btn-gold') + '" data-jt="' + id + '">' + (icon ? ic(icon) + '&nbsp; ' : '') + label + '</button>'; }
  function dots(i, n) { var h = ''; for (var k = 0; k < n; k++) h += '<i class="' + (k === i ? 'on' : '') + '"></i>'; return '<div class="qt-dots">' + h + '</div>'; }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function insertTop(html) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    var old = c.querySelector('.jt-wrap'); if (old) old.remove();
    var anchor = c.querySelector('.ph');
    var wrap = document.createElement('div'); wrap.className = 'jt-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function showModal(html) {
    currentPanel = null; setModal_(html);
    var box = document.getElementById('modalBox'); if (box) { box.classList.remove('size-wide'); box.classList.add('size-mid'); box.scrollTop = 0; }
    document.getElementById('modalOverlay').classList.add('open');
  }
  function modalWrap(title, sub, icon) { showModal(panelHeader_(icon || 'bank', title, sub)); return insertTop('<div></div>'); }
  function close() { try { closeModal(); } catch (e) { try { document.getElementById('modalOverlay').classList.remove('open'); } catch (e2) { } } }
  function cityLabel() { try { return cityName_(cid()); } catch (e) { return ''; } }

  // halaman bertahap. list: string (pembicara utama) | {n: kunci tokoh, t, card} | {narr, t, icon, card}
  // card = langkah Kartu Taksiran yang digambar di bawah halaman itu (null = tidak ada kartu)
  function pages(w, mainKey, list, lastBtns, bind) {
    var i = 0;
    function show() {
      var last = i === list.length - 1, pg = list[i], txt = (pg && pg.t) || pg;
      var nav = actions(last ? (lastBtns || '') : btn('next', null, 'Lanjut')) + (list.length > 1 ? dots(i, list.length) : '');
      var extra = pg && pg.card != null ? cardHtml(pg.card) : '';
      w.innerHTML = pg && pg.narr ? narr(pg.narr, txt + extra, nav, pg.icon) : speech(who((pg && pg.n) || mainKey), txt + extra, nav);
      try { au_(pg && pg.sfx || 'page'); } catch (e) { }
      if (!last) on(w, '[data-jt=next]', function () { i++; show(); }); else if (bind) bind(w);
    }
    show();
  }
  function apply(r) {
    r = r || {};
    if (r.jtq !== undefined && state) state.jtq = r.jtq;
    if (r.newGold != null && typeof patchGold_ === 'function') { try { patchGold_(r.newGold); if (typeof renderSidebar === 'function') renderSidebar(); } catch (e) { } }
    if (r.gotong && state) {
      state.gotong = r.gotong;
      try { var k = r.gotong.ikn && r.gotong.ikn.kat; if (k && typeof metaMax_ === 'function') { metaMax_('grgive', 1); metaMax_('grkat', k); } } catch (e) { }
    }
    if (typeof invalidatePanelCache_ === 'function') try { invalidatePanelCache_(); } catch (e) { }
  }
  function call(act, s, res, ok, b, fail) {
    if (b) b.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      apply(r);
      try { ok(r || {}); } catch (e) { console.warn('[JTQ]', e); }
    }).withFailureHandler(function (e) {
      if (b) b.disabled = false;
      var m = (e && e.message) || String(e);
      showToast(m, 'error');
      if (/bergeser/.test(m)) refresh();
      if (fail) try { fail(m); } catch (x) { }
    }).api_jtq(act, s, res == null ? '' : res);
  }
  function refresh() {
    google.script.run.withSuccessHandler(function (r) { if (r && r.jtq !== undefined && state) state.jtq = r.jtq; }).withFailureHandler(function () { }).api_jtq('status');
  }

  /* =====================================================================
   * Kartu Taksiran Nasabah J.T. (§5 konsep). Isi kolom Keterangan bertambah per langkah;
   * tulisan lama dicoret, tidak dihapus. card(n) = keadaan kartu setelah langkah n selesai ditulis.
   * ===================================================================== */
  function entries(n) {
    var e = [];
    e.push({ t: 'PENCURI', c: 'print', note: '(dugaan sistem)', x: n >= 2 });
    if (n >= 1) e.push({ t: 'ANCAMAN DUNIA', c: 'stamp red', x: n >= 9 });
    if (n >= 2) e.push({ t: 'penabung?', c: 'hand' });
    if (n >= 3) e.push({ t: 'pemberi', c: 'hand' });
    if (n >= 4) { e.push({ t: 'kadet', c: 'hand', s: 4 }); e.push({ t: 'berhenti &mdash; ?', c: 'hand', s: 4 }); }
    if (n >= 5) { e.push({ t: 'jujur', c: 'hand', s: 5 }); e.push({ t: '&ldquo;buruk untuk usaha&rdquo;', c: 'hand', s: 5 }); }
    if (n >= 6) { e.push({ t: 'anak di kolom yang kusesali', c: 'hand', s: 6 }); if (jalur() === 'dewan') e.push({ t: 'lupa', c: 'hand', s: 6 }); }
    if (n >= 6.5 && jalur() === 'ikn') e.push({ t: 'LUPA', c: 'hand big', s: 6.5 });
    if (n >= 7) e.push({ t: 'DITOLAK', c: 'stamp blue', s: 7 });
    if (n >= 9) e.push({ t: 'orang baik &middot; tersakiti', c: 'hand final', s: 9 });
    return e;
  }
  var STEP_OF = { 'PENCURI': 0, 'ANCAMAN DUNIA': 1, 'penabung?': 2, 'pemberi': 3 };
  function cardHtml(n) {
    var list = entries(n).map(function (x) {
      var s = x.s != null ? x.s : STEP_OF[x.t];
      var fresh = s === n, strikeNow = x.x && ((x.t === 'PENCURI' && n === 2) || (x.t === 'ANCAMAN DUNIA' && n === 9));
      return '<li class="' + x.c + (x.x ? ' x' : '') + (fresh ? ' new' : '') + (strikeNow ? ' newx' : '') + '">' + x.t + (x.note ? ' <small style="font-weight:400;opacity:.7">' + x.note + '</small>' : '') + '</li>';
    }).join('');
    return '<div class="jt-card" role="img" aria-label="Kartu Taksiran Nasabah J.T."><div class="kop"><span>Unit Kas B-09</span><span>Taksiran Nasabah</span></div>' +
      '<div class="row"><b>Nasabah</b> J.T.</div><div class="row"><b>Rekening</b> lintas pulau, tidur</div><div class="row"><b>Saldo</b> melebihi laut</div>' +
      '<div class="ket">Keterangan:</div><ul>' + list + '</ul></div>';
  }

      '<text x="210" y="82" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#ff8a70" opacity=".7">J.T. ............ 9.9E+99</text>' +
      '<rect x="190" y="102" width="40" height="22" fill="#2a3440"/><rect x="150" y="124" width="120" height="8" rx="3" fill="#3a4a5a"/>' +

    var tajam = '<svg viewBox="0 0 130 64" aria-hidden="true"><path d="M22 12q16-4 22 0q-6 2-8 18q-2 20-16 24q-8 1-6-6" stroke="#2a1a0a" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="50" cy="48" r="1.6" fill="#2a1a0a"/>' +
      '<path d="M58 16q24-8 40 0M80 12q-4 18-8 40q8-6 30-8" stroke="#2a1a0a" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="108" cy="46" r="1.6" fill="#2a1a0a"/><path d="M14 58h104" stroke="#8a6a3a" stroke-width=".8" stroke-dasharray="3 3"/></svg>';

  function doc(html) { return '<div class="jt-doc">' + html + '</div>'; }
  function rewardHtml(icon, text) { return '<div class="jt-reward">' + ic(icon) + '<div>' + text + '</div></div>'; }

    return jalur() === 'ikn' ? '"Pemiliknya? Kita tahu di mana ia. Sedang mengecat burung perunggu itu, dua jalan dari sini."'
      : '"Pemiliknya? Kita tahu di mana ia. Sedang menarik tali lonceng di kota rantai."';

  /* ---------- mini game ---------- */
  function lib(kind) {

  // Olah Jejak: brankas Bank Runtuh IKN (adegan & jejak sendiri, §8.5 konsep)
  function vaultScene() {
    var s = '<defs><linearGradient id="jtV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a20"/><stop offset="1" stop-color="#0a0e0a"/></linearGradient></defs>';

    for (var m = 0; m < 22; m++) s += '<ellipse cx="' + ((m * 137) % 1000) + '" cy="' + (20 + (m * 71) % 140) + '" rx="' + (20 + m % 5 * 6) + '" ry="7" fill="#3a5a2a" opacity=".45"/>';

    // pintu brankas bundar
    s += '<circle cx="180" cy="270" r="130" fill="#3a3e36" stroke="#1a1c18" stroke-width="10"/><circle cx="180" cy="270" r="96" fill="#2e322a" stroke="#4a4e44" stroke-width="4"/>';
    for (var k = 0; k < 6; k++) { var a = k * Math.PI / 3; s += '<line x1="180" y1="270" x2="' + (180 + Math.cos(a) * 70) + '" y2="' + (270 + Math.sin(a) * 70) + '" stroke="#6a6e60" stroke-width="7"/>'; }
    s += '<circle cx="180" cy="270" r="18" fill="#6a6e60"/>';

      glow(ctx, gx - m * 0.03, gy - m * 0.25, m * 0.12, '255,210,140', 0.35 * sm(3, 7, t));

      ctx.fillStyle = 'rgba(255,210,150,' + (0.08 * dawn).toFixed(3) + ')'; ctx.fillRect(0, horizon, W, (H - horizon) * 0.3);

      var up = sm(0.5, 2.6, t), px = W * 0.3, base = H * 0.86, ph = m * 0.3 * up;
      ctx.fillStyle = '#4a3220'; ctx.fillRect(px - m * 0.008, base - ph, m * 0.016, ph);
      if (up > 0.6) {
        var bw = m * 0.26, bh2 = m * 0.07, by = base - ph - bh2 * 0.4;

        ctx.globalAlpha = sm(1.6, 2.6, t); ctx.fillText('RESTORASI', px, by - bh2 / 2); ctx.globalAlpha = 1;
      }
      // keping kadet ditanam (kilau di kaki tiang)
      var plant = sm(6, 7.5, t);
      if (plant > 0) { glow(ctx, px, base, m * 0.08, '230,230,220', 0.7 * plant * (0.7 + 0.3 * Math.sin(t * 4))); ctx.fillStyle = '#d8d8d0'; ctx.beginPath(); ctx.ellipse(px, base - m * 0.006, m * 0.012, m * 0.005, 0, 0, 6.3); ctx.fill(); }

      bankers.forEach(function (bk, i2) {
        var u = U.clamp((t - bk.d) / 1.4, 0, 1); if (u <= 0) return;

        ctx.globalAlpha = u;
        ctx.fillStyle = 'rgba(14,12,12,.95)';
        if (bk.robot) { ctx.fillRect(x - h * 0.16, y + h * 0.02, h * 0.32, h * 0.28); ctx.fillStyle = 'rgba(255,196,110,.9)'; ctx.fillRect(x - h * 0.09, y + h * 0.12, h * 0.18, h * 0.05); ctx.fillStyle = 'rgba(14,12,12,.95)'; }

        ctx.fillStyle = '#7a5232'; ctx.fillRect(x - h * 0.13, y + h * 0.48, h * 0.26, h * 0.16); ctx.strokeStyle = '#c9a450'; ctx.lineWidth = 1; ctx.strokeRect(x - h * 0.13, y + h * 0.48, h * 0.26, h * 0.16);

      });
      // anak-anak bersorak
      var run = sm(6.5, 9, t);
      kids.forEach(function (kd) {
        var x = W * (kd.x + run * 0.1), jump = REDUCE ? 0 : Math.max(0, Math.sin(t * 7 + kd.ph)) * m * 0.022 * sm(7.5, 8.5, t), h = m * 0.06 * kd.h, y = base - h - jump;

      });

    }
