        narr('Perahu tanpa bendera', '<p>Saat asap pertempuran tersibak, sebuah perahu tanpa bendera merapat tanpa suara. Krunya mengambil peti a\'dik dari palkamu &mdash; tanpa sepatah kata pun &mdash; lalu menghilang ke dalam gelap. Kapalmu berbalik pulang.</p>', '', 'moon') +
        speech(n.adik, 'Di tempat peti itu tadi, tertinggal secarik kertas bertinta emas:<blockquote class="qg-clue">"Mereka semua akan berkumpul di satu titik: BarSaTi, dan armada putih yang mengaku keadilan. Kau tak bisa menghadapinya sendirian, Kapten. Kumpulkan sisa keberanian dunia ini. &mdash; a."</blockquote>', null, 'Surat bertinta emas') +
        '<div class="qg-next">' + ic('flag') + ' Bentuk <b>Armada Terakhir</b>.</div>' + journal() + actions('<button class="btn btn-gold" onclick="closeModal()">Tutup</button>'));
      return true;
    }
    if (prev === 9 && cur === 10 && atPusaran()) {
      showModal(panelHeader_('shield', 'Dendam Gaul-Wash', 'Gerbang benteng') +
        speech(N().gala, 'Uda Gala sendiri yang melompat ke geladak kapal curian itu. Ia menarik Hasiolan dari balik puing &mdash; dan tak berkata apa-apa. Hanya menyelimuti bahu wakilnya dengan jubahnya sendiri, untuk kedua kalinya.', null, 'Armada Skitraw') +
        '<div class="qg-next">' + ic('flag') + ' Gerbang benteng terbuka.</div>' + actions('<button class="btn btn-gold" data-bx="up">' + ic('flag') + '&nbsp; Naik ke geladak benteng</button>'));
      on(document.getElementById('modalContent'), '[data-bx=up]', function (b) { deckScene(b); });
      return true;
    }
    if (prev === 12 && cur === 13) { setTimeout(function () { ramScene(); }, 300); return true; }
    if (prev === 14 && cur === 15) { setTimeout(sinkScene, 300); return true; }
    if (prev < 16 && cur >= 16) return true;
    if (cur >= 8 && cur <= 14 && atPusaran()) { renderPusaran(); return true; }
    return false;
  }
  wrap_('applyFreshState_', function (args, before) {
    var s = st(), cur = s ? (s.step || 0) : null, prev = prevStep;
    prevStep = cur;
    if (!s) return;
    checkPatrol();
    var tries = 0;
    setTimeout(function later() {
      if (!state || !st()) return;
      if (busyUi()) {
        if (prev !== cur && prev != null && tries++ < 40) setTimeout(later, 1000); // transisi jangan sampai hilang
        return;
      }
      if (transition(prev, cur)) return;
      if (!docked()) return;
      if (shoutNow() && cid() === 'ikn') { garudaEvent(); return; }
      shoutOnDock();
      if (atPusaran() && cur >= 7 && cur <= 15) {
        if (cur === 7 && !seen('maelstrom')) {
          markSeen('maelstrom');
          if (currentPanel) closeModal();
          cine('bx_maelstrom', [
            'Langit berubah <b>ungu pekat</b>. Angin melolong dari segala arah, dan laut mulai berputar di bawah lunasmu.',
            'Di tengah lautan, sebuah <b>pusaran air raksasa</b> selebar pulau mengaum seperti rahang raksasa. Petir biru menyambar tanpa henti, menerangi puing-puing kapal yang berputar.',
            'Di pusatnya, sebuah kapal kuno berlapis baja <b>dirantai pada tebing karang yang melayang</b> melawan gravitasi: <b>Kapal Raja Bjorneo</b> &mdash; kini Benteng Berjalan BarSaTi.',
            'Di sekelilingmu, lentera-lentera <b>Armada Terakhir</b> menyala satu per satu. Mereka menunggu aba-abamu.'
          ], function () { renderPusaran(); });
        } else if (prev !== cur || !currentPanel) { if (!currentPanel) showToast('Pusaran Bjorneo. Armada Terakhir menunggu aba-abamu.', 'info'); }
        return;
      }
      if (done()) {
        metaMax_('bxjustice', 1); metaMax_('bxmaelstrom', 1); metaMax_('bxbrother', 1);
        if (!seen('epilogue') && prev != null && prev < 16) { /* epilog sudah dijalankan oleh alur pilihan */ }
      }
    }, 900);
  });

  /* ---------- Tanda Jasa ---------- */
  if (typeof ACH !== 'undefined' && ACH.push) ACH.push(
    { id: 'bx_justice', t: 3, ic: 'shield', n: 'Penghancur Keadilan Buta', d: 'Tenggelamkan Absolute Justice dan tumbangkan Capt Satnislaus S di Pusaran Bjorneo.', g: function (m) { return [m.c.bxjustice || 0, 1]; } },
    { id: 'bx_maelstrom', t: 3, ic: 'wind', n: 'Legenda Maelstrom', d: 'Arungi Pusaran Air Bjorneo mengikuti jalur cahaya Mahkota Karam.', g: function (m) { return [m.c.bxmaelstrom || 0, 1]; } },
    { id: 'bx_brother', t: 3, ic: 'star', n: 'Saudara Keempat', d: 'Tabuh pukulan terakhir genderang empat penabuh di geladak Black Pearl.', g: function (m) { return [m.c.bxbrother || 0, 1]; } }
  );
  wrap_('renderCharacterSheetWith_', function () {
    var sec = document.getElementById('achSection'); if (!sec) return;
    sec.querySelectorAll('.ach-card.got').forEach(function (cd) {
      var b = cd.querySelector('.ach-body b');
      if (!b || b.textContent !== 'Saudara Keempat' || cd.querySelector('.bx-replay')) return;
      var d = document.createElement('div'); d.className = 'bx-replay'; d.innerHTML = '<button class="btn btn-sm">' + ic('star') + '&nbsp; Putar ulang kredit</button>';
      cd.querySelector('.ach-body').appendChild(d);
      d.querySelector('button').onclick = function (ev) { ev.stopPropagation(); playCredits(); };
    });
  });

  if (window.CITY_LORE) {
    // gosip pasca-quest dimasukkan lewat rumors_ (CITY_LORE TooGood ditimpa ulang oleh QT setiap state baru)
  }
  return { N: N, journal: journal, poster: posterHtml, pusaran: renderPusaran, credits: playCredits, epilogue: epilogue, choice: showChoice, world: window.bxWorld_ };
})();
