      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.moveTo(x0 + span * 0.1, top); ctx.lineTo(x0 + span * 0.9, top); ctx.lineTo(x0 + span * 0.86, top - rh * 0.22); ctx.lineTo(x0 + span * 0.14, top - rh * 0.22); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,200,0.25)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(tips[0][0], tips[0][1]);
      for (var q2 = 1; q2 < tips.length; q2++) { var mx2 = (tips[q2 - 1][0] + tips[q2][0]) / 2; ctx.quadraticCurveTo(mx2, top - rh * 0.3, tips[q2][0], tips[q2][1]); }
      ctx.stroke();
    } else if (type === 'thatch') {
      ctx.beginPath(); ctx.moveTo(x - ov * 1.4, top + rh * 0.08); ctx.lineTo(x + w / 2, top - rh * 1.2); ctx.lineTo(x + w + ov * 1.4, top + rh * 0.08); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(80,55,20,0.4)'; ctx.lineWidth = 0.7;
      for (var j = 0; j < 6; j++) { var fx = x - ov + (w + ov * 2) * j / 6; ctx.beginPath(); ctx.moveTo(fx, top + rh * 0.08); ctx.lineTo(x + w / 2, top - rh * 1.1); ctx.stroke(); }
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.moveTo(x + w / 2, top - rh * 1.2); ctx.lineTo(x + w + ov * 1.4, top + rh * 0.08); ctx.lineTo(x + w / 2, top + rh * 0.08); ctx.closePath(); ctx.fill();
    } else if (type === 'dome') {
      var rr = w * 0.42;
      ctx.fillRect(x + w * 0.12, top - rh * 0.3, w * 0.76, rh * 0.3);
      ctx.beginPath(); ctx.arc(x + w / 2, top - rh * 0.3, rr, Math.PI, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(x + w / 2 - rr * 0.25, top - rh * 0.3 - rr * 0.35, rr * 0.35, 0, 6.3); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x + w / 2, top - rh * 0.3 - rr); ctx.lineTo(x + w / 2, top - rh * 0.3 - rr - rh * 0.5); ctx.stroke();
      ctx.fillStyle = '#e8c35a'; ctx.beginPath(); ctx.arc(x + w / 2, top - rh * 0.3 - rr - rh * 0.5, 1.6, 0, 6.3); ctx.fill();
    } else if (type === 'pagoda') {
      for (var tier = 0; tier < 3; tier++) {

        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(tx - tw * 0.18, ty); ctx.quadraticCurveTo(tx - tw * 0.05, ty - rh * 0.08, tx + tw * 0.12, ty - rh * 0.42);
        ctx.lineTo(tx + tw * 0.88, ty - rh * 0.42); ctx.quadraticCurveTo(tx + tw * 1.05, ty - rh * 0.08, tx + tw * 1.18, ty);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(tx - tw * 0.1, ty - 1.2, tw * 1.2, 1.2);
      }
    } else if (type === 'shack') {
      var lean = (r() - 0.5) * rh * 0.6;
      ctx.beginPath(); ctx.moveTo(x - ov, top + 1); ctx.lineTo(x - ov * 0.5, top - rh * 0.55 + lean); ctx.lineTo(x + w + ov, top - rh * 0.25 - lean); ctx.lineTo(x + w + ov, top + 1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 0.6;
      for (var p = 0; p < 4; p++) { var sx = x + w * p / 4; ctx.beginPath(); ctx.moveTo(sx, top); ctx.lineTo(sx + 1, top - rh * 0.4); ctx.stroke(); }
    }
  }

  function building(ctx, b, S, r) {
    var x = b.x, base = b.base, w = b.w, h = b.h;
    if (b.stilt) {
      ctx.strokeStyle = '#4a3320'; ctx.lineWidth = Math.max(1, w * 0.05);
      ctx.beginPath();
      for (var sp = 0; sp < 4; sp++) { var sx = x + w * (0.1 + sp * 0.27); ctx.moveTo(sx, base); ctx.lineTo(sx, b.ground); }
      ctx.stroke();
    }
    if (b.roof !== 'ruin') {
      ctx.fillStyle = b.wall; ctx.fillRect(x, base - h, w, h);
    } else {
      // tembok runtuh: tepi atas bergerigi
      ctx.fillStyle = b.wall;
      ctx.beginPath(); ctx.moveTo(x, base);
      ctx.lineTo(x, base - h * (0.7 + r() * 0.3));
      var steps = 5;
      for (var i = 1; i <= steps; i++) ctx.lineTo(x + w * i / steps, base - h * (0.45 + r() * 0.55));
      ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(40,30,20,0.35)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(x + w * 0.3, base - h * 0.5); ctx.lineTo(x + w * 0.4, base - h * 0.3); ctx.lineTo(x + w * 0.35, base - h * 0.1); ctx.stroke();
    }
    // sisi gelap (kesan 3D) + sokle
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fillRect(x + w * 0.78, base - h, w * 0.22, h);
    ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.fillRect(x, base - h * 0.1, w, h * 0.1);
    // jendela
    var rows = Math.max(1, Math.floor(h / (S * 0.85))), cols = Math.max(1, Math.floor(w / (S * 0.62)));
    var ww = Math.max(1.5, S * 0.2), wh = Math.max(2, S * 0.3);
    for (var rr = 0; rr < rows; rr++) {
      for (var c = 0; c < cols; c++) {
        if (b.roof === 'ruin' && r() < 0.5) continue;
        var wx = x + (c + 0.5) * (w * 0.78) / cols + w * 0.04 - ww / 2;
        var wy = base - h + (rr + 0.3) * h / rows;
        if (wy + wh > base - 1) continue;
        ctx.fillStyle = 'rgba(30,22,16,0.8)'; ctx.fillRect(wx, wy, ww, wh);
        if (b.roof !== 'ruin' && r() < 0.62) b.wins.push({ x: wx, y: wy, w: ww, h: wh, ph: r() * 6.28, on: 0.35 + r() * 0.65 });
      }
    }
    if (b.roof !== 'ruin') roof(ctx, b.roof, x, base - h, w, b.rh, b.roofCol, r);
  }

  function palm(ctx, x, y, h, r, colA, colB) {
    var lean = (r() - 0.5) * h * 0.5;
    ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = Math.max(1.4, h * 0.06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * 0.2, y - h * 0.5, x + lean, y - h); ctx.stroke();
    var tx = x + lean, ty = y - h;
    for (var i = 0; i < 7; i++) {
      var a = -Math.PI / 2 + (i - 3) * 0.55 + (r() - 0.5) * 0.2;
      var len = h * (0.45 + r() * 0.2);
      var ex = tx + Math.cos(a) * len, ey = ty + Math.sin(a) * len * 0.55 + len * 0.3;
      ctx.strokeStyle = i % 2 ? colA : colB; ctx.lineWidth = Math.max(1.2, h * 0.07);
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo((tx + ex) / 2, ty - len * 0.25, ex, ey); ctx.stroke();
    }
    ctx.fillStyle = '#5a3c20'; ctx.beginPath(); ctx.arc(tx, ty + 1, h * 0.05, 0, 6.3); ctx.fill();
    ctx.lineCap = 'butt';
  }

  function tree(ctx, x, y, s, colArr, r) {
    var col = U.css(colArr);
    ctx.fillStyle = U.css(colArr.map(function (v) { return v * 0.78; }));
    ctx.beginPath(); ctx.arc(x, y, s, 0, 6.3); ctx.arc(x + s * 0.8, y + s * 0.2, s * 0.8, 0, 6.3); ctx.arc(x - s * 0.7, y + s * 0.25, s * 0.75, 0, 6.3); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x - s * 0.15, y - s * 0.2, s * 0.8, 0, 6.3); ctx.arc(x + s * 0.5, y - s * 0.05, s * 0.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,220,0.12)'; ctx.beginPath(); ctx.arc(x - s * 0.35, y - s * 0.45, s * 0.35, 0, 6.3); ctx.fill();
  }

  function lighthouse(ctx, x, base, h, ruined) {
    var w0 = h * 0.2, w1 = h * 0.12;
    ctx.fillStyle = '#efe9dc';
    ctx.beginPath(); ctx.moveTo(x - w0 / 2, base); ctx.lineTo(x - w1 / 2, base - h); ctx.lineTo(x + w1 / 2, base - h); ctx.lineTo(x + w0 / 2, base); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = ruined ? '#8f8674' : '#b23a2a';
    for (var i = 0; i < 3; i++) ctx.fillRect(x - w0, base - h * (0.2 + i * 0.28), w0 * 2, h * 0.12);
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(x + w1 * 0.1, base - h, w0, h);
    ctx.restore();
    if (ruined) {
      ctx.fillStyle = '#efe9dc';
      ctx.beginPath(); ctx.moveTo(x - w1 / 2, base - h); ctx.lineTo(x - w1 * 0.2, base - h - h * 0.08); ctx.lineTo(x + w1 * 0.1, base - h - h * 0.02); ctx.lineTo(x + w1 / 2, base - h); ctx.closePath(); ctx.fill();
      return null;
    }
    ctx.fillStyle = '#2b2622'; ctx.fillRect(x - w1 * 0.75, base - h - 2, w1 * 1.5, 2.5);
    ctx.fillStyle = '#ffe6a0'; ctx.fillRect(x - w1 * 0.45, base - h - h * 0.12, w1 * 0.9, h * 0.1);
    ctx.fillStyle = '#b23a2a';
    ctx.beginPath(); ctx.moveTo(x - w1 * 0.6, base - h - h * 0.12); ctx.lineTo(x, base - h - h * 0.22); ctx.lineTo(x + w1 * 0.6, base - h - h * 0.12); ctx.closePath(); ctx.fill();

  }

  /* -------------------- generator kota -------------------- */
  function buildLand(inst) {
    inst.fireflies = null; if (inst.portersQ) inst.portersQ.length = 0;
    var W = inst.W, H = inst.H, dpr = inst.dpr;
    var cfg = TOWN[inst.cityType] || TOWN.TradeHub;
    var r = U.rng(U.hashStr(inst.cityId || inst.cityType || 'x'));
    var shoreY = inst.shoreY, landEnd = inst.landEnd;
    var S = Math.max(9, H * 0.03); // unit bangunan (px)

    var cv = inst.landCv || document.createElement('canvas');
    cv.width = Math.ceil(W * dpr); cv.height = Math.ceil((shoreY + S * 0.8) * dpr);
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, shoreY + S);

    var builder = window.MTCities && MTCities.get(inst.cityId);
    if (builder) { buildSignature(inst, cv, ctx, S, r, builder); return; }

    var ph = [r() * 6, r() * 6, r() * 6], baseH = H * cfg.hillH;
    function hillY(x) {
      var u = Math.min(1, x / landEnd);
      var env = Math.pow(Math.cos(u * Math.PI / 2), 0.85);
      var n = Math.sin(x * 0.011 + ph[0]) * 0.18 + Math.sin(x * 0.027 + ph[1]) * 0.1 + Math.sin(x * 0.061 + ph[2]) * (cfg.rocky ? 0.12 : 0.04);
      var head = Math.exp(-Math.pow((u - 0.9) / 0.06, 2)) * H * 0.05;
      return shoreY - S * 0.9 - baseH * env * (0.78 + n) - head;
    }
    inst.hillY = hillY;

    // ---- bukit
    ctx.beginPath(); ctx.moveTo(0, shoreY + S);
    for (var x = 0; x <= landEnd; x += 4) ctx.lineTo(x, hillY(x));
    ctx.quadraticCurveTo(landEnd + S * 1.2, shoreY - S * 1.5, landEnd + S * 2.2, shoreY + S * 0.2);
    ctx.lineTo(landEnd + S * 2.2, shoreY + S); ctx.closePath();
    var hg = ctx.createLinearGradient(0, shoreY - baseH * 1.3, 0, shoreY);
    hg.addColorStop(0, cfg.hill[0]); hg.addColorStop(1, cfg.hill[1]);
    ctx.fillStyle = hg; ctx.fill();
    ctx.save(); ctx.clip();
    if (cfg.terraces) {
      for (var k = 1; k < 14; k++) {
        ctx.strokeStyle = k % 2 ? 'rgba(255,255,200,0.16)' : 'rgba(40,70,20,0.2)'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var tx = 0; tx <= landEnd; tx += 6) { var ty = hillY(tx) + k * S * 0.32; if (tx === 0) ctx.moveTo(tx, ty); else ctx.lineTo(tx, ty); }
        ctx.stroke();
      }
    }
    if (cfg.rocky) {
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
      for (var q = 0; q < 26; q++) { var rx = r() * landEnd, ry = hillY(rx) + r() * S * 3; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + S * (0.5 + r()), ry + S * 0.4); ctx.lineTo(rx + S * (1 + r()), ry + S * 0.2); ctx.stroke(); }
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      for (var q2 = 0; q2 < 18; q2++) { var rx2 = r() * landEnd; ctx.beginPath(); ctx.moveTo(rx2, hillY(rx2)); ctx.lineTo(rx2 + S * 1.5, hillY(rx2 + S * 1.5) + S * 2); ctx.lineTo(rx2 - S * 0.5, hillY(rx2) + S * 2.5); ctx.fill(); }
    }
    ctx.restore();

    // ---- pohon di bukit (lapis belakang)
    var treeCol = cfg.rocky ? '#4a5a3a' : (cfg.hill[0]);
    for (var ti = 0; ti < cfg.trees; ti++) {
      var tx2 = r() * landEnd * 0.98, ty2 = hillY(tx2) + S * (0.3 + r() * 2.2);
      if (ty2 > shoreY - S * 1.6) continue;
      if (cfg.mist || inst.cityType === 'Agricultural') palm(ctx, tx2, ty2 + S * 0.4, S * (1.1 + r() * 0.9), r, '#3f7a3a', '#2f5e2c');
      else tree(ctx, tx2, ty2, S * (0.35 + r() * 0.35), U.mix(U.hex(treeCol), [30, 60, 30], 0.35 + r() * 0.3), r);
    }

    // ---- bangunan
    var wins = [], torches = [], flags = [], smokes = [];
    var rows = [];
    function addRow(yBaseFn, xFrom, xTo, scale, prob) {
      var x0 = xFrom;
      while (x0 < xTo) {
        var w = S * (1.1 + r() * 1.3) * scale * (cfg.ruins ? 1.1 : 1);
        if (r() < prob) {
          var base = yBaseFn(x0 + w / 2);
          var rt = U.pick(r, cfg.roofTypes);
          var b = {
            x: x0, w: w, base: base, h: S * (1.2 + r() * 1.6) * scale * (rt === 'dome' ? 1.2 : 1),
            roof: rt, rh: S * (0.7 + r() * 0.5) * scale, wall: U.pick(r, cfg.walls), roofCol: U.pick(r, cfg.roofs), wins: []
          };
          if (rt === 'stilt') { b.stilt = true; b.ground = base + S * 0.9; b.base = base; b.h *= 0.7; }
          rows.push(b);
          if (r() < 0.12 && rt !== 'ruin') smokes.push({ x: x0 + w * 0.7, y: base - b.h - b.rh * 0.5 });
        }
        x0 += w + S * (0.05 + r() * 0.35) / Math.max(0.3, cfg.density);
      }
    }
    // baris bukit (paling belakang)
    addRow(function (cx) { return Math.min(shoreY - S * 2.8, hillY(cx) + S * 1.2); }, S * 0.5, landEnd * 0.72, 0.8, 0.5 * cfg.density);
    addRow(function () { return shoreY - S * 1.55; }, S * 0.3, landEnd * 0.86, 0.95, 0.75 * cfg.density);
    addRow(function () { return shoreY - S * 0.62; }, S * 0.1, landEnd * 0.9, 1.05, 0.85 * Math.min(1, cfg.density + 0.15));
    rows.sort(function (a, b) { return a.base - b.base; });

    // landmark istana (Capital) - rumah gadang megah di tengah
    if (cfg.palace) {
      var pw = S * 7, px = landEnd * 0.34, pb = shoreY - S * 1.9;
      rows.push({ x: px, w: pw, base: pb, h: S * 2.4, roof: 'gonjong', rh: S * 1.6, wall: '#fbf6ea', roofCol: '#2e7d7a', wins: [], landmark: true });
      rows.push({ x: px + pw * 0.3, w: pw * 0.4, base: pb - S * 2.4 - S * 0.4, h: S * 1.3, roof: 'gonjong', rh: S * 1.2, wall: '#f4eee2', roofCol: '#c9a033', wins: [], landmark: true });
      flags.push({ x: px + pw * 0.5, y: pb - S * 5.8, h: S * 1.6, col: '#c9a033' });
      rows.push({ x: landEnd * 0.62, w: S * 1.6, base: shoreY - S * 1.3, h: S * 4.2, roof: 'dome', rh: S * 1, wall: '#f1e8d6', roofCol: '#c9a033', wins: [] });
    }
    if (inst.cityType === 'TradeHub') {
      rows.push({ x: landEnd * 0.44, w: S * 1.3, base: shoreY - S * 1.4, h: S * 4.6, roof: 'hip', rh: S * 1.3, wall: '#e8d8b8', roofCol: '#7d3322', wins: [], clock: true });
    }
    if (cfg.ruins) {
      rows.push({ x: landEnd * 0.36, w: S * 3.6, base: shoreY - S * 1.8, h: S * 2.2, roof: 'dome', rh: S * 1.2, wall: '#c3b79f', roofCol: '#8a8474', wins: [], broken: true });
    }

    for (var bi = 0; bi < rows.length; bi++) {
      var bb = rows[bi];
      building(ctx, bb, S, r);
      if (bb.clock) {
        ctx.fillStyle = '#f4ecd8'; ctx.beginPath(); ctx.arc(bb.x + bb.w * 0.45, bb.base - bb.h * 0.78, bb.w * 0.32, 0, 6.3); ctx.fill();
        ctx.strokeStyle = '#3a2a18'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bb.x + bb.w * 0.45, bb.base - bb.h * 0.78); ctx.lineTo(bb.x + bb.w * 0.45, bb.base - bb.h * 0.78 - bb.w * 0.22); ctx.moveTo(bb.x + bb.w * 0.45, bb.base - bb.h * 0.78); ctx.lineTo(bb.x + bb.w * 0.6, bb.base - bb.h * 0.76); ctx.stroke();
        flags.push({ x: bb.x + bb.w * 0.45, y: bb.base - bb.h - bb.rh * 0.8 - S * 1.2, h: S * 1.2, col: '#b3552f' });
      }
      if (bb.broken) {
        // kubah tergigit - hapus potongan dengan destination-out
        ctx.save(); ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath(); ctx.arc(bb.x + bb.w * 0.72, bb.base - bb.h - bb.rh * 0.3 - bb.w * 0.25, bb.w * 0.2, 0, 6.3); ctx.fill();
        ctx.restore();
      }
      for (var wi = 0; wi < bb.wins.length; wi++) wins.push(bb.wins[wi]);
      if (!bb.landmark && r() < 0.14 && bb.roof !== 'ruin') flags.push({ x: bb.x + bb.w * 0.5, y: bb.base - bb.h - bb.rh - S * 0.9, h: S * 0.9, col: U.pick(r, cfg.flags) });
    }

    // pilar / kolom reruntuhan
    if (cfg.ruins) {
      for (var ci = 0; ci < 7; ci++) {
        var cx2 = landEnd * (0.55 + ci * 0.035), ch = S * (2.4 - (ci % 3 === 1 ? 1.4 : 0) - r() * 0.6);
        ctx.fillStyle = '#d6cbb2'; ctx.fillRect(cx2, shoreY - S * 0.6 - ch, S * 0.42, ch);
        ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(cx2 + S * 0.28, shoreY - S * 0.6 - ch, S * 0.14, ch);
        if (ci % 3 !== 1) { ctx.fillStyle = '#e2d8c0'; ctx.fillRect(cx2 - S * 0.1, shoreY - S * 0.6 - ch - S * 0.2, S * 0.62, S * 0.2); }
      }
      // sulur tanaman merambat
      ctx.strokeStyle = 'rgba(70,110,50,0.8)'; ctx.lineWidth = 1.2;
      for (var vi = 0; vi < 40; vi++) { var vx = r() * landEnd * 0.9, vy = shoreY - S * (0.8 + r() * 3); ctx.beginPath(); ctx.moveTo(vx, vy); ctx.quadraticCurveTo(vx + S * 0.3, vy + S * 0.5, vx - S * 0.1, vy + S * (0.8 + r())); ctx.stroke(); }
    }

    // ---- tepi pantai
    if (cfg.shore === 'quay' || cfg.shore === 'fort') {
      var qTop = shoreY - S * 0.62;
      ctx.fillStyle = cfg.shore === 'fort' ? '#d9ceb4' : '#a89a80';
      ctx.fillRect(0, qTop, landEnd * 0.98, shoreY - qTop + S * 0.3);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      for (var bx = 0; bx < landEnd * 0.98; bx += S * 0.8) { ctx.fillRect(bx, qTop, 1, shoreY - qTop); }
      ctx.fillRect(0, qTop + (shoreY - qTop) * 0.5, landEnd * 0.98, 1);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, qTop, landEnd * 0.98, 1.4);
      if (cfg.shore === 'fort') {
        for (var cr = 0; cr < landEnd * 0.98; cr += S * 0.7) { ctx.fillStyle = '#e6dcc4'; ctx.fillRect(cr, qTop - S * 0.3, S * 0.4, S * 0.3); }
        for (var tw = 1; tw < 4; tw++) {
          var twx = landEnd * tw * 0.24;
          ctx.fillStyle = '#e8dec8'; ctx.fillRect(twx, qTop - S * 1.6, S * 1.1, S * 1.6 + (shoreY - qTop));
          ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(twx + S * 0.8, qTop - S * 1.6, S * 0.3, S * 1.6 + (shoreY - qTop));
          for (var cc = 0; cc < 3; cc++) { ctx.fillStyle = '#efe6d2'; ctx.fillRect(twx + cc * S * 0.42, qTop - S * 1.9, S * 0.26, S * 0.3); }
          flags.push({ x: twx + S * 0.55, y: qTop - S * 3, h: S * 1.1, col: U.pick(r, cfg.flags) });
          torches.push({ x: twx + S * 0.55, y: qTop - S * 1.7 });
        }
      }
      // derek kayu (TradeHub)
      if (inst.cityType === 'TradeHub') {
        for (var cn = 0; cn < 2; cn++) {

  /* -------------------- render per frame -------------------- */
  function render(inst, p, dt) {
    var ctx = inst.ctx, W = inst.W, H = inst.H, t = inst.t, dpr = inst.dpr;
    updateCam(inst, dt);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var hy = inst.horizonY;
    var storm = p.weather === 'storm_surge' || p.weather === 'encounter';

    if (!inst.milky || inst._milkyW !== Math.ceil(W) || inst._milkyH !== Math.ceil(hy)) { inst.milky = MTSky.makeMilky(W, hy); inst._milkyW = Math.ceil(W); inst._milkyH = Math.ceil(hy); }
    MTSky.paintSky(ctx, W, hy, p, t, inst.stars, inst.milky);
    if (inst.mode === 'port') paintRainbow(inst, ctx, W, hy, p);
    setLayer(inst, 0.15, 0.3);
    MTSky.paintClouds(ctx, W, hy, p, inst.clouds, dt, storm ? 3 : 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (storm || p.mood === 'gloom') {
      ctx.fillStyle = U.css(p.cloudD, p.mood === 'gloom' ? 0.5 : 0.35); ctx.fillRect(0, 0, W, hy * 0.5);
    }

    if (inst.mode === 'port') renderPort(inst, p, dt, ctx, W, H, hy, t);
    else { setLayer(inst, 1, 1); renderSea(inst, p, dt, ctx, W, H, hy, t); }

    setLayer(inst, 0.3, 0.5);
    if (!storm || inst.mode !== 'port') {

        var gx = gl.x * W, gy = gl.y * hy + Math.sin(t * 0.7 + gl.ph) * 6, gs = gl.s * Math.max(5, H * 0.009);
        var flap = Math.sin(t * 6 + gl.ph) * gs * 0.5;
        ctx.beginPath(); ctx.moveTo(gx - gs, gy - flap); ctx.quadraticCurveTo(gx - gs * 0.4, gy - gs * 0.4, gx, gy); ctx.quadraticCurveTo(gx + gs * 0.4, gy - gs * 0.4, gx + gs, gy - flap); ctx.stroke();

      if (inst.shoot) {
        var so = inst.shoot; so.u += dt / 700;
        var hx = so.x + Math.cos(so.a) * so.l * so.u, hyy = so.y + Math.sin(so.a) * so.l * so.u * 0.5;
        var tx0 = hx - Math.cos(so.a) * so.l * 0.35, ty0 = hyy - Math.sin(so.a) * so.l * 0.35 * 0.5;
        var sg = ctx.createLinearGradient(tx0, ty0, hx, hyy);
        var fa = Math.sin(Math.min(1, so.u) * Math.PI);
        sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(255,250,230,' + (0.9 * fa * p.night).toFixed(3) + ')');
        ctx.strokeStyle = sg; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(tx0, ty0); ctx.lineTo(hx, hyy); ctx.stroke();

    }

          ctx.beginPath(); for (var bI = 0; bI < inst._bolt.length; bI++) { var bp = inst._bolt[bI]; if (!bI) ctx.moveTo(bp[0], bp[1]); else ctx.lineTo(bp[0], bp[1]); } ctx.stroke();

    postFX(inst, p, ctx, W, H, hy, t, storm);
  }

  function hills(B, o) {

      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;

  function bld(B, o) {
