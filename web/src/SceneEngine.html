  /** Lambang di tengah bendera. */

    // ---- tepi pantai

      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(0, qTop, landEnd * 0.98, 1.4);
      if (cfg.shore === 'fort') {

        for (var tw = 1; tw < 4; tw++) {

          ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(twx + S * 0.8, qTop - S * 1.6, S * 0.3, S * 1.6 + (shoreY - qTop));
          for (var cc = 0; cc < 3; cc++) { ctx.fillStyle = '#efe6d2'; ctx.fillRect(twx + cc * S * 0.42, qTop - S * 1.9, S * 0.26, S * 0.3); }
          flags.push({ x: twx + S * 0.55, y: qTop - S * 3, h: S * 1.1, col: U.pick(r, cfg.flags) });

      }
      // derek kayu (TradeHub)

          ctx.beginPath(); ctx.moveTo(cxn, qTop); ctx.lineTo(cxn + S * 0.5, qTop - S * 2.6); ctx.lineTo(cxn + S * 1, qTop); ctx.moveTo(cxn + S * 0.5, qTop - S * 2.6); ctx.lineTo(cxn + S * 2.4, qTop - S * 2.2); ctx.stroke();
          ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(cxn + S * 2.3, qTop - S * 2.2); ctx.lineTo(cxn + S * 2.3, qTop - S * 1.1); ctx.stroke();
          ctx.fillStyle = '#8a6238'; ctx.fillRect(cxn + S * 2.05, qTop - S * 1.1, S * 0.5, S * 0.42);

    } else if (cfg.shore === 'beach') {

      // jukung ditarik ke pantai
      MTShip.jukung(ctx, landEnd * 0.3, shoreY - S * 0.3, S * 0.05, 1, 0, null);
    } else if (cfg.shore === 'rocks') {
      ctx.fillStyle = '#3a3633';
      ctx.beginPath(); ctx.moveTo(0, shoreY + S * 0.3);
      for (var rk = 0; rk <= landEnd + S * 2; rk += S * 0.5) ctx.lineTo(rk, shoreY - S * (0.3 + r() * 0.7));
      ctx.lineTo(landEnd + S * 2, shoreY + S * 0.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      for (var rk2 = 0; rk2 < 20; rk2++) { var rkx = r() * landEnd; ctx.fillRect(rkx, shoreY - S * 0.6, S * 0.3, 1); }
      // dermaga reyot

    }

    // bangkai kapal (Outlaw)
    if (cfg.wreck) {
      ctx.save(); ctx.translate(landEnd * 0.62, shoreY - S * 0.15); ctx.rotate(-0.28);
      ctx.fillStyle = '#3a2a1e';
      ctx.beginPath(); ctx.moveTo(-S * 2.4, 0); ctx.quadraticCurveTo(0, S * 0.9, S * 2.2, -S * 0.3); ctx.lineTo(S * 1.6, -S * 0.9); ctx.lineTo(-S * 2.2, -S * 0.7); ctx.closePath(); ctx.fill();

    }

    // Festival - untaian lampion (posisi disimpan, digambar dinamis)
    var lanterns = [];
    for (var ls = 0; ls < 2; ls++) {

      for (var li = 0; li <= 12; li++) { var u = li / 12; lanterns.push({ x: U.lerp(lx0, lx1, u), y: ly + Math.sin(u * Math.PI) * S * 0.8, c: U.pick(r, ['#ff5a3c', '#ffd24a', '#ff8a2a', '#e8483a']) }); }

    var GEN = [['market', 'Pasar', 'scales'], ['tasks', 'Kantor Gubernur', 'scroll'], ['cargo', 'Gudang', 'warehouse'], ['bank', 'Bank', 'bank'], ['library', 'Pustaka', 'book'], ['tavern', 'Lapau', 'cup'], ['ship', 'Galangan', 'wrench']];
    var hotspots = cand.map(function (b, i) { return { id: GEN[i][0], label: GEN[i][1], icon: GEN[i][2], x: b.x, y: b.base - b.h - b.rh, w: b.w, h: b.h + b.rh }; });

  /** Kota bersignature (MTCities) - lihat blok MTCities di bawah. */
  function buildSignature(inst, cv, ctx, S, r, builder) {
    var W = inst.W, H = inst.H, landEnd = inst.landEnd, shoreY = inst.shoreY;
    var B = { ctx: ctx, W: W, H: H, S: S, u: Math.min(S * 1.3, landEnd * 0.97 / 30), shoreY: shoreY, landEnd: landEnd, hy: inst.horizonY, r: r,
      wins: [], torches: [], flags: [], smokes: [], hotspots: [], moored: [], dyn: [], walk: null, roamers: null, coral: false, lagoon: false, noLamps: false };
    B.qTop = shoreY - B.u * 0.62;
    builder(B);
    inst.hillY = B.hillY;
    var lanterns = [];
    for (var ls = 0; ls < 2; ls++) {
      var lx0 = landEnd * (0.06 + ls * 0.46), lx1 = lx0 + landEnd * 0.36, ly = B.qTop - B.u * (2.4 + ls * 0.5);
      for (var li = 0; li <= 12; li++) { var uu = li / 12; lanterns.push({ x: U.lerp(lx0, lx1, uu), y: ly + Math.sin(uu * Math.PI) * B.u * 0.8, c: U.pick(r, ['#ff5a3c', '#ffd24a', '#ff8a2a', '#e8483a']) }); }
    }
    inst.land = { S: B.u, wins: B.wins, torches: B.torches, flags: B.flags, smokes: B.smokes, beam: null, lanterns: lanterns, cfg: {}, hotspots: B.hotspots, moored: B.moored, dyn: B.dyn, roamers: B.roamers, coral: B.coral, lagoon: B.lagoon, noLamps: B.noLamps, sig: true };
    // penghuni api unggun (duduk)
    B.dyn.forEach(function (d) { if (d.type === 'campfire' && !d.noPeople) { var rr = U.rng(99); d.people = [0, 1, 2].map(function (i) { var o = MTPeople.make(rr, 'pirates'); o.sit = true; o.dx = [-1.6, 1.4, -0.2][i]; o.dir = i === 1 ? -1 : 1; return o; }); } });
    // pesta api unggun Paradiso: penari berkain + penabuh kendang
    B.dyn.forEach(function (d) {
      if (d.type !== 'party') return;
      var rp = U.rng(777);
      d.people = [];
      for (var i = 0; i < 7; i++) { var o = MTPeople.make(rp, 'resort'); o.carry = 'none'; o.dance = true; if (i % 3 !== 2) { o.fem = true; o.hat = 'flower'; o.kain = o.kain || '#e0457a'; } d.people.push(o); }
      var dr = MTPeople.make(rp, 'resort'); dr.fem = false; dr.kain = null; dr.hat = 'none'; dr.carry = 'none'; dr.sit = true; d.drummer = dr;
    });

  }

  function initWalkers(inst, walk, u, y) {
    inst.walkers = [];
    if (!walk) return;
    var r = U.rng(U.hashStr((inst.cityId || 'x') + 'walk'));
    for (var i = 0; i < walk.n; i++) {
      var o = MTPeople.make(r, walk.style);
      o.x = walk.x0 + r() * (walk.x1 - walk.x0);
      o.dir = r() < 0.5 ? 1 : -1;
      o.v = (o.bike ? 2.2 : 0.45 + r() * 0.35) * u / 1000;
      o.h = u * (0.95 + r() * 0.25);
      o.lane = r() < 0.5 ? 0 : 1;
      o.ph = r() * 6; o.pause = r() < 0.3 ? r() * 3000 : 0;
      o.x0 = walk.x0; o.x1 = walk.x1;
      inst.walkers.push(o);
    }
    // anak-anak berlarian (lebih kecil & cepat)
    if (walk.style !== 'pirates' && walk.style !== 'scavengers') {
      for (var c = 0; c < 2; c++) {
        var k = MTPeople.make(r, 'villagers'); k.carry = 'none'; k.bike = false; k.child = true; k.hat = r() < 0.5 ? 'none' : 'cap';
        k.x = walk.x0 + r() * (walk.x1 - walk.x0); k.dir = r() < 0.5 ? 1 : -1; k.v = (1.05 + r() * 0.4) * u / 1000; k.h = u * (0.6 + r() * 0.1);
        k.lane = 0; k.ph = r() * 6; k.pause = 0; k.x0 = walk.x0; k.x1 = walk.x1;
        inst.walkers.push(k);
      }
    }
    inst.walkY = y; inst.walkU = u;
  }

  function portShipPos(inst) {
    var W = inst.W, H = inst.H;
    var narrowP = W / H < 1.05;
    var S = inst.land ? inst.land.S : Math.max(9, H * 0.03);
    var px1 = W * 0.6;
    var sc = narrowP ? Math.min(W * 0.0027, H * 0.0028) : Math.min(W * 0.00185, H * 0.0031);
    var shx = narrowP ? W * 0.66 : Math.min(W * 0.78, px1 + S * 1.2 + 64 * sc);
    return { x: shx, y: H * (narrowP ? 0.8 : 0.84), s: sc };
  }

  function retintLand(inst, p) {
    var key = p.tint.map(function (v) { return Math.round(v / 3); }).join(',') + '|' + (p.sun ? Math.round(p.sunP * 14) : 'n');
    if (key === inst._tintKey) return;
    inst._tintKey = key;
    var c = inst.litCv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.clearRect(0, 0, inst.litCv.width, inst.litCv.height);
    c.drawImage(inst.landCv, 0, 0);
    c.globalCompositeOperation = 'multiply';
    c.fillStyle = U.css(p.tint);
    c.fillRect(0, 0, inst.litCv.width, inst.litCv.height);
    var cw = inst.litCv.width, ch = inst.litCv.height;
    // cahaya matahari dari samping: sisi yang menghadap matahari lebih terang & hangat
    if (p.sun && p.sunP > -0.02 && p.sunP < 1.02 && p.mood !== 'gloom') {
      var low = 1 - Math.sin(Math.PI * U.clamp(p.sunP, 0, 1)), sx = U.lerp(0.06, 0.94, U.clamp(p.sunP, 0, 1)) * cw;
      var lg = c.createLinearGradient(sx - cw * 0.9, 0, sx + cw * 0.9, 0);
      var warm = U.mix([255, 244, 222], [255, 190, 120], low);
      lg.addColorStop(0, 'rgba(30,40,80,' + (0.1 + low * 0.1).toFixed(3) + ')'); lg.addColorStop(0.5, U.css(warm, 0.22 + low * 0.24)); lg.addColorStop(1, 'rgba(30,40,80,' + (0.1 + low * 0.1).toFixed(3) + ')');
      c.globalCompositeOperation = 'soft-light'; c.fillStyle = lg; c.fillRect(0, 0, cw, ch);
    }
    // puncak bukit menangkap cahaya langit, kaki kota lebih teduh (kedalaman)
    var vg = c.createLinearGradient(0, 0, 0, ch);
    vg.addColorStop(0, 'rgba(255,255,255,0.14)'); vg.addColorStop(0.6, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(0,0,20,0.14)');
    c.globalCompositeOperation = 'soft-light'; c.fillStyle = vg; c.fillRect(0, 0, cw, ch);
    // atmospheric perspective: bagian atas (jauh, di bukit) lebih berkabut
    c.globalCompositeOperation = 'source-atop';
    var ag = c.createLinearGradient(0, 0, 0, ch);
    ag.addColorStop(0, U.css(p.hor, 0.15 + p.night * 0.05)); ag.addColorStop(0.55, U.css(p.hor, 0.07)); ag.addColorStop(1, U.css(p.hor, 0.03));
    c.fillStyle = ag; c.fillRect(0, 0, cw, ch);
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(inst.landCv, 0, 0);
    c.globalCompositeOperation = 'source-over';
  }

  /* -------------------- pegunungan jauh & pulau -------------------- */
  function ridge(ctx, x0, x1, base, hMax, seed, col, jag) {
    var r = U.rng(seed);
    var a = [r() * 6, r() * 6, r() * 6];
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x0, base);
    var span = x1 - x0;
    for (var x = x0; x <= x1; x += 5) {
      var u = (x - x0) / span;
      var env = Math.sin(u * Math.PI);
      var n = 0.6 + Math.sin(x * 0.008 + a[0]) * 0.25 + Math.sin(x * 0.021 + a[1]) * 0.12 + Math.sin(x * 0.05 + a[2]) * 0.04 * (jag || 1);
      ctx.lineTo(x, base - hMax * env * n);
    }
    ctx.lineTo(x1, base); ctx.closePath(); ctx.fill();
  }

  function island(ctx, cx, base, w, h, col, seed, townCol, p, t) {
    if (w < 3) return;

    // partikel (asap, percikan, kembang api, bara) - di koordinat dunia kota

      if (pt.life <= 0) { parts.splice(q, 1); continue; }
      pt.x += pt.vx * dt / 16; pt.y += pt.vy * dt / 16; pt.vy += (pt.g || 0) * dt / 16; pt.r += (pt.grow || 0) * dt / 16;

  }

  function boltPath(x, hy) {
    var pts = [[x, 0]], y = 0, xx = x;
    while (y < hy * 0.95) { y += hy * (0.05 + Math.random() * 0.08); xx += (Math.random() - 0.5) * hy * 0.12; pts.push([xx, y]); }
    return pts;
  }

  function puff(inst, x, y, o) {
    inst.particles.push({ x: x, y: y, vx: o.vx || 0, vy: o.vy || 0, g: o.g || 0, r: o.r || 2, grow: o.grow || 0, life: o.life || 1, max: o.life || 1, col: o.col || 'rgba(200,200,200,A)', a: o.a, add: o.add });
  }

  function renderPort(inst, p, dt, ctx, W, H, hy, t) {
    var land = inst.land, S = land ? land.S : 20, shoreY = inst.shoreY, landEnd = inst.landEnd;
    var seed = U.hashStr(inst.cityId || 'x');

    // pulau jauh di cakrawala kanan + kapal lewat (lapis jauh, paralaks kecil)
    setLayer(inst, 0.3, 1);
    island(ctx, W * 0.9, hy + 1, W * 0.2, H * 0.03, U.css(p.mountainFar), seed + 3, null, p, t);
    island(ctx, W * 0.77, hy + 1, W * 0.1, H * 0.018, U.css(U.mix(p.mountainFar, p.hor, 0.4)), seed + 5, null, p, t);
    if (p.lights > 0.3 && Math.sin(t * 2.2) > 0.2) { ctx.fillStyle = 'rgba(255,235,170,' + (0.9 * p.lights).toFixed(3) + ')'; ctx.fillRect(W * 0.92, hy - H * 0.022, 2, 2); }

    setLayer(inst, 1, 1);
    MTSky.paintSea(ctx, W + 44, H + 30, hy, p, t, { glitter: inst.glitter, rough: p.weather === 'storm_surge' ? 2.2 : 1, drift: 6 });

    setLayer(inst, 0.3, 1);
    for (var bs = 0; bs < inst.bgShips.length; bs++) {
      var sh = inst.bgShips[bs];
      sh.x += sh.v * dt * sh.dir; if (sh.x > 1.08) sh.x = 0.7; if (sh.x < 0.7) sh.x = 1.08;
      MTShip.draw(ctx, sh.x * W, hy + 1.5, H * 0.0017 * sh.s, { dir: sh.dir, t: t, masts: 2, hull: '#3a2a1e', sail: '#d8d0c0', lit: function (h, a) { return U.css(U.mix(U.mul(U.hex(h), p.tint), p.hor, 0.55), a); }, lanterns: p.lights });
    }

    // pegunungan jauh di balik kota (dua lapis paralaks + kabut di kaki gunung)
    setLayer(inst, 0.45, 1);
    ridge(ctx, -W * 0.08, landEnd * 1.04, hy + 2, H * 0.26, seed + 11, U.css(p.mountainFar), 1);
    var hzm = ctx.createLinearGradient(0, hy - H * 0.12, 0, hy + 2);
    hzm.addColorStop(0, U.css(p.hor, 0)); hzm.addColorStop(1, U.css(p.hor, 0.5));
    ctx.fillStyle = hzm; ctx.fillRect(-W * 0.1, hy - H * 0.12, W * 1.2, H * 0.12 + 2);
    setLayer(inst, 0.65, 1);
    ridge(ctx, -W * 0.12, landEnd * 0.72, hy + 2, H * 0.19, seed + 13, U.css(p.mountain), 1.2);
    var hzm2 = ctx.createLinearGradient(0, hy - H * 0.07, 0, hy + 2);
    hzm2.addColorStop(0, U.css(p.hor, 0)); hzm2.addColorStop(1, U.css(p.hor, 0.35));
    ctx.fillStyle = hzm2; ctx.fillRect(-W * 0.12, hy - H * 0.07, landEnd * 0.86, H * 0.07 + 2);
    if (land && land.cfg.mist) {
      var mg = ctx.createLinearGradient(0, hy - H * 0.08, 0, hy + H * 0.04);
      mg.addColorStop(0, U.css(p.hor, 0)); mg.addColorStop(0.6, U.css(U.mix(p.hor, [255, 255, 255], 0.3), 0.55)); mg.addColorStop(1, U.css(p.hor, 0));
      ctx.fillStyle = mg; ctx.fillRect(0, hy - H * 0.08, landEnd, H * 0.12);
    }

    // daratan + kota (cache ter-tint) - lapis dunia (paralaks penuh)
    setLayer(inst, 1, 1);
    if (inst.litCv) ctx.drawImage(inst.litCv, 0, 0, inst.litCv.width / inst.dpr, inst.litCv.height / inst.dpr);

    if (land) {
      var L = p.lights;
      // jendela menyala
      if (L > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < land.wins.length; i++) {
          var wn = land.wins[i];

          ctx.fillRect(wn.x, wn.y, wn.w, wn.h);

        }

      }
      // bendera berkibar

        for (var k2 = 5; k2 >= 0; k2--) { var u2 = k2 / 5; ctx.lineTo(fg.x + u2 * fw, fg.y + fh + Math.sin(t * 4 + u2 * 4 + f + 0.5) * fh * 0.25 * u2); }

      }

          else puff(inst, sm.x, sm.y, { vx: 0.12 + Math.random() * 0.1, vy: -0.25, r: S * 0.12, grow: 0.03, life: 3.5, col: U.css(U.mix(p.cloudL, [120, 120, 120], 0.5), 'A'), a: 0.35 });
        }

      renderFireflies(inst, p, ctx, t);

        bgd.addColorStop(0, 'rgba(255,240,190,' + (0.26 * intensity) + ')'); bgd.addColorStop(1, 'rgba(255,240,190,0)');
        ctx.fillStyle = bgd;
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + side * len * Math.abs(c), by - len * spread); ctx.lineTo(bx + side * len * Math.abs(c), by + len * spread * 0.6); ctx.closePath(); ctx.fill();
        var lgw = ctx.createRadialGradient(bx, by, 0, bx, by, S * 1.8);
        lgw.addColorStop(0, 'rgba(255,245,200,' + (0.9 * L) + ')'); lgw.addColorStop(1, 'rgba(255,230,160,0)');

        ctx.globalCompositeOperation = 'source-over';

        ctx.strokeStyle = p.lit('#3b2a1a', 0.6); ctx.lineWidth = 0.7;
        ctx.beginPath();
        for (var ln = 0; ln < land.lanterns.length; ln++) { var lt = land.lanterns[ln]; if (ln % 13 === 0) ctx.moveTo(lt.x, lt.y); else ctx.lineTo(lt.x, lt.y); }
        ctx.stroke();
        for (var ln2 = 0; ln2 < land.lanterns.length; ln2++) {

          if (L > 0.15) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = U.css(U.hex(l2.c), 0.25 * L); ctx.beginPath(); ctx.arc(l2.x, l2.y + 2, S * 0.35, 0, 6.3); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
          ctx.fillStyle = L > 0.15 ? l2.c : p.lit(l2.c);

        inst._fw = (inst._fw || 0) - dt / 1000;

          var fx = W * (0.08 + Math.random() * 0.55), fy = hy * (0.25 + Math.random() * 0.4);
          var fc = U.pick(Math.random, ['255,90,60', '255,210,74', '120,200,255', '255,140,220', '160,255,160']);
          for (var fp = 0; fp < 70; fp++) { var ang2 = Math.random() * 6.28, sp = 1 + Math.random() * 2.6; puff(inst, fx, fy, { vx: Math.cos(ang2) * sp, vy: Math.sin(ang2) * sp, g: 0.03, r: 1.4, life: 1.4 + Math.random() * 0.6, col: 'rgba(' + fc + ',A)', add: true }); }
        }

          fgd.addColorStop(0, 'rgba(255,160,60,' + 0.7 * fk2 + ')'); fgd.addColorStop(1, 'rgba(255,60,20,0)');
          ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = fgd; ctx.fillRect(fxx - S * 2.5, fyy - S * 2.5, S * 5, S * 5); ctx.globalCompositeOperation = 'source-over';
          if (Math.random() < 0.25) puff(inst, fxx + (Math.random() - 0.5) * S, fyy - S * 0.3, { vx: 0.15 + Math.random() * 0.2, vy: -0.5 - Math.random() * 0.3, r: S * 0.3, grow: 0.06, life: 4, col: 'rgba(50,45,45,A)', a: 0.5 });
          if (Math.random() < 0.2) puff(inst, fxx, fyy, { vx: (Math.random() - 0.5) * 0.6, vy: -0.8 - Math.random() * 0.6, r: 1, life: 1.5, col: 'rgba(255,150,50,A)', add: true });
        }

    }

    // terumbu karang di air dangkal (Bjorneo)
    if (land && land.coral) {
      var cr = U.rng(321);
      for (var ci = 0; ci < 26; ci++) {
        var cx2 = cr() * W * 0.45, cy2 = H * (0.8 + cr() * 0.2), rr2 = S * (0.3 + cr() * 0.7);
        ctx.fillStyle = U.css(U.mix(U.hex(U.pick(cr, ['#e0704a', '#e8a04a', '#c85a8a', '#7ac8a0', '#f0c860'])), p.seaD, 0.6), 0.22);
        ctx.beginPath(); for (var cb = 0; cb < 4; cb++) { ctx.moveTo(cx2 + (cb - 1.5) * rr2 * 0.5 + rr2 * 0.4, cy2); ctx.ellipse(cx2 + (cb - 1.5) * rr2 * 0.5, cy2 - (cb % 2) * rr2 * 0.2, rr2 * 0.4, rr2 * 0.18, 0, 0, 6.3); } ctx.fill();
      }
    }
    // laguna dangkal pirus + kilau kaustik (Paradiso)
    if (land && land.lagoon) {
      var lgH = (H - shoreY) * 0.55, dayK = 1 - p.night * 0.75;

          var cxa = ((ca * 97.3 + t * S * 0.4 * (ca % 2 ? 1 : -0.6)) % (landEnd * 1.05)), cya = shoreY + S * 0.4 + (ca % 6) * lgH * 0.1;

        }
        ctx.stroke();
      }
    }

    // pantulan kota di air depan (irisan bergelombang)

      var reflH = Math.min(H - shoreY, (shoreY - hy) * 1.3), step = 3;
      var srcScale = inst.dpr;
      for (var yy = 0; yy < reflH; yy += step) {

        if (srcY < 0) break;
        var dx = Math.sin(yy * 0.16 + t * 1.8) * (1 + yy * 0.035) * (p.weather === 'storm_surge' ? 2.2 : 1);
        ctx.globalAlpha = 0.34 * (1 - yy / reflH);
        ctx.drawImage(inst.litCv, 0, Math.floor(srcY * srcScale), inst.litCv.width, step * srcScale, dx, shoreY + yy, W, step);
      }
      ctx.globalAlpha = 1;
      // garis air: kilau di kaki dermaga

      // pantulan cahaya jendela
      if (land && p.lights > 0.1) {
        ctx.globalCompositeOperation = 'lighter';
        for (var wr = 0; wr < land.wins.length; wr += 2) {
          var wwn = land.wins[wr];
          if (wwn.y < shoreY - S * 3.5) continue;

          for (var sg = 0; sg < 6; sg++) {

            ctx.fillStyle = 'rgba(255,180,90,' + (0.22 * p.lights * wwn.on * (1 - sg / 6)).toFixed(3) + ')';
            ctx.fillRect(sx2, sy2, wwn.w * 1.2, rl / 9);
          }
        }
        ctx.globalCompositeOperation = 'source-over';

    }

    // kabut pagi / senja yang menggantung di atas pelabuhan
    var mistK = p.frac < 0.13 ? 1 - U.smooth(p.frac / 0.13) : (p.frac > 0.6 && p.frac < 0.74 ? Math.sin((p.frac - 0.6) / 0.14 * Math.PI) * 0.6 : 0);
    if (mistK > 0.02 && p.weather !== 'storm_surge') {

      var mg2 = ctx.createLinearGradient(0, shoreY - S * 2.2, 0, shoreY + H * 0.14);

      ctx.fillStyle = mg2; ctx.fillRect(-40 + drift, shoreY - S * 2.2, W + 80, S * 2.2 + H * 0.14);
    }

    var pdg = [[px0 - wN / 2, shoreY - S * 0.3], [px0 + wN / 2, shoreY - S * 0.3], [px1 + wF / 2, py1], [px1 - wF / 2, py1]];

    ctx.strokeStyle = p.lit(steel ? '#3c4855' : '#2a1b10'); ctx.lineWidth = Math.max(1.5, S * 0.12);
    ctx.beginPath();

    ctx.fillStyle = p.lit(steel ? '#b9c4ce' : '#7a5634');
    ctx.beginPath(); ctx.moveTo(pdg[0][0], pdg[0][1]); ctx.lineTo(pdg[1][0], pdg[1][1]); ctx.lineTo(pdg[2][0], pdg[2][1]); ctx.lineTo(pdg[3][0], pdg[3][1]); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = p.lit(steel ? '#7d8a96' : '#3b2616', 0.5); ctx.lineWidth = 0.7;
    ctx.beginPath();
    for (var pk = 1; pk < 22; pk++) { var u4 = Math.pow(pk / 22, 1.3); ctx.moveTo(U.lerp(pdg[0][0], pdg[3][0], u4), U.lerp(pdg[0][1], pdg[3][1], u4)); ctx.lineTo(U.lerp(pdg[1][0], pdg[2][0], u4), U.lerp(pdg[1][1], pdg[2][1], u4)); }
    ctx.stroke();
    ctx.fillStyle = p.lit(steel ? '#5a6672' : '#4a3220'); ctx.beginPath(); ctx.moveTo(pdg[3][0], pdg[3][1]); ctx.lineTo(pdg[2][0], pdg[2][1]); ctx.lineTo(pdg[2][0], pdg[2][1] + S * 0.2); ctx.lineTo(pdg[3][0], pdg[3][1] + S * 0.2); ctx.fill();
    if (steel) {

  /* hills: set B.hillY + gambar bukit & pepohonan */
  function hills(B, o) {
    var ctx = B.ctx, sy = B.shoreY, L = B.landEnd, H = B.H, r = B.r, S = B.S;
    var ph = [r() * 6, r() * 6, r() * 6], baseH = H * o.h * 1.3, peak = o.peak == null ? 0.35 : o.peak;
    function hillY(x) {
      var u = Math.min(1, x / L);
      var env = Math.exp(-Math.pow((u - peak) / 0.55, 2)) * (1 - Math.pow(u, 6));
      var n = Math.sin(x * 0.011 + ph[0]) * 0.14 + Math.sin(x * 0.027 + ph[1]) * 0.08 + Math.sin(x * 0.07 + ph[2]) * (o.jag || 0.03);
      var head = Math.exp(-Math.pow((u - 0.92) / 0.05, 2)) * H * (o.head || 0.035);
      return sy - S * 0.8 - baseH * env * (0.85 + n) - head;
    }

    ctx.beginPath(); ctx.moveTo(0, sy + S);
    for (var x = 0; x <= L; x += 4) ctx.lineTo(x, hillY(x));

    var g = ctx.createLinearGradient(0, sy - baseH * 1.3, 0, sy); g.addColorStop(0, o.c[0]); g.addColorStop(1, o.c[1]);
    ctx.fillStyle = g; ctx.fill();
    ctx.save(); ctx.clip();
    if (o.rocky) {
      ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
      for (var q = 0; q < 30; q++) { var rx = r() * L, ry = hillY(rx) + r() * S * 3.5; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx + S * (0.5 + r()), ry + S * 0.5); ctx.lineTo(rx + S * (1 + r()), ry + S * 0.2); ctx.stroke(); }
    }

      ctx.beginPath(); ctx.moveTo(L * 0.62, sy - S); ctx.bezierCurveTo(L * 0.5, sy - S * 3, L * 0.8, sy - S * 3.5, L * 0.72, hillY(L * 0.72) + S * 0.8); ctx.stroke();
    }
    ctx.restore();
    var col = U.hex(o.c[0]);
    // desa di lereng: rumah-rumah kecil memanjat bukit (kepadatan ala lukisan kota)
    if (o.village) {

      while (vx < L * 0.96) {

          var rt = U.pick(r, v.types);
          bld(B, { x: vx, w: vw, base: vb, h: uu * (0.8 + r() * 0.7), roof: rt, rh: uu * (0.55 + r() * 0.35), wall: U.pick(r, v.walls), roofCol: U.pick(r, v.roofs), stilt: rt === 'stilt', ground: vb + uu * 0.5 });
        }
        vx += vw + uu * (0.2 + r() * 0.9);
      }
    }
    for (var t = 0; t < (o.trees || 0); t++) {
      var tx = r() * L * 0.98, ty = hillY(tx) + S * (0.3 + r() * 2.6);
      if (ty > sy - S * 1.2) continue;
      if (o.kind === 'palm' || (o.kind === 'jungle' && r() < 0.35)) MTScene._h.palm(ctx, tx, ty + S * 0.4, S * (1 + r() * 0.9), r, '#3f7a3a', '#2f5e2c');
      else MTScene._h.tree(ctx, tx, ty, S * (0.35 + r() * 0.4), U.mix(col, [20, 50, 25], 0.3 + r() * 0.35), r);

  function bld(B, o) {
    var b = { x: o.x, w: o.w, base: o.base, h: o.h, roof: o.roof, rh: o.rh, wall: o.wall, roofCol: o.roofCol, wins: [], stilt: o.stilt, ground: o.ground };

  // SUNDA EMPIRE - "Port of Sunda": Rumah Gadang megah, gapura batu ber-kala,
  // aula kayu dua lantai dengan panji putih, rumah panggung di atas air.
  function sunda(B) {
    var u = B.u, q = B.qTop, sy = B.shoreY, ctx = B.ctx, r = B.r;
    hills(B, { c: ['#4f8b3d', '#2b5a2a'], h: 0.25, peak: 0.55, trees: 44, kind: 'jungle', village: { walls: ['#6b4a2c', '#7a5234', '#e8d9b8'], roofs: ['#3a2c24', '#2e2622'], types: ['gonjong', 'gable', 'thatch'], prob: 0.55 } });
    var gb2 = Math.min(sy - u * 3, B.hillY(u * 5) + u * 1.6);
    var g2 = bld(B, { x: u * 2.5, w: u * 5, base: gb2, h: u * 1.8, roof: 'gonjong', rh: u * 1.5, wall: '#6b4a2c', roofCol: '#34281f', stilt: true, ground: gb2 + u * 0.6 });
    carve(ctx, g2.x, gb2 - g2.h, g2.w, g2.h);
    var gx = u * 13, gw = u * 9, gb = Math.min(sy - u * 3.3, B.hillY(gx + gw / 2) + u * 1.6);
    bld(B, { x: gx, w: gw, base: gb, h: u * 2.5, roof: 'gonjong', rh: u * 2.3, wall: '#5a3a22', roofCol: '#2e2622', stilt: true, ground: gb + u * 0.8 });

    row(B, u * 1, u * 28, function () { return sy - u * 1.6; }, { walls: ['#7a5234', '#8a6240', '#e8d9b8', '#6b4a2c'], roofs: ['#3a2c24', '#4a3426', '#5a3a22'], roofTypes: ['gable', 'gonjong', 'gable', 'hip'], scale: 0.95, prob: 0.75, smoke: true });
    woodQuay(B, 0, u * 29.5);
    // rumah panggung di atas air (Lapau)
    bld(B, { x: u * 0.2, w: u * 2, base: q - u * 0.2, h: u * 1.5, roof: 'gable', rh: u * 1.3, wall: '#5a3c24', roofCol: '#2e2622', stilt: true, ground: sy + u * 0.6 });
    bld(B, { x: u * 2.4, w: u * 1.8, base: q - u * 0.4, h: u * 1.4, roof: 'gable', rh: u * 1.2, wall: '#6b4a2c', roofCol: '#34281f', stilt: true, ground: sy + u * 0.6 });
    hot(B, 'tavern', 'Lapau Tepi Air', 'cup', u * 0.2, q - u * 3.2, u * 4, u * 3.1);
    archGate(ctx, u * 4.6, q, u * 2.6, u * 3.9);
    var lb = bld(B, { x: u * 7.6, w: u * 2.4, base: q, h: u * 1.9, roof: 'hip', rh: u * 0.9, wall: '#b8ae98', roofCol: '#4a3a2a' });

    bld(B, { x: hx, w: hw, base: q, h: u * 3.2, roof: 'gable', rh: u * 1.9, wall: '#e8d9b8', roofCol: '#3a2c24' });
    timber(ctx, hx, q - u * 3.2, hw, u * 3.2);
    sign(ctx, hx + hw * 0.66, q - u * 3.1, u * 1.1, u * 2.6, ['PORT', 'OF', 'SUNDA'], 'banner');
    hot(B, 'market', 'Pasar Sunda', 'scales', hx, q - u * 5.1, hw, u * 5.1);
    var wx = u * 15.4, ww = u * 4;
    bld(B, { x: wx, w: ww, base: q, h: u * 2.2, roof: 'hip', rh: u * 1.1, wall: '#8a6240', roofCol: '#4a3426' });
    sign(ctx, wx + u * 0.3, q - u * 1.85, ww - u * 0.6, u * 0.6, ['PORT OF SUNDA EMPIRE'], 'board', { bg: '#2f5a3a', fg: '#f4e7c8', frame: '#1f3a26' });
    hot(B, 'cargo', 'Gudang', 'warehouse', wx, q - u * 3.3, ww, u * 3.3);
    var bx = u * 19.8, bw = u * 3;
    bld(B, { x: bx, w: bw, base: q, h: u * 2.9, roof: 'gonjong', rh: u * 1.2, wall: '#efe2c4', roofCol: '#3a2c24' });
    timber(ctx, bx, q - u * 2.9, bw, u * 2.9);

  // atap alang-alang dua susun ala bale Bali (serat jerami + rumbai di tepi)

    function hatch(x0, x1, y0, y1) {
      ctx.save(); ctx.clip();

      ctx.restore();

    ctx.fillStyle = U.shadeHex(col, -30);
    ctx.beginPath(); ctx.moveTo(x - ov, top + rh * 0.12);
    for (var fx = x - ov, k = 0; fx <= x + w + ov; fx += rh * 0.14, k++) ctx.lineTo(fx, top + rh * (k % 2 ? 0.2 : 0.1));
    ctx.lineTo(x + w + ov, top + rh * 0.06); ctx.lineTo(x - ov, top + rh * 0.06); ctx.closePath(); ctx.fill();

    hatch(x + w * 0.1, x + w * 0.9, top - rh * 1.5, top - rh * 0.48);
