var KH = (function () {

      html = panelHeader_('star', 'Kehormatan &mdash; ' + esc_(h.name), 'Standing naik dari misi gubernur pulau ini.');
      html += '<div class="hk-wrap"><div class="hk-hero">' + seal(h.tier) + '<div><div class="k">Gelarmu di ' + esc_(h.name) + '</div><b class="hd">' + esc_(h.tierName) + '</b>' +
        '<div class="hk-bar"><i style="width:' + p.pct.toFixed(1) + '%"></i></div><p>Standing <b>' + num(h.rep) + '</b>. ' + p.txt + '</p></div></div>';
      // Hak Lot
      var lot = '<div class="hk-card"><h4>' + ic('crate') + ' Hak Lot</h4>';
      if (h.lotMax > 0 && h.goods && h.goods.length) {
        lot += '<div style="display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;">' + pips(h.lotMax, h.lotUsed) + '<span>Sisa <b>' + Math.max(0, h.lotMax - h.lotUsed) + '/' + h.lotMax + '</b> lot hari ini</span><span class="muted">Jatah baru dalam ' + dur(resetLeft()) + ' (00:00 WIB)</span></div>' +
          '<div class="hk-goods">' + h.goods.map(function (g) { return '<span class="hk-good">' + goodIcon_(g.commodityId, true) + esc_(g.name) + ' <em>1 lot = ' + g.lot + ' &middot; ' + fmt(g.lotPrice) + '</em></span>'; }).join('') + '</div>' +
          '<span class="muted">Harga tetap harga keseimbangan, tidak ikut naik saat pasar diborong, dan tidak mengurangi stok pasar.</span>' +
          '<div><button class="btn btn-gold" data-hk="market">' + ic('scales') + ' Ambil di Market</button></div>';
      } else if (h.lotMax > 0) {
        lot += '<span class="muted">' + esc_(h.name) + ' tidak menghasilkan barang dagangan sendiri, jadi Hak Lot di sini kosong.</span>';
      } else {
        lot += '<span class="muted">Terbuka di gelar <b>' + esc_((tierMeta(3) || {}).name || '') + '</b> (Standing ' + num((tierMeta(3) || {}).min) + '): jatah beli pribadi setiap hari untuk barang hasil pulau ini.</span>';
      }
      lot += '</div>';
      html += lot + boardHtml(h.id);
      // Tangga
      html += '<div class="hk-card"><h4>' + ic('route') + ' Tangga Gelar</h4><div class="hk-ladder">' + (s.tiers || []).map(function (t) {
        var hit = h.tier >= t.tier, cur = h.tier === t.tier, ul = t.tier ? unlockList(t.tier).join(' &middot; ') : 'Kapten yang baru singgah';
        return '<div class="hk-step' + (hit ? ' hit' : '') + (cur ? ' cur' : '') + '"><span class="n">' + num(t.min) + '</span><div><b>' + esc_(t.name) + '</b><small>' + ul + '</small></div>' +
          '<span class="st">' + (cur ? 'Gelarmu' : hit ? 'Tercapai' : num(Math.max(0, t.min - h.rep)) + ' lagi') + '</span></div>';
      }).join('') + '</div></div>';
    }
    html += islesHtml(h ? h.id : null) + '</div>';
    setModal_(html);
    var mb = document.querySelector('[data-hk=market]'); if (mb) mb.onclick = function () { openPanel('market'); };
    if (h) loadBoard(h.id, function () { var el = document.getElementById('hkBoard'); if (el && currentPanel === 'kehormatan') el.outerHTML = boardHtml(h.id); });
  }
  function islesHtml(cur) {
    var s = st(); if (!s) return '';
    var list = (s.cities || []).filter(function (c) { return c.tier > 0 || c.id === cur; });
    var total = (s.cities || []).length;
    return '<div class="hk-card"><h4>' + ic('map') + ' Gelarmu di Mare Nusantara<span class="muted" style="margin-left:auto;font-family:inherit;letter-spacing:0;">Pelindung ' + (s.pelindung || 0) + '</span></h4>' +
      (s.pelindungAll ? '<div style="font-family:var(--font-title);color:#7a4a10;">' + ic('gem') + ' Pelindung Mare Nusantara</div>' : '') +
      (list.length ? '<div class="hk-isles">' + list.map(function (c) {
        return '<div class="hk-isle t' + c.tier + (c.id === cur ? ' here' : '') + '"><b>' + esc_(c.name) + '</b>' + esc_(c.tierName) + ' &middot; ' + num(c.rep) + '</div>';
      }).join('') + '</div>' : '<span class="muted">Belum ada gelar. Kerjakan misi gubernur untuk menaikkan Standing.</span>') +
      (total ? '' : '') + '</div>';
  }

  /* ---------- Market: tombol Hak Lot ---------- */
  function lotLeft() { var h = here(); return h ? Math.max(0, h.lotMax - h.lotUsed) : 0; }
  function marketHook() {
    var h = here(); if (currentPanel !== 'market' || !h || !(h.lotMax > 0) || !h.goods || !h.goods.length) return;
    var c = document.getElementById('modalContent'); if (!c) return;
    var left = lotLeft();
    var head = c.querySelector('.mkt-head');
    if (head && !c.querySelector('.hk-mkt')) head.insertAdjacentHTML('afterend', '<div class="hk-mkt">' + ic('star') + '<span><b>Hak Lot ' + esc_(h.tierName) + '</b></span>' + pips(h.lotMax, h.lotUsed) +
      '<span>Sisa ' + left + '/' + h.lotMax + ' lot</span><span class="t">Jatah baru dalam ' + dur(resetLeft()) + '</span></div>');
    h.goods.forEach(function (g) {
      var col = c.querySelector('.mkt-row[data-good="' + g.commodityId + '"] .trade-col'); if (!col || col.querySelector('.hk-lotbtn')) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'btn hk-lotbtn'; b.disabled = left <= 0;
      b.innerHTML = ic('star') + ' Lot Kehormatan &middot; ' + left + '/' + h.lotMax;
      b.onclick = function () { openPop(col, g); };
      col.appendChild(b);
      if (lotSel && lotSel.id === g.commodityId) openPop(col, g, lotSel.n);
    });
  }
  function openPop(col, g, n) {
    var old = document.querySelector('.hk-pop'); if (old) old.remove();
    var left = lotLeft(); if (left <= 0) return;
    n = Math.max(1, Math.min(n || 1, left));
    lotSel = { id: g.commodityId, n: n };
    var pop = document.createElement('div'); pop.className = 'hk-pop';
    function paint() {
      var units = n * g.lot, total = units * g.unitPrice;
      pop.innerHTML = '<div class="row"><span>Ambil</span><span class="hk-q"><button type="button" data-d="-1" aria-label="Kurangi">&minus;</button><b>' + n + '</b><button type="button" data-d="1" aria-label="Tambah">+</button></span><span>lot</span></div>' +
        '<div class="sum">' + units + ' ' + esc_(g.name) + ' &times; ' + fmt(g.unitPrice) + ' = <b>' + fmt(total) + '</b> gold</div>' +
        '<div class="acts"><button type="button" class="btn btn-gold" data-a="ok">Ambil</button><button type="button" class="btn" data-a="x">Batal</button></div>';
      pop.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { n = Math.max(1, Math.min(left, n + Number(b.getAttribute('data-d')))); lotSel.n = n; paint(); }; });
      pop.querySelector('[data-a=x]').onclick = function () { lotSel = null; pop.remove(); };
      pop.querySelector('[data-a=ok]').onclick = function () { buy(g, n, this); };
    }
    paint(); col.appendChild(pop);
  }
  function buy(g, n, btn) {
    if (!canAct_() || !state.city) return;
    var units = n * g.lot, total = units * g.unitPrice, space = marketCache ? marketCache.cargoSpaceRemaining : 0;
    if (total > state.player.gold) { showToast('Gold tidak cukup untuk ' + n + ' lot.', 'error'); return; }
    if (marketCache && units * (g.size || 1) > space + 1e-9) { showToast('Ruang palka tidak cukup (butuh ' + fmtSpace_(units * (g.size || 1)) + ', sisa ' + fmtSpace_(space) + ').', 'error'); return; }
    btn.disabled = true;
    var cityId = state.city.CityId;
    enqueueTx_(function (done) {
      call(['lot', cityId, g.commodityId, n], function (r) {
        done(); lotSel = null;
        patchGold_(r.newGold);
        var it = marketItem_(g.commodityId);
        if (it) { it.ownedQty = r.ownedQty; it.avgCost = r.avgCost; }
        if (marketCache) marketCache.cargoSpaceRemaining = Number(r.cargoSpaceRemaining) || 0;
        if (r.cargoUsed != null) updateHoldHud_(Number(r.cargoUsed));
        delete panelCache['cargo:' + cityId];
        lastTrade = { id: g.commodityId, dir: 'buy', qty: r.units };
        if (currentPanel === 'market') renderMarketGrid_();
        refreshCargoQuiet_(); saveSnap_();
        showToast('Hak Lot: ' + r.units + ' ' + g.name + ' masuk palka (' + fmt(r.totalCost) + ' gold).', 'success');
        au_('coin', { n: 3 });
      }, function (e) { done(); btn.disabled = false; showToast(e.message, 'error'); });
    });
  }

  /* ---------- upacara naik gelar & catatan papan ---------- */
  function ceremony(list, i) {
    if (i >= list.length) { call(['lihat', 'gelar']); return; }
    var u = list[i], v = VOICE[u.city] || ['Gubernur', 'Selamat datang di antara kami.'];
    var ov = document.createElement('div'); ov.className = 'hk-cine';
    ov.innerHTML = '<div class="hk-scroll" role="dialog" aria-label="Gelar baru">' + seal(u.tier) +
      '<div class="k">Gelar Kehormatan baru</div><h3>' + esc_(u.tierName) + '</h3><div class="isle">' + esc_(u.cityName) + '</div>' +
      '<blockquote>&ldquo;' + esc_(val(v[1])) + '&rdquo;<cite>&mdash; ' + esc_(val(v[0])) + '</cite></blockquote>' +
      '<ul>' + unlockList(u.tier).map(function (x) { return '<li>' + ic('check') + esc_(x) + '</li>'; }).join('') + '</ul>' +
      '<button class="btn btn-gold">' + ic('star') + ' Terima kehormatan</button></div>';
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('on'); });
    au_('achieve');
    function close() { ov.classList.remove('on'); setTimeout(function () { ov.remove(); ceremony(list, i + 1); }, 450); }
    ov.querySelector('.btn').onclick = close;
  }
  function scenes() {
    var s = st(); if (!s) return;
    (s.notes || []).forEach(function (n) {
      if (shownNotes[n.id]) return; shownNotes[n.id] = 1;
      if (n.kind === 'geser') showToast('Namamu bergeser dari Papan Kehormatan ' + n.cityName + (n.data && n.data.by ? ': ' + capName(n.data.by) + ' naik.' : '.'), 'info');
    });
    if ((s.notes || []).length) { call(['lihat', 'catatan']); s.notes = []; }
    var un = s.unseen || []; if (!un.length || busy()) return;
    // satu upacara per pulau (gelar tertinggi); gelar kecil cukup notifikasi
    var best = {}; un.forEach(function (u) { if (!best[u.city] || u.tier > best[u.city].tier) best[u.city] = u; });
    var big = [], small = [];
    Object.keys(best).forEach(function (k) { (best[k].tier >= 3 ? big : small).push(best[k]); });
    small.forEach(function (u) { showToast('Gelar baru: ' + u.tierName + ' di ' + u.cityName + '.', 'success'); });
    s.unseen = [];
    if (big.length) ceremony(big, 0); else { au_('achieve'); call(['lihat', 'gelar']); }
  }

  /* ---------- kaitan ---------- */
  if (typeof PANEL_SIZE !== 'undefined') PANEL_SIZE.kehormatan = 'mid';
  var origOpen = window.openPanel;
  if (typeof origOpen === 'function') {
    window.openPanel = function (panel) {
      if (panel === 'kehormatan') {
        if (!st()) { showToast('Gelar Kehormatan belum dibuka.', 'info'); return; }
        var r = origOpen.apply(this, arguments); render(); return r;
      }
      return origOpen.apply(this, arguments);
    };
  }
  wrap_('renderScene', function () { try { chip(); } catch (e) { console.warn('[KH]', e); } });
  wrap_('renderMarketGrid_', function () { try { marketHook(); } catch (e) { console.warn('[KH]', e); } });
  function gate() { document.querySelectorAll('.kh-gate').forEach(function (el) { el.hidden = !st(); }); }
  wrap_('applyFreshState_', function () {
    var s = st(); if (s) s._at = Date.now();
    gate();
    if (currentPanel === 'kehormatan') render();
    var tries = 0;
    setTimeout(function later() { if (!st()) return; if (busy()) { if (tries++ < 40) setTimeout(later, 1500); return; } try { scenes(); } catch (e) { console.warn('[KH]', e); } }, 2500);
  });
  wrap_('handleInbox_', null, function (it) {
    if (!it || it.type !== 'honor_geser') return;
    if (it.noteId) { if (shownNotes[it.noteId]) return; shownNotes[it.noteId] = 1; }
    showToast('Namamu bergeser dari Papan Kehormatan ' + it.cityName + (it.by ? ': ' + capName(it.by) + ' naik.' : '.'), 'info');
    au_('page'); delete boards[it.city];
    call(['lihat', 'catatan']);
  });
  // Lapau: gosip Papan Kehormatan
  function gossip(b) {
    var el = document.getElementById('rumorList'); if (!el || el.querySelector('.hk-rumor') || !b || !b.rows || !b.rows.length) return;
    var top = b.rows[0], n = '<b>' + esc_(capName(top.name)) + '</b>', t;
    if (top.me) t = 'Orang-orang di sini mulai menyebut namamu. Katanya namamu dipaku paling atas di Papan Kehormatan.';
    else t = [n + ' lagi yang menurunkan muatan di sini. Gubernur sampai hafal kapalnya.',
      'Di dermaga, nama ' + n + ' dipaku paling atas di Papan Kehormatan.',
      'Katanya ' + n + ' sudah jadi ' + esc_(top.tierName) + ' di sini. Orang-orang mulai menyapanya duluan.'][Math.floor(Math.random() * 3)];
    var d = document.createElement('div'); d.className = 'card rumor hk-rumor'; d.innerHTML = ic('chat') + '<span>' + t + '</span>';
    el.insertBefore(d, el.firstChild);
  }
  wrap_('setModal_', function () {
    if (!st() || !state || !state.city) return;
    if (currentPanel === 'tavern') {
      var h = here(); if (!h) return;
      var b = boards[h.id]; if (b) { try { gossip(b.data); } catch (e) { } }
      else loadBoard(h.id, function (d) { if (currentPanel === 'tavern') try { gossip(d); } catch (e) { } });
    } else if (currentPanel === 'character') {
      characterCard();
    } else if (currentPanel === 'captain') {
      capCard();
    }
  });
  function characterCard() {
    var c = document.getElementById('modalContent'), s = st(); if (!c || !s || c.querySelector('.hk-cs')) return;
    var hero = c.querySelector('.cs-hero'); if (!hero) return;
    var top = s.top, d = document.createElement('div'); d.className = 'hk-card hk-cs';
    d.innerHTML = '<h4>' + ic('star') + ' Gelar Kehormatan</h4>' +
      (top ? '<div><b style="font-family:var(--font-title)">' + esc_(top.tierName) + ' ' + esc_(top.cityName) + '</b>' + (s.pelindungAll ? ' &middot; ' + ic('gem') + ' Pelindung Mare Nusantara' : '') + '</div>' : '<span class="muted">Belum ada gelar. Kerjakan misi gubernur untuk menaikkan Standing di tiap pulau.</span>') +
      ((s.cities || []).some(function (x) { return x.tier > 0; }) ? '<div class="hk-isles">' + s.cities.filter(function (x) { return x.tier > 0; }).map(function (x) { return '<div class="hk-isle t' + x.tier + '"><b>' + esc_(x.name) + '</b>' + esc_(x.tierName) + ' &middot; ' + num(x.rep) + '</div>'; }).join('') + '</div>' : '') +
      (here() ? '<div class="acts"><button class="btn btn-ghost-ink" data-hk="open">' + ic('trophy') + ' Papan Kehormatan ' + esc_(here().name) + '</button></div>' : '');
    hero.parentNode.insertBefore(d, hero.nextSibling);
    var b = d.querySelector('[data-hk=open]'); if (b) b.onclick = function () { openPanel('kehormatan'); };
  }
  if (typeof window.openCaptain_ === 'function') {
    var origCap = window.openCaptain_;
    window.openCaptain_ = function (pid) {
      capPid = pid; capGelar = null;
      if (pid && st()) call(['kapten', pid], function (r) { if (capPid !== pid) return; capGelar = r.gelar || { top: null }; capCard(); }, function () { });
      return origCap.apply(this, arguments);
    };
  }
  function capCard() {
    if (currentPanel !== 'captain' || !capGelar || !capGelar.top) return;
    var c = document.getElementById('modalContent'), box = c && c.querySelector('.cap-stats'); if (!box || box.querySelector('.hk-cap')) return;
    box.insertAdjacentHTML('beforeend', '<div class="cap-stat hk-cap">' + ic('star') + '<b>' + esc_(capGelar.top.tierName) + '</b><span>' + esc_(capGelar.top.cityName) + '</span></div>');
  }

  return { st: st, render: render, scenes: scenes, ceremony: ceremony };
})();
</script>
