<!--
  TitleScreen.html
  ------------------------------------------------------------------
  Overlay layar judul (Play / Settings / About), di-include lewat
  include('TitleScreen') di AWAL <body> Index.html DAN CharacterCreate.html.

  Tide v2: latar = scene canvas hidup (MTScene mode 'title' dari
  SceneEngine.html: laut senja, galleon berlayar, mercusuar). Kalau
  GameConfig.TitleScreenImageUrl diisi admin, foto itu yang dipakai
  (canvas dihentikan). Base layer tetap SOLID inline (lihat catatan
  lama: overlay tidak boleh pernah transparan/tembus).

  "Play" cuma menyembunyikan overlay - loading game sesungguhnya sudah
  jalan di baliknya sejak DOMContentLoaded.
  ------------------------------------------------------------------
-->
<style>
  #titleScreen.hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  #titleScreen { transition: opacity .6s ease, visibility .6s; overflow: hidden; }
  #titleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #titleScreen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(4,6,12,.65) 100%), linear-gradient(180deg, rgba(4,6,12,.35), transparent 30%, transparent 70%, rgba(4,6,12,.6)); }

  #titleScreenInner { text-align: center; padding: 20px; max-width: 680px; position: relative; z-index: 1; animation: titleRise 1.1s cubic-bezier(.22,1,.36,1) both; }
  @keyframes titleRise { from { opacity: 0; transform: translateY(18px); } }
  .title-logo-svg { width: min(620px, 92vw); height: auto; display: block; margin: 0 auto -6px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.6)); }
  .title-kicker { font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: .72em; letter-spacing: .5em; text-transform: uppercase; color: #f0cf78; opacity: .85; margin-bottom: 2px; }
  .title-logo {
    font-family: 'Pirata One', 'Cinzel Decorative', Georgia, serif; font-size: clamp(3.2em, 10vw, 6.2em); line-height: .95; margin: 0;
    background: linear-gradient(180deg, #fff6d8 0%, #f0cf78 45%, #b37d24 75%, #6e4a12 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(40,20,5,.9)) drop-shadow(0 10px 24px rgba(0,0,0,.6));
    letter-spacing: 1px;
  }
  .title-rule { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 10px auto 26px; color: #f0cf78; font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 1.1em; opacity: .9; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .title-rule::before, .title-rule::after { content: ''; width: 60px; height: 1px; background: linear-gradient(90deg, transparent, #f0cf78); }
  .title-rule::after { transform: scaleX(-1); }
  #titleButtons { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #titleButtons .btn { width: 250px; font-size: .95em; padding: 13px 20px; }
  #titleButtons .btn:not(.btn-gold) { --b-bg1: rgba(30,20,12,.8); --b-bg2: rgba(12,8,5,.85); --b-edge: rgba(240,207,120,.45); backdrop-filter: blur(4px); }
  .title-foot { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 1; text-align: center; font-family: 'Cinzel', Georgia, serif; font-size: .62em; letter-spacing: .35em; text-transform: uppercase; color: rgba(240,228,196,.45); }

  #titleSubOverlay { position: fixed; inset: 0; z-index: 100010; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4,6,10,.72); backdrop-filter: blur(3px); }
  #titleSubOverlay.open { display: flex; }
  #titleSubBox { width: 480px; max-width: 100%; max-height: 80vh; overflow-y: auto; padding: 22px 26px; }
  #titleSubBox h2 { margin-top: 0; color: var(--teak-800); font-size: 1.7em; }
  #titleSubClose { float: right; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(180deg, #4a2f1c, #24160d); border: 1px solid var(--brass-700); color: var(--brass-300); font-size: 1.2em; cursor: pointer; line-height: 1; }
  #titleAboutText { font-size: 1em; line-height: 1.6; color: var(--ink); }
  .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }

  /* Tide v6: login akun game (tanpa izin akun Google) */
  #titleAuth { display: none; width: min(360px, 92vw); margin: 0 auto; padding: 16px 18px 14px; border-radius: 14px; text-align: left;
    background: linear-gradient(180deg, rgba(30,20,12,.86), rgba(12,8,5,.9)); border: 1px solid rgba(240,207,120,.45); box-shadow: 0 14px 34px rgba(0,0,0,.5); backdrop-filter: blur(6px); }
  #titleAuth.show { display: block; animation: titleRise .6s cubic-bezier(.22,1,.36,1) both; }
  .ta-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .ta-tabs button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(240,207,120,.3); background: transparent; color: rgba(240,228,196,.7); font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: .72em; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; }
  .ta-tabs button.on { background: linear-gradient(180deg, #ffe7a3, #c9922f); color: #2b1905; border-color: #7a5313; }
  #titleAuth label { display: block; font-family: 'Cinzel', Georgia, serif; font-size: .62em; letter-spacing: .2em; text-transform: uppercase; color: #f0cf78; margin: 8px 0 4px; }
  #titleAuth input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 9px; border: 1px solid rgba(240,207,120,.4); background: rgba(8,6,4,.7); color: #fbf1d6; font-size: 1em; font-family: 'EB Garamond', Georgia, serif; }
  #titleAuth input:focus { outline: none; border-color: #f0cf78; box-shadow: 0 0 0 3px rgba(240,207,120,.2); }
  #taSubmit { width: 100%; margin-top: 14px; }
  #taMsg { min-height: 1.3em; margin-top: 8px; font-size: .88em; color: #ffb0a0; }
  #taMsg.ok { color: #9fe0a8; }
  .ta-note { font-size: .8em; color: rgba(240,228,196,.6); margin-top: 6px; line-height: 1.4; }
  #titleWho { margin-top: 12px; font-family: 'Cinzel', Georgia, serif; font-size: .66em; letter-spacing: .18em; text-transform: uppercase; color: rgba(240,228,196,.65); }
  #titleWho a { color: #f0cf78; cursor: pointer; text-decoration: underline; margin-left: 6px; }
  #titleButtons.locked { display: none; }
</style>

<div id="titleScreen"
  style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;z-index:100000;
    display:flex;align-items:center;justify-content:center;
    background-color:#0a0502;background-size:cover;background-position:center;background-repeat:no-repeat;
    background-image:linear-gradient(180deg, #1c1f4a, #8b4066 55%, #1a2346);">
  <canvas id="titleCanvas"></canvas>
  <div id="titleScreenInner">
    <svg class="title-logo-svg" viewBox="0 0 640 230" role="img" aria-label="Marantau">
      <defs>
        <linearGradient id="tlScroll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dfae"/><stop offset=".55" stop-color="#e2c485"/><stop offset="1" stop-color="#c49a58"/></linearGradient>
        <linearGradient id="tlRoll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9894a"/><stop offset=".5" stop-color="#f0d9a2"/><stop offset="1" stop-color="#8a5f2c"/></linearGradient>
        <linearGradient id="tlText" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a4a1e"/><stop offset="1" stop-color="#4a2410"/></linearGradient>
        <linearGradient id="tlBlade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9dde2"/><stop offset=".5" stop-color="#8a9098"/><stop offset="1" stop-color="#e8ecf0"/></linearGradient>
      </defs>
      <!-- keris bersilang di belakang gulungan -->
      <g transform="translate(320 150) rotate(-14)"><path d="M-250 0 C-200 -8 -170 8 -130 0 C-90 -8 -60 8 -20 0 L90 -4 L100 0 L90 4 L-20 6 C-60 14 -90 -2 -130 6 C-170 14 -200 -2 -250 6 Z" fill="url(#tlBlade)" stroke="#3a3a40" stroke-width="2"/><rect x="90" y="-10" width="14" height="20" rx="3" fill="#b8903c" stroke="#4a320c" stroke-width="2"/><path d="M104 -6 C130 -14 150 -6 156 0 C150 6 130 14 104 6 Z" fill="#6b3a1e" stroke="#2a1608" stroke-width="2"/></g>
      <g transform="translate(320 150) rotate(194)"><path d="M-250 0 C-200 -8 -170 8 -130 0 C-90 -8 -60 8 -20 0 L90 -4 L100 0 L90 4 L-20 6 C-60 14 -90 -2 -130 6 C-170 14 -200 -2 -250 6 Z" fill="url(#tlBlade)" stroke="#3a3a40" stroke-width="2"/><rect x="90" y="-10" width="14" height="20" rx="3" fill="#b8903c" stroke="#4a320c" stroke-width="2"/><path d="M104 -6 C130 -14 150 -6 156 0 C150 6 130 14 104 6 Z" fill="#6b3a1e" stroke="#2a1608" stroke-width="2"/></g>
      <!-- gulungan -->
      <path d="M70 40 H570 C582 40 590 60 590 90 C590 120 582 140 570 140 H70 C58 140 50 120 50 90 C50 60 58 40 70 40 Z" fill="url(#tlScroll)" stroke="#5a3a18" stroke-width="3"/>
      <path d="M86 50 H554" stroke="#b08850" stroke-width="1.5" opacity=".6"/><path d="M86 130 H554" stroke="#b08850" stroke-width="1.5" opacity=".6"/>
      <path d="M58 30 C44 30 38 60 38 90 C38 120 44 150 58 150 C72 150 78 120 78 90 C78 60 72 30 58 30 Z" fill="url(#tlRoll)" stroke="#5a3a18" stroke-width="3"/>
      <path d="M582 30 C568 30 562 60 562 90 C562 120 568 150 582 150 C596 150 602 120 602 90 C602 60 596 30 582 30 Z" fill="url(#tlRoll)" stroke="#5a3a18" stroke-width="3"/>
      <path d="M100 58 q10 -10 20 0 M520 58 q10 -10 20 0 M100 122 q10 10 20 0 M520 122 q10 10 20 0" fill="none" stroke="#8a5f2c" stroke-width="2"/>
      <text x="320" y="118" text-anchor="middle" font-family="'Pirata One', 'Cinzel Decorative', Georgia, serif" font-size="96" fill="url(#tlText)" stroke="#f7e9c4" stroke-width="2" paint-order="stroke" letter-spacing="2">Marantau</text>
      <text x="320" y="190" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-weight="600" font-size="24" fill="#fbf1d6" stroke="#2a1608" stroke-width="4" paint-order="stroke">Dima bumi dipijak, di nan langik dijunjuang</text>
    </svg>
    <div class="title-rule">Berdagang &middot; Berlayar &middot; Bertahan</div>
    <div id="titleAuth">
      <div class="ta-tabs"><button type="button" class="on" data-m="login">Masuk</button><button type="button" data-m="register">Daftar</button></div>
      <form id="taForm" autocomplete="on" onsubmit="return false;">
        <label for="taUser">Username</label><input id="taUser" name="username" autocomplete="username" maxlength="16" placeholder="misal: sansan" autocapitalize="off" spellcheck="false">
        <label for="taPass">Password</label><input id="taPass" name="password" type="password" autocomplete="current-password" maxlength="72" placeholder="minimal 6 karakter">
        <div id="taPass2Row" style="display:none;"><label for="taPass2">Ulangi password</label><input id="taPass2" type="password" autocomplete="new-password" maxlength="72"></div>
        <button class="btn btn-gold btn-lg" id="taSubmit" type="submit">Masuk</button>
      </form>
      <div id="taMsg"></div>
      <div class="ta-note">Tidak perlu akun Google &amp; tidak perlu memberi izin apa pun. Buat username + password khusus Marantau.</div>
    </div>
    <div id="titleButtons">
      <button class="btn btn-gold btn-lg" id="titlePlayBtn">Play</button>
      <button class="btn" id="titleSettingsBtn">Settings</button>
      <button class="btn" id="titleAboutBtn">About</button>
      <div id="titleWho"></div>
    </div>
  </div>
  <div class="title-foot">Dunia bersama &middot; Tide v19</div>
</div>

<div id="titleSubOverlay">
  <div id="titleSubBox" class="parchment-panel">
    <button id="titleSubClose" aria-label="Tutup">&times;</button>
    <div id="titleSubContent"></div>
  </div>
</div>

<script>
  (function () {
    function $(id) { return document.getElementById(id); }
    document.documentElement.style.overflow = 'hidden';

    var titleScene = null;
    function startTitleScene() {
      if (titleScene || !window.MTScene) return;
      try {
        titleScene = MTScene.create($('titleCanvas'));
        titleScene.configure({ mode: 'title', fixedFrac: 0.735, ship: { tier: 3, cond: 100 } });
        titleScene.start();
      } catch (e) { titleScene = null; }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startTitleScene); else startTitleScene();

    // Foto opsional dari GameConfig.TitleScreenImageUrl - kalau ada & valid,
    // pakai foto (canvas disembunyikan); kalau tidak, canvas hidup tetap jalan.
    google.script.run.withSuccessHandler(function (cfg) {
      var url = cfg && cfg.imageUrl;
      if (url && /^https?:\/\//i.test(url)) {
        $('titleScreen').style.backgroundImage = 'url("' + url + '")';
        $('titleCanvas').style.display = 'none';
        if (titleScene) titleScene.stop();
      }
    }).withFailureHandler(function () {}).api_getTitleScreenConfig();

    $('titlePlayBtn').addEventListener('click', function () {
      if (window.MTAuth && MTAuth._needsCharacter) { MTAuth._needsCharacter = false; hideTitle_(); if (window.openCreator_) openCreator_(); return; }
      hideTitle_();
    });
    function hideTitle_() {
      $('titleScreen').classList.add('hidden');
      document.documentElement.style.overflow = '';
      setTimeout(function () { if (titleScene) titleScene.stop(); }, 650);
    }

    /* ---------- Tide v6: login / daftar akun game ---------- */
    var authMode = 'login';
    function setAuthMode(m) {
      authMode = m;
      document.querySelectorAll('.ta-tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-m') === m); });
      $('taPass2Row').style.display = m === 'register' ? '' : 'none';
      $('taPass').setAttribute('autocomplete', m === 'register' ? 'new-password' : 'current-password');
      $('taSubmit').textContent = m === 'register' ? 'Daftar & Masuk' : 'Masuk';
      $('taMsg').textContent = ''; $('taMsg').className = '';
    }
    document.querySelectorAll('.ta-tabs button').forEach(function (b) { b.addEventListener('click', function () { setAuthMode(b.getAttribute('data-m')); }); });
    $('taForm').addEventListener('submit', function () {
      var u = $('taUser').value.trim().toLowerCase(), pw = $('taPass').value, msg = $('taMsg'), btn = $('taSubmit');
      msg.className = '';
      if (!/^[a-z0-9_]{3,16}$/.test(u)) { msg.textContent = 'Username 3-16 karakter: huruf kecil, angka, atau _'; return; }
      if (pw.length < 6) { msg.textContent = 'Password minimal 6 karakter.'; return; }
      if (authMode === 'register' && pw !== $('taPass2').value) { msg.textContent = 'Ulangi password belum sama.'; return; }
      btn.disabled = true; btn.textContent = authMode === 'register' ? 'Mendaftar…' : 'Masuk…';
      google.script.run.withSuccessHandler(function (res) {
        btn.disabled = false; setAuthMode(authMode);
        MTNet.setToken(res.token, res.username);
        msg.className = 'ok'; msg.textContent = res.linkedLegacy ? 'Akun dibuat & karakter lamamu tersambung!' : 'Selamat datang, ' + res.username + '!';
        $('taPass').value = ''; $('taPass2').value = '';
        if (window.onLoggedIn_) window.onLoggedIn_(res);
      }).withFailureHandler(function (err) {
        btn.disabled = false; setAuthMode(authMode);
        msg.textContent = (err && err.message ? err.message : String(err)).replace(/^Error:\s*/, '');
      })[authMode === 'register' ? 'api_authRegister' : 'api_authLogin'](u, pw);
    });
    function renderWho_() {
      var u = window.MTNet ? MTNet.user() : '';
      $('titleWho').innerHTML = u ? 'Masuk sebagai <b style="color:#ffe7a3;">' + u.replace(/[<>&"]/g, '') + '</b><a id="titleLogout">Keluar</a>' : '';
      var lo = $('titleLogout'); if (lo) lo.addEventListener('click', function () { if (window.logout_) window.logout_(); });
    }
    window.MTAuth = {
      _needsCharacter: false,
      showLogin: function (note) {
        $('titleScreen').classList.remove('hidden');
        document.documentElement.style.overflow = 'hidden';
        startTitleScene(); if (titleScene) titleScene.start();
        $('titleButtons').classList.add('locked');
        $('titleAuth').classList.add('show');
        if (note) { $('taMsg').className = ''; $('taMsg').textContent = note; }
        setTimeout(function () { try { $('taUser').focus(); } catch (e) {} }, 300);
      },
      showMenu: function (needsCharacter) {
        $('titleAuth').classList.remove('show');
        $('titleButtons').classList.remove('locked');
        this._needsCharacter = !!needsCharacter;
        $('titlePlayBtn').textContent = needsCharacter ? 'Buat Kapten' : 'Play';
        renderWho_();
      },
      hide: hideTitle_
    };
    renderWho_();

    function openSub(html) { $('titleSubContent').innerHTML = html; $('titleSubOverlay').classList.add('open'); }
    function closeSub() { $('titleSubOverlay').classList.remove('open'); }
    $('titleSubClose').addEventListener('click', closeSub);
    $('titleSubOverlay').addEventListener('click', function (e) { if (e.target.id === 'titleSubOverlay') closeSub(); });

    function getTitlePref_() {
      var onRaw = null, vol = '60';
      try { onRaw = localStorage.getItem('mt_soundOn'); vol = localStorage.getItem('mt_volume') || '60'; } catch (e) {}
      return { on: onRaw === null ? true : onRaw === 'true', volume: Number(vol) };
    }

    $('titleSettingsBtn').addEventListener('click', function () {
      var pref = getTitlePref_();
      openSub(
        '<h2>Settings</h2>' +
        '<div class="settings-row"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;">' +
          '<input type="checkbox" class="toggle" id="titleSoundToggle" ' + (pref.on ? 'checked' : '') + '> Musik latar</label></div>' +
        '<div class="settings-row"><span>Volume</span><input type="range" id="titleVolumeSlider" min="0" max="100" value="' + pref.volume + '" style="flex:1;"></div>' +
        '<p style="font-size:.9em;color:var(--parch-muted);">Pengaturan ini otomatis dipakai begitu game dimuat. Musik baru bisa mulai setelah kamu klik apapun di layar (kebijakan browser).</p>'
      );
      $('titleSoundToggle').addEventListener('change', function (e) { try { localStorage.setItem('mt_soundOn', e.target.checked); } catch (err) {} });
      $('titleVolumeSlider').addEventListener('input', function (e) { try { localStorage.setItem('mt_volume', e.target.value); } catch (err) {} });
    });

    $('titleAboutBtn').addEventListener('click', function () {
      openSub(
        '<h2>About Marantau</h2>' +
        '<div id="titleAboutText">' +
          '<p><b>Marantau</b> adalah game dagang &amp; petualangan maritim dunia bersama (shared world), terinspirasi Tradewinds 2, dengan latar fantasi Asia Tenggara. Diciptakan karena rindu dengan game lawas Tradewinds dan Tradewinds 2, serta diciptakan full dibantu oleh Claude.</p>' +
          '<p><b>Pencipta:</b> DMSandris</p>' +
          '<p>Bangun kerajaan dagangmu: beli-jual komoditas antar kota, upgrade &amp; reparasi kapal, hadapi bajak laut di tengah laut, kerjakan misi Gubernur, dan naikkan reputasimu di tiap pelabuhan.</p>' +
          '<p style="font-size:.92em;color:var(--parch-muted);font-style:italic;">&ldquo;Dima bumi dipijak, di nan langik dijunjung&rdquo; &mdash; peribahasa Minang: di mana bumi dipijak, di situ langit dijunjung. Hormati adat &amp; aturan tempat yang kamu singgahi.</p>' +
          '<p style="font-size:.85em;color:var(--parch-muted);"><b>Catatan:</b> Apabila ada kesamaan pada nama character mohon maaf, jujur ketidaksengajaan.</p>' +
        '</div>'
      );
    });
  })();
</script>
