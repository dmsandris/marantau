<style>
  /* ================= Tide v84 · Kasino Mutiara (Paradiso) =================
   * Semua kelas berawalan .ksn- supaya tidak bentrok dengan gaya game.
   * Hasil ronde selalu dari server (api_kasino); klien hanya menganimasikan. */
  .ksn { --ks-felt: #18523b; --ks-felt-d: #0b261c; --ks-brass: #d3a342; --ks-brass-l: #f0cf78; --ks-ink: #f4e7c8;
    --ks-dim: #cdb98f; --ks-good: #46a862; --ks-bad: #cf4b33; --ks-warn: #e0a53c;
    position: relative; margin: 4px 0 6px; border-radius: 16px; color: var(--ks-ink); overflow: hidden;
    background: radial-gradient(circle at 50% -10%, rgba(211,163,66,.18), transparent 55%),
                radial-gradient(circle at 12% 110%, rgba(24,82,59,.35), transparent 50%),
                linear-gradient(180deg, #0d1714 0%, #120d0a 100%);
    border: 1.5px solid rgba(211,163,66,.55); box-shadow: inset 0 1px 0 rgba(255,236,179,.12), 0 10px 26px rgba(0,0,0,.35);
    padding: 14px 14px 16px; font-family: var(--font-body); }
  .ksn * { box-sizing: border-box; }
  /* #modalBox h3 milik game (huruf kapital + garis) tidak berlaku di dalam kasino */
  #modalBox .ksn h2, #modalBox .ksn h3, #modalBox .ksn h4 { display: block; text-transform: none; margin: 0; gap: 0; }
  #modalBox .ksn h3::after, #modalBox .ksn h4::after { display: none; content: none; }
  #modalBox .ksn input[type="number"] { font-family: var(--font-mono, monospace); background: #0b1219; color: #fbeabb; border: 1px solid #d3a342; box-shadow: none; }
  .ksn button { font-family: inherit; }
  .ksn-btn { font-family: var(--font-title); font-weight: 700; font-size: .82em; letter-spacing: .05em; padding: 9px 15px; border-radius: 8px;
    border: 1px solid #8f6522; background: linear-gradient(180deg, #4f331e, #24170f); color: #fbeabb; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; transition: filter .15s, transform .1s, opacity .15s; }
  .ksn-btn .ico { width: 16px; height: 16px; }
  .ksn-btn:hover:not(:disabled) { filter: brightness(1.14); }
  .ksn-btn:active:not(:disabled) { transform: translateY(1px); }
  .ksn-btn:disabled { opacity: .42; cursor: not-allowed; filter: grayscale(.4); }
  .ksn-btn.gold { background: linear-gradient(180deg, #f5da8b, #c89432); color: #170e09; border-color: #4a320c; text-shadow: 0 1px 0 rgba(255,255,255,.45); }
  .ksn-btn.green { background: linear-gradient(180deg, #277355, #144431); color: #fff9e6; border-color: #46a862; }
  .ksn-btn.red { background: linear-gradient(180deg, #a63423, #6c1e13); color: #fff9e6; border-color: #df6955; }
  .ksn-btn.sm { min-height: 32px; padding: 5px 11px; font-size: .74em; }
  .ksn-btn.ghost { background: rgba(255,255,255,.05); border-color: rgba(211,163,66,.4); color: var(--ks-ink); }

  /* dompet */
  .ksn-wallet { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 13px; margin-bottom: 12px;
    border-radius: 12px; background: linear-gradient(90deg, rgba(211,163,66,.16), rgba(23,77,56,.18)); border: 1px solid rgba(211,163,66,.42); }
  .ksn-purse { display: flex; align-items: center; gap: 10px; }
  .ksn-coin { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
    background: radial-gradient(circle at 30% 30%, #f8e094, #b67f22); border: 1.5px solid #fff9e6; box-shadow: 0 2px 8px rgba(0,0,0,.5); color: #372316; }
  .ksn-coin .ico { width: 18px; height: 18px; }
  .ksn-purse .l { font-family: var(--font-title); font-size: .66em; letter-spacing: .12em; text-transform: uppercase; color: var(--ks-brass-l); }
  .ksn-purse .v { font-family: var(--font-mono, monospace); font-size: 1.3em; color: #fff; line-height: 1.1; }
  .ksn-purse .v.flash-up { color: #9ef0b4; } .ksn-purse .v.flash-down { color: #ffb4a6; }
  .ksn-vault { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 99px; background: rgba(7,12,18,.55);
    border: 1px solid rgba(211,163,66,.3); font-size: .8em; color: var(--ks-dim); }
  .ksn-vault .ico { width: 14px; height: 14px; color: var(--ks-brass-l); }
  .ksn-vault b { color: #fbeabb; font-family: var(--font-mono, monospace); font-weight: 400; }

  /* host */
  .ksn-host { display: flex; gap: 11px; align-items: center; margin-bottom: 12px; padding: 9px 12px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid rgba(211,163,66,.22); }
  .ksn-host .face { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; flex-shrink: 0; border: 2px solid var(--ks-brass); background: #2a1e12; }
  .ksn-host .face svg { width: 100%; height: 100%; display: block; }
  .ksn-host .nm { font-family: var(--font-title); font-size: .76em; letter-spacing: .06em; color: var(--ks-brass-l); }
  .ksn-host .tx { font-style: italic; font-size: .93em; color: var(--ks-ink); }

  /* lobi */
  .ksn-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
  .ksn-grid.soon { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 860px) { .ksn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ksn-grid.soon { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .ksn-grid { gap: 8px; } .ksn-grid.soon { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  button.ksn-tcard { font: inherit; }
  .ksn-tcard { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; padding: 13px 12px 12px; border-radius: 12px;
    background: radial-gradient(circle at 50% 0%, rgba(24,82,59,.5), transparent 72%), linear-gradient(180deg, #16241f, #120f0d);
    border: 1px solid rgba(211,163,66,.4); box-shadow: 0 6px 16px rgba(0,0,0,.35); cursor: pointer; text-align: left; color: inherit;
    transition: transform .18s, border-color .18s, box-shadow .18s; }
  .ksn-tcard:hover:not(:disabled), .ksn-tcard:focus-visible { transform: translateY(-3px); border-color: var(--ks-brass-l); box-shadow: 0 12px 26px rgba(0,0,0,.55); outline: none; }
  .ksn-tcard:disabled { cursor: not-allowed; opacity: .55; }
  .ksn-tcard .ti { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 8px;
    background: radial-gradient(circle at 30% 30%, rgba(211,163,66,.26), rgba(15,11,8,.6)); border: 1px solid rgba(211,163,66,.5); }
  .ksn-tcard .ti svg { width: 26px; height: 26px; }
  #modalBox .ksn-tcard h3 { margin: 0 0 4px; font-family: var(--font-title); font-weight: 700; font-size: 1.02em; color: var(--ks-brass-l); letter-spacing: .03em; }
  .ksn-tcard p { margin: 0; font-size: .82em; color: var(--ks-dim); line-height: 1.35; }
  .ksn-tcard .meta { display: flex; justify-content: space-between; gap: 6px; padding-top: 8px; border-top: 1px dashed rgba(211,163,66,.28); font-size: .74em; color: #b9a982; }
  .ksn-tcard .meta b { color: #fbeabb; font-family: var(--font-mono, monospace); font-weight: 400; }
  .ksn-tcard .go { position: absolute; top: 12px; right: 12px; font-family: var(--font-title); font-size: .62em; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 99px; background: rgba(70,168,98,.18); color: #9ef0b4; border: 1px solid rgba(70,168,98,.45); }
  .ksn-tcard .go.busy { background: rgba(224,165,60,.2); color: #ffd98a; border-color: rgba(224,165,60,.5); }
  .ksn-tcard .go.shut { background: rgba(207,75,51,.18); color: #ffb4a6; border-color: rgba(207,75,51,.5); }
  .ksn-tcard.soon { cursor: default; background: linear-gradient(180deg, rgba(22,18,15,.92), rgba(13,10,8,.96)); border-style: dashed; border-color: rgba(211,163,66,.3); }
  .ksn-tcard.soon:hover { transform: none; box-shadow: 0 6px 16px rgba(0,0,0,.35); border-color: rgba(211,163,66,.3); }
  #modalBox .ksn-tcard.soon h3 { color: var(--ks-dim); font-size: .92em; }
  .ksn-tcard.soon .ti { opacity: .6; width: 34px; height: 34px; margin-bottom: 6px; }
  .ksn-tcard.soon .ti .ico { width: 18px; height: 18px; color: var(--ks-brass); }
  .ksn-tcard.soon { padding: 11px 10px 10px; gap: 6px; }
  .ksn-tcard.soon p { font-size: .76em; }
  .ksn-tcard.soon .go { position: static; display: inline-block; margin-top: 2px; align-self: flex-start; }
  .ksn-tcard.soon .go { background: rgba(211,163,66,.1); color: var(--ks-brass-l); border-color: rgba(211,163,66,.35); }
  .ksn-sub { margin: 14px 0 8px; font-family: var(--font-title); font-size: .7em; letter-spacing: .14em; text-transform: uppercase; color: var(--ks-brass-l);
    display: flex; align-items: center; gap: 8px; }
  .ksn-sub::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(211,163,66,.4), transparent); }

  /* catatan */
  .ksn-ledger { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid rgba(211,163,66,.24); }
  .ksn-ledger .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 7px; font-family: var(--font-title);
    font-size: .74em; letter-spacing: .1em; text-transform: uppercase; color: var(--ks-brass-l); }
  .ksn-ledger .hd span { font-family: var(--font-body); text-transform: none; letter-spacing: 0; color: var(--ks-dim); font-size: 1.1em; }
  .ksn-ledger ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: .84em; }
  .ksn-ledger li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 9px; border-radius: 7px; background: rgba(0,0,0,.28); color: var(--ks-dim); }
  .ksn-ledger li b { color: var(--ks-ink); font-weight: 600; }
  .ksn-amt { font-family: var(--font-mono, monospace); white-space: nowrap; }
  .ksn-amt.pos { color: #8ee8a8; } .ksn-amt.neg { color: #ffa392; } .ksn-amt.zero { color: #fbeabb; }

  /* pintu tertutup */
  .ksn-closed { text-align: center; padding: 26px 18px; border-radius: 14px;
    background: radial-gradient(circle at 50% 0%, rgba(207,75,51,.18), transparent 65%), linear-gradient(180deg, #1d1210, #120c0b); border: 1.5px solid rgba(207,75,51,.55); }
  .ksn-closed.calm { background: radial-gradient(circle at 50% 0%, rgba(211,163,66,.16), transparent 65%), linear-gradient(180deg, #17130e, #0f0c09); border-color: rgba(211,163,66,.45); }
  .ksn-closed .ico { width: 34px; height: 34px; color: var(--ks-brass-l); }
  #modalBox .ksn-closed h3 { margin: 6px 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5em; color: var(--ks-brass-l); letter-spacing: .03em; }
  .ksn-closed p { margin: 0 auto 12px; max-width: 520px; color: var(--ks-dim); }

  /* meja */
  .ksn-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(211,163,66,.28); }
  #modalBox .ksn-top h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5em; color: var(--ks-brass-l); letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }
  .ksn-top h2 .tic { width: 26px; height: 26px; display: inline-grid; }
  .ksn-top h2 .tic svg { width: 26px; height: 26px; }
  .ksn-felt { position: relative; border-radius: 16px; padding: 18px 14px 14px; margin-bottom: 11px;
    background: radial-gradient(ellipse at 50% 35%, #1e6247 0%, var(--ks-felt-d) 78%, #071912 100%); border: 3px solid #8f6522;
    box-shadow: inset 0 0 44px rgba(0,0,0,.7), inset 0 0 0 1px rgba(240,207,120,.22), 0 10px 24px rgba(0,0,0,.5); }
  .ksn-felt::before { content: ''; position: absolute; inset: 8px; border-radius: 11px; border: 1px dashed rgba(240,207,120,.16); pointer-events: none; }
  .ksn-result { margin-top: 12px; padding: 11px 13px; border-radius: 11px; text-align: center; font-size: .96em; min-height: 44px; display: block; line-height: 1.45;
    background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.14); color: var(--ks-ink); transition: background .25s, border-color .25s; }
  .ksn-result.win { background: rgba(70,168,98,.24); border-color: var(--ks-good); color: #c8f7d4; }
  .ksn-result.lose { background: rgba(207,75,51,.22); border-color: var(--ks-bad); color: #ffd5cd; }
  .ksn-result.push { background: rgba(224,165,60,.2); border-color: var(--ks-warn); color: #fbeabb; }
  .ksn-result.big { animation: ksnPulse .9s ease 2; }
  @keyframes ksnPulse { 50% { box-shadow: 0 0 0 4px rgba(240,207,120,.45), 0 0 26px rgba(240,207,120,.5); } }

  /* dock taruhan */
  .ksn-dock { border-radius: 12px; padding: 11px 13px; display: grid; gap: 10px; background: linear-gradient(180deg, rgba(22,15,10,.92), rgba(12,8,5,.96)); border: 1px solid rgba(211,163,66,.42); }
  .ksn-dock .hd { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
  .ksn-dock .hd span { font-family: var(--font-title); font-size: .7em; letter-spacing: .1em; color: var(--ks-brass-l); text-transform: uppercase; }
  .ksn-dock .cur { font-family: var(--font-mono, monospace); font-size: 1.1em; color: #fff; }
  .ksn-dock .cur b { color: var(--ks-brass-l); font-weight: 400; }
  .ksn-chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .ksn-chip { min-width: 58px; height: 46px; padding: 0 10px; border-radius: 99px; border: 2px dashed rgba(255,255,255,.75); font-family: var(--font-mono, monospace); font-size: .84em; font-weight: 700; color: #fff; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.48), inset 0 0 0 3px rgba(0,0,0,.24); transition: transform .12s, box-shadow .15s, opacity .15s; }
  .ksn-chip:hover:not(:disabled) { transform: translateY(-2px); }
  .ksn-chip.on { box-shadow: 0 0 0 3px var(--ks-brass-l), 0 6px 14px rgba(0,0,0,.65); transform: translateY(-2px) scale(1.05); }
  .ksn-chip:disabled { opacity: .3; cursor: not-allowed; }
  .ksn-c100 { background: #365973; } .ksn-c500 { background: #2c6b4f; } .ksn-c1000 { background: #8a3629; } .ksn-c2500 { background: #683b7a; } .ksn-c5000 { background: #9c6f1e; }
  .ksn-own { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1; min-width: 210px; }
  .ksn-own input { flex: 1; min-width: 110px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--ks-brass); background: #0b1219; color: #fbeabb; font-family: var(--font-mono, monospace); font-size: .95em; }
  .ksn-own input:focus { outline: none; border-color: var(--ks-brass-l); box-shadow: 0 0 0 2px rgba(240,207,120,.25); }
  .ksn-own input.bad { border-color: var(--ks-bad); }
  .ksn-hint { font-size: .76em; color: #b9a982; }

  /* dadu */
  .ksn-dice { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
  #modalBox .ksn-dice h4 { margin: 0 0 9px; font-family: var(--font-title); color: var(--ks-brass-l); letter-spacing: .05em; font-size: .86em; }
  .ksn-dice h4 b { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 99px; background: rgba(0,0,0,.35); color: #fff; font-family: var(--font-mono, monospace); font-weight: 400; }
  .ksn-pair { display: flex; justify-content: center; gap: 10px; }
  .ksn-die { width: 64px; height: 64px; border-radius: 13px; display: grid; place-items: center; padding: 6px;
    background: linear-gradient(145deg, #fff, #d8d3c8); border: 2px solid var(--ks-brass); box-shadow: 0 6px 14px rgba(0,0,0,.48), inset 0 2px 3px #fff; }
  .ksn-die.roll { animation: ksnShake .28s ease infinite; }
  .ksn-die.win { box-shadow: 0 0 0 3px rgba(158,240,180,.7), 0 6px 14px rgba(0,0,0,.48); }
  @keyframes ksnShake { 0%,100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-12deg) scale(1.07); } 75% { transform: rotate(12deg) scale(1.07); } }
  .ksn-vs { font-family: var(--font-display); font-size: 1.5em; color: var(--ks-brass-l); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .ksn-cta { text-align: center; margin-top: 14px; }
  .ksn-cta .ksn-btn { min-width: 170px; min-height: 46px; font-size: .9em; }

  /* roulette */
  .ksn-rl { display: grid; grid-template-columns: 236px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { .ksn-rl { grid-template-columns: 1fr; } }
  .ksn-wheel { position: relative; width: 228px; height: 228px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #4b2f1b, #170e09 80%); border: 5px solid var(--ks-brass); box-shadow: 0 14px 32px rgba(0,0,0,.72), inset 0 0 18px rgba(0,0,0,.85), 0 0 0 2px #4a320c; }
  .ksn-wheel .ptr { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); z-index: 12; filter: drop-shadow(0 3px 4px rgba(0,0,0,.75)); }
  .ksn-wheel .ring { position: absolute; inset: 7px; border-radius: 50%; border: 1.5px solid rgba(240,207,120,.35); pointer-events: none; }
  .ksn-rotor { width: 198px; height: 198px; border-radius: 50%; will-change: transform; }
  .ksn-rotor svg { display: block; }
  .ksn-orbit { position: absolute; inset: 0; pointer-events: none; z-index: 9; will-change: transform; }
  .ksn-ball { position: absolute; left: 50%; top: 50%; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0%, #f4f1ea 45%, #cbc4b6 82%, #8e8575 100%); box-shadow: 0 3px 6px rgba(0,0,0,.85), 0 0 8px rgba(255,255,255,.75); transform: translateY(-95px); }
  .ksn-hub { position: absolute; width: 74px; height: 74px; border-radius: 50%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #372316, #0e0805); border: 2.5px solid var(--ks-brass-l); box-shadow: 0 4px 14px rgba(0,0,0,.8); font-family: var(--font-mono, monospace); }
  .ksn-hub b { font-size: 1.45em; line-height: 1; color: #fff; font-weight: 400; }
  .ksn-hub small { font-size: .6em; letter-spacing: .06em; color: var(--ks-brass-l); margin-top: 3px; text-transform: uppercase; }
  .ksn-board { display: grid; gap: 6px; }
  .ksn-nums { display: grid; grid-template-rows: repeat(3, auto); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
  @media (max-width: 520px) { .ksn-nums { grid-template-rows: none; grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .ksn-cell { position: relative; min-height: 34px; padding: 0; border-radius: 6px; border: 1px solid rgba(255,255,255,.22); color: #fff; font-family: var(--font-mono, monospace); font-size: .82em; cursor: pointer;
    transition: transform .1s, box-shadow .15s, filter .15s; }
  .ksn-cell:hover:not(:disabled) { filter: brightness(1.2); }
  .ksn-cell:active:not(:disabled) { transform: scale(.95); }
  .ksn-cell:disabled { cursor: not-allowed; opacity: .7; }
  .ksn-cell.r { background: #8e2219; } .ksn-cell.k { background: #15181d; }
  .ksn-cell.o { background: rgba(0,0,0,.4); font-family: var(--font-title); font-size: .72em; letter-spacing: .03em; min-height: 38px; }
  .ksn-cell.o.r { background: rgba(142,34,25,.85); } .ksn-cell.o.k { background: rgba(21,24,29,.92); }
  .ksn-cell.hit { box-shadow: 0 0 0 2px #9ef0b4, 0 0 14px rgba(158,240,180,.6); }
  .ksn-cell .stk { position: absolute; top: -7px; right: -5px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 99px; display: grid; place-items: center; z-index: 2;
    background: radial-gradient(circle at 35% 30%, #f8e094, #b67f22); color: #24170f; font-size: .64rem; font-weight: 700; border: 1.5px dashed #fff; box-shadow: 0 2px 5px rgba(0,0,0,.6); pointer-events: none; }
  .ksn-outs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .ksn-dz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  @media (max-width: 520px) { .ksn-outs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .ksn-rlbar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; justify-content: space-between; margin-top: 4px; }
  .ksn-rlbar .tot { font-family: var(--font-mono, monospace); color: #fff; } .ksn-rlbar .tot b { color: var(--ks-brass-l); font-weight: 400; }
  .ksn-rlbar .acts { display: flex; gap: 6px; flex-wrap: wrap; }

  /* blackjack */
  .ksn-bj { display: grid; gap: 14px; }

      if (m === 1) { result('push', 'Satu mutiara di garis tengah. Taruhan kembali utuh.'); sfx('click'); }
      else outcome(r, three ? 'Tiga ' + SYM_NAME[rs[0]].toLowerCase() + ' sejajar (' + m + '×)!' : 'Dua mutiara (' + m + '×)!', '', '');
    } else {
      bn.textContent = 'Tarik tuas atau tekan Spasi';
      result('lose', 'Belum sejajar di garis tengah. <b>−' + fmt(r.bet) + ' gold</b>'); sfx('page');
    }
    lock(false); settled(r);
  }
  // Spasi hanya memutar slot bila panel kasino terbuka di meja slot dan tidak sedang mengetik
  document.addEventListener('keydown', function (e) {
    if ((e.code !== 'Space' && e.key !== ' ') || currentPanel !== 'kasino' || K.view !== 'slot') return;
    var ov = document.getElementById('modalOverlay'); if (!ov || !ov.classList.contains('open')) return;
    var a = document.activeElement, t = (a && a.tagName) || '';
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (t === 'BUTTON' && !(a.closest && a.closest('#ksnRoot'))) return;   // tombol di luar meja tetap normal
    e.preventDefault(); if (!e.repeat) pull(true);
  });

  /* ---------- kaitan ke game ---------- */
  if (typeof PANEL_SIZE !== 'undefined') PANEL_SIZE.kasino = 'wide';
  var origOpen = window.openPanel;
  window.openPanel = function (panel) {
    if (panel === 'kasino') {
      if (!on() || !here()) { showToast('Kasino Mutiara hanya ada di Paradiso, Kapten.', 'info'); return; }
      if (atSea()) { showToast('PelicanSystem sedang offline, Kapten. Kasino hanya melayani saat kapal merapat.', 'error'); return; }
      var was = currentPanel === 'kasino';
      var r = origOpen.apply(this, arguments);
      if (!was) { K.view = 'lobby'; K.lastResult = null; K.bj = null; }
      render(); refresh();
      return r;
    }
    if (currentPanel === 'kasino') { stopBjTimer(); stopBulbs(); }
    return origOpen.apply(this, arguments);
  };
  wrap_('closeModal', null, function () { if (currentPanel === 'kasino') { stopBjTimer(); stopBulbs(); K.busy = false; } });
  // Pintu kasino di kartu Bank Paradiso (di bawah brankas, kartu VIP quest tetap di atas)
  wrap_('setModal_', function () {
    if (currentPanel !== 'bank' || !on() || !here()) return;
    var c = document.getElementById('modalContent'), v = c && c.querySelector('.vault'); if (!v || c.querySelector('.ksn-door')) return;
    var d = debt(), sea = atSea(), dis = d > 0 || sea;
    var anchor = c.querySelector('.bk-bankcard') || v;
    anchor.insertAdjacentHTML('afterend', '<div class="ksn-door"><div><h3>' + ic('dice') + ' Lantai Kasino Mutiara</h3>' +
      '<p>Duel Dadu Bandar, Roulette Mutiara, Blackjack, dan Slot Mutiara. Taruhan hanya dari gold di tangan; brankasmu tak tersentuh.</p>' +
      (d > 0 ? '<div class="lock">' + ic('lock') + '<span><b>Pintu dijaga juru buku.</b> Lunasi seluruh cicilan Moneylender dulu sebelum masuk.</span></div>' : '') +
      '</div><button class="btn btn-gold" id="ksnEnter"' + (dis ? ' disabled' : '') + '>' + ic('dice') + ' Masuk Kasino</button></div>');
    var b = document.getElementById('ksnEnter'); if (b) b.onclick = function () { au_('open'); openPanel('kasino'); };
  });
  wrap_('applyFreshState_', function () {
    if (currentPanel !== 'kasino') return;
    if (!on() || !here() || atSea()) { if (!K.busy && !(K.bj && K.bj.active)) { K.st = null; openPanel('bank'); } return; }
    paintGold();
  });
  // Lapau Paradiso: gosip kasino
  wrap_('setModal_', function () {
    if (currentPanel !== 'tavern' || !on() || !here()) return;
    var el = document.getElementById('rumorList'); if (!el || el.querySelector('.ksn-rumor')) return;
    var d = document.createElement('div'); d.className = 'card rumor ksn-rumor';
    d.innerHTML = ic('chat') + '<span>' + pickLine_(['Lampu kristal Kasino Mutiara menyala sampai fajar. Ada kapten yang keluar sambil bersiul, ada yang keluar tanpa sepatu.',
      'Bandar kasino itu tak pernah tersenyum, kecuali saat dadu berhenti berputar.', 'Kata orang, mesin slot di pojok kasino suka mutiara. Kata Chasong, mesin itu suka gold-mu.'], 'ksnrum') + '</span>';
    el.insertBefore(d, el.firstChild);
  });

  return { open: function () { openPanel('kasino'); }, state: function () { return K; } };
})();
</script>
