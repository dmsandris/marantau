  /* =========================================================================
   * 2. MESIN FISIKA DETERMINISTIK BILANGAN BULAT (window.PacuSelat.sim)
   *    100% bebas float, bebas Math.pow/sqrt/sin/toFixed/round/imul/>>>.
   *    Identik dengan implementasi server PostgreSQL PL/pgSQL.
   * ========================================================================= */
  function prngInit(seed) {
    const s = Math.trunc(Number(seed) || 0);
    return (Math.abs(s) % 2147483646) + 1;
  }

  function prngNext(s) {
    return (s * 48271) % 2147483647;
  }

  function tickToMs(k) {
    return Math.trunc((k * CONFIG.SIMULASI.TICK_NUM_MS) / CONFIG.SIMULASI.TICK_DEN_MS);
  }

  function waktuMeriam(seed) {
    const s1 = prngNext(prngInit(seed));
    return CONFIG.START.HITUNG_MUNDUR_DASAR_MS + (s1 % (CONFIG.START.VARIASI_HITUNG_MUNDUR_MS + 1));
  }

  function torsiDariRpmPermil(rPermil) {
    const tabel = CONFIG.MESIN_DAN_GRIP.TABEL_TORSI_PERMIL;
    const rClamped = Math.max(0, Math.min(1000, rPermil));
    const idx = Math.min(9, Math.trunc(rClamped / 100));
    const rem = rClamped - idx * 100;
    const t0 = tabel[idx];
    const t1 = tabel[idx + 1];
    return t0 + Math.trunc(((t1 - t0) * rem) / 100);
  }

  function spesifikasi(kelasId, partIds, rasioPreset) {
    const kapal = CONFIG.KELAS_KAPAL[kelasId] || CONFIG.KELAS_KAPAL.sekoci_standar;
    let accelPermil = kapal.pengaliAkselPermil;
    let topMmPerSec = kapal.topSpeedDasarMmPerSec;
    let maxRpm = CONFIG.MESIN_DAN_GRIP.MAX_RPM_DASAR;
    let rpmRate = CONFIG.MESIN_DAN_GRIP.LAJU_RPM_DASAR;
    let shiftLagMs = CONFIG.TRANSMISI.JEDA_OPER_GIGI_DASAR_MS;
    let antiBatukPermil = CONFIG.PANAS_DAN_BATUK.ANTI_BATUK_DASAR_PERMIL;
    let greenStartPermil = CONFIG.JENDELA_TIMING.HIJAU_AWAL_DASAR_PERMIL - (kapal.bonusZonaHijauPermil || 0);
    const greenEndPermil = CONFIG.JENDELA_TIMING.HIJAU_AKHIR_PERMIL;
    const starBandPermil = CONFIG.JENDELA_TIMING.LEBAR_BINTANG_DASAR_PERMIL;
    let boostPowerPermil = CONFIG.SKILL_SEMBURAN.DAYA_SEMBURAN_DASAR_PERMIL;
    let boostDurMs = CONFIG.SKILL_SEMBURAN.DURASI_SEMBURAN_DASAR_MS;

    const daftarPart = Array.isArray(partIds) ? partIds : [];
    for (let i = 0; i < daftarPart.length; i++) {
      const p = CONFIG.KOMPONEN[daftarPart[i]];
      if (!p || !p.efek) continue;
      const fx = p.efek;
      if (fx.accelPermil) accelPermil += fx.accelPermil;
      if (fx.mmPerSec) topMmPerSec += fx.mmPerSec;
      if (fx.maxRpm) maxRpm += fx.maxRpm;
      if (fx.rpmRate) rpmRate += fx.rpmRate;
      if (fx.shiftLagPermil) shiftLagMs = Math.trunc((shiftLagMs * fx.shiftLagPermil) / 1000);
      if (fx.antiBatukPermil) {
        antiBatukPermil = Math.min(CONFIG.PANAS_DAN_BATUK.ANTI_BATUK_MAKS_PERMIL, antiBatukPermil + fx.antiBatukPermil);
      }
      if (fx.sweetBonusPermil) {
        greenStartPermil = Math.max(CONFIG.JENDELA_TIMING.HIJAU_AWAL_MIN_PERMIL, greenStartPermil - fx.sweetBonusPermil);
      }
      if (fx.boostPowerPermil) boostPowerPermil += fx.boostPowerPermil;
      if (fx.boostDurMs) boostDurMs += fx.boostDurMs;
    }

    shiftLagMs = Math.max(CONFIG.TRANSMISI.JEDA_OPER_GIGI_MIN_MS, shiftLagMs);

    const setelan = CONFIG.SETELAN_RASIO[String(rasioPreset || '800')] || CONFIG.SETELAN_RASIO['800'];
    accelPermil = Math.trunc((accelPermil * setelan.pengaliAkselPermil) / 1000);
    topMmPerSec = Math.trunc((topMmPerSec * setelan.pengaliTopSpeedPermil) / 1000);

    const rawStretch = Math.trunc(((accelPermil - 1000) * CONFIG.TRANSMISI.KOEF_RENTANG_TENAGA_PERMIL) / 1000) + setelan.geserRentangGigiPermil;
    const powerStretchPermil = Math.min(
      CONFIG.TRANSMISI.PENGALI_RENTANG_TENAGA_MAKS_PERMIL,
      Math.max(CONFIG.TRANSMISI.PENGALI_RENTANG_TENAGA_MIN_PERMIL, rawStretch)
    );

    const dasarGigi = CONFIG.TRANSMISI.RASIO_GIGI_DASAR_PERMIL;
    const bobotGigi = CONFIG.TRANSMISI.BOBOT_RENTANG_PER_GIGI_PERMIL;
    const gearFactorsPermil = [0];
    for (let g = 1; g <= CONFIG.TRANSMISI.JUMLAH_GIGI; g++) {
      const val = g === CONFIG.TRANSMISI.JUMLAH_GIGI
        ? 1000
        : dasarGigi[g] + Math.trunc((powerStretchPermil * bobotGigi[g]) / 1000);
      gearFactorsPermil.push(val);
    }

    return {
      kelasId: kapal.id,
      partIds: daftarPart.slice(),
      accelPermil,
      topMmPerSec,
      maxRpm,
      rpmRate,
      shiftLagMs,
      antiBatukPermil,
      greenStartPermil,
      greenEndPermil,
      starBandPermil,
      gearFactorsPermil,
      boostPowerPermil,
      boostDurMs
    };
  }

  function jendelaGigi(spec, gear) {
    const JT = CONFIG.JENDELA_TIMING;
    const MG = CONFIG.MESIN_DAN_GRIP;
    const zMulPermil = JT.PENGALI_LEBAR_PER_GIGI_PERMIL[gear] || 1000;
    const baseGreenWidth = Math.trunc(((spec.greenEndPermil - spec.greenStartPermil) * zMulPermil) / 1000);
    const starMul = Math.max(1000, Math.trunc((zMulPermil * 900) / 1000));
    const baseStarWidth = Math.trunc((spec.starBandPermil * starMul) / 1000);

    const gFactor = spec.gearFactorsPermil ? spec.gearFactorsPermil[gear] : 500;
    const gTopMmPerSec = Math.max(MG.MIN_TOP_GIGI_MM_S, Math.trunc((spec.topMmPerSec * gFactor) / 1000));
    const rawBaseAccel = MG.AKSELERASI_DASAR_MM_S2 - gear * MG.PENURUNAN_AKSEL_PER_GIGI_MM_S2;
    const estAccelMmPerSec2 = Math.max(MG.MIN_AKSEL_EST_MM_S2, Math.trunc((rawBaseAccel * spec.accelPermil * 880) / 1000000));
    const estRpmPerSecPermil = Math.max(180, Math.trunc((estAccelMmPerSec2 * 1000) / gTopMmPerSec));

    const minGreenWidth = Math.min(
      JT.LEBAR_HIJAU_MAKS_PERMIL,
      Math.trunc((estRpmPerSecPermil * JT.WAKTU_REAKSI_MIN_HIJAU_MS) / 1000)
    );
    const minStarWidth = Math.min(
      JT.LEBAR_BINTANG_MAKS_PERMIL,
      Math.trunc((estRpmPerSecPermil * JT.WAKTU_REAKSI_MIN_BINTANG_MS) / 1000)
    );

    const greenWidth = Math.max(baseGreenWidth, minGreenWidth);
    const starWidth = Math.max(baseStarWidth, minStarWidth);
    const greenEndPermil = spec.greenEndPermil;
    const greenStartPermil = Math.max(JT.HIJAU_AWAL_MIN_PERMIL, greenEndPermil - greenWidth);
    const starStartPermil = Math.max(greenStartPermil + 20, greenEndPermil - starWidth);

    return { greenStartPermil, starStartPermil, greenEndPermil, estRpmPerSecPermil };
  }

  function buat(spec, opsi) {
    const o = opsi || {};
    return {
      id: String(o.id || 'pemain'),
      nama: String(o.nama || 'Kapten Perantau'),
      isPemain: o.isPemain !== false,
      isBayangan: !!o.isBayangan,
      kelas: spec.kelasId || 'sekoci_standar',
      spec,
      jarakMm: Math.trunc(Number(o.jarakMm) || CONFIG.LINTASAN.JARAK_STANDAR_MM),
      autoShift: !!o.autoShift,
      aiReaksiMs: Math.trunc(Number(o.aiReaksiMs) || CONFIG.AI_SIMULASI.REAKSI_DEFAULT_MS),
      aiShiftNoisePermil: Math.trunc(Number(o.aiShiftNoisePermil) || 0),
      aiSebaranPermil: Math.max(0, Math.trunc(Number(o.aiSebaranPermil) || 0)),
      aiRng: prngInit(o.aiSeed != null ? o.aiSeed : 1),
      aiTargetPermil: null,
      logLawan: Array.isArray(o.logLawan) ? o.logLawan.map(e => [Math.trunc(Number(e[0]) || 0), Math.trunc(Number(e[1]) || 0)]).sort((a, b) => a[0] - b[0]) : null,
      logLawanCursor: 0,
      launched: false,
      jumpStart: false,
      pendingJumpLaunch: false,
      reaksiMs: null,
      elapsedRaceMs: 0,
      posMm: 0,
      speedMmPerSec: 0,
      maxSpeedMmPerSec: 0,
      zeroToHundredMs: null,
      gear: 1,
      rpmPermil: 0,
      heatMikro: 0,
      wearMikro: 0,
      coughCount: 0,
      exploded: false,
      shiftLagMs: 0,
      coughTimerMs: 0,
      boostUsed: false,
      boostLeftMs: 0,
      tombolDitahan: false,
      tahanGigi5SejakMs: -1,
      shifts: [],
      finishWaktuMs: null,
      eventsTick: []
    };
  }

  function input(s, tekan, tms) {
    if (!s || s.exploded || s.finishWaktuMs !== null) return s;
    const st = s.spec;
    const isTekan = Math.trunc(Number(tekan) || 0) === 1;
    const tRel = Math.trunc(Number(tms) || 0);

    if (!isTekan) {
      s.tombolDitahan = false;
      s.tahanGigi5SejakMs = -1;
      return s;
    }

    s.tombolDitahan = true;

    // 1. Belum lepas start
    if (!s.launched) {
      if (tRel < CONFIG.START.BATAS_REAKSI_SAH_MS) {
        if (!s.jumpStart) {
          s.jumpStart = true;
          s.eventsTick.push({ kapalId: s.id, jenis: 'curi_start', label: 'CURI START', sub: 'tertahan setengah detik' });
        }
        if (tRel < 0) {
          s.pendingJumpLaunch = true;
          return s;
        }
      }
      s.launched = true;
      s.pendingJumpLaunch = false;
      s.reaksiMs = Math.max(0, tRel);
      if (s.jumpStart) {
        s.elapsedRaceMs += CONFIG.START.PENALTI_CURI_START_MS;
        s.speedMmPerSec = Math.trunc((CONFIG.START.KECEPATAN_CURI_START_MM_S * st.accelPermil) / 1000);
      } else {
        const bonusPermil = tRel < CONFIG.START.AMBANG_REAKSI_KILAT_MS
          ? CONFIG.START.BONUS_REAKSI_KILAT_PERMIL
          : 1000;
        s.speedMmPerSec = Math.trunc((CONFIG.START.KECEPATAN_START_NORMAL_MM_S * st.accelPermil * bonusPermil) / 1000000);
      }
      s.eventsTick.push({ kapalId: s.id, jenis: 'lepas_start', label: 'LEPAS!' });
      return s;
    }

    // 2. Sudah lepas start: oper gigi naik bila belum gigi 5
    if (s.gear < CONFIG.TRANSMISI.JUMLAH_GIGI) {
      if (s.shiftLagMs > 0) return s;

      const r = s.rpmPermil;
      const win = jendelaGigi(st, s.gear);
      const gracePermil = Math.min(
        CONFIG.JENDELA_TIMING.TOLERANSI_GRACE_MAKS_PERMIL,
        Math.trunc((win.estRpmPerSecPermil * CONFIG.JENDELA_TIMING.TOLERANSI_GRACE_MS) / 1000)
      );
      let q = 'tepat';

      if (r < win.greenStartPermil - gracePermil) {
        q = 'awal';
        s.eventsTick.push({ kapalId: s.id, jenis: 'oper_awal', label: 'AWAL', sub: 'tenaga hilang' });
      } else if (r < win.starStartPermil - gracePermil) {
        q = 'tepat';
        s.speedMmPerSec += Math.trunc((CONFIG.TRANSMISI.BONUS_KECEPATAN_TEPAT_MM_S * st.accelPermil) / 1000);
        s.eventsTick.push({ kapalId: s.id, jenis: 'oper_tepat', label: 'TEPAT' });
      } else if (r <= win.greenEndPermil + gracePermil) {
        q = 'sempurna';
        s.speedMmPerSec += Math.trunc((CONFIG.TRANSMISI.BONUS_KECEPATAN_SEMPURNA_MM_S * st.accelPermil) / 1000);
        s.eventsTick.push({ kapalId: s.id, jenis: 'oper_sempurna', label: 'SEMPURNA' });
      } else {
        q = 'telat';
        s.eventsTick.push({ kapalId: s.id, jenis: 'oper_telat', label: 'TELAT', sub: 'mentok garis merah' });
      }

      s.shifts.push({ gear: s.gear, kualitas: q });
      s.gear += 1;
      const faktorJeda = q === 'sempurna'
        ? CONFIG.TRANSMISI.FAKTOR_JEDA_SEMPURNA_PERMIL
        : (q === 'tepat' ? CONFIG.TRANSMISI.FAKTOR_JEDA_TEPAT_PERMIL : CONFIG.TRANSMISI.FAKTOR_JEDA_TELAT_PERMIL);
      s.shiftLagMs = Math.trunc((st.shiftLagMs * faktorJeda) / 1000);
      const minGigiAtas = CONFIG.TRANSMISI.RASIO_RPM_MIN_GIGI_ATAS_PERMIL;
      s.rpmPermil = Math.max(minGigiAtas, Math.trunc((s.rpmPermil * CONFIG.TRANSMISI.FAKTOR_TURUN_RPM_OPER_PERMIL) / 1000));

      if (s.gear === CONFIG.TRANSMISI.JUMLAH_GIGI && !s.boostUsed) {
        s.tahanGigi5SejakMs = tRel;
      }
      return s;
    }

    // 3. Sudah di gigi 5: mulai tahan tombol untuk Semburan Oli Hitam
    if (s.gear === CONFIG.TRANSMISI.JUMLAH_GIGI && !s.boostUsed && s.tahanGigi5SejakMs < 0) {
      s.tahanGigi5SejakMs = tRel;
    }
    return s;
  }

  function aktivasiSemburanInternal(s) {
    const st = s.spec;
    s.boostUsed = true;
    s.boostLeftMs = st.boostDurMs;
    s.tahanGigi5SejakMs = -1;
    s.heatMikro += Math.trunc((CONFIG.SKILL_SEMBURAN.TAMBAHAN_PANAS_SEMBURAN * (1300 - st.antiBatukPermil)) / 1300);
    s.eventsTick.push({ kapalId: s.id, jenis: 'semburan', label: 'SEMBURAN!', sub: 'oli hitam' });
  }

  function step(s, k, meriamMs) {
    if (!s) return s;
    const offsetMeriam = Math.trunc(Number(meriamMs) || 0);
    const tms = tickToMs(k) - offsetMeriam;
    const dtMs = k > 0 ? (tickToMs(k) - tickToMs(k - 1)) : 0;

    if (k === 0) return s;

    if (tms < 0) {
      s.rpmPermil = CONFIG.START.RPM_IDLE_PRA_START_PERMIL;
      return s;
    }

    if (s.exploded || s.finishWaktuMs !== null) return s;

    const st = s.spec;
    const manusia = s.isPemain || !!s.logLawan;   // pemain atau bayangan yang memutar log
    const MG = CONFIG.MESIN_DAN_GRIP;
    const PB = CONFIG.PANAS_DAN_BATUK;
    const TR = CONFIG.TRANSMISI;
    const AI = CONFIG.AI_SIMULASI;

    // Lepas start tertunda akibat curi start saat hitung mundur
    if (!s.launched && s.pendingJumpLaunch) {
      s.launched = true;
      s.pendingJumpLaunch = false;
      s.reaksiMs = 0;
      s.elapsedRaceMs += CONFIG.START.PENALTI_CURI_START_MS;
      s.speedMmPerSec = Math.trunc((CONFIG.START.KECEPATAN_CURI_START_MM_S * st.accelPermil) / 1000);
      s.eventsTick.push({ kapalId: s.id, jenis: 'lepas_start', label: 'LEPAS!' });
    }

    // Lepas start otomatis bila diam melewati batas atau reaksi lawan AI
    if (manusia) {
      if (!s.launched && tms >= CONFIG.START.BATAS_AUTO_LEPAS_MS) {
        input(s, 1, tms);
        input(s, 0, tms);
      }
    } else {
      if (!s.launched && tms >= s.aiReaksiMs) {
        input(s, 1, tms);
        input(s, 0, tms);
      }
    }

    s.elapsedRaceMs += dtMs;

    if (!s.launched) {
      s.rpmPermil = CONFIG.START.RPM_IDLE_PRA_START_PERMIL;
      return s;
    }

    // Aktifkan Semburan Oli Hitam bila tombol ditahan di gigi 5 >= DURASI_TAHAN_AKTIVASI_MS
    if (s.tombolDitahan && s.tahanGigi5SejakMs >= 0 && s.gear === TR.JUMLAH_GIGI && !s.boostUsed) {
      if ((tms - s.tahanGigi5SejakMs) >= CONFIG.SKILL_SEMBURAN.DURASI_TAHAN_AKTIVASI_MS) {
        aktivasiSemburanInternal(s);
      }
    }

    if (s.shiftLagMs > 0) s.shiftLagMs = Math.max(0, s.shiftLagMs - dtMs);
    if (s.coughTimerMs > 0) s.coughTimerMs = Math.max(0, s.coughTimerMs - dtMs);
    if (s.boostLeftMs > 0) s.boostLeftMs = Math.max(0, s.boostLeftMs - dtMs);

    const gearFactors = st.gearFactorsPermil || TR.RASIO_GIGI_DASAR_PERMIL;
    const pacuAkhirPermil = (!manusia && s.posMm > Math.trunc((s.jarakMm * AI.RASIO_JARAK_PACU_AKHIR_PERMIL) / 1000))
      ? AI.PENGALI_TOP_PACU_AKHIR_PERMIL
      : 1000;
    const boostTopPermil = s.boostLeftMs > 0 ? CONFIG.SKILL_SEMBURAN.PENGALI_TOP_SPEED_SEMBURAN_PERMIL : 1000;
    const gearTopMmPerSec = Math.trunc(
      (Math.trunc((st.topMmPerSec * gearFactors[s.gear]) / 1000) * boostTopPermil * pacuAkhirPermil) / 1000000
    );

    let thrPermil = s.shiftLagMs > 0 ? MG.THROTTLE_SAAT_JEDA_GIGI_PERMIL : 1000;
    if (s.coughTimerMs > 0) {
      thrPermil = Math.trunc((thrPermil * MG.THROTTLE_SAAT_BATUK_PERMIL) / 1000);
    }

    const rPermil = gearTopMmPerSec > 0 ? Math.min(1000, Math.trunc((s.speedMmPerSec * 1000) / gearTopMmPerSec)) : 0;
    const torquePermil = Math.max(MG.FAKTOR_TORSI_MIN_PERMIL, torsiDariRpmPermil(rPermil));

    const baseAccel = MG.AKSELERASI_DASAR_MM_S2 - s.gear * MG.PENURUNAN_AKSEL_PER_GIGI_MM_S2;
    let accelMmPerSec2 = Math.trunc(
      (Math.trunc((baseAccel * st.accelPermil) / 1000) * torquePermil * thrPermil) / 1000000
    );
    if (s.boostLeftMs > 0) {
      accelMmPerSec2 = Math.trunc((accelMmPerSec2 * st.boostPowerPermil) / 1000);
    }

    const dragMmPerSec2 = Math.trunc(
      (s.speedMmPerSec * s.speedMmPerSec * MG.GRIP_AIR_KOEF_HAMBATAN) / 1000000000
    );
    accelMmPerSec2 -= dragMmPerSec2;

    const deltaV = Math.trunc(accelMmPerSec2 / CONFIG.SIMULASI.HZ);
    s.speedMmPerSec = Math.max(0, Math.min(gearTopMmPerSec, s.speedMmPerSec + deltaV));
    if (s.speedMmPerSec > s.maxSpeedMmPerSec) {
      s.maxSpeedMmPerSec = s.speedMmPerSec;
    }

    if (s.zeroToHundredMs === null && s.speedMmPerSec >= CONFIG.SIMULASI.AMBANG_ZERO_HUNDRED_MM_S) {
      s.zeroToHundredMs = s.elapsedRaceMs;
    }

    s.posMm += Math.trunc(s.speedMmPerSec / CONFIG.SIMULASI.HZ);

    const rawRPermil = gearTopMmPerSec > 0 ? Math.trunc((s.speedMmPerSec * 1000) / gearTopMmPerSec) : 0;
    const minRpmGigi = s.gear === 1 ? TR.RASIO_RPM_MIN_GIGI_1_PERMIL : TR.RASIO_RPM_MIN_GIGI_ATAS_PERMIL;
    s.rpmPermil = Math.min(1000, Math.max(minRpmGigi, rawRPermil));

    // Asisten Auto-Shift atau Transmisi Lawan AI deterministik
    if ((s.autoShift || !manusia) && s.gear < TR.JUMLAH_GIGI && s.shiftLagMs <= 0) {
      const winAuto = jendelaGigi(st, s.gear);
      let targetShiftPermil;
      if (manusia) {
        targetShiftPermil = Math.trunc((winAuto.greenStartPermil + winAuto.starStartPermil) / 2);
      } else {
        // Lawan AI: bidikan tiap gigi diundi ulang dari PRNG kapal sendiri (titik bintang + geser ± sebaran)
        if (s.aiTargetPermil === null) {
          s.aiRng = prngNext(s.aiRng);
          s.aiTargetPermil = winAuto.starStartPermil + s.aiShiftNoisePermil +
            (s.aiRng % (2 * s.aiSebaranPermil + 1)) - s.aiSebaranPermil;
        }
        targetShiftPermil = s.aiTargetPermil;
      }
      if (s.rpmPermil >= targetShiftPermil) {
        input(s, 1, tms);
        input(s, 0, tms);
        s.aiTargetPermil = null;
      }
    }

    // Lawan AI mengaktifkan semburan di gigi 5 pada 72% lintasan
    if (!manusia && s.gear === TR.JUMLAH_GIGI && !s.boostUsed && s.posMm >= Math.trunc((s.jarakMm * AI.RASIO_JARAK_SEMBURAN_AI_PERMIL) / 1000)) {
      aktivasiSemburanInternal(s);
    }

    // Simulasi suhu & keausan blok mesin (skala mikro 0..1.000.000)
    const heatResistPermil = 1000 + Math.trunc((st.antiBatukPermil * PB.FAKTOR_TAHAN_PANAS_PERMIL) / 1000);
    // Gigi 5 tidak bisa dinaikkan lagi: mesin hanya memanas di sana selama Semburan Oli Hitam.
    const bisaPanas = s.gear < TR.JUMLAH_GIGI || s.boostLeftMs > 0;
    if (bisaPanas && s.rpmPermil > PB.AMBANG_RPM_PANAS_PERMIL) {
      const lajuPanas = s.rpmPermil >= PB.AMBANG_RPM_MERAH_PENUH_PERMIL
        ? PB.LAJU_PANAS_MERAH_PENUH
        : PB.LAJU_PANAS_ZONA_KUNING;
      const panPerTick = Math.trunc((lajuPanas * 1000) / (CONFIG.SIMULASI.HZ * heatResistPermil));
      s.heatMikro += panPerTick;
      if (s.coughTimerMs > 0 || s.heatMikro > PB.AMBANG_PANAS_AUS) {
        const lajuAus = s.coughTimerMs > 0 ? PB.LAJU_KEAUSAN_OVERHEAT : PB.LAJU_KEAUSAN_TINGGI;
        s.wearMikro += Math.trunc(lajuAus / CONFIG.SIMULASI.HZ);
      }
    } else {
      s.heatMikro = Math.max(0, s.heatMikro - Math.trunc(PB.LAJU_PENDINGINAN / CONFIG.SIMULASI.HZ));
      if (s.coughTimerMs <= 0) {
        s.wearMikro = Math.max(0, s.wearMikro - Math.trunc(PB.LAJU_PEMULIHAN_KEAUSAN / CONFIG.SIMULASI.HZ));
      }
    }

    if (s.heatMikro >= CONFIG.SIMULASI.SKALA_JUTA && st.antiBatukPermil < PB.ANTI_BATUK_MAKS_PERMIL) {
      s.heatMikro = PB.PANAS_SETELAH_BATUK;
      s.coughTimerMs = PB.DURASI_BATUK_MS;
      s.coughCount += 1;
      s.wearMikro += PB.KEAUSAN_PER_BATUK;
      if (s.wearMikro >= CONFIG.SIMULASI.SKALA_JUTA || s.coughCount >= PB.BATAS_JUMLAH_BATUK_JEBOL) {
        s.exploded = true;
        s.speedMmPerSec = 0;
        s.boostLeftMs = 0;
        s.eventsTick.push({ kapalId: s.id, jenis: 'jebol', label: 'MESIN JEBOL!', sub: 'blok mesin pecah akibat panas' });
        return s;
      }
      s.eventsTick.push({
        kapalId: s.id,
        jenis: 'batuk',
        label: 'MESIN BATUK (' + s.coughCount + '/' + PB.BATAS_JUMLAH_BATUK_JEBOL + ')',
        sub: 'awas mesin jebol!'
      });
    } else if (s.heatMikro >= CONFIG.SIMULASI.SKALA_JUTA && st.antiBatukPermil >= PB.ANTI_BATUK_MAKS_PERMIL) {
      s.heatMikro = PB.PANAS_ECU_PINTAR;
      s.wearMikro += Math.trunc(PB.LAJU_KEAUSAN_ECU / CONFIG.SIMULASI.HZ);
    }

    if (s.wearMikro >= CONFIG.SIMULASI.SKALA_JUTA) {
      s.exploded = true;
      s.speedMmPerSec = 0;
      s.boostLeftMs = 0;
      s.eventsTick.push({ kapalId: s.id, jenis: 'jebol', label: 'MESIN JEBOL!', sub: 'blok mesin pecah akibat panas' });
      return s;
    }

    if (s.posMm >= s.jarakMm && s.finishWaktuMs === null) {
      s.posMm = s.jarakMm;
      s.finishWaktuMs = s.elapsedRaceMs;
      s.eventsTick.push({ kapalId: s.id, jenis: 'finis', waktuMs: s.finishWaktuMs });
    }

    return s;
  }

  function jalankan(params, log, seed) {
    const p = params || {};
    const maxTicks = CONFIG.SIMULASI.MAX_TICK;
    const jarakMm = Math.trunc(Number(p.jarakMm != null ? p.jarakMm : (Number(p.jarakMeter) ? Number(p.jarakMeter) * 1000 : CONFIG.LINTASAN.JARAK_STANDAR_MM)));
    const rasioPreset = String(p.rasioPreset || '800');
    const meriamMs = p.waktuMeriamMs != null ? Math.trunc(Number(p.waktuMeriamMs)) : waktuMeriam(seed);
    let prng = prngInit(seed);

    const rawPeserta = Array.isArray(p.peserta) && p.peserta.length > 0
      ? p.peserta
      : [{ id: 'pemain', nama: 'Kapten Perantau', isPemain: true, kelas: 'sekoci_standar', parts: [] }];

    const pesertaStates = rawPeserta.map((item, idx) => {
      const kelasId = item.kelas || item.shipId || 'sekoci_standar';
      const parts = Array.isArray(item.parts) ? item.parts : [];
      const spec = spesifikasi(kelasId, parts, item.rasioPreset || rasioPreset);

      prng = prngNext(prng);
      const aiReaksi = item.aiReaksiMs != null
        ? Math.trunc(Number(item.aiReaksiMs))
        : (CONFIG.AI_SIMULASI.REAKSI_DEFAULT_MS + idx * 30 + (prng % 41));
      prng = prngNext(prng);
      const aiNoise = item.aiShiftNoisePermil != null ? Math.trunc(Number(item.aiShiftNoisePermil)) : ((prng % 25) - 12);

      return buat(spec, {
        id: item.id || ('kapal_' + idx),
        nama: item.nama || ('Kapten ' + (idx + 1)),
        isPemain: !!item.isPemain,
        isBayangan: !!item.isBayangan,
        jarakMm,
        autoShift: !!item.autoShift,
        aiReaksiMs: aiReaksi,
        aiShiftNoisePermil: aiNoise,
        aiSebaranPermil: item.aiSebaranPermil,
        aiSeed: item.aiSeed != null ? item.aiSeed : (seed + idx * 7919),
        logLawan: item.logLawan || null
      });
    });

    // Normalisasi log [[tms, 1|0], ...] maksimal 240 entri urut naik
    const rawLog = Array.isArray(log) ? log.slice(0, CONFIG.SIMULASI.MAX_LOG_ENTRI) : [];
    const sortedLog = rawLog
      .map(entry => {
        if (Array.isArray(entry)) {
          return [Math.trunc(Number(entry[0]) || 0), Math.trunc(Number(entry[1]) || 0)];
        }
        return [Math.trunc(Number(entry.tms) || 0), Math.trunc(Number(entry.tekan) || 0)];
      })
      .sort((a, b) => a[0] - b[0]);

    let logCursor = 0;
    let fase = 'hitung_mundur';
    let torchPhase = -1;
    let tailTicksLeft = -1;
    const trace = [];

    const obor1Ms = Math.trunc(meriamMs / 4);
    const obor2Ms = Math.trunc((meriamMs * 2) / 4);
    const obor3Ms = Math.trunc((meriamMs * 3) / 4);

    for (let k = 0; k <= maxTicks; k++) {
      const absMs = tickToMs(k);
      const tmsRel = absMs - meriamMs;
      const events = [];

      if (k > 0) {
        if (fase === 'hitung_mundur') {
          const ph = absMs < obor1Ms ? -1
            : (absMs < obor2Ms ? 0
            : (absMs < obor3Ms ? 1
            : (absMs < meriamMs ? 2 : 3)));
          if (ph !== torchPhase) {
            torchPhase = ph;
            if (ph >= 0 && ph <= 2) {
              events.push({ jenis: 'obor', phase: ph });
            } else if (ph === 3) {
              fase = 'balap';
              events.push({ jenis: 'meriam' });
            }
          }
        }

        // Proses log input pemain yang jatuh pada tick ini
        const pemainKapal = pesertaStates.find(st => st.isPemain);
        while (logCursor < sortedLog.length && sortedLog[logCursor][0] <= tmsRel) {
          const ent = sortedLog[logCursor++];
          if (pemainKapal) {
            input(pemainKapal, ent[1], ent[0]);
          }
        }

        // Step fisika semua kapal (bayangan memutar log miliknya sendiri)
        for (let i = 0; i < pesertaStates.length; i++) {
          const ks = pesertaStates[i];
          if (ks.logLawan) {
            while (ks.logLawanCursor < ks.logLawan.length && ks.logLawan[ks.logLawanCursor][0] <= tmsRel) {
              const lg = ks.logLawan[ks.logLawanCursor++];
              input(ks, lg[1], lg[0]);
            }
          }
          step(ks, k, meriamMs);
          if (ks.eventsTick.length > 0) {
            for (let e = 0; e < ks.eventsTick.length; e++) {
              events.push(ks.eventsTick[e]);
            }
            ks.eventsTick.length = 0;
          }
        }
      }

      const posisi = {};
      const telemetri = {};
      let semuaSelesai = true;

      for (let i = 0; i < pesertaStates.length; i++) {
        const ks = pesertaStates[i];
        posisi[ks.id] = ks.posMm;
        telemetri[ks.id] = {
          posMm: ks.posMm,
          speedMmPerSec: ks.speedMmPerSec,
          gear: ks.gear,
          rpmPermil: ks.rpmPermil,
          heatMikro: ks.heatMikro,
          launched: ks.launched,
          isBoost: ks.boostLeftMs > 0,
          isCough: ks.coughTimerMs > 0,
          exploded: ks.exploded,
          finishWaktuMs: ks.finishWaktuMs
        };
        if (ks.finishWaktuMs === null && !ks.exploded) {
          semuaSelesai = false;
        }
      }

      if (semuaSelesai && tailTicksLeft < 0) {
        fase = 'selesai';
        tailTicksLeft = CONFIG.SIMULASI.EKOR_FINIS_TICK;
      }

      trace.push({
        langkah: k,
        waktuMs: absMs,
        tms: tmsRel,
        fase,
        oborPhase: torchPhase,
        posisi,
        telemetri,
        events
      });

      if (tailTicksLeft === 0) break;
      if (tailTicksLeft > 0) tailTicksLeft -= 1;
    }

    const pemain = pesertaStates.find(ks => ks.isPemain) || pesertaStates[0];
    const finishPerKapal = {};
    for (let i = 0; i < pesertaStates.length; i++) {
      finishPerKapal[pesertaStates[i].id] = pesertaStates[i].finishWaktuMs;
    }

    return {
      finishPerKapal,
      statistikPemain: pemain ? {
        waktuMs: pemain.finishWaktuMs,
        topSpeedMmPerSec: pemain.maxSpeedMmPerSec,
        zeroToHundredMs: pemain.zeroToHundredMs,
        reaksiMs: pemain.reaksiMs,
        shifts: pemain.shifts.slice(),
        exploded: pemain.exploded,
        boostUsed: pemain.boostUsed,
        coughCount: pemain.coughCount,
        jumpStart: pemain.jumpStart
      } : null,
      trace
    };
  }

  /* =========================================================================
   * 3. KONVERSI TAMPILAN RENDER (HANYA DI LAYER RENDER, BUKAN DI SIMULASI)
   * ========================================================================= */
  function mmPerSecToKnot(mmPerSec) {
    return Math.round((Number(mmPerSec) || 0) / CONFIG.SIMULASI.MM_PER_DETIK_PER_KNOT);
  }

  function knotToKmh(kt) {
    return Math.round(((Number(kt) || 0) * CONFIG.SIMULASI.KONVERSI_KNOT_KE_KMH_PERMIL) / 1000);
  }

  function fmtAngka(n) {
    return Math.round(Number(n) || 0).toLocaleString('id-ID');
  }

  function fmtDetik(t) {
    if (t == null || !Number.isFinite(Number(t))) return '—';
    return Number(t).toFixed(3).replace('.', ',') + ' dtk';
  }

  function renderRng(seed) {
    let s = prngInit(seed);
    return function nextFloat() {
      s = prngNext(s);
      return (s - 1) / 2147483646;
    };
  }

  /* =========================================================================
   * 4. PENYINTESIS AUDIO PROSEDURAL GAMELAN SLENDRO & MESIN TREK-TREK
   *    Menghormati opts.audioContext bila diberikan oleh game induk.
   * ========================================================================= */
  function createAudioEngine(externalCtx) {
    let AC = externalCtx || null;
    const ownsCtx = !externalCtx;
    let master, engG, engF, osA, osB, waterG, noiseBuf, lfo, pulseG;
    let graphBuilt = false;
    let enabled = true;

    function slen(deg, base) {
      const slendro = CONFIG.AUDIO.NADA_SLENDRO_CENT;
      const n = slendro.length;
      const o = Math.floor(deg / n);
      const i = ((deg % n) + n) % n;
      return (base || CONFIG.AUDIO.FREKUENSI_DASAR_HZ) * Math.pow(2, o + slendro[i] / 1200);
    }

    function init() {
      if (!enabled) return null;
      if (!AC) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        try {
          AC = new Ctor();
        } catch (e) {
          AC = null;
          return null;
        }
      }
      if (AC.state === 'suspended') {
        AC.resume().catch(() => {});
      }
      if (graphBuilt) return AC;

      try {
        master = AC.createGain();
        master.gain.value = enabled ? (CONFIG.AUDIO.VOLUME_MASTER / 1000) : 0;
        master.connect(AC.destination);

        engF = AC.createBiquadFilter();
        engF.type = 'lowpass';
        engF.frequency.value = 380;
        engF.Q.value = 3.8;

        engG = AC.createGain();
        engG.gain.value = 0;

        pulseG = AC.createGain();
        pulseG.gain.value = 0.55;
        lfo = AC.createOscillator();
        lfo.type = 'square';
        lfo.frequency.value = 9;
        const lfoG = AC.createGain();
        lfoG.gain.value = 0.45;
        lfo.connect(lfoG);
        lfoG.connect(pulseG.gain);
        lfo.start();

        osA = AC.createOscillator();
        osA.type = 'sawtooth';
        osA.frequency.value = 38;
        osB = AC.createOscillator();
        osB.type = 'square';
        osB.frequency.value = 19;
        const gB = AC.createGain();
        gB.gain.value = 0.6;

        osA.connect(engF);
        osB.connect(gB);
        gB.connect(engF);
        engF.connect(pulseG);
        pulseG.connect(engG);
        engG.connect(master);
        osA.start();
        osB.start();

        noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        const rng = renderRng(909);
        for (let i = 0; i < d.length; i++) d[i] = rng() * 2 - 1;
        const ns = AC.createBufferSource();
        ns.buffer = noiseBuf;
        ns.loop = true;
        const bf = AC.createBiquadFilter();
        bf.type = 'bandpass';
        bf.frequency.value = 900;
        bf.Q.value = 0.7;
        waterG = AC.createGain();
        waterG.gain.value = 0;
        ns.connect(bf);
        bf.connect(waterG);
        waterG.connect(master);
        ns.start();

        graphBuilt = true;
      } catch (e) {
        graphBuilt = false;
      }
      return AC;
    }

    function setEnabled(on) {
      enabled = !!on;
      if (enabled) init();
      if (AC && master) {
        try {
          master.gain.setTargetAtTime(enabled ? (CONFIG.AUDIO.VOLUME_MASTER / 1000) : 0, AC.currentTime, 0.05);
        } catch (e) {}
      }
    }

    function isEnabled() {
      return enabled;
    }

    function updateEngine(active, rpmRatio, gear, speedKnot, isBoost, isCough, nowSec) {
      if (!enabled || !AC || !engG) return;
      try {
        const t = AC.currentTime;
        const f = 30 + rpmRatio * 82 + (Math.max(1, gear) - 1) * 4 + (isBoost ? 15 : 0);
        osA.frequency.setTargetAtTime(f, t, 0.025);
        osB.frequency.setTargetAtTime(f / 2, t, 0.025);
        lfo.frequency.setTargetAtTime(active ? (7 + rpmRatio * 26 + gear * 2) : 6, t, 0.03);
        engF.frequency.setTargetAtTime(320 + rpmRatio * 1850 + (isBoost ? 700 : 0), t, 0.04);
        const sputter = Math.sin((nowSec || 0) * 62) > 0 ? 0.15 : 1;
        const vol = active ? (0.12 + rpmRatio * 0.12) * (isCough ? sputter : 1) : 0;
        engG.gain.setTargetAtTime(vol, t, 0.05);
        waterG.gain.setTargetAtTime(active ? Math.min(0.2, (speedKnot / 130) * 0.2) : 0, t, 0.08);
      } catch (e) {}
    }

    function tone(type, f, t, dur, vol, att) {
      if (!AC || !master) return;
      const o = AC.createOscillator();
      const gg = AC.createGain();
      o.type = type;
      o.frequency.value = f;
      gg.gain.setValueAtTime(0, t);
      gg.gain.linearRampToValueAtTime(vol, t + (att || 0.004));
      gg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gg);
      gg.connect(master);
      o.start(t);
      o.stop(t + dur + 0.05);
    }

    function noiseHit(dur, freq, vol, type, sweepTo) {
      if (!init() || !enabled || !noiseBuf || !master) return;
      try {
        const s = AC.createBufferSource();
        const f = AC.createBiquadFilter();
        const g = AC.createGain();
        const t = AC.currentTime;
        s.buffer = noiseBuf;
        f.type = type || 'lowpass';
        f.frequency.setValueAtTime(freq, t);
        if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f);
        f.connect(g);
        g.connect(master);
        s.start(t, 0.1);
        s.stop(t + dur + 0.02);
      } catch (e) {}
    }

    function bonang(deg, vol, dl) {
      if (!init() || !enabled) return;
      const f = slen(deg);
      const t = AC.currentTime + (dl || 0);
      tone('sine', f, t, 0.7, vol);
      tone('sine', f * 1.51, t, 0.25, vol * 0.25);
      tone('triangle', f * 2.02, t, 0.12, vol * 0.12);
    }

    function saron(deg, vol, dl) {
      if (!init() || !enabled) return;
      const f = slen(deg);
      const t = AC.currentTime + (dl || 0);
      tone('sine', f, t, 1.2, vol);
      tone('sine', f * 1.004 + 3, t, 1.0, vol * 0.5);
      tone('sine', f * 2.76, t, 0.3, vol * 0.2);
    }

    function gongHit(vol, dl) {
      if (!init() || !enabled) return;
      const t = AC.currentTime + (dl || 0);
      const f = 65;
      tone('sine', f, t, 4, vol, 0.03);
      tone('sine', f + 1.6, t, 3.6, vol * 0.8, 0.03);
      tone('sine', f * 2.01, t, 2, vol * 0.25, 0.02);
      tone('sine', f * 2.93, t, 1.2, vol * 0.12, 0.02);
    }

    function kendang(kind, vol) {
      if (!init() || !enabled) return;
      const t = AC.currentTime;
      if (kind === 'dung') {
        const o = AC.createOscillator();
        const gg = AC.createGain();
        o.frequency.setValueAtTime(190, t);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.14);
        gg.gain.setValueAtTime(vol, t);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
        o.connect(gg);
        gg.connect(master);
        o.start(t);
        o.stop(t + 0.35);
      } else {
        noiseHit(0.06, 2600, vol * 0.8, 'bandpass');
        tone('triangle', 420, t, 0.05, vol * 0.4);
      }
    }

    function meriam() {
      if (!init() || !enabled) return;
      noiseHit(0.9, 900, 0.9, 'lowpass', 60);
      const t = AC.currentTime;
      const o = AC.createOscillator();
      const gg = AC.createGain();
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(30, t + 0.5);
      gg.gain.setValueAtTime(0.7, t);
      gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(gg);
      gg.connect(master);
      o.start(t);
      o.stop(t + 0.65);
      gongHit(0.25, 0.05);
    }

    function destroy() {
      try {
        if (osA) osA.stop();
        if (osB) osB.stop();
        if (lfo) lfo.stop();
        if (master) master.disconnect();
      } catch (e) {}
      if (AC && ownsCtx) {
        try { AC.close(); } catch (e) {}
      }
      AC = null;
      graphBuilt = false;
    }

    return {
      init,
      setEnabled,
      isEnabled,
      updateEngine,
      kendang,
      meriam,
      gongHit,
      shiftSound(gear, quality) {
        noiseHit(0.1, 1200, 0.35, 'bandpass');
        const deg = 4 + gear;
        if (quality === 'sempurna') {
          bonang(deg, 0.24);
          bonang(deg + 2, 0.14, 0.06);
        } else if (quality === 'tepat') {
          bonang(deg, 0.19);
        } else {
          kendang('tak', 0.36);
        }
      },
      boostSound() {
        noiseHit(1.2, 500, 0.45, 'highpass', 3500);
        kendang('dung', 0.5);
        saron(9, 0.16);
      },
      coughSound() {
        noiseHit(0.5, 300, 0.5);
      },
      explodeSound() {
        if (!init() || !enabled) return;
        noiseHit(1.5, 650, 0.95, 'lowpass', 45);
        noiseHit(1.1, 2200, 0.65, 'bandpass', 180);
        const t = AC.currentTime;
        const o = AC.createOscillator();
        const gg = AC.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(95, t);
        o.frequency.exponentialRampToValueAtTime(22, t + 0.85);
        gg.gain.setValueAtTime(0.85, t);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(gg);
        gg.connect(master);
        o.start(t);
        o.stop(t + 0.95);
        gongHit(0.35, 0.12);
      },
      finishFanfare(win) {
        if (win) {
          [0, 1, 2, 3, 5].forEach((d, i) => saron(d + 5, 0.16, i * 0.13));
          gongHit(0.32, 0.7);
        } else {
          [4, 3, 1, 0].forEach((d, i) => saron(d + 5, 0.13, i * 0.2));
        }
      },
      destroy
    };
  }

  /* =========================================================================
   * 5. HELPER GAMBAR KANVAS & ILUSTRASI TEKNIS SVG INLINE
   * ========================================================================= */
  function roundRect(g, x, y, w, h, r) {
    const safeW = Math.max(0, w || 0);
    const safeH = Math.max(0, h || 0);
    const rad = Math.max(0, Math.min(r || 0, safeH / 2, safeW / 2));
    g.beginPath();
    g.moveTo(x + rad, y);
    g.arcTo(x + safeW, y, x + safeW, y + safeH, rad);
    g.arcTo(x + safeW, y + safeH, x, y + safeH, rad);
    g.arcTo(x, y + safeH, x, y, rad);
    g.arcTo(x, y, x + safeW, y, rad);
    g.closePath();
  }

  function drawNusantaraBoat(g, opts) {
    const {
      x, y,
      scale = 1,
      ship = CONFIG.KELAS_KAPAL.sekoci_standar,
      parts = [],
      previewPartId = null,
      speedKnot = 0,
      rpmRatio = 0,
      isBoost = false,
      isCough = false,
      isBlown = false,
      isGhost = false,
      isOpponent = false,
      isPlayer = false,
      captainName = '',
      nowSec = 0,
      showCallout = false,
      reducedMotion = false
    } = opts || {};

    const hasPart = (id) => (parts || []).includes(id);
    const isPrev = (id) => previewPartId === id && !hasPart(id);
    const showPart = (id) => hasPart(id) || isPrev(id);

    const len = 112 * scale;
    const h = 23 * scale;
    const bob = reducedMotion
      ? 0
      : Math.sin(nowSec * 5.2 + (isOpponent ? 2 : 0)) * (1.2 + Math.min(1, speedKnot / 65) * 0.6);
    const hydroLift = ship.id === 'bahtera_petir' ? -Math.min(5, speedKnot * 0.022) : -Math.min(2.5, speedKnot * 0.01);
    const coughWobble = (!reducedMotion && isCough) ? Math.sin(nowSec * 50) * 0.03 : 0;
    const liftAngle = Math.min(0.085, speedKnot * 0.0004) + (isBoost ? 0.045 : 0) + coughWobble;

    const bandMain = isOpponent ? '#24477a' : ship.songketMain;
    const bandGold = isOpponent ? '#cfd6e0' : ship.songketGold;

    // 1. Jejak Buih V (V-Wake) & Bow-Spray
    if (!isGhost && speedKnot > 4) {
      const wl = Math.min(230 * scale, speedKnot * 1.35 * scale);
      const sxp = x - len * 0.92;
      const syp = y + h * 0.45 + bob;

      const wg = g.createLinearGradient(sxp, 0, sxp - wl, 0);
      wg.addColorStop(0, isBoost ? 'rgba(255, 190, 90, 0.65)' : 'rgba(255, 240, 220, 0.52)');
      wg.addColorStop(1, 'rgba(255, 240, 220, 0)');
      g.fillStyle = wg;
      g.beginPath();
      g.moveTo(sxp, syp - h * 0.12);
      g.lineTo(sxp - wl, syp - h * 0.5);
      g.lineTo(sxp - wl, syp - h * 0.35);
      g.lineTo(sxp, syp + h * 0.05);
      g.closePath();
      g.fill();

      g.beginPath();
      g.moveTo(sxp, syp + h * 0.05);
      g.lineTo(sxp - wl, syp + h * 0.92);
      g.lineTo(sxp - wl, syp + h * 0.72);
      g.lineTo(sxp, syp + h * 0.18);
      g.closePath();
      g.fill();

      const bs = Math.min(1, speedKnot / 85);
      g.fillStyle = 'rgba(255, 245, 230, ' + (0.24 * bs) + ')';
      g.beginPath();
      g.moveTo(x - len * 0.04, syp - h * 0.1);
      g.quadraticCurveTo(x - len * 0.18, syp - h * (0.62 + bs * 0.6), x - len * 0.40, syp - h * 0.1);
      g.closePath();
      g.fill();
    }

    g.save();
    g.translate(x, y + bob + hydroLift);

    if (captainName && !isGhost) {
      g.save();
      const labelTxt = (isPlayer ? '★ ' : '⚓ ') + captainName;
      g.font = '700 10px system-ui, -apple-system, sans-serif';
      const tw = Math.max(72, g.measureText(labelTxt).width + 18);
      const pxCenter = -len * 0.44;
      const py = -h * 1.92;
      g.fillStyle = isPlayer ? 'rgba(23, 14, 9, 0.92)' : 'rgba(12, 22, 34, 0.92)';
      roundRect(g, pxCenter - tw / 2, py - 9, tw, 18, 6);
      g.fill();
      g.strokeStyle = isPlayer ? '#f0cf78' : '#7cc3dc';
      g.lineWidth = 1.15;
      roundRect(g, pxCenter - tw / 2, py - 9, tw, 18, 6);
      g.stroke();

      g.fillStyle = isPlayer ? '#fff1c4' : '#bae6fd';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(labelTxt, pxCenter, py + 0.5);
      g.restore();
    }

    g.rotate(-liftAngle);
    if (isGhost) g.globalAlpha = 0.36;

    if (!isGhost) {
      g.fillStyle = 'rgba(0, 0, 0, 0.36)';
      g.beginPath();
      g.ellipse(-len * 0.45, h * 0.92, len * 0.54, h * 0.28, 0, 0, Math.PI * 2);
      g.fill();
    }

    if (ship.id === 'bahtera_petir' && !isGhost) {
      g.strokeStyle = '#7cc3dc';
      g.lineWidth = 2 * scale;
      g.beginPath();
      g.moveTo(-len * 0.65, h * 0.4);
      g.lineTo(-len * 0.58, h * 0.85);
      g.lineTo(-len * 0.44, h * 0.85);
      g.moveTo(-len * 0.24, h * 0.4);
      g.lineTo(-len * 0.17, h * 0.85);
      g.lineTo(-len * 0.04, h * 0.85);
      g.stroke();
    }

    const hg = g.createLinearGradient(0, -h * 0.6, 0, h * 0.6);
    hg.addColorStop(0, isGhost ? 'rgba(255,255,255,0.4)' : ship.hullTop);
    hg.addColorStop(0.5, isGhost ? 'rgba(255,255,255,0.3)' : ship.hullMid);
    hg.addColorStop(1, isGhost ? 'rgba(255,255,255,0.1)' : ship.hullBot);
    g.fillStyle = hg;
    g.beginPath();
    g.moveTo(-len, -h * 0.78);
    g.quadraticCurveTo(-len * 0.92, -h * 0.1, -len * 0.75, -h * 0.15);
    g.lineTo(-len * 0.12, -h * 0.2);
    g.quadraticCurveTo(-len * 0.02, -h * 0.35, len * 0.04, -h * 1.02);
    g.quadraticCurveTo(len * 0.02, -h * 0.1, -len * 0.08, h * 0.46);
    g.lineTo(-len * 0.9, h * 0.43);
    g.quadraticCurveTo(-len * 0.99, h * 0.1, -len, -h * 0.78);
    g.closePath();
    g.fill();

    if (!isGhost) {
      g.strokeStyle = 'rgba(240, 207, 120, 0.55)';
      g.lineWidth = 1.05;
      g.stroke();

      g.strokeStyle = 'rgba(30, 15, 8, 0.38)';
      g.lineWidth = 1;
      for (let k = 1; k < 3; k++) {
        g.beginPath();
        g.moveTo(-len * 0.88, h * (0.05 + k * 0.12));
        g.lineTo(-len * 0.12, h * (-0.02 + k * 0.12));
        g.stroke();
      }
    }

    if (ship.id === 'pencalang_lancang' && !isGhost) {
      g.fillStyle = 'rgba(180, 83, 9, 0.75)';
      g.fillRect(-len * 0.86, h * 0.26, len * 0.74, h * 0.16);
    }

    if (ship.id === 'kolek_kilat' && !isGhost) {
      g.strokeStyle = '#d3a342';
      g.lineWidth = 1.6 * scale;
      g.beginPath();
      g.moveTo(-len * 0.62, -h * 0.15);
      g.quadraticCurveTo(-len * 0.64, h * 0.3, -len * 0.68, h * 0.56);
      g.moveTo(-len * 0.28, -h * 0.15);
      g.quadraticCurveTo(-len * 0.26, h * 0.3, -len * 0.22, h * 0.56);
      g.stroke();
      g.fillStyle = '#45120d';
      roundRect(g, -len * 0.78, h * 0.5, len * 0.66, h * 0.16, 2);
      g.fill();
    }

    g.fillStyle = bandMain;
    g.fillRect(-len * 0.82, -h * 0.12, len * 0.68, h * 0.21);
    g.fillStyle = bandGold;
    for (let m = 0; m < 9; m++) {
      const mx = -len * 0.8 + m * len * 0.075;
      g.beginPath();
      g.moveTo(mx, -h * 0.02);
      g.lineTo(mx + len * 0.02, -h * 0.1);
      g.lineTo(mx + len * 0.04, -h * 0.02);
      g.lineTo(mx + len * 0.02, h * 0.06);
      g.closePath();
      g.fill();
    }

    g.fillStyle = isGhost ? 'rgba(255,255,255,0.4)' : (ship.id === 'bahtera_petir' ? '#7cc3dc' : '#d3a342');
    if (ship.id === 'lancang_sultan') {
      g.beginPath();
      g.moveTo(len * 0.02, -h * 0.95);
      g.lineTo(len * 0.14, -h * 1.25);
      g.lineTo(len * 0.09, -h * 0.88);
      g.lineTo(len * 0.13, -h * 0.75);
      g.lineTo(len * 0.01, -h * 0.65);
      g.closePath();
      g.fill();
    } else if (ship.id === 'bahtera_petir') {
      g.beginPath();
      g.moveTo(len * 0.02, -h * 0.95);
      g.lineTo(len * 0.16, -h * 1.15);
      g.lineTo(len * 0.08, -h * 0.85);
      g.lineTo(len * 0.15, -h * 0.72);
      g.lineTo(len * 0.01, -h * 0.65);
      g.closePath();
      g.fill();
    } else {
      g.beginPath();
      g.moveTo(len * 0.04, -h * 1.0);
      g.quadraticCurveTo(len * 0.1, -h * 1.16, len * 0.09, -h * 0.85);
      g.quadraticCurveTo(len * 0.05, -h * 0.9, len * 0.02, -h * 0.75);
      g.closePath();
      g.fill();
      g.beginPath();
      g.arc(len * 0.065, -h * 1.0, h * 0.05, 0, Math.PI * 2);
      g.fillStyle = isGhost ? 'transparent' : '#2e1c10';
      g.fill();
    }

    if (ship.id === 'pencalang_lancang' && !isGhost) {
      g.strokeStyle = '#f0cf78';
      g.lineWidth = 1.6 * scale;
      g.beginPath();
      g.moveTo(len * 0.03, -h * 0.88);
      g.lineTo(len * 0.18, -h * 1.12);
      g.stroke();
    }

    if (!isGhost) {
      g.fillStyle = '#1a0f0a';
      g.beginPath();
      g.arc(-len * 0.36, -h * 0.56, h * 0.17, 0, Math.PI * 2);
      g.fill();
      g.fillRect(-len * 0.40, -h * 0.45, len * 0.08, h * 0.28);
      g.fillStyle = bandMain;
      g.fillRect(-len * 0.395, -h * 0.67, len * 0.07, h * 0.07);
    }

    g.save();
    g.scale(scale, scale);
    const engX = -83;
    const engY = -17;

    function partStyle(partId, fill, stroke) {
      g.save();
      if (isPrev(partId)) {
        const pulse = reducedMotion ? 0.8 : (0.55 + 0.45 * Math.sin(nowSec * 9));
        g.shadowColor = '#fbeabb';
        g.shadowBlur = 12 * pulse;
        g.fillStyle = '#fbeabb';
        g.strokeStyle = '#b8322a';
        g.lineWidth = 1.6;
      } else {
        g.fillStyle = isGhost ? 'rgba(255,255,255,0.3)' : fill;
        g.strokeStyle = isGhost ? 'rgba(255,255,255,0.4)' : stroke;
        g.lineWidth = 1.1;
      }
    }

    if (showPart('bore_up_blok')) {
      partStyle('bore_up_blok', '#334155', '#f0cf78');
      roundRect(g, engX - 2, engY - 3, 26, 15, 2.5);
      g.fill();
      g.stroke();
      g.strokeStyle = '#94a3b8';
      g.lineWidth = 0.9;
      for (let sy = engY; sy <= engY + 8; sy += 2.6) {
        g.beginPath();
        g.moveTo(engX - 1, sy);
        g.lineTo(engX + 23, sy);
        g.stroke();
      }
      g.restore();
    } else {
      g.fillStyle = isGhost ? 'rgba(255,255,255,0.3)' : '#8f6522';
      roundRect(g, engX, engY, 22, 13, 2.5);
      g.fill();
      g.fillStyle = isGhost ? 'rgba(255,255,255,0.3)' : '#f0cf78';
      g.fillRect(engX + 1, engY + 2, 20, 2);
    }

    if (showPart('noken_as_balap')) {
      partStyle('noken_as_balap', '#d3a342', '#fbeabb');
      g.fillRect(engX + 2, engY - 6, 18, 3.5);
      g.strokeRect(engX + 2, engY - 6, 18, 3.5);
      g.beginPath();
      g.arc(engX + 21, engY - 3, 4.2, 0, Math.PI * 2);
      g.fill();
      g.stroke();
      g.restore();
    }

    if (showPart('filter_kuningan')) {
      partStyle('filter_kuningan', '#f0cf78', '#8f6522');
      g.beginPath();
      g.moveTo(engX + 9, engY - 3);
      g.lineTo(engX + 5, engY - 12);
      g.lineTo(engX + 16, engY - 12);
      g.lineTo(engX + 13, engY - 3);
      g.closePath();
      g.fill();
      g.stroke();
      g.restore();
    }

    if (showPart('kopling_keramik')) {
      partStyle('kopling_keramik', '#b8322a', '#f0cf78');
      g.beginPath();
      g.arc(engX - 5, engY + 7, 5.2, 0, Math.PI * 2);
      g.fill();
      g.stroke();
      g.restore();
    }

    if (showPart('cvt_hidrolik')) {
      partStyle('cvt_hidrolik', '#e8b84a', '#fbeabb');
      g.fillRect(engX - 15, engY + 4, 10, 4);
      g.strokeRect(engX - 15, engY + 4, 10, 4);
      g.restore();
    }

    if (showPart('busi_iridium')) {
      partStyle('busi_iridium', '#fcf6e6', '#7cc3dc');
      g.fillRect(engX + 4, engY - 5, 3.5, 5);
      g.fillRect(engX + 12, engY - 5, 3.5, 5);
      if (rpmRatio > 0.1 || isPrev('busi_iridium')) {
        g.strokeStyle = '#7cc3dc';
        g.lineWidth = 1.3;
        g.beginPath();
        g.moveTo(engX + 6, engY - 6);
        g.lineTo(engX + 10, engY - 10);
        g.lineTo(engX + 14, engY - 6);
        g.stroke();
      }
      g.restore();
    }

    if (showPart('injektor_kembar')) {
      partStyle('injektor_kembar', '#e8b84a', '#fbeabb');
      g.beginPath();
      g.arc(engX + 25, engY + 2, 3, 0, Math.PI * 2);
      g.arc(engX + 25, engY + 9, 3, 0, Math.PI * 2);
      g.fill();
      g.stroke();
      g.restore();
    }

    if (showPart('ecu_pelaut_pintar')) {
      partStyle('ecu_pelaut_pintar', '#46a862', '#fbeabb');
      g.fillRect(-35, -13, 6.5, 5.5);
      g.strokeRect(-35, -13, 6.5, 5.5);
      g.restore();
    }

    if (showPart('knalpot_meriam')) {
      partStyle('knalpot_meriam', '#b26a3a', '#f0cf78');
      for (let p2 = 0; p2 < 2; p2++) {
        const px = engX + 2 + p2 * 9;
        g.beginPath();
        g.moveTo(px, engY);
        g.lineTo(px - 3, engY - 14);
        g.lineTo(px + 6, engY - 14);
        g.lineTo(px + 4, engY);
        g.closePath();
        g.fill();
        g.stroke();
      }
      g.restore();
    } else {
      g.fillStyle = isGhost ? 'rgba(255,255,255,0.3)' : '#b26a3a';
      for (let p2 = 0; p2 < 2; p2++) {
        g.fillRect(engX + 3 + p2 * 9, engY - 11, 4, 11);
        g.fillRect(engX + 2.5 + p2 * 9, engY - 12, 5, 1.8);
      }
    }

    if (showPart('turbo_sentrifugal')) {
      partStyle('turbo_sentrifugal', '#7cc3dc', '#fbeabb');
      const tx = engX - 7;
      const ty = engY + 3;
      g.beginPath();
      g.arc(tx, ty, 6, 0, Math.PI * 2);
      g.fill();
      g.stroke();
      const spin = reducedMotion ? 0.5 : (nowSec * (8 + rpmRatio * 42));
      g.strokeStyle = '#170e09';
      g.lineWidth = 1.2;
      for (let b = 0; b < 3; b++) {
        const a = spin + (b * Math.PI) / 3;
        g.beginPath();
        g.moveTo(tx + Math.cos(a) * 4.5, ty + Math.sin(a) * 4.5);
        g.lineTo(tx - Math.cos(a) * 4.5, ty - Math.sin(a) * 4.5);
        g.stroke();
      }
      g.restore();
    }

    if (showCallout && previewPartId) {
      const pObj = CONFIG.KOMPONEN[previewPartId];
      if (pObj && pObj.mount) {
        const mx = pObj.mount.x;
        const my = pObj.mount.y;
        g.save();
        g.strokeStyle = '#7cc3dc';
        g.lineWidth = 1;
        g.beginPath();
        g.arc(mx, my, 6.5, 0, Math.PI * 2);
        g.stroke();
        g.beginPath();
        g.moveTo(mx, my - 6.5);
        g.lineTo(mx + 12, my - 20);
        g.lineTo(mx + 56, my - 20);
        g.stroke();
        g.fillStyle = 'rgba(18, 11, 7, 0.92)';
        g.fillRect(mx + 12, my - 30, 66, 9);
        g.fillStyle = '#fbeabb';
        g.font = '700 5.2px system-ui, sans-serif';
        g.textAlign = 'left';
        g.fillText(pObj.nama.toUpperCase(), mx + 14, my - 23.5);
        g.restore();
      }
    }

    if (isBlown && !isGhost) {
      g.save();
      g.strokeStyle = '#ff6b52';
      g.lineWidth = 1.6;
      g.beginPath();
      g.moveTo(engX + 5, engY - 1);
      g.lineTo(engX + 10, engY + 5);
      g.lineTo(engX + 7, engY + 10);
      g.lineTo(engX + 14, engY + 13);
      g.stroke();

      const glowR = reducedMotion ? 11 : (11 + Math.sin(nowSec * 14) * 3);
      const bg = g.createRadialGradient(engX + 10, engY + 4, 1, engX + 10, engY + 4, glowR);
      bg.addColorStop(0, 'rgba(255, 110, 40, 0.85)');
      bg.addColorStop(1, 'rgba(255, 60, 20, 0)');
      g.fillStyle = bg;
      g.beginPath();
      g.arc(engX + 10, engY + 4, glowR, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }
    g.restore();

    g.strokeStyle = isGhost ? 'rgba(255,255,255,0.4)' : '#2e1c10';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(-len * 0.97, -h * 0.72);
    g.lineTo(-len * 0.97, -h * 1.62);
    g.stroke();
    const wave = reducedMotion ? 0 : Math.sin(nowSec * 12 + (isOpponent ? 1 : 0)) * h * 0.08;
    const flen = len * (0.12 + Math.min(0.1, speedKnot / 220));
    g.fillStyle = bandMain;
    g.beginPath();
    g.moveTo(-len * 0.97, -h * 1.62);
    g.quadraticCurveTo(-len * 0.97 - flen * 0.5, -h * 1.56 + wave, -len * 0.97 - flen, -h * 1.5);
    g.lineTo(-len * 0.97, -h * 1.36);
    g.closePath();
    g.fill();

    if (!isGhost && (isBoost || rpmRatio > 0.88)) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      const flutter = reducedMotion ? 0.5 : ((Math.sin(nowSec * 47 + x * 0.1) + 1) * 0.5);
      const flLen = isBoost ? (36 + flutter * 18) * scale : (12 + flutter * 6) * scale;
      const fx = -len * 0.71;
      const fy = -h * 1.35;
      const fg = g.createRadialGradient(fx, fy, 1, fx, fy, flLen);
      fg.addColorStop(0, isBoost ? 'rgba(255, 130, 40, 0.95)' : 'rgba(255, 185, 70, 0.75)');
      fg.addColorStop(1, 'rgba(255, 110, 30, 0)');
      g.fillStyle = fg;
      g.beginPath();
      g.arc(fx, fy, flLen, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    g.restore();
  }

      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;

    /* RACE STAGE */

      padding: 8px 12px;
    }

    .pcs-root .pcs-race-stage {

      border-radius: 13px;

      border: 1.5px solid var(--pcs-brass-500);

      user-select: none;
      -webkit-user-select: none;

    .pcs-root .pcs-action-strip {

    .pcs-root .pcs-tactile-btn {

      color: rgba(244, 231, 200, 0.82);

    .pcs-root .pcs-tactile-btn.pcs-green-ready {
      background: linear-gradient(180deg, #fbeabb, #d3a342 58%, #a5762a);

      color: var(--pcs-brass-900);
    }

    .pcs-root .pcs-tactile-btn.pcs-semburan-ready {
      background: linear-gradient(180deg, #ffb347, #b8322a);

    /* POST-RACE OVERLAY */
    .pcs-root .pcs-result-ov {

    .pcs-root .pcs-result-card {

    .pcs-root .pcs-time-cell {

    .pcs-root .pcs-time-lbl {

    .pcs-root .pcs-standings-box {

    .pcs-root .pcs-standing-row {

    .pcs-root .pcs-q-badge {

      background: rgba(224, 165, 60, 0.16);

    }

    .pcs-root .pcs-q-badge.pcs-telat {

    .pcs-root .pcs-reward-box {
      margin-top: 9px;

      background: rgba(207, 75, 51, 0.18);
      border-color: rgba(207, 75, 51, 0.55);
      color: #f4a48a;

    .pcs-root .pcs-res-actions {

    .pcs-root .pcs-chip-card {
      background: rgba(23, 14, 9, 0.78);

  function acquireStyle() {
    styleRefCount += 1;
    if (!document.getElementById(STYLE_ID)) {
      const styleEl = document.createElement('style');
      styleEl.id = STYLE_ID;
      styleEl.textContent = SCOPED_CSS;
      document.head.appendChild(styleEl);
    }
  }

  function releaseStyle() {
    styleRefCount = Math.max(0, styleRefCount - 1);
    if (styleRefCount === 0) {
      const el = document.getElementById(STYLE_ID);
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
  }

  let activeInstance = null;

  function normalizeState(raw) {
    const s = raw && typeof raw === 'object' ? raw : {};
    const pemain = s.pemain && typeof s.pemain === 'object' ? s.pemain : {};
    const kelasAktif = String(s.kelasAktif || pemain.kelasAktif || 'sekoci_standar');
    const kapalDimiliki = Array.isArray(s.kapalDimiliki)
      ? s.kapalDimiliki.slice()
      : (Array.isArray(pemain.kapalDimiliki) ? pemain.kapalDimiliki.slice() : ['sekoci_standar']);
    const partTerpasang = Array.isArray(s.partTerpasang)
      ? s.partTerpasang.slice()
      : (Array.isArray(pemain.partTerpasang) ? pemain.partTerpasang.slice() : []);

    // Normalisasi medali: angka langsung ATAU objek { jumlah, kurs, gigiTerbuka }
    const rawMedali = s.medali != null ? s.medali : pemain.medali;
    let medaliJumlah = 0;
    let medaliKurs = { gigi: 25, rantai: 35, oli: 10 };
    let medaliGigiTerbuka = true;
    if (typeof rawMedali === 'number') {
      medaliJumlah = rawMedali;
    } else if (rawMedali && typeof rawMedali === 'object') {
      medaliJumlah = Number(rawMedali.jumlah || 0);
      if (rawMedali.kurs && typeof rawMedali.kurs === 'object') {
        medaliKurs = {
          gigi: Number(rawMedali.kurs.gigi || 25),
          rantai: Number(rawMedali.kurs.rantai || 35),
          oli: Number(rawMedali.kurs.oli || 10)
        };
      }
      if (typeof rawMedali.gigiTerbuka === 'boolean') {
        medaliGigiTerbuka = rawMedali.gigiTerbuka;
      }
    }

    const rawAdu = s.adu && typeof s.adu === 'object' ? s.adu : null;

    return {
      namaKapten: String(s.namaKapten || pemain.nama || 'Kapten Perantau'),
      gold: Number(s.gold != null ? s.gold : (pemain.gold || 0)),
      medaliJumlah,
      medaliKurs,
      medaliGigiTerbuka,
      kelasAktif,
      kapalDimiliki,
      partTerpasang,
      mesinJebol: Boolean(s.mesinJebol || pemain.mesinJebol),
      rasioPreset: String(s.rasioPreset || pemain.rasioPreset || '800'),
      autoShift: Boolean(s.autoShift || pemain.autoShift),

      hargaPart: s.hargaPart && typeof s.hargaPart === 'object' ? s.hargaPart : {},
      infoMode: s.infoMode && typeof s.infoMode === 'object' ? s.infoMode : {},

        ? s.rekorPribadi

        ? s.hallOfFame
        : { '400': [], '800': [], '1400': [] },
      riwayat: Array.isArray(s.riwayat) ? s.riwayat : [],
      adu: rawAdu ? {
        kaptenDiZentul: Array.isArray(rawAdu.kaptenDiZentul) ? rawAdu.kaptenDiZentul : [],
        undanganMasuk: Array.isArray(rawAdu.undanganMasuk) ? rawAdu.undanganMasuk : [],
        undanganKeluar: rawAdu.undanganKeluar && typeof rawAdu.undanganKeluar === 'object' ? rawAdu.undanganKeluar : null,
