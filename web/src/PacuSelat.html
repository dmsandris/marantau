    `;

    const q = (sel) => el.querySelector('[data-pcs="' + sel + '"]');
    const raceCanvas = q('race-canvas');
    const raceCtx = raceCanvas.getContext('2d', { alpha: false });
    const shipyardCanvas = q('shipyard-canvas');
    const drydockCanvas = q('drydock-canvas');

    let skyLayer = null, cityLayer = null, seaLayer = null, layerW = 0, layerTrackH = 0;

    function isReducedMotion() {
      return typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function buildZentulBackdrop(W, trackH, horizon) {
      const safeW = Math.max(240, W);
      const safeH = Math.max(200, trackH);
      const safeHor = Math.max(40, Math.min(safeH - 20, horizon));
      if (skyLayer && layerW === safeW && layerTrackH === safeH) return;
      layerW = safeW;
      layerTrackH = safeH;
      const R = renderRng(77);

      skyLayer = document.createElement('canvas');
      skyLayer.width = safeW;
      skyLayer.height = safeHor + 2;
      let g = skyLayer.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 0, safeHor);
      gr.addColorStop(0, '#120c1c');
      gr.addColorStop(0.35, '#3a1b2c');
      gr.addColorStop(0.7, '#8a3a2a');
      gr.addColorStop(1, '#e08a3c');
      g.fillStyle = gr;
      g.fillRect(0, 0, safeW, safeHor + 2);

      for (let i = 0; i < 40; i++) {
        g.globalAlpha = 0.15 + R() * 0.45;
        g.fillStyle = '#fff1d0';
        g.fillRect(R() * safeW, R() * safeHor * 0.35, 1.2, 1.2);
      }
      g.globalAlpha = 1;

      const sx = safeW * 0.72;
      const sr = Math.max(20, safeHor * 0.22);
      const sg = g.createRadialGradient(sx, safeHor, 0, sx, safeHor, sr * 4);
      sg.addColorStop(0, 'rgba(255, 200, 110, 0.55)');
      sg.addColorStop(1, 'rgba(255, 140, 60, 0)');
      g.fillStyle = sg;
      g.fillRect(0, 0, safeW, safeHor + 2);
      g.fillStyle = '#ffd27a';
      g.beginPath();
      g.arc(sx, safeHor + 2, sr, Math.PI, 0);
      g.fill();

      const cw2 = 1600;
      const ch = Math.max(36, Math.round(safeHor * 0.62));
      cityLayer = document.createElement('canvas');
      cityLayer.width = cw2;
      cityLayer.height = ch;
      g = cityLayer.getContext('2d');
      let x = 0;
      while (x < cw2) {
        const bw = 34 + R() * 80;
        const bh = ch * (0.26 + R() * 0.58);
        const kind = R();
        g.fillStyle = '#1a0f12';
        g.strokeStyle = '#1a0f12';
        if (kind < 0.35) {
          for (let k = 0; k < 3; k++) {
            const yy = ch - k * bh * 0.3;
            const ww = bw * (1 - k * 0.2);
            g.beginPath();
            g.moveTo(x + k * 6, yy);
            g.quadraticCurveTo(x + k * 6 + ww / 2, yy - bh * 0.42, x + k * 6 + ww, yy);
            g.closePath();
            g.fill();
          }
        } else if (kind < 0.65) {
          const tx = x + bw * 0.5;
          const th = bh * 1.05;
          g.lineWidth = 2.8;
          g.beginPath();
          g.moveTo(tx, ch);
          g.quadraticCurveTo(tx + 9, ch - th * 0.5, tx + 4, ch - th);
          g.stroke();
        } else {
          g.fillRect(x, ch - bh * 0.5, bw, bh * 0.5);
          if (R() < 0.6) {
            g.fillStyle = 'rgba(255, 175, 75, 0.85)';
            g.fillRect(x + 8, ch - bh * 0.32, 4, 3);
          }
        }
        x += bw * (0.72 + R() * 0.45);
      }

      const seaH = Math.max(20, safeH - safeHor);
      seaLayer = document.createElement('canvas');
      seaLayer.width = safeW;
      seaLayer.height = seaH;
      g = seaLayer.getContext('2d');
      const sgr = g.createLinearGradient(0, 0, 0, seaH);
      sgr.addColorStop(0, '#6a3a3a');
      sgr.addColorStop(0.14, '#2d2a3d');
      sgr.addColorStop(0.48, '#14223a');
      sgr.addColorStop(1, '#0a1220');
      g.fillStyle = sgr;
      g.fillRect(0, 0, safeW, seaH);
    }

    /* =======================================================================
     * 9. SINKRONISASI & STEPPING SIMULASI LANGSUNG 120 HZ (TANPA RE-SIMULASI)
     * ======================================================================= */
    function initOrUpdateRace(balapan) {
      if (!balapan) {
        live.raceId = null;
        return;
      }

      const nextId = String(balapan.id != null ? balapan.id : (balapan.seed || 'sesi_default'));
      const isNewRace = live.raceId !== nextId;

      const jarakMm = Math.trunc(
        Number(balapan.jarakMm != null
          ? balapan.jarakMm
          : (Number(balapan.jarakMeter) ? Number(balapan.jarakMeter) * 1000 : CONFIG.LINTASAN.JARAK_STANDAR_MM))
      );
      const rasioPreset = String(balapan.rasioPreset || hostState.rasioPreset || '800');
      const seed = Math.trunc(Number(balapan.seed) || 1001);
      const meriamMs = balapan.waktuMeriamMs != null ? Math.trunc(Number(balapan.waktuMeriamMs)) : waktuMeriam(seed);

      const rawPeserta = Array.isArray(balapan.peserta) && balapan.peserta.length > 0
        ? balapan.peserta
        : [{
            id: 'pemain',
            nama: hostState.namaKapten,
            isPemain: true,
            kelas: hostState.kelasAktif,
            parts: hostState.partTerpasang,
            autoShift: hostState.autoShift
          }];

      // Bug #1: Hanya reset bila balapan.id benar-benar baru!
      if (isNewRace) {
        live.raceId = nextId;
        live.seed = seed;
        live.meriamMs = meriamMs;
        live.jarakMm = jarakMm;
        live.rasioPreset = rasioPreset;
        live.lawanLangsung = Boolean(balapan.lawanLangsung);
        live.isReplay = Array.isArray(balapan.trace) && balapan.trace.length > 0;
        live.replayTrace = live.isReplay ? balapan.trace : null;
        live.accMs = 0;
        live.tick = 0;
        live.log = [];
        live.antre = [];
        live.tekanUi = false;
        live.mulaiServerMs = null;
        live.selisihJamMs = 0;
        live.liveOpponents = {};
        live.torchPhase = -1;
        live.fase = 'hitung_mundur';
        live.finishNotified = false;
        live.finishedOverlayShown = false;
        live.fb = null;
        live.needleRpm = 0;
        live.needleSpeed = 0;
        live.camX = -10;

        // Sinkronisasi jam awal bila mulaiServerMs diberikan host
        if (typeof balapan.mulaiServerMs === 'number') {
          const serverNow = Date.now() + (Number(balapan.selisihJamMs) || 0);
          // Bisa negatif: tunggu sampai jam server mencapai awal hitung mundur (start serentak).
          live.accMs = serverNow - balapan.mulaiServerMs;
          live.mulaiServerMs = balapan.mulaiServerMs;
          live.selisihJamMs = Number(balapan.selisihJamMs) || 0;
        }

        let prng = prngInit(seed);
        live.boats = rawPeserta.map((item, idx) => {
          const kelasId = item.kelas || item.shipId || 'sekoci_standar';
          const parts = Array.isArray(item.parts) ? item.parts : [];
          const spec = spesifikasi(kelasId, parts, item.rasioPreset || rasioPreset);
          // Bug #4: autoShift pemain tetap berlaku walau balapan.peserta diisi host
          const isPemain = Boolean(item.isPemain);
          const autoShift = isPemain ? Boolean(item.autoShift || hostState.autoShift) : Boolean(item.autoShift);

          prng = prngNext(prng);
          const aiReaksi = item.aiReaksiMs != null
            ? Math.trunc(Number(item.aiReaksiMs))
            : (CONFIG.AI_SIMULASI.REAKSI_DEFAULT_MS + idx * 30 + (prng % 41));
          prng = prngNext(prng);
          const aiNoise = item.aiShiftNoisePermil != null ? Math.trunc(Number(item.aiShiftNoisePermil)) : ((prng % 25) - 12);

          return buat(spec, {
            id: item.id || ('kapal_' + idx),
            nama: item.nama || ('Kapten ' + (idx + 1)),
            isPemain,
            isBayangan: Boolean(item.isBayangan),
            jarakMm,
            autoShift,
            aiReaksiMs: aiReaksi,
            aiShiftNoisePermil: aiNoise,
            aiSebaranPermil: item.aiSebaranPermil,
            aiSeed: item.aiSeed != null ? item.aiSeed : (seed + idx * 7919),
            logLawan: item.logLawan || null
          });
        });

        ui.arenaSubView = 'race';
        q('result-overlay').classList.remove('pcs-show');
      } else {
        // Pembaruan metadata saat balapan.id sama tanpa mereset lomba
        live.lawanLangsung = Boolean(balapan.lawanLangsung);
        if (Array.isArray(balapan.trace) && balapan.trace.length > 0 && !live.isReplay) {
          live.isReplay = true;
          live.replayTrace = balapan.trace;
        }
        // Sinkronkan autoShift pemain jika berubah
        for (let i = 0; i < live.boats.length; i++) {
          if (live.boats[i].isPemain) {
            const pHost = rawPeserta.find(p => p.isPemain);
            live.boats[i].autoShift = Boolean((pHost && pHost.autoShift) || hostState.autoShift);
          }
        }
      }
    }

    function getPemainBoat() {
      return live.boats.find(b => b.isPemain) || live.boats[0] || null;
    }

    function getCurrentRelTms() {
      return tickToMs(live.tick) - live.meriamMs;
    }

    // Ketukan diantrekan lalu diterapkan SEBELUM step tick berikutnya, dengan tms tick itu.
    // Urutan ini sama persis dengan jalankan() di klien dan game.ps_run() di server.
    function handlePlayerPress(tekan) {
      if (ui.arenaSubView !== 'race' || !live.raceId || live.isReplay) return;
      const pemain = getPemainBoat();
      if (!pemain || pemain.exploded || pemain.finishWaktuMs !== null) return;
      if (tekan === 1) {
        if (live.tekanUi) return;
        live.tekanUi = true;
      } else {
        if (!live.tekanUi) return;
        live.tekanUi = false;
      }
      live.antre.push(tekan);
    }

    function terapkanAntrean(pemain, tick) {
      if (live.antre.length === 0) return;
      const tms = tickToMs(tick) - live.meriamMs;
      for (let i = 0; i < live.antre.length; i++) {
        const tekan = live.antre[i];
        if (pemain.exploded || pemain.finishWaktuMs !== null) break;
        if (live.log.length >= CONFIG.SIMULASI.MAX_LOG_ENTRI) break;
        live.log.push([tms, tekan]);
        input(pemain, tekan, tms);
        if (typeof callbacks.onInput === 'function') {
          try { callbacks.onInput({ balapanId: live.raceId, tms, tekan }); } catch (e) {}
        }
      }
      live.antre.length = 0;
    }

    function processBoatEvents(events, pemainId, gearNow, nowMs) {
      for (let e = 0; e < events.length; e++) {
        const ev = events[e];
        if (ev.jenis === 'obor') {
          audio.kendang('dung', 0.45);
        } else if (ev.jenis === 'meriam') {
          audio.meriam();
        } else if (ev.kapalId === pemainId) {
          if (ev.jenis === 'curi_start') {
            audio.kendang('tak', 0.5);
            live.fb = { txt: ev.label, col: '#ff9a5a', sub: ev.sub || '', t: nowMs };
          } else if (ev.jenis === 'oper_sempurna') {
            audio.shiftSound(gearNow, 'sempurna');
            live.fb = { txt: ev.label, col: '#ffd65a', sub: '', t: nowMs };
          } else if (ev.jenis === 'oper_tepat') {
            audio.shiftSound(gearNow, 'tepat');
            live.fb = { txt: ev.label, col: '#9fe08a', sub: '', t: nowMs };
          } else if (ev.jenis === 'oper_awal' || ev.jenis === 'oper_telat') {
            audio.shiftSound(gearNow, 'awal');
            live.fb = { txt: ev.label, col: '#f0cf78', sub: ev.sub || '', t: nowMs };
          } else if (ev.jenis === 'semburan') {
            audio.boostSound();
            live.fb = { txt: ev.label, col: '#ffb347', sub: ev.sub || '', t: nowMs };
          } else if (ev.jenis === 'batuk') {
            audio.coughSound();
            live.fb = { txt: ev.label, col: '#ff7a5a', sub: ev.sub || '', t: nowMs };
          } else if (ev.jenis === 'jebol') {
            audio.explodeSound();
            live.fb = { txt: ev.label, col: '#ff5a42', sub: ev.sub || '', t: nowMs };
          } else if (ev.jenis === 'finis') {
            audio.gongHit(0.45, 0);
          }
        }
      }
    }

    function notifyFinishIfNeeded(pemain) {
      if (live.finishNotified || !pemain) return;
      live.finishNotified = true;
      audio.updateEngine(false, 0, 1, 0, false, false, 0);

      const hasilCocok = hostState.hasil &&
        (!hostState.hasil.balapanId || !live.raceId || String(hostState.hasil.balapanId) === String(live.raceId));
      const menang = hasilCocok ? Boolean(hostState.hasil.menang) : (!pemain.exploded);
      if (!pemain.exploded) {
        audio.finishFanfare(menang);
      }

      if (!live.isReplay && typeof callbacks.onFinish === 'function') {
        callbacks.onFinish({
          balapanId: live.raceId,
          log: live.log.slice(),
          ringkasanKlien: {
            waktuMs: pemain.finishWaktuMs,
            topSpeedMmPerSec: pemain.maxSpeedMmPerSec,
            topSpeedKnot: mmPerSecToKnot(pemain.maxSpeedMmPerSec),
            zeroToHundredMs: pemain.zeroToHundredMs,
            reaksiMs: pemain.reaksiMs,
            exploded: pemain.exploded,
            boostUsed: pemain.boostUsed,
            coughCount: pemain.coughCount,
            jumpStart: pemain.jumpStart,
            shifts: pemain.shifts.slice()
          }
        });
      }

      live.finishedOverlayShown = true;
      renderResultOverlay();
    }

    function stepLiveSimulation(dtSec, nowMs) {
      if (!live.raceId) return;
      const pemain = getPemainBoat();
      if (!pemain) return;

      // Mode Replay dari server (state.balapan.trace)
      if (live.isReplay && Array.isArray(live.replayTrace) && live.replayTrace.length > 0) {
        live.accMs += dtSec * 1000;
        const targetTick = Math.min(live.replayTrace.length - 1, Math.floor((live.accMs * CONFIG.SIMULASI.TICK_DEN_MS) / CONFIG.SIMULASI.TICK_NUM_MS));
        while (live.tick < targetTick) {
          live.tick += 1;
          const fr = live.replayTrace[live.tick];
          if (fr) {
            live.fase = fr.fase || live.fase;
            live.torchPhase = fr.oborPhase != null ? fr.oborPhase : live.torchPhase;
            for (let i = 0; i < live.boats.length; i++) {
              const b = live.boats[i];
              const t = fr.telemetri && fr.telemetri[b.id];
              if (t) {
                b.posMm = t.posMm != null ? t.posMm : (Number(t.posM || 0) * 1000);
                b.speedMmPerSec = t.speedMmPerSec != null ? t.speedMmPerSec : (Number(t.speedKnot || 0) * CONFIG.SIMULASI.MM_PER_DETIK_PER_KNOT);
                b.gear = t.gear || 1;
                b.rpmPermil = t.rpmPermil != null ? t.rpmPermil : Math.round((t.rpmRatio || 0) * 1000);
                b.heatMikro = t.heatMikro != null ? t.heatMikro : Math.round((t.heat || 0) * 1000000);
                b.launched = !!t.launched;
                b.boostLeftMs = t.isBoost ? 100 : 0;
                b.coughTimerMs = t.isCough ? 100 : 0;
                b.exploded = !!t.exploded;
                b.finishWaktuMs = t.finishWaktuMs != null ? t.finishWaktuMs : null;
                if (b.speedMmPerSec > b.maxSpeedMmPerSec) b.maxSpeedMmPerSec = b.speedMmPerSec;
              }
            }
            if (Array.isArray(fr.events) && fr.events.length > 0) {
              processBoatEvents(fr.events, pemain.id, pemain.gear, nowMs);
            }
          }
        }
        const isMoving = live.fase === 'hitung_mundur' || (live.fase === 'balap' && !pemain.exploded && pemain.finishWaktuMs === null);
        audio.updateEngine(isMoving, (pemain.rpmPermil || 240) / 1000, pemain.gear, mmPerSecToKnot(pemain.speedMmPerSec), pemain.boostLeftMs > 0, pemain.coughTimerMs > 0, nowMs / 1000);
        if (live.tick >= live.replayTrace.length - 1 || pemain.finishWaktuMs !== null || pemain.exploded) {
          notifyFinishIfNeeded(pemain);
        }
        return;
      }

      // Mode Live 120 Hz: step tick demi tick tanpa re-run jalankan()
      const tickDurationMs = CONFIG.SIMULASI.TICK_NUM_MS / CONFIG.SIMULASI.TICK_DEN_MS;
      if (live.mulaiServerMs != null) {
        // Adu serentak: waktu simulasi mengikuti jam server, bukan jumlah frame (HP lambat tetap sinkron).
        live.accMs = (Date.now() + live.selisihJamMs - live.mulaiServerMs) - live.tick * tickDurationMs;
      } else {
        live.accMs += dtSec * 1000;
      }
      const obor1Ms = Math.trunc(live.meriamMs / 4);
      const obor2Ms = Math.trunc((live.meriamMs * 2) / 4);
      const obor3Ms = Math.trunc((live.meriamMs * 3) / 4);

      let stepsThisFrame = 0;
      while (live.fase !== 'selesai' && live.accMs >= tickDurationMs && stepsThisFrame < 24 && live.tick < CONFIG.SIMULASI.MAX_TICK) {
        live.accMs -= tickDurationMs;
        stepsThisFrame += 1;
        live.tick += 1;

        const absMs = tickToMs(live.tick);
        const tickEvents = [];

        if (live.fase === 'hitung_mundur') {
          const ph = absMs < obor1Ms ? -1
            : (absMs < obor2Ms ? 0
            : (absMs < obor3Ms ? 1
            : (absMs < live.meriamMs ? 2 : 3)));
          if (ph !== live.torchPhase) {
            live.torchPhase = ph;
            if (ph >= 0 && ph <= 2) {
              tickEvents.push({ jenis: 'obor', phase: ph });
            } else if (ph === 3) {
              live.fase = 'balap';
              tickEvents.push({ jenis: 'meriam' });
            }
          }
        }

        terapkanAntrean(pemain, live.tick);
        const tmsTick = absMs - live.meriamMs;
        for (let i = 0; i < live.boats.length; i++) {
          const b = live.boats[i];
          // Jika lawanLangsung === true, lawan dikendalikan posisiLawan(), bukan AI lokal
          if (!b.isPemain && live.lawanLangsung) {
            continue;
          }
          if (b.logLawan) {
            while (b.logLawanCursor < b.logLawan.length && b.logLawan[b.logLawanCursor][0] <= tmsTick) {
              const lg = b.logLawan[b.logLawanCursor++];
              input(b, lg[1], lg[0]);
            }
          }
          step(b, live.tick, live.meriamMs);
          if (b.eventsTick.length > 0) {
            for (let e = 0; e < b.eventsTick.length; e++) {
              tickEvents.push(b.eventsTick[e]);
            }
            b.eventsTick.length = 0;
          }
        }

        if (tickEvents.length > 0) {
          processBoatEvents(tickEvents, pemain.id, pemain.gear, nowMs);
        }

        if (pemain.finishWaktuMs !== null || pemain.exploded) {
          if (!live.finishNotified) notifyFinishIfNeeded(pemain);
          // Lawan AI / bayangan tetap berlayar sampai garis Finish supaya waktunya tercatat
          const masihJalan = live.boats.some(b => b !== pemain && !(live.lawanLangsung && !b.isPemain) &&
            b.finishWaktuMs === null && !b.exploded);
          if (!masihJalan) {
            live.fase = 'selesai';
            break;
          }
        }
      }

      const isMoving = live.fase === 'hitung_mundur' || (live.fase === 'balap' && !pemain.exploded && pemain.finishWaktuMs === null);
      audio.updateEngine(isMoving, (pemain.rpmPermil || 240) / 1000, pemain.gear, mmPerSecToKnot(pemain.speedMmPerSec), pemain.boostLeftMs > 0, pemain.coughTimerMs > 0, nowMs / 1000);
    }

    /* =======================================================================
     * 10. RENDER KANVAS ARENA, GALANGAN & DOK KERING
     * ======================================================================= */
    function drawKawungDialBase(g, gx, gy, R) {
      const bz = g.createLinearGradient(gx - R, gy - R, gx + R, gy + R);
      bz.addColorStop(0, '#fbeabb');
      bz.addColorStop(0.5, '#d3a342');
      bz.addColorStop(1, '#6e4a14');
      g.fillStyle = bz;
      g.beginPath();
      g.arc(gx, gy, R * 1.24, 0, Math.PI * 2);
      g.fill();

      const face = g.createRadialGradient(gx, gy - R * 0.3, R * 0.1, gx, gy, R * 1.15);
      face.addColorStop(0, '#fcf6e6');
      face.addColorStop(0.75, '#e8d6aa');
      face.addColorStop(1, '#c9ad76');
      g.fillStyle = face;
      g.beginPath();
      g.arc(gx, gy, R * 1.15, 0, Math.PI * 2);
      g.fill();

      g.strokeStyle = 'rgba(123, 100, 69, 0.18)';
      g.lineWidth = 1;
      for (let q = 0; q < 8; q++) {
        const qa = (q * Math.PI) / 4;
        g.beginPath();
        g.ellipse(gx + Math.cos(qa) * R * 0.55, gy + Math.sin(qa) * R * 0.55, R * 0.14, R * 0.07, qa, 0, Math.PI * 2);
        g.stroke();
      }
    }

    function drawKawungTachometer(g, gx, gy, R, dt, nowMs, spec, boat, reducedMotion) {
      drawKawungDialBase(g, gx, gy, R);
      const A0 = Math.PI * 0.8;
      const SW = Math.PI * 1.4;
      const ang = (r) => A0 + SW * r;

      for (let i = 0; i <= 20; i++) {
        const a = ang(i / 20);
        const r1 = R * (i % 5 === 0 ? 0.74 : 0.8);
        const r2 = R * 0.9;
        g.strokeStyle = i >= 19 ? '#8c2a1d' : '#33230f';
        g.lineWidth = i % 5 === 0 ? 2 : 1;
        g.beginPath();
        g.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1);
        g.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2);
        g.stroke();

        if (i % 5 === 0) {
          g.fillStyle = '#33230f';
          g.font = '700 ' + Math.max(8, Math.round(R * 0.12)) + 'px system-ui, sans-serif';
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(String((i / 5) * 2), gx + Math.cos(a) * R * 0.62, gy + Math.sin(a) * R * 0.62);
        }
      }

      const greenEndRatio = spec.greenEndPermil / 1000;
      g.strokeStyle = 'rgba(140, 42, 29, 0.88)';
      g.lineWidth = R * 0.14;
      g.beginPath();
      g.arc(gx, gy, R, ang(greenEndRatio), ang(1));
      g.stroke();

      const gear = boat.gear || 1;
      const rpmRatio = (boat.rpmPermil || 0) / 1000;
      let jewelState = 'off';

      // Bug #3: Zona hijau memakai jendelaGigi(spec, gear) persis dari spec balapan.rasioPreset
      if (gear < CONFIG.TRANSMISI.JUMLAH_GIGI) {
        const win = jendelaGigi(spec, gear);
        const gStart = win.greenStartPermil / 1000;
        const sStart = win.starStartPermil / 1000;
        const gEnd = win.greenEndPermil / 1000;

        const inGreen = boat.rpmPermil >= win.greenStartPermil && boat.rpmPermil <= win.greenEndPermil;
        const inStar = boat.rpmPermil >= win.starStartPermil && boat.rpmPermil <= win.greenEndPermil;
        if (boat.rpmPermil > win.greenEndPermil) jewelState = 'red';
        else if (inStar) jewelState = 'star';
        else if (inGreen) jewelState = 'green';

        const pulse = (inGreen && !reducedMotion) ? (0.25 + 0.75 * ((Math.sin(nowMs / 60) + 1) / 2)) : 0;
        g.strokeStyle = 'rgba(42, 106, 59, ' + (0.82 + pulse * 0.18) + ')';
        g.lineWidth = R * 0.22;
        g.beginPath();
        g.arc(gx, gy, R, ang(gStart), ang(gEnd));
        g.stroke();

        g.strokeStyle = inStar ? 'rgba(255, 228, 120, 1)' : '#e0b13c';
        g.lineWidth = R * 0.28;
        g.beginPath();
        g.arc(gx, gy, R, ang(sStart), ang(gEnd));
        g.stroke();

        const am = ang((gStart + sStart) / 2);
        g.fillStyle = '#e8f5df';
        g.font = '900 ' + Math.round(R * 0.13) + 'px system-ui, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('✓', gx + Math.cos(am) * R, gy + Math.sin(am) * R);

        const as = ang((sStart + gEnd) / 2);
        g.fillStyle = '#4a320c';
        g.fillText('★', gx + Math.cos(as) * R, gy + Math.sin(as) * R);
      }

      const jx = gx;
      const jy = gy - R * 1.18;
      const jr = Math.max(5, R * 0.11);
      g.save();
      g.fillStyle = '#2e1c10';
      g.beginPath();
      g.arc(jx, jy, jr + 2.5, 0, Math.PI * 2);
      g.fill();
      if (jewelState === 'star') g.fillStyle = '#fff1c4';
      else if (jewelState === 'green') g.fillStyle = '#6ee787';
      else if (jewelState === 'red') g.fillStyle = '#ff6b52';
      else g.fillStyle = '#4f331e';
      g.beginPath();
      g.arc(jx, jy, jr, 0, Math.PI * 2);
      g.fill();
      g.restore();

      const heat = (boat.heatMikro || 0) / CONFIG.SIMULASI.SKALA_JUTA;
      if (heat > 0.01) {
        const hc = heat < 0.5 ? 'rgba(224, 165, 60, 0.95)' : (heat < 0.8 ? 'rgba(230, 110, 40, 1)' : 'rgba(207, 75, 51, 1)');
        g.strokeStyle = hc;
        g.lineWidth = R * 0.07;
        g.lineCap = 'round';
        g.beginPath();
        g.arc(gx, gy, R * 1.195, A0, A0 + SW * Math.min(1, heat));
        g.stroke();
        g.lineCap = 'butt';
      }

      const idleWave = reducedMotion ? 0 : Math.sin(nowMs / 850) * 0.04;
      const targ = boat.launched ? rpmRatio : ((CONFIG.START.RPM_IDLE_PRA_START_PERMIL / 1000) + idleWave);
      live.needleRpm += (targ - live.needleRpm) * Math.min(1, dt * 26);
      const an = ang(Math.min(1.01, Math.max(0, live.needleRpm)));
      g.save();
      g.translate(gx, gy);
      g.rotate(an);
      g.fillStyle = heat > 0.8 ? '#8c2a1d' : '#1d130a';
      g.beginPath();
      g.moveTo(-R * 0.14, -R * 0.03);
      g.lineTo(R * 0.94, 0);
      g.lineTo(-R * 0.14, R * 0.03);
      g.closePath();
      g.fill();
      g.restore();

      const hub = g.createRadialGradient(gx - R * 0.06, gy - R * 0.06, 0, gx, gy, R * 0.25);
      hub.addColorStop(0, '#fbeabb');
      hub.addColorStop(1, '#8f6522');
      g.fillStyle = hub;
      g.beginPath();
      g.arc(gx, gy, R * 0.24, 0, Math.PI * 2);
      g.fill();

      g.fillStyle = '#2a1a0c';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '700 ' + Math.round(R * 0.32) + 'px Georgia, serif';
      g.fillText(String(gear), gx, gy);

      g.fillStyle = '#7b6445';
      g.font = '700 ' + Math.max(8, Math.round(R * 0.1)) + 'px system-ui, sans-serif';
      g.fillText('GIGI · RPM', gx, gy + R * 0.56);
    }

    function drawKawungSpeedometer(g, gx, gy, R, dt, speedKnot, isBoost) {
      drawKawungDialBase(g, gx, gy, R);
      const A0 = Math.PI * 0.8;
      const SW = Math.PI * 1.4;
      const maxKt = CONFIG.SPEEDOMETER.MAKS_KNOT;
      live.needleSpeed += (speedKnot - live.needleSpeed) * Math.min(1, dt * 18);
      const frac = Math.min(1, Math.max(0, live.needleSpeed / maxKt));
      const ang = (r) => A0 + SW * r;

      for (let kt = 0; kt <= maxKt; kt += CONFIG.SPEEDOMETER.INTERVAL_GARIS_KNOT) {
        const f = kt / maxKt;
        const a = ang(f);
        const major = kt % CONFIG.SPEEDOMETER.INTERVAL_ANGKA_KNOT === 0;
        const r1 = R * (major ? 0.74 : 0.82);
        const r2 = R * 0.9;
        g.strokeStyle = '#33230f';
        g.lineWidth = major ? 2 : 1;
        g.beginPath();
        g.moveTo(gx + Math.cos(a) * r1, gy + Math.sin(a) * r1);
        g.lineTo(gx + Math.cos(a) * r2, gy + Math.sin(a) * r2);
        g.stroke();

        if (major) {
          g.fillStyle = '#33230f';
          g.font = '700 ' + Math.max(7.5, Math.round(R * 0.105)) + 'px system-ui, sans-serif';
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.fillText(String(kt), gx + Math.cos(a) * R * 0.60, gy + Math.sin(a) * R * 0.60);
        }
      }

      const an = ang(frac);
      g.save();
      g.translate(gx, gy);
      g.rotate(an);
      g.fillStyle = isBoost ? '#b8322a' : '#1d130a';
      g.beginPath();
      g.moveTo(-R * 0.14, -R * 0.03);
      g.lineTo(R * 0.94, 0);
      g.lineTo(-R * 0.14, R * 0.03);
      g.closePath();
      g.fill();
      g.restore();

      const hub = g.createRadialGradient(gx - R * 0.06, gy - R * 0.06, 0, gx, gy, R * 0.22);
      hub.addColorStop(0, '#fbeabb');
      hub.addColorStop(1, '#8f6522');
      g.fillStyle = hub;
      g.beginPath();
      g.arc(gx, gy, R * 0.20, 0, Math.PI * 2);
      g.fill();

      const kn = Math.round(speedKnot);
      g.fillStyle = '#33230f';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '700 ' + Math.round(R * 0.17) + 'px ui-monospace, monospace';
      g.fillText(kn + ' knot', gx, gy + R * 0.44);

      g.fillStyle = '#7b6445';
      g.font = '700 ' + Math.max(8, Math.round(R * 0.095)) + 'px system-ui, sans-serif';
      g.fillText(knotToKmh(kn) + ' KM/H', gx, gy + R * 0.64);
    }

    function drawBrassPlaque(g, x, y, glowA, w, h) {
      const pw = Math.max(44, w || 112);
      const ph = Math.max(24, h || 44);
      const hw = pw / 2;
      const hh = ph / 2;
      g.fillStyle = '#372316';
      roundRect(g, x - hw, y - hh, pw, ph, 9);
      g.fill();
      g.strokeStyle = '#8f6522';
      g.lineWidth = 1.5;
      roundRect(g, x - hw, y - hh, pw, ph, 9);
      g.stroke();
      if (glowA > 0) {
        g.fillStyle = 'rgba(255, 150, 50, ' + Math.min(1, glowA) + ')';
        roundRect(g, x - hw + 2, y - hh + 2, pw - 4, ph - 4, 8);
        g.fill();
      }
      g.fillStyle = '#d3a342';
      const rivets = [[-hw + 6, -hh + 6], [hw - 6, -hh + 6], [-hw + 6, hh - 6], [hw - 6, hh - 6]];
      for (let i = 0; i < rivets.length; i++) {
        g.beginPath();
        g.arc(x + rivets[i][0], y + rivets[i][1], 1.5, 0, Math.PI * 2);
        g.fill();
      }
    }

    function renderArenaCanvas(dt, nowMs) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = raceCanvas.getBoundingClientRect();
      const W = Math.max(300, Math.round(rect.width));
      const H = Math.max(320, Math.round(rect.height));
      if (raceCanvas.width !== Math.round(W * dpr) || raceCanvas.height !== Math.round(H * dpr)) {
        raceCanvas.width = Math.round(W * dpr);
        raceCanvas.height = Math.round(H * dpr);
      }

      raceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const nowSec = nowMs / 1000;
      const reducedMotion = isReducedMotion();
      const portrait = H > W * 1.05;
      const trackH = Math.round(H * (portrait ? 0.55 : 0.61));
      const hudH = Math.max(100, H - trackH);
      const horizon = Math.round(trackH * 0.36);

      buildZentulBackdrop(W, trackH, horizon);

      const pemain = getPemainBoat() || buat(spesifikasi(hostState.kelasAktif, hostState.partTerpasang, live.rasioPreset), {
        id: 'pemain',
        nama: hostState.namaKapten,
        isPemain: true
      });
      const lawanList = live.boats.filter(b => b.id !== pemain.id);

      const pemainPosM = pemain.posMm / 1000;
      const pemainSpeedKnot = mmPerSecToKnot(pemain.speedMmPerSec);
      const distTotalM = live.jarakMm / 1000;

      const isMultiLane = lawanList.length > 1;
      const laneO = Math.round(horizon + (trackH - horizon) * (isMultiLane ? 0.24 : 0.34));
      const laneP = Math.round(horizon + (trackH - horizon) * (isMultiLane ? 0.84 : 0.72));

      const ppm = Math.max(9, W / (portrait ? 34 : 44));
      const targetCam = pemainPosM - (W / ppm) * 0.34;
      live.camX += (targetCam - live.camX) * Math.min(1, dt * 12);
      if (Math.abs(targetCam - live.camX) > 35) live.camX = targetCam;
      const wx = (m) => (m - live.camX) * ppm;

      if (skyLayer) raceCtx.drawImage(skyLayer, 0, 0, W, horizon + 2);
      if (cityLayer) {
        let off = (live.camX * ppm * 0.06) % cityLayer.width;
        if (off < 0) off += cityLayer.width;
        const cyy = horizon - cityLayer.height + 2;
        raceCtx.drawImage(cityLayer, -off, cyy);
        raceCtx.drawImage(cityLayer, -off + cityLayer.width, cyy);
      }

      if (seaLayer) raceCtx.drawImage(seaLayer, 0, horizon, W, Math.max(10, trackH - horizon));

      // Penjor & Obor Bambu
      const par = 0.45, sp = 22, shoreY = horizon + 5;
      const ph = (live.camX * par) / sp;
      const first = Math.floor(ph) - 1;
      const cols = ['#c7362b', '#e0b13c', '#2f7fa3', '#3d8a4a'];
      for (let i = first; i < first + Math.ceil(W / (sp * ppm * par)) + 3; i++) {
        const px = (i * sp - live.camX * par) * ppm * par + W * 0.2;
        const bh = 28 + (Math.abs(i) % 3) * 6;
        const sway = reducedMotion ? 0 : Math.sin(nowMs / 900 + i) * 3;
        if (i % 2 === 0) {
          raceCtx.strokeStyle = '#2a1a10';
          raceCtx.lineWidth = 2;
          raceCtx.beginPath();
          raceCtx.moveTo(px, shoreY);
          raceCtx.quadraticCurveTo(px + 2, shoreY - bh * 0.7, px + 10 + sway, shoreY - bh);
          raceCtx.stroke();
          raceCtx.fillStyle = cols[((i % 4) + 4) % 4];
          raceCtx.beginPath();
          raceCtx.moveTo(px + 1, shoreY - bh * 0.55);
          raceCtx.lineTo(px + 7 + sway * 0.6, shoreY - bh * 0.5);
          raceCtx.lineTo(px + 2, shoreY - bh * 0.2);
          raceCtx.closePath();
          raceCtx.fill();
        } else {
          raceCtx.fillStyle = '#2a1a10';
          raceCtx.fillRect(px - 1, shoreY - bh * 0.55, 2, bh * 0.55);
          const fl = reducedMotion ? 0.9 : (0.75 + Math.sin(nowMs / 90 + i * 2.3) * 0.25);
          raceCtx.fillStyle = '#ffd27a';
          raceCtx.beginPath();
          raceCtx.ellipse(px, shoreY - bh * 0.55 - 3, 1.8, 3.2 * fl, 0, 0, Math.PI * 2);
          raceCtx.fill();
        }
      }

      // Riak Gelombang Selat
      const rows = 12, span = Math.max(20, trackH - horizon);
      for (let r = 0; r < rows; r++) {
        const f = (r + 1) / rows;
        const wy = horizon + span * (f * f * 0.95 + 0.03);
        const wpar = 0.25 + f * 0.85;
        const stepW = 5 + f * 3;
        const lenW = (0.6 + f * 1.6) * ppm * 0.25 + 4 + (pemainSpeedKnot * 0.4) * f * ppm * 0.035;
        const o = ((live.camX * wpar) % stepW + stepW) % stepW;
        raceCtx.strokeStyle = 'rgba(255, 215, 170, ' + (0.04 + f * 0.09) + ')';
        raceCtx.lineWidth = 1 + f * 1.1;
        raceCtx.beginPath();
        for (let x = -o; x < W / (ppm * wpar) + stepW; x += stepW) {
          const X = x * ppm * wpar + Math.sin(r * 12.9 + x) * 6;
          const waveY = reducedMotion ? 0 : Math.sin(nowMs / 700 + x * 0.7 + r) * (1 + f * 2);
          raceCtx.moveTo(X, wy + waveY);
          raceCtx.lineTo(X + lenW, wy + waveY);
        }
        raceCtx.stroke();
      }

      // Pelampung, Papan Jarak & Gapura Finis
      const buoyIntM = CONFIG.LINTASAN.INTERVAL_PELAMPUNG_MM / 1000;
      const bigBuoyIntM = CONFIG.LINTASAN.INTERVAL_PELAMPUNG_BESAR_MM / 1000;
      const boardIntM = CONFIG.LINTASAN.INTERVAL_PAPAN_JARAK_MM / 1000;
      for (let m = 0; m <= distTotalM + 60; m += buoyIntM) {
        const mx = wx(m);
        if (mx < -50 || mx > W + 50) continue;
        const big = m % bigBuoyIntM === 0;
        [laneO, laneP].forEach((ly, li) => {
          const by = ly + (li === 0 ? 20 : 24);
          raceCtx.fillStyle = big ? 'rgba(224, 177, 60, 0.95)' : 'rgba(255, 236, 200, 0.35)';
          raceCtx.beginPath();
          raceCtx.arc(mx, by, big ? 3 : 1.7, 0, Math.PI * 2);
          raceCtx.fill();
        });

        if (m % boardIntM === 0 && m > 0 && m <= distTotalM - 50) {
          const py = horizon + (laneO - horizon) * 0.32;
          raceCtx.fillStyle = '#2a1a10';
          raceCtx.fillRect(mx - 1, py + 8, 2, 14);
          raceCtx.fillStyle = '#6b4629';
          roundRect(raceCtx, mx - 24, py - 10, 48, 19, 3);
          raceCtx.fill();
          raceCtx.strokeStyle = '#d3a342';
          raceCtx.lineWidth = 1;
          roundRect(raceCtx, mx - 24, py - 10, 48, 19, 3);
          raceCtx.stroke();
          raceCtx.fillStyle = '#fbeabb';
          raceCtx.font = '700 10.5px system-ui, sans-serif';
          raceCtx.textAlign = 'center';
          raceCtx.textBaseline = 'middle';
          raceCtx.fillText(m + ' m', mx, py);
        }
      }

      const s0 = wx(0);
      if (s0 > -20 && s0 < W + 20) {
        raceCtx.fillStyle = 'rgba(255, 236, 200, 0.72)';
        raceCtx.fillRect(s0 - 1.5, laneO - 24, 3, laneP - laneO + 52);
      }

      const fx = wx(distTotalM);
      if (fx > -120 && fx < W + 120) {
        raceCtx.fillStyle = 'rgba(240, 207, 120, 0.85)';
        for (let yy = laneO - 28; yy < trackH; yy += 10) {
          raceCtx.beginPath();
          raceCtx.moveTo(fx - 3, yy);
          raceCtx.lineTo(fx + 3, yy + 5);
          raceCtx.lineTo(fx - 3, yy + 10);
          raceCtx.closePath();
          raceCtx.fill();
        }
        const gh = Math.min(trackH * 0.42, 136);
        const gw = gh * 0.32;
        const gy = horizon + 8;
        [fx - gw - 8, fx + 8].forEach((bx, side) => {
          raceCtx.fillStyle = '#5a2418';
          raceCtx.beginPath();
          raceCtx.moveTo(bx, gy);
          for (let k = 0; k < 4; k++) {
            const inset = (k + 1) * gw * 0.08;
            const top = gy - gh * (0.3 + k * 0.17);
            raceCtx.lineTo(bx + (side ? 0 : inset), top + gh * 0.04);
            raceCtx.lineTo(bx + (side ? 0 : inset), top);
          }
          raceCtx.lineTo(bx + (side ? 0 : gw), gy - gh);
          raceCtx.lineTo(bx + gw, gy);
          raceCtx.closePath();
          raceCtx.fill();
          raceCtx.fillStyle = '#d3a342';
          raceCtx.fillRect(bx, gy - gh * 0.3, gw, 2);
          raceCtx.fillRect(bx, gy - gh * 0.6, gw, 2);
        });
        raceCtx.fillStyle = '#e0b13c';
        roundRect(raceCtx, fx - 56, gy - gh * 0.86, 112, 20, 3);
        raceCtx.fill();
        raceCtx.fillStyle = '#4a320c';
        raceCtx.font = '800 10px system-ui, sans-serif';
        raceCtx.textAlign = 'center';
        raceCtx.textBaseline = 'middle';
        raceCtx.fillText('FINISH ' + (distTotalM === 1400 ? '1,4 KM' : distTotalM + 'M'), fx, gy - gh * 0.86 + 10);
      }

      // Kapal Lawan (Simulasi AI atau Interpolasi posisiLawan() bila lawanLangsung === true)
      const totalLanes = lawanList.length + 1;
      for (let idx = 0; idx < lawanList.length; idx++) {
        const lv = lawanList[idx];
        let lPosMm = lv.posMm;
        let lSpeedMmPerSec = lv.speedMmPerSec;
        let lRpmRatio = (lv.rpmPermil || 250) / 1000;

        if (live.lawanLangsung && live.liveOpponents[lv.id]) {
          const op = live.liveOpponents[lv.id];
          const dtOpSec = Math.min(0.25, Math.max(0, (nowMs - op.lastUpdatePerfMs) / 1000));
          lPosMm = op.posMm + Math.round(op.speedMmPerSec * dtOpSec);
          lSpeedMmPerSec = op.speedMmPerSec;
          lRpmRatio = 0.72;
        }

        const lShip = CONFIG.KELAS_KAPAL[lv.kelas] || CONFIG.KELAS_KAPAL.sekoci_standar;
        const laneRatio = isMultiLane ? (0.14 + (idx / Math.max(1, lawanList.length - 1)) * 0.46) : 0.34;
        const rLaneY = Math.round(horizon + (trackH - horizon) * laneRatio);
        const rScale = isMultiLane ? (0.82 + (idx / Math.max(1, totalLanes)) * 0.16) : 0.96;

        drawNusantaraBoat(raceCtx, {
          x: wx(lPosMm / 1000),
          y: rLaneY,
          scale: rScale,
          ship: lShip,
          parts: lv.spec ? lv.spec.partIds : [],
          speedKnot: mmPerSecToKnot(lSpeedMmPerSec),
          rpmRatio: lRpmRatio,
          isBoost: lv.boostLeftMs > 0,
          isGhost: lv.isBayangan,
          isOpponent: !lv.isBayangan,
          captainName: lv.nama,
          nowSec,
          reducedMotion
        });
      }

      // Kapal Pemain
      const playerShip = CONFIG.KELAS_KAPAL[pemain.kelas] || CONFIG.KELAS_KAPAL.sekoci_standar;
      drawNusantaraBoat(raceCtx, {
        x: wx(pemainPosM),
        y: laneP,
        scale: isMultiLane ? 1.02 : 1.08,
        ship: playerShip,
        parts: pemain.spec ? pemain.spec.partIds : hostState.partTerpasang,
        speedKnot: pemainSpeedKnot,
        rpmRatio: (pemain.rpmPermil || 0) / 1000,
        isBoost: pemain.boostLeftMs > 0,
        isCough: pemain.coughTimerMs > 0,
        isBlown: pemain.exploded || hostState.mesinJebol,
        isPlayer: true,
        captainName: pemain.nama || hostState.namaKapten,
        nowSec,
        reducedMotion
      });

      // Mini-Map Progres Atas
      const barW = Math.min(W - 32, 460);
      const barX = (W - barW) / 2;
      const barY = 10;

      raceCtx.fillStyle = 'rgba(18, 11, 7, 0.74)';
      roundRect(raceCtx, barX - 8, barY - 4, barW + 16, 25, 8);
      raceCtx.fill();
      raceCtx.strokeStyle = 'rgba(211, 163, 66, 0.45)';
      raceCtx.lineWidth = 1;
      roundRect(raceCtx, barX - 8, barY - 4, barW + 16, 25, 8);
      raceCtx.stroke();

      raceCtx.fillStyle = 'rgba(244, 231, 200, 0.2)';
      roundRect(raceCtx, barX, barY + 2, barW, 4, 2);
      raceCtx.fill();

      const rvCols = ['#7cc3dc', '#f472b6', '#a78bfa'];
      for (let idx = 0; idx < lawanList.length; idx++) {
        const lv = lawanList[idx];
        const opPosMm = (live.lawanLangsung && live.liveOpponents[lv.id]) ? live.liveOpponents[lv.id].posMm : lv.posMm;
        const rm = Math.min(1, opPosMm / Math.max(1, live.jarakMm));
        raceCtx.fillStyle = rvCols[idx % rvCols.length];
        raceCtx.beginPath();
        raceCtx.arc(barX + barW * rm, barY + 4, 4.5, 0, Math.PI * 2);
        raceCtx.fill();
      }

      const pm = Math.min(1, pemain.posMm / Math.max(1, live.jarakMm));
      raceCtx.fillStyle = '#e8b84a';
      raceCtx.beginPath();
      raceCtx.arc(barX + barW * pm, barY + 4, 6, 0, Math.PI * 2);
      raceCtx.fill();

      raceCtx.font = '700 10px system-ui, sans-serif';
      raceCtx.textBaseline = 'middle';
      raceCtx.textAlign = 'left';
      raceCtx.fillStyle = '#e8b84a';
      raceCtx.fillText((pemain.nama || hostState.namaKapten).toUpperCase(), barX, barY + 13);
      if (lawanList.length > 0) {
        raceCtx.textAlign = 'center';
        raceCtx.fillStyle = '#a9c0e6';
        raceCtx.fillText(
          lawanList.length > 1 ? ((lawanList.length + 1) + ' KAPTEN') : lawanList[0].nama,
          barX + barW / 2,
          barY + 13
        );
      }
      raceCtx.textAlign = 'right';
      raceCtx.fillStyle = 'rgba(251, 234, 187, 0.85)';
      raceCtx.fillText(distTotalM === 1400 ? '1,4 km' : (distTotalM + ' m'), barX + barW, barY + 13);

      // Tiga Obor Start & Dentuman Meriam
      const absMs = tickToMs(live.tick);
      if (live.fase === 'hitung_mundur' || (live.torchPhase === 3 && absMs < live.meriamMs + 900)) {
        const size = Math.min(W * 0.075, trackH * 0.11, 42);
        const gap = size * 0.55;
        const cx0 = W / 2;
        const cy0 = trackH * 0.28;

        raceCtx.fillStyle = '#2e1c10';
        roundRect(raceCtx, cx0 - size * 1.5 - gap * 1.6, cy0 + size * 0.15, size * 3 + gap * 3.2, size * 0.28, 3);
        raceCtx.fill();

        for (let i = 0; i < 3; i++) {
          const lx = cx0 + (i - 1) * (size + gap);
          raceCtx.fillStyle = '#4f331e';
          raceCtx.fillRect(lx - size * 0.07, cy0 - size * 0.1, size * 0.14, size * 0.6);
          raceCtx.fillStyle = '#8f6522';
          raceCtx.fillRect(lx - size * 0.16, cy0 - size * 0.18, size * 0.32, size * 0.12);

          const on = live.torchPhase >= i && live.torchPhase < 3;
          const go = live.torchPhase === 3;
          if (on || go) {
            const fl = reducedMotion ? 0.9 : (0.8 + Math.sin(nowMs / 70 + i * 2) * 0.2);
            raceCtx.fillStyle = go ? '#fff1c4' : '#ffb347';
            raceCtx.beginPath();
            raceCtx.moveTo(lx - size * 0.14, cy0 - size * 0.18);
            raceCtx.quadraticCurveTo(lx - size * 0.22, cy0 - size * 0.58 * fl, lx, cy0 - size * 0.85 * fl);
            raceCtx.quadraticCurveTo(lx + size * 0.22, cy0 - size * 0.52 * fl, lx + size * 0.14, cy0 - size * 0.18);
            raceCtx.closePath();
            raceCtx.fill();
          }
        }

        if (live.torchPhase === 3 && live.fase === 'balap') {
          raceCtx.font = '700 ' + Math.round(size * 0.68) + 'px Georgia, serif';
          raceCtx.textAlign = 'center';
          raceCtx.textBaseline = 'middle';
          raceCtx.lineWidth = 4;
          raceCtx.strokeStyle = 'rgba(18, 11, 7, 0.88)';
          raceCtx.strokeText('BERANGKAT!', cx0, cy0 + size * 1.02);
          raceCtx.fillStyle = '#fff1c4';
          raceCtx.fillText('BERANGKAT!', cx0, cy0 + size * 1.02);
        }
      }

      // Callout Feedback
      if (live.fb) {
        const age = (nowMs - live.fb.t) / 1000;
        if (age > 0.9) {
          live.fb = null;
        } else {
          raceCtx.save();
          raceCtx.translate(W / 2, trackH - 56);
          raceCtx.globalAlpha = Math.min(1, (0.9 - age) / 0.3);
          raceCtx.font = '700 28px Georgia, serif';
          raceCtx.textAlign = 'center';
          raceCtx.lineWidth = 4;
          raceCtx.strokeStyle = 'rgba(18, 11, 7, 0.9)';
          raceCtx.strokeText(live.fb.txt, 0, 0);
          raceCtx.fillStyle = live.fb.col;
          raceCtx.fillText(live.fb.txt, 0, 0);
          if (live.fb.sub) {
            raceCtx.font = '600 12px system-ui, sans-serif';
            raceCtx.fillStyle = 'rgba(251, 234, 187, 0.92)';
            raceCtx.fillText(live.fb.sub, 0, 20);
          }
          raceCtx.restore();
        }
      }

      // Dek Instrumen Kayu Jati & Kawung
      const y0 = trackH;
      const bg = raceCtx.createLinearGradient(0, y0, 0, H);
      bg.addColorStop(0, '#24170f');
      bg.addColorStop(1, '#120b07');
      raceCtx.fillStyle = bg;
      raceCtx.fillRect(0, y0, W, hudH);
      raceCtx.fillStyle = '#d3a342';
      raceCtx.fillRect(0, y0, W, 2);

      const isNarrow = W < 560;
      const R = Math.max(28, Math.min(hudH * (isNarrow ? 0.30 : 0.35), W * 0.145, 60));
      const gy = y0 + hudH * (isNarrow ? 0.64 : 0.54);
      const tachoX = W * 0.5 - R * (isNarrow ? 1.30 : 1.46);
      const speedoX = W * 0.5 + R * (isNarrow ? 1.30 : 1.46);

      drawKawungTachometer(raceCtx, tachoX, gy, R, dt, nowMs, pemain.spec, pemain, reducedMotion);
      drawKawungSpeedometer(raceCtx, speedoX, gy, R, dt, pemainSpeedKnot, pemain.boostLeftMs > 0);

      const leftPlaqueX = isNarrow ? Math.max(64, W * 0.26) : Math.max(64, tachoX - R * 1.24 - 62);
      const rightPlaqueX = isNarrow ? Math.min(W - 64, W * 0.74) : Math.min(W - 64, speedoX + R * 1.24 + 62);
      const plaqueY = isNarrow ? (y0 + 23) : gy;
      const plaqueW = isNarrow ? Math.min(138, W * 0.44) : 112;
      const plaqueH = isNarrow ? 32 : 42;

      drawBrassPlaque(raceCtx, leftPlaqueX, plaqueY, 0, plaqueW, plaqueH);
      const tSec = (pemain.finishWaktuMs != null ? pemain.finishWaktuMs : pemain.elapsedRaceMs) / 1000;
      raceCtx.fillStyle = '#fff1c4';
      raceCtx.font = '700 ' + (isNarrow ? 12 : 13.5) + 'px ui-monospace, monospace';
      raceCtx.textAlign = 'center';
      raceCtx.textBaseline = 'middle';
      raceCtx.fillText(
        tSec.toFixed(2).replace('.', ',') + 's · ' + Math.min(distTotalM, Math.round(pemainPosM)) + 'm',
        leftPlaqueX,
        plaqueY - (isNarrow ? 4 : 5)
      );
      raceCtx.fillStyle = 'rgba(251, 234, 187, 0.72)';
      raceCtx.font = '500 10px system-ui, sans-serif';
      raceCtx.fillText('target ' + distTotalM + ' m', leftPlaqueX, plaqueY + (isNarrow ? 8 : 11));

      const semReady = live.fase === 'balap' && pemain.launched && pemain.gear === CONFIG.TRANSMISI.JUMLAH_GIGI && !pemain.boostUsed;
      const tmsNow = getCurrentRelTms();
      const holdProg = (pemain.tombolDitahan && pemain.tahanGigi5SejakMs >= 0 && semReady)
        ? Math.min(1, Math.max(0, (tmsNow - pemain.tahanGigi5SejakMs) / CONFIG.SKILL_SEMBURAN.DURASI_TAHAN_AKTIVASI_MS))
        : 0;
      drawBrassPlaque(raceCtx, rightPlaqueX, plaqueY, semReady ? 0.35 : 0, plaqueW, plaqueH);
      if (holdProg > 0) {
        raceCtx.fillStyle = 'rgba(255, 140, 40, 0.58)';
        roundRect(raceCtx, rightPlaqueX - (plaqueW / 2 - 2), plaqueY - (plaqueH / 2 - 2), (plaqueW - 4) * holdProg, plaqueH - 4, 7);
        raceCtx.fill();
      }
      raceCtx.fillStyle = semReady ? '#fff1c4' : 'rgba(251, 234, 187, 0.78)';
      raceCtx.font = '700 ' + (isNarrow ? 9.5 : 10) + 'px system-ui, sans-serif';
      raceCtx.fillText('SEMBURAN', rightPlaqueX, plaqueY - (isNarrow ? 4 : 5));
      raceCtx.font = '500 10px system-ui, sans-serif';
      raceCtx.fillText(pemain.boostLeftMs > 0 ? 'menyembur!' : (semReady ? 'tahan jarimu' : 'di gigi lima'), rightPlaqueX, plaqueY + (isNarrow ? 8 : 10));

      updateActionStrip(pemain);
    }

    function updateActionStrip(pemain) {
      const tapBtn = q('btn-main-tap');
      const tapTitle = q('btn-main-tap-title');
      const tapSub = q('btn-main-tap-sub');
      const semBtn = q('btn-semburan');
      const semSub = q('btn-semburan-sub');
      if (!tapBtn || !semBtn) return;

      const gear = pemain.gear || 1;
      const win = jendelaGigi(pemain.spec, gear);
      const inGreen = live.fase === 'balap' && pemain.launched && gear < CONFIG.TRANSMISI.JUMLAH_GIGI &&
                      pemain.rpmPermil >= win.greenStartPermil && pemain.rpmPermil <= win.greenEndPermil;
      const semReady = live.fase === 'balap' && pemain.launched && gear === CONFIG.TRANSMISI.JUMLAH_GIGI && !pemain.boostUsed;

      tapBtn.classList.toggle('pcs-green-ready', inGreen);
      semBtn.classList.toggle('pcs-semburan-ready', semReady);
      semBtn.disabled = gear !== CONFIG.TRANSMISI.JUMLAH_GIGI && !pemain.boostUsed;

      if (pemain.exploded || hostState.mesinJebol) {
        tapTitle.textContent = '💥 MESIN KAPAL JEBOL';
        tapSub.textContent = 'Perbaiki mesin di Bengkel Mesin sebelum berlomba';
      } else if (!pemain.launched) {
        tapTitle.textContent = live.fase === 'hitung_mundur' ? 'TUNGGU MERIAM BERDENTUM...' : '🔥 KETUK SEKARANG! LEPAS START!';
        tapSub.textContent = 'Ketuk < 80 ms setelah meriam dihitung curi start';
      } else if (gear < CONFIG.TRANSMISI.JUMLAH_GIGI) {
        tapTitle.textContent = inGreen ? ('⚡ OPER GIGI SEKARANG! (' + gear + '→' + (gear + 1) + ')') : ('NAIKKAN GIGI (' + gear + ' → ' + (gear + 1) + ')');
        tapSub.textContent = 'Ketuk layar atau Spasi di daun hijau ✓ / bintang emas ★';
      } else {
        tapTitle.textContent = 'GIGI PUNCAK (GIGI 5)';
        tapSub.textContent = pemain.boostLeftMs > 0 ? 'Semburan oli hitam aktif menuju Finish!' : 'Tahan tombol atau Spasi ±½ detik untuk menyembur';
      }

      semSub.textContent = pemain.boostLeftMs > 0
        ? 'Oli Hitam sedang menyembur!'
        : (semReady ? 'Tahan ±½ detik sekarang!' : 'Hanya aktif di Gigi 5');
    }

    function renderResultOverlay() {
      const pemain = getPemainBoat();
      const hasil = hostState.hasil;
      const hasilCocok = hasil &&
        (!hasil.balapanId || !live.raceId || String(hasil.balapanId) === String(live.raceId));

      const kickerEl = q('res-kicker');
      const titleEl = q('res-title');
      const myTimeEl = q('res-my-time');
      const opLblEl = q('res-op-lbl');
      const opTimeEl = q('res-op-time');
      const topSpdEl = q('res-top-speed');
      const z100El = q('res-zero-hundred');
      const standingsEl = q('res-standings');
      const shiftsEl = q('res-shifts');
      const rewardEl = q('res-reward');

      const exploded = hasilCocok && hasil.mesinJebol != null
        ? Boolean(hasil.mesinJebol)
        : Boolean(pemain && pemain.exploded);
      const myMs = hasilCocok && hasil.waktuMs != null
        ? hasil.waktuMs
        : (pemain ? pemain.finishWaktuMs : null);
      const topKt = hasilCocok && hasil.topSpeedKnot != null
        ? hasil.topSpeedKnot
        : (pemain ? mmPerSecToKnot(pemain.maxSpeedMmPerSec) : 0);
      const z100Ms = hasilCocok && hasil.zeroToHundredMs != null
        ? hasil.zeroToHundredMs
        : (pemain ? pemain.zeroToHundredMs : null);

      myTimeEl.textContent = exploded ? 'JEBOL (DNF)' : fmtDetik(myMs != null ? myMs / 1000 : null);
      topSpdEl.textContent = topKt + ' kt (' + knotToKmh(topKt) + ')';
      z100El.textContent = z100Ms != null ? (z100Ms / 1000).toFixed(2).replace('.', ',') + ' dtk' : '—';

      if (exploded) {
        kickerEl.textContent = 'Blok Mesin Pecah Akibat Panas';
        titleEl.textContent = 'Mesin Jebol!';
        titleEl.className = 'pcs-result-heading pcs-lose';
      } else if (hasilCocok && hasil.judul) {
        kickerEl.textContent = hasil.subJudul || 'Catatan Resmi Juru Tulis Rayan Bazzy';
        titleEl.textContent = hasil.judul;
        titleEl.className = 'pcs-result-heading' + (hasil.menang === false ? ' pcs-lose' : '');
      } else {
        kickerEl.textContent = 'Catatan Sementara Klien';
        titleEl.textContent = 'Finish!';
        titleEl.className = 'pcs-result-heading';
      }

      const finishMap = (hasilCocok && hasil.finishPerKapal) || {};
      const rows = live.boats.map(b => ({
        id: b.id,
        nama: b.nama,
        isPemain: b.isPemain,
        waktuMs: finishMap[b.id] != null ? finishMap[b.id] : b.finishWaktuMs
      })).sort((a, b) => {
        if (a.waktuMs == null && b.waktuMs == null) return 0;
        if (a.waktuMs == null) return 1;
        if (b.waktuMs == null) return -1;
        return a.waktuMs - b.waktuMs;
      });

      if (rows.length > 1) {
        const lawanRow = rows.find(r => !r.isPemain);
        opLblEl.textContent = lawanRow ? lawanRow.nama.toUpperCase() : 'LAWAN';
        opTimeEl.textContent = lawanRow ? (lawanRow.waktuMs != null ? fmtDetik(lawanRow.waktuMs / 1000) : (hasilCocok ? 'DNF' : '—')) : '—';
        standingsEl.innerHTML = `
          <div class="pcs-standings-box">
            ${rows.map((r, idx) => `
              <div class="pcs-standing-row ${r.isPemain ? 'pcs-me' : ''}">
                <span style="font-weight:800;color:var(--pcs-brass-300)">#${idx + 1}</span>
                <span>${r.nama}</span>
                <span class="pcs-mono">${r.waktuMs != null ? fmtDetik(r.waktuMs / 1000) : (hasilCocok ? 'DNF' : 'Menunggu…')}</span>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        opLblEl.textContent = 'JARAK LINTASAN';
        opTimeEl.textContent = (live.jarakMm / 1000) + ' m';
        standingsEl.innerHTML = '';
      }

      const shifts = pemain && Array.isArray(pemain.shifts) ? pemain.shifts : [];
      let badgesHtml = shifts.map(s =>
        `<span class="pcs-q-badge pcs-${s.kualitas}">${s.gear}→${s.gear + 1} ${String(s.kualitas).toUpperCase()}</span>`
      ).join('');
      for (let i = shifts.length; i < 4; i++) {
        badgesHtml += `<span class="pcs-q-badge">${i + 1}→${i + 2} —</span>`;
      }
      shiftsEl.innerHTML = badgesHtml;

      // Bug #2: Tampilkan "Menunggu juru tulis…" sampai state.hasil dengan balapanId cocok tiba
      if (hasilCocok && hasil.keteranganHadiah) {
        rewardEl.textContent = hasil.keteranganHadiah;
        rewardEl.className = 'pcs-reward-box ' + (hasil.menang === false || exploded ? 'pcs-bad' : 'pcs-good');
      } else {
        rewardEl.textContent = 'Menunggu juru tulis Rayan Bazzy…';
        rewardEl.className = 'pcs-reward-box';
      }

      q('result-overlay').classList.add('pcs-show');
    }

    function renderShipyardCanvas(nowSec) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = shipyardCanvas.getBoundingClientRect();
      const W = Math.max(260, Math.round(rect.width));
      const H = Math.max(200, Math.round(rect.height));
      if (shipyardCanvas.width !== Math.round(W * dpr) || shipyardCanvas.height !== Math.round(H * dpr)) {
        shipyardCanvas.width = Math.round(W * dpr);
        shipyardCanvas.height = Math.round(H * dpr);
      }
      const g = shipyardCanvas.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);

      const bg = g.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#120c1c');
      bg.addColorStop(0.58, '#4a212e');
      bg.addColorStop(0.61, '#1a2c47');
      bg.addColorStop(1, '#09111e');
      g.fillStyle = bg;
      g.fillRect(0, 0, W, H);

      const ship = CONFIG.KELAS_KAPAL[ui.previewShipId] || CONFIG.KELAS_KAPAL.sekoci_standar;
      const boatScale = Math.min(2.05, (W - 40) / 145);
      const isActive = ship.id === hostState.kelasAktif;
      drawNusantaraBoat(g, {
        x: W * 0.50 + 54 * boatScale,
        y: H * 0.57,
        scale: boatScale,
        ship,
        parts: isActive ? hostState.partTerpasang : [],
        speedKnot: 0,
        rpmRatio: CONFIG.START.RPM_IDLE_PRA_START_PERMIL / 1000,
        captainName: isActive ? hostState.namaKapten : '',
        isPlayer: isActive,
        nowSec,
        reducedMotion: isReducedMotion()
      });
    }

    function renderDrydockCanvas(nowSec) {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = drydockCanvas.getBoundingClientRect();
      const W = Math.max(260, Math.round(rect.width));
      const H = Math.max(200, Math.round(rect.height));
      if (drydockCanvas.width !== Math.round(W * dpr) || drydockCanvas.height !== Math.round(H * dpr)) {
        drydockCanvas.width = Math.round(W * dpr);
        drydockCanvas.height = Math.round(H * dpr);
      }
      const g = drydockCanvas.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);

      g.fillStyle = '#120b07';
      g.fillRect(0, 0, W, H);

      g.strokeStyle = 'rgba(211, 163, 66, 0.12)';
      g.lineWidth = 1;
      for (let gx = 0; gx < W; gx += 22) {
        g.beginPath();
        g.moveTo(gx, 0);
        g.lineTo(gx, H);
        g.stroke();
      }
      for (let gy = 0; gy < H; gy += 22) {
        g.beginPath();
        g.moveTo(0, gy);
        g.lineTo(W, gy);
        g.stroke();
      }

      const spec = spesifikasi(hostState.kelasAktif, hostState.partTerpasang, hostState.rasioPreset);
      const ship = CONFIG.KELAS_KAPAL[hostState.kelasAktif] || CONFIG.KELAS_KAPAL.sekoci_standar;
      if (ui.revTesting && !hostState.mesinJebol) {
        ui.revRpmRatio = Math.min(1, ui.revRpmRatio + 0.024);
      } else {
        ui.revRpmRatio = Math.max(CONFIG.START.RPM_IDLE_PRA_START_PERMIL / 1000, ui.revRpmRatio - 0.03);
      }

      if (ui.tab === 'bengkel') {
        audio.updateEngine(ui.revTesting && !hostState.mesinJebol, ui.revRpmRatio, 1, 0, ui.revRpmRatio > 0.9, false, nowSec);
      }

      const fullScale = Math.min(2.05, (W - 40) / 145);
      const zoomScale = Math.min(3.05, (W - 34) / 96);
      const boatX = ui.zoomEngine ? (W * 0.50 + 72 * zoomScale) : (W * 0.50 + 54 * fullScale);
      const boatY = ui.zoomEngine ? H * 0.63 : H * 0.56;
      const activeScale = ui.zoomEngine ? zoomScale : fullScale;

      drawNusantaraBoat(g, {
        x: boatX,
        y: boatY,
        scale: activeScale,
        ship,
        parts: spec.partIds,
        previewPartId: ui.hoveredPartId,
        speedKnot: 0,
        rpmRatio: hostState.mesinJebol ? 0 : ui.revRpmRatio,
        isBoost: !hostState.mesinJebol && ui.revTesting && ui.revRpmRatio > 0.88,
        isBlown: hostState.mesinJebol,
        captainName: !ui.zoomEngine ? hostState.namaKapten : '',
        isPlayer: true,
        nowSec,
        showCallout: true,
        reducedMotion: isReducedMotion()
      });

      g.fillStyle = 'rgba(23, 14, 9, 0.92)';
      g.strokeStyle = hostState.mesinJebol ? '#cf4b33' : (ui.revTesting ? '#f0cf78' : '#8f6522');
      g.lineWidth = 1.2;
      roundRect(g, 10, 10, 184, 34, 8);
      g.fill();
      g.stroke();

      g.fillStyle = hostState.mesinJebol ? '#ff9a85' : '#fbeabb';
      g.font = '700 10.5px system-ui, sans-serif';
      g.textAlign = 'left';
      g.fillText(
        hostState.mesinJebol ? 'STATUS: MESIN JEBOL' : ('RPM: ' + Math.round(ui.revRpmRatio * spec.maxRpm) + ' / ' + spec.maxRpm),
        18,
        24
      );
      g.fillStyle = hostState.mesinJebol ? '#f4a48a' : (ui.revTesting ? '#b7e6a6' : 'rgba(244, 231, 200, 0.72)');
      g.font = '500 11px system-ui, sans-serif';
      g.fillText(
        hostState.mesinJebol ? 'Perbaiki mesin di bengkel' : (ui.revTesting ? 'Mesin trek-trek digeber!' : 'Siaga di dok kering'),
        18,
        37
      );
    }

    /* =======================================================================
     * 11. RENDER ANTARMUKA PANEL DARI STATE GAME INDUK
     * ======================================================================= */
    function renderToast() {
      const toastEl = q('toast');
      if (!toastEl) return;
      if (hostState.pesan && hostState.pesan.teks) {
        const msgId = hostState.pesan.id != null ? hostState.pesan.id : hostState.pesan.teks;
        if (ui.lastToastId !== msgId) {
          ui.lastToastId = msgId;
          ui.toastText = String(hostState.pesan.teks);
          ui.toastType = String(hostState.pesan.jenis || 'info');
          ui.toastUntilMs = performance.now() + 4200;
        }
      }
      const show = ui.toastText && performance.now() < ui.toastUntilMs;
      toastEl.textContent = ui.toastText;
      toastEl.className = 'pcs-toast' + (show ? (' pcs-show pcs-' + ui.toastType) : '');
    }

    function renderAll() {
      const kapalAktif = CONFIG.KELAS_KAPAL[hostState.kelasAktif] || CONFIG.KELAS_KAPAL.sekoci_standar;

      renderToast();

      q('hdr-captain').textContent = hostState.namaKapten;
      q('hdr-gold').textContent = fmtAngka(hostState.gold);
      q('hdr-medali').textContent = fmtAngka(hostState.medaliJumlah) + ' 🏅';
      const shipChip = q('hdr-ship-chip');
      shipChip.classList.toggle('pcs-blown', hostState.mesinJebol);
      q('hdr-ship').textContent = hostState.mesinJebol ? (kapalAktif.nama + ' · ⚠️ JEBOL') : kapalAktif.nama;
      q('btn-mute').textContent = audio.isEnabled() ? '🔊 Suara' : '🔇 Bisu';

      el.querySelectorAll('[data-pcs-tab]').forEach(btn => {
        btn.classList.toggle('pcs-on', btn.getAttribute('data-pcs-tab') === ui.tab);
      });
      el.querySelectorAll('[data-pcs-pane]').forEach(pane => {
        pane.classList.toggle('pcs-on', pane.getAttribute('data-pcs-pane') === ui.tab);
      });

      renderArenaTab();
      renderGalanganTab();
      renderBengkelTab();
      renderRekorTab();
    }

    function renderArenaTab() {
      const hubEl = q('arena-hub');
      const aduLobbyEl = q('arena-adu-lobby');
      const raceEl = q('arena-race');

      hubEl.style.display = ui.arenaSubView === 'hub' ? 'block' : 'none';
      aduLobbyEl.style.display = ui.arenaSubView === 'adu_lobby' ? 'block' : 'none';
      raceEl.style.display = ui.arenaSubView === 'race' ? 'flex' : 'none';

      const kapalAktif = CONFIG.KELAS_KAPAL[hostState.kelasAktif] || CONFIG.KELAS_KAPAL.sekoci_standar;
      q('hub-class-pill').textContent = 'Kapal: ' + kapalAktif.nama;

      const blownEl = q('hub-blown-banner');
      if (hostState.mesinJebol) {
        blownEl.innerHTML = `
          <div class="pcs-blown-box">
            <div>
              <b style="color:#ff9a85">⚠️ MESIN KAPAL SEDANG JEBOL</b>
              <div style="font-size:12.5px;color:rgba(244,231,200,0.86)">Perbaiki mesin kapal sebelum memulai pacuan baru.</div>
            </div>
            <button type="button" class="pcs-btn pcs-sm" data-pcs-act="go-bengkel">⚙️ Ke Bengkel Mesin</button>
          </div>
        `;
        const btnGo = blownEl.querySelector('[data-pcs-act="go-bengkel"]');
        if (btnGo) btnGo.addEventListener('click', () => { ui.tab = 'bengkel'; renderAll(); });
      } else {
        blownEl.innerHTML = '';
      }

      const incomingCount = (hostState.adu && hostState.adu.undanganMasuk) ? hostState.adu.undanganMasuk.length : 0;
      const modes = [
        {
          id: 'uji_800',
          title: '⏱️ Uji Lintasan (800m)',
          badge: hostState.infoMode.uji_800 || 'Lintasan Standar 800m',
          desc: 'Pacu waktu solo atau melawan bayangan rekor pada lintasan Selat Lurus 800 meter.'
        },
        {
          id: 'uji_1400',
          title: '🌊 Uji Lintasan (1,4 km)',
          badge: hostState.infoMode.uji_1400 || 'Lintasan Panjang 1.400m',
          desc: 'Uji kecepatan puncak pada lintasan panjang 1,4 kilometer hingga gigi 5 penuh.'
        },
        {
          id: 'adu_kapten',
          title: '⚔️ Adu Kapten (2–4 Kapten)',
          badge: incomingCount > 0 ? (incomingCount + ' Tantangan Masuk!') : (hostState.infoMode.adu_kapten || 'Duel 1 Lawan 1'),
          desc: 'Ajak sampai tiga kapten lain di Dermaga Zentul. Semua berangkat dari obor yang sama, secara langsung.'
        },
        {
          id: 'pacu_gugur',
          title: '🏆 Pacu Gugur (400m)',
          badge: hostState.infoMode.pacu_gugur || 'Sprint Cepat 400m',
          desc: 'Adu akselerasi jarak pendek 400 meter dengan start kilat dan oper gigi presisi.'
        }
      ];

      const grid = q('hub-modes-grid');
      grid.innerHTML = modes.map(m => {
        const isSel = ui.selectedMode === m.id;
        return `
          <div class="pcs-mode-card ${isSel ? 'pcs-selected' : ''}" data-pcs-select-mode="${m.id}">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
                <h4 class="pcs-mode-title">${m.title}</h4>
                <span class="pcs-pill ${m.id === 'adu_kapten' && incomingCount > 0 ? 'pcs-good' : ''}">${m.badge}</span>
              </div>
              <p class="pcs-mode-desc">${m.desc}</p>
            </div>
            <button type="button" class="pcs-btn pcs-sm" data-pcs-start-mode="${m.id}" ${hostState.mesinJebol ? 'disabled' : ''}>
              ${m.id === 'adu_kapten' ? 'Buka Dermaga Adu →' : 'Mulai Pacuan →'}
            </button>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-pcs-select-mode]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          ui.selectedMode = card.getAttribute('data-pcs-select-mode');
          renderArenaTab();
        });
      });

      grid.querySelectorAll('[data-pcs-start-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          const modeId = btn.getAttribute('data-pcs-start-mode');
          ui.selectedMode = modeId;
          if (modeId === 'adu_kapten') {
            ui.arenaSubView = 'adu_lobby';
            renderArenaTab();
          }
          if (typeof callbacks.onStart === 'function') {
            callbacks.onStart({ mode: modeId, kelas: hostState.kelasAktif });
          }
        });
      });

      // Render Lobi Adu Kapten (bila state.adu tersedia)
      if (hostState.adu) {
        const adu = hostState.adu;
        const elapsedAduSec = Math.floor((performance.now() - ui.aduSyncPerfMs) / 1000);
        q('adu-quota-pill').textContent = adu.sisaAduHariIni != null
          ? ('Sisa Adu Hari Ini: ' + adu.sisaAduHariIni)
          : 'Dermaga Aktif';

        const invBox = q('adu-invites-box');
        let invHtml = '';

        if (adu.undanganKeluar) {
          const sisaOut = Math.max(0, Number(adu.undanganKeluar.sisaDetik || 0) - elapsedAduSec);
          invHtml += `
            <div class="pcs-adu-invite">
              <div>
                <b style="color:var(--pcs-brass-100)">⏳ Menunggu jawaban ${adu.undanganKeluar.ke}…</b>

              </div>
              <span class="pcs-pill pcs-mono">Sisa ${sisaOut} dtk</span>
            </div>
          `;
        }

        if (Array.isArray(adu.undanganMasuk) && adu.undanganMasuk.length > 0) {
          invHtml += adu.undanganMasuk.map(inv => {
            const sisaIn = Math.max(0, Number(inv.sisaDetik || 0) - elapsedAduSec);
            const isBusy = hostState.sibuk.terima === inv.id;
            return `
              <div class="pcs-adu-invite">
                <div>
                  <b style="color:#fff1c4">⚔️ ${inv.dari} mengajakmu ke rombongan Adu${inv.jumlah ? ' (' + inv.jumlah + '/4)' : ''}!</b>
                  <div style="font-size:12px;color:rgba(244,231,200,0.85)">Sisa waktu respons: <span class="pcs-mono">${sisaIn} dtk</span></div>
                </div>
                <div style="display:flex;gap:6px">
                  <button type="button" class="pcs-btn pcs-sm" data-pcs-terima="${inv.id}" ${isBusy ? 'disabled' : ''}>
                    ${isBusy ? 'Memproses…' : '✓ Terima'}
                  </button>
                  <button type="button" class="pcs-btn pcs-ghost pcs-sm" data-pcs-tolak="${inv.id}" ${isBusy ? 'disabled' : ''}>
                    ✕ Tolak

                </div>
              </div>
            `;
          }).join('');
