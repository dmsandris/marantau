        // Rombongan Adu (2–4 kapten, start serentak)
        const rb = adu.rombongan;
        if (rb && Array.isArray(rb.anggota)) {
          const maks = Number(rb.maks || 4);
          const ikut = rb.anggota.filter(a => a.status === 'ikut').length;
          const busyMulai = hostState.sibuk.mulai === rb.id;
          invHtml += `
            <div class="pcs-adu-invite" style="flex-direction:column;align-items:stretch">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                <b style="color:#fff1c4">⚑ Rombongan ${rb.tuan ? 'Milikmu' : ('Kapten ' + (rb.namaTuan || ''))}</b>
                <span class="pcs-pill pcs-mono">${ikut}/${maks} kapten${rb.taruhan ? ' · taruhan ' + fmtAngka(rb.taruhan) + ' Gold' : ''}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">
                ${rb.anggota.map(a => `<span class="pcs-pill ${a.status === 'ikut' ? 'pcs-good' : ''}">${a.status === 'ikut' ? '⚓' : '⏳'} ${a.nama}</span>`).join('')}
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
                ${rb.tuan
                  ? `<button type="button" class="pcs-btn pcs-sm" data-pcs-mulai-rb="${rb.id}" ${(!rb.bisaMulai || busyMulai) ? 'disabled' : ''}>${busyMulai ? 'Memproses…' : ('⚑ Mulai Pacuan (' + ikut + '/' + maks + ')')}</button>`
                  : '<span style="font-size:12px;color:rgba(244,231,200,0.8);align-self:center">Menunggu tuan rombongan memasang obor…</span>'}
                <button type="button" class="pcs-btn pcs-ghost pcs-sm" data-pcs-keluar-rb="${rb.id}">${rb.tuan ? 'Bubarkan' : 'Keluar'}</button>
              </div>
            </div>
          `;
        }

        invBox.innerHTML = invHtml;
        invBox.querySelectorAll('[data-pcs-mulai-rb]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (typeof callbacks.onMulaiRombongan === 'function') callbacks.onMulaiRombongan(btn.getAttribute('data-pcs-mulai-rb'));
          });
        });
        invBox.querySelectorAll('[data-pcs-keluar-rb]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (typeof callbacks.onKeluarRombongan === 'function') callbacks.onKeluarRombongan(btn.getAttribute('data-pcs-keluar-rb'));
          });
        });
        invBox.querySelectorAll('[data-pcs-terima]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-pcs-terima');
            if (typeof callbacks.onTerima === 'function') callbacks.onTerima(id);
          });
        });
        invBox.querySelectorAll('[data-pcs-tolak]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-pcs-tolak');
            if (typeof callbacks.onTolak === 'function') callbacks.onTolak(id);
          });
        });

        const capGrid = q('adu-captains-grid');
        if (!adu.kaptenDiZentul || adu.kaptenDiZentul.length === 0) {
          capGrid.innerHTML = '<div style="font-size:13px;color:rgba(244,231,200,0.7);padding:8px 0">Belum ada kapten lain yang bersandar di Dermaga Zentul saat ini.</div>';
        } else {
          capGrid.innerHTML = adu.kaptenDiZentul.map(cap => {
            const kInfo = CONFIG.KELAS_KAPAL[cap.kelas] || { nama: cap.kelas || 'Perahu Jalur' };
            const isBusy = hostState.sibuk.tantang === cap.id;
            const rbPenuh = adu.rombongan && Array.isArray(adu.rombongan.anggota) &&
              adu.rombongan.anggota.length >= Number(adu.rombongan.maks || 4);
            const bukanTuan = adu.rombongan && !adu.rombongan.tuan;
            const disabled = !cap.bisaDitantang || isBusy || hostState.mesinJebol || rbPenuh || bukanTuan;
            return `
              <div class="pcs-adu-item">
                <div>
                  <b style="font-family:var(--pcs-font-display);color:var(--pcs-brass-100)">⚓ ${cap.nama}</b>
                  <div style="font-size:12px;color:rgba(244,231,200,0.78)">${kInfo.nama}</div>
                </div>
                <button type="button" class="pcs-btn pcs-sm" data-pcs-tantang="${cap.id}" ${disabled ? 'disabled' : ''}>
                  ${isBusy ? 'Memproses…' : (!cap.bisaDitantang ? (cap.alasan || 'Sedang Lomba') : (adu.rombongan ? '➕ Ajak' : '⚔️ Tantang'))}
                </button>
              </div>
            `;
          }).join('');

          capGrid.querySelectorAll('[data-pcs-tantang]').forEach(btn => {
            btn.addEventListener('click', () => {
              const kaptenId = btn.getAttribute('data-pcs-tantang');
              if (typeof callbacks.onTantang === 'function') callbacks.onTantang(kaptenId);
            });
          });
        }
      }

      // Race Top Bar (termasuk babak dinamis Pacu Gugur dari babak / totalBabak)
      const topBar = q('race-top-bar');
      const b = hostState.balapan;
      const judulLomba = (b && b.judul) || 'Pacu Selat Lurus';
      const babakBadge = (b && b.babak != null && b.totalBabak != null)
        ? `<span class="pcs-pill">Babak ${b.babak}/${b.totalBabak}</span>`
        : '';
      topBar.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button type="button" class="pcs-mini-btn" data-pcs-act="back-hub">← Pilih Mode</button>
          <b style="font-family:var(--pcs-font-display);font-size:14.5px;color:var(--pcs-brass-100)">${judulLomba}</b>
          ${babakBadge}
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="pcs-pill">Rasio ${live.rasioPreset}m</span>
          <span class="pcs-pill pcs-sea">Seed: ${live.seed}</span>
        </div>
      `;
      const btnBackHub = topBar.querySelector('[data-pcs-act="back-hub"]');
      if (btnBackHub) {
        btnBackHub.addEventListener('click', () => {
          if (live.raceId && !live.isReplay && !live.finishNotified &&
              typeof callbacks.onKeluarBalapan === 'function') {
            callbacks.onKeluarBalapan({ balapanId: live.raceId, log: live.log.slice() });
          }
          live.raceId = null;
          live.antre.length = 0;
          ui.arenaSubView = 'hub';
          audio.updateEngine(false, 0, 1, 0, false, false, 0);
          q('result-overlay').classList.remove('pcs-show');
          renderArenaTab();
        });
      }
    }

    function renderGalanganTab() {
      const prevShip = CONFIG.KELAS_KAPAL[ui.previewShipId] || CONFIG.KELAS_KAPAL.sekoci_standar;
      const accX = prevShip.pengaliAkselPermil / 1000;
      q('sy-title').textContent = prevShip.nama;
      q('sy-accel-pill').textContent = 'Akselerasi ' + accX.toFixed(2).replace('.', ',') + '×';
      q('sy-desc').textContent = prevShip.deskripsi;
      q('sy-stat-acc').textContent = accX.toFixed(2).replace('.', ',') + '×';
      q('sy-stat-top').textContent = prevShip.topSpeedDasarKnot + ' knot (' + knotToKmh(prevShip.topSpeedDasarKnot) + ' km/h)';
      q('sy-stat-zone').textContent = prevShip.bonusZonaHijauPermil > 0 ? ('+' + prevShip.bonusZonaHijauPermil + '‰ Lebar') : 'Standar';

      const ownedPreview = hostState.kapalDimiliki.includes(prevShip.id);
      const activePreview = hostState.kelasAktif === prevShip.id;
      const hargaPreviewLabel = hostState.hargaKapal[prevShip.id] || (prevShip.id === 'sekoci_standar' ? 'Standar' : 'Tersedia di Galangan');
      q('sy-stat-status').textContent = activePreview ? 'Aktif Digunakan' : (ownedPreview ? 'Dimiliki' : hargaPreviewLabel);

      const listEl = q('shipyard-list');
      const semuaKapal = Object.values(CONFIG.KELAS_KAPAL);
      listEl.innerHTML = semuaKapal.map(s => {
        const owned = hostState.kapalDimiliki.includes(s.id);
        const active = hostState.kelasAktif === s.id;
        const isPrev = ui.previewShipId === s.id;
        const sAcc = s.pengaliAkselPermil / 1000;
        const pctAcc = Math.min(100, Math.max(8, Math.round(((sAcc - 0.9) / 0.5) * 100)));
        const pctTop = Math.min(100, Math.max(8, Math.round(((s.topSpeedDasarKnot - 105) / 40) * 100)));
        const labelHarga = hostState.hargaKapal[s.id] || 'Beli Kapal';
        const isBusy = hostState.sibuk.beli === s.id;
        const allowed = hostState.bolehBeli[s.id] !== false;
        const lockText = !owned && !allowed && hostState.alasanKunci[s.id] ? hostState.alasanKunci[s.id] : '';

        let actionHtml = '';
        if (active) {
          actionHtml = '<span class="pcs-pill pcs-good">✓ Sedang Dipakai</span>';
        } else if (owned) {
          actionHtml = `<button type="button" class="pcs-btn pcs-sm" data-pcs-buy-ship="${s.id}" ${isBusy ? 'disabled' : ''}>${isBusy ? 'Memproses…' : 'Pakai Kapal'}</button>`;
        } else {
          actionHtml = `<button type="button" class="pcs-btn pcs-sm" data-pcs-buy-ship="${s.id}" ${(isBusy || !allowed) ? 'disabled' : ''}>${isBusy ? 'Memproses…' : labelHarga}</button>`;
        }

        return `
          <div class="pcs-chip-card ${isPrev ? 'pcs-on' : ''}" data-pcs-preview-ship="${s.id}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
              <div>
                <b style="font-family:var(--pcs-font-display);font-size:14.5px;color:var(--pcs-brass-100)">${s.nama}</b>
                <div style="font-size:12.5px;color:rgba(244,231,200,0.8);margin-top:2px">
                  Akselerasi <b>${sAcc.toFixed(2).replace('.', ',')}×</b> · Top Speed <b>${s.topSpeedDasarKnot} knot</b> (${knotToKmh(s.topSpeedDasarKnot)} km/h)
                </div>
              </div>
              <div style="text-align:right">
                ${actionHtml}
                ${lockText ? `<div class="pcs-lock-reason">🔒 ${lockText}</div>` : ''}
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px">
              <div>
                <span class="pcs-meter-lbl">AKSELERASI</span>
                <div class="pcs-meter-track"><span class="pcs-meter-fill" style="width:${pctAcc}%"></span></div>
              </div>
              <div>
                <span class="pcs-meter-lbl">KECEPATAN PUNCAK</span>
                <div class="pcs-meter-track"><span class="pcs-meter-fill" style="width:${pctTop}%"></span></div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('[data-pcs-preview-ship]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          ui.previewShipId = card.getAttribute('data-pcs-preview-ship');
          renderGalanganTab();
        });
      });

      listEl.querySelectorAll('[data-pcs-buy-ship]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const itemId = btn.getAttribute('data-pcs-buy-ship');
          ui.previewShipId = itemId;
          if (typeof callbacks.onBuy === 'function') {
            callbacks.onBuy(itemId);
          }
        });
      });
    }

    function partAffectsStat(part, statKey) {
      if (!part || !part.efek) return false;
      const fx = part.efek;
      if (statKey === 'accel') return !!fx.accelPermil;
      if (statKey === 'knot') return !!(fx.knot || fx.mmPerSec);
      if (statKey === 'maxRpm') return !!(fx.maxRpm || fx.rpmRate);
      if (statKey === 'shiftLag') return !!fx.shiftLagPermil;
      if (statKey === 'antiBatuk') return !!(fx.antiBatukPermil || fx.sweetBonusPermil);
      if (statKey === 'boost') return !!(fx.boostPowerPermil || fx.boostDurMs);
      return false;
    }

    function renderBengkelStatsOnly() {
      const curSpec = spesifikasi(hostState.kelasAktif, hostState.partTerpasang, hostState.rasioPreset);
      const previewParts = (ui.hoveredPartId && !hostState.partTerpasang.includes(ui.hoveredPartId))
        ? hostState.partTerpasang.concat([ui.hoveredPartId])
        : hostState.partTerpasang;
      const prevSpec = spesifikasi(hostState.kelasAktif, previewParts, hostState.rasioPreset);

      const curAcc = curSpec.accelPermil / 1000;
      const prevAcc = prevSpec.accelPermil / 1000;
      const dAcc = Number((prevAcc - curAcc).toFixed(2));

      const curKnot = mmPerSecToKnot(curSpec.topMmPerSec);
      const prevKnot = mmPerSecToKnot(prevSpec.topMmPerSec);
      const dKnot = prevKnot - curKnot;

      const dRpm = prevSpec.maxRpm - curSpec.maxRpm;
      const dLag = prevSpec.shiftLagMs - curSpec.shiftLagMs;

      const curBatukPct = Math.round(curSpec.antiBatukPermil / 10);
      const prevBatukPct = Math.round(prevSpec.antiBatukPermil / 10);
      const dBatuk = prevBatukPct - curBatukPct;

      const curBoost = curSpec.boostPowerPermil / 1000;
      const prevBoost = prevSpec.boostPowerPermil / 1000;
      const dBoost = Number((prevBoost - curBoost).toFixed(2));

      const curShiftScore = Math.min(100, Math.max(15, Math.round(((260 - curSpec.shiftLagMs) / 220) * 100)));
      const prevShiftScore = Math.min(100, Math.max(curShiftScore, Math.round(((260 - prevSpec.shiftLagMs) / 220) * 100)));

      const bars = [
        {
          key: 'accel',
          label: 'Akselerasi',
          valHtml: `${curAcc.toFixed(2).replace('.', ',')}×${dAcc > 0 ? `<span class="pcs-ws-delta">+${dAcc.toFixed(2).replace('.', ',')}×</span>` : ''}`,
          curPct: Math.min(100, Math.max(8, ((curAcc - 0.9) / 0.75) * 100)),
          prevPct: Math.min(100, Math.max(8, ((prevAcc - 0.9) / 0.75) * 100)),
          boosted: dAcc > 0
        },
        {
          key: 'knot',
          label: 'Top Speed',
          valHtml: `${curKnot} kt (${knotToKmh(curKnot)})${dKnot > 0 ? `<span class="pcs-ws-delta">+${dKnot} kt</span>` : ''}`,
          curPct: Math.min(100, Math.max(10, ((curKnot - 105) / 70) * 100)),
          prevPct: Math.min(100, Math.max(10, ((prevKnot - 105) / 70) * 100)),
          boosted: dKnot > 0
        },
        {
          key: 'maxRpm',
          label: 'Batas Max RPM',
          valHtml: `${fmtAngka(curSpec.maxRpm)} RPM${dRpm > 0 ? `<span class="pcs-ws-delta">+${fmtAngka(dRpm)}</span>` : ''}`,
          curPct: Math.min(100, Math.max(18, ((curSpec.maxRpm - 7000) / 3500) * 100)),
          prevPct: Math.min(100, Math.max(18, ((prevSpec.maxRpm - 7000) / 3500) * 100)),
          boosted: dRpm > 0
        },
        {
          key: 'shiftLag',
          label: 'Respons Oper Gigi',
          valHtml: `${curSpec.shiftLagMs} ms${dLag < 0 ? `<span class="pcs-ws-delta">${dLag} ms</span>` : ''}`,
          curPct: curShiftScore,
          prevPct: prevShiftScore,
          boosted: dLag < 0
        },
        {
          key: 'antiBatuk',

    q('btn-semburan').addEventListener('pointerdown', (e) => {

        return;

      handlePlayerPress(1);

    // Bug #6: Spasi hanya ditangkap bila modal terpasang, tab Arena aktif, sedang balap, dan fokus bukan di elemen input
    const onKeyDown = (e) => {
      if (e.code !== 'Space' || !activeInstance) return;
      const ae = document.activeElement;
      if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable)) {
        return;

      if (q('result-overlay').classList.contains('pcs-show')) return;

      e.stopPropagation();
      if (!e.repeat) {
        audio.init();
        handlePlayerPress(1);
      }

        e.preventDefault();

    // Bug #7: Hentikan requestAnimationFrame saat document.hidden atau modal tersembunyi
    let rafId = 0;
    let lastTs = performance.now();
    let destroyed = false;

    function isContainerHidden() {
      return document.hidden || el.offsetParent === null;
    }

    function scheduleNextFrame() {
      if (destroyed || rafId !== 0 || isContainerHidden()) return;
      rafId = requestAnimationFrame(frameLoop);
    }

    function frameLoop(nowMs) {
      rafId = 0;
      if (destroyed || isContainerHidden()) return;

      const dtSec = Math.min(0.05, Math.max(0, (nowMs - lastTs) / 1000));
      lastTs = nowMs;
      const nowSec = nowMs / 1000;

      if (ui.toastText && nowMs >= ui.toastUntilMs) {
        ui.toastText = '';
        renderToast();
      }

      if (ui.tab === 'arena' && ui.arenaSubView === 'race' && live.raceId) {
        stepLiveSimulation(dtSec, nowMs);
        renderArenaCanvas(dtSec, nowMs);
      } else if (ui.tab === 'galangan') {
        renderShipyardCanvas(nowSec);
      } else if (ui.tab === 'bengkel') {
        renderDrydockCanvas(nowSec);
      }

      scheduleNextFrame();
    }

    function onVisibilityChange() {
      if (document.hidden) {
        if (rafId !== 0) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        audio.updateEngine(false, 0, 1, 0, false, false, 0);
      } else {
        lastTs = performance.now();
        scheduleNextFrame();
      }
    }
    document.addEventListener('visibilitychange', onVisibilityChange);

    // Hitung mundur visual 1 detik untuk undangan Adu Kapten
    const aduTimerId = window.setInterval(() => {
      if (destroyed || isContainerHidden()) return;
      if (ui.tab === 'arena' && ui.arenaSubView === 'adu_lobby' && hostState.adu) {
        renderArenaTab();
      }
    }, 1000);

    if (hostState.balapan) {
      initOrUpdateRace(hostState.balapan);
    }
    renderAll();
    scheduleNextFrame();

    activeInstance = {
      el,
      update(nextRawState) {
        hostState = normalizeState(nextRawState);
        ui.aduSyncPerfMs = performance.now();

        if (hostState.audioMati !== null) {
          audio.setEnabled(!hostState.audioMati);
        }
        if (!hostState.kapalDimiliki.includes(ui.previewShipId)) {
          ui.previewShipId = hostState.kelasAktif;
        }
        if (hostState.balapan) {
          initOrUpdateRace(hostState.balapan);
        }
        if (hostState.hasil && live.finishedOverlayShown) {
          renderResultOverlay();
        }
        renderAll();
        scheduleNextFrame();
      },
      telemetriPemain() {
        const pm = getPemainBoat();
        if (!live.raceId || !pm) return null;
        return { balapanId: live.raceId, posMm: pm.posMm, speedMmPerSec: pm.speedMmPerSec, gear: pm.gear, rpmPermil: pm.rpmPermil, launched: pm.launched,
          tms: getCurrentRelTms(), fase: live.fase, finish: pm.finishWaktuMs, jebol: pm.exploded };
      },
      posisiLawan(id, posMm, speed, gear, tms) {
        const key = String(id);
        live.liveOpponents[key] = {
          posMm: Math.trunc(Number(posMm) || 0),
          speedMmPerSec: Math.trunc(Number(speed) || 0),
          gear: Math.trunc(Number(gear) || 1),
          tms: Math.trunc(Number(tms) || 0),
          lastUpdatePerfMs: performance.now()
        };
      },
      destroy() {
        destroyed = true;
        if (rafId !== 0) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        window.clearInterval(aduTimerId);
        document.removeEventListener('visibilitychange', onVisibilityChange);
        window.removeEventListener('pointerup', onPointerUpGlobal);
        window.removeEventListener('keydown', onKeyDown, true);
        window.removeEventListener('keyup', onKeyUp, true);
        audio.destroy();
        el.innerHTML = '';
        el.classList.remove('pcs-root');
        releaseStyle();
        activeInstance = null;
      }
    };

    return activeInstance;
  }

  function update(state) {
    if (activeInstance) {
      activeInstance.update(state);
    }
  }

  function destroy() {
    if (activeInstance) {
      activeInstance.destroy();
    }
  }

  function telemetriPemain() {
    return activeInstance ? activeInstance.telemetriPemain() : null;
  }

  function posisiLawan(id, posMm, speed, gear, tms) {
    if (activeInstance) {
      activeInstance.posisiLawan(id, posMm, speed, gear, tms);
    }
  }

  /* =========================================================================
   * 13. EKSPOS API TUNGGAL KE GLOBAL: window.PacuSelat
   * ========================================================================= */
  window.PacuSelat = Object.freeze({
    mount,
    update,
    destroy,
    posisiLawan,
    telemetriPemain,
    sim: SIM_API
  });
})();
</script>
