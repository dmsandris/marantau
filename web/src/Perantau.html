  .pr-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0 4px; }
  .pr-journal { padding: 12px 14px; border-radius: 12px; background: linear-gradient(180deg, #fbf3df, #f1e2c0); border: 1px dashed rgba(140,100,40,.5); color: #3b2a16; line-height: 1.5; margin: 0 0 12px; }

  /* ---------- sinematik pembuka ---------- */

  .pr-cine .ct i { color: #ffe7a3; }

  .pr-cine .skip.on { opacity: 1; }

  /* ---------- Kabar Pelabuhan (koran & surat) ---------- */
  .pr-news { position: fixed; inset: 0; z-index: 310; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at 50% 30%, rgba(10,14,20,.7), rgba(3,5,8,.92)); opacity: 0; transition: opacity .45s ease; overflow-y: auto; }

<script>
/* =====================================================================
 * Tide v44 - JEJAK PERANTAU (onboarding pemain baru)
 * Konsep: claude/KONSEP-Onboarding-Pemain-Baru.md (v2)
 * Server: 0060_perantau.sql  (state 'perantau' di getGameState,
 *         api_perantau(aksi, arg), api_perantauSuggest, api_captainNameFree)
 *
 *  1. Buat Kapten dipecah 3 langkah: Nama -> Jalan Hidup -> Rupa (semua pemain baru).
 *  2. Sinematik pembuka + Hari Pertama bersama Syahbandar Sunda (7 langkah berpandu).
 *  3. Catatan Perantau: 12 tugas sejalan dengan Tanda Jasa; hadiah dicicil, total 70.000.
 *  4. Tanda Jasa diperkenalkan: kartu TJ pertama, penghitung di HUD, panel Character.
 *  5. Gosip bertingkat (10 / 15 TJ) dan Kabar Pelabuhan saat 20 TJ.
 *     Semua petunjuk sengaja berupa kiasan: tidak menyebut nama tokoh atau nama kota tujuan.
 * Hanya aktif bila state.perantau tidak null (karakter dibuat setelah fitur ini rilis).
 * ===================================================================== */
var PR = (function () {
  /* ---------------- data ---------------- */
  var STEPS = {
    s1: { n: 'Bicara dengan Syahbandar', d: 'Perkenalan di dermaga Sunda.' },
    s2: { n: 'Buka Pasar', d: 'Lihat harga barang di pelabuhan.' },
    s3: { n: 'Beli barang pertama', d: 'Barang produksi pulau ini murah di sini.' },
    s4: { n: 'Buka peta pelayaran', d: 'Pilih pelabuhan yang membutuhkan barangmu.' },
    s5: { n: 'Angkat sauh', d: 'Berlayar ke pelabuhan tujuan.' },
    s6: { n: 'Jual di pelabuhan lain', d: 'Beli murah, jual mahal.' },
    s7: { n: 'Ambil misi gubernur', d: 'Papan misi ada di menu Tasks.' }
  };
  var TASKS = {
    lapau_5: { n: 'Mampir ke Lapau 5 kali', d: 'Gosip lapau sering berisi petunjuk.', go: 'tavern' },
    talk_10: { n: 'Ngobrol dengan 10 warga', d: 'Ketuk warga yang berjalan di dermaga.', go: null },
    chat_1: { n: 'Sapa kapten lain di obrolan', d: 'Tombol obrolan ada di kanan atas layar.', go: null },
    repair_1: { n: 'Reparasi kapal di galangan', d: 'Kondisi kapal turun setiap berlayar dan bertempur.', go: 'ship' },
    book_1: { n: 'Beli 1 buku di Library', d: 'Buku menambah kemampuan kapten dan kapal.', go: 'library' },
    full_hold: { n: 'Berlayar dengan palka penuh', d: 'Isi semua ruang palka sebelum angkat sauh.', go: 'market' },
    night_sail: { n: 'Angkat sauh saat malam', d: 'Ikan dan orang tertentu hanya muncul malam hari.', go: 'setsail' },
    fish_10: { n: 'Pancing 10 ikan', d: 'Menu Mancing (tombol F) saat merapat.', go: 'fishing' },
    mission_1: { n: 'Selesaikan 1 misi gubernur', d: 'Antar titipan atau pesanan sampai tuntas.', go: 'tasks' },
    upgrade_1: { n: 'Upgrade kapal 1 kali', d: 'Galangan di menu Ship.', go: 'ship' },
    first_battle: { n: 'Selesaikan 1 pertempuran', d: 'Mundur pun dihitung. Keselamatan lebih dulu.', go: null },
    gold_10k: { n: 'Pegang 10.000 gold sekaligus', d: 'Terus berdagang antar pulau.', go: null }
  };
  // Kiasan saja (aturan Marantau): tidak ada nama tokoh/kota tujuan di teks ini.
  var GOSSIP10 = 'Di kota yang rendangnya paling enak, ada pemilik galangan yang gemar mengumpulkan cerita kapten-kapten bertanda jasa.';
  var GOSSIP15 = [
    'Tukang cuci kapal di galangan bercahaya neon itu katanya sedang mencari kapten yang bisa dipercaya. Tapi ia hanya mau bicara dengan yang tanda jasanya sudah cukup.',
    'Seorang lelaki yang menyebut dirinya "ambo" sering menatap laut dari galangannya. Kata orang, ia menunggu kapten yang tepat.'
  ];
  var GOSSIP20 = [
    'Tukang cuci kapal itu menanyakan kapten bertanda jasa banyak. Bukankah itu Tuan?',
    'Lampu neon galangan di kota rendang itu dinyalakan sampai pagi. Pemiliknya menunggu seseorang.'
  ];
  var JOURNAL20 = 'Seorang lelaki yang menyebut dirinya <i>"ambo"</i> menunggumu di galangan bercahaya neon, di kota yang rendangnya paling enak.';

  /* ---------------- util ---------------- */
  function st() { return (state && state.perantau) || null; }
  function cid() { return state && state.city ? state.city.CityId : ''; }
  function docked() { return !(state && state.voyage && state.voyage.inTransit); }
  function meta() { try { return metaGet_(); } catch (e) { return { u: {}, c: {}, v: [] }; } }
  function cnt(k) { return (meta().c || {})[k] || 0; }
  function badges() { return Object.keys(meta().u || {}).length; }

      '<path d="M0 86 C60 82 120 90 180 86 S300 82 400 88"/><path d="M0 96 C80 92 140 100 220 95 S340 92 400 98" opacity=".5"/>' +
      '<path d="M120 86 L120 52 L230 52 L230 86"/><path d="M110 54 Q118 40 104 22 Q140 40 175 34 Q210 40 246 22 Q232 40 240 54 Z"/>' +
      '<path d="M140 86 L140 66 L160 66 L160 86 M190 86 L190 66 L210 66 L210 86"/>' +
      '<path d="M128 46 L222 46" stroke-dasharray="3 4"/><text x="175" y="47" font-family="Georgia,serif" font-size="9" fill="#3b2a16" stroke="none" text-anchor="middle">&#9679; &#9679; &#9679;</text>' +
      '<path d="M262 80 Q275 64 300 74 L330 74 Q338 80 330 86 L270 86 Z"/><path d="M300 74 L300 40 L322 70"/>' +
      '<path d="M40 30 q6 -5 12 0 q6 -5 12 0 M330 22 q5 -4 10 0 q5 -4 10 0"/></g></svg>';
  }
  function newsShow(fresh) {
    if (document.querySelector('.pr-news')) return;
    var day = st() ? st().newsDay : '';
    var ov = document.createElement('div'); ov.className = 'pr-news';
    var paper = '<div class="pr-paper"><div class="mast"><b>Kabar Pelabuhan</b><small><span>Mare Nusantara</span><span>Hari ' + esc_(day) + '</span><span>Satu keping</span></small></div>' +
      '<h2>Galangan termasyhur di kota rendang tutup setengah hari</h2><div class="ill">' + paperArt() + '</div>' +
      '<div class="art"><p>Pemilik galangan bercahaya neon itu terlihat murung sejak pagi. Warga melihatnya menatap laut lama sekali, sampai sabun cucian kapal mengering di ember.</p>' +
      '<p>Lelaki yang terkenal paling pandai bercerita di seluruh pelabuhan itu kali ini hampir tak bicara. Ia hanya berkata, <i>"Ambo menunggu kapten yang tanda jasanya sudah cukup."</i></p>' +
      '<p>Para pelaut menduga ada sesuatu yang lama ia simpan. Siapa kapten yang ditunggunya, belum ada yang tahu.</p></div>' +
      '<div class="acts"><button class="btn btn-gold" data-n="letter">' + ic('scroll') + '&nbsp; Ada surat untukmu</button></div></div>';
    var letter = '<div class="pr-letter"><p>Kapten,</p><p>nama Kapten sudah sering ambo dengar di lapau-lapau. Kata orang, tanda jasa Kapten sudah banyak.</p>' +
      '<p>Kalau sempat, singgahlah ke galangan ambo &mdash; yang lampunya paling terang di kota yang rendangnya paling enak. Ada yang ingin ambo ceritakan. Empat mata saja.</p>' +
      '<div class="sig">&mdash; G.</div><div class="seal"></div></div>' +
      '<div class="acts"><button class="btn btn-gold" data-n="close">' + ic('compass') + '&nbsp; Simpan di catatan</button></div>';
    ov.innerHTML = paper;
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add('on'); });
    try { au_(fresh ? 'unfurl' : 'page'); } catch (e) { }
    ov.addEventListener('click', function (e) {
      var b = e.target.closest('[data-n]'); if (!b) return;
      var k = b.getAttribute('data-n');
      if (k === 'letter') {
        ov.classList.remove('on');
        setTimeout(function () { ov.innerHTML = '<div class="pr-lwrap">' + letter + '</div>'; requestAnimationFrame(function () { ov.classList.add('on'); }); try { au_('page'); } catch (e2) { } }, 300);
      } else if (k === 'close') {
        ov.classList.remove('on'); setTimeout(function () { ov.remove(); coach(); }, 450);
        if (fresh) showToast('Catatan baru di Catatan Perantau dan Tasks.', 'info');
        gates();
      }
    });
  }
  function remindCheck() {
    var s = st(); if (!s || !s.news || s.remind || !hintsOn() || cid() !== 'sunda_empire' || !docked()) return;
    if ((s.gameDay || 0) < (s.newsDay || 0) + 3 || busy() || modalOpen()) return;
    call(['remind'], function () {
      showModal(panelHeader_('anchor', 'Pesan Syahbandar', 'Port of Sunda') +
        card('<p>Rendang dan neon, Tuan Kapten. Jangan biarkan orang itu menunggu terlalu lama.</p><p class="muted small">Catatan lengkapnya ada di Catatan Perantau.</p>',
          '<button class="btn btn-gold" data-x="ok">Baik, Syahbandar</button>'),
        function (c) { c.querySelector('[data-x=ok]').onclick = function () { closeModal(); }; });
    }, function () { });
  }

  /* =====================================================================
   * kaitan umum
   * ===================================================================== */
  wrap_('checkAch_', function () { try { gates(); if (!st()) return; firstTj(); newsCheck(); if (currentPanel === 'perantau') render(); } catch (e) { console.warn('[PR]', e); } });
  wrap_('applyFreshState_', function () {
    try {
      gates(); CO.cur = null;
      var s = st(); if (!s) { coach(); return; }
      if (!s.intro && !s.skipped) {
        var tries = 0;
        setTimeout(function later() {
          var s2 = st(); if (!s2 || s2.intro) return;
          if (busy() || modalOpen()) { if (tries++ < 60) setTimeout(later, 1500); return; }
          playIntro();
        }, 1600);
      } else coach();
      if (s.news === false) setTimeout(newsCheck, 4000);
      setTimeout(remindCheck, 3500);
      setTimeout(firstTj, 5000);
      if (currentPanel === 'perantau') render();
    } catch (e) { console.warn('[PR]', e); }
  });

  return { st: st, render: render, coach: coach, news: newsShow, syah: syah };
})();
</script>
