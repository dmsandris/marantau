<script>
/* =====================================================================
 * ArenaMahkota.html — Duel Armada Teluk Dalam (Saga 4 Bagian II, langkah 60, Tide v83)
 *   Realtime, tanpa batas waktu, last man standing: kapal pemain + Black Pearl (zafachmie) + Armada Skitraw
 *   (Hasiolan) + Ratu Marlya (Lempeng Segel) melawan Sovereign Mahkota (Kumis Hitam) + 3 kapal Navy.
 *   Angka (HP, damage) dari server (api_mahkota 'arena'); hasil dilaporkan lewat 'arenaHasil'
 *   (server memagari waktu minimum & id duel). Fisika layar memakai rumus Serbuan Bersama.
 *   Kalah = kapal pemain jebol. Sekutu yang lambungnya habis mundur dari barisan (tidak tenggelam).
 *   MTARENA.open(cfg, done(hasil)) · close() · isOpen() · _sim (inti tanpa DOM, dipakai tes keseimbangan)
 * ===================================================================== */
(function () {
  'use strict';
  var TAU = Math.PI * 2, AW = 3400, AH = 2300, RANGE = 600, ARC = 0.95;
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function ang(a) { return a - TAU * Math.floor((a + Math.PI) / TAU); }
  function bearing(a, b) { return Math.atan2(b.x - a.x, -(b.y - a.y)); }
  function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
  function rng(seed) { var a = (seed >>> 0) || 1; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ================= INTI SIMULASI (tanpa DOM) ================= */
  function wf(h, w) { var a = Math.abs(ang(h - (w + Math.PI))); if (a < 0.62) return 0.12 + a * 0.12; if (a < 1.75) return 0.25 + 0.75 * Math.sin((a - 0.62) / (1.75 - 0.62) * Math.PI / 2); return 1.0 - (a - 1.75) / (Math.PI - 1.75) * 0.22; }
  function arcQ(f, t, side) { var rel = ang(bearing(f, t) - f.h), off = Math.abs(ang(rel - side * Math.PI / 2)); return off > ARC ? 0 : 1 - off / ARC * 0.5; }

  var LOOK = {
    me: { hull: '#7a4a26', deck: '#c49a62', sail: '#f2e6c9', flag: '#d9a84e' },
    pearl: { hull: '#16161a', deck: '#3a3036', sail: '#2a2830', flag: '#0c0c0c' },
    skitraw: { hull: '#6a2a1c', deck: '#b8875a', sail: '#f2e2c4', flag: '#b02a20' },
    marlya: { hull: '#4a2a5a', deck: '#9a7aa8', sail: '#ece0f4', flag: '#8a5ac0' },
    navy: { hull: '#1c2438', deck: '#56627a', sail: '#34476e', flag: '#14203a' },
    sov: { hull: '#141018', deck: '#3a3026', sail: '#1e1a26', flag: '#e0b84a', gold: true }
  };

  function makeSim(cfg, seed) {
    cfg = cfg || {};
    var R = rng(seed || 1), dm = cfg.dmgMusuh || 1;
    var W = { w: R() * TAU, t: 0, ships: [], balls: [], ev: [], phase: 1, shield: true, pengacau: 0, over: null, stats: { tembak: 0, kena: 0, tenggelam: 0 } };
    function add(o) {
      var s = { id: o.id, team: o.team, name: o.name, x: o.x, y: o.y, h: o.h, v: 30, hp: o.hp, max: o.hp, dmg: o.dmg, rl: o.rl, cd: [0.8 + R(), 0.8 + R()],
        sp: o.sp || 1, tm: o.tm || 1, size: o.size || 1, look: o.look, me: !!o.me, ai: !o.me, alive: true, out: 0, flash: 0, def: 1, rud: 0, sails: 1,
        pref: o.pref || null, keep: o.keep || 380, wake: [] };
      W.ships.push(s); return s;
    }
    var y0 = AH / 2;
    add({ id: 'me', team: 0, name: 'Kapalmu', me: true, x: 520, y: y0, h: Math.PI / 2, hp: cfg.hpKu || 2000, dmg: cfg.dmgKu || 64, rl: 2.6, look: LOOK.me, sp: 1.08 });
    add({ id: 'pearl', team: 0, name: 'Black Pearl', x: 420, y: y0 - 300, h: Math.PI / 2, hp: (cfg.hpSekutu || 1700) * 1.15, dmg: 60, rl: 3.3, look: LOOK.pearl, sp: 1.1, keep: 340 });
    add({ id: 'skitraw', team: 0, name: 'Armada Skitraw', x: 420, y: y0 + 300, h: Math.PI / 2, hp: cfg.hpSekutu || 1700, dmg: 52, rl: 3.4, look: LOOK.skitraw, keep: 400 });
    add({ id: 'marlya', team: 0, name: 'Ratu Marlya', x: 300, y: y0, h: Math.PI / 2, hp: (cfg.hpSekutu || 1700) * 0.9, dmg: 44, rl: 3.6, look: LOOK.marlya, pref: 'sov', keep: 480 });
    add({ id: 'sov', team: 1, name: 'Sovereign Mahkota', x: AW - 520, y: y0, h: -Math.PI / 2, hp: cfg.hpSov || 2600, dmg: 72 * dm, rl: 3.2, look: LOOK.sov, size: 1.4, sp: 0.86, tm: 0.85, keep: 420 });
    add({ id: 'n1', team: 1, name: 'KPD Tembok Mahkota', x: AW - 420, y: y0 - 330, h: -Math.PI / 2, hp: cfg.hpNavy || 950, dmg: 46 * dm, rl: 3.6, look: LOOK.navy, pref: 'me' });
    add({ id: 'n2', team: 1, name: 'KPD Tinta Besi', x: AW - 420, y: y0 + 330, h: -Math.PI / 2, hp: cfg.hpNavy || 950, dmg: 46 * dm, rl: 3.6, look: LOOK.navy });
    add({ id: 'n3', team: 1, name: 'KPD Stempel Biru', x: AW - 300, y: y0 - 20, h: -Math.PI / 2, hp: cfg.hpNavy || 950, dmg: 46 * dm, rl: 3.6, look: LOOK.navy });
    W.R = R;
    W.byId = function (id) { for (var i = 0; i < W.ships.length; i++) if (W.ships[i].id === id) return W.ships[i]; return null; };
    return W;
  }
  function live(W, team) { return W.ships.filter(function (s) { return s.alive && (team == null || s.team === team); }); }
  function moveShip(s, dt, w) {
    var tr = 0.62 * (s.sails === 1 ? 1 : 0.85) * (0.6 + 0.4 * Math.min(1, s.v / 40)) * s.tm;
    s.h = ang(s.h + s.rud * tr * dt);
    var ts = 92 * (0.5 + 0.5 * wf(s.h, w)) * (s.sails === 1 ? 1 : 0.55) * (0.55 + 0.45 * s.hp / s.max) * s.sp;
    s.v = s.v + (ts - s.v) * (1 - Math.exp(-dt * 0.9));
    s.x += Math.sin(s.h) * s.v * dt; s.y -= Math.cos(s.h) * s.v * dt;
    var m = 70; if (s.x < m) { s.x = m; s.v *= 0.5; } if (s.x > AW - m) { s.x = AW - m; s.v *= 0.5; } if (s.y < m) { s.y = m; s.v *= 0.5; } if (s.y > AH - m) { s.y = AH - m; s.v *= 0.5; }
  }
  function pickTarget(W, s) {
    var foes = live(W, 1 - s.team); if (!foes.length) return null;
    if (s.pref) { var p = W.byId(s.pref); if (p && p.alive) return p; }
    var best = null, bd = 1e9;
    foes.forEach(function (f) { var d = dist(s, f) * (f.me ? 0.82 : 1) * (f.id === 'sov' && s.team === 0 ? 1.15 : 1); if (d < bd) { bd = d; best = f; } });
    return best;
  }
  function steer(W, s) {
    var t = s.tgt; if (!t) { s.rud = 0; return; }
    var d = dist(s, t), b = bearing(s, t), want;
    var side = ang(b - s.h) > 0 ? 1 : -1;      // musuh di kanan -> sisi kanan menghadap musuh
    if (d > s.keep + 220) want = b - side * 0.35;
    else if (d < s.keep - 140) want = b - side * 2.0;
    else want = b - side * Math.PI / 2;
    // jauhi tepi arena
    var mg = 300, cx = AW / 2, cy = AH / 2;
    if (s.x < mg || s.x > AW - mg || s.y < mg || s.y > AH - mg) want = bearing(s, { x: cx, y: cy });
    // jaga jarak dengan kapal sendiri yang terlalu dekat
    W.ships.forEach(function (o) { if (o !== s && o.alive && dist(s, o) < 110) want = bearing(o, s); });
    var e = ang(want - s.h); s.rud = Math.abs(e) < 0.06 ? 0 : (e > 0 ? 1 : -1);
  }
  function fire(W, s, side, quiet) {
    if (!s.alive || s.cd[side > 0 ? 1 : 0] > 0) return false;
    var foes = live(W, 1 - s.team), best = null, bq = 0;
    foes.forEach(function (f) { var d = dist(s, f); if (d > RANGE) return; var q = arcQ(s, f, side) * (1 - d / RANGE * 0.55); if (q > bq) { bq = q; best = f; } });
    if (!best && !s.me) return false;
    s.cd[side > 0 ? 1 : 0] = s.rl;
    var pk = W.R(), hit = !!best && pk < 0.32 + 0.6 * bq;
    var dmg = 0;
    if (best) {
      dmg = Math.round(s.dmg * (0.85 + W.R() * 0.3) * best.def * (s.team === 0 && W.phase === 3 ? 1.25 : 1));
    }
    var px = s.x + Math.cos(s.h) * side * 30, py = s.y + Math.sin(s.h) * side * 30;
    var tx, ty;
    if (best) { tx = best.x + (hit ? 0 : (W.R() - 0.5) * 120); ty = best.y + (hit ? 0 : (W.R() - 0.5) * 120); }
    else { var ab = s.h + side * Math.PI / 2; tx = s.x + Math.sin(ab) * RANGE * 0.8; ty = s.y - Math.cos(ab) * RANGE * 0.8; }
    var fl = 0.45 + Math.hypot(tx - px, ty - py) / 1100;
    W.balls.push({ x0: px, y0: py, x1: tx, y1: ty, t: 0, dur: fl, hit: hit, dmg: dmg, tgt: best, from: s });
    if (s.me) W.stats.tembak++;
    W.ev.push({ k: 'fire', s: s, side: side, quiet: quiet });
    return true;
  }
  function land(W, b) {
    if (!b.hit || !b.tgt || !b.tgt.alive) { W.ev.push({ k: 'splash', x: b.x1, y: b.y1 }); return; }
    var t = b.tgt; t.hp = Math.max(0, t.hp - b.dmg); t.flash = 0.25;
    if (b.from.me) W.stats.kena++;
    W.ev.push({ k: 'hit', x: b.x1, y: b.y1, s: t, dmg: b.dmg, from: b.from });
    if (t.hp <= 0) {
      t.alive = false; t.out = 0.001;
      if (t.team === 1) W.stats.tenggelam++;
      W.ev.push({ k: 'down', s: t });
    }
  }
  function phaseLogic(W, dt) {
    var sov = W.byId('sov'), mar = W.byId('marlya'), pearl = W.byId('pearl');
    if (!sov || !sov.alive) return;
    if (W.shield) {
      sov.def = 0.5;
      if (mar && mar.alive && dist(mar, sov) < 680) W.pengacau += dt;
      if (W.pengacau >= 8 || sov.hp < sov.max * 0.62) { W.shield = false; sov.def = 1; W.ev.push({ k: 'shield', by: mar && mar.alive && W.pengacau >= 8 ? 'marlya' : 'lemah' }); }
    }
    if (W.phase === 1 && sov.hp < sov.max * 0.6) { W.phase = 2; sov.rl = 2.3; W.ev.push({ k: 'phase', p: 2 }); }
    if (W.phase === 2 && sov.hp < sov.max * 0.3) {
      W.phase = 3; sov.sp *= 0.55; sov.rl = 2.8;
      W.ev.push({ k: 'phase', p: 3, pearl: !!(pearl && pearl.alive) });
    }
  }
  function step(W, dt) {
    if (W.over) return;
    W.t += dt; W.w = ang(W.w + Math.sin(W.t * 0.05) * 0.0006);
    W.ships.forEach(function (s) {
      if (!s.alive) { if (s.out > 0) s.out = Math.min(1, s.out + dt * 0.3); return; }
      s.cd[0] = Math.max(0, s.cd[0] - dt); s.cd[1] = Math.max(0, s.cd[1] - dt); if (s.flash > 0) s.flash -= dt;
      if (s.ai) {
        s.think = (s.think || 0) - dt;
        if (s.think <= 0 || !s.tgt || !s.tgt.alive) { s.think = 0.6 + W.R() * 0.5; s.tgt = pickTarget(W, s); }
        steer(W, s);
        if (s.tgt) { if (!fire(W, s, 1, true)) fire(W, s, -1, true); }
      }
      moveShip(s, dt, W.w);
    });
    // tabrakan ringan: dorong terpisah
    for (var i = 0; i < W.ships.length; i++) for (var j = i + 1; j < W.ships.length; j++) {
      var a = W.ships[i], b = W.ships[j]; if (!a.alive || !b.alive) continue;
      var d = dist(a, b), md = 54 * (a.size + b.size) / 2;

    c.rotate(W.w + Math.PI); c.fillStyle = '#d9a84e'; c.beginPath(); c.moveTo(0, -18); c.lineTo(6, 6); c.lineTo(-6, 6); c.closePath(); c.fill(); c.restore();
  }
  var hudT = 0;

  function finish() {

        '<div class="tiles"><div><b>' + Math.floor(W.t / 60) + ':' + ('0' + (Math.floor(W.t) % 60)).slice(-2) + '</b><small>Lama duel</small></div>' +
        '<div><b>' + W.stats.kena + ' / ' + W.stats.tembak + '</b><small>Salvo kena</small></div><div><b>' + W.stats.tenggelam + ' / 4</b><small>Musuh tenggelam</small></div></div>' +
        '<button class="ma-go" type="button">' + (win ? 'Lanjutkan' : 'Kembali ke armada') + '</button>';
      $('maEnd').hidden = false;
      var go = box.querySelector('.ma-go'), sent = false;

      };

  }

  window.MTARENA = { open: open, close: close, isOpen: function () { return S.open; }, _S: S,

})();

<script>
/* =====================================================================

(function () {
  try { if (typeof TYPE_META !== 'undefined') TYPE_META.TelukDalam = { icon: 'crown', label: 'Medan Tempur' }; } catch (e) { }
  function cid() { return window.state && state.city ? state.city.CityId : ''; }
  if (typeof window.openPanel === 'function') {
    var origOpen = window.openPanel;
    window.openPanel = function (panel) {
      if (cid() === 'teluk_dalam' && panel !== 'setsail' && panel !== 'combat' && panel !== 'log' && panel !== 'profile') {
        if (panel === 'sovereign' || panel === 'ship' || panel === 'tasks') { if (window.MK && MK.teluk && MK.teluk()) return; }

      }
      return origOpen.apply(this, arguments);
    };
  }
  if (!window.MTCities || !MTCities.register || !MTCities.H) return;
  var H = MTCities.H;
  function glow(ctx, x, y, r, col, a) { if (a <= 0.004) return; var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
  function hullSide(ctx, x, y, u, k, hull, sail, gold) {
    ctx.fillStyle = hull; ctx.beginPath(); ctx.moveTo(x - u * 2.2 * k, y - u * 0.5 * k); ctx.lineTo(x + u * 2.6 * k, y - u * 0.5 * k); ctx.lineTo(x + u * 1.9 * k, y + u * 0.25 * k); ctx.lineTo(x - u * 1.7 * k, y + u * 0.25 * k); ctx.closePath(); ctx.fill();
    if (gold) { ctx.strokeStyle = '#e0b84a'; ctx.lineWidth = u * 0.07; ctx.stroke(); }
    ctx.fillStyle = sail;
    [-1.1, 0.2, 1.4].forEach(function (m, i) { var h = u * (i === 1 ? 2.6 : 2.1) * k; ctx.fillRect(x + m * u * k - u * 0.05, y - u * 0.5 * k - h, u * 0.1, h); ctx.beginPath(); ctx.moveTo(x + m * u * k, y - u * 0.6 * k - h * 0.95); ctx.quadraticCurveTo(x + m * u * k + u * 0.9 * k, y - u * 0.5 * k - h * 0.5, x + m * u * k, y - u * 0.7 * k); ctx.closePath(); ctx.fill(); });
  }

    ctx.save(); ctx.strokeStyle = 'rgba(230,190,90,' + (0.18 + 0.1 * bl).toFixed(3) + ')'; ctx.lineWidth = u * 0.06;
    for (var r = 0; r < 4; r++) { ctx.beginPath(); ctx.ellipse(d.ax, d.ay, u * (1.6 + r * 1.2), u * (0.35 + r * 0.25), 0, t * (0.6 - r * 0.1), t * (0.6 - r * 0.1) + 4.4); ctx.stroke(); }
    ctx.restore();
    for (var i = 0; i < d.fog.length; i++) {
      var f = d.fog[i]; if (!inst.reduced) f.x += f.v * dt / 1000; if (f.x > W + f.r) f.x = -f.r; if (f.x < -f.r) f.x = W + f.r;
      var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); g.addColorStop(0, 'rgba(120,128,150,' + f.a + ')'); g.addColorStop(1, 'rgba(120,128,150,0)');
      ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
