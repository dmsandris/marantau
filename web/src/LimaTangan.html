      actions('<button class="btn" data-side="kecil">' + ic('dice') + '&nbsp; Kecil</button><button class="btn btn-gold" data-side="besar">' + ic('dice') + '&nbsp; Besar</button>') + '</div>';
    w.querySelectorAll('[data-side]').forEach(function (b) {
      b.onclick = function () {

          if (!cup.isConnected) { clearInterval(iv); return; }

          if (out && Date.now() - t0 > 1300) {

          }
          cup.innerHTML = [r6(), r6(), r6()].map(dieHtml).join('');
        }, 90);
