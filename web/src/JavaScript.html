<script>
  /* ================================================================
   * JavaScript.html — Marantau client (Tide v3)
   * ----------------------------------------------------------------
   * Logika data/aksi (google.script.run, panelCache, marketCache,
   * patch state lokal, txPending) DIPERTAHANKAN persis seperti versi
   * sebelumnya - yang dirombak adalah lapisan visual:
   *   - scene pelabuhan/laut = canvas hidup (MTScene di SceneEngine.html)
   *   - HUD atas: gold/bank/utang + meter kondisi kapal & palka + jam
   *   - panel-panel baru (market ledger, palka kargo, blueprint kapal,
   *     radar stat, peta laut bergaya perkamen, dll)
   *   - combat: galleon sungguhan, tembakan salvo, kapal karam
   *   - shortcut keyboard (M/C/H/S/...) + Esc
   * ================================================================ */
  var state = null;
  var currentPanel = null;
  var logPage = 0;
  var LOGS_PER_PAGE = 2;
  var txPending = false; // anti double-submit global (buy/sell/travel/beli buku)
  var bootDone = false;
  var bootTimeoutHandle = null;
  var BOOT_TIMEOUT_MS = 15000;

  // panelCache = hasil terakhir Library/Mission Board/Set Sail/Cargo per kota
  // (stale-while-revalidate). Di-WIPE begitu ada aksi yang mengubah
  // gold/cargo/stat/ship (invalidatePanelCache_()).
  var panelCache = {};
  // marketCache: hanya Market - harga tidak berubah akibat transaksi,
  // jadi cukup patch ownedQty/cargoSpaceRemaining lokal.
  var marketCache = null; // { cityId, items, cargoSpaceRemaining }
  var sailingBackgroundUrl = '';

  var scene = null;          // instance MTScene (canvas pelabuhan/laut)
  var hudCargoUsed = null;   // unit terpakai di palka (untuk meter HUD)
  var sailSel = null;        // tujuan terpilih di panel Set Sail
  var stateLoadedAt = Date.now();

  var ARCH_ICON = {
    merchant: 'coins', navigator: 'compass', pirate: 'swords', explorer: 'map',
    gambler: 'star', smuggler: 'eye', diplomat: 'scroll', adventurer: 'anchor'
  };
  var ARCH_COLOR = {
    merchant: ['#b8862b', '#3d2708'], navigator: ['#2f7fa3', '#0e2a3a'], pirate: ['#b23a2a', '#3a0d08'], explorer: ['#3f8c3f', '#122a12'],
    gambler: ['#8e3d8a', '#2a0f28'], smuggler: ['#6b5a4a', '#1e1712'], diplomat: ['#c9a876', '#3a2a14'], adventurer: ['#4ea3c9', '#10303e']
  };
  var TYPE_META = {
    TradeHub: { icon: 'scales', label: 'Pusat Dagang' }, Agricultural: { icon: 'sack', label: 'Lumbung' },
    Remote: { icon: 'compass', label: 'Terpencil' }, Capital: { icon: 'star', label: 'Ibu Kota' },
    Outlaw: { icon: 'skull', label: 'Sarang Penyamun' }, FallenCapital: { icon: 'warehouse', label: 'Ibu Kota Runtuh' },
    Paradise: { icon: 'gem', label: 'Pulau Surga' }, Freed: { icon: 'star', label: 'Pulau Merdeka' }
  };
  var COMMODITY_META = {
    sugar: { icon: 'sack', c1: '#e3c16a', c2: '#9a7424' }, silk: { icon: 'silk', c1: '#c070b8', c2: '#6a2a66' },
    spices: { icon: 'pepper', c1: '#e0663f', c2: '#8c2a1d' }, rum: { icon: 'bottle', c1: '#b27a45', c2: '#5a3718' },
    tools: { icon: 'hammer', c1: '#7f96a8', c2: '#34495a' }, arms: { icon: 'swords', c1: '#737a88', c2: '#2c3038' }
  };
  var BOOT_TIPS = [
    'Beli murah di kota Lumbung, jual mahal di kota Terpencil.',
    'Kapal dengan kondisi rendah lebih mudah karam saat dicegat bajak laut.',
    'Buku di Library menaikkan stat secara permanen.',
    'Titip barang di Gudang kalau palka penuh.',
    'Utang Moneylender berbunga majemuk - bayar secepatnya!',
    'Pelayaran ke TooGood nyaris pasti dicegat bajak laut.',
    'Tekan M untuk Market, S untuk Set Sail, Esc untuk menutup panel.'
  ];

  function ic(name, cls) { return MTIcon(name, cls); }
  function hydrateIcons_(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
      if (el.getAttribute('data-hyd') === el.getAttribute('data-icon')) return;
      el.innerHTML = MTIcon(el.getAttribute('data-icon'));
      el.setAttribute('data-hyd', el.getAttribute('data-icon'));
    });
  }
  function setIcon_(el, name) { if (!el) return; el.setAttribute('data-icon', name); el.removeAttribute('data-hyd'); hydrateIcons_(el.parentNode || el); }
  function esc_(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /** Header panel standar: ikon + judul + subjudul (+ konten kanan opsional). */
  function panelHeader_(icon, title, sub, right) {
    return '<header class="ph"><span class="ph-ico">' + ic(icon) + '</span><div style="min-width:0;"><h2>' + title + '</h2>' +
      (sub ? '<div class="ph-sub">' + sub + '</div>' : '') + '</div>' + (right ? '<div class="ph-right">' + right + '</div>' : '') + '</header>';
  }
  function goodIcon_(id, small) {
    var m = COMMODITY_META[id] || { icon: 'crate', c1: '#a08560', c2: '#5a4526' };
    return '<span class="good-ico' + (small ? ' sm' : '') + '" style="background:linear-gradient(145deg,' + m.c1 + ',' + m.c2 + ');">' + ic(m.icon) + '</span>';
  }

  /** Dipanggil setelah SETIAP aksi yang mengubah gold/cargo/stat/ship/reputation. */
  function invalidatePanelCache_() { panelCache = {}; }

  function fitViewportHeight_() {
    var h = window.innerHeight;
    if (!h) return;
    document.documentElement.style.setProperty('--vh-px', h + 'px');
    var game = document.getElementById('game');
    if (game) game.classList.add('js-locked');
  }

  document.addEventListener('DOMContentLoaded', function () {
    fitViewportHeight_();
    setTimeout(fitViewportHeight_, 300);
    window.addEventListener('resize', fitViewportHeight_);
    window.addEventListener('orientationchange', function () { setTimeout(fitViewportHeight_, 200); });

    hydrateIcons_(document);
    try { scene = MTScene.create(document.getElementById('sceneCanvas')); } catch (e) { console.error('[Marantau] scene gagal dibuat:', e); scene = null; }
    // Selama title screen menutupi layar, scene utama cukup jalan pelan (hemat CPU).
    var titleEl = document.getElementById('titleScreen');
    if (scene && titleEl && !titleEl.classList.contains('hidden')) scene.setThrottle(6);
    if (scene) { scene.onLayout = function () { renderHotspots_(); }; bindSceneInput_(); }
    setInterval(ambientChatter_, 17000);
    var playBtn = document.getElementById('titlePlayBtn');
    if (playBtn) playBtn.addEventListener('click', function () { if (scene) scene.setThrottle(currentPanel ? 3 : 1); });

    bootLoad();
    google.script.run
      .withSuccessHandler(function (res) {
        sailingBackgroundUrl = (res && res.imageUrl) || '';
        if (state && state.voyage && state.voyage.inTransit) renderAtSeaScene();
      })
      .withFailureHandler(function () { /* diam-diam - fallback canvas tetap jalan */ })
      .api_getSailingBackgroundUrl();
    document.getElementById('bootRetryBtn').addEventListener('click', bootLoad);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'modalOverlay') closeModal();
    });
    document.querySelectorAll('#menuList .btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (currentPanel === btn.dataset.panel) { closeModal(); return; }
        openPanel(btn.dataset.panel);
      });
    });
    document.getElementById('logPrev').addEventListener('click', function () { changeLogPage(-1); });
    document.getElementById('logNext').addEventListener('click', function () { changeLogPage(1); });

    // Keyboard: combat 1-6, shortcut panel, Esc.
    var COMBAT_HOTKEYS = { '1': 'fire', '2': 'reload', '3': 'flee', '4': 'bribe', '5': 'negotiate', '6': 'ram' };
    var PANEL_KEYS = { m: 'market', c: 'cargo', h: 'ship', p: 'character', t: 'tasks', l: 'library', b: 'bank', s: 'setsail', j: 'log', i: 'items', o: 'settings', k: 'tavern' };
    document.addEventListener('keydown', function (e) {
      if (combatSceneOpen) {
        var tactic = COMBAT_HOTKEYS[e.key];
        if (tactic) doCombatAction_(tactic);
        if ((e.key === 'Enter' || e.key === ' ') && document.getElementById('combatSummaryBackdrop').classList.contains('open')) { e.preventDefault(); finishBattleSummary_(); }
        return;
      }
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
      var title = document.getElementById('titleScreen');
      if (title && !title.classList.contains('hidden')) return;
      if (!bootDone || !state) return;
      if (e.key === 'Escape') { if (currentPanel) closeModal(); return; }
      var panel = PANEL_KEYS[e.key.toLowerCase()];
      if (panel) { e.preventDefault(); if (currentPanel === panel) closeModal(); else openPanel(panel); }
    });

    document.addEventListener('click', function primeAudioOnce() {
      applyAudioState();
      document.removeEventListener('click', primeAudioOnce);
    }, { once: true });

    // Poll voyage ringan selama berlayar (api_pollVoyage, bukan state penuh).
    setInterval(function () {
      if (bootDone && state && state.voyage && state.voyage.inTransit) pollVoyage_();
    }, 6000);
    // Jam hari-game di HUD + progres lokal voyage card (interpolasi antar poll).
    setInterval(function () { updateClockHud_(); tickVoyageCard_(); }, 1000);
  });

  // Nomor urut perubahan voyage lokal: respons server yang diminta SEBELUM kapten berlayar
  // (poll/loadState yang "balapan" dengan api_setSail) dibuang supaya kapal tidak kembali ke pulau.
  var voySeq = 0;
  function pollVoyage_() {
    if (txPending || (state && state.voyage && state.voyage._optimistic)) return;
    var seq = voySeq;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!state || !res || !res.voyage) return;
        if (seq !== voySeq || txPending || (state.voyage && state.voyage._optimistic)) return;
        var wasInTransit = !!(state.voyage && state.voyage.inTransit);
        state.voyage = res.voyage;
        state.voyage._at = Date.now();
        if (wasInTransit && !res.voyage.inTransit) { loadState(); return; }
        schedulePreciseArrival_();
        if (combatSceneOpen) return;
        renderScene();
        if (currentPanel === 'setsail') openPanel(currentPanel);
      })
      .withFailureHandler(function (err) {
        console.error('[Marantau] pollVoyage_ gagal (diam-diam, coba lagi poll berikutnya):', err);
      })
      .api_pollVoyage();
  }

  var bootTipTimer = null;
  /**
   * LATENCY (Tide v3): (1) tampilkan SEKETIKA kondisi terakhir dari
   * snapshot localStorage (kalau ada) sambil data segar dimuat - tidak ada
   * layar tunggu; (2) langsung api_getGameState() tanpa api_ping() dulu
   * (hemat 1 round-trip) - ping cuma dipakai untuk diagnosis kalau gagal;
   * (3) Cities dikirim server sekalian kalau cache lokal basi.
   */
  function bootLoad() {
    bootDone = false;
    var snap = loadSnap_(), cached = getCachedCities_();
    if (snap && snap.player && snap.stats && cached && cached.cities && !state) {
      snap.cities = cached.cities;
      state = snap; stateFresh = false;
      stateLoadedAt = Date.now();
      if (state.voyage) state.voyage._at = Date.now();
      renderSidebar(); renderScene(); renderLog();
      hideBootOverlay();
      updSync_();
    } else {
      showBootOverlay('loading');
    }
    clearTimeout(bootTimeoutHandle);
    bootTimeoutHandle = setTimeout(function () {
      if (bootDone) return;
      if (state) showToast('Server lambat merespons… masih mencoba.', 'error');
      else showBootOverlay('timeout');
    }, BOOT_TIMEOUT_MS);
    fetchGameState();
  }

  /** Diagnosis hanya dijalankan kalau api_getGameState gagal/kosong. */
  function runPingDiagnosis_(payload) {
    google.script.run
      .withSuccessHandler(function (pong) {
        if (!pong || !pong.ok) showBootOverlay('empty', null, { ping: pong, note: 'api_ping() juga kosong - lihat PATCH_NOTES.' });
        else showBootOverlay('empty', null, payload);
      })
      .withFailureHandler(function () { showBootOverlay('empty', null, payload); })
      .api_ping();
  }

  /* ---------------- CITIES CACHE (localStorage reference-data hydration) ---------------- */
  var CITIES_CACHE_KEY = 'MT_CITIES_CACHE_V1';
  function getCachedCities_() {
    try { var raw = localStorage.getItem(CITIES_CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function setCachedCities_(version, cities) {
    try { localStorage.setItem(CITIES_CACHE_KEY, JSON.stringify({ version: version, cities: cities })); } catch (e) { /* abaikan */ }
  }
  function visibleCities_(list, s) {
    var un = (s && s.unlocks) || [];
    return (list || []).filter(function (c) { return !c.Hidden || un.indexOf(c.CityId) >= 0 || (s && s.city && s.city.CityId === c.CityId); });
  }
  function resolveCitiesThenApply_(s, applyState0_) {
    var applyState_ = function (x) { x.cities = visibleCities_(x.cities, x); applyState0_(x); };
    if (s.cities && s.cities.length) { setCachedCities_(s.citiesVersion, s.cities); applyState_(s); return; }
    var cached = getCachedCities_();
    if (cached && cached.version === s.citiesVersion) { s.cities = cached.cities; applyState_(s); return; }
    google.script.run
      .withSuccessHandler(function (res) { setCachedCities_(res.version, res.cities); s.cities = res.cities; applyState_(s); })
      .withFailureHandler(function (err) {
        console.error('[Marantau] api_getCities() gagal, pakai cache lama kalau ada:', err);
        s.cities = (cached && cached.cities) || [];
        applyState_(s);
      })
      .api_getCities();
  }

  function applyFreshState_(s2) {
    if (!s2.appearance && state && state.appearance && state.player && s2.player && state.player.characterName === s2.player.characterName) s2.appearance = state.appearance;
    state = s2;
    stateFresh = true;
    stateLoadedAt = Date.now();
    if (state.voyage) state.voyage._at = Date.now();
    logPage = 0;
    renderSidebar();
    renderScene();
    renderLog();
    setupAudio();
    invalidatePanelCache_();
    prefetchPanelData_();
    updSync_();
    saveSnap_();
    maybeArrival_();
    renderHotspots_();
    schedulePreciseArrival_();
  }
  function knownCitiesVersion_() { var c = getCachedCities_(); return c ? c.version : null; }

  function fetchGameState() {
    google.script.run.withSuccessHandler(function (s) {
      bootDone = true;
      clearTimeout(bootTimeoutHandle);
      console.log('[Marantau] api_getGameState() balik dengan:', s);
      if (s && s.needsCharacter) { hideBootOverlay(); if (window.onNeedsCharacter_) onNeedsCharacter_(s); return; }
      if (!s || !s.player || !s.stats) {
        console.error('[Marantau] Payload tidak lengkap - lihat detail di atas.');
        runPingDiagnosis_(s);
        return;
      }
      resolveCitiesThenApply_(s, function (s2) {
        applyFreshState_(s2);
        hideBootOverlay();
      });
    }).withFailureHandler(function (err) {
      bootDone = true;
      clearTimeout(bootTimeoutHandle);
      if (/AUTH_REQUIRED/.test(String(err && err.message))) { hideBootOverlay(); return; }
      console.error('[Marantau] api_getGameState() gagal:', err);
      showBootOverlay('error', err.message);
    }).api_getGameState(knownCitiesVersion_());
  }

  /**
   * LATENCY (Tide v3): SATU panggilan api_getCityBundle() mengisi semua
   * cache panel kota (cargo, market, library, misi, berlayar, upgrade,
   * reparasi, items) - panel terbuka instan. Kalau server belum punya
   * endpoint itu (Code.gs lama), fallback ke prefetch lama per panel.
   */
  function prefetchPanelData_() {
    if (!state || !state.city) return;
    var cityId = state.city.CityId;
    google.script.run
      .withSuccessHandler(function (b) { applyBundle_(cityId, b); })
      .withFailureHandler(function () { legacyPrefetch_(cityId); })
      .api_getCityBundle(cityId);
  }
  function applyBundle_(cityId, b) {
    if (!b) return;
    if (b.cargoState) { panelCache['cargo:' + cityId] = b.cargoState; updateHoldFromCargo_(b.cargoState); }
    if (b.library) panelCache['library:' + cityId] = b.library;
    if (b.missionBoard) panelCache['missionBoard:' + cityId] = b.missionBoard;
    if (b.sailOptions) { panelCache['sailOptions:' + cityId] = b.sailOptions; lastSailOptions = b.sailOptions; }
    if (b.market) { panelCache['market:' + cityId] = b.market; recordPrices_(cityId, b.market.items); }
    if (b.upgrades) panelCache.upgrades = b.upgrades;
    if (b.repairQuote) panelCache['repair:' + cityId] = b.repairQuote;
    if (b.items) panelCache.items = b.items;
  }
  function legacyPrefetch_(cityId) {
    var inTransit = !!(state.voyage && state.voyage.inTransit);
    google.script.run.withSuccessHandler(function (data) { panelCache['cargo:' + cityId] = data; updateHoldFromCargo_(data); }).withFailureHandler(function () {}).api_getCargoState(cityId);
    if (inTransit) return;
    google.script.run.withSuccessHandler(function (lib) { panelCache['library:' + cityId] = lib; }).withFailureHandler(function () {}).api_getLibrary();
    google.script.run.withSuccessHandler(function (board) { panelCache['missionBoard:' + cityId] = board; }).withFailureHandler(function () {}).api_getMissionBoard(cityId);
    google.script.run.withSuccessHandler(function (options) { panelCache['sailOptions:' + cityId] = options; lastSailOptions = options; }).withFailureHandler(function () {}).api_getSailOptions();
  }
  var cargoRefreshT = null;
  /** Setelah antrean transaksi selesai, sinkronkan isi palka diam-diam (meter HUD & cache). */
  function refreshCargoQuiet_() {
    clearTimeout(cargoRefreshT);
    cargoRefreshT = setTimeout(function () {
      if (!txIdle_() || !state || !state.city) return;
      var cid = state.city.CityId;
      google.script.run.withSuccessHandler(function (d) { panelCache['cargo:' + cid] = d; updateHoldFromCargo_(d); }).withFailureHandler(function () {}).api_getCargoState(cid);
    }, 900);
  }
  var arrivalTimer = null;
  /** Poll TEPAT saat ETA habis (bukan menunggu interval 6 detik) - kedatangan terasa instan. */
  function schedulePreciseArrival_() {
    clearTimeout(arrivalTimer);
    var v = state && state.voyage;
    if (!v || !v.inTransit || v.encounterPending) return;
    var ms = (v.etaSeconds || 0) * 1000 - (Date.now() - (v._at || Date.now())) + 700;
    if (ms > 5600) return;
    arrivalTimer = setTimeout(pollVoyage_, Math.max(250, ms));
  }

  function showBootOverlay(mode, message, debugPayload) {
    var overlay = document.getElementById('bootOverlay');
    var textEl = document.getElementById('bootText');
    var hintEl = document.getElementById('bootHint');
    var tipEl = document.getElementById('bootTip');
    var retryBtn = document.getElementById('bootRetryBtn');
    var spinner = overlay.querySelector('.spinner');
    var debugEl = document.getElementById('bootDebug');
    overlay.classList.add('open');
    debugEl.style.display = 'none';
    debugEl.textContent = '';
    clearInterval(bootTipTimer);
    tipEl.textContent = '';

    if (mode === 'loading') {
      spinner.style.display = '';
      textEl.textContent = 'Memuat dunia…';
      hintEl.textContent = '';
      retryBtn.style.display = 'none';
      var ti = Math.floor(Math.random() * BOOT_TIPS.length);
      tipEl.textContent = 'Tip: ' + BOOT_TIPS[ti];
      bootTipTimer = setInterval(function () {
        ti = (ti + 1) % BOOT_TIPS.length;
        tipEl.style.opacity = 0;
        setTimeout(function () { tipEl.textContent = 'Tip: ' + BOOT_TIPS[ti]; tipEl.style.opacity = 1; }, 400);
      }, 3800);
    } else if (mode === 'timeout') {
      spinner.style.display = 'none';
      textEl.textContent = 'Kelamaan nih…';
      hintEl.innerHTML = 'Server belum merespons sama sekali setelah ' + (BOOT_TIMEOUT_MS / 1000) +
        ' detik. Cek tab <b>Network</b> di DevTools (filter "exec" atau "gas"), lihat apakah ada ' +
        'request yang PENDING terus. Kalau iya, kemungkinan besar ada extension browser yang ' +
        'memblokir komunikasi antar-iframe Apps Script - coba buka game ini di jendela ' +
        '<b>Incognito</b> atau browser lain.';
      retryBtn.style.display = 'inline-block';
    } else if (mode === 'error') {
      spinner.style.display = 'none';
      textEl.textContent = 'Gagal memuat game';
      hintEl.textContent = message || 'Terjadi kesalahan tidak dikenal.';
      retryBtn.style.display = 'inline-block';
    } else if (mode === 'empty') {
      spinner.style.display = 'none';
      if (debugPayload && debugPayload.note) {
        textEl.textContent = 'Bukan soal data - ada yang mengganggu koneksi';
        hintEl.innerHTML = 'Bahkan request paling ringan (<code>api_ping</code>) pun balik kosong. ' +
          'Kemungkinan besar ada extension browser atau kebijakan jaringan yang mengganggu komunikasi Apps Script. ' +
          'Coba (1) jendela <b>Incognito</b>, atau (2) nonaktifkan extension satu-satu di <code>chrome://extensions</code>.';
      } else {
        textEl.textContent = 'Server merespons, tapi datanya kosong';
        hintEl.innerHTML = '<code>api_ping</code> berhasil, tapi <code>api_getGameState</code> baliknya kosong. ' +
          'Cek editor Apps Script &rarr; <b>Executions</b> &rarr; eksekusi <code>api_getGameState</code> terbaru &rarr; ' +
          'tab <b>Logs</b>, cari baris "payload size". Payload mentah yang diterima browser:';
      }
      retryBtn.style.display = 'inline-block';
      debugEl.textContent = JSON.stringify(debugPayload, null, 2);
      debugEl.style.display = 'block';
    }
  }

  function hideBootOverlay() {
    clearInterval(bootTipTimer);
    document.getElementById('bootOverlay').classList.remove('open');
  }

  var loadStateRetry_ = null;
  function loadState() {
    var seq = voySeq;
    google.script.run.withSuccessHandler(function (s) {
      // Ada pelayaran baru dimulai selagi permintaan ini di jalan -> datanya basi, ambil ulang.
      if (seq !== voySeq || txPending) { clearTimeout(loadStateRetry_); loadStateRetry_ = setTimeout(loadState, 900); return; }
      if (s && s.needsCharacter) { if (window.onNeedsCharacter_) onNeedsCharacter_(s); return; }
      if (!s || !s.player || !s.stats) {
        console.error('[Marantau] loadState(): payload kosong/tidak lengkap:', s);
        showToast('Gagal memuat ulang data (respons server kosong). Coba lagi.', 'error');
        return;
      }
      resolveCitiesThenApply_(s, function (s2) {
        applyFreshState_(s2);
        if (currentPanel) openPanel(currentPanel);
      });
    }).withFailureHandler(function (err) {
      console.error('[Marantau] loadState() gagal:', err);
      showToast(err.message, 'error');
    }).api_getGameState(knownCitiesVersion_());
  }

  /* ---------------- TOAST ---------------- */
  function showToast(message, type) {
    var container = document.getElementById('toastContainer');
    if (!container) { window.alert(message); return; }
    var toast = document.createElement('div');
    toast.className = 'toast' + (type === 'error' ? ' toast-error' : (type === 'success' ? ' toast-success' : ''));
    toast.innerHTML = ic(type === 'error' ? 'alert' : (type === 'success' ? 'check' : 'compass')) + '<span></span>';
    toast.lastChild.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add('show'); });
    setTimeout(function () {
      toast.classList.remove('show');
      setTimeout(function () { toast.remove(); }, 300);
    }, 3800);
    while (container.children.length > 4) container.firstChild.remove();

  /* ---------------- GOLD / LEDGER ---------------- */
  var lastGoldShown = null;
  function animateGoldTo_(elId, newVal) {
    var el = document.getElementById(elId);
    if (!el) return;
    var start = lastGoldShown === null ? newVal : lastGoldShown;
    if (start === newVal) { el.textContent = formatGold(newVal); lastGoldShown = newVal; return; }
    spawnGoldFloat_(newVal - start);
    var startTime = null, duration = 650;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min(1, (ts - startTime) / duration);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatGold(Math.round(start + (newVal - start) * eased));
      if (progress < 1) requestAnimationFrame(step);
      else lastGoldShown = newVal;
    }
    lastGoldShown = newVal;
    requestAnimationFrame(step);
  }
  function spawnGoldFloat_(delta) {
    if (!delta) return;
    var host = document.querySelector('.res.gold');
    if (!host) return;
    var f = document.createElement('span');
    f.className = 'gold-float ' + (delta > 0 ? 'up' : 'down');
    f.textContent = (delta > 0 ? '+' : '−') + formatGold(Math.abs(delta));
    host.appendChild(f);
    setTimeout(function () { f.remove(); }, 1500);
  }

  function patchGold_(newGold) {
    if (!state || !state.player) return;
    state.player.gold = newGold;
    animateGoldTo_('ledgerCash', newGold);

  function patchBank_(bankState) {
    if (!state) return;

    state.bank = bankState;

    if (!state || !state.ship) return;

  /** Interpolasi progres voyage card tiap detik (poll server tiap 6 detik). */
  function tickVoyageCard_() {
    if (!state || !state.voyage || !state.voyage.inTransit || state.voyage.encounterPending) return;
    var v = state.voyage;
    var el = (Date.now() - (v._at || Date.now())) / 1000;
    var eta = Math.max(0, (v.etaSeconds || 0) - el);
    var total = v.progress < 1 && v.etaSeconds > 0 ? v.etaSeconds / Math.max(0.001, 1 - v.progress) : 1;
    var prog = Math.min(1, v.progress + el / Math.max(1, total));
    var pct = Math.round(prog * 100);
    var d = document.getElementById('vcDone'), b = document.getElementById('vcBoat');
    if (d) d.style.width = pct + '%';
    if (b) b.style.left = pct + '%';
    var p = document.getElementById('vcPct'); if (p) p.textContent = pct + '%';
    var e = document.getElementById('vcEta'); if (e) e.textContent = formatEta(eta);
    if (scene) scene.configure({ progress: prog });

  /** Radar chart heptagon 7 stat (SVG). */
  function statRadarSvg_(stats) {
    var N = STAT_DEFS.length, cx = 110, cy = 112, R = 78;
    var max = Math.max(60, STAT_DEFS.reduce(function (m, d) { return Math.max(m, Number(stats[d.key]) || 0); }, 0));
    max = Math.ceil(max / 20) * 20;
    function pt(i, r) { var a = -Math.PI / 2 + i / N * Math.PI * 2; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }
    var s = '<svg class="radar" viewBox="0 0 220 226">';
    for (var ring = 1; ring <= 4; ring++) {
      s += '<polygon points="' + STAT_DEFS.map(function (d, i) { return pt(i, R * ring / 4).join(','); }).join(' ') + '" fill="' + (ring % 2 ? 'rgba(90,60,25,.05)' : 'none') + '" stroke="rgba(90,60,25,.25)" stroke-width=".8"/>';
    }
    STAT_DEFS.forEach(function (d, i) { var p = pt(i, R); s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="rgba(90,60,25,.25)" stroke-width=".8"/>'; });
    var poly = STAT_DEFS.map(function (d, i) { return pt(i, R * Math.min(1, (Number(stats[d.key]) || 0) / max)).join(','); }).join(' ');
    s += '<polygon points="' + poly + '" fill="rgba(47,127,163,.28)" stroke="#1a4d69" stroke-width="2" stroke-linejoin="round"><animate attributeName="opacity" from="0" to="1" dur=".6s"/></polygon>';
    STAT_DEFS.forEach(function (d, i) {
      var p = pt(i, R * Math.min(1, (Number(stats[d.key]) || 0) / max));

    if (/pirate|bajak|musuh|tembak|cannon|combat/.test(m)) return 'swords';
    if (/landfall|anchor|arrive|tiba|merapat/.test(m)) return 'anchor';

    if (/treasure|harta|peta|map/.test(m)) return 'chest';

  function holdGridHtml_(cargo, cap, missionLoad) {
    var cells = cap, per = 1;
    while (cells > 120) { per *= 2; cells = Math.ceil(cap / per); }
    var fills = [];
    for (var mi = 0; mi < Math.ceil((missionLoad || 0) / per); mi++) fills.push({ mission: true });
    cargo.forEach(function (c) {
      var m = COMMODITY_META[c.commodityId] || { c1: '#a08560', c2: '#5a4526' };
      var n = Math.ceil(c.qty / per);
      for (var i = 0; i < n; i++) fills.push(m);

    for (var k = 0; k < cells; k++) {

      html += f ? (f.mission ? '<span class="hold-cell f m" title="Muatan misi (terkunci)" style="animation-delay:' + (k * 8) + 'ms"></span>' : '<span class="hold-cell f" style="background:linear-gradient(145deg,' + f.c1 + ',' + f.c2 + ');animation-delay:' + (k * 8) + 'ms"></span>') : '<span class="hold-cell"></span>';

  /** Potret kapal hidup di header panel Ship (canvas kecil, dihentikan saat panel ditutup). */
  function startShipHero_() {
    stopShipHero_();
    var cv = document.getElementById('shipHeroCanvas');
    if (!cv || !window.MTShip) return;
    var ctx = cv.getContext('2d'), t0 = performance.now(), clouds = MTSky.makeClouds(MTUtil.rng(7), 4), glit = MTSky.makeGlitter(MTUtil.rng(9));
    var pal = MTSky.palette(dayFrac_(), null), last = 0;
    function frame(ts) {
      if (!document.getElementById('shipHeroCanvas')) { shipHeroRaf = 0; return; }
      shipHeroRaf = requestAnimationFrame(frame);
      var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      var W = Math.max(10, r.width), H = Math.max(10, r.height);
      if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
      var t = (ts - t0) / 1000, dt = last ? ts - last : 16; last = ts;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var hy = H * 0.6;
      MTSky.paintSky(ctx, W, hy, pal, t, null);
      MTSky.paintClouds(ctx, W, hy, pal, clouds, dt, 1);
      MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: glit, rough: 0.8, drift: 20 });
      var sv = shipVisual_(), o = myShipOpts_(shipLookDraft);
      var sc = Math.min(W * 0.0034, H * 0.0062) / Math.max(1, (o.sizeK || 1) * 0.92);
      o.dir = 1; o.t = t; o.damage = Math.max(0, (70 - sv.cond) / 70); o.lanterns = pal.lights; o.lit = pal.lit; o.roll = Math.sin(t * 1.1) * 0.03;
      var x = W * 0.6, y = H * 0.84 + Math.sin(t * 1.3) * 2;
      ctx.save(); ctx.globalAlpha = 0.18; var ro = {}; for (var k in o) ro[k] = o[k]; ro.reflect = true; ro.roll = -o.roll; MTShip.draw(ctx, x, y + 5 * sc, sc, ro); ctx.restore();
      MTShip.draw(ctx, x, y, sc, o);
      MTShip.foam(ctx, x, y, sc, 1, t, 0.6, 1);
      // pratinjau kecil yang tetap terlihat saat menggulir editor tampilan
      var pv = document.getElementById('shipLookPreview');
      if (pv) {
        var pr = pv.getBoundingClientRect(), PW = Math.max(10, pr.width), PH = Math.max(10, pr.height);
        if (pv.width !== Math.round(PW * dpr)) { pv.width = Math.round(PW * dpr); pv.height = Math.round(PH * dpr); }
        var pc = pv.getContext('2d'); pc.setTransform(dpr, 0, 0, dpr, 0, 0);
        var phy = PH * 0.64;
        MTSky.paintSky(pc, PW, phy, pal, t, null);
        MTSky.paintSea(pc, PW, PH, phy, pal, t, { glitter: glit, rough: 0.7, drift: 20 });
        var po = myShipOpts_(shipLookDraft);
        po.dir = 1; po.t = t; po.lanterns = pal.lights; po.lit = pal.lit; po.roll = Math.sin(t * 1.1) * 0.03;
        var psc = Math.min(PW * 0.0056, PH * 0.0052) / (po.sizeK || 1);
        MTShip.draw(pc, PW * 0.54, PH * 0.84 + Math.sin(t * 1.3) * 1.5, psc, po);
        MTShip.foam(pc, PW * 0.54, PH * 0.84, psc, 1, t, 0.5, 1);
      }
    }
    shipHeroRaf = requestAnimationFrame(frame);
  }

  function renderMarket() {
    if (!state || !state.city) { showModalError({ message: 'Data kota belum siap.' }); return; }
    if (state.voyage && state.voyage.inTransit) { renderStub('Market', 'Kamu sedang berlayar - tidak bisa berdagang sampai kapal merapat di pelabuhan.', 'scales'); return; }
    var cityId = state.city.CityId;
    if (marketCache && marketCache.cityId === cityId) { renderMarketGrid_(); return; }
    var pre = panelCache['market:' + cityId];
    if (pre) {
      marketCache = { cityId: cityId, items: JSON.parse(JSON.stringify(pre.items || [])), cargoSpaceRemaining: pre.cargoSpaceRemaining || 0 };
      renderMarketGrid_();
    }
    google.script.run.withSuccessHandler(function (result) {
      recordPrices_(cityId, result.items);
      panelCache['market:' + cityId] = result;
      if (!txIdle_() && marketCache) return; // jangan timpa perubahan optimistis yang sedang dikirim
      marketCache = { cityId: cityId, items: result.items || [], cargoSpaceRemaining: result.cargoSpaceRemaining || 0 };
      var cap = state.ship ? (state.ship.EffectiveCargo || state.ship.Cargo) : 0;
      if (cap) updateHoldHud_(Math.max(0, cap - marketCache.cargoSpaceRemaining));
      if (currentPanel === 'market') renderMarketGrid_();

  var lastTrade = null;
  function knownBestLine_(id, buyHere) {
    if (!state || !state.city) return '';
    var bk = bestKnown_(id, state.city.CityId);
    if (!bk.sell) return '';
    var up = bk.sell.price > buyHere;
    return '<span class="known-best' + (up ? ' up' : '') + '">' + ic('route') + ' Catatanmu: laku ' + formatGold(bk.sell.price) + ' di ' + esc_(cityName_(bk.sell.city)) + ' (H' + esc_(bk.sell.day) + ')' + (up ? ' &middot; +' + formatGold(bk.sell.price - buyHere) + '/unit' : '') + '</span>';
  }

  function stepQty_(id, d) {
    var el = document.getElementById('qty_' + id);
    if (!el) return;
    el.value = Math.max(1, (Math.floor(Number(el.value)) || 0) + d);
    updTradeSum_(id);
  }
  function updTradeSum_(id) {
    var el = document.getElementById('qty_' + id), sum = document.getElementById('sum_' + id);
    if (!el || !sum) return;
    var q = Math.max(1, Math.floor(Number(el.value)) || 0);
    var it = marketItem_(id), st = it ? sellTotal_(it, q) : q * Number(sum.dataset.sell);
    var bt = it ? buyTotal_(it, q) : q * Number(sum.dataset.buy);
    var drop = it && q > 1 && st < q * it.sellPrice, rise = it && q > 1 && bt > q * it.buyPrice;
    sum.innerHTML = q + ' &times; &rarr; beli <b>' + formatGold(bt) + '</b> &middot; jual <b>' + formatGold(st) + '</b>' +
      (rise ? '<span class="glut-note" title="Setiap unit yang diborong menaikkan harga beli di kota ini">' + ic('alert') + ' harga beli naik saat memborong (rata-rata ' + formatGold(Math.round(bt / q)) + ')</span>' : '') +
      (drop ? '<span class="glut-note" title="Stok di kota ini makin menumpuk setiap unit yang kamu jual">' + ic('alert') + ' harga jual turun saat menjual banyak (rata-rata ' + formatGold(Math.round(st / q)) + ')</span>' : '');
  }

  function commodityIcon_(commodityId) { return goodIcon_(commodityId, true); }

  /** Badge harga vs BasePrice kota ini (sinyal buy-low-sell-high ala TW2). */
  function priceBadge_(ratio) {
    if (typeof ratio !== 'number') return '';
    if (ratio <= 90) return '<span class="price-badge good">▼ Harga Bagus</span>';
    if (ratio >= 115) return '<span class="price-badge bad">▲ Mahal</span>';
    return '<span class="price-badge normal">– Normal</span>';
  }

  /* ---------------- REKOR PRIBADI (localStorage, per browser) ---------------- */
  function personalBestKey_(cityId, commodityId) { return 'mt_best_' + cityId + '_' + commodityId; }
  function getPersonalBest_(cityId, commodityId) {
    try { var raw = localStorage.getItem(personalBestKey_(cityId, commodityId)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function recordPersonalBest_(cityId, commodityId, type, price) {
    var best = getPersonalBest_(cityId, commodityId) || {};
    if (type === 'buy' && (best.lowestBuy === undefined || price < best.lowestBuy)) best.lowestBuy = price;
    if (type === 'sell' && (best.highestSell === undefined || price > best.highestSell)) best.highestSell = price;
    try { localStorage.setItem(personalBestKey_(cityId, commodityId), JSON.stringify(best)); } catch (e) {}
  }
  function personalBestLine_(cityId, commodityId) {
    var best = getPersonalBest_(cityId, commodityId);
    if (!best) return '';
    var parts = [];
    if (best.lowestBuy !== undefined) parts.push('beli termurah ' + best.lowestBuy);
    if (best.highestSell !== undefined) parts.push('jual tertinggi ' + best.highestSell);
    return parts.length ? '<span class="personal-best">' + ic('star') + ' Rekormu: ' + parts.join(' &middot; ') + '</span>' : '';
  }

  function fillMaxQty(commodityId, qty) {
    var el = document.getElementById('qty_' + commodityId);

  function setMarketBusy(busy) { document.querySelectorAll('.mkt-action').forEach(function (b) { b.disabled = busy; }); }

  /**
   * LATENCY (Tide v3): beli/jual OPTIMISTIS - gold, isi palka & grid
   * langsung berubah saat diklik (0 ms), permintaan ke server masuk
   * antrean serial. Balasan server = sumber kebenaran (newGold); kalau
   * gagal, perubahan dibatalkan (rollback delta) + toast alasan.
   */
  /* ---- Tide v8: stok menumpuk (overstock) - harga jual turun per unit yang dijual ---- */
  /* ---- Tide v13: permintaan - harga beli naik per unit yang dibeli ---- */
  function demandUnit_(it, d) { return Math.round(it.buyNormal * Math.min(1 + it.demandCap, 1 + Math.max(0, d) / it.demandScale)); }
  function buyTotal_(it, q) {
    if (!it) return 0;
    if (!it.demandScale || !it.buyNormal) return q * it.buyPrice;
    var s = 0; for (var i = 0; i < q; i++) s += demandUnit_(it, (it.demand || 0) + i);
    return s;
  }
  function maxAffordable_(it, gold, space) {
    var n = 0, s = 0;
    while (n < space) { var u = it.demandScale && it.buyNormal ? demandUnit_(it, (it.demand || 0) + n) : it.buyPrice; if (u <= 0 || s + u > gold) break; s += u; n++; }
    return n;
  }
  function applyDemand_(it, delta) {
    if (!it || !it.demandScale) return;
    it.demand = Math.max(0, (it.demand || 0) + delta);
    it.buyPrice = demandUnit_(it, it.demand);
    it.scarcityPct = it.buyNormal > 0 ? Math.max(0, Math.round((it.buyPrice / it.buyNormal - 1) * 100)) : 0;
  }
  function glutUnit_(it, g) { return Math.max(Math.round(it.sellNormal * it.glutFloor), Math.round(it.sellNormal / (1 + g / it.glutScale))); }
  function sellTotal_(it, q) {
    if (!it) return 0;
    if (!it.glutScale || !it.sellNormal) return q * it.sellPrice;
    var s = 0; for (var i = 0; i < q; i++) s += glutUnit_(it, (it.glut || 0) + i);
    return s;
  }
  function applyGlut_(it, delta) {
    if (!it || !it.glutScale) return;
    it.glut = Math.max(0, (it.glut || 0) + delta);
    it.sellPrice = glutUnit_(it, it.glut);
    it.overstockPct = it.sellNormal > 0 ? Math.max(0, Math.round((1 - it.sellPrice / it.sellNormal) * 100)) : 0;
  }
  function marketItem_(id) { return marketCache ? marketCache.items.filter(function (i) { return i.commodityId === id; })[0] : null; }
  function doBuy(commodityId, unitPrice) {
    if (!canAct_() || !marketCache || !state.city) return;
    var qty = Math.max(1, Math.floor(Number(document.getElementById('qty_' + commodityId).value)) || 0);
    var cost = buyTotal_(marketItem_(commodityId), qty) || qty * unitPrice;
    if (cost > state.player.gold) { showToast('Gold tidak cukup untuk ' + qty + ' unit.', 'error'); return; }
    if (qty > marketCache.cargoSpaceRemaining) { showToast('Ruang palka tidak cukup (sisa ' + marketCache.cargoSpaceRemaining + ').', 'error'); return; }
    var cityId = state.city.CityId;
    recordPersonalBest_(cityId, commodityId, 'buy', Math.round(cost / qty));
    patchGold_(state.player.gold - cost);
    lastTrade = { id: commodityId, dir: 'buy', qty: qty };
    patchMarketCacheAfterTrade_(commodityId, qty, 'buy');
    delete panelCache['cargo:' + cityId];
    enqueueTx_(function (done) {
      google.script.run
        .withSuccessHandler(function (result) { if (!txQ.length && result && typeof result.newGold === 'number') patchGold_(result.newGold); done(); refreshCargoQuiet_(); saveSnap_(); })
        .withFailureHandler(function (err) {
          patchGold_(state.player.gold + cost);
          patchMarketCacheAfterTrade_(commodityId, qty, 'sell');
          showToast('Pembelian dibatalkan: ' + err.message, 'error');
          done(); refreshCargoQuiet_();
        })
        .api_buy(cityId, commodityId, qty);
    });
  }

  function doSell(commodityId, unitPrice) {
    if (!canAct_() || !marketCache || !state.city) return;
    var qty = Math.max(1, Math.floor(Number(document.getElementById('qty_' + commodityId).value)) || 0);
    var it = marketItem_(commodityId);
    if (!it || (it.ownedQty || 0) < qty) { showToast('Barang di palka tidak cukup.', 'error'); return; }
    var cityId = state.city.CityId, gain = sellTotal_(it, qty);
    recordPersonalBest_(cityId, commodityId, 'sell', Math.round(gain / qty));
    patchGold_(state.player.gold + gain);
    lastTrade = { id: commodityId, dir: 'sell', qty: qty };
    patchMarketCacheAfterTrade_(commodityId, qty, 'sell');
    delete panelCache['cargo:' + cityId];
    enqueueTx_(function (done) {
      google.script.run
        .withSuccessHandler(function (result) { if (!txQ.length && result && typeof result.newGold === 'number') patchGold_(result.newGold); done(); refreshCargoQuiet_(); saveSnap_(); })
        .withFailureHandler(function (err) {
          patchGold_(state.player.gold - gain);
          patchMarketCacheAfterTrade_(commodityId, qty, 'buy');
          showToast('Penjualan dibatalkan: ' + err.message, 'error');
          done(); refreshCargoQuiet_();
        })
        .api_sell(cityId, commodityId, qty);
    });
  }

  /** Patch lokal marketCache setelah beli/jual sukses. */
  function patchMarketCacheAfterTrade_(commodityId, qty, direction) {
    if (!marketCache) { renderMarket(); return; }
    var item = null;
    for (var i = 0; i < marketCache.items.length; i++) { if (marketCache.items[i].commodityId === commodityId) { item = marketCache.items[i]; break; } }
    if (!item) { renderMarket(); return; }
    applyGlut_(item, direction === 'buy' ? -qty : qty);
    applyDemand_(item, direction === 'buy' ? qty : -qty);
    if (direction === 'buy') {
      item.ownedQty = (item.ownedQty || 0) + qty;
      marketCache.cargoSpaceRemaining = Math.max(0, marketCache.cargoSpaceRemaining - qty);
    } else {
      item.ownedQty = Math.max(0, (item.ownedQty || 0) - qty);
      marketCache.cargoSpaceRemaining = marketCache.cargoSpaceRemaining + qty;
    }
    var cap = state.ship ? (state.ship.EffectiveCargo || state.ship.Cargo) : 0;
    if (cap) updateHoldHud_(Math.max(0, cap - marketCache.cargoSpaceRemaining));
    var qEl = document.getElementById('qty_' + commodityId);
    if (qEl) qEl.value = 1;
    renderMarketGrid_();
  }

  function renderVoyagePanel() {

    var destCity = cityById_(v.destinationCityId), originCity = cityById_(v.originCityId);
    var destName = destCity ? destCity.Name : v.destinationCityId;
    var originName = originCity ? originCity.Name : v.originCityId;
    var pct = Math.round(v.progress * 100);
    setModal_(panelHeader_('ship', 'Sedang Berlayar', esc_(originName) + ' &rarr; ' + esc_(destName)) +

      '<div class="card" style="margin-top:12px;"><div class="bar-label-row"><span>Progres</span><span class="v">' + pct + '% &middot; tiba dalam ' + formatEta(v.etaSeconds) + '</span></div>' +

      '<p class="muted small" style="text-align:center;">Panel ini diperbarui otomatis. Menu lain tetap bisa dibuka, tapi Market &amp; Library terkunci sampai kapal merapat.</p>');

  /** LATENCY: layar langsung berganti ke laut (optimistis), server dikonfirmasi di belakang. */
  function doSetSail(cityId) {
    if (!canAct_() || txPending || !state.city) return;
    txPending = true; voySeq++;
    var o = (lastSailOptions || []).filter(function (x) { return x.cityId === cityId; })[0];
    var prevVoyage = state.voyage;
    state.voyage = { inTransit: true, originCityId: state.city.CityId, destinationCityId: cityId, progress: 0, etaSeconds: o ? Math.round(o.etaMinutes * 60) : 60, encounterPending: false, encounter: null, _at: Date.now(), _optimistic: true };
    closeModal();
    renderSidebar(); renderScene();
    showToast('Sauh diangkat! Layar terkembang menuju ' + (o ? o.name : cityName_(cityId)) + '.', 'success');
    beginSync_();
    google.script.run
      .withSuccessHandler(function () {
        txPending = false; voySeq++;
        var seq = voySeq;
        google.script.run.withSuccessHandler(function (res) {
          endSync_();
          if (seq !== voySeq) return;
          if (res && res.voyage && res.voyage.inTransit) { state.voyage = res.voyage; state.voyage._at = Date.now(); renderSidebar(); renderScene(); schedulePreciseArrival_(); saveSnap_(); }
          else loadState();
        }).withFailureHandler(function () { endSync_(); if (state.voyage) state.voyage._optimistic = false; loadState(); }).api_pollVoyage();
      })
      .withFailureHandler(function (err) {
        txPending = false; endSync_(); voySeq++;
        // Server bilang kapal SUDAH berlayar (mis. klik ganda / tab lain) -> sinkronkan, jangan kembali ke pulau.
        if (/sudah dalam perjalanan|dicegat bajak laut/i.test(String(err && err.message))) { if (state.voyage) state.voyage._optimistic = false; loadState(); return; }
        state.voyage = prevVoyage;
        renderSidebar(); renderScene();
        showToast('Gagal berlayar: ' + err.message, 'error');
      })
      .api_setSail(cityId);
  }

  function formatMinutes(mins) {
    mins = Math.max(0, Math.round(mins));
    if (mins < 60) return mins + ' menit';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'j' + (m ? ' ' + m + 'm' : '');
  }
  function formatEta(sec) {
    if (sec <= 0) return 'sebentar lagi';
    if (sec < 60) return Math.ceil(sec) + ' detik';
    return formatMinutes(Math.ceil(sec / 60));
  }
  /** Kompatibilitas nama lama - sekarang diteruskan ke MTChart (SceneEngine.html). */

  /* ---------------- TASKS / GOVERNOR'S MISSIVE ---------------- */
  function renderTasks() {
    if (!state) return;

      return;
    }

    if (state.voyage && state.voyage.inTransit) { renderStub('Tasks', 'Kamu sedang berlayar - kunjungi Governor\'s Estate di pelabuhan untuk cari misi baru.', 'scroll'); return; }

    var cacheKey = 'missionBoard:' + state.city.CityId;
    var cached = panelCache[cacheKey];

  /** Kartu misi aktif dengan langkah-langkah yang jelas per jenis misi (Tide v8). */
  function activeMissionHtml_(m) {
    var here = state.city && !(state.voyage && state.voyage.inTransit) ? state.city.CityId : null;
    var loaded = m.loadedQty || 0, full = m.type === 'legacy' || loaded >= m.qty;
    var steps = [];
    if (m.type === 'courier') {
      steps.push({ done: true, t: 'Barang titipan dimuat di ' + esc_(m.originCityName || '') + ' &mdash; <b>' + m.qty + '&times; ' + esc_(m.commodityName) + '</b>' });
      steps.push({ done: false, now: here === m.deliverToCityId, t: 'Antar ke <b>' + esc_(m.deliverToCityName) + '</b> dan serahkan' });
    } else if (m.type === 'procure') {
      steps.push({ done: full, now: !full && here === m.sourceCityId, t: 'Beli <b>' + m.qty + '&times; ' + esc_(m.commodityName) + '</b> di <b>' + esc_(m.sourceCityName) + '</b> (hanya di pulau ini)' + (loaded && !full ? ' &middot; ' + loaded + '/' + m.qty : '') });
      steps.push({ done: false, now: full && here === m.deliverToCityId, t: 'Bawa pulang ke pemesan di <b>' + esc_(m.deliverToCityName) + '</b>' });
    } else {
      steps.push({ done: false, now: here === m.deliverToCityId, t: 'Antarkan <b>' + m.qty + '&times; ' + esc_(m.commodityName) + '</b> dari palkamu ke <b>' + esc_(m.deliverToCityName) + '</b>' });
    }
    var html = '<div class="card mission-active ' + esc_(m.type || '') + '">' +
      '<div class="ma-head">' + goodIcon_(m.commodityId) + '<div class="grow"><span class="badge ' + (m.type === 'procure' ? 'normal' : 'gold') + '">' + ic(m.type === 'procure' ? 'scales' : 'crate') + ' ' + esc_(m.typeLabel || 'Misi') + '</span>' +
        '<div class="ma-title">' + m.qty + '&times; ' + esc_(m.commodityName) + '</div>' +
        '<div class="reward small">' + ic('coin') + ' Imbalan ' + formatGold(m.reward) + ' gold &middot; +1 Standing di ' + esc_(m.deliverToCityName) + '</div></div></div>' +
      '<ol class="ma-steps">' + steps.map(function (s) { return '<li class="' + (s.done ? 'done' : (s.now ? 'now' : '')) + '"><span class="ms-dot">' + (s.done ? ic('check') : '') + '</span><span>' + s.t + '</span></li>'; }).join('') + '</ol>';
    if (m.type !== 'legacy' && loaded > 0) html += '<div class="ma-lock">' + ic('lock') + ' ' + loaded + ' unit muatan misi terkunci di palka &mdash; tidak bisa dijual, dititip, dipasang di Bursa, atau dirampas bajak laut.</div>';
    html += '<div class="ma-actions">';
    if (m.type === 'procure' && !full && here === m.sourceCityId) {
      var mi = marketCache && marketCache.cityId === here ? marketItem_(m.commodityId) : null, pre = panelCache['market:' + here];
      if (!mi && pre) mi = (pre.items || []).filter(function (x) { return x.commodityId === m.commodityId; })[0];
      var est = mi ? ' &middot; &plusmn;' + formatGold(mi.buyPrice * (m.qty - loaded)) + ' gold' : '';
      html += '<button class="btn btn-gold mission-action" onclick="doBuyForMission()">' + ic('scales') + '&nbsp; Beli Pesanan ' + (m.qty - loaded) + '&times;' + est + '</button>';
    } else if (full && here === m.deliverToCityId) {
      html += '<button class="btn btn-gold mission-action" onclick="doCompleteMission()">' + ic('check') + '&nbsp; Serahkan Muatan</button>';
    } else if (m.type === 'procure' && !full) {
      html += '<span class="muted small">' + ic('compass') + ' Berlayar ke ' + esc_(m.sourceCityName) + ' untuk membeli barang pesanan.</span>';
    } else {
      html += '<span class="muted small">' + ic('compass') + ' Berlayar ke ' + esc_(m.deliverToCityName) + ' untuk menyerahkan muatan.</span>';
    }
    html += '<button class="btn btn-sm btn-ghost-ink mission-action" onclick="doAbandonMission()">Batalkan</button></div></div>';
    return html;
  }
  function doBuyForMission() {
    if (!canAct_() || txPending) return;

    google.script.run
      .withSuccessHandler(function (r) {
        txPending = false; endSync_();
        patchGold_(r.newGold);
        state.mission = r.mission;
        invalidatePanelCache_(); marketCache = null;
        refreshCargoQuiet_();
        au_('coin', { n: 3 });
        showToast('Dibeli ' + r.bought + ' unit pesanan (' + formatGold(r.totalCost) + ' gold). Muatan dikunci - antar ke ' + r.mission.deliverToCityName + '.', 'success');
        renderScene(); if (currentPanel === 'tasks') renderTasks(); saveSnap_();
      })
      .withFailureHandler(function (err) {
        txPending = false; endSync_();
        document.querySelectorAll('.mission-action').forEach(function (b) { b.disabled = false; });
        var el = document.getElementById('taskMsg'); if (el) el.textContent = err.message;
        showToast(err.message, 'error');
      })
      .api_buyForMission();
  }

        '<div class="grow"><div class="mo-top"><span class="badge ' + (proc ? 'normal' : 'gold') + '">' + ic(proc ? 'scales' : 'crate') + ' ' + esc_(o.typeLabel || (proc ? 'Pesanan' : 'Titipan')) + '</span><b class="mo-label">' + esc_(o.label) + '</b></div>' +

  function doAcceptMission(offerIndex) {
    if (!canAct_() || txPending || !state.city) return;
    txPending = true;
    var board = panelCache['missionBoard:' + state.city.CityId] || {};
    var o = (board.offers || []).filter(function (x) { return x.offerIndex === offerIndex; })[0];
    var prev = state.mission;
    if (o) {
      var dest = o.deliverToCityId || ((state.cities || []).filter(function (c) { return c.Name === o.deliverToCityName; })[0] || {}).CityId;
      state.mission = { hasActive: true, type: o.type || 'courier', typeLabel: o.typeLabel || '', qty: o.qty, loadedQty: o.type === 'courier' ? o.qty : 0, commodityId: o.commodityId, commodityName: o.commodityName,
        originCityId: state.city.CityId, originCityName: state.city.Name, sourceCityId: o.sourceCityId || '', sourceCityName: o.sourceCityName || '', deliverToCityId: dest, deliverToCityName: o.deliverToCityName, reward: o.reward };
      renderTasks(); renderScene();
      showToast('Misi diterima: ' + o.label + '.', 'success');
    }
    document.querySelectorAll('.mission-action').forEach(function (b) { b.disabled = true; });
    beginSync_();
    google.script.run
      .withSuccessHandler(function () {
        txPending = false;
        invalidatePanelCache_(); marketCache = null; refreshCargoQuiet_();
        google.script.run.withSuccessHandler(function (ms) { endSync_(); if (ms) { state.mission = ms; renderScene(); if (currentPanel === 'tasks') renderTasks(); saveSnap_(); } })
          .withFailureHandler(function () { endSync_(); loadState(); }).api_getMissionState();
        delete panelCache['missionBoard:' + state.city.CityId];
      })
      .withFailureHandler(function (err) {
        txPending = false; endSync_();
        state.mission = prev; renderScene();
        if (currentPanel === 'tasks') renderTasks();
        showToast(err.message, 'error');
      })
      .api_acceptMission(state.city.CityId, offerIndex);
  }
  function doAbandonMission() {
    if (txPending) return;

      .withSuccessHandler(function (r) { txPending = false; if (r && r.note) showToast('Misi dibatalkan. ' + r.note, 'success'); invalidatePanelCache_(); marketCache = null; refreshCargoQuiet_(); loadState(); })
      .withFailureHandler(function (err) { txPending = false; var el = document.getElementById('taskMsg'); if (el) el.textContent = err.message; })

      .withFailureHandler(function (err) { txPending = false; var el = document.getElementById('taskMsg'); if (el) el.textContent = err.message; })

  function setAmt_(id, v) { var el = document.getElementById(id); if (el) { el.value = Math.max(0, Math.floor(v)); el.focus(); } }

  /** LATENCY: saldo langsung berubah (optimistis); balasan server = sumber kebenaran. */
  function bankAction_(fnName, inputId) {
    if (!canAct_()) return;
    var amount = Math.floor(Number(document.getElementById(inputId).value)) || 0;
    var msg = document.getElementById('bankMsg');
    function fail(t) { if (msg) msg.textContent = t; showToast(t, 'error'); }
    if (amount <= 0) return fail('Masukkan jumlah gold dulu.');
    var b = state.bank || { bankBalance: 0, debtBalance: 0 };
    var g = state.player.gold;
    var nb = JSON.parse(JSON.stringify(b)), ng = g;
    if (fnName === 'api_bankDeposit') { if (amount > g) return fail('Gold di tangan tidak cukup.'); ng = g - amount; nb.bankBalance = (b.bankBalance || 0) + amount; }
    else if (fnName === 'api_bankWithdraw') { if (amount > (b.bankBalance || 0)) return fail('Saldo bank tidak cukup.'); ng = g + amount; nb.bankBalance = b.bankBalance - amount; }
    else if (fnName === 'api_bankBorrow') { if (b.maxDebt && (b.debtBalance || 0) + amount > b.maxDebt) return fail('Melebihi batas pinjaman (' + formatGold(b.maxDebt) + ').'); ng = g + amount; nb.debtBalance = (b.debtBalance || 0) + amount; }
    else if (fnName === 'api_bankRepay') { amount = Math.min(amount, b.debtBalance || 0, g); if (amount <= 0) return fail('Tidak ada utang yang bisa dibayar.'); ng = g - amount; nb.debtBalance = b.debtBalance - amount; }
    nb.newGold = ng;
    patchBank_(nb);
    renderBank();
    enqueueTx_(function (done) {
      google.script.run
        .withSuccessHandler(function (bankState) {
          if (!txQ.length && bankState) { patchBank_(bankState); if (currentPanel === 'bank') renderBank(); }
          done(); saveSnap_();
        })
        .withFailureHandler(function (err) { showToast('Transaksi bank dibatalkan: ' + err.message, 'error'); done(); loadState(); })[fnName](amount);
    });
  }
  function doBankDeposit() { bankAction_('api_bankDeposit', 'bankAmount'); }
  function doBankWithdraw() { bankAction_('api_bankWithdraw', 'bankAmount'); }
  function doBankBorrow() { bankAction_('api_bankBorrow', 'debtAmount'); }

  /* ================================================================

  var COMBAT_TACTICS = [
    { key: 'fire', icon: 'cannon', label: 'Tembak' }, { key: 'reload', icon: 'reload', label: 'Reload' },

    unknown: { icon: 'swords', title: 'Pertempuran Selesai', cls: 'neutral' }
  };

  var combatRoundLog = [];
  var combatEncounterKey = null;
  var combatBattleStats = null; // { startGold, startCondition, roundsFought }
  var combatSceneOpen = false;

  var cvCanvas = null, cvCtx = null, cvRafId = null, cvTime = 0, cvLast = 0, cvDpr = 1, cvW = 0, cvH = 0;
  var cvParticles = [], cvProjectiles = [], cvFloatingTexts = [], cvFlashes = [];
  var cvShakeTimer = 0;
  var cvPlayerShip = { x: 0, y: 0, s: 1, bob: 0, dx: 0 };
  var cvEnemyShip = { x: 0, y: 0, s: 1, bob: 0, dx: 0 };
  var cvHpPct = { player: 100, enemy: 100 };
  var cvHorizonY = 0;
  var cvClouds = [], cvGlitter = [], cvStars = [];
  var cvPal = null, cvPalAt = 0;
  var cvLightningTimer = 4, cvLightningFlash = 0, cvBolt = null;
  var cvOutcome = null; // { kind: 'won'|'sunk'|'fled'|'bribed'|'negotiated', t }
  var cvResizeBound_ = false;

  function cvInitClouds_() {
    var r = MTUtil.rng(Math.floor(Math.random() * 1e6));
    cvClouds = MTSky.makeClouds(r, 8);
    cvGlitter = MTSky.makeGlitter(r);
    cvStars = [];
    for (var i = 0; i < 160; i++) cvStars.push({ x: r(), y: Math.pow(r(), 1.4) * 0.9, r: r() < 0.9 ? 1 : 1.8, tw: 0.5 + r() * 2, ph: r() * 6.28 });
  }

  function cvResize_() {
    if (!cvCanvas) return;
    var wrap = document.getElementById('combatOverlay');
    cvW = Math.max(300, wrap.clientWidth); cvH = Math.max(240, wrap.clientHeight);
    cvDpr = Math.min(window.devicePixelRatio || 1, cvW * cvH > 1500000 ? 1.25 : 1.6);
    cvCanvas.width = Math.round(cvW * cvDpr);
    cvCanvas.height = Math.round(cvH * cvDpr);
    cvHorizonY = cvH * 0.42;
    var narrow = cvW < 700;
    var s = Math.min(cvW * (narrow ? 0.0034 : 0.0024), cvH * 0.0034);
    cvPlayerShip.x = cvW * (narrow ? 0.3 : 0.29); cvPlayerShip.y = cvH * 0.8; cvPlayerShip.s = s;
    cvEnemyShip.x = cvW * (narrow ? 0.72 : 0.71); cvEnemyShip.y = cvH * 0.6; cvEnemyShip.s = s * 0.68;
    if (!cvClouds.length) cvInitClouds_();
  }

  function cvSpawnParticle_(x, y, vx, vy, color, radius, decay, grav, extra) {
    var life = 1 / Math.max(0.004, decay) / 60;
    var p = { x: x, y: y, vx: vx, vy: vy, col: color, r: radius, life: life, max: life, g: grav || 0 };
    if (extra) for (var k in extra) p[k] = extra[k];
    cvParticles.push(p);
  }
  function cvSmoke_(x, y, n, dirX) {
    for (var i = 0; i < n; i++) cvSpawnParticle_(x, y, (dirX || 0) * (0.6 + Math.random()) + (Math.random() - 0.5) * 0.9, -0.3 - Math.random() * 0.7, 'rgba(225,222,215,A)', 4 + Math.random() * 6, 0.008 + Math.random() * 0.006, -0.004, { grow: 0.16, a: 0.55 });
  }
  function cvSpawnMuzzleSmoke_(x, y, dirX) {
    cvFlashes.push({ x: x, y: y, life: 0.16, max: 0.16, r: 34 });
    cvSmoke_(x, y, 10, dirX || 1);
    for (var i = 0; i < 8; i++) cvSpawnParticle_(x, y, (dirX || 1) * (2 + Math.random() * 3), (Math.random() - 0.5) * 1.6, 'rgba(255,200,90,A)', 1.4, 0.06, 0.02, { add: true });
  }
  function cvSpawnImpactBurst_(x, y) {
    cvFlashes.push({ x: x, y: y, life: 0.2, max: 0.2, r: 46 });
    for (var i = 0; i < 26; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * 5 + 2;
      cvSpawnParticle_(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 1, 'rgba(255,170,40,A)', 2.2, 0.035, 0.05, { add: true });
    }
    for (var j = 0; j < 14; j++) {
      var a2 = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, sp2 = Math.random() * 4 + 2;
      cvSpawnParticle_(x, y, Math.cos(a2) * sp2, Math.sin(a2) * sp2, 'rgba(120,78,40,A)', 1.8 + Math.random() * 1.5, 0.018, 0.16, { sq: true });
    }
    cvSmoke_(x, y, 8, 0);
  }
  function cvSpawnSplash_(x, y) {
    for (var i = 0; i < 26; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * 0.9, sp = Math.random() * 5 + 3;
      cvSpawnParticle_(x, y, Math.cos(a) * sp * 0.6, Math.sin(a) * sp, 'rgba(225,240,250,A)', 2 + Math.random() * 1.5, 0.022, 0.2);
    }
  }
  function cvSpawnSparkle_(x, y, color) {
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2, sp = Math.random() * 2 + 0.5;
      cvSpawnParticle_(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 1, (color || 'rgba(244,211,116,A)'), 2, 0.02, -0.02, { add: true });
    }
  }
  function cvFloatText_(text, x, y, color) { cvFloatingTexts.push({ text: String(text), x: x, y: y, life: 1.4, vy: -0.9, color: color || '#ff5a3c' }); }

  /** Proyektil parabola; onImpact dipanggil sekali saat mendarat. */
  function cvLaunchProjectile_(sx, sy, tx, ty, onImpact, delay) {
    var dist = Math.hypot(tx - sx, ty - sy);
    cvProjectiles.push({ sx: sx, sy: sy, tx: tx, ty: ty, progress: -(delay || 0), speed: 1.6 / Math.max(0.5, dist / 500), apex: Math.min(160, dist * 0.22), onImpact: onImpact, impacted: false, trail: 0 });
  }

  /** Posisi lubang meriam ke-k di layar untuk kapal (sisi yang menghadap musuh). */
  function cvGunPort_(sh, dir, k) {
    var lx = -30 + k * 13, ly = -9;
    return { x: sh.x + sh.dx + lx * sh.s * dir, y: sh.y + sh.bob + ly * sh.s };
  }
  function cvHullPoint_(sh, dir) {
    return { x: sh.x + sh.dx + (Math.random() * 70 - 35) * sh.s * dir, y: sh.y + sh.bob + (-6 - Math.random() * 14) * sh.s };
  }
  function shadeColor_(hex, amt) { return MTUtil.shade(hex, amt); }

  function cvDrawShip_(sh, isEnemy, pal, t) {
    var dir = isEnemy ? -1 : 1;
    var hp = isEnemy ? cvHpPct.enemy : cvHpPct.player;
    var sinkT = cvOutcome && ((cvOutcome.kind === 'won' && isEnemy) || (cvOutcome.kind === 'sunk' && !isEnemy)) ? cvOutcome.t : 0;
    var leaveT = cvOutcome && (((cvOutcome.kind === 'bribed' || cvOutcome.kind === 'negotiated') && isEnemy) || (cvOutcome.kind === 'fled' && !isEnemy)) ? cvOutcome.t : 0;
    var x = sh.x + sh.dx + (leaveT ? (isEnemy ? 1 : -1) * leaveT * leaveT * cvW * 0.12 : 0);
    var y = sh.y + sh.bob;
    var roll = Math.sin(t * (isEnemy ? 0.9 : 1.1) + (isEnemy ? 1 : 0)) * 0.04 + (hp < 25 ? dir * 0.05 : 0);
    var sink = 0;
    if (sinkT) { sink = Math.min(1, sinkT / 2.4); roll += dir * sink * 0.35; y += sink * sink * 170 * sh.s; }
    var bossEnc = isEnemy && state && state.voyage && state.voyage.encounter && state.voyage.encounter.boss;
    var opts = bossEnc
      ? { dir: dir, t: t, masts: 3, hull: '#171112', trim: '#c9a033', sail: '#6e1810', flag: '#111111', flagShape: 'flame', emblem: 'skull', emblemColor: '#e8bf55', pennant: '#b3261e', ports: 7, muzzles: true, railGuns: true, chaser: true, gilded: true, rivets: true, sizeK: 1.22, studding: 2, streamers: true, lit: pal.lit, lanterns: Math.max(0.35, pal.lights), damage: Math.max(0, (70 - hp) / 70), roll: roll }
      : isEnemy
      ? { dir: dir, t: t, masts: 3, hull: '#2b1d16', trim: '#7a6440', sail: '#4d4843', flag: '#111111', flagType: 'skull', pennant: '#6e1d14', lit: pal.lit, lanterns: Math.max(0.35, pal.lights), damage: Math.max(0, (70 - hp) / 70), roll: roll }
      : Object.assign(myShipOpts_(), { dir: dir, t: t, lit: pal.lit, lanterns: Math.max(0.35, pal.lights), damage: Math.max(0, (70 - hp) / 70), roll: roll });

    var ctx = cvCtx;
    // pantulan
    if (!sinkT) {
      ctx.save(); ctx.globalAlpha = 0.16;
      var ro = {}; for (var k in opts) ro[k] = opts[k]; ro.reflect = true; ro.roll = -roll;
      MTShip.draw(ctx, x, y + 6 * sh.s, sh.s, ro); ctx.restore();
    }
    ctx.save();
    if (sinkT) { ctx.beginPath(); ctx.rect(0, 0, cvW, sh.y + sh.bob + 5 * sh.s); ctx.clip(); }
    MTShip.draw(ctx, x, y, sh.s, opts);
    ctx.restore();
    MTShip.foam(ctx, x, sh.y + sh.bob, sh.s, dir, t, leaveT ? 1 : 0.25, sinkT ? 1 - sink : 1);

    // api & asap di kapal rusak
    if (hp < 55 && !sinkT) {
      var nF = hp < 25 ? 3 : 1;
      for (var f = 0; f < nF; f++) {
        var fx = x + (-20 + f * 22) * sh.s * dir, fy = y - 22 * sh.s;
        var fl = 0.7 + Math.sin(t * 14 + f * 2) * 0.2 + Math.sin(t * 9 + f) * 0.1;
        var g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 22 * sh.s * fl);
        g.addColorStop(0, 'rgba(255,210,110,' + 0.85 * fl + ')'); g.addColorStop(0.5, 'rgba(255,110,30,' + 0.4 * fl + ')'); g.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(fx - 24 * sh.s, fy - 24 * sh.s, 48 * sh.s, 48 * sh.s); ctx.globalCompositeOperation = 'source-over';
        if (Math.random() < 0.35) cvSpawnParticle_(fx, fy - 4, (Math.random() - 0.5) * 0.4 - dir * 0.2, -0.6 - Math.random() * 0.5, 'rgba(40,36,34,A)', 3 * sh.s + 2, 0.007, -0.003, { grow: 0.12, a: 0.55 });
        if (Math.random() < 0.3) cvSpawnParticle_(fx, fy, (Math.random() - 0.5) * 0.8, -1 - Math.random(), 'rgba(255,160,50,A)', 1.2, 0.03, -0.01, { add: true });
      }
    }
    if (sinkT && Math.random() < 0.5) cvSpawnParticle_(x + (Math.random() - 0.5) * 80 * sh.s, sh.y + sh.bob + 2, 0, -0.6 - Math.random(), 'rgba(230,242,250,A)', 1.5 + Math.random() * 2, 0.03, 0);
  }

  function cvRenderLoop_(ts) {
    if (!cvCanvas || !combatSceneOpen) { cvRafId = null; return; }
    cvRafId = requestAnimationFrame(cvRenderLoop_);
    ts = ts || performance.now();
    var dt = cvLast ? Math.min(50, ts - cvLast) : 16; cvLast = ts;
    var sec = dt / 1000;
    cvTime += sec;
    var t = cvTime, ctx = cvCtx, W = cvW, H = cvH, hy = cvHorizonY;
    if (!cvPal || ts - cvPalAt > 1500) {
      cvPal = MTSky.palette(dayFrac_(), 'encounter'); cvPalAt = ts;
      // Cahaya bulan: pertempuran malam tetap terbaca (kapal tidak tenggelam dalam gelap).
      if (cvPal.night > 0.3) { var mf = Math.min(1, cvPal.night) * 0.45; cvPal.tint = MTUtil.mix(cvPal.tint, [196, 204, 228], mf); cvPal.seaH = MTUtil.mix(cvPal.seaH, [70, 86, 120], mf * 0.6); }
    }
    var pal = cvPal;
    if (cvOutcome) cvOutcome.t += sec;

    ctx.setTransform(cvDpr, 0, 0, cvDpr, 0, 0);
    ctx.save();
    if (cvShakeTimer > 0) { ctx.translate((Math.random() - 0.5) * cvShakeTimer, (Math.random() - 0.5) * cvShakeTimer); cvShakeTimer = Math.max(0, cvShakeTimer - dt * 0.05); }

    MTSky.paintSky(ctx, W, hy, pal, t, cvStars);
    MTSky.paintClouds(ctx, W, hy, pal, cvClouds, dt, 2.5);
    ctx.fillStyle = MTUtil.css(pal.cloudD, 0.3); ctx.fillRect(0, 0, W, hy * 0.45);

    // kilat sesekali (atmosfer)
    cvLightningTimer -= sec;
    if (cvLightningTimer <= 0) { cvLightningFlash = 0.6 + Math.random() * 0.3; cvLightningTimer = 5 + Math.random() * 8; cvBolt = null; var bx = W * (0.15 + Math.random() * 0.7), by = 0; cvBolt = [[bx, 0]]; while (by < hy * 0.9) { by += hy * (0.06 + Math.random() * 0.08); bx += (Math.random() - 0.5) * hy * 0.14; cvBolt.push([bx, by]); } }

    MTScene.ridge(ctx, W * 0.55, W * 1.15, hy + 1, H * 0.035, 555, MTUtil.css(pal.mountainFar), 1.3);
    MTScene.ridge(ctx, -W * 0.1, W * 0.3, hy + 1, H * 0.02, 556, MTUtil.css(MTUtil.mix(pal.mountainFar, pal.hor, 0.4)), 1);
    MTSky.paintSea(ctx, W, H, hy, pal, t, { glitter: cvGlitter, rough: 1.9, drift: 12 });

    cvPlayerShip.bob = Math.sin(t * 1.2) * cvH * 0.004;
    cvEnemyShip.bob = Math.cos(t * 0.95) * cvH * 0.003;
    cvDrawShip_(cvEnemyShip, true, pal, t);

    // proyektil (di antara kapal musuh & kapal pemain supaya layering terasa 2.5D)
    for (var pi = cvProjectiles.length - 1; pi >= 0; pi--) {
      var p = cvProjectiles[pi];
      p.progress += p.speed * sec;
      if (p.progress < 0) continue;
      var tt = Math.min(1, p.progress);
      var cx = p.sx + (p.tx - p.sx) * tt, gy = p.sy + (p.ty - p.sy) * tt;
      var by2 = gy - Math.sin(tt * Math.PI) * p.apex;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(cx, gy + 4, 6, 2.5, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(cx, by2, 3.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,160,.5)'; ctx.beginPath(); ctx.arc(cx - 1, by2 - 1, 1.2, 0, 6.3); ctx.fill();
      p.trail += dt; if (p.trail > 30) { p.trail = 0; cvSpawnParticle_(cx, by2, 0, -0.1, 'rgba(210,210,205,A)', 2, 0.03, 0, { grow: 0.05, a: 0.4 }); }
      if (p.progress >= 1 && !p.impacted) { p.impacted = true; if (p.onImpact) p.onImpact(p.tx, p.ty); cvProjectiles.splice(pi, 1); }
    }

    cvDrawShip_(cvPlayerShip, false, pal, t);

    // partikel
    for (var qi = cvParticles.length - 1; qi >= 0; qi--) {
      var pt = cvParticles[qi];
      pt.life -= sec;
      if (pt.life <= 0) { cvParticles.splice(qi, 1); continue; }
      var k = dt / 16;
      pt.x += pt.vx * k; pt.y += pt.vy * k; pt.vy += pt.g * k; if (pt.grow) pt.r += pt.grow * k;
      var a = Math.max(0, pt.life / pt.max) * (pt.a || 1);
      if (pt.add) ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = pt.col.replace('A)', a.toFixed(3) + ')');
      if (pt.sq) ctx.fillRect(pt.x, pt.y, pt.r * 1.6, pt.r * 0.8);
      else { ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(0.3, pt.r), 0, 6.3); ctx.fill(); }
      if (pt.add) ctx.globalCompositeOperation = 'source-over';
    }
    if (cvParticles.length > 1400) cvParticles.splice(0, cvParticles.length - 1400);

    // kilatan moncong meriam / ledakan
    ctx.globalCompositeOperation = 'lighter';
    for (var fi = cvFlashes.length - 1; fi >= 0; fi--) {
      var fl = cvFlashes[fi]; fl.life -= sec;
      if (fl.life <= 0) { cvFlashes.splice(fi, 1); continue; }
      var fa = fl.life / fl.max, rr = fl.r * (1.4 - fa * 0.4);
      var g = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, rr);
      g.addColorStop(0, 'rgba(255,245,200,' + fa + ')'); g.addColorStop(0.35, 'rgba(255,170,60,' + fa * 0.7 + ')'); g.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = g; ctx.fillRect(fl.x - rr, fl.y - rr, rr * 2, rr * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // teks damage mengambang
    for (var ti = cvFloatingTexts.length - 1; ti >= 0; ti--) {
      var ft = cvFloatingTexts[ti];
      ft.y += ft.vy * dt / 16; ft.life -= sec;
      if (ft.life <= 0) { cvFloatingTexts.splice(ti, 1); continue; }
      var pop = Math.min(1, (1.4 - ft.life) * 6);
      ctx.save();
      ctx.globalAlpha = Math.min(1, ft.life * 1.4);
      ctx.translate(ft.x, ft.y); ctx.scale(0.6 + pop * 0.5, 0.6 + pop * 0.5);
      ctx.font = '900 26px Cinzel, Georgia, serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.strokeText(ft.text, 0, 0);
      ctx.fillStyle = ft.color; ctx.fillText(ft.text, 0, 0);
      ctx.restore();
    }

    if (cvLightningFlash > 0) {
      if (cvBolt && cvLightningFlash > 0.5) {
        ctx.strokeStyle = 'rgba(235,240,255,' + cvLightningFlash + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); cvBolt.forEach(function (b, i) { if (!i) ctx.moveTo(b[0], b[1]); else ctx.lineTo(b[0], b[1]); }); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(220,230,255,' + (cvLightningFlash * 0.3) + ')'; ctx.fillRect(0, 0, W, H);
      cvLightningFlash -= sec * 3;
    }
    ctx.restore();
  }

  /** Salvo 3 peluru dari lubang meriam `from` ke lambung `to`. hit=true -> ledakan; false -> percikan air. */
  function cvVolley_(from, fromDir, to, toDir, hit, onFirstImpact) {
    var first = true;
    for (var k = 0; k < 3; k++) {
      (function (k) {
        var gp = cvGunPort_(from, fromDir, 1 + k * 2);
        setTimeout(function () { cvSpawnMuzzleSmoke_(gp.x, gp.y, fromDir); }, k * 130);
        var tp = cvHullPoint_(to, toDir);
        if (!hit) { tp.x += (Math.random() < 0.5 ? -1 : 1) * (30 + Math.random() * 50) * to.s; tp.y = to.y + to.bob + (8 + Math.random() * 16) * to.s; }
        cvLaunchProjectile_(gp.x, gp.y, tp.x, tp.y, function (tx, ty) {
          if (hit) { cvSpawnImpactBurst_(tx, ty); } else { cvSpawnSplash_(tx, ty); }
          if (first) { first = false; if (onFirstImpact) onFirstImpact(tx, ty); }
        }, k * 0.13);
      })(k);
    }
  }

  function doCombatAction_(tactic) {
    if (txPending || cvOutcome) return;
    var fireBtn = document.querySelector('.combat-action-btn[data-tactic="fire"]');
    if (tactic === 'fire' && fireBtn && fireBtn.classList.contains('disabled')) return;

    txPending = true;
    setCombatBarBusy_(true);
    // FX optimistis
    if (tactic === 'fire') { var gp = cvGunPort_(cvPlayerShip, 1, 3); cvFlashes.push({ x: gp.x, y: gp.y, life: 0.12, max: 0.12, r: 20 }); }
    if (tactic === 'ram') { cvPlayerShip.dx += cvW * 0.05; shakeScreen_(10); }
    if (tactic === 'reload') cvSpawnSparkle_(cvPlayerShip.x, cvPlayerShip.y - 40 * cvPlayerShip.s, 'rgba(126,200,240,A)');
    if (tactic === 'bribe' || tactic === 'negotiate') cvSpawnSparkle_(cvPlayerShip.x, cvPlayerShip.y - 40 * cvPlayerShip.s, 'rgba(244,211,116,A)');

    var prevEnemyHp = state.voyage.encounter ? state.voyage.encounter.enemyHp : 0;
    var prevCondition = Math.round((state.ship && state.ship.Condition) || 0);

    google.script.run
      .withSuccessHandler(function (result) {
        txPending = false;
        setCombatBarBusy_(false);
        if (tactic === 'ram') cvPlayerShip.dx = 0;

        if (result.ongoing) {
          combatRoundLog.unshift(result.message);
          state.voyage.encounter = result.encounter;
          combatBattleStats.roundsFought++;
          patchGold_(result.newGold);
          renderSidebar();
          google.script.run.withSuccessHandler(function (shipData) {
            patchShip_(shipData.ship, shipData.visual);
            applyCombatRoundFx_(prevEnemyHp, prevCondition, result, tactic);
          }).withFailureHandler(function () {
            applyCombatRoundFx_(prevEnemyHp, prevCondition, result, tactic);
          }).api_getShipState();
          return;
        }

        combatBattleStats.roundsFought++;
        var enc = state.voyage.encounter || {};
        applyCombatRoundFx_(prevEnemyHp, prevCondition, {
          encounter: { enemyHp: result.result === 'won' ? 0 : prevEnemyHp, ammoRemaining: 0, round: enc.round || 1, maxAmmo: enc.maxAmmo || 3 },
          message: result.message
        }, tactic, true);
        var kind = result.result;
        setTimeout(function () {
          cvOutcome = { kind: kind, t: 0 };
          if (kind === 'won') { cvHpPct.enemy = 0; for (var i = 0; i < 3; i++) setTimeout(function () { cvSpawnImpactBurst_(cvEnemyShip.x + (Math.random() - 0.5) * 60 * cvEnemyShip.s, cvEnemyShip.y - 20 * cvEnemyShip.s); }, i * 220); }
          if (kind === 'sunk') { cvHpPct.player = 0; shakeScreen_(16); }
        }, tactic === 'fire' ? 650 : 250);
        setTimeout(function () { renderBattleSummary_(result); }, (kind === 'won' || kind === 'sunk') ? 2400 : 1600);
      })
      .withFailureHandler(function (err) {
        txPending = false;
        setCombatBarBusy_(false);
        if (tactic === 'ram') cvPlayerShip.dx = 0;
        showToast(err.message, 'error');
      })
      .api_resolveCombat(tactic);
  }

  /** Update HUD + FX dampak SETELAH server konfirmasi ronde ini. */
  function applyCombatRoundFx_(prevEnemyHp, prevCondition, result, tactic, isFinalRound) {
    var enemy = result.encounter;
    var ship = state.ship || {};
    var enemyDamage = prevEnemyHp - (enemy.enemyHp != null ? enemy.enemyHp : prevEnemyHp);
    var conditionDelta = Math.round(ship.Condition || 0) - prevCondition;

    function hudUpdate() { if (!isFinalRound) updateCombatHud_(enemy, ship); }

    if (tactic === 'fire') {
      cvVolley_(cvPlayerShip, 1, cvEnemyShip, -1, enemyDamage > 0, function (tx, ty) {
        if (enemyDamage > 0) {
          shakeScreen_(8);
          cvFloatText_('-' + enemyDamage, cvEnemyShip.x, cvEnemyShip.y - 70 * cvEnemyShip.s, '#ff7a55');
          spawnDamagePopup_('combatEnemyBarWrap', '-' + enemyDamage, 'enemy-side');
          flashBar_('combatEnemyBar');
        } else {
          cvFloatText_('MELESET', cvEnemyShip.x, cvEnemyShip.y - 70 * cvEnemyShip.s, '#cfe3ec');
        }
        hudUpdate();
      });
    } else {
      if (tactic === 'ram' && enemyDamage > 0) { cvSpawnImpactBurst_(cvEnemyShip.x - 40 * cvEnemyShip.s, cvEnemyShip.y - 10 * cvEnemyShip.s); shakeScreen_(18); }
      if (enemyDamage > 0) {
        cvFloatText_('-' + enemyDamage, cvEnemyShip.x, cvEnemyShip.y - 70 * cvEnemyShip.s, '#ff7a55');
        spawnDamagePopup_('combatEnemyBarWrap', '-' + enemyDamage, 'enemy-side');
        flashBar_('combatEnemyBar');
      }
      hudUpdate();
    }

    if (conditionDelta < 0) {
      setTimeout(function () {
        cvVolley_(cvEnemyShip, -1, cvPlayerShip, 1, true, function () {
          cvFloatText_(conditionDelta, cvPlayerShip.x, cvPlayerShip.y - 90 * cvPlayerShip.s, '#ff5a3c');
          spawnDamagePopup_('combatShipBarWrap', conditionDelta, 'player-side');
          flashBar_('combatShipBar');
          shakeScreen_(14);
        });
      }, tactic === 'fire' ? 700 : 250);
    } else if (conditionDelta > 0) {
      spawnDamagePopup_('combatShipBarWrap', '+' + conditionDelta, 'player-side heal');
    }

    if (!isFinalRound) {
      var logStrip = document.getElementById('combatLogBox');
      if (logStrip) {
        var p = document.createElement('p');
        p.textContent = String(result.message || '').replace(/^Ronde \d+: /, '');
        logStrip.insertBefore(p, logStrip.firstChild);
      }
    }
  }

    var stats = combatBattleStats || { startGold: state.player.gold, startCondition: 0, roundsFought: 1 };

      '<h2 class="summary-title ' + meta.cls + '">' + meta.title + '</h2>' +
      '<p class="summary-flavor">' + esc_(result.message) + '</p></div>' +
      '<div class="summary-stat-grid">' +
        '<div class="summary-stat-row"><span class="summary-stat-label">Gold</span><span class="summary-stat-value ' + (goldDelta >= 0 ? 'positive' : 'negative') + '">' + (goldDelta >= 0 ? '+' : '') + formatGold(goldDelta) + '</span></div>' +
        '<div class="summary-stat-row"><span class="summary-stat-label">Kondisi Kapal</span><span class="summary-stat-value ' + (conditionDelta >= 0 ? 'positive' : 'negative') + '">' + (conditionDelta >= 0 ? '+' : '') + conditionDelta + '</span></div>' +
        '<div class="summary-stat-row"><span class="summary-stat-label">Ronde</span><span class="summary-stat-value">' + stats.roundsFought + '</span></div>' +
        '<div class="summary-stat-row"><span class="summary-stat-label">Gold Sekarang</span><span class="summary-stat-value">' + formatGold(result.newGold) + '</span></div>' +
      '</div>';
    if (result.lootItem) {
      html += '<div class="summary-loot-card">' + ic('map') + '<span>Rampasan: <b>' + esc_(result.lootItem.name) + '</b><br><span class="muted small">cek panel Items</span></span></div>';
    }
    html += '<button class="btn btn-gold btn-lg" onclick="finishBattleSummary_()" style="width:100%;">Lanjutkan Pelayaran <span class="kbd">Enter</span></button></div>';
    document.getElementById('combatSummaryContent').innerHTML = html;
    document.getElementById('combatSummaryBackdrop').classList.add('open');
  }
