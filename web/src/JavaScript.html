  var GAME_NAME = 'Marantau';

  /* ---------- indikator sinkron + antrean transaksi (optimistic UI) ---------- */
  var syncCount = 0, stateFresh = false;
  function beginSync_() { syncCount++; updSync_(); }
  function endSync_() { syncCount = Math.max(0, syncCount - 1); updSync_(); }
  function updSync_() {
    var el = document.getElementById('syncDot');
    if (!el) return;
    var on = syncCount > 0 || !stateFresh;
    el.classList.toggle('on', on);
    el.title = on ? 'Menyimpan ke server…' : 'Tersimpan';
  }
  var txQ = [], txRunning = false;
  /** Aksi dijalankan SERIAL ke server (urutan terjamin), UI sudah berubah duluan. */
  function enqueueTx_(fn) { txQ.push(fn); beginSync_(); runTxQ_(); }
  function runTxQ_() {
    if (txRunning || !txQ.length) return;
    txRunning = true;
    var fn = txQ.shift();
    var done = false;
    fn(function () { if (done) return; done = true; txRunning = false; endSync_(); runTxQ_(); });
  }
  function txIdle_() { return !txRunning && !txQ.length; }
  function canAct_() {
    if (!stateFresh) { showToast('Menyinkronkan data kapten… sebentar lagi.', 'error'); return false; }
    return true;
  }

  /* ---------- snapshot state (boot instan dari kunjungan terakhir) ---------- */
  var SNAP_KEY = 'mt_snap_v3';
  function saveSnap_() {
    if (!state) return;
    try {
      var s = JSON.parse(JSON.stringify(state));
      s.logs = (s.logs || []).slice(0, 10); delete s.cities; s._savedAt = Date.now();
      localStorage.setItem(SNAP_KEY + ':' + (MTNet.user() || 'g'), JSON.stringify(s));
    } catch (e) {}
  }
  function loadSnap_() { try { var raw = localStorage.getItem(SNAP_KEY + ':' + (MTNet.user() || 'g')); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }

  /* ---------- memori harga (catatan harga yang pernah kamu lihat) ---------- */
  var PRICE_KEY = 'mt_prices_v1';
  function getPriceMem_() { try { return JSON.parse(localStorage.getItem(PRICE_KEY) || '{}'); } catch (e) { return {}; } }
  function recordPrices_(cityId, items) {
    if (!cityId || !items || !items.length) return;
    var m = getPriceMem_(), rec = { day: state ? state.gameDay : 0, t: Date.now(), items: {} };
    items.forEach(function (it) { rec.items[it.commodityId] = { buy: it.buyPrice, sell: it.sellPrice, name: it.name }; });
    m[cityId] = rec;
    try { localStorage.setItem(PRICE_KEY, JSON.stringify(m)); } catch (e) {}
  }
  function bestKnown_(commodityId, exceptCity) {
    var m = getPriceMem_(), bs = null, bb = null;
    Object.keys(m).forEach(function (cid) {
      if (cid === exceptCity) return;
      var it = m[cid].items && m[cid].items[commodityId];
      if (!it) return;
      if (!bs || it.sell > bs.price) bs = { city: cid, price: it.sell, day: m[cid].day };
      if (!bb || it.buy < bb.price) bb = { city: cid, price: it.buy, day: m[cid].day };
    });
    return { sell: bs, buy: bb };
  }
  function cityName_(id) { var c = cityById_(id); return c ? c.Name : id; }

  /** Geser papan yang bertumpuk supaya semua label terbaca (tanpa mengubah posisi bangunan). */
  function declutterPlaques_(layer) {
    var els = Array.prototype.slice.call(layer.querySelectorAll('.hot-plaque'));
    var boxes = els.map(function (b) { var w = b.offsetWidth, h = b.offsetHeight; return { el: b, cx: parseFloat(b.style.left), top: parseFloat(b.style.top), w: w, h: h }; });
    boxes.sort(function (a, b) { return b.top - a.top; });
    var placed = [];
    function hits(a) {
      for (var i = 0; i < placed.length; i++) {
        var p = placed[i];
        if (Math.abs(a.cx - p.cx) < (a.w + p.w) / 2 + 4 && a.top > p.top - p.h - 3 && a.top - a.h - 3 < p.top) return p;
      }
      return null;
    }
    boxes.forEach(function (a) {
      var guard = 0, p;
      while ((p = hits(a)) && guard++ < 12) {
        var up = p.top - p.h - 4;
        if (up - a.h >= 84) a.top = up; else { a.top = p.top + a.h + 4; }
      }
      placed.push(a);
      a.el.style.top = a.top + 'px';
    });
  }

  /* ---------- 3. Arena duel: taktik rahasia serentak, animasi meriam, hasil ---------- */
  var DU = { d: null, poll: 0, raf: 0, cv: null, ctx: null, t: 0, fx: [], shake: 0, lastRound: 0, lastKey: '', ended: false, lunge: { you: 0, foe: 0 }, swerve: { you: 0, foe: 0 }, shield: { you: 0, foe: 0 } };
  var DTAC = [

          '<div class="du-bar" id="duBar">' + DTAC.map(function (t, i) { return '<button class="du-tac" data-k="' + t.k + '" title="' + esc_(t.hint) + '"><span class="kb">' + (i + 1) + '</span>' + ic(t.ic) + '<b>' + t.n + '</b><small>' + esc_(t.hint) + '</small></button>'; }).join('') + '</div>' +

        if (!window.confirm || true) { this.textContent = 'Yakin? klik lagi'; var b = this; if (b._armed) { google.script.run.withSuccessHandler(applyDuel_).api_mpDuelForfeit(DU.d.id); } b._armed = true; setTimeout(function () { b._armed = false; b.textContent = 'Menyerah'; }, 2500); }
      });
      DU.cv = document.getElementById('duelCanvas'); DU.ctx = DU.cv.getContext('2d');
      window.addEventListener('resize', duResize_);
    }
    DU.ended = false; DU.lastRound = d.round; DU.fx = []; DU.lastKey = ''; DU.diceShown = false;
    ov.classList.toggle('dice', d.kind === 'dice');
    ov.querySelectorAll('.du-tac').forEach(function (b) { b.classList.remove('sel'); b.disabled = false; });
    document.getElementById('duStatus').innerHTML = '';
    document.getElementById('duEnd').classList.remove('show');

    if (scene) scene.setThrottle(6);
    if (window.MTAudio) { MTAudio.setScene({ combat: true }); }
    applyDuel_(d);
    cancelAnimationFrame(DU.raf); DU.last = 0; DU.raf = requestAnimationFrame(duFrame_);
    clearInterval(DU.poll);

  }
  function closeDuel_() {

  }
  function duResize_() { if (!DU.cv) return; var d = Math.min(1.5, window.devicePixelRatio || 1); DU.dpr = d; DU.W = window.innerWidth; DU.H = window.innerHeight; DU.cv.width = DU.W * d; DU.cv.height = DU.H * d; }
  function hpBar_(s, side) {
    var pct = s.maxHp ? Math.max(0, Math.round((s.hp || 0) / s.maxHp * 100)) : 100;
    var pips = ''; for (var i = 0; i < (s.ammoMax || 0); i++) pips += '<i class="' + (i < (s.ammo || 0) ? 'on' : '') + '"></i>';

  function duelAct_(k) {

  document.addEventListener('keydown', function (e) {

  function playRound_(L) {
    var yp = L.youPick, fp = L.foePick;
    var tag = function (who, pick, dmg, note) { DU.fx.push({ k: 'tag', who: who, text: DNAME[pick] || pick, life: 1.8, max: 1.8 }); if (dmg) DU.fx.push({ k: 'num', who: who === 'you' ? 'foe' : 'you', text: '-' + dmg, life: 1.6, max: 1.6, delay: 0.55 }); else if (note === 'dodge') DU.fx.push({ k: 'num', who: who === 'you' ? 'foe' : 'you', text: 'MELESET', life: 1.4, max: 1.4, delay: 0.55, miss: true }); };

  function showDice_(d) {

  /* render arena (laut + dua kapal) */
  function duFrame_(ts) {
    if (!duelOpen_()) return;
    DU.raf = requestAnimationFrame(duFrame_);
    var dt = DU.last ? Math.min(0.05, (ts - DU.last) / 1000) : 0.016; DU.last = ts; DU.t += dt;
    var c = DU.ctx, W = DU.W, H = DU.H, d = DU.dpr, t = DU.t, hy = H * 0.46;
    c.setTransform(d, 0, 0, d, 0, 0);

    if (!DU.pal || !DU.palT || t - DU.palT > 2) { DU.pal = MTSky.palette(0.6, null, null); DU.palT = t; }
    var p = DU.pal;

    if (!DU.clouds) DU.clouds = MTSky.makeClouds(MTUtil.rng(77), 6);
    MTSky.paintClouds(c, W, hy, p, DU.clouds, dt * 1000, 1);

        '<div class="dz-info"><div class="dz-res" id="dzRes">Tebak jumlah tiga dadu. <b>Kecil</b> 4&ndash;10, <b>Besar</b> 11&ndash;17. Tiga kembar = bandar menang.</div>' +
        '<div class="cap-chips" id="dzBets">' + [10, 50, 100, 500, 1000].map(function (v) { return '<button class="chip-opt' + (v === DZ.bet ? ' on' : '') + '" data-v="' + v + '">' + formatGold(v) + '</button>'; }).join('') + '</div>' +
        '<div class="dz-act"><button class="btn" data-side="kecil">' + ic('dice') + '&nbsp; Kecil</button><button class="btn btn-gold" data-side="besar">' + ic('dice') + '&nbsp; Besar</button></div></div></div>';
    c.insertAdjacentHTML('beforeend', h);
    c.querySelectorAll('#dzBets .chip-opt').forEach(function (b) { b.addEventListener('click', function () { DZ.bet = Number(b.getAttribute('data-v')); c.querySelectorAll('#dzBets .chip-opt').forEach(function (x) { x.classList.toggle('on', x === b); }); au_('click'); }); });
    c.querySelectorAll('.dz-act [data-side]').forEach(function (b) { b.addEventListener('click', function () { rollLapau_(b.getAttribute('data-side')); }); });
  });
  function rollLapau_(side) {
    if (DZ.busy) return;
    if (DZ.bet > state.player.gold) { showToast('Gold tidak cukup untuk taruhan itu.', 'error'); return; }
    DZ.busy = true;
    var cup = document.getElementById('dzCup'), res = document.getElementById('dzRes'), t0 = Date.now(), result = null, err = null;
    document.querySelectorAll('.dz-act button').forEach(function (b) { b.disabled = true; });
    cup.classList.add('shake'); au_('dig');
    function r6() { return 1 + Math.floor(Math.random() * 6); }
    var iv = setInterval(function () {
      if (!cup.isConnected) { clearInterval(iv); DZ.busy = false; return; }
      if ((result || err) && Date.now() - t0 > 1300) {
        clearInterval(iv); cup.classList.remove('shake'); DZ.busy = false;
        document.querySelectorAll('.dz-act button').forEach(function (b) { b.disabled = false; });
        if (err) { res.innerHTML = '<span class="tip-bad">' + esc_(err) + '</span>'; return; }
        var r = result;
        cup.innerHTML = r.dice.map(dieHtml_).join('') + '<b class="dd-sum">' + r.sum + '</b>';
        patchGold_(r.newGold);
        res.innerHTML = (r.triple ? '<b>Tiga kembar!</b> Bandar menang. ' : 'Jumlah <b>' + r.sum + '</b> &mdash; <b>' + capitalize_(r.side) + '</b>. ') +
          (r.win ? '<span class="tip-good">Kamu menang +' + formatGold(r.delta) + ' gold!</span>' : '<span class="tip-bad">Kamu kalah ' + formatGold(-r.delta) + ' gold.</span>') + '<br><span class="muted small">Sisa ' + r.left + ' lemparan di meja ini hari ini.</span>';
        cup.classList.toggle('win', r.win); cup.classList.toggle('lose', !r.win);
        au_(r.win ? 'coin' : 'error', { n: 3 });
        if (r.win) metaBump_('lapaudice');
        return;
      }
      cup.innerHTML = [r6(), r6(), r6()].map(dieHtml_).join('');
    }, 90);
    google.script.run.withSuccessHandler(function (r) { result = r; }).withFailureHandler(function (e) { err = String(e.message || e); }).api_mgDice(DZ.bet, side);
  }

  /* ================= SETTINGS: akun + papan duel ================= */
  wrap_('renderSettings', function () {
    var c = document.getElementById('modalContent'); if (!c) return;
    var lb = document.getElementById('leaderboardSection');
    var user = MTNet.user() || (state && state.username) || '';
    var acct = '<h3>' + ic('key') + 'Akun</h3><div class="card acct-card">' +
      '<div class="acct-row"><span class="muted small">Masuk sebagai</span><b>' + esc_(user || '(akun Google pemilik)') + '</b>' + (user ? '<button class="btn btn-sm" id="acctLogout">' + ic('logout') + '&nbsp; Keluar</button>' : '') + '</div>' +
      (user ? '<details class="acct-pw"><summary>Ganti kata sandi</summary><div class="acct-pwf"><input type="password" id="pwOld" placeholder="Sandi lama" autocomplete="current-password"><input type="password" id="pwNew" placeholder="Sandi baru (min. 6)" autocomplete="new-password"><button class="btn btn-sm btn-gold" id="pwGo">Simpan</button></div><div class="small" id="pwMsg"></div></details>' : '') + '</div>';
    var pvp = '<h3>' + ic('swords') + 'Papan Duel PvP</h3><div id="pvpBoard" class="card"><div class="skeleton-block" style="height:30px;"></div></div>';
    var firstH3 = c.querySelector('h3');
    if (firstH3) firstH3.insertAdjacentHTML('beforebegin', acct); else c.insertAdjacentHTML('beforeend', acct);
    if (lb) lb.insertAdjacentHTML('afterend', pvp);
    // tambah kontrol baru ke daftar
    c.querySelectorAll('.card.small').forEach(function (g) {
      if (/Taktik combat/.test(g.textContent) && !g._v6) { g._v6 = true; [['U', 'Bursa Kapten'], ['F', 'Mancing'], ['Enter', 'Obrolan'], ['1-5', 'Taktik duel']].forEach(function (k) { g.insertAdjacentHTML('beforeend', '<span><b class="badge normal" style="min-width:32px;justify-content:center;">' + k[0] + '</b> ' + k[1] + '</span>'); }); }
    });
    var lo = document.getElementById('acctLogout'); if (lo) lo.addEventListener('click', function () { logout_(); });
    var pg = document.getElementById('pwGo');
    if (pg) pg.addEventListener('click', function () {
      var o = document.getElementById('pwOld').value, n = document.getElementById('pwNew').value, m = document.getElementById('pwMsg');
      if (n.length < 6) { m.innerHTML = '<span class="tip-bad">Sandi baru minimal 6 karakter.</span>'; return; }
      pg.disabled = true;
      google.script.run.withSuccessHandler(function (r) { pg.disabled = false; if (r && r.token) MTNet.setToken(r.token, user); m.innerHTML = '<span class="tip-good">Sandi diganti.</span>'; document.getElementById('pwOld').value = document.getElementById('pwNew').value = ''; })
        .withFailureHandler(function (e) { pg.disabled = false; m.innerHTML = '<span class="tip-bad">' + esc_(e.message) + '</span>'; }).api_authChangePassword(o, n);
    });
    google.script.run.withSuccessHandler(function (rows) {
      var el = document.getElementById('pvpBoard'); if (!el) return;
      if (!rows || !rows.length) { el.innerHTML = '<div class="empty-state">' + ic('swords') + 'Belum ada duel. Tantang kapten lain di pelabuhan!</div>'; return; }
      el.innerHTML = '<table class="leaderboard-table">' + rows.map(function (r, i) {
        return '<tr><td class="rank"><span class="medal ' + (i < 3 ? 'm' + (i + 1) : 'mn') + '">' + (i + 1) + '</span></td><td><b style="font-family:var(--font-title);">' + esc_(r.n) + '</b><br><span class="muted small">The ' + esc_(capitalize_(r.a)) + ' &middot; ' + r.w + 'M ' + r.l + 'K' + (r.d ? ' ' + r.d + 'S' : '') + '</span></td><td class="num" style="text-align:right;font-family:var(--font-title);font-weight:700;">' + r.r + '</td></tr>';
      }).join('') + '</table>';
    }).withFailureHandler(function () { var el = document.getElementById('pvpBoard'); if (el) el.innerHTML = '<p class="small">Gagal memuat papan duel.</p>'; }).api_mpPvpBoard();
  });
  (function () { var f = document.getElementById('sidebarFoot'); if (f) f.textContent = TIDE_VERSION; })();

</script>
