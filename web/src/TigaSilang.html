  function cine(kind, slides, cb, onSlide) {
    var finished = false;
    if (!window.MTCine || !document.body) { if (cb) cb(); return; }
    flowBusy = true;
    var ov = document.createElement('div'); ov.className = 'qt-cine ts-cine';
    ov.innerHTML = '<canvas></canvas><button class="ts-skip" type="button">Lewati &nbsp;&#8250;&#8250;</button><div class="qt-cap"><div class="qt-captext"></div><div class="qt-capbtn"><button class="btn btn-gold"></button></div></div>';
    document.body.appendChild(ov);
    var stop = function () { };
    try { stop = MTCine.play(ov.querySelector('canvas'), kind) || stop; } catch (e) { console.warn('[TS] cine', e); }
    var i = 0, txt = ov.querySelector('.qt-captext'), btn = ov.querySelector('.qt-capbtn .btn'), skip = ov.querySelector('.ts-skip');
    function show() {
      txt.classList.remove('in'); void txt.offsetWidth;
      txt.innerHTML = slides[i]; txt.classList.add('in');
      btn.innerHTML = i < slides.length - 1 ? 'Lanjut &nbsp;&#8250;' : 'Selesai';
      if (onSlide) try { onSlide(i); } catch (e) { }
    }
    function finish() {
      if (finished) return; finished = true;
      document.removeEventListener('keydown', onKey);
      try { stop(); } catch (e) { }
      ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450);
      flowBusy = false;
      if (cb) setTimeout(cb, 60);
    }
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); finish(); } }
    document.addEventListener('keydown', onKey);
    btn.onclick = function () { au_('page'); if (++i < slides.length) show(); else finish(); };
    skip.onclick = function () { au_('page'); finish(); };
    setTimeout(function () { skip.classList.add('on'); }, 1500);

    setTimeout(function () { if (!finished) show(); }, 900);
  }

    else if ((k === 3 || k === 4 || k === 5) && ['otoland', 'empeer_depeer', 'freeyork'].indexOf(cid()) < 0) note = '<div class="qg-callout"><div class="qg-callout-ico">' + ic('map') + '</div><div><b>Peta Pengasingan.</b><br><span class="muted small">Pulau-pulau itu di laut timur, di antara Marie Regal dan Gading Island. Pelayarannya lebih panjang.</span></div><span></span></div>';
    if (!note) return;
    var c = document.getElementById('modalContent'), anchor = c && (c.querySelector('.npc') || c.querySelector('.ph'));
    if (anchor && !c.querySelector('.ts-sailnote')) { var d = document.createElement('div'); d.className = 'ts-sailnote'; d.style.margin = '6px 0 10px'; d.innerHTML = note; anchor.parentNode.insertBefore(d, anchor.nextSibling); on(d, '[data-ts=ring]', function () { titikButaScene(); }); }
  });

  /* ---------- barang quest: ikon ---------- */
  var ITEM_ICON = {
    'Peta Pengasingan': 'map', 'Joran Kecil Miss Nansy': 'fish', 'Kotak Alat Jam Coco': 'wrench', 'Kunci Jam Agung': 'key', 'Palu Kecil Tempa': 'hammer',
    'Surat Bersegel Lilin Hitam': 'scroll', 'Surat Wasiat Andry': 'scroll', 'Pemukul Genderang Andry': 'burst', 'Kompas Dua Jarum': 'compass'

  wrap_('renderItemsWith_', function () {

  });

  /* ---------- tipe kota, gosip & warga ---------- */
  try {
    if (typeof TYPE_META !== 'undefined') {
      TYPE_META.Kincir = { icon: 'wind', label: 'Pulau Kincir' };
      TYPE_META.Dewan = { icon: 'star', label: 'Pulau Dewan' };
      TYPE_META.Tempa = { icon: 'hammer', label: 'Tanah Pandai Besi' };
    }
    if (typeof CITY_LORE !== 'undefined') {
      CITY_LORE.otoland = ['Angin di sini tak pernah berhenti. Kenangan juga.', 'Garam Otoland dijemur angin, bukan matahari saja. Rasanya lebih tajam.', 'Kincir tua di tanjung itu lebih tua dari dermaga.'];
      CITY_LORE.empeer_depeer = ['Di sini, orang masih membungkuk pada mahkota yang sudah tidak ada. Dan izin bersandar pun harus dicap tujuh kali.', 'Tangga ke Gedung Kubah ada 999 anak tangga. Jangan tanya siapa yang menghitung.', 'Sutra di sini ditenun untuk raja. Rajanya tidak pernah pulang.'];
      CITY_LORE.freeyork = ['Mereka menamai kota ini FreeYork waktu rantai terakhir dilepas. Bebas, katanya. Bebas lapar.', 'Dok Legenda itu tempat Black Pearl ditempa. Namanya yang terakhir diukir di dinding.', 'Batu bara dari lereng, besi dari tungku, rantai untuk siapa saja yang membayar.'];
    }
  } catch (e) { }
  function rumorPool() {
    var s = st(); if (!s) return null;
    var k = s.step || 0, c = cid();
    if (k === 0 && (s.sails || 0) >= 2) return ['Akhir-akhir ini banyak burung hitam terbang ke barat. Pertanda buruk, kata orang tua.'];

    if (k >= 8 && k <= 10) return c === 'marie_regal' ? ['Papan "HIDUP RATU MARLYA" mati. Hanya berkedip-kedip.'] : ['Bendera Armada Bebas setengah tiang di setiap pelabuhan.', 'Ada kapal kecil bersayap logam yang mengintai di jalur-jalur dagang.'];
    if (k >= 12) return c === 'freeyork' ? ['Ada kapal bank yang datang lagi. Kali ini pemiliknya turun.'] : c === 'toogood' ? ['Genderang keempat tak pernah lagi disimpan. Siapa pun boleh menabuhnya.'] : null;
    return null;
  }
  if (typeof window.rumors_ === 'function') {
    var origRumors = window.rumors_;

      return out;
    };
  }
  if (typeof window.walkerLine_ === 'function') {
    var origWalker = window.walkerLine_;

      var c = cid();
      if (c === 'otoland' && Math.random() < 0.4) return ['Anginnya kencang, Kapten! Pegang topimu.', 'Garam baru dipanen pagi ini!', 'Jaringnya jangan diinjak, baru dijahit.'][Math.floor(Math.random() * 3)];
      if (c === 'empeer_depeer' && Math.random() < 0.4) return ['Sudah dicap tujuh kali, Tuan?', 'Mohon membungkuk saat lewat di depan Gedung Kubah.', 'Sidang dimulai setelah lonceng ketiga.'][Math.floor(Math.random() * 3)];
      if (c === 'freeyork' && Math.random() < 0.4) return ['Minggir, gerobak arang lewat!', 'Rantai murah, Tuan? Murah sekali.', 'Debunya jangan dihirup dalam-dalam.'][Math.floor(Math.random() * 3)];
      return origWalker.apply(this, arguments);
    };
  }

  /* ================= KEDATANGAN & TRANSISI ================= */
  var prevStep = null;
  function scenes(prev, cur) {
    var s = st(); if (!s) return;
    if (cur >= 5) { try { metaMax_('tstamu', 1); } catch (e) { } }
    if (cur >= 4) { try { metaMax_('tsraja', 1); } catch (e) { } }
    if (cur >= 8) { try { metaMax_('tsempat', 1); } catch (e) { } }
    if (cur >= 9) { try { metaMax_('tspenabuh', 1); } catch (e) { } }

    if (!docked()) return;
    var c = cid();
    if (cur === 1 && !seen('rumor')) { if (currentPanel) close(); rumorScene(); return; }
    if (cur === 1 && c === 'joungjava' && !seen('vaultAuto')) { markSeen('vaultAuto'); setTimeout(function () { showToast('Kerumunan memadati Javasche Bank.', 'info'); }, 1500); return; }
    if (cur === 3 && c === 'otoland' && !seen('oto')) { if (currentPanel) close(); arrivalOtoland(); return; }
    if (cur === 4 && c === 'empeer_depeer' && !seen('emp')) { if (currentPanel) close(); arrivalEmpeer(); return; }
    if (cur === 5 && c === 'freeyork' && !seen('fy')) { if (currentPanel) close(); arrivalFreeYork(); return; }
    if (cur === 6 && c === 'paradiso' && !seen('par')) { markSeen('par'); setTimeout(function () { showToast('Seorang pelayan Kasino Mutiara memberi isyarat dari pintu ruang VIP.', 'info'); }, 1500); return; }
    if (cur === 7 && c === 'titik_buta' && !SEEN_MEM.tbOpen) { SEEN_MEM.tbOpen = 1; if (currentPanel) close(); titikButaScene(); return; }
    if (cur === 8 && c === 'toogood' && !seen('funeral')) { funeralScene(); return; }
    if (cur === 10 && c === 'gading_island' && !seen('gd10')) { markSeen('gd10'); setTimeout(function () { showToast('felyx melambai dari pintu Kedai Stumpy.', 'info'); }, 1500); return; }
    if (cur === 11 && c === 'joungjava' && !seen('j11')) { markSeen('j11'); setTimeout(function () { showToast('coco epan menunggumu di Javasche Bank.', 'info'); }, 1500); return; }
  }
  wrap_('applyFreshState_', function () {
    var s = st(), cur = s ? (s.step || 0) : null, prev = prevStep;
    prevStep = cur;
    if (!s) return;
    var tries = 0;
    setTimeout(function later() {
      if (!state || !st()) return;
      if (busyUi()) { if (tries++ < 60) setTimeout(later, 1000); return; }
      try { scenes(prev, st().step || 0); } catch (e) { console.warn('[TS] scenes', e); }
    }, 1400);
  });

  /* ---------- Tanda Jasa ---------- */
  if (typeof ACH !== 'undefined' && ACH.push) ACH.push(
    { id: 'ts_raja', t: 3, ic: 'map', n: 'Pengikut Jejak Raja', d: 'Ikuti Peta Pengasingan ke pulau berangin tempat seorang raja belajar menjadi manusia.', g: function (m) { return [m.c.tsraja || 0, 1]; } },

  };
