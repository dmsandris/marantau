<script>
/* =====================================================================
 * Tide v18 - QUEST "WARWERWOR"
 * Surat pelikan -> Marie Regal (Ratu Marie) -> tiga Surat Damai = akta penyerahan ->
 * Marlya asli di bawah kota -> studio dwi dibobol (Ms. alyfindi memfitnah Teh Euis) ->
 * sekutu lima pulau -> PERANG GENDERANG: drone, Kanvas Hitam, logistik, Kapal Induk HENING,
 * pengkhianatan Hasiolan -> Marie Regal merdeka.
 * Server: 0019_warwerwor.sql (api_warwerwor)   Seni: CinemaWar.html (MTWar) + SceneEngine (marie_regal)
 * ===================================================================== */
var WW = (function () {
  /* ---------- tokoh ---------- */
  function ap(seed, role, fem, over) { var a = MTFace.npc(seed, role, fem); for (var k in over) a[k] = over[k]; return a; }
  var N = null;
  function npcs() {
    if (N) return N;
    var marlyaAp = ap('marlya-moramora', 'pustakawan', 1, { hair: 7, hairStyle: 4, head: 'none', skin: 2, age: 0.62, eye: 'none', ear: 'none' });
    var marieAp = ap('marlya-moramora', 'pustakawan', 1, { hair: 7, hairStyle: 4, head: 'none', skin: 2, age: 0.25, ear: 'pearl' });
    N = {
      marie: { name: 'Ratu Marie', title: 'Pemerintah Moramora', ap: marieAp, holo: true },
      marlya: { name: 'Marlya', title: 'Pemerintah Moramora yang sah', ap: marlyaAp },
      ratu: { name: 'Ratu Marlya', title: 'Ratu Moramora', ap: ap('marlya-moramora', 'pustakawan', 1, { hair: 7, hairStyle: 4, head: 'none', skin: 2, age: 0.55, ear: 'pearl' }) },
      aly: { name: 'Ms. alyfindi', title: 'Penjual Peta', ap: ap('alyfindi-peta', 'saudagar', 1, { hair: 9, head: 'none', ear: 'hoop', skin: 1, age: 0.38 }) },
      hasiolan: { name: 'Hasiolan', title: 'Wakil Laksamana Skitraw', ap: ap('hasiolan-skitraw', 'tukang', 0, { head: 'ikat', facial: 3, hair: 0, skin: 3, age: 0.42 }) },
      robot: { name: 'R-01', title: 'Resepsionis Istana Hening', svg: robotSvg([120, 235, 255]) },
      robotRed: { name: 'R-01', title: 'Resepsionis Istana Hening', svg: robotSvg([255, 80, 80]) },
      drone: { name: 'Drone Pemburu', title: 'Armada Blokade', svg: droneSvg() }
    };
    return N;
  }
  function robotSvg(v, bg) {
    var c = v.join(',');
    return '<svg viewBox="0 0 100 100" class="ww-robot"><rect width="100" height="100" fill="' + (bg || '#16222d') + '"/>' +
      '<circle cx="50" cy="44" r="40" fill="rgba(' + c + ',.10)"/>' +
      '<path d="M12 100Q15 73 50 71Q85 73 88 100Z" fill="#d3dde5"/><path d="M30 100Q34 80 50 79Q66 80 70 100Z" fill="#9fb0bf"/>' +
      '<rect x="43" y="60" width="14" height="13" fill="#6d7d8b"/>' +
      '<circle cx="23" cy="45" r="5.5" fill="#9fb0bf"/><circle cx="77" cy="45" r="5.5" fill="#9fb0bf"/>' +
      '<ellipse cx="50" cy="43" rx="27" ry="24" fill="#eef3f6"/><ellipse cx="42" cy="34" rx="12" ry="6" fill="#fff" opacity=".7"/>' +
      '<rect x="25" y="39" width="50" height="14" rx="7" fill="#132230"/>' +
      '<rect x="29" y="42.5" width="42" height="7" rx="3.5" fill="rgba(' + c + ',.3)"/><rect x="43" y="43.8" width="14" height="4.4" rx="2.2" fill="rgb(' + c + ')"/>' +
      '<line x1="50" y1="19" x2="50" y2="9" stroke="#9fb0bf" stroke-width="2"/><circle cx="50" cy="8" r="2.8" fill="#ff5a50"/></svg>';
  }
  function droneSvg() {
    return '<svg viewBox="0 0 100 100" class="ww-robot"><rect width="100" height="100" fill="#140c10"/>' +
      '<path d="M8 46h22M70 46h22" stroke="#7d8b98" stroke-width="4"/><ellipse cx="14" cy="40" rx="13" ry="2.5" fill="#cfe2ee" opacity=".6"/><ellipse cx="86" cy="40" rx="13" ry="2.5" fill="#cfe2ee" opacity=".6"/>' +
      '<ellipse cx="50" cy="52" rx="34" ry="12" fill="#b9c6d1"/><path d="M33 47a17 13 0 0 1 34 0z" fill="#e5ecf1"/><rect x="16" y="51" width="68" height="2.5" fill="#2a3440"/>' +
      '<circle cx="40" cy="53" r="9" fill="rgba(255,70,70,.25)"/><circle cx="40" cy="53" r="3.4" fill="#ff4a4a"/></svg>';
  }

  /* ---------- pembantu ---------- */
  function st() { return (state && state.warwerwor) || null; }
  function step() { var s = st(); return s ? s.step : -1; }
  function cid() { return state && state.city ? state.city.CityId : ''; }
  function docked() { return !(state && state.voyage && state.voyage.inTransit); }
  function night() { var f = dayFrac_(); return f >= 0.72 || f < 0.04; }
  function pname() { return (state && state.player && state.player.characterName) || 'Kapten'; }
  function GOVS() { return ['sunda_empire', 'joungjava', 'bjorneo', 'skitraw', 'paradiso']; }
  function holo(a) { return '<div class="ww-holo">' + MTFace.svg(a, { bgColors: ['#08303e', '#020a10'] }) + '</div>'; }
  function face(n) { return n.svg || (n.holo ? holo(n.ap) : MTFace.svg(n.ap, { bgColors: ['#7a6440', '#2a1e12'], fat: n.fat, clown: n.clown, medals: n.medals })); }
  function speech(n, text, extra, title) {
    return '<div class="qg-card' + (n.holo ? ' ww-holo-card' : '') + '"><div class="qg-face">' + face(n) + '</div><div class="qg-body"><div class="qg-name">' + esc_(n.name) + ' <span>&middot; ' + esc_(title || n.title) + '</span></div>' +
      '<div class="qg-text">' + text + '</div>' + (extra || '') + '</div></div>';
  }
  function actions(btns) { return '<div class="qg-actions">' + btns + '</div>'; }
  function insert(html, first) {
    var c = document.getElementById('modalContent'); if (!c) return null;
    if (c.querySelector('.ww-wrap')) return null;
    var anchor = first ? (c.querySelector('.ph') || null) : (c.querySelector('.qt-wrap') || c.querySelector('.qg-wrap') || c.querySelector('.npc') || c.querySelector('.ph'));
    var wrap = document.createElement('div'); wrap.className = 'ww-wrap'; wrap.innerHTML = html;
    if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(wrap, anchor.nextSibling); else c.insertBefore(wrap, c.firstChild);
    return wrap;
  }
  function on(w, sel, fn) { var b = w && w.querySelector(sel); if (b) b.onclick = function () { fn(b); }; }
  function call(action, arg, ok, btn) {
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      if (r && r.warwerwor && state) state.warwerwor = r.warwerwor;
      ok(r || {});
    }).withFailureHandler(function (e) { if (btn) btn.disabled = false; showToast(e.message, 'error'); }).api_warwerwor(action, arg || '');
  }
  function pages(w, n, list, lastBtns, bind, title) {
    var i = 0;
    function show() {
      var last = i === list.length - 1, pg = list[i], who = pg.n || n, txt = pg.t || pg;
      w.innerHTML = speech(who, txt, actions(last ? lastBtns : '<button class="btn btn-gold" data-ww="next">Lanjut &nbsp;' + ic('compass') + '</button>') +
        '<div class="qt-dots">' + list.map(function (_, k) { return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('') + '</div>', pg.title || (who === n ? title : null));
      au_('page');
      if (!last) on(w, '[data-ww=next]', function () { i++; show(); }); else bind(w);
    }
    show();
  }
  function showModal(html) { currentPanel = null; setModal_(html); document.getElementById('modalOverlay').classList.add('open'); }
  function cine(kind, slides, done) { if (window.QT && QT.cine) QT.cine(kind, slides, done); else if (done) done(); }
  function govNpc() { var n = npc_('syahbandar'); return { name: n.name, title: 'Gubernur ' + cityName_(cid()), ap: n.ap, svg: n.svg }; }
  function updCities(r) {
    if (r.unlocks) state.unlocks = r.unlocks;
    if (r.cities) { try { setCachedCities_(r.citiesVersion, r.cities); } catch (e) {} state.cities = visibleCities_(r.cities, state); }
  }

  /* ---------- NPC kota Marie Regal: semuanya robot ---------- */
  var ROBOT_TITLE = { syahbandar: 'Petugas Dermaga', saudagar: 'Otomat Pasar', pustakawan: 'Unit Laboratorium', tukang: 'Lengan Dok', bankir: 'Inti Bank Kuantum', lapau: 'Unit Kafe', gudang: 'Penjaga Gudang' };
  function npc(city, role) {
    if (city !== 'marie_regal') return null;
    var s = st(), free = s && s.done;
    if (role === 'syahbandar' && free) return npcs().ratu;
    var code = { syahbandar: 'R-02', saudagar: 'P-14', pustakawan: 'L-07', tukang: 'D-03', bankir: 'Q-01', lapau: 'K-11', gudang: 'G-05' }[role] || 'R-00';
    return { name: code, title: ROBOT_TITLE[role] || 'Unit', svg: robotSvg(free ? [255, 205, 110] : [120, 235, 255]) };
  }

  /* ---------- catatan samar (jurnal) ---------- */
  var OBJ = ['',
    '<i>"Datanglah ke pulau Marie Regal dalam 30 hari."</i> Sebuah pulau yang tak pernah tergambar di peta mana pun kini menunggumu di timur.',
    'Tiga Surat Damai bersegel perak. Hurufnya asing, berkilau seperti sisik ikan. Ratu Marie ingin <i>tiga penguasa pulau</i> membubuhkan tanda tangan.',
    'Pelikan mesin itu datang lagi. Di kakinya terikat secarik kertas: <i>"Saat lampu-lampu kota mesin padam."</i>',
    'Pasar kembali bernapas. Tapi di TooGood, seseorang <i>menangis tanpa riasan</i>.',
    'Kertas "pengakuan" itu licin dan kering &mdash; persis seperti surat dari langit. Siapa yang tersenyum terlalu ramah saat menunjukkan jalan ke Marie Regal?',
    'Catatan Marlya ada di tanganmu. Para penguasa yang kau tipu harus mendengarnya sendiri &mdash; dan Skitraw punya armada yang tak pernah kalah.',
    'Langit penuh mata. Drone blokade mencegat setiap pelayaran.',
    'Gudang perang aliansi di TooGood menunggu mesiu, senjata, dan besi.',
    'Marie Regal. Kapal Induk HENING menunggu di depan gerbangnya.',
    'Hasiolan berkhianat. Selama Rangkiang Merah berlayar di rute Marie Regal, kubah cahaya itu tak akan padam.',
    'Perisai padam. Inti merah Kapal Induk terbuka. Satu serbuan lagi.'];
  var SCRAP_ORDER = ['sunda_empire', 'joungjava', 'bjorneo', 'skitraw', 'paradiso'], SCRAP_TXT = ['Toko kami', 'tidak tutup.', 'Toko kami', 'tutup', 'untukmu.'];
  function scrapsHtml(s) {
    var got = s.scraps || []; if (!got.length) return '';
    return '<div class="ww-scrap">' + SCRAP_ORDER.map(function (c, i) { return got.indexOf(c) >= 0 ? '<b>' + SCRAP_TXT[i] + '</b>' : '<i>&hellip;</i>'; }).join(' ') + '</div>';
  }
  function hpBar(s) {
    var pct = Math.max(0, Math.min(100, s.indukHp / s.indukMax * 100));
    return '<div class="ww-hp"><div class="ww-hp-l">' + ic('skull') + ' Kapal Induk HENING <b>' + formatGold(s.indukHp) + '/' + formatGold(s.indukMax) + '</b></div><div class="ww-hp-bar"><i style="width:' + pct.toFixed(1) + '%"></i>' + (s.step === 9 ? '<em style="left:50%"></em>' : '') + '</div></div>';
  }
  function tally(n, of, cls) { var h = ''; for (var k = 0; k < of; k++) h += '<i class="' + (k < n ? 'on' : '') + '"></i>'; return '<span class="qt-tally ' + (cls || '') + '">' + h + '</span>'; }
  function progress(s) {
    var k = s.step;
    if (k >= 1 && k <= 3) return scrapsHtml(s) + (k === 2 ? '<div class="qt-prog">' + tally(s.signed.length, 3, 'ww-silver') + ' Surat Damai: <b>' + s.signed.length + '/3</b></div>' : '');
    if (k === 6) return '<div class="qt-prog">' + tally(s.restored.length, 3) + ' Gubernur kembali percaya: <b>' + s.restored.length + '/3</b> &middot; Armada Skitraw: <b>' + (s.skitraw ? 'bergabung' : 'belum') + '</b></div>';
    if (k === 7) return '<div class="qt-prog">' + tally(Math.min(s.drones, s.dronesNeed), s.dronesNeed, 'ww-red') + ' Drone jatuh: <b>' + Math.min(s.drones, s.dronesNeed) + '/' + s.dronesNeed + '</b>' + (s.drones >= s.dronesNeed ? ' &mdash; <i>kanvas hitam menunggu di cakrawala</i>' : '') + '</div>';
    if (k === 8) return supplyList(s);
    if (k >= 9 && k <= 11) return hpBar(s);
    return '';
  }
  function journal() {
    var s = st(); if (!s || s.step < 1 || s.step > 11) return '';
    var war = s.step >= 7;
    return '<div class="qg-journal ww-journal' + (war ? ' war' : '') + '"><div class="qg-jh">' + ic(war ? 'swords' : 'eye') + ' <b>' + (war ? 'Perang Genderang' : 'Misi Rahasia: Warwerwor') + '</b><span class="legend-tag">sekali seumur hidup</span></div>' +
      (s.step <= 3 && s.daysLeft != null ? '<div class="ww-deadline">' + ic('hourglass') + ' Surat Moramora hangus dalam <b>' + String(s.daysLeft).replace('.', ',') + ' hari</b></div>' : '') +
      (s.step === 7 ? '<div class="qt-hunted">' + ic('alert') + ' Blokade Moramora: <b>setiap pelayaran dicegat drone</b>.</div>' : '') +
      '<div class="qg-obj">' + ic('compass') + ' <b>Catatan terakhirmu:</b><br>' + (OBJ[s.step] || '') + progress(s) + '</div></div>';
  }

  /* ---------- 0. SURAT DARI LANGIT ---------- */
  var letterBusy = false;
  function letterHtml(s) {
    var k = Math.min(4, s.tears || 0);
    return '<div class="ww-letter ww-tear' + k + '"><div class="ww-seal">' + sealSvg() + '</div>' +
      '<p class="ww-dear">Dear ' + esc_(pname()) + '</p>' +
      '<p>Saya difitnah, saya diam Dijelek-jelekin saya juga diam Dicela, direndah-rendahkan saya juga diam. Dihujat-hujat, dihina-hina saya juga diam. Tetapi hari ini di sini saya sampaikan saya akan <b class="ww-lawan">LAWAAANNN...</b></p>' +
      '<p>Datanglah ke pulau &ldquo;Marie Regal&rdquo; dalam 30 hari.</p>' +
      '<p class="ww-sign">Ttd,<br><b>Pemerintah Moramora</b></p></div>';
  }
  function sealSvg() {
    return '<svg viewBox="0 0 64 64" width="56" height="56"><defs><radialGradient id="wwSeal" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f4f8fb"/><stop offset=".6" stop-color="#aeb9c4"/><stop offset="1" stop-color="#6f7c88"/></radialGradient></defs>' +
      '<path d="M32 4l5 6 8-2 1 8 8 2-3 8 6 6-6 6 3 8-8 2-1 8-8-2-5 6-5-6-8 2-1-8-8-2 3-8-6-6 6-6-3-8 8-2 1-8 8 2z" fill="url(#wwSeal)"/>' +
      '<g fill="none" stroke="#3d5a70" stroke-width="1.8" stroke-linecap="round"><ellipse cx="32" cy="32" rx="12" ry="7.4"/><path d="M22.6 32q9.4 5.2 18.8 0"/><path d="M26.5 35l-.8 3M32 36.4v3.2M37.5 35l.8 3"/></g></svg>';
  }
  function showLetter() {
    var s = st(); if (!s || !s.letter || letterBusy) return;
    letterBusy = true;
    var again = (s.tears || 0) > 0 || (s.expired || 0) > 0;
    if (typeof closeModal === 'function' && currentPanel) closeModal();
    cine('pelican', again ? [
      'Pelikan itu kembali. Sama besarnya, sama tenangnya &mdash; dan sama tepatnya menemukan kapalmu di tengah lautan.',
      'Di paruhnya, surat yang sama. Kertasnya masih licin dan kering. Tapi tulisannya... <i>terlihat lebih goyah dari sebelumnya.</i>'
    ] : [
      'Angin mendadak berhenti. Di langit senja, seekor pelikan raksasa terbang rendah mengikuti kapalmu &mdash; terlalu tenang, terlalu tepat.',
      'Ia hinggap di haluan dan menatapmu lama. Di paruhnya: sepucuk surat bersegel perak. Kertasnya licin... dan kering, meski baru saja melintasi lautan.'
    ], function () {
      showModal(panelHeader_('scroll', 'Surat dari Langit', 'Dibawa seekor pelikan') + letterHtml(st() || s) +
        actions('<button class="btn btn-gold" data-ww="acc">' + ic('check') + '&nbsp; Tempelkan cap jempol di segel perak</button><button class="btn btn-ghost-ink" data-ww="tear">' + ic('x') + '&nbsp; Sobek &amp; buang ke laut</button>'));
      var c = document.getElementById('modalContent');
      on(c, '[data-ww=acc]', function (b) {
        call('accept', '', function (r) {
          updCities(r); au_('unfurl'); letterBusy = false;
          closeModal();
          showToast('Sebuah pulau baru muncul di petamu: Marie Regal.', 'success');
          if (typeof renderScene === 'function') renderScene();
        }, b);
      });
      on(c, '[data-ww=tear]', function (b) {
        call('tear', '', function () {
          au_('page'); var L = c.querySelector('.ww-letter'); if (L) L.classList.add('ww-torn');
          setTimeout(function () { letterBusy = false; closeModal(); showToast('Kau menyobek surat itu. Pelikan itu terbang tanpa suara.', 'info'); }, 900);
        }, b);
      });
    });
  }
  function maybeLetter() {
    var s = st();
    if (!s || !s.letter || letterBusy || (typeof combatSceneOpen !== 'undefined' && combatSceneOpen)) return;
    if (document.querySelector('.qt-cine')) return;
    setTimeout(function () { if (!currentPanel && !letterBusy) showLetter(); }, 1400);
  }
  // berangkat dari TooGood: pelikan menyusul di tengah pelayaran
  wrap_('doSetSail', function () {
    var s = st();
    if (!state || !state.toogood || !state.toogood.freed || (s && s.step > 0)) return;
    setTimeout(function () {
      google.script.run.withSuccessHandler(function (r) { if (r && r.warwerwor) { state.warwerwor = r.warwerwor; maybeLetter(); } }).withFailureHandler(function () {}).api_warwerwor('status', '');
    }, 13000);
  });

  /* ---------- 1. PASAR TUTUP ---------- */
  var CLOSED_FLAVOR = ['Pedagang menurunkan pintu gulung tanpa menatapmu.', 'Seorang ibu menarik anaknya menjauh saat kau lewat.', 'Timbangan dibiarkan kosong. Para kuli duduk diam di tangga, menunduk.', 'Lampu toko masih menyala, tapi pintunya terkunci dari dalam.'];
  function closedShop() {
    var s = st(), html = panelHeader_('scales', 'Pasar ' + esc_(state.city ? state.city.Name : ''), 'Tutup') +
      '<div class="ww-closed"><div class="ww-shutter"><span>TUTUP</span></div><div class="ww-closed-msg">&ldquo;Toko tutup. Kami diminta diam oleh Pemerintah.&rdquo;</div>' +
      '<div class="muted">' + CLOSED_FLAVOR[Math.floor(Date.now() / 60000) % CLOSED_FLAVOR.length] + '</div></div>';
    if (cid() === 'toogood' && s.step >= 1 && s.step <= 3) {
      html += speech(npcs().aly, 'Di samping toko yang tutup, seorang perempuan berambut merah anggur menggelar peta di atas tikar. Ia tersenyum seolah sudah menunggumu.' +
        '<p>"Marie Regal? Jangan lewat utara, Kapten &mdash; arusnya kejam. Ikuti angin timur, dan kau sampai sebelum lampu kotanya menyala." Ia menyentuh lenganmu sekilas.</p>' +
        '<p>"dwi? Kami dulu dekat... sebelum perempuan berkebaya itu datang. Hati-hati dengannya, Kapten."</p>');
    }
    showModal(html);
    currentPanel = 'market';
  }
  // gosip pelabuhan ikut dibungkam
  if (typeof rumors_ === 'function') {
    var origRumors = rumors_;
    window.rumors_ = function (n) { var s = st(); if (s && s.marketClosed) { var a = []; for (var i = 0; i < (n || 1); i++) a.push(['Ssst...', '<i>(tak ada yang berani bicara)</i>', 'Ssst... jangan keras-keras.'][i % 3]); return a; } return origRumors.apply(this, arguments); };
  }

  /* ---------- gerbang panel: pasar tutup & Marie Regal ---------- */
  var MR_OPEN = ['tasks', 'setsail', 'character', 'log', 'settings', 'items', 'cargo'];
  var origOpen = window.openPanel;
  window.openPanel = function (panel) {
    var s = st();
    if (s && cid() === 'marie_regal' && !s.done && docked() && MR_OPEN.indexOf(panel) < 0) {
      au_('error');
      showModal(panelHeader_('lock', 'Akses Ditolak', 'Marie Regal') + speech(s.step >= 4 ? npcs().robotRed : npcs().robot,
        '"Maaf, Kapten. Seluruh toko Marie Regal tertutup bagi tamu." Pintu kaca tetap terkunci, memantulkan wajahmu yang lelah.') +
        '<div class="ww-closed-msg small">AKSES DITOLAK &middot; MOHON TIDAK BERBICARA KERAS</div>');
      return;
    }
    if (s && s.marketClosed && docked() && (panel === 'market' || panel === 'bursa')) { closedShop(); return; }
    return origOpen.apply(this, arguments);
  };

  /* ---------- 2. MARIE REGAL: ISTANA HENING ---------- */
  function renderIstana() {
    var s = st(), k = s.step, n = npcs();
    var html = panelHeader_('eye', 'Istana Hening', 'Marie Regal &middot; gedung pemerintahan');
    showModal(html); currentPanel = 'tasks';
    var w;
    if (k === 1) {
      w = insert(speech(n.robot, '"Selamat datang, Kapten ' + esc_(pname()) + '. Anda ditunggu." Suaranya halus seperti kaca diusap. "Mohon tidak berbicara keras. Ratu sedang mendengarkan."',
        actions('<button class="btn btn-gold" data-ww="in">' + ic('eye') + '&nbsp; Masuk ke aula</button>')));
      on(w, '[data-ww=in]', function () {
        au_('unfurl');
        pages(w, n.marie, [
          'Aula itu gelap dan sunyi. Lalu cahaya biru membentuk sosok seorang perempuan &mdash; tenang, lembut, sempurna. "Kapten. Akhirnya. Aku Marie... dulu orang memanggilku <b>Marlya</b>."',
          '"Dua puluh tahun lalu aku kabur dari TooGood bersama dua budak lain &mdash; seorang anak raksasa bernama zafachmie, dan Andry Ivankov. Ombak membawaku ke Moramora. Aku menghapus rantai di negeri itu, Kapten. Aku membangun kota ini dari puing."',
          '"Tapi lima gubernur memfitnahku. Mereka bilang Moramora masih menjual manusia &mdash; mereka, yang dulu menyetor <i>pajak restorasi</i> kepada Jendral Tedsky." Hologram itu tersenyum tipis. "Kau tahu itu benar. Kau sendiri mendengarnya."',
