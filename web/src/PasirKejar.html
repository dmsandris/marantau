<script>
/* =====================================================================
 * Tide v53 · Pasir: pengejaran Franziska tanpa gantung (modul PSK)
 * Server: 0068. Empat permainan jejak bergiliran (Tanya Warga, Buntuti di Keramaian, Surat Tercecer, Tawar Kuli),
 *   kabar saat tiba (kosong/dingin/zaman), tanda kemungkinan tujuan di Set Sail, kartu kekalahan Quest 14,

 * Lokasi Franziska tidak pernah dikirim: Tanya Warga & Tawar Kuli dinilai server; Surat Tercecer hanya menerima kiasan.
 * ===================================================================== */
var PSK = (function () {
  if (!window.PS || !PS.K) return {};
  var K = PS.K, esc = K.esc, btn = K.btn, on = K.on, actions = K.actions, speech = K.speech, narr = K.narr;
  function p() { return PS.st(); }
  function kj() { var x = p(); return (x && x.kejar) || null; }
  function qs(n) { var x = p(); return (x && x.q && x.q[n]) || 0; }
  function barang() { return (p() && p().barang) || []; }
  function riak() { return (p() && p().riak) || {}; }
  function city(id) { var c = (state.cities || []).filter(function (x) { return x.CityId === id; })[0]; return c ? c.Name : id; }
  function toast(t, k) { if (typeof showToast === 'function') showToast(t, k || 'info'); }
  function here() { return state && state.city ? state.city.Name : ''; }
  var ERA = { keadilan: 'Zaman Keadilan', lampau: '40 Tahun Lalu', pusaran: 'Malam Pusaran', kini: 'zamanmu' };
  var GRADE = { sempurna: ['Jejak jelas', 'Hanya dua tempat yang mungkin.'], lulus: ['Jejak cukup', 'Tiga tempat yang mungkin.'], samar: ['Jejak samar', 'Empat tempat yang mungkin. Manifes Syahbandar bisa mencoret satu.'] };

  /* ---------- kirim jawaban ---------- */
  var doneCb = null;
  function kirim(game, ans, after) {

        on(w, '[data-ps=later]', K.close); on(w, '[data-ps=ulang]', function () { K.close(); main(doneCb); });

  }
  function hasil(r) {
    var G = GRADE[r.grade] || GRADE.lulus;
    K.au(r.grade === 'samar' ? 'page' : 'victory');
    var w = K.modalWrap('map', G[0], here());
    w.innerHTML = narr('Ke mana ia pergi', '<p>' + G[1] + (r.kopi ? ' <i>Kopi Pahit Sudyrman habis diseruput.</i>' : '') + '</p><div class="psk-kand">' + (r.kand || []).map(function (c) { return '<span>' + esc(city(c)) + '</span>'; }).join('') + '</div>' +
      '<p class="muted small">Tempat-tempat ini kini tertanda di daftar tujuan Set Sail. Tiba di tempat yang kosong, tempat itu dicoret sendiri. Ia pindah lagi dalam 45 menit.</p>',
      actions(btn('sail', 'ship', 'Berlayar') + btn('ded', 'map', 'Papan Deduksi', false)), 'map', 'paper');
    on(w, '[data-ps=sail]', function () { K.close(); openPanel('setsail'); });
    on(w, '[data-ps=ded]', function () { K.close(); if (doneCb) doneCb(); });
  }
  function main(cb) {
    doneCb = cb || doneCb;
    var k = kj(), m = k && k.main;
    if (!m) { toast('Tak ada jejak segar di dermaga ini.', 'info'); return; }

    else if (m.game === 'surat') surat(m);
  }

  /* =====================================================================
   * 1. Tanya Warga — tiga saksi, satu berbohong (dinilai server)
   * ===================================================================== */
  function warga(m) {
    var w = K.modalWrap('user', 'Tanya Warga', here());
    var cards = (m.saksi || []).map(function (s, i) {
      var fem = /Mak |Ceu /.test(s.nama) ? 1 : 0, ap = K.apOf(s.seed || ('w' + i), 'lapau', fem, s.peran === 'Anak kecil' ? { age: 0, facial: 0, head: 'none' } : {});
      return '<div class="psk-s" data-i="' + i + '"><div class="f">' + MTFace.svg(ap, { bgColors: ['#7a6440', '#2a1e12'] }) + '</div><div><div class="nm">' + esc(s.nama) + ' <small>&middot; ' + esc(s.peran) + '</small></div>' +
        '<div class="kt">"' + esc(s.kata) + '"</div><button class="btn btn-ghost-ink" data-b="' + i + '">Dia berbohong</button></div></div>';
    }).join('');
    w.innerHTML = narr('Tiga saksi, satu berbohong', '<p>Tiga warga mengaku melihat kapal putih itu. ' + (m.coba ? '<b>Saksi-saksi baru.</b> ' : '') + 'Cocokkan kesaksian mereka dengan yang kau tahu pasti, lalu tunjuk <b>yang berbohong</b>.</p>' +
      '<div class="psk-fakta"><b>Yang pasti:</b> ' + (m.fakta || '') + '</div><div class="psk-saksi">' + cards + '</div>', actions(btn('later', null, 'Nanti dulu', false)), 'user', 'paper');
    on(w, '[data-ps=later]', K.close);
    w.querySelectorAll('[data-b]').forEach(function (b) {
      b.onclick = function () {
        w.querySelectorAll('[data-b]').forEach(function (x) { x.disabled = true; });
        K.close(); kirim('warga', b.getAttribute('data-b'));
      };
    });
  }

  /* =====================================================================
   * 4. Tawar Kuli dengan Kopi — dialog tiga putaran (dinilai server)
   * ===================================================================== */
  var KULI_BUKA = {
    pemalu: '<i>Kuli itu menunduk, memainkan ujung tali tambat. Suaranya nyaris tak terdengar.</i> "Eh... Kapten perlu apa?"',
    pekerja: '<i>Kuli itu tetap memikul karung walau katanya sedang istirahat.</i> "Cepat saja, Kapten. Kapal berikutnya sudah merapat."',
    kopi: '<i>Kuli itu mengendus-endus ke arah warung sambil menguap lebar.</i> "Dari subuh belum ada setetes kopi pun, Kapten..."',
    cerita: '<i>Kuli itu sedang bercerita pada seekor kucing dermaga.</i> "...lalu ombaknya setinggi tiang! Eh, Kapten! Mau dengar kisahku?"'
  };
  var KULI_R = [
    { q: 'Sapa dia', o: [['sopan', '"Permisi, Pak. Maaf mengganggu istirahatnya."'], ['akrab', '"Bang! Kelihatannya habis kerja berat, ya?"'], ['langsung', '"Aku cari kapal putih. Kau lihat?"']] },
    { q: 'Tawarkan sesuatu', o: [['kopi', '"Kutraktir segelas kopi di warung, mau?"'], ['cerita', '"Aku punya kisah badai di Selat Gaul. Mau dengar?"'], ['bantu', '"Sini, kubantu angkat karungmu dulu."']] },
    { q: 'Tanyakan', o: [['halus', '"Tadi ada perempuan tua bergaun putih lewat... kau sempat lihat ke mana kapalnya?"'], ['langsung', '"Ke mana kapal putih itu berlayar?"'], ['pancing', '"Kudengar ada payung renda tertinggal di dermaga. Punya siapa, ya?"']] }
  ];
  // salinan matriks server hanya untuk raut wajah; nilai akhir tetap dihitung server
  var KULI_N = {
    pemalu: [{ sopan: 2, akrab: 0, langsung: -1 }, { kopi: 1, cerita: 0, bantu: 2 }, { halus: 2, langsung: -1, pancing: 1 }],
    pekerja: [{ sopan: 0, akrab: 1, langsung: 2 }, { kopi: 0, cerita: -1, bantu: 2 }, { halus: 0, langsung: 2, pancing: 0 }],
    kopi: [{ sopan: 1, akrab: 1, langsung: 0 }, { kopi: 2, cerita: 0, bantu: 0 }, { halus: 1, langsung: 1, pancing: 1 }],
    cerita: [{ sopan: 1, akrab: 2, langsung: -1 }, { kopi: 1, cerita: 2, bantu: 0 }, { halus: 1, langsung: 0, pancing: 2 }]
  };
  var RAUT = { '2': '<i>Wajahnya cerah. Ia mendekat.</i>', '1': '<i>Ia mengangguk kecil.</i>', '0': '<i>Ia mengangkat bahu.</i>', '-1': '<i>Ia mengernyit dan mundur selangkah.</i>' };
  function kuli(m) {
    var wt = m.watak || 'pemalu', nm = ['Bang Jali', 'Mang Odin', 'Pak Usman', 'Bang Togar'][(m.coba || 0) + ['pemalu', 'pekerja', 'kopi', 'cerita'].indexOf(wt) & 3];
    var n = { name: nm, title: 'Kuli dermaga', ap: K.apOf('kuli-' + wt + '-' + (m.coba || 0) + '-' + K.cid(), 'tukang', 0, { head: 'none' }) };
    var pick = [], mood = 0, pahit = barang().indexOf('kopi_pahit') >= 0;
    var w = K.modalWrap('cup', 'Tawar Kuli', here());
    function bar() { var h = ''; for (var i = 0; i < 6; i++) h += '<i class="' + (i < mood ? 'on' : '') + (mood < 0 && i === 0 ? ' bad' : '') + '"></i>'; return '<div class="psk-mood">' + h + '</div>'; }
    function round(r, last) {
      var R = KULI_R[r], opts = R.o.map(function (o) { return '<button type="button" data-o="' + o[0] + '">' + o[1] + '</button>'; }).join('');
      if (r === 1 && pahit) opts += '<button type="button" class="kopi" data-o="kopipahit">' + ic('coffee') + ' Tawarkan <b>Kopi Pahit Sudyrman</b> dari palkamu</button>';
      w.innerHTML = speech(n, (last || KULI_BUKA[wt]), bar() + '<p class="muted small"><b>' + (r + 1) + '/3 &middot; ' + R.q + '</b></p><div class="psk-opts">' + opts + '</div>' + actions(btn('later', null, 'Nanti dulu', false)), 'Kuli dermaga, sedang istirahat');
      on(w, '[data-ps=later]', K.close);
      w.querySelectorAll('[data-o]').forEach(function (b) {
        b.onclick = function () {
          var o = b.getAttribute('data-o');
          if (o === 'kopipahit') {
            pick = [pick[0] || 'sopan', 'kopipahit', 'halus'];
            w.innerHTML = speech(n, '<i>Ia menghirup aromanya, matanya membelalak.</i> "Kopi pahit Sudyrman?! Astaga, Kapten..." <i>Ia meneguknya pelan.</i> "Perempuan payung renda itu? Ia naik kapal putih. Kudengar juru mudinya menyebut tujuannya."', actions(btn('ok', 'map', 'Dengarkan')), 'Kuli dermaga');
            on(w, '[data-ps=ok]', function () { K.close(); kirim('kuli', pick.join(',')); });
            return;
          }
          pick.push(o); var v = (KULI_N[wt] && KULI_N[wt][r] && KULI_N[wt][r][o] != null) ? KULI_N[wt][r][o] : -1; mood = Math.max(-1, mood + v);
          if (r < 2) { round(r + 1, RAUT[String(v)] + ' ' + (v >= 2 ? '"Nah, begitu."' : v < 0 ? '"Hm."' : '"Ya, ya..."')); return; }
          w.innerHTML = speech(n, RAUT[String(v)] + (mood >= 3 ? ' "Baiklah, Kapten. Aku lihat sendiri..."' : ' "Aku sibuk, Kapten."'), bar() + actions(btn('ok', null, 'Lanjut')), 'Kuli dermaga');
          on(w, '[data-ps=ok]', function () { K.close(); kirim('kuli', pick.join(',')); });
        };
      });

    round(0);

  /* =====================================================================
   * 2. Buntuti di Keramaian — tahan untuk berjalan, berhenti saat ia menoleh
   * ===================================================================== */
  function buntuti(m) {
    K.busy(true);
    var lvl = Math.min(3, (kj() && kj().n) || 1);
    var ov = document.createElement('div'); ov.className = 'psk-ov';
    ov.innerHTML = '<h3>Buntuti di Keramaian &middot; ' + esc(here()) + '</h3>' +
      '<div class="msg"><b>Tahan</b> untuk berjalan, <b>lepas</b> untuk berhenti. Bila payung rendanya <b>berhenti berputar</b>, ia akan menoleh. Berlindunglah di balik lapak, dan jangan sampai tertinggal.</div>' +
      '<canvas width="' + (window.innerWidth < 560 ? 460 : 760) + '" height="250"></canvas><div class="meters"><span><b>Curiga</b><i></i><i></i><i></i></span><span><b>Hilang</b><i></i><i></i><i></i></span></div>' +
      '<div class="row"><button class="btn btn-gold hold" type="button">Tahan untuk berjalan</button><button class="btn btn-ghost-ink" type="button" data-x>Nanti dulu</button></div>';
    document.body.appendChild(ov);
    var cv = ov.querySelector('canvas'), g = cv.getContext('2d'), msg = ov.querySelector('.msg'), hb = ov.querySelector('.hold');
    var mC = ov.querySelectorAll('.meters span')[0].querySelectorAll('i'), mH = ov.querySelectorAll('.meters span')[1].querySelectorAll('i');
    var L = 120, fz = 14, pl = 4, hold = false, cur = 0, lost = 0, t = 0, last = 0, done = false, started = false;
    var st = 'jalan', stT = 2.2, spin = 0, fake = false, caughtCd = 0;
    var STALL = [22, 38, 55, 71, 88, 104], CROWD = [];
    for (var i = 0; i < 22; i++) CROWD.push({ x: Math.random() * L, v: (Math.random() < .5 ? -1 : 1) * (0.6 + Math.random()), c: ['#7a3a2a', '#2a4a6a', '#5a6a2a', '#6a2a5a', '#8a6a2a'][i % 5], y: 205 + (i % 3) * 14 });
    function down(e) { e.preventDefault(); hold = true; started = true; } function up() { hold = false; }
    hb.addEventListener('pointerdown', down); ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { hb.addEventListener(ev, up); });
    function key(e) { if (e.key === ' ') { e.preventDefault(); hold = e.type === 'keydown'; started = true; } }
    document.addEventListener('keydown', key); document.addEventListener('keyup', key);
    function cover() { return STALL.some(function (s) { return pl > s - 4 && pl < s + 4; }); }
    function meters() { for (var i = 0; i < 3; i++) { mC[i].className = i < Math.floor(cur) ? 'on' : ''; mH[i].className = i < Math.floor(lost) ? 'on' : ''; } }
    function end(grade) {
      if (done) return; done = true; document.removeEventListener('keydown', key); document.removeEventListener('keyup', key);
      hb.remove();
      msg.innerHTML = grade === 'gagal' ? (cur >= 3 ? '<b>Ia melihatmu.</b> Payung renda itu menutup dan menghilang di gang sempit.' : '<b>Kau kehilangan dia</b> di tengah keramaian.') :
        'Franziska naik sekoci di ujung pasar. Haluan kapal putih itu berputar... <b>kau melihat arahnya.</b>';
      K.au(grade === 'gagal' ? 'splash' : 'victory');
      var x = ov.querySelector('[data-x]'); x.textContent = 'Lanjut'; x.className = 'btn btn-gold';
      x.onclick = function () { ov.remove(); K.busy(false); kirim('buntuti', grade); };
    }
    ov.querySelector('[data-x]').onclick = function () { if (done) return; done = true; document.removeEventListener('keydown', key); document.removeEventListener('keyup', key); ov.remove(); K.busy(false); };
    function nextTurn() { return Math.max(1.8, 4.2 - lvl * 0.6) + Math.random() * 2.2; }
    function loop(ts) {
      if (!ov.isConnected) return;
      var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
      if (!done && started) {
        t += dt; stT -= dt; caughtCd = Math.max(0, caughtCd - dt);
        if (st === 'jalan') { fz += 2.6 * dt; spin += dt * 6; if (stT <= 0) { st = 'tanda'; stT = 0.65; fake = lvl >= 2 && Math.random() < 0.18 + lvl * 0.06; } }
        else if (st === 'tanda') { if (stT <= 0) { if (fake) { st = 'jalan'; stT = nextTurn(); } else { st = 'toleh'; stT = 1.1 + Math.random() * 0.5; } } }
        else if (st === 'toleh') { if (stT <= 0) { st = 'jalan'; stT = nextTurn(); } }
        if (hold) pl += 3.9 * dt;
        if (pl > fz - 3) pl = fz - 3;
        var d = fz - pl;
        if (st === 'toleh' && caughtCd <= 0 && ((hold && !cover()) || d < 6)) { cur += 1; caughtCd = 0.9; K.au('splash'); }
        if (d > 26) lost += dt / 1.6;
        if (cur >= 3 || lost >= 3) end('gagal');
        else if (fz >= L) end(cur < 1 && lost < 1 ? 'sempurna' : 'lulus');
      }
      CROWD.forEach(function (c) { c.x += c.v * dt; if (c.x < 0) c.x += L; if (c.x > L) c.x -= L; });
      draw(); meters();
