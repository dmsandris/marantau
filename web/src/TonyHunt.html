  - Serbuan memakai arena Serbuan Bersama (MTSERBU) dengan tema 'tony' (api_tonyHunt)
  - Kabar Marlya: gosip lapau + kabar pelabuhan (harta Tony; ajakan saat lobi terbuka). Tidak menyebut hari atau hadiah.
  - Sinematik th_kabur (Tony kabur), memakai tn_kepung (Tony.html) untuk pembuka
  Server: supabase/migrations/0063-perburuan-tony.sql

  /* ================= PAPAN ARMADA MARLYA ================= */
  var boardT = 0;

      '<small>' + E(m.ship || 'Kapal') + (m.tier ? ' &middot; Tier ' + m.tier : '') + (m.cond != null ? ' &middot; ' + Math.round(m.cond) + '%' : '') + '</small>' +

  function render(w, res) {

    B('unready', function (b) { rpc(['ready', false], function () { try { refreshCargoQuiet_(); } catch (e) { } refresh(); }, null, b); });

  var SLIDES = {

    function end() { if (fin) return; fin = true; try { stop(); } catch (e) { } ov.classList.add('out'); setTimeout(function () { ov.remove(); }, 450); setTimeout(done, 60); }

    }

  var origNpcToast = window.showNpcToast_;
  if (typeof origNpcToast === 'function') window.showNpcToast_ = function (role, text) {
    if (cid() === 'kabut_abu') { showToast('Tak ada dermaga. Hanya pelampung merah dan pelikan mesin yang berkedip.', 'info'); return; }
    return origNpcToast.apply(this, arguments);

    if (it.type === 'th_start') { showToast('Armada ' + it.from + ' mengangkat sauh ke arah Tony!', 'success'); setTimeout(function () { startRaid(it.raidId); }, 300); }
  });
  var checkAt = 0;

    var s = st(); if (!s) return;

      checkAt = Date.now();
      rpc(['view', s.raidId], function (v) { if (v.raid && v.raid.status === 'active') startRaid(v.raid.id); }, function () { });
    }
    if (docked() && cid() === 'kabut_abu' && s.open && !seen('tiba-' + today())) {
      mark('tiba-' + today());
      setTimeout(function () { if (!document.querySelector('.qt-cine') && !(window.MTSERBU && MTSERBU.isOpen && MTSERBU.isOpen())) boardOpen(); }, 1600);
      return;
    }
    portNews();
  });

  return { open: boardOpen, start: startRaid, kabar: kabarLines, harta: hartaText };
})();

<script>
/* =====================================================================
 * Scene Kabut Abu-abu (titik laut) + sinematik th_kabur
 * ===================================================================== */
(function () {
  if (window.MTCities && MTCities.register && MTCities.H) {
    var H = MTCities.H;
    function glow(ctx, x, y, r, col, a) { if (a <= 0.004) return; var g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(' + col + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
    function drawKabut(inst, ctx, p, t, dt, d) {
      var u = d.u, W = d.W;

      for (var i = 0; i < d.fog.length; i++) {

        var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); g.addColorStop(0, 'rgba(176,178,184,' + f.a + ')'); g.addColorStop(1, 'rgba(176,178,184,0)');
        ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);

      // mata merah pelikan & lampu pelampung
      var bl = 0.5 + 0.5 * Math.sin(t * 2.4);
      glow(ctx, d.bx + u * 0.38, d.by - u * 1.55, u * 0.35, '255,60,60', 0.35 + 0.4 * bl);
      glow(ctx, d.bx, d.by - u * 0.4, u * 1.4, '255,200,120', (0.15 + 0.35 * p.lights) * (0.7 + 0.3 * bl));
      // siluet empat layar abu-abu di cakrawala
      ctx.save(); ctx.globalAlpha = 0.28 + 0.08 * Math.sin(t * 0.4); ctx.fillStyle = '#5a5c62';
      for (var k = 0; k < 4; k++) { var sx = u * (5 + k * 6.5) + Math.sin(t * 0.15 + k) * u * 0.4, sy = d.hz - u * 0.15; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + u * 0.5, sy - u * 1.4); ctx.lineTo(sx + u * 1.1, sy); ctx.closePath(); ctx.fill(); ctx.fillRect(sx - u * 0.2, sy, u * 1.5, u * 0.18); }
      ctx.restore();
    }
    function kabut(B) {
      var u = B.u, ctx = B.ctx, base = B.shoreY || B.qTop, W = B.W || u * 30;
      B.hillY = function () { return base; };
      // karang & pelampung merah dengan papan ARMADA
      ctx.fillStyle = '#3a3c42'; ctx.beginPath(); ctx.ellipse(u * 15, base + u * 0.2, u * 3.2, u * 0.9, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#2c2e33'; ctx.beginPath(); ctx.ellipse(u * 12.6, base + u * 0.25, u * 1.4, u * 0.6, 0, Math.PI, 0); ctx.fill();
      var bx = u * 17.4, by = base - u * 0.2;
      ctx.fillStyle = '#b3261e'; ctx.beginPath(); ctx.ellipse(bx, by, u * 0.7, u * 0.5, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#f1ede4'; ctx.fillRect(bx - u * 0.7, by - u * 0.12, u * 1.4, u * 0.2);
      ctx.fillStyle = '#4a3a2a'; ctx.fillRect(bx - u * 0.06, by - u * 2.1, u * 0.12, u * 1.6);

      ctx.fillStyle = '#3a2a18'; ctx.font = '700 ' + Math.round(u * 0.42) + 'px Cinzel, Georgia, serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ARMADA', bx, by - u * 2.22);

      ctx.fillStyle = '#c9ced2'; ctx.beginPath(); ctx.ellipse(bx + u * 0.05, by - u * 1.25, u * 0.55, u * 0.35, 0, 0, 6.3); ctx.fill();

  }

  if (!window.MTCine || !MTCine.register || !window.MTUtil || !window.MTSky || !window.MTShip) return;
  var C = MTCine.H, U = C.U, sm = C.sm;
  var REDUCE = false; try { REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  var GANK = [
    { masts: 3, hull: '#141416', trim: '#3a3a40', sail: '#222226', flag: '#000000', emblem: 'skull', emblemColor: '#bdb8ac', ports: 4 },
    { masts: 2, hull: '#3a3436', trim: '#7d786e', sail: '#9a968c', sailStripe: '#5a5650', flag: '#1a1a1c', emblem: 'skull', emblemColor: '#e2ddd0', ports: 3 },
    { masts: 2, hull: '#4a3a2c', trim: '#8d7a5c', sail: '#8a8478', sailStripe: '#5a5650', flag: '#1a1a1c', emblem: 'skull', emblemColor: '#e2ddd0', ports: 4 },
    { masts: 3, hull: '#2b2a2e', trim: '#8d8a80', sail: '#7d7b76', sailStripe: '#4a4844', flag: '#1a1a1c', emblem: 'skull', emblemColor: '#efe8d6', ports: 6, muzzles: true, sizeK: 1.18 }
  ];
  // Tony kabur: Tangan Panjang miring berasap, peti dilempar ke laut, armada menghilang ke kabut
  function sceneKabur() {
    var r = U.rng(4747), P = new C.Particles(), L = C.makeLit(), clouds = MTSky.makeClouds(r, 7), chests = [];
    for (var i = 0; i < 9; i++) chests.push({ t: 1.2 + i * 0.45, x: 0, y: 0, vx: 0, vy: 0, on: false });
    function draw(ctx, W, H, t, dt) {
      var port = W < H, hy = H * (port ? 0.42 : 0.46), p = MTSky.palette(0.7, 'encounter', 'overcast');
      ctx.fillStyle = U.css(p.top); ctx.fillRect(0, 0, W, hy); ctx.fillStyle = U.css(p.seaD); ctx.fillRect(0, hy, W, H - hy);
      MTSky.paintSky(ctx, W, hy, p, t, null); MTSky.paintClouds(ctx, W, hy * 0.92, p, clouds, dt, REDUCE ? 1 : 4);
      MTSky.paintSea(ctx, W, H, hy, p, t, { glitter: null, rough: 1.1, drift: 12 });
      L.set(p.tint);
      var base = port ? W * 0.0045 : Math.min(W * 0.0018, H * 0.0032), away = sm(4, 10, t);
      // tiga pengawal menjauh ke kiri
      [[0.2, 0.12, 0.45, 0], [0.33, 0.06, 0.4, 1], [0.12, 0.2, 0.5, 2]].forEach(function (q) {
        var x = W * (q[0] - away * 0.3), y = hy + (H - hy) * q[1], s = base * q[2], o = { dir: -1, t: t, lit: L, furl: 0.1, lanterns: 0.3 };
        for (var k in GANK[q[3]]) o[k] = GANK[q[3]][k];
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - away); MTShip.draw(ctx, x, y, s, o); ctx.restore();
      });
      // Tangan Panjang miring, berasap
      var tx = W * (0.62 - away * 0.35), ty = hy + (H - hy) * 0.35, ts = base * 0.9, roll = -0.08 - 0.05 * Math.sin(t * 0.9);
      var o2 = { dir: -1, t: t, lit: L, furl: 0.2, lanterns: 0.4, roll: roll, damage: 0.7 }; for (var k2 in GANK[3]) o2[k2] = GANK[3][k2];
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - away * 0.9); MTShip.draw(ctx, tx, ty, ts, o2); ctx.restore();
      if (!REDUCE && Math.random() < 0.7) P.add({ x: tx + (Math.random() - 0.5) * 40 * ts, y: ty - 30 * ts, vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 0.5, g: -0.003, r: 3 + ts * 5, life: 2.2, col: 'rgba(48,46,48,A)', a: 0.5 });
      // peti jarahan dilempar ke laut
      chests.forEach(function (c) {
        if (t < c.t) return;
        if (!c.on) { c.on = true; c.x = tx + 20 * ts; c.y = ty - 18 * ts; c.vx = (0.6 + Math.random() * 0.8) * ts * 6; c.vy = -(1.5 + Math.random()) * ts * 6; }
        if (c.y < ty + 6 * ts) { c.vy += 0.45 * ts * 6 * dt / 16.7; c.x += c.vx * dt / 16.7; c.y += c.vy * dt / 16.7; }
        else if (!c.splash) { c.splash = true; for (var q = 0; q < 6; q++) P.add({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 2, vy: -1 - Math.random(), g: 0.08, r: 1.5 + Math.random() * 2, life: 0.7, col: 'rgba(225,235,245,A)', a: 0.8 }); }
        ctx.fillStyle = '#6b4a22'; ctx.fillRect(c.x - 5 * ts, c.y - 4 * ts, 10 * ts, 7 * ts); ctx.fillStyle = '#d9a84e'; ctx.fillRect(c.x - 5 * ts, c.y - 1 * ts, 10 * ts, 1.5 * ts);
      });
      // kabut menutup
      var fg = ctx.createLinearGradient(0, hy - H * 0.2, 0, H); fg.addColorStop(0, 'rgba(170,172,178,0)'); fg.addColorStop(1, 'rgba(170,172,178,' + (0.15 + 0.5 * away).toFixed(3) + ')');
      ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
      P.run(ctx, dt);
      if (t > 2) C.title(ctx, W, H, sm(2, 3, t) * (1 - sm(7.5, 8.5, t)), 'TONY KABUR', 'peti-peti jarahan tertinggal di laut', H * (port ? 0.2 : 0.22));
      C.vignette(ctx, W, H, 0.45);
      if (t < 1) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, 1, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    }
    return { draw: draw, intro: 7 };
  }
  MTCine.register('th_kabur', sceneKabur);
})();
