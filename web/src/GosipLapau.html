  function q(k) { var s = S(); return (s && s[k]) || null; }
  function off() {

  function has(tag) {
    var g = q('gala'), t = q('toogood'), w = q('warwerwor'), b = q('barsati'), d = q('duatangan');

      case 'all': return true;
      case 'baru': return !(g && (g.done || g.step >= 6));
      case 'q1': return !!(g && (g.done || g.step >= 6));
      case 'outlaw': return !(t && t.freed);
      case 'freed': return !!(t && t.freed);
      case 'ww': return !!(w && w.step >= 12);
      case 's1': return !!(b && (b.done || b.step >= 16));

  function night() { try { var f = dayFrac_(); return f >= 0.72 || f < 0.04; } catch (e) { return false; } }
  function hash(s) { return MTUtil.hashStr(String(s)); }

    karang_garam: {
      all: ['Penyelam muda menemukan mutiara sebesar kelereng. Ia menukarnya dengan sepiring ikan bakar dan tak menyesal.',

  /* ---------- sapaan pemilik lapau ---------- */
  var KEEPER = {
    sunda_empire: { day: ['Kopi Sunda, Kapten? Pahitnya sopan, manisnya tahu diri.', 'Duduk di dekat jendela, dari situ kapal-kapal yang masuk kelihatan semua.'], night: ['Lapau tutup kalau lilin terakhir habis. Masih panjang lilinnya, Kapten.'] },
    joungjava: { day: ['Kopi tubruk atau kopi pantai, Kapten? Dua-duanya bikin melek sampai Bjorneo.', 'Gula di meja itu gratis. Pajaknya saja yang tidak.'], night: ['Nelayan malam sudah datang. Kalau mau dengar kabar ikan, sekaranglah waktunya.'] },
    bjorneo: { day: ['Tuak atau teh, Kapten? Di Bjorneo, dua-duanya hangat.', 'Hati-hati di lantai, papannya ulin. Yang jatuh duluan biasanya kepala, bukan papan.'], night: ['Gunung batuk lagi. Tenang, itu tanda ia masih sehat.'] },

    paradiso: { day: ['Lepaskan sepatumu dulu, Kapten. Gosip di sini lebih enak didengar tanpa alas kaki.', 'Es kelapa atau tuak? Di Paradiso, jawaban yang salah cuma "tidak dua-duanya".'], night: ['Api unggun sudah menyala. Pesanlah sesuatu sebelum penarinya datang.'] },

  /* ---------- celetukan warga ---------- */
  var WARGA = {
    sunda_empire: ['Batik baru, Kapten! Motif kapal, cocok untukmu.', 'Awas jukung lewat!'],
    joungjava: ['Kopi! Kopi pantai!', 'Ayamnya jangan ditabrak, Tuan!'],
    bjorneo: ['Lada segar, baru turun gunung!', 'Kabutnya tebal, jalan pelan-pelan.'],

  function pool(cid) {
    var g = G[cid], out = [];
    if (g) Object.keys(g).forEach(function (tag) {
      if (tag === 'night') { if (night()) out = out.concat(g.night); return; }
      if (has(tag)) out = out.concat(g[tag]);
    });
    if (MARE.indexOf(cid) >= 0) Object.keys(WORLD).forEach(function (tag) { if (has(tag)) out = out.concat(WORLD[tag]); });
    return out;
  }
  /** 2 gosip "hari ini" (tetap selama satu hari game) + 1 acak. */
  function lines(cid) {
    if (off() || !cid) return [];
    var p = pool(cid); if (!p.length) return [];
    var day = (S() && S().gameDay) || 0, r = MTUtil.rng(hash(cid + '|gosip|' + day)), a = p.slice(), out = [];
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    out.push(a[0]); if (a.length > 1) out.push(a[1]);
    if (a.length > 2) out.push(a[2 + Math.floor(Math.random() * (a.length - 2))]);
    return out;
  }
  function keeper(cid) {
    if (off()) return null;
    var k = KEEPER[cid]; if (!k) return null;
    return night() && k.night ? k.night.concat(k.day.slice(0, 1)) : k.day;
  }
  function warga(cid) { if (off()) return []; return WARGA[cid] || []; }
  return { lines: lines, keeper: keeper, warga: warga, _pool: pool };
})();
