<script>
/**
 * Cinema.html — sinematik canvas untuk quest "Tide v12 — Pembebasan TooGood".
 * ------------------------------------------------------------------
 * Di-include SESUDAH SceneEngine (butuh MTUtil, MTSky, MTShip).
 *
 *   var stop = MTCine.play(canvas, kind, opts);   // kind: 'pearl' | 'arrest' | 'liberation'

 * onIntroEnd: fn() dipanggil sekali saat intro selesai }.
 * Semua gambar prosedural & orisinal.
 * ------------------------------------------------------------------
 */
var MTCine = (function () {
  var U = MTUtil;
  var TITLE_FONT = '"Pirata One", Georgia, serif', SUB_FONT = '"Cinzel", Georgia, serif';
  function ease(t) { t = U.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }

  /** Pewarna ala palette.lit: kalikan warna hex dengan tint (memo per tint terkuantisasi). */

  /* ---------- partikel (asap meriam, kilat moncong, kembang api) ---------- */

        ctx.fillStyle = p.col.replace('A', al.toFixed(3));

  function burst(P, x, y, u, cols) {

    P.add({ x: x, y: y, r: u * 9, life: 0.4, col: 'rgba(' + c1 + ',A)', a: 0.35, add: true, glow: true });
    for (var i = 0; i < n; i++) {
      var a = i / n * 6.283 + Math.random() * 0.1, sp = (i % 2 ? 2.1 : 1.35) * u * (0.8 + Math.random() * 0.4);
      P.add({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.022 * u, drag: 0.985, r: u * 0.75, life: 1.3 + Math.random() * 0.6, col: 'rgba(' + (i % 2 ? c1 : c2) + ',A)', add: true });
    }
  }
  var FW = ['255,110,170', '255,210,90', '110,235,225', '255,255,240', '255,150,80', '190,140,255', '120,255,150'];

  /** Sprite kabut lembut (sekali buat). */
  var fogCv = null;
  function fogSprite() {
    if (fogCv) return fogCv;
    fogCv = document.createElement('canvas'); fogCv.width = 256; fogCv.height = 96;
    var g = fogCv.getContext('2d'), r = U.rng(31);
    for (var i = 0; i < 9; i++) {
      var x = 50 + r() * 156, y = 36 + r() * 24, rr = 26 + r() * 22;
      var gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, 'rgba(255,255,255,0.32)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 96);
    }
    return fogCv;
  }

  /* ---- posisi dunia titik lokal kapal (abaikan roll kecil) ---- */
  var K_PEARL = 1.34;
  function shipPt(sx, sy, s, K, dir, ux, uy) { return [sx + ux * s * K * dir, sy + uy * s * K]; }
  function deckPt(t) { return [(1 - t) * (1 - t) * -50 + 2 * (1 - t) * t * -8 + t * t * 46, (1 - t) * (1 - t) * -25 + 2 * (1 - t) * t * -11 + t * t * -18]; }
  function pearlPorts() {
    var out = [], i;
    for (i = 0; i < 7; i++) { var d = deckPt(0.14 + i * 0.69 / 6); out.push([d[0], d[1] + 10]); }
    for (i = 0; i < 8; i++) { var e = deckPt(0.1 + i * 0.76 / 7); out.push([e[0], e[1] + 3.95]); }
    // tembakan berselang-seling dua dek, dari buritan ke haluan
    return out.map(function (p, k) { return { p: p, order: k < 7 ? k * 2 : (k - 7) * 2 - 0.6 }; }).sort(function (a, b) { return a.order - b.order; }).map(function (q) { return q.p; });
  }
  function title(ctx, W, H, a, main, sub, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);

    ctx.font = fs.toFixed(1) + 'px ' + TITLE_FONT;
    try { ctx.letterSpacing = (fs * 0.06).toFixed(1) + 'px'; } catch (e) { }
    var g = ctx.createLinearGradient(0, y - fs * 0.5, 0, y + fs * 0.45);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.45, '#e8bf55'); g.addColorStop(1, '#8a6424');
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = fs * 0.35; ctx.shadowOffsetY = fs * 0.04;
    ctx.fillStyle = g; ctx.fillText(main, W / 2, y + (1 - a) * fs * 0.15);
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(60,40,10,0.55)'; ctx.lineWidth = Math.max(1, fs * 0.02); ctx.strokeText(main, W / 2, y + (1 - a) * fs * 0.15);
    if (sub) {
      var fs2 = Math.max(10, fs * 0.25);
      try { ctx.letterSpacing = (fs2 * 0.16).toFixed(1) + 'px'; } catch (e2) { }
      ctx.font = '700 ' + fs2.toFixed(1) + 'px ' + SUB_FONT; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = fs2 * 0.8;
      ctx.fillStyle = 'rgba(240,228,200,' + U.clamp(a * 1.2 - 0.2, 0, 1).toFixed(3) + ')';
      ctx.fillText(sub, W / 2, y + fs * 0.66);
    }
    ctx.restore();
  }
  function vignette(ctx, W, H, k) {
    var g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.3, W / 2, H * 0.55, Math.hypot(W, H) * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + k + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function waveFlag(ctx, x, y, w, h, t, col, L) {
    ctx.fillStyle = L ? L(col) : col; ctx.beginPath(); ctx.moveTo(x, y);
    for (var k = 1; k <= 6; k++) { var u = k / 6; ctx.lineTo(x + u * w, y + Math.sin(t * 5 + u * 4 + x) * h * 0.22 * u); }
    for (var k2 = 6; k2 >= 0; k2--) { var u2 = k2 / 6; ctx.lineTo(x + u2 * w, y + h + Math.sin(t * 5 + u2 * 4 + x + 0.5) * h * 0.22 * u2); }
    ctx.closePath(); ctx.fill();
  }

  /* ============================ BLACK PEARL ============================ */
  function scenePearl() {
    var r = U.rng(4077), P = new Particles(), L = makeLit(), stars = [], fogs = [], glit = MTSky.makeGlitter(r);
    var ports = pearlPorts(), shots = [], shake = 0, flash = 0, warm = 0, bolt = null, nextBolt = 1.1, lay = null;
    for (var i = 0; i < 170; i++) stars.push({ x: r(), y: Math.pow(r(), 1.5) * 0.8, s: r() < 0.9 ? 1 : 1.7, tw: 0.5 + r() * 2, ph: r() * 6.3 });
    for (var f = 0; f < 16; f++) fogs.push({ x: r() * 1.4 - 0.2, y: r(), w: 0.35 + r() * 0.45, v: (0.006 + r() * 0.012) * (r() < 0.5 ? -1 : 1), a: 0.35 + r() * 0.45, front: f % 3 === 0 });
    for (var sI = 0; sI < ports.length; sI++) shots.push({ t: 5.0 + sI * 0.15, done: false });
    function layout(W, H) {
      var hy = H * 0.6, port = W < H, s = Math.min(W * (port ? 0.8 : 0.64) / (168 * K_PEARL), H * (port ? 0.62 : 1.0) / (160 * K_PEARL));
      var rr = U.rng(88), jag = []; for (var j = 0; j <= 40; j++) jag.push((rr() - 0.5));
      var ahh = 160 * K_PEARL * s * 0.42, top = Math.max(H * (port ? 0.2 : 0.3), ahh * 1.3);
      function headY(x) { var u = x / W, b = Math.exp(-Math.pow((u - 0.47) / (port ? 0.34 : 0.21), 2)); return hy - top * b - Math.abs(jag[Math.floor(u * 40) % 41]) * H * 0.035 * b + H * 0.01; }
      function cliff(side) {
        var pts = [], cw = W * (port ? 0.16 : 0.15), n = 9;
        for (var k = 0; k <= n; k++) { var v = k / n, xx = cw * (0.25 + 0.75 * Math.sin(v * Math.PI * 0.5 + 0.1)) + (rr() - 0.5) * cw * 0.18, yy = U.lerp(H * (0.02 + rr() * 0.05), hy + H * 0.08, Math.pow(v, 1.3)); pts.push([side < 0 ? xx : W - xx, yy]); }
        pts.push([side < 0 ? cw * 0.55 : W - cw * 0.55, H * 0.93]); pts.push([side < 0 ? cw * 0.35 : W - cw * 0.35, H + 2]);
        return pts;
      }
      lay = { W: W, H: H, hy: hy, s: s, headY: headY, cl: cliff(-1), cr: cliff(1), mx: W * 0.7, my: H * (port ? 0.11 : 0.13) };
    }
    function drawCliff(ctx, pts, side, t) {
      var cg = ctx.createLinearGradient(side < 0 ? 0 : lay.W, 0, side < 0 ? lay.W * 0.2 : lay.W * 0.8, 0);
      cg.addColorStop(0, '#03040a'); cg.addColorStop(1, rgb(U.mix([12, 16, 32], [70, 80, 120], flash * 0.5)));
      ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(side < 0 ? -2 : lay.W + 2, -2);
      pts.forEach(function (p) { ctx.lineTo(p[0], p[1]); }); ctx.lineTo(side < 0 ? -2 : lay.W + 2, lay.H + 2); ctx.closePath(); ctx.fill();
      // retakan batu
      ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(120,140,190,0.09)'; ctx.lineWidth = 1;
      for (var k = 1; k < pts.length - 2; k++) { var p0 = pts[k]; ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p0[0] - side * lay.W * 0.06, p0[1] + lay.H * 0.05); ctx.lineTo(p0[0] - side * lay.W * 0.09, p0[1] + lay.H * 0.04); ctx.stroke(); }
      ctx.restore();
      ctx.strokeStyle = 'rgba(150,172,225,' + (0.22 + flash * 0.5).toFixed(3) + ')'; ctx.lineWidth = 1.4; ctx.beginPath();
      pts.forEach(function (p, k) { if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }); ctx.stroke();
      var foot = pts[pts.length - 3];
      ctx.strokeStyle = 'rgba(200,215,245,0.25)'; ctx.lineWidth = 1; ctx.beginPath();
      for (var k2 = 0; k2 < 3; k2++) { var fy = foot[1] + 4 + k2 * 5 + Math.sin(t * 1.5 + k2) * 1.5; ctx.moveTo(foot[0] - side * 6 - 20, fy); ctx.lineTo(foot[0] + side * 30 + 10, fy); } ctx.stroke();
    }
    function draw(ctx, W, H, t, dt) {
      if (!lay || lay.W !== W || lay.H !== H) layout(W, H);
      var hy = lay.hy, s = lay.s;
      // petir sesekali
      nextBolt -= dt / 1000;
      if (nextBolt <= 0) {
        nextBolt = t < 9 ? 2.2 + Math.random() * 1.6 : 5 + Math.random() * 6;
        var bx = W * (0.15 + Math.random() * 0.7), pts = [[bx, 0]], yy = 0;
        while (yy < lay.headY(bx) - 4) { yy += H * (0.04 + Math.random() * 0.05); bx += (Math.random() - 0.5) * W * 0.05; pts.push([bx, Math.min(yy, lay.headY(bx))]); }
        bolt = { pts: pts, life: 0.32 }; flash = 1;
      }
      flash = Math.max(0, flash - dt / 1000 * 3.2); warm = Math.max(0, warm - dt / 1000 * 2.4); shake = Math.max(0, shake - dt / 1000 * 18);
      var fl = flash * (0.6 + 0.4 * Math.sin(t * 60));
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      // langit
      var g = ctx.createLinearGradient(0, 0, 0, hy);
      g.addColorStop(0, rgb(U.mix([6, 9, 26], [90, 100, 150], fl * 0.5))); g.addColorStop(0.6, rgb(U.mix([16, 24, 58], [120, 130, 180], fl * 0.5))); g.addColorStop(1, rgb(U.mix([42, 54, 96], [150, 160, 205], fl * 0.5)));
      ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, hy + 20);
      for (var i = 0; i < stars.length; i++) { var st = stars[i], a = (0.3 + 0.7 * Math.abs(Math.sin(t * st.tw + st.ph))) * (1 - st.y); ctx.fillStyle = 'rgba(255,250,235,' + (a * 0.85).toFixed(3) + ')'; ctx.fillRect(st.x * W, st.y * hy, st.s, st.s); }
      var mr = Math.max(9, H * 0.045), mg = ctx.createRadialGradient(lay.mx, lay.my, mr, lay.mx, lay.my, mr * 9);
      mg.addColorStop(0, 'rgba(200,215,255,0.32)'); mg.addColorStop(1, 'rgba(200,215,255,0)');
      ctx.fillStyle = mg; ctx.fillRect(lay.mx - mr * 9, lay.my - mr * 9, mr * 18, mr * 18);
      ctx.fillStyle = '#f4f0de'; ctx.beginPath(); ctx.arc(lay.mx, lay.my, mr, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(170,165,150,0.35)'; ctx.beginPath(); ctx.arc(lay.mx - mr * 0.3, lay.my - mr * 0.2, mr * 0.24, 0, 6.3); ctx.arc(lay.mx + mr * 0.32, lay.my + mr * 0.3, mr * 0.17, 0, 6.3); ctx.fill();
      // awan tipis melintas bulan
      var fs = fogSprite();
      for (var c = 0; c < 4; c++) { var cx = ((c * 0.31 + t * 0.006) % 1.4 - 0.2) * W; ctx.globalAlpha = 0.5; ctx.drawImage(fs, cx, H * (0.05 + c * 0.07), W * 0.5, H * 0.12); }
      ctx.globalAlpha = 1;
      if (bolt) {
        bolt.life -= dt / 1000;
        if (bolt.life > 0 && Math.sin(t * 70) > -0.3) {
          ctx.globalCompositeOperation = 'lighter';
          [[7, 'rgba(140,170,255,0.25)'], [2.2, 'rgba(235,242,255,0.95)']].forEach(function (st2) { ctx.strokeStyle = st2[1]; ctx.lineWidth = st2[0]; ctx.beginPath(); bolt.pts.forEach(function (p, k) { if (k) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); }); ctx.stroke(); });
          ctx.globalCompositeOperation = 'source-over';
        } else if (bolt.life <= 0) bolt = null;
      }
      // tanjung batu + mulut gua
      var rg = ctx.createLinearGradient(0, hy - H * 0.36, 0, hy);
      rg.addColorStop(0, rgb(U.mix([22, 28, 48], [90, 100, 140], fl * 0.6))); rg.addColorStop(1, rgb(U.mix([9, 12, 24], [50, 56, 80], fl * 0.6)));
      ctx.fillStyle = rg; ctx.beginPath(); ctx.moveTo(-2, hy + 2);
      for (var x = 0; x <= W; x += 6) ctx.lineTo(x, lay.headY(x)); ctx.lineTo(W + 2, hy + 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(160,180,230,' + (0.28 + fl * 0.4).toFixed(3) + ')'; ctx.lineWidth = 1.2; ctx.beginPath();
      for (var x2 = W * 0.2; x2 <= W * 0.85; x2 += 6) { if (x2 === W * 0.2) ctx.moveTo(x2, lay.headY(x2)); else ctx.lineTo(x2, lay.headY(x2)); } ctx.stroke();
      var aw = 168 * K_PEARL * s * 0.46, ah = 160 * K_PEARL * s * 0.42, ax = W * 0.5;
      ctx.fillStyle = '#010208'; ctx.beginPath(); ctx.moveTo(ax - aw / 2, hy + 1); ctx.lineTo(ax - aw / 2, hy - ah * 0.5);
      ctx.quadraticCurveTo(ax - aw / 2, hy - ah, ax, hy - ah); ctx.quadraticCurveTo(ax + aw / 2, hy - ah, ax + aw / 2, hy - ah * 0.5); ctx.lineTo(ax + aw / 2, hy + 1); ctx.closePath(); ctx.fill();
      var cg = ctx.createRadialGradient(ax, hy - ah * 0.2, 0, ax, hy - ah * 0.2, aw * 0.6); cg.addColorStop(0, 'rgba(90,110,160,0.22)'); cg.addColorStop(1, 'rgba(90,110,160,0)');
      ctx.fillStyle = cg; ctx.fillRect(ax - aw, hy - ah * 1.2, aw * 2, ah * 1.3);
      // laut
      var sp = { seaH: U.mix([34, 48, 84], [120, 135, 180], fl * 0.5), seaD: [4, 8, 22], hor: [40, 52, 92], _sunX: null, _moonX: lay.mx, glitter: [215, 225, 255], night: 1, waveHi: [150, 170, 220], waveLo: [0, 0, 8] };
      MTSky.paintSea(ctx, W, H, hy, sp, t, { glitter: glit, rough: 1.1, drift: 10 });
      // kabut belakang
      var intro = sm(0.4, 6, t);
      for (var fI = 0; fI < fogs.length; fI++) {
        var fo = fogs[fI]; if (fo.front) continue;
        var fx = ((fo.x + t * fo.v) % 1.6 + 1.6) % 1.6 - 0.3;
        ctx.globalAlpha = fo.a * (0.75 - 0.3 * intro); ctx.drawImage(fs, fx * W, hy - H * 0.06 + fo.y * H * 0.2, W * fo.w, H * 0.12);
      }
      ctx.globalAlpha = 1;
      drawCliff(ctx, lay.cl, -1, t); drawCliff(ctx, lay.cr, 1, t);
      // kapal mendekat dari gua
      var e = U.smooth((t - 0.7) / 5.4), k = U.lerp(0.3, 1, e), ss = s * k;
      var shx = W * 0.5 - 14 * ss * K_PEARL, shy = U.lerp(hy + 3, H * (W < H ? 0.8 : 0.86), e) + Math.sin(t * 1.1) * ss * 1.2;
      var furl = 1 - sm(6.2, 8.6, t), roll = Math.sin(t * 0.9) * 0.012;
      L.set(U.mix(U.mix([128, 140, 186], [255, 196, 130], warm * 0.45), [255, 255, 255], fl * 0.75));
      var so = MTShip.pearlOpts({ dir: 1, t: t, furl: furl, lit: L, lanterns: 0.75 + 0.25 * Math.sin(t * 3.1), roll: roll });
      ctx.save(); ctx.globalAlpha = 0.22; MTShip.draw(ctx, shx, shy + 3, ss, MTShip.pearlOpts({ dir: 1, t: t, furl: furl, lit: L, lanterns: 0.5, reflect: true, roll: -roll })); ctx.restore();
      MTShip.draw(ctx, shx, shy, ss, so);
      MTShip.foam(ctx, shx, shy, ss, 1, t, t < 5.5 ? 0.4 * (1 - e) : 0, 0.5);
      // tembakan salam meriam
      for (var q = 0; q < shots.length; q++) {
        var sh = shots[q];
        if (!sh.done && t >= sh.t) {
          sh.done = true; if (t - sh.t > 1.5) continue;
          var w0 = shipPt(shx, shy, ss, K_PEARL, 1, ports[q][0], ports[q][1]), u = ss * K_PEARL;
          P.add({ x: w0[0], y: w0[1], r: u * 11, life: 0.22, col: 'rgba(255,225,150,A)', add: true, glow: true });
          P.add({ x: w0[0], y: w0[1], r: u * 3.2, life: 0.14, col: 'rgba(255,255,235,A)', add: true, glow: true });
          for (var sm2 = 0; sm2 < 4; sm2++) P.add({ x: w0[0] + (Math.random() - 0.5) * u * 3, y: w0[1] + (Math.random() - 0.3) * u * 2, vx: (Math.random() - 0.35) * u * 0.25, vy: -u * (0.06 + Math.random() * 0.12), drag: 0.99, r: u * (3.5 + Math.random() * 2.5), grow: u * 0.12, life: 2.4 + Math.random() * 1.6, col: 'rgba(196,202,216,A)', a: 0.5, fadeIn: true, glow: true });
          shake = Math.min(5, shake + 2.2); warm = Math.min(1, warm + 0.35);
        }
      }
      P.run(ctx, dt);
      // kabut depan (menipis saat kapal keluar)
      for (var fJ = 0; fJ < fogs.length; fJ++) {
        var fo2 = fogs[fJ]; if (!fo2.front) continue;
        var fx2 = ((fo2.x + t * fo2.v * 1.4) % 1.6 + 1.6) % 1.6 - 0.3;
        ctx.globalAlpha = fo2.a * (0.95 - 0.62 * intro); ctx.drawImage(fs, fx2 * W, H * (0.7 + fo2.y * 0.25), W * fo2.w * 1.3, H * 0.18);
      }
      ctx.globalAlpha = 1;
      if (fl > 0.02) { ctx.fillStyle = 'rgba(200,215,255,' + (fl * 0.22).toFixed(3) + ')'; ctx.fillRect(-10, -10, W + 20, H + 20); }

      if (t < 1.2) { ctx.fillStyle = 'rgba(0,0,0,' + (1 - sm(0, 1.2, t)).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    }
    return { draw: draw, intro: 9 };
  }

  var KINDS = { pearl: scenePearl, arrest: sceneArrest, liberation: sceneLiberation };

  /** Jalankan sinematik `kind` ke dalam canvas. Mengembalikan fungsi stop(). */

    function stop() { if (!alive) return; alive = false; cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); }
    window.addEventListener('resize', onResize);
    resize();
    raf = requestAnimationFrame(frame);
    return stop;
  }

  return { play: play };
})();
</script>
