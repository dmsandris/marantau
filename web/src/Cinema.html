<script>
/**
 * Cinema.html — sinematik canvas untuk quest "Tide v12 — Pembebasan TooGood".
 * ------------------------------------------------------------------
 * Di-include SESUDAH SceneEngine (butuh MTUtil, MTSky, MTShip).
 *
 *   var stop = MTCine.play(canvas, kind, opts);   // kind: 'pearl' | 'arrest' | 'liberation'
 *   stop();                                       // hentikan animasi & lepas listener
 *
 * Canvas diukur lewat CSS (getBoundingClientRect) + devicePixelRatio, ikut
 * berubah saat window di-resize. Animasi berhenti sendiri kalau canvas
 * sudah dilepas dari DOM. opts: { startAt: detik (lompat ke waktu tertentu),
 * onIntroEnd: fn() dipanggil sekali saat intro selesai }.

var MTCine = (function () {
  var U = MTUtil;
  var TITLE_FONT = '"Pirata One", Georgia, serif', SUB_FONT = '"Cinzel", Georgia, serif';
  function ease(t) { t = U.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
  function sm(a, b, t) { return U.smooth((t - a) / (b - a)); }
  function rgb(c, a) { return U.css(c, a); }

  /** Pewarna ala palette.lit: kalikan warna hex dengan tint (memo per tint terkuantisasi). */

    var memo = {}, key = '', tint = [255, 255, 255];
    var fn = function (h, a) {
      var k = h + (a == null ? '' : '|' + a);
      return memo[k] || (memo[k] = U.css(U.mul(U.hex(h), tint), a));

    fn.set = function (c) { var k2 = c.map(function (v) { return Math.round(v / 4); }).join(','); if (k2 !== key) { key = k2; tint = c; memo = {}; } };

  /* ---------- partikel (asap meriam, kilat moncong, kembang api) ---------- */
  function Particles() { this.a = []; }

      p.x += (p.vx || 0) * s; p.y += (p.vy || 0) * s; p.r += (p.grow || 0) * s;
      var k = p.age / p.life, al = (p.a == null ? 1 : p.a) * (p.fadeIn ? Math.min(1, k * 6) : 1) * (1 - k);
      if (p.add) ctx.globalCompositeOperation = 'lighter';
      if (p.glow) {
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, p.col.replace('A', al.toFixed(3))); g.addColorStop(1, p.col.replace('A', '0'));
        ctx.fillStyle = g; ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      } else {
        ctx.fillStyle = p.col.replace('A', al.toFixed(3));
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.3, p.r), 0, 6.3); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  };
  function burst(P, x, y, u, cols) {
    var c1 = cols[Math.floor(Math.random() * cols.length)], c2 = cols[Math.floor(Math.random() * cols.length)], n = 56;
    P.add({ x: x, y: y, r: u * 9, life: 0.4, col: 'rgba(' + c1 + ',A)', a: 0.35, add: true, glow: true });
    for (var i = 0; i < n; i++) {
      var a = i / n * 6.283 + Math.random() * 0.1, sp = (i % 2 ? 2.1 : 1.35) * u * (0.8 + Math.random() * 0.4);
      P.add({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.022 * u, drag: 0.985, r: u * 0.75, life: 1.3 + Math.random() * 0.6, col: 'rgba(' + (i % 2 ? c1 : c2) + ',A)', add: true });
    }
  }
  var FW = ['255,110,170', '255,210,90', '110,235,225', '255,255,240', '255,150,80', '190,140,255', '120,255,150'];

  /** Sprite kabut lembut (sekali buat). */
  var fogCv = null;
  function fogSprite() {
    if (fogCv) return fogCv;
    fogCv = document.createElement('canvas'); fogCv.width = 256; fogCv.height = 96;
    var g = fogCv.getContext('2d'), r = U.rng(31);
    for (var i = 0; i < 9; i++) {
      var x = 50 + r() * 156, y = 36 + r() * 24, rr = 26 + r() * 22;
      var gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, 'rgba(255,255,255,0.32)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 256, 96);
    }
    return fogCv;
  }

  /* ---- posisi dunia titik lokal kapal (abaikan roll kecil) ---- */
  var K_PEARL = 1.34;
  function shipPt(sx, sy, s, K, dir, ux, uy) { return [sx + ux * s * K * dir, sy + uy * s * K]; }
  function deckPt(t) { return [(1 - t) * (1 - t) * -50 + 2 * (1 - t) * t * -8 + t * t * 46, (1 - t) * (1 - t) * -25 + 2 * (1 - t) * t * -11 + t * t * -18]; }
  function pearlPorts() {
    var out = [], i;
    for (i = 0; i < 7; i++) { var d = deckPt(0.14 + i * 0.69 / 6); out.push([d[0], d[1] + 10]); }
    for (i = 0; i < 8; i++) { var e = deckPt(0.1 + i * 0.76 / 7); out.push([e[0], e[1] + 3.95]); }
    // tembakan berselang-seling dua dek, dari buritan ke haluan
    return out.map(function (p, k) { return { p: p, order: k < 7 ? k * 2 : (k - 7) * 2 - 0.6 }; }).sort(function (a, b) { return a.order - b.order; }).map(function (q) { return q.p; });
  }
  function title(ctx, W, H, a, main, sub, y) {
    if (a <= 0.01) return;
    var fs = Math.min(W * 0.12, H * 0.15);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = fs.toFixed(1) + 'px ' + TITLE_FONT;
    try { ctx.letterSpacing = (fs * 0.06).toFixed(1) + 'px'; } catch (e) { }
    var g = ctx.createLinearGradient(0, y - fs * 0.5, 0, y + fs * 0.45);
    g.addColorStop(0, '#fff3c4'); g.addColorStop(0.45, '#e8bf55'); g.addColorStop(1, '#8a6424');
    ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = fs * 0.35; ctx.shadowOffsetY = fs * 0.04;
    ctx.fillStyle = g; ctx.fillText(main, W / 2, y + (1 - a) * fs * 0.15);
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(60,40,10,0.55)'; ctx.lineWidth = Math.max(1, fs * 0.02); ctx.strokeText(main, W / 2, y + (1 - a) * fs * 0.15);
    if (sub) {
      var fs2 = Math.max(10, fs * 0.25);
      try { ctx.letterSpacing = (fs2 * 0.16).toFixed(1) + 'px'; } catch (e2) { }
      ctx.font = '700 ' + fs2.toFixed(1) + 'px ' + SUB_FONT; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = fs2 * 0.8;
      ctx.fillStyle = 'rgba(240,228,200,' + U.clamp(a * 1.2 - 0.2, 0, 1).toFixed(3) + ')';
      ctx.fillText(sub, W / 2, y + fs * 0.66);
    }
    ctx.restore();
  }
  function vignette(ctx, W, H, k) {
    var g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.3, W / 2, H * 0.55, Math.hypot(W, H) * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,' + k + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function waveFlag(ctx, x, y, w, h, t, col, L) {
    ctx.fillStyle = L ? L(col) : col; ctx.beginPath(); ctx.moveTo(x, y);
    for (var k = 1; k <= 6; k++) { var u = k / 6; ctx.lineTo(x + u * w, y + Math.sin(t * 5 + u * 4 + x) * h * 0.22 * u); }
    for (var k2 = 6; k2 >= 0; k2--) { var u2 = k2 / 6; ctx.lineTo(x + u2 * w, y + h + Math.sin(t * 5 + u2 * 4 + x + 0.5) * h * 0.22 * u2); }
    ctx.closePath(); ctx.fill();
  }

  /* ---------- Tide v64: kit tekstur prosedural (dibuat sekali, bisa dipakai adegan lain lewat MTCine.H) ---------- */
  function mkCv(w, h) { var c = document.createElement('canvas'); c.width = Math.max(2, Math.round(w)); c.height = Math.max(2, Math.round(h)); return c; }
  var fbmMemo = {};
  /** Peta fBm 256x256 yang berulang mulus (tileable), nilai 0..1. */
  function fbmMap(seed) {
    if (fbmMemo[seed]) return fbmMemo[seed];
    var n = 256, out = new Float32Array(n * n), r = U.rng(seed), amp = 0.5, tot = 0, k;
    for (var o = 0; o < 5; o++) {
      var cells = 4 << o, lat = new Float32Array(cells * cells), sc = cells / n;
      for (k = 0; k < lat.length; k++) lat[k] = r();
      for (var y = 0; y < n; y++) {
        var fy = y * sc, y0 = fy | 0, ty = fy - y0, y1 = (y0 + 1) % cells; ty = ty * ty * (3 - 2 * ty);
        for (var x = 0; x < n; x++) {
          var fx = x * sc, x0 = fx | 0, tx = fx - x0, x1 = (x0 + 1) % cells; tx = tx * tx * (3 - 2 * tx);
          var a = lat[y0 * cells + x0], b = lat[y0 * cells + x1], c = lat[y1 * cells + x0], d = lat[y1 * cells + x1];
          var top = a + (b - a) * tx, bot = c + (d - c) * tx;
          out[y * n + x] += (top + (bot - top) * ty) * amp;
        }
      }
      tot += amp; amp *= 0.5;
    }
    var lo = 1, hi = 0;
    for (k = 0; k < out.length; k++) { var v = out[k] / tot; out[k] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
    for (k = 0; k < out.length; k++) out[k] = (out[k] - lo) / (hi - lo || 1);
    return (fbmMemo[seed] = out);
  }
  /** Nilai fBm di koordinat bebas (bilinear, berulang tiap 256). */
  function fbmAt(m, x, y) {
    var x0 = Math.floor(x), y0 = Math.floor(y), tx = x - x0, ty = y - y0;
    var xa = x0 & 255, xb = (x0 + 1) & 255, ya = (y0 & 255) << 8, yb = ((y0 + 1) & 255) << 8;
    var top = m[ya + xa] + (m[ya + xb] - m[ya + xa]) * tx, bot = m[yb + xa] + (m[yb + xb] - m[yb + xa]) * tx;
    return top + (bot - top) * ty;
  }
  /** Gumpalan awan / kabut dari fBm, sudah diberi terang-gelap.
   *  o: { sx, sy: regang noise · th, soft: ambang & kelembutan tepi · a: alpha maks · dark, lite: [r,g,b] · lx, ly: arah cahaya } */
  function puffSprite(seed, w, h, o) {
    var cv = mkCv(w, h), g = cv.getContext('2d'), m = fbmMap(seed), i = 0;
    w = cv.width; h = cv.height;
    var im = g.createImageData(w, h), d = im.data;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++, i += 4) {
      var u = x / w, v = y / h, ex = (u - 0.5) * 2, ey = (v - 0.5) * 2, fall = 1 - (ex * ex + ey * ey);
      if (fall <= 0) continue;
      var nx = u * 256 * o.sx, ny = v * 256 * o.sy, n = fbmAt(m, nx, ny);
      var den = U.smooth((n * (0.3 + 0.7 * fall) - o.th) / o.soft) * U.smooth(fall * 2.4);
      if (den <= 0.004) continue;
      var sh = U.clamp(0.42 + (n - fbmAt(m, nx + (o.lx || 0), ny + (o.ly || -6))) * 5 + (0.5 - v) * 0.45, 0, 1);
      d[i] = o.dark[0] + (o.lite[0] - o.dark[0]) * sh; d[i + 1] = o.dark[1] + (o.lite[1] - o.dark[1]) * sh; d[i + 2] = o.dark[2] + (o.lite[2] - o.dark[2]) * sh;
      d[i + 3] = den * o.a * 255;
    }
    g.putImageData(im, 0, 0);
    return cv;
  }
  /** Tekstur batu: bercak terang (dingin) & gelap ber-alpha + lapisan + retakan. Ditimpa di atas bentuk batu yang sudah di-clip.
   *  o: { f: skala · sx, sy: regang · slope: kemiringan lapisan · hi, lo: kuat terang/gelap · tint: [r,g,b] } */
  function rockTex(w, h, seed, o) {
    var cv = mkCv(w, h), g = cv.getContext('2d'), m = fbmMap(seed), m2 = fbmMap(seed + 7), i = 0;
    w = cv.width; h = cv.height;
    var im = g.createImageData(w, h), d = im.data, f = o.f || 1, sx = o.sx || 1, sy = o.sy || 1, tn = o.tint || [150, 172, 225];
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++, i += 4) {
      var n = fbmAt(m, x * f * sx * 0.55, y * f * sy * 0.55), n2 = fbmAt(m2, x * f * sx * 2.3, y * f * sy * 2.3);
      var st = Math.sin((y * f + x * f * (o.slope || 0) + n * 60) * 0.19); st = st * st * st;
      var v = (n - 0.5) * 1.25 + (n2 - 0.5) * 0.6 + st * (o.strata == null ? 0.17 : o.strata);
      var cr = Math.abs(n - 0.47 - (n2 - 0.5) * 0.05); if (cr < 0.011) v = -0.55 * (1 - cr / 0.011) + v * (cr / 0.011);
      if (v > 0) { d[i] = tn[0]; d[i + 1] = tn[1]; d[i + 2] = tn[2]; d[i + 3] = Math.min(255, v * (o.hi || 0.3) * 255); }
      else { d[i] = 0; d[i + 1] = 0; d[i + 2] = 5; d[i + 3] = Math.min(255, -v * (o.lo || 0.6) * 255); }
    }
    g.putImageData(im, 0, 0);
    return cv;
  }
  /** Ubin butir film 128x128 (bintik terang/gelap sangat tipis). */
  var grainCv = null;
  function grainTile() {
    if (grainCv) return grainCv;
    grainCv = mkCv(128, 128);
    var g = grainCv.getContext('2d'), im = g.createImageData(128, 128), d = im.data, r = U.rng(733);
    for (var i = 0; i < d.length; i += 4) { var v = r(); d[i] = d[i + 1] = d[i + 2] = v > 0.5 ? 255 : 0; d[i + 3] = Math.abs(v - 0.5) * 2 * 9; }
    g.putImageData(im, 0, 0);
    return grainCv;
  }

  /* ============================ BLACK PEARL ============================
   * Tide v64: gambar ditingkatkan (tekstur batu, awan fBm, Dok Kering di punggung bukit, gerbang besi gua,
   * obor + pantulan, kelelawar, sulur, riak haluan, kamera maju pelan, butir film).
   * Kapal, urutan waktu (intro 9,6 dtk), judul, dan salam meriam TIDAK berubah. */
  function scenePearl() {
    var r = U.rng(4077), P = new Particles(), L = makeLit(), stars = [], fogs = [], glit = MTSky.makeGlitter(r);
    var ports = pearlPorts(), shots = [], shake = 0, flash = 0, warm = 0, bolt = null, nextBolt = 1.1, lay = null, pend = null;
    for (var i = 0; i < 170; i++) stars.push({ x: r(), y: Math.pow(r(), 1.5) * 0.8, s: r() < 0.9 ? 1 : 1.7, tw: 0.5 + r() * 2, ph: r() * 6.3 });
    for (var f = 0; f < 16; f++) fogs.push({ x: r() * 1.4 - 0.2, y: r(), w: 0.35 + r() * 0.45, v: (0.006 + r() * 0.012) * (r() < 0.5 ? -1 : 1), a: 0.35 + r() * 0.45, front: f % 3 === 0 });
    for (var sI = 0; sI < ports.length; sI++) shots.push({ t: 5.0 + sI * 0.15, done: false });
    var r2 = U.rng(9131), clouds = [], bats = [], spr = null, grainPat = null, gOx = 0, gOy = 0, gN = 0;
    for (var c0 = 0; c0 < 5; c0++) clouds.push({ x: r2() * 1.5 - 0.25, y: 0.04 + r2() * 0.38, w: 0.3 + r2() * 0.26, v: 0.004 + r2() * 0.007, a: 0.42 + r2() * 0.3, k: c0 % 3 });
    for (var b0 = 0; b0 < 18; b0++) bats.push({ t0: 1.0 + r2() * 2.8, ang: -Math.PI / 2 + (r2() - 0.5) * 2.3, sp: 0.085 + r2() * 0.09, ph: r2() * 6.3, sz: 0.75 + r2() * 0.7, wob: r2() * 6.3 });

    function sprites() {
      var cl = [], k;
      for (k = 0; k < 3; k++) cl.push(puffSprite(211 + k * 17, 420, 150, { sx: 0.95, sy: 0.6, th: 0.33, soft: 0.2, a: 0.9, dark: [20, 26, 50], lite: [156, 172, 220], lx: 5, ly: -7 }));
      var storm = puffSprite(307, 520, 220, { sx: 0.9, sy: 0.7, th: 0.24, soft: 0.2, a: 0.96, dark: [6, 8, 20], lite: [60, 72, 120], lx: 4, ly: -8 });
      var mist = [0, 1].map(function (j) { return puffSprite(401 + j * 29, 360, 96, { sx: 0.62, sy: 1.0, th: 0.24, soft: 0.36, a: 0.4, dark: [150, 164, 205], lite: [214, 224, 246], lx: 0, ly: -4 }); });
      // bulan bertekstur (laut-laut gelap + tepi meredup)
      var mo = mkCv(160, 160), g = mo.getContext('2d'), im = g.createImageData(160, 160), d = im.data, m = fbmMap(53), i2 = 0;
      for (var y = 0; y < 160; y++) for (var x = 0; x < 160; x++, i2 += 4) {
        var dx = (x - 79.5) / 78, dy = (y - 79.5) / 78, rr = dx * dx + dy * dy;
        if (rr >= 1.03) continue;
        var edge = U.clamp((1 - Math.sqrt(rr)) * 78, 0, 1), limb = Math.sqrt(Math.max(0, 1 - rr));
        var mar = U.smooth((fbmAt(m, x * 2.3, y * 2.3) - 0.46) / 0.3) * 0.38, shd = (0.7 + 0.3 * limb) * (1 - 0.1 * U.clamp(-dx * 0.7 + dy * 0.5, 0, 1));
        d[i2] = (246 - 70 * mar) * shd; d[i2 + 1] = (242 - 68 * mar) * shd; d[i2 + 2] = (226 - 58 * mar) * shd; d[i2 + 3] = edge * 255;
      }
      g.putImageData(im, 0, 0);
      spr = { cl: cl, storm: storm, mist: mist, moon: mo };
    }

    function archY(x) { var dd = Math.min(1, Math.abs(x - lay.ax) / (lay.aw / 2)), tt = Math.sqrt(1 - dd); return lay.hy - lay.ah + (1 - tt) * (1 - tt) * lay.ah * 0.5; }
    function archPath(g, grow) {
      var ax = lay.ax, hw = lay.aw / 2 + grow, ah = lay.ah + grow, hy = lay.hy;
      g.beginPath(); g.moveTo(ax - hw, hy + 2); g.lineTo(ax - hw, hy - ah * 0.5);
      g.quadraticCurveTo(ax - hw, hy - ah, ax, hy - ah); g.quadraticCurveTo(ax + hw, hy - ah, ax + hw, hy - ah * 0.5); g.lineTo(ax + hw, hy + 2); g.closePath();
    }

    /* ----- langit dipanggang: Bima Sakti + bintang halus (bintang berkedip digambar per frame) ----- */
    function bakeSky() {
      var W = lay.W, hh = Math.ceil(lay.hy + 2), cv = mkCv(W, hh), g = cv.getContext('2d'), m = fbmMap(97), rs = U.rng(615);
      var mw = Math.max(2, Math.ceil(W / 4)), mh = Math.max(2, Math.ceil(hh / 4)), t = mkCv(mw, mh), tg = t.getContext('2d'), im = tg.createImageData(mw, mh), d = im.data, i2 = 0;
      for (var y = 0; y < mh; y++) for (var x = 0; x < mw; x++, i2 += 4) {
        var u = x / mw, v = y / mh, dd = (v - (0.02 + u * 0.5)) / 0.15, band = Math.exp(-dd * dd), n = fbmAt(m, x * 1.9, y * 1.9), n2 = fbmAt(m, x * 5.3 + 90, y * 5.3);
        var val = U.clamp(band * (0.25 + n * 1.05) - 0.3 - Math.max(0, n2 - 0.6) * 0.9, 0, 1);
        d[i2] = 128 + 80 * n; d[i2 + 1] = 138 + 60 * n; d[i2 + 2] = 205 + 30 * n; d[i2 + 3] = val * 175;
      }
      tg.putImageData(im, 0, 0);
      g.imageSmoothingEnabled = true; g.drawImage(t, 0, 0, W, hh);
      var tints = ['255,250,235', '205,218,255', '255,228,204'];
      for (var k = 0; k < 760; k++) {
        var sx = rs(), sy = rs(), dq = (sy - (0.02 + sx * 0.5)) / 0.2, near = Math.exp(-dq * dq);
        if (rs() > 0.35 + near * 0.65) continue;
        g.fillStyle = 'rgba(' + tints[k % 3] + ',' + ((0.12 + rs() * 0.4) * (1 - sy * 0.6)).toFixed(3) + ')';
        var sz = rs() < 0.85 ? 1 : 1.4; g.fillRect(sx * W, sy * hh * 0.96, sz, sz);
      }
      lay.sky = cv;
    }

    /* ----- Dok Kering TooGood di punggung bukit: galangan + derek (kiri), gudang + cerobong (kanan) ----- */
    function yard(g) {
      var m = lay.m, W = lay.W, sig = lay.sig * (lay.port ? 0.66 : 1), col = '#070a17', rim = 'rgba(150,172,225,0.4)';
      var xR = W * 0.47 + sig * 1.02, by = lay.headY(xR) + m * 1.6;
      g.fillStyle = col;
      g.fillRect(xR - m * 5.2, by - m * 4.4, m * 10.4, m * 6);
      g.beginPath(); for (var k = 0; k < 3; k++) { var rx = xR - m * 5.2 + k * m * 3.47; g.moveTo(rx, by - m * 4.4); g.lineTo(rx + m * 0.5, by - m * 6.1); g.lineTo(rx + m * 3.47, by - m * 4.4); } g.fill();
