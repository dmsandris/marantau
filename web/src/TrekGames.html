  .trk-meta b { color: var(--parch-50, #fcf6e6); } .trk-new { font-style: normal; background: #b8322a; color: #fff1c4; border-radius: 4px; padding: 1px 5px; font: 700 10px var(--font-title, Georgia, serif); }
  .trk-srv { text-align: center; font-size: 13px; font-style: italic; color: rgba(183,230,166,.8); margin: 10px 0 0; min-height: 16px; }

<script>
/* =====================================================================
 * MTGames8 — Trektrek-an (Saga 4): adu lurus 402 m dari kiri ke kanan, satu tombol.
 *   var G = MTGames8.open({ onClose })        -> layar penuh (latar Selat Lurus, kapal pamer)
 *   G.card(html)  -> elemen kartu di atas layar balap;  G.hideCard()
 *   G.race({ ship, rival, seed, hint, ghostLog }, cb)
 *        cb({ log: [[tms, 1|0], ...], me: { fin, shifts, reaction, jump, boost }, op: { fin }, win })   atau cb({ cancelled: true })
 *   G.close()
 *   Fisika: MTTrekSim (bilangan bulat, 120 Hz) — server menghitung ulang dari log yang sama (game.trek_run).
 *   Gambar & suara prosedural (canvas + WebAudio), lapisan statis di canvas offscreen, partikel dari kolam tetap.
 *   Masukan: pointerdown di mana saja / Spasi. Tab disembunyikan = jeda + hitung mundur 3 detik.
 * ===================================================================== */
var MTGames8 = (function () {
  'use strict';
  var S = MTTrekSim;
  var D = { LEN: 402, BAND: S.BAND / 1000,
    rng: function (seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; } };   // hanya untuk hiasan latar
  var root = null, cv = null, cx = null, ovEl = null, running = false, rafId = 0, onCloseCb = null, raceCb = null, offs = [];
  var RM = false, hintOn = false, racing = false, idleZone = [0.78, 0.93];
  function lsGet(k, d) { try { var v = localStorage.getItem('mt_trek_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem('mt_trek_' + k, JSON.stringify(v)); } catch (e) { } }
  var opt = { sound: true, haptic: lsGet('haptic', true) };
  // volume mengikuti pengaturan suara Marantau (MTAudio)
  function vol() {
    try { var p = window.MTAudio && MTAudio.prefs ? MTAudio.prefs() : null; if (p) { opt.sound = p.on !== false && p.sfx > 0.01; return opt.sound ? Math.min(1, 0.95 * (p.master == null ? 0.8 : p.master) * (p.sfx == null ? 0.8 : p.sfx) / 0.64) * 0.6 : 0; } } catch (e) { }
    return opt.sound ? 0.6 : 0;
  }

  // ------------------------------------------------------------ ukuran layar
  var W = 0, H = 0, DPR = 1, portrait = false, trackH = 0, hudH = 0, horizon = 0, laneP = 0, laneO = 0;
  var skyCv, cityCv, seaCv, glowCache = {};
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = root ? root.clientWidth || window.innerWidth : window.innerWidth; H = root ? root.clientHeight || window.innerHeight : window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    portrait = H > W * 1.1;
    trackH = Math.round(H * (portrait ? 0.54 : 0.62));
    hudH = H - trackH;
    horizon = Math.round(trackH * 0.36);
    laneP = Math.round(horizon + (trackH - horizon) * 0.36);
    laneO = Math.round(horizon + (trackH - horizon) * 0.74);
    buildStatic();
  }

  function mkCanvas(w, h) { var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * DPR)); c.height = Math.max(1, Math.round(h * DPR)); var g = c.getContext('2d'); g.scale(DPR, DPR); return { c: c, g: g, w: w, h: h }; }

  function glow(color) {
    if (glowCache[color]) return glowCache[color];
    var s = mkCanvas(64, 64), g = s.g, gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, color); gr.addColorStop(0.35, color.replace(/,\s*[\d.]+\)$/, ',0.45)')); gr.addColorStop(1, color.replace(/,\s*[\d.]+\)$/, ',0)'));
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (glowCache[color] = s.c);
  }

  // Lapisan statis: langit, siluet atol rongsok Zentul, laut

  function buildStatic() {
    var R = D.rng(77);
    skyCv = mkCanvas(W, horizon + 2);
    var g = skyCv.g, gr = g.createLinearGradient(0, 0, 0, horizon);
    gr.addColorStop(0, '#120c1c'); gr.addColorStop(0.35, '#3a1b2c'); gr.addColorStop(0.7, '#8a3a2a'); gr.addColorStop(1, '#e08a3c');
    g.fillStyle = gr; g.fillRect(0, 0, W, horizon + 2);
    for (var i = 0; i < 45; i++) { g.globalAlpha = 0.15 + R() * 0.45; g.fillStyle = '#fff1d0'; g.fillRect(R() * W, R() * horizon * 0.35, 1, 1); }
    g.globalAlpha = 1;
    // matahari rendah, setengah tenggelam di cakrawala
    var sx = W * 0.72, sr = Math.max(26, horizon * 0.22);
    var sg = g.createRadialGradient(sx, horizon, 0, sx, horizon, sr * 4);
    sg.addColorStop(0, 'rgba(255,200,110,0.55)'); sg.addColorStop(1, 'rgba(255,140,60,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, horizon + 2);
    g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(sx, horizon + 2, sr, Math.PI, 0); g.fill();
    // awan tipis berlapis
    g.fillStyle = 'rgba(60,20,30,0.35)';
    for (var c = 0; c < 6; c++) { var cy = horizon * (0.45 + R() * 0.4), cw = W * (0.15 + R() * 0.25); g.fillRect(R() * W, cy, cw, 2 + R() * 3); }

    // siluet Zentul: tumpukan lambung kayu rongsok, rumah panggung, nyiur, derek kayu, cerobong kuningan
    var cw2 = 1800, ch = Math.max(40, horizon * 0.6);
    cityCv = mkCanvas(cw2, ch); g = cityCv.g;
    var x = 0;
    while (x < cw2) {
      var bw = 34 + R() * 80, bh = ch * (0.25 + R() * 0.6), kind = R();
      g.fillStyle = '#1a0f12'; g.strokeStyle = '#1a0f12';
      if (kind < 0.22) {                 // tumpukan lambung perahu terbalik
        for (var k = 0; k < 3; k++) {
          var yy = ch - k * bh * 0.3, ww = bw * (1 - k * 0.2);
          g.beginPath(); g.moveTo(x + k * 6, yy); g.quadraticCurveTo(x + k * 6 + ww / 2, yy - bh * 0.42, x + k * 6 + ww, yy); g.closePath(); g.fill();
        }
      } else if (kind < 0.42) {          // rumah panggung beratap gonjong
        var hx = x, hy = ch - bh * 0.35, hw = bw;
        g.fillRect(hx + 4, hy, 2, ch - hy); g.fillRect(hx + hw - 6, hy, 2, ch - hy);
        g.fillRect(hx, hy - bh * 0.25, hw, bh * 0.25);
        g.beginPath(); g.moveTo(hx - 6, hy - bh * 0.25); g.quadraticCurveTo(hx + hw * 0.2, hy - bh * 0.4, hx - 2, hy - bh * 0.75);
        g.quadraticCurveTo(hx + hw * 0.5, hy - bh * 0.45, hx + hw + 2, hy - bh * 0.75); g.quadraticCurveTo(hx + hw * 0.8, hy - bh * 0.4, hx + hw + 6, hy - bh * 0.25); g.closePath(); g.fill();
        if (R() < 0.8) { g.fillStyle = 'rgba(255,170,70,0.9)'; g.fillRect(hx + hw * 0.4, hy - bh * 0.17, 4, 4); }
      } else if (kind < 0.57) {          // nyiur
        var tx = x + bw * 0.5, th = bh * 1.1;
        g.lineWidth = 3; g.beginPath(); g.moveTo(tx, ch); g.quadraticCurveTo(tx + 10, ch - th * 0.5, tx + 4, ch - th); g.stroke();
        g.lineWidth = 2.2;
        for (var f = 0; f < 6; f++) { var a = -Math.PI / 2 + (f - 2.5) * 0.55; g.beginPath(); g.moveTo(tx + 4, ch - th); g.quadraticCurveTo(tx + 4 + Math.cos(a) * 18, ch - th + Math.sin(a) * 10 - 6, tx + 4 + Math.cos(a) * 30, ch - th + 12); g.stroke(); }
      } else if (kind < 0.72) {          // derek kayu
        g.fillRect(x + bw * 0.4, ch - bh * 1.1, 4, bh * 1.1);
        g.lineWidth = 3; g.beginPath(); g.moveTo(x + bw * 0.42, ch - bh * 1.05); g.lineTo(x + bw * 1.3, ch - bh * 0.75); g.stroke();
        g.lineWidth = 1; g.beginPath(); g.moveTo(x + bw * 1.25, ch - bh * 0.77); g.lineTo(x + bw * 1.25, ch - bh * 0.4); g.stroke();
      } else {                           // gudang & cerobong bengkel
        g.fillRect(x, ch - bh * 0.5, bw, bh * 0.5);
        g.fillRect(x + bw * 0.6, ch - bh, bw * 0.14, bh * 0.5);
        g.fillStyle = 'rgba(80,60,60,0.35)'; g.beginPath(); g.arc(x + bw * 0.67, ch - bh - 8, 8, 0, Math.PI * 2); g.arc(x + bw * 0.72, ch - bh - 20, 11, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,170,70,0.85)';
        for (var w2 = 0; w2 < 3; w2++) if (R() < 0.6) g.fillRect(x + 6 + w2 * (bw / 3.5), ch - bh * 0.32, 4, 3);
      }
      if (R() < 0.3) { // pelita / obor kecil di dermaga
        g.fillStyle = 'rgba(255,190,90,0.95)'; g.fillRect(x + R() * bw, ch - 4 - R() * 10, 2, 2);
      }
      x += bw * (0.7 + R() * 0.5);
    }
    seaCv = mkCanvas(W, trackH - horizon);
    g = seaCv.g; gr = g.createLinearGradient(0, 0, 0, trackH - horizon);
    gr.addColorStop(0, '#6a3a3a'); gr.addColorStop(0.12, '#2d2a3d'); gr.addColorStop(0.45, '#14223a'); gr.addColorStop(1, '#0a1220');
    g.fillStyle = gr; g.fillRect(0, 0, W, trackH - horizon);
    // jalur pantulan matahari
    var rg = g.createLinearGradient(sx - 60, 0, sx + 60, 0);
    rg.addColorStop(0, 'rgba(255,190,100,0)'); rg.addColorStop(0.5, 'rgba(255,190,100,0.28)'); rg.addColorStop(1, 'rgba(255,190,100,0)');
    g.fillStyle = rg; g.fillRect(sx - 60, 0, 120, (trackH - horizon) * 0.45);
  }

  // ------------------------------------------------------------ suara (WebAudio prosedural)
  var AC = null, master, engG, engF, osA, osB, waterG, noiseBuf, lfo, pulseG;
  var SLENDRO = [0, 240, 480, 720, 960];
  function slen(deg, base) { var n = 5, o = Math.floor(deg / n), i = ((deg % n) + n) % n; return (base || 220) * Math.pow(2, o + SLENDRO[i] / 1200); }

  function audioInit() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    var Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return;
    try { AC = new Ctor(); } catch (e) { AC = null; return; }
    master = AC.createGain(); master.gain.value = vol(); master.connect(AC.destination);
    engF = AC.createBiquadFilter(); engF.type = 'lowpass'; engF.frequency.value = 400; engF.Q.value = 4;

    g.beginPath(); g.moveTo(-R * 0.14, -R * 0.03); g.lineTo(R * 0.94, 0); g.lineTo(-R * 0.14, R * 0.03); g.closePath(); g.fill();
    g.restore();
    var hub = g.createRadialGradient(gx - R * 0.06, gy - R * 0.06, 0, gx, gy, R * 0.25);
    hub.addColorStop(0, '#fbeabb'); hub.addColorStop(1, '#8f6522');
    g.fillStyle = hub; g.beginPath(); g.arc(gx, gy, R * 0.24, 0, Math.PI * 2); g.fill();

    var gear = s ? s.gear : 1;
    g.fillStyle = '#2a1a0c'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = Math.round(R * 0.3) + "px 'Pirata One', Georgia, serif"; g.fillText(String(gear), gx, gy - R * 0.01);
    g.fillStyle = '#7b6445'; g.font = '700 ' + Math.max(9, Math.round(R * 0.08)) + 'px Cinzel, Georgia, serif'; g.fillText('GIGI', gx, gy + R * 0.36);
    var kn = s ? Math.round(s.v * 1.944) : 0;
    g.fillStyle = '#33230f'; g.font = '600 ' + Math.round(R * 0.14) + "px 'Special Elite', 'Courier New', monospace";
    g.fillText(kn + ' knot', gx, gy + R * 0.58);

    // papan samping: waktu (kiri), Semburan (kanan)
    var side = R * 1.24 + 74, sby = portrait ? y0 + 40 : gy - R * 0.1;
    var sbx = portrait ? W - 70 : Math.min(W - 64, gx + side);
    var bu = s && s.boostUsed, ready = s && s.gear === 5 && !bu;
    var hold = race && race.held && ready && s.holdFrom != null ? Math.min(1, (raceNow() - s.holdFrom) / 0.45) : 0;
    plaque(g, sbx, sby, ready ? (0.35 + 0.25 * Math.sin(now / 120)) : 0);
    if (hold > 0) { g.fillStyle = 'rgba(255,140,40,0.55)'; roundRect(g, sbx - 54, sby - 20, 108 * hold, 40, 8); g.fill(); }
    g.fillStyle = bu ? 'rgba(251,234,187,0.4)' : (ready ? '#fff1c4' : 'rgba(251,234,187,0.75)');
    g.font = '700 10.5px Cinzel, Georgia, serif'; g.fillText('SEMBURAN', sbx, sby - 6);
    g.font = "italic 12px 'EB Garamond', Georgia, serif"; g.fillText(bu ? 'sudah disembur' : (ready ? 'tahan jarimu' : 'di gigi lima'), sbx, sby + 9);

    var tx = portrait ? 70 : Math.max(64, gx - side);
    var tt = race && race.me.launched ? (race.me.finishT != null ? race.me.finishT : Math.max(0, race.simT)) : 0;
    plaque(g, tx, sby, 0);
    g.fillStyle = '#fff1c4'; g.font = "17px 'Special Elite', 'Courier New', monospace"; g.fillText(tt.toFixed(2) + ' dtk', tx, sby - 4);
    g.fillStyle = 'rgba(251,234,187,0.65)'; g.font = "italic 12px 'EB Garamond', Georgia, serif";
    g.fillText(race && race.me.reaction != null ? 'reaksi ' + Math.max(0, race.me.reaction).toFixed(3) : 'waktu', tx, sby + 12);

    if (fb) {
      var age = (now - fb.t) / 1000;
      if (age > 0.9) fb = null;
      else {
        var sc = age < 0.12 ? 0.6 + age / 0.12 * 0.6 : 1.2 - Math.min(0.2, (age - 0.12));
        g.save(); g.translate(W / 2, trackH - (portrait ? 70 : 62)); g.scale(sc, sc);
        g.globalAlpha = Math.min(1, (0.9 - age) / 0.3);
        g.font = Math.round(portrait ? 40 : 46) + "px 'Pirata One', Georgia, serif";
        g.lineWidth = 4; g.strokeStyle = 'rgba(18,11,7,0.9)'; g.strokeText(fb.txt, 0, 0);
        g.fillStyle = fb.col; g.fillText(fb.txt, 0, 0);
        if (fb.sub) { g.font = "italic 13px 'EB Garamond', Georgia, serif"; g.fillStyle = 'rgba(251,234,187,0.85)'; g.fillText(fb.sub, 0, 22); }
        g.restore();
      }
    }
    if (coach && racing) {
      g.fillStyle = 'rgba(240,207,120,0.9)'; g.font = "italic 14px 'EB Garamond', Georgia, serif";
      g.lineWidth = 3; g.strokeStyle = 'rgba(18,11,7,0.8)'; g.strokeText(coach, W / 2, trackH - 16); g.fillText(coach, W / 2, trackH - 16);
    }
  }
  function plaque(g, x, y, glowA) {
    g.fillStyle = '#372316'; roundRect(g, x - 56, y - 22, 112, 44, 9); g.fill();
    g.strokeStyle = '#8f6522'; g.lineWidth = 1.5; roundRect(g, x - 56, y - 22, 112, 44, 9); g.stroke();
    if (glowA > 0) { g.fillStyle = 'rgba(255,150,50,' + glowA + ')'; roundRect(g, x - 54, y - 20, 108, 40, 8); g.fill(); }
    g.fillStyle = '#d3a342'; [[-50, -16], [50, -16], [-50, 16], [50, 16]].forEach(function (p) { g.beginPath(); g.arc(x + p[0], y + p[1], 1.6, 0, Math.PI * 2); g.fill(); });
  }


  function drawTopBar(g) {
    var w = Math.min(W - 130, 520), x0 = Math.max(16, (W - w) / 2 - (W < 700 ? 45 : 0)), y = 18;
    g.fillStyle = 'rgba(23,14,9,0.72)'; roundRect(g, x0 - 10, y - 10, w + 20, 26, 8); g.fill();
    g.strokeStyle = 'rgba(211,163,66,0.6)'; g.lineWidth = 1; roundRect(g, x0 - 10, y - 10, w + 20, 26, 8); g.stroke();
    g.fillStyle = 'rgba(251,234,187,0.25)'; g.fillRect(x0, y + 2, w, 2);
    var pm = Math.min(1, race.me.x / D.LEN), po = Math.min(1, race.op.x / D.LEN);
    g.fillStyle = '#5f7fae'; g.beginPath(); g.arc(x0 + w * po, y + 3, 5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e8b84a'; g.beginPath(); g.arc(x0 + w * pm, y + 3, 6, 0, Math.PI * 2); g.fill();
    g.font = '700 10px Cinzel, Georgia, serif'; g.textBaseline = 'middle';
    g.textAlign = 'right'; g.fillStyle = 'rgba(251,234,187,0.8)'; g.fillText('402 m', x0 + w, y + 12);
    g.textAlign = 'left'; g.fillStyle = '#e8b84a'; g.fillText('KAMU', x0, y + 12);
    g.textAlign = 'center'; g.fillStyle = '#a9c0e6'; g.fillText(race.rp.name, x0 + w / 2, y + 12);
  }


  function drawLights(g, now) {
    var t = raceNow(); if (t > 0.9) return;
    var ph = race.lightPhase, size = Math.min(W * 0.075, trackH * 0.11, 46), gap = size * 0.55;
    var cx0 = W / 2, cy0 = trackH * 0.27;
    var alpha = t > 0 ? Math.max(0, 1 - t / 0.9) : 1;
    g.globalAlpha = alpha;
    // rangka kayu
    g.fillStyle = '#2e1c10'; roundRect(g, cx0 - size * 1.5 - gap * 1.6, cy0 + size * 0.15, size * 3 + gap * 3.2, size * 0.28, 3); g.fill();
    for (var i = 0; i < 3; i++) {
      var lx = cx0 + (i - 1) * (size + gap);
      g.fillStyle = '#4f331e'; g.fillRect(lx - size * 0.07, cy0 - size * 0.1, size * 0.14, size * 0.6);
      g.fillStyle = '#8f6522'; g.fillRect(lx - size * 0.16, cy0 - size * 0.18, size * 0.32, size * 0.12);
      var on = ph >= i && ph < 3, go = ph === 3;
      if (on || go) {
        var fl = 0.8 + Math.sin(now / 70 + i * 2) * 0.2;
        g.globalCompositeOperation = 'lighter';
        g.drawImage(glow(go ? 'rgba(255,230,150,1)' : 'rgba(255,120,40,1)'), lx - size * (go ? 1.3 : 0.9), cy0 - size * (go ? 1.7 : 1.3), size * (go ? 2.6 : 1.8), size * (go ? 2.6 : 1.8));
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = go ? '#fff1c4' : '#ffb347';
        g.beginPath(); g.moveTo(lx - size * 0.13, cy0 - size * 0.18); g.quadraticCurveTo(lx - size * 0.2, cy0 - size * 0.55 * fl, lx, cy0 - size * 0.8 * fl); g.quadraticCurveTo(lx + size * 0.2, cy0 - size * 0.5 * fl, lx + size * 0.13, cy0 - size * 0.18); g.closePath(); g.fill();
      }
    }
    if (ph === 3) {
      g.font = Math.round(size * 0.9) + "px 'Pirata One', Georgia, serif"; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 5; g.strokeStyle = 'rgba(18,11,7,0.85)'; g.strokeText('BERANGKAT!', cx0, cy0 + size * 1.05);
      g.fillStyle = '#fff1c4'; g.fillText('BERANGKAT!', cx0, cy0 + size * 1.05);
    }
    g.globalAlpha = 1;
  }

  function roundRect(g, x, y, w, h, r) { r = Math.min(r, h / 2, w / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  // ------------------------------------------------------------ layar & API
  function on(t, ev, fn, o) { t.addEventListener(ev, fn, o); offs.push(function () { t.removeEventListener(ev, fn, o); }); }
  function pause() {
    if (!racing || !race || race.pausedAt != null) return;
    race.pausedAt = performance.now(); if (race.held) { race.held = false; race.log.push([Math.round(race.pausedAt - race.start - race.green), 0]); race.queue.push(race.log[race.log.length - 1]); }
    engineUpdate(null, false);
  }
  function resume() {
    if (!race || race.pausedAt == null) return;
    var n = 3, pa = race.pausedAt; race.countdown = 3.05;
    ctl.card('<div class="trk-k" style="text-align:center">Lanjut dalam</div><div class="trk-cd">3</div>', true);
    var cd = ovEl.querySelector('.trk-cd');
    var iv = setInterval(function () {
      n--; if (!running || !race) { clearInterval(iv); return; }
      if (n <= 0) { clearInterval(iv); race.start += performance.now() - pa; race.pausedAt = null; race.countdown = 0; ctl.hideCard(); } else if (cd) cd.textContent = n;
    }, 1000);
  }

  var ctl = {
    card: function (html, narrow) {
      ovEl.innerHTML = '<div class="trk-card"' + (narrow ? ' style="width:auto;padding:24px 40px"' : '') + '>' + html + '</div>';
      requestAnimationFrame(function () { if (ovEl) ovEl.classList.add('show'); });
      return ovEl.firstChild;
    },
    hideCard: function () { if (ovEl) ovEl.classList.remove('show'); },
    race: function (o, cb) {
      audioInit(); if (master && AC) master.gain.setTargetAtTime(vol(), AC.currentTime, 0.05);
      ctl.hideCard(); raceCb = cb; newRace(o);
    },
    idle: function (ship) { var sh = typeof ship === 'string' ? S.SHIPS[ship] : ship; if (sh) idleZone = [(S.ZHI - S.q(sh.zone * 160, 100)) / 1000, S.ZHI / 1000]; if (!racing) race = null; },
    haptic: function (v) { if (v != null) { opt.haptic = !!v; lsSet('haptic', opt.haptic); } return opt.haptic; },
    close: function (silent) {
      if (!running) return;
      running = false; racing = false; cancelAnimationFrame(rafId);
      try { engineUpdate(null, false); } catch (e) { }
      offs.forEach(function (f) { try { f(); } catch (e) { } }); offs = [];
      try { if (window.MTAudio && MTAudio.duckMusic) MTAudio.duckMusic(false); } catch (e) { }
      window.MT_SCENE_HOLD = false;
      var r = root, cb = raceCb, oc = onCloseCb; root = null; cv = null; cx = null; ovEl = null; race = null; raceCb = null; onCloseCb = null;
      if (r) { r.classList.remove('on'); setTimeout(function () { r.remove(); }, 380); }
      if (cb) cb({ cancelled: true });
      if (oc && !silent) oc();
    },
    _state: function () { return { racing: racing, race: race && { sm: race.sm, so: race.so, green: race.green, start: race.start, log: race.log }, lowFx: lowFx, frameEma: frameEma, cost: costEma, costMax: costMax }; },
    _press: press
  };

  function open(o) {
    if (running) ctl.close(true);
    o = o || {};
    try { RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { RM = false; }
    root = document.createElement('div'); root.className = 'mtg trk';
    root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', 'Trektrek-an');
    root.innerHTML = '<canvas aria-label="Selat Lurus"></canvas><div class="trk-ov"></div><div class="trk-top"><button type="button" class="trk-x" aria-label="Tinggalkan selat">✕</button></div>';
    document.body.appendChild(root);
    cv = root.querySelector('canvas'); cx = cv.getContext('2d', { alpha: false }); ovEl = root.querySelector('.trk-ov');
    onCloseCb = o.onClose || null; running = true; racing = false; race = null; lowFx = false; frameEma = 16; costEma = 0; costMax = 0;
    vol(); resize();
    try { if (window.MTAudio && MTAudio.duckMusic) MTAudio.duckMusic(true); } catch (e) { }
    window.MT_SCENE_HOLD = true;
    requestAnimationFrame(function () { if (root) root.classList.add('on'); });

    on(cv, 'pointerdown', function (e) { e.preventDefault(); audioInit(); if (racing) { try { cv.setPointerCapture(e.pointerId); } catch (x) { } press(true); } }, { passive: false });
    on(cv, 'pointerup', function (e) { e.preventDefault(); if (racing) press(false); }, { passive: false });
    on(cv, 'pointercancel', function () { if (racing) press(false); });
    on(cv, 'contextmenu', function (e) { e.preventDefault(); });
    on(window, 'keydown', function (e) {
      if (!running) return;
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ctl.close(); return; }
      if (e.code === 'Space' || e.code === 'Enter') {
        if (racing) { e.preventDefault(); e.stopPropagation(); if (!e.repeat) press(true); }
        else if (!e.repeat) { var b = ovEl && ovEl.classList.contains('show') && ovEl.querySelector('.trk-btn[data-utama]:not([disabled])'); if (b) { e.preventDefault(); e.stopPropagation(); b.click(); } }
      }
    }, true);
    on(window, 'keyup', function (e) { if (running && racing && (e.code === 'Space' || e.code === 'Enter')) { e.preventDefault(); e.stopPropagation(); press(false); } }, true);
    on(document, 'visibilitychange', function () { if (document.hidden) pause(); else resume(); });
    on(window, 'resize', resize);
    root.querySelector('.trk-x').onclick = function (e) { e.stopPropagation(); ctl.close(); };
    lastF = performance.now(); rafId = requestAnimationFrame(frame);
    return ctl;
  }

  return { open: open, isOpen: function () { return running; }, _ctl: function () { return running ? ctl : null; } };
})();
