<script>
/* =====================================================================
 * Tide v37 · Rupa Kedai Rantau (gambar procedural, tanpa file gambar)
 * Mengisi MTShip.kdHooks:
 *   sail(ctx, id, g)  -> motif di dalam layar persegi (sudah di-clip ke bentuk layar)
 *   after(ctx, o, g)  -> haluan, panji, penghuni, aura (unit lokal kapal: lambung ~120,
 *                        0,0 = garis air tengah; haluan di x+, buritan di x-)
 * Data rupa terpasang: o.kd = { layar, panji, haluan, penghuni, aura, ... } dari ship_visual.kd,
 * jadi kapten lain melihat rupa yang sama (mp_presence.s).
 * ===================================================================== */
(function () {
  if (!window.MTShip || !MTShip.kdHooks) return;
  var H = MTShip.kdHooks, U = window.MTUtil;
  function hex(c, a) { return U && U.css ? U.css(U.hex(c), a == null ? 1 : a) : c; }

  /* ---------------- motif layar ---------------- */
  var SAIL = {
    layar_parang: function (ctx, g) {
      // pita parang miring: lekuk-lekuk huruf S bersusun, cokelat soga + garis emas
      var w = g.hl + g.hr, h = g.yb - g.yt, x0 = g.mx - g.hl - h, step = 7;
      ctx.lineWidth = 2.1; ctx.strokeStyle = g.L('#5a3216', 0.62);
      for (var x = x0; x < g.mx + g.hr + 4; x += step) {
        ctx.beginPath(); ctx.moveTo(x, g.yb + 2);
        for (var k = 0; k <= 6; k++) { var f = k / 6; ctx.quadraticCurveTo(x + h * f - 2.2, g.yb - h * f + 1.5 * (k % 2 ? 1 : -1), x + h * f, g.yb - h * f); }
        ctx.stroke();
      }
      ctx.lineWidth = 0.55; ctx.strokeStyle = g.L(g.trim, 0.85);
      for (var x2 = x0 + step / 2; x2 < g.mx + g.hr + 4; x2 += step) { ctx.beginPath(); ctx.moveTo(x2, g.yb + 2); ctx.lineTo(x2 + h + 2, g.yt - 2); ctx.stroke(); }
      ctx.fillStyle = g.L('#5a3216', 0.5);
      for (var x3 = x0 + step / 2; x3 < g.mx + g.hr; x3 += step) for (var y3 = g.yt + 3; y3 < g.yb; y3 += 6) { var px = x3 + (g.yb - y3); if (px > g.mx - g.hl && px < g.mx + g.hr) { ctx.beginPath(); ctx.arc(px, y3, 0.7, 0, 6.3); ctx.fill(); } }
      void w;
    },
    layar_songket: function (ctx, g) {
      // benang emas: belah ketupat berderet + pita tepi bawah
      var h = g.yb - g.yt, gold = g.L('#e8c35a', 0.9), dk = g.L('#7a5a1a', 0.55);
      ctx.lineWidth = 0.5; ctx.strokeStyle = gold;
      for (var r = 0; r < 6; r++) {
        var y = g.yt + h * (0.12 + r * 0.14);
        for (var x = g.mx - g.hl + (r % 2 ? 3 : 0); x < g.mx + g.hr; x += 6) {
          ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x + 2, y); ctx.lineTo(x, y + 2); ctx.lineTo(x - 2, y); ctx.closePath(); ctx.stroke();
          ctx.fillStyle = r % 2 ? gold : dk; ctx.beginPath(); ctx.arc(x, y, 0.55, 0, 6.3); ctx.fill();
        }
      }
      ctx.fillStyle = g.L('#e8c35a', 0.75); ctx.fillRect(g.mx - g.hl - 4, g.yb - h * 0.12, g.hl + g.hr + 8, h * 0.06);
      ctx.fillStyle = g.L('#7a2a1a', 0.55); ctx.fillRect(g.mx - g.hl - 4, g.yb - h * 0.06, g.hl + g.hr + 8, h * 0.05);
      // kilau benang emas berjalan
      var sx = g.mx - g.hl + ((g.t * 14) % (g.hl + g.hr + 20)) - 10;
      var lg = ctx.createLinearGradient(sx - 5, 0, sx + 5, 0); lg.addColorStop(0, 'rgba(255,240,190,0)'); lg.addColorStop(0.5, 'rgba(255,240,190,.35)'); lg.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = lg; ctx.fillRect(sx - 5, g.yt, 10, h);
    },
    layar_ikat: function (ctx, g) {
      // tenun ikat: belah ketupat bertingkat dengan tepi "berbulu" warna tanah & nila
      var h = g.yb - g.yt, cols = ['#9a4a22', '#2c3a5a', '#c99a4a'];
      for (var r = 0; r < 3; r++) {
        var y = g.yt + h * (0.2 + r * 0.3);
        for (var x = g.mx - g.hl - 4 + (r % 2) * 6; x < g.mx + g.hr + 6; x += 12) {
          for (var k = 3; k >= 1; k--) {
            ctx.fillStyle = g.L(cols[(k + r) % 3], 0.55 + 0.1 * k);
            var dx = k * 2.2, dy = k * 2.6;
            ctx.beginPath(); ctx.moveTo(x, y - dy); ctx.lineTo(x + dx, y); ctx.lineTo(x, y + dy); ctx.lineTo(x - dx, y); ctx.closePath(); ctx.fill();
          }
          ctx.strokeStyle = g.L('#2c3a5a', 0.4); ctx.lineWidth = 0.4;
          for (var j = -3; j <= 3; j++) { ctx.beginPath(); ctx.moveTo(x - 8, y + j * 1.1); ctx.lineTo(x - 7 + (j & 1), y + j * 1.1); ctx.stroke(); }
        }
      }
      ctx.fillStyle = g.L('#9a4a22', 0.45); ctx.fillRect(g.mx - g.hl - 4, g.yt, g.hl + g.hr + 8, h * 0.06);
    },
    layar_kawung: function (ctx, g) {
      // kawung: empat elips bersilang (buah aren dibelah) dalam kisi
      var h = g.yb - g.yt, s = 5.2;
      for (var y = g.yt + s * 0.9; y < g.yb + s; y += s * 1.8) {
        for (var x = g.mx - g.hl - s; x < g.mx + g.hr + s; x += s * 1.8) {
          for (var q = 0; q < 4; q++) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(q * Math.PI / 2 + Math.PI / 4);
            ctx.fillStyle = g.L('#3b2a1a', 0.5); ctx.beginPath(); ctx.ellipse(0, -s * 0.48, s * 0.26, s * 0.46, 0, 0, 6.3); ctx.fill();
            ctx.fillStyle = g.L('#e8d7a8', 0.75); ctx.beginPath(); ctx.ellipse(0, -s * 0.48, s * 0.1, s * 0.22, 0, 0, 6.3); ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = g.L(g.trim, 0.85); ctx.beginPath(); ctx.arc(x, y, 0.8, 0, 6.3); ctx.fill();
        }
      }
      void h;
    }
  };
  // Layar Emas: juara 1 Pacu Dagang (sepekan, kd.emas) atau permanen (layar_emas)
  SAIL.layar_emas = function (ctx, g) {
    var h = g.yb - g.yt, x0 = g.mx - g.hl - 4, w = g.hl + g.hr + 8;
    var gg = ctx.createLinearGradient(x0, g.yt, x0 + w, g.yb);
    gg.addColorStop(0, g.L('#b8862a', 0.92)); gg.addColorStop(0.45, g.L('#f6d77a', 0.95)); gg.addColorStop(0.7, g.L('#d9a83c', 0.92)); gg.addColorStop(1, g.L('#8a5e18', 0.92));
    ctx.fillStyle = gg; ctx.fillRect(x0, g.yt - 2, w, h + 6);
    ctx.strokeStyle = g.L('#7a1a18', 0.8); ctx.lineWidth = 0.9; ctx.setLineDash([1.6, 1.2]);
    ctx.strokeRect(g.mx - g.hl + 1.6, g.yt + 1.6, g.hl + g.hr - 3.2, h - 3.2); ctx.setLineDash([]);
    ctx.fillStyle = g.L('#7a1a18', 0.7);
    for (var k = 0; k < 3; k++) { var cx = g.mx - g.hl * 0.55 + k * (g.hl + g.hr) * 0.36, cy = g.yt + h * 0.5; ctx.beginPath(); ctx.moveTo(cx, cy - 2.4); ctx.lineTo(cx + 2.4, cy); ctx.lineTo(cx, cy + 2.4); ctx.lineTo(cx - 2.4, cy); ctx.closePath(); ctx.fill(); }
    var sx = x0 + ((g.t * 22) % (w + 30)) - 15, sh = ctx.createLinearGradient(sx - 7, 0, sx + 7, 0);
    sh.addColorStop(0, 'rgba(255,250,220,0)'); sh.addColorStop(0.5, 'rgba(255,250,220,.6)'); sh.addColorStop(1, 'rgba(255,250,220,0)');
    ctx.fillStyle = sh; ctx.fillRect(sx - 7, g.yt, 14, h);
  };
  H.sail = function (ctx, id, g) { var f = SAIL[id]; if (f) f(ctx, g); };

  /* ---------------- panji ---------------- */
  var RAINBOW = ['#c0392b', '#e67e22', '#f1c40f', '#27ae60', '#2980b9', '#6c3483', '#f5f0e6'];
  function umbul(ctx, g, faces) {
    // tiang bambu melengkung di buritan, umbul-umbul panjang berkibar
    var bx = -60, by = -30, tx = -70, ty = -118, t = g.t;
    ctx.strokeStyle = g.L('#b89a5a'); ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx - 4, (by + ty) / 2, tx, ty); ctx.stroke();
    ctx.strokeStyle = g.L('#7a6236', 0.8); ctx.lineWidth = 0.5;
    for (var n = 1; n < 6; n++) { var f = n / 6, nx = bx + (tx - bx) * f - 2 * Math.sin(f * Math.PI), ny = by + (ty - by) * f; ctx.beginPath(); ctx.moveTo(nx - 1, ny); ctx.lineTo(nx + 1, ny); ctx.stroke(); }
    // kain: 7 ruas, melengkung ke belakang (x-), berkibar
    var len = 7, segH = 9;
    for (var i = 0; i < len; i++) {
      var y0 = ty + 2 + i * segH, sw0 = Math.sin(t * 3.2 + i * 0.7) * (1.5 + i * 0.9), sw1 = Math.sin(t * 3.2 + (i + 1) * 0.7) * (1.5 + (i + 1) * 0.9);
      ctx.fillStyle = g.L(faces ? (i % 2 ? '#7a1a18' : '#e8c35a') : RAINBOW[i]);
      ctx.beginPath(); ctx.moveTo(tx - 1 + sw0, y0); ctx.lineTo(tx - 9 - i * 0.6 + sw0, y0 + 1); ctx.lineTo(tx - 9 - (i + 1) * 0.6 + sw1, y0 + segH + 1); ctx.lineTo(tx - 1 + sw1, y0 + segH); ctx.closePath(); ctx.fill();
      if (faces) {
        var cx = tx - 5 - i * 0.6 + (sw0 + sw1) / 2, cy = y0 + segH / 2;
        ctx.fillStyle = g.L(i % 2 ? '#e8c35a' : '#7a1a18'); ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, 6.3); ctx.fill();
        ctx.fillStyle = g.L('#2a1b10'); ctx.fillRect(cx - 1.1, cy - 0.6, 0.6, 0.6); ctx.fillRect(cx + 0.5, cy - 0.6, 0.6, 0.6);
        ctx.strokeStyle = g.L('#2a1b10'); ctx.lineWidth = 0.35; ctx.beginPath(); ctx.arc(cx, cy + 0.3, 1, 0.3, Math.PI - 0.3); ctx.stroke();
      }
    }
    // rumbai ujung
    var ey = ty + 2 + len * segH, sw = Math.sin(t * 3.2 + len * 0.7) * (1.5 + len * 0.9);
    ctx.strokeStyle = g.L('#e8c35a'); ctx.lineWidth = 0.5;
    for (var r = 0; r < 4; r++) { ctx.beginPath(); ctx.moveTo(tx - 2 - r * 2.2 + sw, ey); ctx.lineTo(tx - 2 - r * 2.2 + sw + Math.sin(t * 5 + r) * 1.2, ey + 4); ctx.stroke(); }
  }
  var PANJI = {
    panji_umbul: function (ctx, o, g) { umbul(ctx, g, false); },
    panji_tujuh: function (ctx, o, g) { umbul(ctx, g, true); },
    panji_susun: function (ctx, o, g) {
      // tiga panji segitiga bertingkat di tiang utama
      var m = g.M[1] || g.M[0], cols = [o.flag || g.flag, g.trim, o.emblemColor || '#f3e9d2'];
      for (var k = 0; k < 3; k++) {
        var y = m.top + 14 + k * 11, len = 20 - k * 3;
        ctx.fillStyle = g.L(cols[k]);
        ctx.beginPath(); ctx.moveTo(m.x, y);
        for (var a = 0; a <= 5; a++) { var u = a / 5; ctx.lineTo(m.x - u * len, y + u * 3.2 + Math.sin(g.t * 5 + u * 5 + k) * 1.4 * u); }
        ctx.lineTo(m.x, y + 6.5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = g.L('#000000', 0.2); ctx.lineWidth = 0.4; ctx.stroke();
      }
    },
    panji_walet: function (ctx, o, g) {
      // panji panjang bercabang dua di tiang depan, berkibar cepat
      var m = g.M[0], y = m.top + 2, len = 38, col = o.flag || g.flag;
      for (var b = 0; b < 2; b++) {
        ctx.fillStyle = g.L(b ? g.trim : col);
        ctx.beginPath(); ctx.moveTo(m.x, y + b * 2.6);
        for (var a = 0; a <= 8; a++) { var u = a / 8; ctx.lineTo(m.x - u * len, y + b * 2.6 + u * (b ? 4.5 : 1.5) + Math.sin(g.t * 7 + u * 6 + b) * 2.2 * u); }
        for (var a2 = 8; a2 >= 0; a2--) { var u2 = a2 / 8; ctx.lineTo(m.x - u2 * len * (0.96 - b * 0.06), y + b * 2.6 + 2.2 * (1 - u2 * 0.7) + u2 * (b ? 4.5 : 1.5) + Math.sin(g.t * 7 + u2 * 6 + b) * 2.2 * u2); }
        ctx.closePath(); ctx.fill();
      }
    }
  };

  /* ---------------- haluan ---------------- */
  var HALUAN = {
    haluan_ikan: function (ctx, o, g) {
      // ikan terbang perak-biru di pangkal cucur, sirip dada terbentang seperti sayap
      ctx.save(); ctx.translate(61, -27); ctx.rotate(-0.42);
      var flap = Math.sin(g.t * 2.2) * 0.08;
      ctx.fillStyle = g.L('#9fc3d9', 0.75);
      ctx.save(); ctx.rotate(-0.5 + flap); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-4, -12, -12, -15); ctx.quadraticCurveTo(-7, -6, -3, 1); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.strokeStyle = g.L('#5b8aa6', 0.8); ctx.lineWidth = 0.35;
      for (var r = 0; r < 4; r++) { ctx.save(); ctx.rotate(-0.5 + flap); ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(-5 - r * 2, -6 - r * 2.2); ctx.stroke(); ctx.restore(); }
      var bg = ctx.createLinearGradient(0, -3, 0, 3); bg.addColorStop(0, g.L('#d8e6ee')); bg.addColorStop(1, g.L('#4f7c9a'));
      ctx.fillStyle = bg; ctx.beginPath(); ctx.ellipse(0, 0, 9, 2.8, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = g.L('#4f7c9a'); ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-13, -3.5); ctx.lineTo(-12, 0); ctx.lineTo(-13.5, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = g.L(g.trim); ctx.beginPath(); ctx.arc(6, -0.6, 1, 0, 6.3); ctx.fill();
      ctx.fillStyle = g.L('#1a1a1a'); ctx.beginPath(); ctx.arc(6.2, -0.6, 0.45, 0, 6.3); ctx.fill();
      ctx.restore();
    }
  };

  /* ---------------- penghuni ---------------- */
  var PENGHUNI = {
    penghuni_kucing: function (ctx, o, g) {
      // kucing belang tidur melingkar di atas peti buritan; ekor bergerak, telinga berkedut, mata menyala bila malam
      var t = g.t, night = (o.lanterns || 0) > 0.35;
      ctx.save(); ctx.translate(-33, -31); ctx.scale(1.45, 1.45); var x = 0, y = 0;
      ctx.fillStyle = g.L('#8a6238'); ctx.fillRect(x - 5, y + 1.5, 10, 5.5);
      ctx.strokeStyle = g.L('#4a3220'); ctx.lineWidth = 0.4; ctx.strokeRect(x - 5, y + 1.5, 10, 5.5);
      var tail = Math.sin(t * 1.6) * 0.5;
      ctx.strokeStyle = g.L('#e08a3a'); ctx.lineWidth = 1.1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 3.6, y + 0.8); ctx.quadraticCurveTo(x - 7, y + 0.6 - tail * 2, x - 6.2 - tail, y - 2.4 - tail); ctx.stroke();
      ctx.fillStyle = g.L('#f2eadb'); ctx.beginPath(); ctx.ellipse(x, y, 4.2, 2.4, 0, 0, 6.3); ctx.fill();
      ctx.fillStyle = g.L('#e08a3a'); ctx.beginPath(); ctx.ellipse(x - 1.5, y - 0.6, 2.4, 1.6, 0.2, 0, 6.3); ctx.fill();
      ctx.fillStyle = g.L('#3a2a20'); ctx.beginPath(); ctx.ellipse(x + 1.6, y - 0.4, 1.3, 1, -0.3, 0, 6.3); ctx.fill();
      // kepala
      var hx = x + 3.8, hy = y - 1.2, tw = Math.max(0, Math.sin(t * 3.3) - 0.85) * 4;
      ctx.fillStyle = g.L('#f2eadb'); ctx.beginPath(); ctx.arc(hx, hy, 1.9, 0, 6.3); ctx.fill();
      ctx.fillStyle = g.L('#e08a3a'); ctx.beginPath(); ctx.moveTo(hx - 1.6, hy - 1); ctx.lineTo(hx - 1.1, hy - 3 - tw * 0.3); ctx.lineTo(hx - 0.2, hy - 1.6); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 0.3, hy - 1.6); ctx.lineTo(hx + 1.2, hy - 3.1); ctx.lineTo(hx + 1.7, hy - 1); ctx.closePath(); ctx.fill();
      if (night) {
        ctx.fillStyle = 'rgba(190,255,140,.95)'; ctx.beginPath(); ctx.arc(hx + 0.2, hy - 0.2, 0.42, 0, 6.3); ctx.arc(hx + 1.2, hy - 0.2, 0.42, 0, 6.3); ctx.fill();
      } else {
        ctx.strokeStyle = g.L('#2a1b10'); ctx.lineWidth = 0.3;
        ctx.beginPath(); ctx.moveTo(hx - 0.2, hy - 0.2); ctx.lineTo(hx + 0.6, hy - 0.1); ctx.moveTo(hx + 0.9, hy - 0.1); ctx.lineTo(hx + 1.6, hy - 0.2); ctx.stroke();
      }
      ctx.restore();
    }
  };

  /* ---------------- aura ---------------- */
  var AURA = {
    aura_lampion: function (ctx, o, g) {
      // untaian lampion merah dari cucur ke tiang & antartiang; menyala hangat saat gelap
      var on = Math.max(0, o.lanterns || 0), M = g.M;
      var runs = [[84, -40, M[0].x, M[0].top + 26]];
      for (var i = 0; i < M.length - 1; i++) runs.push([M[i].x, M[i].top + 30, M[i + 1].x, M[i + 1].top + 32]);
      runs.push([M[M.length - 1].x, M[M.length - 1].top + 30, -60, -40]);
      runs.forEach(function (rn, ri) {
        ctx.strokeStyle = g.L('#2a1b10', 0.5); ctx.lineWidth = 0.35;
        ctx.beginPath(); ctx.moveTo(rn[0], rn[1]); ctx.quadraticCurveTo((rn[0] + rn[2]) / 2, Math.max(rn[1], rn[3]) + 7, rn[2], rn[3]); ctx.stroke();
        var n = 5;
        for (var k = 1; k < n; k++) {
          var f = k / n, mx = (rn[0] + rn[2]) / 2, my = Math.max(rn[1], rn[3]) + 7;
          var px = (1 - f) * (1 - f) * rn[0] + 2 * (1 - f) * f * mx + f * f * rn[2], py = (1 - f) * (1 - f) * rn[1] + 2 * (1 - f) * f * my + f * f * rn[3];
          var sw = Math.sin(g.t * 1.4 + k + ri) * 0.4;
          if (on > 0.05 && !o.reflect) {
            ctx.globalCompositeOperation = 'lighter';
            var gl = ctx.createRadialGradient(px, py + 2, 0, px, py + 2, 6);
            gl.addColorStop(0, 'rgba(255,120,70,' + (0.55 * on).toFixed(3) + ')'); gl.addColorStop(1, 'rgba(255,80,40,0)');
            ctx.fillStyle = gl; ctx.fillRect(px - 6, py - 4, 12, 12);
            ctx.globalCompositeOperation = 'source-over';
          }
          ctx.save(); ctx.translate(px, py); ctx.rotate(sw);
          ctx.fillStyle = on > 0.05 ? 'rgba(255,' + Math.round(110 + 80 * on) + ',80,' + (0.7 + 0.3 * on).toFixed(3) + ')' : g.L('#b8302a');
          ctx.beginPath(); ctx.ellipse(0, 2.2, 1.6, 2, 0, 0, 6.3); ctx.fill();
          ctx.fillStyle = g.L('#e8c35a'); ctx.fillRect(-0.9, 0, 1.8, 0.45); ctx.fillRect(-0.9, 3.9, 1.8, 0.45);
          ctx.restore();
        }
      });
    },
    aura_lentera_ikn: function (ctx, o, g) {
      // lentera kuningan tua IKN di galah buritan; cahaya teal-emas dan serbuk cahaya naik pelan
      if (o.reflect) return;
      var x = -70, y = -64, on = 0.45 + 0.55 * Math.max(0, o.lanterns || 0), fk = 0.9 + Math.sin(g.t * 6) * 0.06;
      ctx.strokeStyle = g.L('#3b2616'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-60, -30); ctx.lineTo(-64, -58); ctx.lineTo(x, y - 3); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      var gl = ctx.createRadialGradient(x, y + 2, 0, x, y + 2, 16 * fk);
      gl.addColorStop(0, 'rgba(150,255,220,' + (0.45 * on).toFixed(3) + ')'); gl.addColorStop(0.5, 'rgba(255,215,120,' + (0.22 * on).toFixed(3) + ')'); gl.addColorStop(1, 'rgba(255,200,100,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - 17, y - 15, 34, 34);
      for (var k = 0; k < 5; k++) {
        var ph = (g.t * 0.35 + k / 5) % 1, mx = x + Math.sin(g.t * 1.3 + k * 2) * 4, my = y - ph * 26;
        ctx.fillStyle = 'rgba(200,255,230,' + (0.6 * (1 - ph) * on).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(mx, my, 0.7, 0, 6.3); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = g.L('#8a6a2a'); ctx.fillRect(x - 2.4, y - 3, 4.8, 1); ctx.fillRect(x - 2.4, y + 4.4, 4.8, 1);
      ctx.beginPath(); ctx.moveTo(x - 1.6, y - 3); ctx.lineTo(x, y - 5.4); ctx.lineTo(x + 1.6, y - 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(180,255,225,' + (0.55 + 0.4 * on).toFixed(3) + ')'; ctx.fillRect(x - 1.8, y - 2, 3.6, 6.4);
      ctx.strokeStyle = g.L('#5a4416'); ctx.lineWidth = 0.35; ctx.strokeRect(x - 1.8, y - 2, 3.6, 6.4);
      ctx.beginPath(); ctx.moveTo(x, y - 2); ctx.lineTo(x, y + 4.4); ctx.stroke();
    }
  };

  /* ---------------- lambang (eksklusif) ---------------- */

        sg.addColorStop(0, 'rgba(255,120,40,' + (0.85 - s * 0.18).toFixed(3) + ')'); sg.addColorStop(1, 'rgba(255,60,20,0)');
        ctx.strokeStyle = sg; ctx.lineWidth = 2.6 - s * 0.5;
        ctx.beginPath(); ctx.moveTo(-60, y0);
        for (var x = 0; x <= len; x += 6) ctx.lineTo(-60 - x, y0 + Math.sin(g.t * 4 + x * 0.12 + s) * (0.6 + x * 0.02));
        ctx.stroke();
      }
      for (var e = 0; e < 18; e++) {
        var ph = (g.t * (0.6 + mv * 0.6) + e / 18) % 1, ex = -60 - ph * len - seeded(e) * 6, ey = 3 + (seeded(e + 3) - 0.5) * 6 - ph * 9 * seeded(e + 7);
        glowDot(ctx, ex, ey, 5, '255,130,40', 0.7 * (1 - ph));
        ctx.fillStyle = 'rgba(255,' + Math.round(210 - 80 * ph) + ',90,' + (1 - ph).toFixed(3) + ')'; ctx.fillRect(ex - 0.4, ey - 0.4, 1.8, 1.8);
      }
      ctx.restore();
    },
    jejak_ekor: function (ctx, o, g) {
      if (o.reflect) return;
      var mv = moving(o), len = 70 + 70 * mv, segs = 26, pts = [];
      for (var i = 0; i <= segs; i++) { var u = i / segs, x = -58 - u * len; pts.push([x, 5 + Math.sin(g.t * 3 - u * 7) * (1.5 + u * 6) - u * 2]); }
      ctx.save();
      // tubuh: pita meruncing
      for (var j = 0; j < segs; j++) {
        var u0 = j / segs, w = (1 - u0) * 5 + 0.6, a = pts[j], b = pts[j + 1];
        ctx.strokeStyle = 'rgba(' + Math.round(40 + 40 * u0) + ',' + Math.round(150 - 30 * u0) + ',' + Math.round(140 - 20 * u0) + ',' + (0.75 - u0 * 0.35).toFixed(3) + ')';
        ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        if (j % 3 === 1) { ctx.fillStyle = 'rgba(232,195,90,' + (0.8 - u0 * 0.5).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(a[0], a[1] - w * 0.4); ctx.lineTo(a[0] - 1.5, a[1] - w * 0.4 - 2.6 * (1 - u0)); ctx.lineTo(a[0] - 3, a[1] - w * 0.4); ctx.fill(); }
        if (j % 2 === 0) { ctx.strokeStyle = 'rgba(200,255,240,' + (0.35 - u0 * 0.25).toFixed(3) + ')'; ctx.lineWidth = 0.4; ctx.beginPath(); ctx.arc(a[0], a[1], w * 0.45, 0.2, Math.PI - 0.2); ctx.stroke(); }
      }
      // sirip ekor
      var tl = pts[segs], fl = Math.sin(g.t * 3) * 2;
      ctx.fillStyle = 'rgba(70,170,150,0.7)';
      ctx.beginPath(); ctx.moveTo(tl[0] + 2, tl[1]); ctx.quadraticCurveTo(tl[0] - 6, tl[1] - 7 + fl, tl[0] - 10, tl[1] - 9 + fl); ctx.quadraticCurveTo(tl[0] - 6, tl[1], tl[0] - 10, tl[1] + 6 + fl); ctx.quadraticCurveTo(tl[0] - 4, tl[1] + 2, tl[0] + 2, tl[1]); ctx.fill();
      // cipratan
      for (var k = 0; k < 8; k++) { var ph = (g.t * 0.9 + k / 8) % 1, sp = pts[Math.floor(seeded(k) * segs)]; ctx.fillStyle = 'rgba(225,250,255,' + (0.6 * (1 - ph)).toFixed(3) + ')'; ctx.fillRect(sp[0] + (seeded(k + 2) - 0.5) * 6, sp[1] - ph * 7, 1, 1); }
      ctx.restore();
    }
  };

  /* ---------------- meriam: mulut membara ---------------- */
  var MERIAM = {
    meriam_letusan: function (ctx, o, g) {
      if (o.reflect || !g.deckPt) return;
      var n = g.ports || 7;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (var i = 0; i < n; i++) {
        var dp = g.deckPt(n > 1 ? 0.14 + i * (0.69 / (n - 1)) : 0.5), x = dp[0] + 0.1, y = dp[1] + 10, pl = 0.6 + 0.4 * Math.sin(g.t * 3 + i * 1.3);
        glowDot(ctx, x, y, 9, '255,90,20', 0.8 * pl);
        ctx.fillStyle = 'rgba(255,' + Math.round(170 + 60 * pl) + ',80,' + Math.min(1, 0.95 * pl + 0.2).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 6.3); ctx.fill();
        var ph = (g.t * 0.35 + i / n) % 1;
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(90,80,75,' + (0.25 * (1 - ph)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(x - 1 + Math.sin(g.t + i) * 1.5, y - 3 - ph * 12, 1 + ph * 3, 0, 6.3); ctx.fill();
        ctx.globalCompositeOperation = 'lighter';
      }
      ctx.restore();
    }
  };

  /* ---------------- kedatangan: Asap Gunung ---------------- */
  var DATANG = {
    datang_asap: function (ctx, o, g) {
      if (o.reflect || o.arrive == null || o.arrive >= 1) return;
      var a = o.arrive, k = Math.sin(Math.min(1, a) * Math.PI);
      ctx.save();
      for (var i = 0; i < 16; i++) {
        var ph = (a * 1.6 + seeded(i)) % 1, x = -70 + seeded(i + 4) * 150 + Math.sin(g.t + i) * 4, y = -10 - ph * 120 - seeded(i + 8) * 20, r = 10 + ph * 26;
        var c0 = Math.round(70 + 40 * seeded(i)), al = 0.5 * k * (1 - ph * 0.6), pg = ctx.createRadialGradient(x, y, 0, x, y, r);
        pg.addColorStop(0, 'rgba(' + c0 + ',' + (c0 - 8) + ',' + (c0 - 14) + ',' + al.toFixed(3) + ')'); pg.addColorStop(0.65, 'rgba(' + c0 + ',' + (c0 - 8) + ',' + (c0 - 14) + ',' + (al * 0.55).toFixed(3) + ')'); pg.addColorStop(1, 'rgba(' + c0 + ',' + (c0 - 8) + ',' + (c0 - 14) + ',0)');
        ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill();
      }
      ctx.globalCompositeOperation = 'lighter';
      glowDot(ctx, 0, -6, 90, '255,110,40', 0.22 * k);
      ctx.globalCompositeOperation = 'source-over';
      for (var j = 0; j < 40; j++) {
        var fy = ((g.t * 18 + seeded(j) * 200) % 200) - 170, fx = -100 + seeded(j + 11) * 200 + Math.sin(g.t + j) * 4;
        ctx.fillStyle = 'rgba(200,195,190,' + (0.7 * k).toFixed(3) + ')'; ctx.fillRect(fx, fy, 1.1, 1.1);
      }
      ctx.restore();
    }
  };

  /* ---------------- Kesaktian Set ---------------- */
  var SAKTI = {
    api_gunung: function (ctx, o, g) {
      if (o.reflect) return;
      var M = g.M, main = M[0]; M.forEach(function (m) { if (m.top < main.top) main = m; });
      ctx.save();
      // udara panas bergetar di atas dek
      ctx.globalCompositeOperation = 'lighter';
      for (var w = 0; w < 6; w++) {
        var y = -30 - w * 13 - ((g.t * 14) % 13);
        ctx.strokeStyle = 'rgba(255,150,80,' + (0.07 + 0.03 * Math.sin(g.t * 3 + w)).toFixed(3) + ')'; ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (var x = -60; x <= 60; x += 6) { var yy = y + Math.sin(g.t * 5 + x * 0.2 + w) * 1.4; if (x === -60) ctx.moveTo(x, yy); else ctx.lineTo(x, yy); }
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      // letusan kecil dari puncak tiang utama (tiap 7 detik)
      var cyc = (g.t % 7) / 7;
      if (cyc < 0.45) {
        var u = cyc / 0.45, top = main.top - 6;
        ctx.globalCompositeOperation = 'lighter';
        glowDot(ctx, main.x, top, 26 * (1 - u) + 6, '255,120,30', 0.75 * (1 - u));
        for (var b = 0; b < 9; b++) {
          var ang = -Math.PI / 2 + (seeded(b) - 0.5) * 1.8, v = 40 + seeded(b + 5) * 30, bx = main.x + Math.cos(ang) * v * u, by = top + Math.sin(ang) * v * u + 60 * u * u;
          glowDot(ctx, bx, by, 6 * (1 - u) + 2, '255,110,30', 0.6 * (1 - u));
          ctx.fillStyle = 'rgba(255,' + Math.round(190 - 90 * u) + ',70,' + (1 - u).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(bx, by, 2.2 * (1 - u) + 0.8, 0, 6.3); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(70,62,60,' + (0.35 * (1 - u)).toFixed(3) + ')'; ctx.beginPath(); ctx.arc(main.x, top - 10 - u * 24, 5 + u * 12, 0, 6.3); ctx.fill();
      }
      ctx.restore();
    },
    naga_samudra: function (ctx, o, g) {
      if (o.reflect) return;
      var arriving = o.arrive != null && o.arrive < 1, segs = 30, pts = [], vis;
      if (arriving) {
        // naga muncul di depan haluan, menyambut kedatangan
        var a = o.arrive; vis = Math.sin(Math.min(1, a) * Math.PI);
        for (var i = 0; i <= segs; i++) { var u = i / segs; pts.push([96 + Math.sin(u * 5 + g.t * 2) * 8 - u * 14, 6 - (1 - u) * 85 * vis + u * 4]); }
      } else {
        // melingkari kapal sesekali (siklus 14 detik, tampak 7 detik)
        var cyc = (g.t % 14) / 14; if (cyc > 0.5) return;
        var c = cyc / 0.5; vis = Math.sin(c * Math.PI);
        for (var j = 0; j <= segs; j++) {
          var uu = j / segs, ang = c * 6.283 * 1.1 - uu * 2.1;
          pts.push([Math.cos(ang) * 96, -26 + Math.sin(ang) * 30 - Math.max(0, -Math.sin(ang)) * 18 + Math.sin(uu * 9 + g.t * 3) * 3]);
        }
      }
      ctx.save();
      for (var k = segs - 1; k >= 0; k--) {
        var p0 = pts[k], p1 = pts[k + 1], w = 7 * (1 - k / segs) + 1.2;
        ctx.strokeStyle = 'rgba(' + Math.round(110 + 60 * (k / segs)) + ',230,220,' + (0.42 * vis).toFixed(3) + ')'; ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
        if (k % 3 === 0) { ctx.strokeStyle = 'rgba(230,255,250,' + (0.4 * vis).toFixed(3) + ')'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.arc(p0[0], p0[1], w * 0.4, 0.3, Math.PI - 0.3); ctx.stroke(); }
      }
      // kepala bening
      var hd = pts[0], nx = pts[0][0] - pts[2][0], ny = pts[0][1] - pts[2][1], ha = Math.atan2(ny, nx);
      ctx.translate(hd[0], hd[1]); ctx.rotate(ha);
      ctx.fillStyle = 'rgba(170,240,230,' + (0.6 * vis).toFixed(3) + ')';
      ctx.beginPath(); ctx.moveTo(-4, -4.5); ctx.quadraticCurveTo(6, -5.5, 11, -1); ctx.lineTo(6, 2.5); ctx.quadraticCurveTo(0, 4.5, -4, 4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(240,215,140,' + (0.8 * vis).toFixed(3) + ')'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-1, -4); ctx.quadraticCurveTo(-5, -9, -9, -9.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.bezierCurveTo(10, 3, 8, 6, 12, 8); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter'; glowDot(ctx, 4, -2, 4, '200,255,240', 0.8 * vis);
      ctx.restore();
      // cipratan di titik masuk-keluar air
      ctx.save();
      for (var s = 0; s < 10; s++) { var ph = (g.t * 1.2 + s / 10) % 1, sp = pts[segs], sx = sp[0] + (seeded(s) - 0.5) * 14, sy = 4 - ph * 10 * seeded(s + 1); ctx.fillStyle = 'rgba(230,250,255,' + (0.6 * vis * (1 - ph)).toFixed(3) + ')'; ctx.fillRect(sx, sy, 1.2, 1.2); }
      ctx.restore();
    }
  };

  /* ---------------- Kucing Belang melompat ke dermaga ---------------- */
  function catStand(ctx, g, x, y, sx, walk, night) {
    // kucing berdiri/berjalan (menghadap sx: 1 kanan, -1 kiri)
    ctx.save(); ctx.translate(x, y); ctx.scale(1.45 * sx, 1.45);
    var lg = Math.sin(walk * 8) * 0.9, tail = Math.sin(g.t * 2) * 0.6;
    ctx.strokeStyle = g.L('#e08a3a'); ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3.6, -2.6); ctx.quadraticCurveTo(-6, -4, -6.5 + tail, -7.2); ctx.stroke();
    ctx.strokeStyle = g.L('#f2eadb'); ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-2.4, -1.6); ctx.lineTo(-2.4 + lg, 0); ctx.moveTo(-1.2, -1.6); ctx.lineTo(-1.2 - lg, 0);
    ctx.moveTo(1.8, -1.6); ctx.lineTo(1.8 - lg, 0); ctx.moveTo(3, -1.6); ctx.lineTo(3 + lg, 0); ctx.stroke();
    ctx.fillStyle = g.L('#f2eadb'); ctx.beginPath(); ctx.ellipse(0.2, -2.6, 4, 1.7, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = g.L('#e08a3a'); ctx.beginPath(); ctx.ellipse(-1.2, -3, 2, 1.1, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = g.L('#3a2a20'); ctx.beginPath(); ctx.ellipse(1.6, -3, 1.1, 0.8, 0, 0, 6.3); ctx.fill();
    var hx = 4.4, hy = -4.2;
    ctx.fillStyle = g.L('#f2eadb'); ctx.beginPath(); ctx.arc(hx, hy, 1.7, 0, 6.3); ctx.fill();
    ctx.fillStyle = g.L('#e08a3a');
    ctx.beginPath(); ctx.moveTo(hx - 1.4, hy - 0.9); ctx.lineTo(hx - 1, hy - 2.8); ctx.lineTo(hx - 0.1, hy - 1.4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hx + 0.3, hy - 1.4); ctx.lineTo(hx + 1.1, hy - 2.9); ctx.lineTo(hx + 1.6, hy - 0.9); ctx.closePath(); ctx.fill();
    if (night) { ctx.fillStyle = 'rgba(190,255,140,.95)'; ctx.beginPath(); ctx.arc(hx + 0.8, hy - 0.2, 0.4, 0, 6.3); ctx.fill(); }
    else { ctx.fillStyle = g.L('#2a1b10'); ctx.beginPath(); ctx.arc(hx + 0.8, hy - 0.2, 0.3, 0, 6.3); ctx.fill(); }
    ctx.restore();
  }
  var catSleep = PENGHUNI.penghuni_kucing;
  PENGHUNI.penghuni_kucing = function (ctx, o, g) {
    var dp = o.dockPt, sk = o.sizeK || 1;
    if (!o.docked || !dp || o.reflect) return catSleep(ctx, o, g);
    var tx = dp[0] / sk + 6, ty = dp[1] / sk, deck = [-33, -31], d = Math.hypot(tx - deck[0], ty - deck[1]);
    if (d > 150 || d < 10) return catSleep(ctx, o, g);
    var cyc = g.t % 22, night = (o.lanterns || 0) > 0.35;
    if (cyc < 6 || cyc >= 19.5) return catSleep(ctx, o, g);
    var dirOut = tx < deck[0] ? -1 : 1;
    if (cyc < 7) {   // lompat ke dermaga
      var u = cyc - 6, x = deck[0] + (tx - deck[0]) * u, y = deck[1] + (ty - deck[1]) * u - Math.sin(u * Math.PI) * 22;
      catStand(ctx, g, x, y, dirOut, 0, night); return;
    }
    if (cyc < 18.5) {   // jalan-jalan di dermaga
      var w = cyc - 7, off = Math.sin(w * 0.55) * 9, face = Math.cos(w * 0.55) >= 0 ? dirOut : -dirOut;
      var sit = w > 4 && w < 6.5;
      catStand(ctx, g, tx + off * dirOut, ty, face, sit ? 0 : w, night); return;
    }
    var v = (cyc - 18.5), bx = tx + (deck[0] - tx) * v, by = ty + (deck[1] - ty) * v - Math.sin(v * Math.PI) * 22;   // lompat pulang
    catStand(ctx, g, bx, by, -dirOut, 0, night);
  };

  H.after = function (ctx, o, g) {
    var kd = o.kd || {};
    if (kd.aura && AURA[kd.aura]) AURA[kd.aura](ctx, o, g);
    if (o.reflect) return;
    if (kd.jejak && JEJAK[kd.jejak]) JEJAK[kd.jejak](ctx, o, g);
    if (kd.meriam && MERIAM[kd.meriam]) MERIAM[kd.meriam](ctx, o, g);
    (kd.sakti || []).forEach(function (sid) { if (SAKTI[sid]) SAKTI[sid](ctx, o, g); });
    if (kd.kedatangan && DATANG[kd.kedatangan]) DATANG[kd.kedatangan](ctx, o, g);
    if (kd.lambang && LAMBANG[kd.lambang]) LAMBANG[kd.lambang](ctx, o, g);
    if (kd.panji && PANJI[kd.panji]) PANJI[kd.panji](ctx, o, g);
    if (kd.haluan && HALUAN[kd.haluan]) HALUAN[kd.haluan](ctx, o, g);
    if (kd.penghuni && PENGHUNI[kd.penghuni]) PENGHUNI[kd.penghuni](ctx, o, g);
  };
  // daftar rupa yang sudah punya gambar (Kedai menandai rupa lain "segera hadir")
  window.MTKD_RUPA = { lambung: Object.keys(HULL), jejak: Object.keys(JEJAK), meriam: Object.keys(MERIAM), kedatangan: Object.keys(DATANG), sakti: Object.keys(SAKTI), layar: Object.keys(SAIL), panji: Object.keys(PANJI), haluan: Object.keys(HALUAN), penghuni: Object.keys(PENGHUNI), aura: Object.keys(AURA), lambang: Object.keys(LAMBANG) };
  /* bola lava untuk Meriam Letusan (adegan tempur) */
  window.MTKD_FX = {
    myMeriam: function () { var k = window.state && state.shipVisual && state.shipVisual.kd; return !!(k && k.meriam === 'meriam_letusan'); },
    lavaBall: function (ctx, x, y, r) {
      var gl = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
      gl.addColorStop(0, 'rgba(255,170,60,.85)'); gl.addColorStop(0.4, 'rgba(255,90,20,.4)'); gl.addColorStop(1, 'rgba(255,60,10,0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gl; ctx.fillRect(x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4); ctx.restore();
      var bg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
      bg.addColorStop(0, '#fff2b0'); bg.addColorStop(0.5, '#ff9a2a'); bg.addColorStop(1, '#a82a0a');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.3); ctx.fill();
    }
  };
})();
