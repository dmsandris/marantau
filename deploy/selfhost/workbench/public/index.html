<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marantau Workbench</title>
<link rel="icon" href="data:,">
<link rel="preload" href="/fonts/familjen-grotesk-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/wb/wb.css">
</head>
<body>
<div id="app" class="shell">
  <header class="side" data-open="false">
    <div class="side-top">
      <a class="brand" href="#/mulai" aria-label="Marantau Workbench, ke Mulai">Workbench <span id="ver" class="ver"></span></a>
      <button id="menuBtn" type="button" class="btn btn--small menu-btn" aria-expanded="false" aria-controls="tabs">Menu</button>
    </div>
    <nav id="tabs" class="nav" aria-label="Menu utama">
      <a class="tab" href="#/mulai" data-tab="mulai">Mulai</a>
      <p class="nav-h">Kerja</p>
      <a class="tab" href="#/tugas" data-tab="tugas">Tugas <span class="tab-n" id="navTugas"></span></a>
      <p class="nav-h">Periksa langsung</p>
      <a class="tab" href="#/db" data-tab="db">Database</a>
      <a class="tab" href="#/repo" data-tab="repo">Repo</a>
      <a class="tab" href="#/server" data-tab="server">Server</a>
      <p class="nav-h">Atur</p>
      <a class="tab" href="#/tim" data-tab="tim">Tim</a>
      <a class="tab" href="#/dokumen" data-tab="dokumen">Dokumen</a>
      <a class="tab" href="#/pengaturan" data-tab="pengaturan">Pengaturan <span class="tab-n" id="navSet"></span></a>
      <p class="nav-h">Panel</p>
      <a class="tab" href="/">Kembali ke Marantau Ops</a>
    </nav>
    <div class="who"><span id="clock" class="num"></span></div>
  </header>
  <main class="page" id="main"><div class="skel"><i></i><i></i><i></i></div></main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/wb/wb.js"></script>
</body>
</html>
