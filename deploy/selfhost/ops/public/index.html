<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Marantau Ops</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<section id="login" class="login hidden">
  <form id="loginForm" class="card login-card" autocomplete="off">
    <h1>Marantau Ops</h1>
    <label>Sandi<input id="pw" type="password" autocomplete="current-password" required></label>
    <label>Kode 2FA<input id="code" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required></label>
    <button type="submit">Masuk</button>
    <p id="loginErr" class="err"></p>
  </form>
</section>

<main id="app" class="hidden">
  <header class="top">
    <div class="brand">Marantau Ops <span id="clock" class="muted"></span></div>
    <nav id="tabs">
      <button data-tab="server" class="on">Server</button>
      <button data-tab="layanan">Layanan</button>
      <button data-tab="db">Database</button>
      <button data-tab="backup">Backup</button>
    </nav>
    <button id="logout" class="ghost">Keluar</button>
  </header>

  <section data-panel="server">
    <div id="hostCards" class="cards"></div>
    <div class="row">
      <h2>Grafik</h2>
      <div class="seg" id="range">
        <button data-h="6">6 jam</button><button data-h="24" class="on">24 jam</button><button data-h="168">7 hari</button>
      </div>
    </div>
    <div id="charts" class="charts"></div>
    <h2>Lalu lintas API (24 jam)</h2>
    <div id="httpBox" class="card muted">Memuat…</div>
  </section>

  <section data-panel="layanan" class="hidden">
    <div id="svcList" class="list"></div>
    <div id="logBox" class="card hidden">
      <div class="row"><h2 id="logTitle">Log</h2><button id="logClose" class="ghost">Tutup</button></div>
      <pre id="logText"></pre>
    </div>
  </section>

  <section data-panel="db" class="hidden">
    <div id="dbCards" class="cards"></div>
    <h2>Endpoint paling lambat (rata-rata)</h2>
    <div id="dbSlow" class="card table-wrap"></div>
    <h2>Transaksi &gt; 10 dtk</h2>
    <div id="dbLong" class="card table-wrap"></div>
    <h2>Koneksi</h2>
    <div id="dbConns" class="card table-wrap"></div>
    <h2>Tabel terbesar (schema game)</h2>
    <div id="dbTables" class="card table-wrap"></div>
  </section>

  <section data-panel="backup" class="hidden">
    <div id="bkStatus" class="card"></div>
    <div id="bkFiles" class="card table-wrap"></div>
    <div class="card">
      <h2>Peringatan Telegram</h2>
      <p id="tgState" class="muted"></p>
      <button id="tgTest">Kirim pesan tes</button>
    </div>
  </section>
  <div id="toast" class="toast hidden"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
